ceği bildirilmiş ve **Gaybet-i Kübrâ** başlamıştır. Büyük gaybet dönemi İmâmiyye tarihinde Büveyhîler, Moğollar, Safevîler, Afşarlar ve Kaçarlar, Pehlevîler ve İslam Devrimi dönemleri olarak incelenir."}]},{"h":"Usûlü'd-Dîn ve Furûu'd-Dîn","b":[{"k":"p","x":"İmâmiyye'de dinin esasları ikiye ayrılır. **Usûlü'd-dîn** (inanç esasları) tevhid, adalet, nübüvvet, imamet ve meâd olmak üzere beştir; ric'at, bedâ' ve takiyye de bunlara bağlı inançlardır. **Furûu'd-dîn** (ameli esaslar) ise ibadet ve muamelattan oluşur."},{"k":"tbl","r":[["Furûu'd-dîn (ibadetler)","Kısa açıklama"],["Namaz","Günlük namazlar; öğle-ikindi ve akşam-yatsı cem edilebilir."],["Oruç","Ramazan orucu."],["Hac","Diğer Müslümanlarla esasta aynı."],["Zekât","Sünnî uygulamaya paraleldir."],["Humus","Kazancın beşte biri; imam ve seyyidler adına müctehidlere verilir."],["Cihad","İmamın izniyle yapılır."],["Emr-i bi'l-ma'rûf","İyiliği emretmek."],["Nehy-i ani'l-münker","Kötülükten sakındırmak."],["Tevellâ (velâye)","Ehl-i Beyt'i ve dostlarını sevmek."],["Teberrâ (berâe)","Ehl-i Beyt düşmanlarından uzak durmak."]]}]}],"ht":[{"s":14,"x":"Emevîlerin son dönemindeki Şiî isyanlar: Beyân-Muğîre (119/737), Ebû Mansûr el-İclî (Mansûriyye), Zeyd b. Ali (122/740) ve Abdullah b. Muâviye."},{"s":15,"x":"Dört sefir: Osman b. Saîd, Muhammed b. Osman, Hüseyin b. Rûh en-Nevbahtî, Ali b. Muhammed es-Simerî."},{"s":16,"x":"İmâmiyye'de usûlü'd-dîn beş (tevhid, adalet, nübüvvet, imamet, meâd), furûu'd-dîn on maddedir: namaz, oruç, hac, zekât, humus, cihad, emr-i bi'l-ma'rûf, nehy-i ani'l-münker, tevellâ, teberrâ."}],"oz":{"t":"Şîa ve İmâmiyye · Özet","intro":"Ünitenin özü: Şîa kimdir, nasıl doğdu ve mezhepleşti; İmâmiyye on iki imamı, gaybeti, inanç esaslarını ve fıkhını nasıl anlar?","s":[{"h":"Şîa: Ad, Doğuş ve Mezhepleşme","b":[{"k":"d","t":"Şîa","x":"Hz. Ali'nin Hz. Peygamber'den sonra açık bir nas ve tayinle imam olduğuna, imametin onun soyundan devam ettiğine inanan topluluk. Kelime \"taraftar, yardımcı\" anlamındadır."},{"k":"li","x":"**Diğer adlar:** **Râfıza** (Zeyd b. Ali'yi Ebû Bekir ve Ömer'den teberrî etmediği için terk edenler), **Sebeiyye** (İbn Sebe'ye nispet)."},{"k":"li","x":"**Doğuşu hakkındaki görüşler:** Hz. Peygamber zamanı (Şiî müellifler), Sakîfe ve ilk hilafet tartışmaları, Hz. Osman'a isyan, Cemel, Hz. Ali'nin şehadeti, **Kerbelâ** (61/680) ve Tevvâbûn, nas ve tayin akidesinin oluşumu. Kökeni Yahudi, Hristiyan, İran veya Arap kaynaklı sayan yaklaşımlar da vardır."},{"k":"li","x":"**Mezhepleşme:** Kerbelâ, **Tevvâbûn** hareketi ve **Muhtâr es-Sakafî** isyanı (Keysâniyye; mehdîlik, gaybet, ric'at, bedâ' fikirleri) Şîa'yı siyasi bir gruptan itikadî bir mezhebe dönüştürdü. Kurumsallaşma 80-120 hicrî yılları arasında gerçekleşti; Emevîlerin son döneminde Beyân-Muğîre, Ebû Mansûr el-İclî, Zeyd b. Ali ve Abdullah b. Muâviye isyanları yaşandı."},{"k":"li","x":"**Dayandığı ayetler:** Tathîr (Ahzâb 33/33), ikmâlü'd-dîn (Mâide 5/3), velâyet (Mâide 5/55), meveddet (Şûrâ 42/23) ve mübâhele ayetleri. **Hadisler:** Sakaleyn, Gadîr-i Hum (\"Ben kimin mevlâsı isem Ali de onun mevlâsıdır\"), yakın akrabaların uyarılması (inzâr)."}]},{"h":"İmâmiyye (İsnâaşeriyye)","b":[{"k":"li","x":"**Adları:** İmameti dinin temeli saydığı için **İmâmiyye**, on iki imama inandığı için **İsnâaşeriyye**, fıkhı Ca'fer es-Sâdık'a dayandığı için **Ca'feriyye**."},{"k":"li","x":"**On iki imam:** Ali, Hasan, Hüseyin, Ali Zeynelâbidîn, Muhammed el-Bâkır, Ca'fer es-Sâdık, Mûsâ el-Kâzım, Ali er-Rızâ, Muhammed et-Takī (Cevâd), Ali en-Nakī (Hâdî), Hasan el-Askerî, Muhammed el-Mehdî (Kāim)."},{"k":"li","x":"**Gaybet:** On ikinci imam 260/874'te gizlendi. **Gaybet-i suğrâ** (260-329/874-941) döneminde dört sefir (Osman b. Saîd, Muhammed b. Osman, Hüseyin b. Rûh, Ali b. Muhammed es-Simerî) aracılık etti; ardından **gaybet-i kübrâ** başladı ve devam etmektedir."},{"k":"li","x":"**Tarihçe:** Büveyhîler döneminde temel eserler yazıldı (Kuleynî, İbn Bâbeveyh, Şeyh Müfîd, Şerîf el-Murtazâ, Tûsî); İlhanlılar dönemi rahat geçti; **Safevîlerle** (1501) İran'da resmî mezhep oldu; Usûlî-Ahbârî tartışmasında Usûlîler galip geldi; 1979'da **velâyet-i fakîh** esasına dayanan İslam Cumhuriyeti kuruldu."}]},{"h":"Görüşleri","b":[{"k":"li","x":"**Usûlü'd-dîn:** tevhid, adalet, nübüvvet, imamet, meâd."},{"k":"li","x":"**İmamet:** Nas ile tayin, imamların **ismeti**, ilmi ve efdaliyeti; ilk üç halifenin imameti batıldır."},{"k":"li","x":"**Diğer inançlar:** **bedâ'** (Allah'ın bir hükmü değiştirmesi), **ric'at** (Mehdî ile bazı ölülerin dünyaya dönüşü), **takiyye**, **tevellâ ve teberrâ**."},{"k":"li","x":"**Kaynaklar:** Kur'an, sünnet (on dört masumun sözleri), icmâ ve akıl."},{"k":"li","x":"**Fıkıh:** Ezanda \"Eşhedü enne Aliyyen veliyyullah\" ve \"Hayye alâ hayri'l-amel\"; abdestte ayaklar meshedilir; **humus** (kazancın beşte biri) ve **mut'a** nikâhı caizdir; namazlar cem edilebilir."},{"k":"li","x":"**Ulema hiyerarşisi:** merci-i taklîd, âyetullah el-uzmâ, âyetullah, hüccetü'l-İslâm, şeyh-fakih, talebe."},{"k":"li","x":"**Günümüz:** İran, Irak, Azerbaycan, Bahreyn ve Lübnan'da yoğundur; Şiîlerin yaklaşık %80-85'ini oluşturur."}]}]}},{"t":"Zeydiyye","intro":"Zeyd b. Ali isyanı, Zeydiyye'nin doğuşu ve tarihi, imamet ve diğer görüşleri, fıkıh ve usulü, Sünnî mezheplerle benzerlik ve farklılıkları, günümüzdeki durumu.","s":[{"h":"İsimlendirme Meselesi","b":[{"k":"p","x":"**1. İsimlendirme Meselesi:** Mezhebin kurucusu kabul edilen **Zeyd b. Ali** 'ye nispetle Zeydiyye adıyla bilinir. Zeyd b. Ali b. el-Hüseyin b. Ali'yi (80/699-122/740) ve onun ölümünden sonra oğlu Yahya’yı (125/743) imam olarak kabul edenlerin ortak adıdır. İmam Zeyd, Hz. Hüseyin'in şahadetinden sonra Emevîlere karşı Ehl-i Beyt adına ayaklanan ilk şahıştır. Babası, Hz. Hüseyin'in oğlu **Ali Zeynelabidin** 'dir. Başlangıçta tamamen siyasi hedefleri gerçekleştirmek üzere ortaya çıkmış, zamanla itikadî bir mahiyet kazanmıştır. Şiî fırkalar arasında en mutedilidir."}]},{"h":"Zeydiyye'nin Doğuşu ve Tarihçesi","b":[{"k":"li","x":"Kerbela hadisesinden sonra Ali oğulları Emevilere karşı sessiz kaldılar. Tevvabûn ve Muhtar es-Sakasi hareketlerinin ise Ali oğulları ile doğrudan bir ilişkisinin bulunmadığı kabul edilmektedir. Ali oğulları, başından beri iktidar için hevesli olmuş, ancak Ali b. Ebi Talib'in sıkıntılı geçen halifeliği dışında hiç bir zaman merkezi otoriteyi ele geçirememişlerdir. Bu noktada siyasi bir hareket olarak ortaya çıkan Zeydiliğin, Emevîlere karşı duyulan hoşnutsuzluk ortamında Ali oğullarının iktidar beklentilerine bir cevap niteliği taşıdığını söylememiz mümkündür."},{"k":"li","x":"Ehl-i Beyt mensupları arasında İmam Zeyd, bilgisi, feraseti ve fakihliği ile tanınan, cesareti ile bilinen bir kimse idi. Medine'de 80/699 yılında doğmuştur. Vâsıl b. Ata'dan ders almış Ebû Hanife'ye hocalık yapmıştır. Ehl-i Beyt mensupları gibi o da Emevîlerin kötü idaresinden ve Haşimilere uygulanan baskı ve zulümlerden şikayetçi idi. Nitekim onun isyanı da böyle bir zeminde gerçekleşmiştir. Zeyd, Hz. Ali'nin vakıflarının idaresinden doğan bazı sorunların çözümü için halife Hişam b. Abdülmelik'e müracaat etmiş, ancak halifeden gerekli hürmeti göremediği gibi, hakarete de maruz kalmıştı. Bundan sonra Zeyd, Kûfe'ye geçer ve isyan için nabız yoklar. Kardeşi Ebû Cafer Muhammed el-Bakır'la istişare eder. O kendisine Kûfelilere güvenilemeyeceğini söylerse de onu dinlemez. Kufe'de kendisine biat eden on beş bin kişi ile Kûfe-Basra (Irakeyn] valisi Yûsuf b. Ömer es-Sakafi'ye karşı ayaklanır. Savaş devam ederken, Zeyd'in taraftarları, Zeyd'e, \"Gerçek şu ki biz düşmanlarına karşı sana, ecdadın Ali b. Ebi Talib'e haksızlık eden Ebû Bekir ve Ömer hakkındaki görüşünü söyledikten sonra yardım edeceğiz.\" derler. Bunun üzerine Zeyd, “ Bu ikisi hakkında iyilikten başka bir şey söyleyemem...\" der. Bu cevap üzerine onlar, Zeyd'i terk ederler. O da onlara, “ Beni bırakıp kaçtınız, terk ettiniz anlamında “rafaztumûni\" der. Bu olaylar Zeydiyye'nin \"hilafet için gerekli vasıflara sahip biri varken daha az faziletli birisinin lider olması mümkündür\" fikrinin ortaya çıkmasına zemin hazırlamıştır."},{"k":"li","x":"Taraftarlarından büyük bir kısmının yanından ayrılmasına rağmen Zeyd mücadelesine devam etmiş, fakat savaş meydanında 26 Muharrem'de (122/740) öldürülmüştür. Taraftarlarınca cesedi gizlice defnedilmiş, ancak Hişam'ın Irakeyn valisi Yusuf'un adamları tarafından kabri bulunmuş; cesedi çıkarılıp yakılmıştır."},{"k":"li","x":"Daha sonra Zeydî hareketin oğlu **Yahya b. Zeyd** (98-125/716 743) tarafından Horasan bölgesine taşındığı görülmektedir. Faaliyetlerine burada devam eden Yahya, Emevîlerle birkaç kez savaşmış, sonunda 125/743 yılında öldürülmüştür."},{"k":"li","x":"Abbasîler döneminde de Ali oğullarına baskı ve şiddet artmış, özellikle Halife Mansur, kendisine biat etmeyen **Hasan oğulları** nı hedef almıştı. İşte bu dönemde Hasan oğullarına yapılan baskılara dayanamayarak Medine'de Muhammed b. Abdullah (**Nefsü'z-Zekiyye**) ve Basra'da da kardeşi İbrahim isyan etmiş, kısmi bir başarıdan sonra beş ay gibi bir zamanda hareketleri şiddetle bastırılmıştı."},{"k":"li","x":"Abbasîler döneminde uzunca bir süre dağınık hâlde kalan Zeydîler faaliyetlerini nüfuz boşluğu olan bölgelere kaydırmışlardır. Ayrıca Abbasî halifelerinin siyasi otoritelerinin zayıflamasından da istifade ederek kuzeyde Taberistan, güneyde de Yemen'de yeniden ayaklanmışlar ve iki aynı devlet kurmayı başarmışlardır. Taberistan bölgesinde Hasan b. Zeyd (ö. 270/884), iki yıllık mücadelesi neticesinde bölgenin tamamını kontrolü altına alarak burada ilk Zeydî hâkimiyetini tesis etmiştir (250/864). **Dai el-Kebir** olarak bilinen Hasan b. Zeyd yirmi yıl kadar iktidarı elinde tuttuktan sonra 270/884 yılında ölmüştür. Bu şahıs, ezana \" **Hayye ale hayri’l-a mel\"** lafzını dâhil etmek gibi fikhî konularda yeni bazı uygulamalar başlatmıştır. Kendisinden sonra kardeşi Muhammed b. Zeyd (ö. 287/900)'den sonra Zeydî hâkimiyeti zayıflamış ve idare bir süre için Samanoğullarının eline geçmiştir. en-Nasır li'l-Hak (el-Utruş) 301/914 yeniden Taberistan'da Zeydî hâkimiyetini tesis etmiştir, Onun ölümünden sonra Büveyhoğullan Zeydî hâkimiyetine son vermiştir."},{"k":"li","x":"Güneyde Yemen Zeydîliği, dönem dönem etkinliğini artırmakla birlikte varlığını günümüze kadar devam ettirebilmiştir. **Kasım b. İbrahim er-Ressi** (246/680) ve Hâdî ile'l-Hak olarak bilinen torunu **Yahya b. Hüseyin b. Kasım er-Ressi** zamanında Yemen Zeydiliği önemli gelişmeler göstermiştir. Emevi ve Abbasîlerden sonra bölgenin idaresi Eyyubiler, daha sonra Tahiriler, Memluklular ve ardından da Osmanlıların eline geçmiştir. **Osmanlılar**, 945/1538 yılından 1006/1597 yılına kadar Yemen'deki hakimiyetini devam ettirmiştir. **İmam Mansur-billah Kasım b. Muhammed**, 1006/1597 yılından itibaren başlattığı faaliyetlerle Yemende Zeydî-Kasımî bir devlet kurmuştur. 1848 yılında Osmanlıların tekrar bölgeye girişine kadar hakimiyetleri devam etmiştir. Zeydiliğin bugün devam eden en önemli kolu Yemen'in resmî mezhebi durumundaki **Kasımiyye'** dir."}]},{"h":"Görüşleri","b":[{"k":"p","x":" Zeydiyye, görüşleriyle Şiî mezhepler arasında en mutedil ve Ehl-i Sünnet'e en yakın olanıdır.  Bazı tarihçiler, Zeydiyye'yi ilk üç halifeyi kabullerinden dolayı Şia'nın dışında saymışlardır.  Görüşlerinin önemli bir kısmı Mu'tezile ile örtüşmektedir. \"el-Menzile” dışında."},{"k":"p","x":" İmamet ve büyük günah işleyenler hakkındaki görüşleri onları Şia ve Mu'tezile'den ayırır."},{"k":"h","x":"a. İmametle Alakalı Görüşleri"},{"k":"p","x":"**1.** İmamette nass ile tayin ya da vasilik söz konusu değildir. Ayrıca bir önceki imam bir sonrakini de belirlemiş değildir. Ancak imamın sahip olması gereken özellikler bildirilmiştir. Buna göre Hz. Ali Hz. Peygamber'den sonra imamete en layık kişidir."},{"k":"p","x":"**2.** İmam olabilmek için en gerekli özellik **faziletli olmaktır**. Bunun da ölçüsü takva ve ilimdir. İlim ise, Hz. Peygamber'den Hz. Ali yoluyla alınmış vehbi olmayan kesbi bir bilgidir. İmam insanları yönetecek ve içtihat edecek kadar dinî ve hukuki bilgiye sahip olmalıdır."},{"k":"p","x":"**3.** İmamın sadece Kureyşî olması yeterli değildir, aynı zamanda Haşimî ve Fatimi de olmalıdır. Bu görüşle imametin Muhammed b. el-Hanefiyye'ye ve evladına geçmesinin önüne geçilmiştir. Bununla birlikte, imamiyyenin hilafına Hz. Hasan soyundan gelenlerin imametini kabul ederler."},{"k":"p","x":"**4.** İmam olacak kişinin imametini açıktan ilan etmesi gerekir. Buna göre imam, insanlar arasında yaşayan, dini hükümleri uygulayan ve onlara rehberlik eden birisi olmalıdır."},{"k":"p","x":"**5.** İmamette \"efdal\"in bulunduğu zemin ve zamanda “mefdül'ün imameti de geçerlidir. İmam Zeyd'in bu mutedil görüşleri, Müslüman bilginlerce makul karşılanmış ve gönülleri onunla birlik olmuştur. Mesela, İmam Azam, Emevîler'e karşı baş kaldırdığında İmam Zeyd'i desteklemiştir."},{"k":"p","x":"**6.** İmamın \"ismet” sıfatı yoktur. İmam, en küçük şüpheli şeylerden dahi kaçınmalı, dine uyma konusunda fevkalade hassas olmalıdır. Bu bakımdan o, büyük babası Hz. Ali'nin Cemel ve Sıffin'deki savaşlarda haklı mı, haksız mı olduğunun kesinlikle bilinemeyeceğini, ama iki taraftan birinin muhakkak haksız olduğunu söylemiştir."},{"k":"p","x":"**7.** İmamlık vasıflarını taşıyan Hasan veya Hüseyin'in oğullarından herhangi birinin, imametini açıkça ilan ederek halkı kendisine davet etmesi ve gerekiyorsa bu yolda zalim idareciye karşı çıkması icap eder."},{"k":"p","x":"**b. İman-Amel İlişkisi:** Zeydiyye'ye göre büyük günah işleyen kimse tövbe etmedikçe temelli cehennemde kalacaktır. Büyük günahlar imanı yok ettiği için, büyük günah işleyen kimse mümin olarak kalamaz. Zeydiyye Mu'tezile gibi ameli imandan sayar."},{"k":"p","x":"Fıkhi meselelerde genellikle Hanefi mezhebine daha yakındırlar. İmamiyye'den farklı olarak mestler üzerine meshetmeyi, adil veya zalim olsun herkesin arkasında namaz kılmayı, Ehl-i Kitab'ın kestiğini yemeyi caiz görmüşler, müta nikahını haram saymışlardır."},{"k":"p","x":"**4. Günümüzde Zeydiyye:** 1904 yılında babasının vefatıyla imamet makamına gelen Yahya, Osmanlı Devletine karşı cihat ilan ederek yeni bir mücadele başlatır. **İmam Yahya** Batılılar tarafından desteklenir. Birinci Dünya Savaşı döneminde Osmanlı Yemen'e gerekli takviyeleri yapamadığından 1918 yılında Yemen'i terk etmek zorunda kalır. İmam Yahya, 1948 yılındaki ölümüne kadar 44 yıl Yemen'de Zeydî hâkimiyetini sürdürmüştür. 1962 yılında Muhammed Bedr, askeri bir darbeyle uzaklaştırılarak Zeydîlerin iktidarına son vermiştir. Zeydiyye iktidarda olmamakla birlikte ülke nüfusunun yaklaşık %45'ini oluşturmaktadır. Yemen'in dışında Ürdün başta olmak üzere diğer Arap ülkelerin de, Amerika ve Almanya gibi bazı Batılı ülkelerde de Zeydilerin yaşadığı bilinmektedir. Yemen'in geri kalan nüfusunu genellikle Şafii mezhebine mensup olanlar oluşturmaktadır. Her iki topluluk da aynı camide aynı imamın arkasında namaz kılabilmektedir."}]},{"h":"Zeydiyye Mezhebi: Tarihçesi, Görüşleri ve Günümüzdeki Durumu","b":[{"k":"p","x":"Zeydiyye, İslam mezhepleri arasında Şiî fırkalar içerisinde mutedili ve bazı görüşleri itibarıyla Ehl-i Sünnet'e en yakın olanıdır. Bu mezhep, kurucusu kabul edilen **Zeyd b. Ali b. el-Hüseyin'e** (ö. 122/740) nispetle bu adı almıştır. İmam Zeyd, Ehl-i Beyt mensubu olarak Emevî yönetimine karşı çıkmış ve 122/740 yılında Kûfe'de bir isyan başlatmıştır. Bu isyanın temel sebepleri şunlardır:"},{"k":"li","x":"**Emevîlerin baskıcı politikaları** ve Haşimî ailesine yönelik zulümler."},{"k":"li","x":"**Ekonomik sebepler:** Hz. Ali'nin vakıflarının yönetimi konusunda halife Hişâm b. Abdülmelik ile yaşanan anlaşmazlık."},{"k":"li","x":"**Siyasi meşruiyet arayışı:** Zeyd, Ehl-i Beyt'in haklarını savunarak meşru bir yönetim kurmayı hedeflemiştir."}]},{"h":"Zeydiyye'nin Ortaya Çıkışı ve Tarihsel Gelişimi","b":[{"k":"p","x":"Zeydiyye fırkası başlangıçta siyasi hedefleri gerçekleştirmek üzere ortaya çıkmış, zamanla itikadî bir nitelik kazanmıştır. Kerbela hadisesinden sonra Ali oğullarının Emevîlere karşı sessiz kaldığı bir dönemde, Zeyd b. Ali'nin isyanı (122/740) bir dönüm noktası olmuştur. Bu isyanın temelinde, Emevî-Haşimî çekişmesi ve Emevîlerin siyasi ve sosyo-kültürel politikaları yer almaktadır. **İmam Zeyd,** Emevî halifesi **Hişâm b. Abdülmelik** ile yaşadığı sorunlar ve gördüğü hakaretler üzerine isyan kararı almış, Kûfe'de biat toplamıştır. Ancak, taraftarlarının Ebû Bekir ve Ömer hakkındaki görüşlerini sorması ve Zeyd'in bu halifeler hakkında olumlu konuşması üzerine büyük bir kısmı kendisini terk etmiş, bu grup \"Rafızî\" olarak isimlendirilmiştir. Şii kaynaklarına göre Zeyd, savaş meydanında öldürülmüş ve cesedi yakılmıştır. Fakat sünnî kaynaklarına göre Zeynelabîdîn, hastalıktan vefat edip bakî‘ mezarlığına defnedilmiştir."},{"k":"p","x":"Zeyd b. Ali'nin ölümünden sonra Zeydî hareket, oğlu Yahya b. Zeyd tarafından Horasan bölgesine taşınmış ve burada faaliyetlerine devam etmiştir. Yahya da 125/743 yılında öldürülmüştür. Bu faaliyetler, Ehl-i Beyt sevgisinin bölgede yayılmasına vesile olmuştur. Zeyd'in ölümünden sonra geriye kalanlar **Cârûdiyye, Süleymâniyye** ve **Betriyye** gibi kollara ayrılmıştır."},{"k":"p","x":"Zeydîler, Abbâsîler döneminde Taberistan ve Yemen'de iki ayrı devlet kurmayı başarmışlardır. **Taberistan'da** ilk Zeydî hâkimiyeti **Hasan b. Zeyd** tarafından 250/864 yılında tesis edilmiş, bu hâkimiyet **Büveyhîler** tarafından 316/928 yılında sonlandırılmıştır. **Yemen Zeydî hakimiyeti** ise 280 (893) yılında **Hâdî-İlelhak Yahyâ b. Hüseyin** tarafından kurulmuştur. Yahyâ, Zeydiyye'nin en önemli temsilcilerinden biri kabul edilir ve Yemen Zeydîleri ona nispetle **Hâdeviyye** olarak da adlandırılmış, önemli gelişmeler göstermiş ve varlığını günümüze kadar sürdürmüştür. Özellikle **İmam Mansur-billah Kasım b. Muhammed'in** 1006/1597 yılında başlattığı faaliyetler sonucunda Yemen'de Zeydî-Kâsımî bir devlet kurulmuştur. Osmanlıların bölgedeki hâkimiyetinin ardından, 1904 yılında İmam Yahya'nın cihat ilanı ve Batılı devletlerin desteğiyle Zeydî hâkimiyeti 1948 yılına kadar devam etmiştir. 1962 yılında Muhammed Bedr'in askeri darbesiyle Zeydîlerin iktidarına son verilmiştir. Zeydiyye, **Kāsım b. İbrâhim er-Ressî** (ö. 246/860) döneminde itikadî bir mezhep halini almıştır. Ressî, **\"el-Usûlü'l-hamse\"** adlı risalesinde mezhep esaslarını Mu'tezile'ye benzer şekilde tasnif ederek **aklı ön plana çıkarmıştır.** Onun bu konumu nedeniyle sonra gelen Zeydîler, **Kāsımiyye** olarak anılmıştır."}]},{"h":"Zeydiyye'nin Temel Görüşleri","b":[{"k":"p","x":"Zeydiyye'nin görüşleri, Mu'tezile ile önemli ölçüde örtüşmekle birlikte, imamet ve büyük günah işleyenler hakkındaki yaklaşımları onları diğer Şiî fırkalardan ayırır. Zeydiyye'nin imametle ilgili görüşleri şunlardır:"},{"k":"li","x":"**Nass ile Tayin Reddi:** İmamette nass ile tayin veya vasilik söz konusu değildir. Hz. Peygamber'in isim vererek bir imam tayin etmediği kabul edilir."},{"k":"li","x":"**Fazilet Esası:** İmam olabilmek için en gerekli özellik faziletli olmak, yani takva ve ilim sahibi olmaktır. İmamın gizli veya beklenen bir şahsiyet olmaması, aksine dini hükümleri uygulayan ve insanlara rehberlik eden yaşayan bir kişi olması gerektiği vurgulanır."},{"k":"li","x":"**İmametin Haşimî ve Fatımî Olması:** İmamın sadece Kureyşî olması yeterli değildir; aynı zamanda Haşimî ve Fatımî soyundan gelmesi gerekir. Hz. Hasan soyundan gelenlerin imameti de kabul edilir."},{"k":"li","x":"**Açık İlan (Zuhur):** İmam olacak kişinin imametini açıktan ilan etmesi ve gerekiyorsa zalim idareciye karşı çıkması icap eder."},{"k":"li","x":"**Efdal ve Mefdûl Prensibi:** Zeyd b. Ali'ye göre, en faziletli (efdal) kişi varken, dünyevi maslahat ve fitneyi bertaraf etmek amacıyla daha az faziletli (mefdûl) birinin imam olması mümkündür. Bu nedenle Ebû Bekir ve Ömer'in hilafetleri meşru kabul edilir ve onlar gâsıp olarak görülmez."},{"k":"li","x":"**İsmet Sıfatının Reddi:** İmamların \"ismet\" (günahlardan korunmuşluk) sıfatı yoktur; ismet yalnızca peygamberlere özgüdür."},{"k":"p","x":"**İman-Amel İlişkisi:** Zeydiyye, amelleri imanın bir parçası sayar ve büyük günah işleyen kimsenin tam anlamıyla tövbe etmedikçe cehennemde kalacağını savunur. Bu yönüyle Mu'tezile'ye benzerler."},{"k":"p","x":"**Fıkhî Görüşler:** Zeydîler, fıkhî meselelerde genellikle Ehl-i Sünnet'in Hanefiyye mezhebine yakın uygulamaları benimserler. Mestler üzerine meshetmeyi, adil veya zalim olsun herkesin arkasında namaz kılmayı, Ehl-i Kitab'ın kestiğini yemeyi caiz görürlerken, müt'a nikahını haram saymışlardır."}]},{"h":"Günümüzde Zeydiyye","b":[{"k":"p","x":"Günümüzde Zeydiyye, Yemen nüfusunun yaklaşık %45'ini oluşturarak ülkenin önemli bir mezhebi konumundadır. Yemen'in dışında Ürdün, diğer Arap ülkeleri, Amerika ve Almanya gibi Batılı ülkelerde de Zeydîlerin yaşadığı bilinmektedir. Yemen'de Şâfiîler ile Zeydîler arasında hukuki açıdan herhangi bir çatışma bulunmamaktadır; her iki topluluk da aynı camide aynı imamın arkasında namaz kılabilmektedir."}]},{"h":"Zeydî Fıkhının Tarihsel Gelişimi","b":[{"k":"p","x":"Zeydî fıkhının tarihi, modern dönem öncesi süreçler itibarıyla beş merhaleye ayrılır:"},{"k":"n","n":1,"x":"**Oluşum Süreci (Cem' ve Te'lîf Merhalesi - II-III. yüzyıllar):** Bu dönemde Zeydiyye, Kûfe merkezli siyasi bir hareket olup, müstakil bir fıkıh sisteminden ziyade çeşitli fıkhî görüş ve eğilimlerden söz edilebilir. Zeyd b. Ali'nin kendisi de siyasi faaliyetleri ve genç yaşta vefatı sebebiyle uzun süreli bir fıkıh eğitimi ve fetva faaliyetinde bulunamamıştır. Zeydiyye kimliği, Zeyd'in vefatından sonraki bir asırlık süreçte gelişmiştir. Bu dönemde **Muhammed en-Nefsüzzekiyye** ve **Hasan b. Sâlih b. Hayy** gibi isimler ön plana çıkmıştır. Kûfe ve Medine'nin yanı sıra Yemen ve Taberistan'da da fıkhî faaliyetler çoğalmış, **Kāsım b. İbrâhim er-Ressî, Hâdî-İlelhak Yahyâ b. Hüseyin ve Hasan b. Yahyâ** gibi fakihler önemli eserler telif etmişlerdir."},{"k":"n","n":2,"x":"**Mezhebin Klasik Dönemi (Tahrîc ve Tahsîl Merhalesi - IV-VII. yüzyıllar):** Bu dönemde önceki imamların görüşleri toplanıp düzenlenmiş, delillendirilmiş ve şerh edilmiştir. Zeydîlik, başlangıçtaki siyasi ve itikadî birliğin ötesine geçerek **Kāsımiyye, Nâsıriyye ve Hâdeviyye** adlarıyla üç fıkhî kola ayrılmıştır."},{"k":"li","x":"**Kāsımiyye:** Kāsım b. İbrâhim er-Ressî'nin içtihatları etrafında toplanmıştır. Akılcı yöntemiyle Mu'tezile'ye benzerlik gösterir."},{"k":"li","x":"**Nâsıriyye:** Nâsır-Lilhak Hasan el-Utrûş'a nispet edilir. Irak ve Hazar bölgesinde yayılmıştır."},{"k":"li","x":"**Hâdeviyye:** Yemen'de Zeydîliği yayan ve yerleştiren Hâdî-İlelhak Yahyâ b. Hüseyin'e nispet edilir. Günümüze kadar varlığını sürdüren ana kol olmuştur. Hâdî-İlelhak'ın birçok içtihadı, İmam Zeyd'den farklılık göstermiştir."},{"k":"n","n":3,"x":"**Müteahhir Dönem (Müzâkirîn ve Takrîr Merhalesi - VIII-XI. yüzyıllar):** Bu dönemde Taberistan'daki Zeydî varlığı zayıflarken, Yemen Zeydîliği ana kütleyi oluşturmuş ve önemli usul ve fürû eserleri yazılmıştır. **İbnü'l-Murtazâ'nın** eserleri etrafında bir şerh geleneği oluşmuş, **İbnü'l-Vezîr** ise içtihadı savunan ve hadise yönelen yeni bir çizgi başlatmıştır."},{"k":"n","n":4,"x":"**Modern Dönem:** Yemen'de klasik Zeydî-Mu'tezilî anlayışa bağlı ve ehl-i hadis çizgisine yakın iki geleneğin varlığı devam etmektedir. **Şevkânî** gibi alimler, farklı yaklaşımlarıyla Zeydîlik içinde tartışma konusu olmuştur. Günümüzde Zeydî fıkhı, üniversitelerde de okutulmakta ve uluslararası ilgi görmektedir."}]},{"h":"Fıkıh Usulü ve Şer‘î Deliller","b":[{"k":"p","x":"Zeydî usul anlayışı tarihinde dört temel evreden geçmiştir: kurucu asır, kelâm tesirindeki dönem, klasik tasnif dönemi ve çağdaş dönem. Bu evrelerde şer‘î delillerin sıralaması ve adlandırılması konusunda farklılıklar gözlemlenmiştir."}]},{"h":"Temel Şer‘î Deliller","b":[{"k":"n","n":1,"x":"**Kitap (Kur'an):** Zeydî usulünde ilk delil ve kaynaktır. Kur'an'ın günümüze eksiksiz ulaştığına ve tevatür şartı arandığına inanılır. Kıraat-i seb'a dışındaki kıraatler şaz olsa da amel edilebilir. Kur'an lafızları mütekellimîn usulcüleriyle benzer şekilde mantuk- mefhum, hakikat-mecaz gibi başlıklarda incelenir."},{"k":"n","n":2,"x":"**Sünnet:** Hz. Peygamber'in söz, davranış ve takrirleri olarak tanımlanır. Haberler mütevâtir, âhâd ve genel kabul görmüş haber şeklinde üçe ayrılır. Mütevâtir haber kesin delil iken, âhâd haberler sadece amelî konularda hüküm vermek için kullanılır. Rivayetlerin kabulü için râvinin adalet ve zabt sahibi olması, haberin kesin delile muhalefet etmemesi gibi şartlar aranır. Zeydîler, sünnetin Kur'an'ı teyit, açıklama, kayıt ve tahsis etme fonksiyonlarını kabul ederken, bazıları sünnetin Kur'an'a ilave hükümler getirebileceğini veya neshedebileceğini savunur."},{"k":"n","n":3,"x":"**İcmâ-ı Ümmet ve İcmâ-ı Ehl-i Beyt:** Zeydî usulcüleri icmâın şer‘î delil oluşunda hemfikirdir. Çoğunluk, icmâın bilfiil vuku bulduğunu kabul eder. Sahabe dönemi dışında da icmâın aklen mümkün olduğu görüşü yaygındır. Zeydîler, Ehl-i Sünnet'ten farklı olarak **Ehl-i Beyt icmâının (icmâ-ı ıtrat)** da delil olduğu görüşündedirler. Ehl-i Beyt icmâı, Hz. Ali, Fatıma, Hasan, Hüseyin ve onların evlatlarından meydana gelen icmâı ifade eder."},{"k":"n","n":4,"x":"**Hz. Ali'nin İçtihatları ve Sahâbî Kavli:** Zeydîlerin çoğu Hz. Ali'yi masum kabul eder ve sözlerini âhâd hadis mertebesinde zannî delil sayar. Hz. Ali'nin içtihatlarının diğer sahâbîlerin görüşlerine tercih edileceği veya mutlak hüccet olduğu yönünde farklı görüşler bulunur. Ancak Zeydîler, sonraki Ehl-i Beyt imamlarının masum olamayacağını kabul ederler. Zeydî usulcülerin çoğu, Hz. Ali dışında hiçbir sahâbî görüşünü bağlayıcı kabul etmez. Sahabeye sövmeyi veya ta'netmeyi küfür sayarlar."},{"k":"n","n":5,"x":"**Kıyas:** Zeydî usulünde ittifakla kabul gören delillerden biridir. Kıyasın tanımı ve yaklaşım mütekellimîn usulcüleriyle benzerlik gösterir. Kıyasla âhâd haberin çelişmesi durumunda farklı tercihler söz konusudur."},{"k":"n","n":6,"x":"**Diğer Deliller (İstihsan, İstishâb, Şer‘u Men Kablenâ, Maslahat-ı Mürsele):** Zeydî eserlerinde bu deliller de ele alınmıştır."},{"k":"li","x":"**İstihsan:** Hanefîlere yakın tanımlanır ve fiilen başvurulmuş olsa da terim olarak fürû kaynaklarında pek rastlanmaz."},{"k":"li","x":"**İstishâb:** Nâtık-Bilhak'tan itibaren görülmekle birlikte delil oluşu tartışmalıdır. Hem amel edilebilir hem de amel edilemez türleri bulunur."},{"k":"li","x":"**Şer‘u Men Kablenâ:** Geçmiş ümmetlere ait hükümlerin Kitap ve Sünnet'te nakledilmesi, neshedilmemesi ve belli bir duruma has olmaması şartıyla delil olarak kabul edilir."},{"k":"li","x":"**Maslahat-ı Mürsele:** Müstakil bir delil olarak değil, kıyas konusu içerisinde yer alır. Uygulamada maslahat-ı mürseleye göre hüküm verilmiştir. Makāsıdü'ş-şerîa konusu da incelenerek nasların maksatları zarûriyyât, hâciyyât ve tahsîniyyât şeklinde üç kısma ayrılmıştır."},{"k":"n","n":7,"x":"**Akıl:** Zeydî usulünde sıkça vurgulanan ve bazen şer‘î deliller arasında yer verilen bir kavramdır. III. yüzyılda Kāsım er-Ressî'nin eserlerinde kitap, sünnet ve icmâın önünde zikredilmiş, sonraki dönemlerde ictihad kavramının içinde ele alınmıştır. Müteahhir dönem usulcüleri, diğer deliller bulunmadığında akıl deliliyle, yani hüsn ve kubhun gereğiyle amel edileceğini belirtmişlerdir. Akıl, kesinlik ifade eden önermeleriyle içtihat ilminde temel ilke sayılmış ve Kitap ve Sünnet'ten önce geldiği ileri sürülmüştür."}]},{"h":"Sünni Mezheplerle Benzerlikler ve Farklılıklar","b":[{"k":"p","x":"Zeydiyye fıkhının **Hanefî mezhebine yakın** olduğu yönünde genel bir kanı olsa da, aslında hem usul hem de fürû açısından **müstakil bir mezheptir.** Bazı durumlarda Hanefî, Mâlikî, Hanbelî veya Şâfiî mezheplerine benzeyen hükümler barındırırken, bazen de bu mezheplerin hiçbirinde görülmeyen kendine özgü hükümlere sahiptir."}]},{"h":"Örneklerle Farklılıklar ve Benzerlikler","b":[{"k":"h5","x":"Abdest"},{"k":"li","x":"**Hanbelîler'e benzer:** Besmele çekmek ve kulakları meshetmek farzdır."},{"k":"li","x":"**Mâlikîler'e benzer:** Başın tamamını meshetmek farzdır."},{"k":"li","x":"**Şâfiîler'e benzer:** Organlar arası sıralamaya (tertip) riayet etmek farzdır."},{"k":"li","x":"**Hanefîler'e benzer:** Kan akması ve namazda kahkaha atmak abdesti bozar."},{"k":"li","x":"**Kendine özgü farklılık:** Kasten yalan söylemek, koğuculuk ve gıybet gibi **büyük günahlar işlemek de abdesti bozar.**"},{"k":"h5","x":"Namaz"},{"k":"li","x":"Hanefîler dışındaki üç mezhepte olduğu gibi **ihtiyarî vakitler ve zaruret vakitleri** ayrımı bulunur."},{"k":"li","x":"Çeşitli sebeplerle yolculuk dışında da **namazları cemetmeye (cem') cevaz** verilir."},{"k":"li","x":"Ezana **\"Hayye alâ hayri’l-amel\"** ibaresi eklenir."},{"k":"li","x":"Sabah ve vitir namazlarında **Kunut duası** okunması sünnettir."},{"k":"li","x":"Seferde dört rekâtlık namazları iki rekât kılmak **vâciptir.**"},{"k":"li","x":"Teravih namazının kılınması sünnet olmakla birlikte **cemaatle kılınması bid'attır.**"},{"k":"h5","x":"Oruç"},{"k":"li","x":"Orucu kasten bozma durumunda **kazası gerekir.**"},{"k":"li","x":"İki ay kefâret orucu tutmak **vâcip olmayıp menduptur.**"},{"k":"li","x":"İtikafın en azı bir gündür ve bu günde **oruç tutmak şarttır.**"},{"k":"h5","x":"Evlilik"},{"k":"li","x":"Evlenecek kişilerin **rızası, kızın velisinin izni ve iki şahit** gereklidir."},{"k":"li","x":"**Müt'a nikâhı caiz değildir.**"},{"k":"h5","x":"Malî Muameleler"},{"k":"li","x":"**Hanefî fıkhına benzer:** Butlan ve fesat ayrımı yapılması, mevkuf akdin tanınması, tayin ve görme muhayyerliklerine cevaz verilmesi, riba illetinin cins birliği ve tartılabilirlik/ölçülebilirlik oluşu, kabul edilen şirket türleri gibi birçok yönden benzerlik gösterir."},{"k":"h5","x":"Miras Hukuku"},{"k":"li","x":"**Hanefî fıkhına benzer:** Zevi'l-erhâm ve mevle'l-muvâlât mirasçılar arasında kabul edilir."},{"k":"h5","x":"Ceza Hukuku"},{"k":"li","x":"Diğer mezheplerden önemli bir farklılık yoktur. Hırsızlıkta nisap miktarı Hanefîler'deki gibi **10 dirhem** olarak belirlenmiştir."},{"k":"h5","x":"Devlet Yönetimi"},{"k":"li","x":"En önemli hususiyet, devlet başkanının **Hz. Ali soyundan gelmesi gerektiğidir.** Eğer öncesinde böyle biri yoksa, adil ve insanları kendisine davet eden **Ehl-i Beyt'ten bir kişinin doğrudan halife olması** yönündedir."}]},{"h":"Kavramlar ve Hızlı Tekrar","b":[{"k":"d","t":"Râfıza","x":"Zeyd b. Ali'yi Ebû Bekir ve Ömer'den teberrî etmediği için terk edenlere verilen ad."},{"k":"d","t":"Mefdûlün imameti","x":"Efdal olan varken daha az faziletli kişinin imam olabilmesi; Zeydiyye bu sayede ilk iki halifenin imametini kabul eder."},{"k":"d","t":"Huruç","x":"İmamlık iddiasındaki kişinin imametini açıkça ilan edip zalim yönetime karşı çıkması."},{"k":"d","t":"Hâdeviyye","x":"Yemen'de Hâdî İle'l-Hak Yahyâ b. Hüseyin'e nispet edilen ve günümüze ulaşan Zeydî fıkıh kolu."}]}],"ht":[{"s":12,"x":"Zeydiyye, Zeyd b. Ali'nin 122/740'taki Kûfe isyanıyla doğdu; Şiî fırkaların en mutedili ve Ehl-i Sünnet'e en yakın olanıdır."},{"s":12,"x":"Zeydîlere göre imamette nas yoktur; imam faziletli, Fâtımî soyundan olmalı ve imametini açıkça ilan etmelidir; imamlar masum değildir."},{"s":12,"x":"Zeydî devletleri Taberistan ve Yemen'de kuruldu; bugün Yemen nüfusunun yaklaşık %45'i Zeydîdir."},{"s":12,"x":"Zeydî fıkhı: ezanda 'hayye alâ hayri'l-amel', mut'a caiz değil, teravihi cemaatle kılmak bid'at; genelde Hanefîliğe yakın ama müstakil."}],"oz":{"t":"Zeydiyye · Özet","intro":"Ünitenin özü: Şiî fırkaların en mutedili olan Zeydiyye nasıl doğdu, imamet ve diğer konularda ne düşünür, fıkhı nasıldır ve bugün nerededir?","s":[{"h":"Doğuş ve Tarihçe","b":[{"k":"li","x":"**Ad:** Kurucusu sayılan **Zeyd b. Ali b. Hüseyin**'e (ö. 122/740) nispetle."},{"k":"li","x":"**Zeyd'in isyanı:** Emevîlerin baskıcı politikaları, Hz. Ali'nin vakıfları konusunda Hişâm b. Abdülmelik ile anlaşmazlık ve meşru yönetim arayışıyla 122/740'ta Kûfe'de ayaklandı. Kûfelilerin çoğu, Ebû Bekir ve Ömer'den teberrî etmediği için onu terk etti (bu yüzden onlara **Râfıza** dendi). Zeyd şehit edildi."},{"k":"li","x":"Oğlu **Yahyâ b. Zeyd** hareketi Horasan'a taşıdı, 125/743'te öldürüldü."},{"k":"li","x":"**Devletler:** Taberistan'da Hasan b. Zeyd (250/864) ve Yemen'de **Hâdî İle'l-Hak Yahyâ b. Hüseyin** ile kurulan Zeydî imameti. Yemen Zeydîliği 1962 devrimine kadar imametle varlığını sürdürdü."}]},{"h":"Görüşleri","b":[{"k":"li","x":"**İmamet:** Nas ve vasiyetle tayin yoktur; imam **faziletli** (takva ve ilim sahibi) olmalı, Hz. Hasan veya Hüseyin soyundan (Fâtımî) gelmeli ve imametini **açıkça ilan edip** zalime karşı çıkmalıdır (huruç)."},{"k":"li","x":"**Mefdûlün imameti:** Efdal varken daha az faziletli birinin imameti caizdir; bu yüzden Ebû Bekir ve Ömer'in hilafeti meşrudur."},{"k":"li","x":"**İsmet** yalnız peygamberlere aittir; imamlar masum değildir. Gizli ya da beklenen imam yoktur."},{"k":"li","x":"**İman-amel:** Amel imanın parçasıdır; tövbe etmeden ölen büyük günahkâr ebedî cehennemliktir (Mu'tezile'ye yakın)."},{"k":"li","x":"**Kelâm:** Mu'tezile'nin beş esasıyla büyük ölçüde örtüşür."}]},{"h":"Fıkıh","b":[{"k":"li","x":"**Dönemler:** oluşum (II-III. yy.), klasik dönem (Kāsımiyye, Nâsıriyye, Hâdeviyye kolları), müteahhir dönem (İbnü'l-Murtazâ, İbnü'l-Vezîr), modern dönem (Şevkânî)."},{"k":"li","x":"**Deliller:** Kitap, sünnet, icmâ (ümmet ve Ehl-i Beyt icmâı), Hz. Ali'nin içtihatları, kıyas, istihsan, istishâb ve akıl."},{"k":"li","x":"**Uygulamalar:** Ezanda \"Hayye alâ hayri'l-amel\"; mest üzerine mesh caiz değildir; namazları cem etmek caizdir; sabah ve vitirde kunut; teravihi cemaatle kılmak bid'attır; **mut'a caiz değildir**; hırsızlıkta nisap 10 dirhemdir."},{"k":"li","x":"Genel olarak **Hanefî fıkhına yakın** sayılsa da müstakil bir mezheptir."}]},{"h":"Günümüz","b":[{"k":"p","x":"Yemen nüfusunun yaklaşık %45'ini oluşturur; Yemen'deki **Husî** (Ensârullah) hareketi bu gelenekten çıkmıştır."}]}]}},{"t":"İsmâiliyye","intro":"İsmâiliyye'nin adları, teşekkülü, setr devri, Karmatîler ve Fâtımîler, Nizârî-Müsta'lî ayrılığı, bâtınî doktrin ve davet teşkilatı, günümüz İsmâilîleri.","s":[{"h":"İsimlendirme Meselesi","b":[{"k":"p","x":"**1. İsimlendirme Meselesi:** Nispet edilen pek çok isim bulunmaktadır."},{"k":"p","x":"**a) İsmailiyye**: Cafer Sadıktan sonra oğlu İsmail'i imam olarak kabul ettiklerinden bu isimle anılmışlardır."},{"k":"p","x":"**b) Batıniyye**: Nasların zahiri manalarını ancak Tanrı ile ilişki kurabilen \"masum imam'ın bilebileceğini savunduklarından bu isimle anılmışlardır. Bunlar, her zahirin bir bâtını ve her nassın bir te’vili bulundu ğunu iddia ederler."},{"k":"p","x":"**c) Karmatiyye/Karamita**: Kûfe'deki aşırı Şiî İsmaili daisi Hamdan b. Eş'as Karmat'a (ö. 293/906) nispetle bu adı almışlardır. Başlangıç yıllarında İsmailiyye'nin büyük dailerinden biri idi."},{"k":"p","x":"**d) Talimiyye**: Her türlü sır ve hakikatin ancak masum bir imamın öğretmesi ile bilinebileceğini savunduklarından dolayı bu isimle anılmıştır."},{"k":"p","x":"**e) Seb'iyye:** Sistemlerini \"yedi\" rakamı üzerine kurmalarından ve bu rakama kutsiyet atfetmelerinden kaynaklanmaktadır. Ayrıca İsmail b. Cafer'in yedinci sırada olması, yedili bir âlem tasavvuruna inanmaları, haftanın günlerinin yedi günden oluşması, kâinatın yedi kat olması ve gezegen sisteminin yedili olduğunu kabul etmeleri buna sebebtir."},{"k":"p","x":"İsmaililiğin yayılması sürecinde büyük bir rol oynayan Hasan Sabbah'a nispetle “ **Sabbahiyye** \"; İsmail'in neslinden gelen imamların Mısır'da Fatimiler adıyla bir devlet kurmaları sebebiyle “ **Fatimiye** ”; bazı mezhep mensuplarının ilhad görüşlerini benimsemesi ve şer'i hususları inkâr etmesi sebebiyle \" **Melahide** ve **Zenadıka** \"; her şeyi mubah sayan bazı görüşleri sebebiyle “ **Mezdekiyye**, **Babekiyye** ve **Hürremiyye** \"; kırmızı rengi kutsamaları ve kırmızı elbise giymeyi tercih etmeleri sebebiyle de \" **Muhammira** \" gibi lakaplarla isimlendirilmişlerdir."}]},{"h":"İsmailiyye'nin Teşekkül Süreci","b":[{"k":"li","x":"Gizli ve ihtilalcı bir hareket olarak ortaya çıkan İsmaililiğin doğuşunda iktisadi sıkıntıların, eski kültürlerin ve iktidar çekişmelerinin büyük rolü vardır. Nitekim İsmailiyye hareket içerisinde yer alan ilk şahsiyetlerden bir kısmının, yeni fethedilen bölgelerde yaşamakta olan Zerdüşt, Maniheist, İrfanî, Deysanî, Yahudi ve Hristiyan kültürüne mensup kimselerle yakın ilişki içinde oldukları bilinmektedir."},{"k":"li","x":"İsmailî düşüncenin ortaya çıkışında da siyasi faktörlerin yanı sıra ekonomik etkenlerin de olduğu kabul edilmektedir. Öte yandan İsmailiyye'nin teşekkülünde asıl etkili olan unsurun Şia içerisindeki siyasi ayrışma olduğu kabul edilir. İsmailiyye ve İmamiyye'nin altıncı imamı Cafer Sadık (ö. 148/765), hayatının son yıllarında büyük oğlu İsmail'i kendinden sonra imam olarak tayin etmişti. Ancak Cafer Sadık'ın ölümü sonrasında Şia'nın ana gövdesi zamanla Cafer'in diğer oğlu Musa Kâzım'ın imametinde birleşmiştir."},{"k":"li","x":"İsmail'in imametini iddia edenler, onun ölüp ölmediği hususunda iki ana gruba ayrldılar."},{"k":"p","x":"Sayıca az olan bir topluluğa göre İsmail, gerçekte ölmemiş, takıyye gereği ölmüş gibi görünmüştür. Onlar İsmail'in bir müddet sonra geri döne ceğini (rec'at) ileri sürdüler. Bu fırkaya **\"Halis İsmaililer\"** denildi. Diğer grup ise İsmail'in öldüğünü kabul ederek Cafer Sadık'ın vefatından sonra imametin İsmail'in en büyük oğlu Muhammed'e geçtiğini öne sürdü. Bunlar, imametin kardeşten kardeşe geçmeyeceğini, kardeşi Musa Kâzım'a geçmeyeceğini iddia ettiler. Bunlara İsmail'in lakabı ya da kölesi Mübarek'e nispetle **“Mübarekiyye\"** adı verildi."},{"k":"li","x":"Fırkanın teşekkül sürecinde İsmail'in yakın dostu olan Ebu'l-Hattab Muhammed b. Ebî Zeyneb el-Esedî önemli bir rol oynamıştır. Bu şahsa tabi olanların oluşturduğu gruba **\"Hattabiyye”** denilmiştir. Ebû'l-Hattab'tan sonra hareketin başına Meymûn el-Kaddah ve oğlu Abdullah (ö. 261/784) geçti. İsmailiyye'nin asıl kurucuları olarak kabul edilen bu şahıslar, eski Orta Doğu dinleri ile yeni Eflatuncu felsefeden faydalanarak Batıniyye'nin inanç yapısını kurdular."}]},{"h":"İsmailîyye'nin Tarihçesi","b":[{"k":"li","x":"İmam Muhammed'in 179/795-96'da ölmesinin ardından İsmailî hareket yaklaşık bir buçuk asır süren bir gizlilik dönemine girmiştir. Bu dönemde kesintisiz bir imamet silsilesinin devam ettiği belirtilir. Mezhebi faaliyetler, gizlilik döneminde özellikle **Meymûn el- Kaddah** ve oğlu **Abdullah** tarafından sürdürülmüştür."},{"k":"li","x":"Gizlilik döneminde kurulan ve mezhebi de idare eden gizli ihtilal teşkilatının asli unsurları olan propagandacılar (dailer), mezhebin yayılmasında önemli rol oynadılar. Küfe, Basra, İran, Yemen, Bahreyn, Kuzey Afrika'ya gönderilen dailer mezhebin görüşlerini yaymaya çalıştılar. Bu dönemde Yemen'e gönderilen **İbn Havşeb** ve **Ali b. el-Fadl**, Yemen'in büyük bir bölümünü ele geçirerek iki ayrı devlet kurmayı başardılar. Yine **Ebû Said el- Cennâbî** ve oğlu **Ebû Tahir el-Cennâbî**, Bahreyn'de Karmatî Devletini kurdular. On birinci **imam Ubeydullah**, oğlu **Kâim** ile birlikte Sicilmase'ye gelip 297/909'da Mehdi olduğunu ilan ederek Fatimi Devletinin temellerini attı. Kısa süre içerisinde Mısır'ı ele geçiren İsmailîler, Kahire'de **el-Ezher Medresesini** kurarak pek çok dâî ve ajan yetiştirdiler."},{"k":"li","x":"İsmailî hareket içerisinde zamanla bazı parçalanmalar meydana gelmiştir. Bunların ilki, halife Hâkim bi-Emrillah'ın ilahlığını iddia eden **Dürzilik hareketi** nin ortaya çıkmasıyla diğeri, Fatimi halifelerinden el-Mustansır'ın (427-487/1035-1094) yılında ölümü ile orada bulunmayan oğlu Nizâr yerine küçük kardeşi **Musta'li'** nin imamete geçirilmesiyle meydana geldi."},{"k":"p","x":"**a. Musta’liye Kolu:** Musta'li Ebü'l-Kasım Ahmed (ö. 487/1094) başlangıçta başarılı olmuşsa da Kahire'deki İsmailîlerin **Nizâr** 'a bağlılıklarını izhar etmeleri ve ayrıca Hasan Sabbah faktörünün devreye girmesi ile zor günler yaşamıştır. Fatimi Devleti yıkılmasından sonra Musta'liler merkezlerini Yemen'e taşımışlar sonra Hindistan'a atlayarak Nizarilerin aksine sakin ve sessiz bir hayatı benimsemişlerdir. Bugün, Hindistan'da “ **Bohra** \" (Bohora) adıyla tanınan oldukça önemli bir topluluk durumundadırlar. **Davudî** ve **Süleymani** şeklinde ikiye ayırmıştır. Eğitim ve okullaşmaya büyük ehemmiyet veren Bohraların eğitim düzeyleri oldukça yüksektir. Nüfusları, 1931 sayımına göre 213 bin dolayında olup kapalı bir cemaat hâlinde yaşamaktadırlar ve kendilerine mahsus camileri vardır. Yalnız kendi aralarında evlenirler ve Hindularla temas etmezler."},{"k":"p","x":"**b. Nizarîyye Kolu:** Bunlar, Nizâr'a mensup olanlardır. Günümüzde İsmailiyye fırkasının büyük çoğunluğunu teşkil ederler. Nizarî İsmailîlerin hamiliğini yapan **Hasan Sabbah'ın**, 483/1090'da Kazvin'in Kuzey-Doğusunda erişilmez bir vadideki **Alamut Kalesini** zapt etmesiyle resmen başlayan İran Nizari İsmaili Devleti, Hülagu'nun burayı zapt ettiği 654/1256 yılına kadar sürmüştür. Hasan Sabbah'ın özel olarak yetiştirtiği **fedailer** İslam dünyasında terör estirmiş, afyon yutturulmak suretiyle tedhiş eylemcisi olarak harekete hizmet etmişlerdir. Selçuklu veziri **Nizamülmülk** bu fedailerce öldürülmüştür. Hülagu'dan sonra daha çok İran Azerbaycan'ında kalan Nizarî İsmaililer, tasavvufi bir görünüm altında varlıklarını sürdürmüşlerdir. Safeviler devrinde İsmaili propoganda kısıtlandı. Nizarîler meşhur **Üçüncü Ağa Han** unvanlı 48. **İmam Sultan Muhammed Şah Ali'** nin imameti esnasında (1202-1374/1885-1957) büyük gelişme kaydettiler. İsmailîyye fırkası, özellikle İran coğrafyasında gücünü artırmış ve orada Ebû Yakub **es-Sicistânî**, **Nasir Hüsrev**, **Ebû Bekir er-Râzî**, **Hamiduddîn Kirmâni** gibi büyük bâtıni-İsmaili filozoflar yetiştirmişlerdir."},{"k":"p","x":"Bugün 49. İmam Kerim Şah Ali'nin idaresindeki Nizarî İsmailileri, yalnız Hindistan'da değil dünyanın farklı ülkelerinde de yaşamakta olup, yaklaşık 20 milyon kadar nüfusa sahiptirler. Nizari İsmailileri, Hindistan'da genellikle **\"Hocalar\"** adıyla anılırlar. Suriye'de **\"İsmailiyye\"**, İran'da **\"Ağa Han Müridleri\"**, Afganistan'da Kabil'in kuzey bölgelerinde Hz. Ali'nin ilahlığını ileri sürdükleri için **“Ali-İlahiler\"**, Orta Asya'nın doğu bölgesinde ise **“Mollalar\"** olarak tanınmaktadırlar."},{"k":"p","x":"**4. Görüşleri:** Bu fırkanın anlayışına göre dinin aslı imamete inanmak, imama itaat etmek ve teslimiyet göstermektir. Bunun için imametin dışındaki bütün şartlar imamete nispetle tali konumdadır."},{"k":"p","x":"**a. İmamet, Velayet ve Nübüvvet: İmamet**, yerine getirildiği takdirde diğerlerinin bilgisine ulaşmak mümkün olur. Kalbi ibadet demek olan **velayet**, özellikle Hz. Peygamber ailesine karşı muhabbet beslemek ve onları hidayet nuru ve hakikat rehberi tanımak, dolayısıyla zamanın imamını sevmek ve ona bütün gönlüyle bağlanmaktır. Bu itibarla iman, ancak zamanın imamına inanmak ve onu dost edinmekle gerçekleşebilir."},{"k":"p","x":"İsmailiyye'ye göre her peygamberin bir vasisi vardır ve onların ilmî vasiye emanet edilmiştir (Hz. Muhammed'in vasisi Ali'dir) Bu anlayışları doğrultusunda onlar şahadet kelimesine \" **Ali, Allah'ın velisi ve Nebinin vasisidir.\"** ibaresini eklemişlerdir."},{"k":"p","x":"İsmailiyye'ye göre Hz. Ali neslinden gelen ve bir önceki imam tarafından tespit edilen masum bir imamın varlığına inanmak dinin aslındandır. İsmaililer, Hz. Peygamber'in vefatı ile vahyin kesilmediğini ve ilahî rehberliğin bir şekilde devam ettiğini kabul ederler."},{"k":"p","x":"Onlara göre Ali'nin imameti sadece Hz. Peygamber'in hadisleri ile değil, bizzat Kur'an'ın açıklaması ile de sabittir. Nitekim **\"Allah semaların ve arzın nurudur.\"** (Nur 24/35) ayetinde \"semalardaki nur\" ile Allah'ın hidayeti, \"yerdeki nur\" ile de insanların hidayete ulaşmasına vesile olan imam kastedilmektedir. Yine **“Sen ancak bir uyarıcısın, her kavmin de bir hidayet rehberi vardır.”** (Ra'd 13/7) ayetindeki \"uyarıcı\" ile Hz. Peygamber, “hidayet rehberi” ile de devrin imamı kastedilmektedir. Bunlardan ayrı olarak **“Bütün insanlar imamlarıyla önderleriyle çağırdığımız gün...\"** (İsrâ, 17/71) vb. ayetlerde de Hz. Ali ve soyundan gelecek imamlara işaret edilmektedir."},{"k":"p","x":"İsmaililer, Allah'ın nurunun Hz. Peygamber'den itibaren sırasıyla imamlara intikal ettiğini kabul ederler. Onlara göre imamların nasuti ve lahuti sıfatları vardır. İnsanlar imamı beşeri vasıflarıyla tanırlar. İlahi vasıfları ise ancak kendilerine izin verilen kimseler tarafından bilinebilir. Ayrıca onlar, örnek şahsiyetler olup her türlü hatadan korunmuşlardır."},{"k":"p","x":"İsmailîye'ye göre Hz. Peygamber, vahyin zahirini tebliğ etmiş batınını ise içinde yaşanılan toplumun şartlarına göre imam tebliğ edecektir. Vahiy belirli, sınırlı ve tamamlanmış olmakla birlikte bâtıni boyutu imam tarafından açıklanmaya devam edilecektir. Vahiy kesilmemiştir. İmam, gerekli gördüğünde şeriatın bazı kanunlarını değiştirme veya tamamen ilğa etme salahiyetine sahiptir."},{"k":"p","x":"İsmaili imamet anlayışına göre her \" **Natik** \"ın, bir \" **Samit** \"i vardır. Natik kendisinden önceki Natik'ın mesajının yerine geçecek yeni bir ilahî mesaj getirirken, Samit bu ilahî mesajın bâtini anlamını bilir. Böylece Samit gerektiğinde Natik'a yardımcı ve destek olur."},{"k":"p","x":"İsmaili düşüncede başlangıçta “ **yedi imam inancı”** benimsenmişken, Fatimi Devletinin kurulması ile birlikte imamların sayısının yediden fazla olduğu kabul edilmiştir. Yine devletleşme süreci sonrasında “ **Mehdi** \" veya beklenen \" **Gaib İmam** \" düşüncesi terk edilmiştir. Fatimi Devletinin kurulması ile beklenen mehdi anlayışı, yerini “ **Kaim”** imam anlayışına bırakmıştır."},{"k":"p","x":"**b. Aşırı Yorum ve Zahir-Bâtın Ayrımı:** İsmailiyye mensupları kutsal kitapların ve şer'i hükümlerin zahiri ve lafzi anlamlarının yanı sıra her zahiri ve lafzi mananın bir bâtıni ve hakikî manası olduğunu ileri sürmüşlerdi."},{"k":"p","x":"Bazı İsmaili alimler, bâtıni yorumun zahire uygun olması gerektiğini, zahir veya bâtından birini terk edenin İsmailî olmayacağını eserlerinde açıklamışlarsa da tarihi uygulamalar bu mezhep mensuplarının zahiri tamamen terk edip sadece batınla amel ettiklerini göstermektedir."},{"k":"p","x":"**c. Sayıların Kutsallığı ve Yedi Devir İnancı:** İsmailiyye mezhebi, büyük ölçüde “ **yedi** \" sayısının taşıdığına inanılan kutsallık vasfı üzerine bina edilmiştir. **Yunan felsefesi** nden yararlanarak **yedi tecelli** kabul etmişlerdir. Bunlar, Allah, külli akıl, nefs, asli madde (heyula), feza, zaman, yeryüzü âlemi ve son olarak insanlık şeklindedir."},{"k":"p","x":"İlk İsmaililere göre insanlığın dinî tarihi yedi devirden müteşekkil olup her bir devir, şeriat getiren bir peygamberle başlamaktadır. Bunlar, Adem, Nuh, İbrahim, Musa, İsa, Muhammed ve Muhammed b. İsmail'dir. Her bir devirde o devrin vasisinden sonra yedi imam mevcut olup, onların asli görevi kendi devirlerinin şeriatının zahiri ve bâtini manalarını muhafaza etmekti. Hz. Muhammed ve İslam'ın devri olan altıncı devrin yedinci imamı, İsmaililerin ölümünü inkâr ederek Kaim Mehdi olarak zuhur edeceğini bekledikleri Muhammed b. İsmail'di. O, İslam'ın yasalarını yürürlükten kaldırarak yedinci ve son devri başlatacaktır. Ayrıca her bir **Samit** 'in yedi tane \" **Hüccet** \"i vardır ve huccetleri sıradan tebliğciler olan “ **Dai** \"ler takip etmektedir."}]},{"h":"Nizari-Musta'lî Mukayesesi","b":[{"k":"h","x":"a. İnanç esasları açısından Nizarî-Musta'lî mukayesesi"},{"k":"p","x":"Nizari İsmailîlere göre imama bağlılık (velayet) yerine getirildiği takdirde imanin diğer şartları da tahakkuk etmiş olacaktır. İsmaililere göre iman ile İslam ayrı şeyler olup İslam ikrar, iman ise ikrar ve marifetten ibarettir. İman esaslarını ikrar eden ve imamı tanıyan bir kimse mümin sayılır. İsmaililere göre Allah'a inanmak bir iman esasıdır. Allah'ın sıfatlarını nefyetmek bir prensip olarak benimsenmiştir. Buna göre Allah mücerred ve belirsiz bir varlık olarak düşünülmektedir. Tanrı hakkındaki bu düşünceleri, bilinen ve müşahhas bir varlık olan imama yönelmelerine sebebiyet vermiştir."},{"k":"p","x":"Peygamberlere iman etmek de bir iman esasıdır. Onlara göre peygamberler Allah'ın vahyini insanlara tebliğ eden kimselerdir. Peygamberler mucize gösterebilirler. **Nizarî İsmaililerin** peygamberlikle ilgili duyarlılıkları zayıftır."},{"k":"p","x":"İsmailiyye'ye göre bir kısmı akli âlemde, bir kısmı feleki alemde, bir kısmı da tabii âlemde bulunan ve Allah tarafından verilen görevleri yerine getiren melekler vardır. Ağa Han'a bağlı olan İsmaililerde bu hususun bir iman esası olup olmadığı kesin bir şekilde ortaya konulmamaktadır. İsmailiyye'de ahirete inanmak, cennet ve cehennemi kabul etmek, öldükten sonra dirilmenin hak olduğuna inanmak gerekmektedir. Ahiret hayatı haktır; insanlar işledikleri iyi veya kötü amellerinin karşılığını mutlaka göreceklerdir."},{"k":"h","x":"b. İbadetler açısından Nizari-Musta'li mukayesesi"},{"k":"p","x":"**Velayet:** Musta'liler, velayeti İslam'ın ilk direği olarak kabul ederler. Onlara göre şahadet kelimesi şöyledir: “ **Lâ ilahe illallah Muhammed resulullah ve Aliyyun veliyullah ve vasiyyu'n-Nebi\"** Nizarîler ise velayeti imamı tanımak ve ona itaat etmek şeklinde anlamışlardır. **Taharet**: Musta'lîlerde abdest, diğer Müslümanların uygulaması gibidir. Nizarilere göre abdest, imamı tanımaya (marifet) dönüş, gusül de ahdi yenilemektir."},{"k":"p","x":"**Namaz: Müsta'lî** İsmaililer, sabah, öğle ve akşam olmak üzere günde üç vakit namaz kılarlar. Sabah namazı güneşin doğuşundan önce, öğle namazı ile ikindi namazı öğle vaktinde, akşam ile de yatsı namazı akşam vaktinde birleştirilerek kılınır. **\"Cemaathane\"** adını verdikleri camileri vardır. Cemaate devamsızlık para cezası ile cezalandırılır. Cuma namazı kılmaz ve hutbe okumazlar. Namaz kılarken ellerini yana salarlar."},{"k":"p","x":"**Nizarîlere** göre namaz, imamın bilgisine ve gerçek dine ulaşmaktır. Dua adı verilen namazların bir kısmının mutlaka cemaathane denilen ibadet mahallinde edası gerekirken, diğer bazı dualarında evde münferiden yapılması mümkündür. Bu dualar; sabah, akşam, yatsı veya gece dualarıdır. Cemaate namaz esnasında ibadete nezaret eden ve **muhî** ismi verilen bir çocuk gerekli duaları çevresindekiler duyacak şekilde okur, onlar da bunu tekrar ederler. Dualar oturarak yapılır, imamın ismi anıldığı zaman secde edilmesi gereklidir. **Secde, Kerbela toprağından yapılmış bir mühür üzerine yapılır**. Namazda Mekke'ye dönülmez. Onlara göre kıble, herkesin kendi “hüccet\"ine yüzünü dönmesidir, hüccet ise yüzünü sadece imama döndürür."},{"k":"p","x":"**Oruç**: Musta'liler Ramazanda otuz gün oruç tutarlar. Ayrıca her ayın ilk ve son perşembesi ile ortasına rastlayan çarşamba günleri de oruç tutarlar. Nizarî İsmaililerde ise önceleri oruç, sır saklamak ve sırrı ifşa etmemek anlamında yorumlanmıştır. Günümüzde ise, Ramazan ayında sadece bir gün oruç tutarlar. Ramazan'ın yirmi birinci gecesi oruca başlanır ve ertesi gün öğle vakti bitirilir. Ramazan ayının hepsini kutsal sayarlar. Özellikle on dokuz ve yirmi üçüncü geceler önemlidir."},{"k":"p","x":"**Zekât:** En önemli unsurdur. Nizarîlere göre, zekât, imama inanmaktan sonraki en önemli esastır. Zekâtın toplanması hususu ihtilaflıdır. Nizarîler, zekât olarak toplanan bütün meblağın imamın şahsına ait bir hak olduğunu ve bunu imamın dilediği şekilde harcayabileceğini kabul ederler. Zekât için kameri takvime itibar ederler. Müsta'lîlerde ise zekât, dâiler tarafından toplanır ve Dâî Mutlak'a teslim edilir."},{"k":"p","x":"**Hac**: Nizarîlere göre hac, **dönemin imamını ziyaret** ten ibarettir. Mekke ve Medine'yi ziyaret etmeyi kesin olarak kabul etmezler. Bununla birlikte kalabalık gruplar halinde Kerbelâ ve Necef'i ziyaret ederler. Müsta'lilerin hac konusundaki uygulamaları diğer İslam mezhepleri gibidir. Kâbe'yi ziyaret ederler."},{"k":"p","x":"**Cihat**: Nizarilerde cihat ibadeti eski önemini kaybetmiştir. Buna göre cihat, kişinin doğru yolda kalabilmesi için nefsiyle savaşmasıdır. Geçmişte ise İsmaililer tamamen cihat esasına dayalı bir sistem kurmuşlardır. Musta'lilerde ise cihad gerçek anlamını korur. İmamın gerekli görmesi halinde tüm mensupların nefisleri, malları ve hayatları ile cihat etmeleri farzdır."},{"k":"p","x":"**Mut'a**: İsmâiliyye fıkhı müt'a birlikteliğini kabul etmez. Ayrıca varislerin izni olmadan başka birisine yapılan vasiyeti hükümsüz saymak gibi konularda İmamiyye'den ayrılır."}]},{"h":"İsmâiliyye: Genel Bilgi","b":[{"k":"p","x":"İsmailiyye, Şia'nın köklü ve günümüzde de varlığını sürdüren önemli bir kolu olup, İslam düşünce tarihinde derin izler bırakmıştır. İslam tarihinde Müslümanlara en fazla zarar veren ve bugün de müntesibi bulunan Bâtinilik, farklı coğrafyalarda farklı kimlik ve şekillere girebildiği için **el-Karmatiyye, es-Seb'iyye, Tâlimiyye, Zenâdika, Melâhide, Mazdekiyye, Bâbekiyye, Huremiyye Sabbâhiyye** ve **Fatimiyye** gibi adlarla da anılmıştır. Mezhebin ortaya çıkışı, hicri II. yüzyılın ikinci yarısına, altıncı imam Cafer Sadık'ın vefatının ardından imamet meselesinde yaşanan ihtilafa dayanır. Temel iddia, imametin, Cafer Sadık'ın diğer oğlu Musa Kazım yerine, büyük oğlu İsmail'e ve onun soyundan gelenlere ait olması gerektiğidir. Bu iddia, mezhebin \"İsmailiyye\" adını almasına neden olmuştur. Tarihsel süreçte **Bahreyn'de Karmatîler** ve **Mısır'da Fatımîler** gibi güçlü devletler kurmuş olmaları, onların siyasi ve dini etkilerini göstermektedir."}]},{"h":"Kökenler ve İmamet Tartışmaları","b":[{"k":"p","x":"İsmailiyye'nin oluşumu, Cafer Sadık'ın vefatıyla imamet çizgisinin İsmail'e mi, yoksa Musa Kazım'a mı geçeceği konusundaki fikir ayrılıklarına dayanır. Bu konuda çeşitli rivayetler bulunmaktadır:"},{"k":"li","x":"**İsmail'in Vefatı:** En yaygın rivayetlerden biri, İsmail'in babasından üç yıl önce vefat etmesidir. Bu durum, onun imamet için doğal bir aday olamayacağı düşüncesini desteklemiştir."},{"k":"li","x":"**İsmail'in Davranışları:** Bazı rivayetler, İsmail'in içkiye ve kadınlara düşkünlüğü, ayrıca Cafer Sadık tarafından lanetlenen Ebü'l-Hattâb el-Esedî ile dostluk kurması nedeniyle imametten mahrum edildiğini öne sürer."},{"k":"li","x":"**İsmail'in Hayatta Olduğu İddiası:** Farklı bir rivayet ise İsmail'in Cafer Sadık'ın ölümünden beş yıl sonra Basra çarşısında sağ olarak görüldüğünü belirtir. Bu durum, onun imametini savunanlar arasında bir bölünmeye yol açmıştır."},{"k":"h","x":"İsmail'in Ölüp Ölmediği İhtilafı"},{"k":"p","x":"İsmail'in ölümü konusunda yaşanan ihtilaf, mezhep içindeki ilk önemli bölünmeyi yaratmıştır."},{"k":"li","x":"**Ölmediğini Savunan Azınlık:** Az sayıda bir grup, İsmail'in ölmediğini, ancak takiyye gereği ölmüş gibi göründüğünü iddia etmiştir. Bu görüş, onun mehdi olarak geri döneceği inancını beslemiştir."},{"k":"li","x":"**Mübârekiyye Grubu (Çoğunluk):** Çoğunluktaki Mübârekiyye grubu (İsmail'in kölesi Mübarek'e nispetle), İsmail'in babasından önce vefat ettiğini, ancak kendisine sabit olan imamet görevinin evlatlarına intikal ettiğini savunmuştur. Asıl İsmailiyye'yi teşkil eden bu zümreye göre, İsmail b. Cafer adına kurulan bu fırka daha sonra oğlu Muhammed b. İsmail el-Mektûm ile devam etmiştir. Muhammed b. İsmail, Abbâsî Halifesi Harunürreşid döneminde düşmanlarından korunmak amacıyla Medine'den ayrılıp Rey veya Deylem'e, ardından Nişabur'a yerleşmiştir."}]},{"h":"Setr Devri ve Dâîlerin Rolü","b":[{"k":"p","x":"Cafer Sadık'ın ölümünden, Ubeydullah el-Mehdi'nin Kuzey Afrika'da zuhuruna (296/908) kadar geçen yaklaşık bir buçuk asırlık dönem, İsmailiyye'nin \"setr devresi\" veya \"gizlilik dönemi\" olarak adlandırılır. Bu dönemde İsmailiyye imamları gözlerden uzak yaşamışlardır. Mezhep mensupları, Muhammed el-Mektûm'dan sonra Abdullah el-Vefî, Ahmed b. Abdullah et-Takī ve Hüseyin b. Ahmed er-Radî'nin imam olduğunu ileri sürseler de bu imamların tarihsel kişilikler mi yoksa hareketin kurucuları tarafından uydurulmuş hayali kimseler mi olduğu tam olarak net değildir. Bu devirde, **\"dâîler\"** tarafından yönetilen İsmailiyye fırkası son derece karanlık aşamalardan geçmiş ve birçok belirsizlik içermiştir. Uzun süren gizlenme dönemi, Fatımî halifelerinin soyunun Hz. Peygamber'e ulaşıp ulaşmadığı konusunda çeşitli şüphelerin doğmasına da yol açmıştır."},{"k":"p","x":"Setr devresinde dâîler tarafından kurulan ve yönetilen gizli ihtilal teşkilatı, mezhebin yayılmasında kritik bir rol oynamıştır."},{"k":"h5","x":"1. Karmatilerin Doğuşu (877-78)"},{"k":"li","x":"**Hamdan Karmat,** Kûfe’de İsmailî davetini başlattı, kayınbiraderi **Abdân** ile hareket etti. Taraftarları **\"Karmatiler\"** olarak anıldı."},{"k":"li","x":"Rey’de **Halef** adlı bir dâî, **\"Halefiyye\"** kolunu oluşturdu."},{"k":"li","x":"Fars, Horasan (Nişabur, Merv) ve Sicistan’da İsmailî propagandası yayıldı. **Ebû Ahmed en-Nesefî,** Kirman’daki Kufs kabilesini İsmailî yaptı."},{"k":"h5","x":"2. Yemen ve Kuzey Afrika’da İsmailî Devletler"},{"k":"li","x":"**Yemen’de İbn Havşeb ve Ali b. Fazl (881),** şeriatı uygulayarak kabileleri kazandı ve yerel İsmailî devletler kurdular."},{"k":"li","x":"**Kuzey Afrika’da Ebû Abdullah eş-Şiî (893),** Berberî Kutâme kabilesini örgütleyerek **Fatımî Devleti’nin temelini aU.**"},{"k":"h5","x":"3. Bahreyn Karmati Devleti (899)"},{"k":"li","x":"**Ebû Saîd el-Cennâbî,** Bahreyn’de bağımsız bir **Karmati Devleti** kurdu, Katîf, Umman ve Yemame’yi kontrol etti."},{"k":"h5","x":"4. Merkezi Yönetim ve Kāim İnancı"},{"k":"li","x":"İsmailîler, **\"gizlenen imam\" Muhammed b. İsmail el-Mektûm’un** yakında **\"kāim\"** olarak döneceğine inanıyordu."},{"k":"li","x":"İmam yokken, hareket **Selemiye merkezli \"hüccetler\"** tarafından yönetildi."}]},{"h":"Ubeydullah el-Mehdi ve Mezhep Bölünmesi","b":[{"k":"p","x":"286 (899) yılında Selemiye'de, imametin kendisine ve dedelerine ait bir hak olduğunu iddia eden Ubeydullah el-Mehdi'nin ortaya çıkışı, mezhep bünyesinde önemli bir bölünmeye yol açmıştır."},{"k":"li","x":"**Karmatî Ayrılığı:** Hamdan Karmat ve Abdân, Ubeydullah tarafından propagandası yapılan yeni İsmailiyye doktrininden uzaklaşmış ve desteklerini çekmişlerdir. Daha sonra Abdân, Ubeydullah el-Mehdi'ye sadık olan alt derecedeki dâî Zikreveyh b. Mihreveyh tarafından öldürülmüştür."},{"k":"li","x":"**Yemen'deki Durum:** Yemen'deki iki devlet lideri, Ali b. Fazl ve İbn Havşeb başlangıçta Ubeydullah'a bağlılık göstermişlerdir. Ancak Ali b. Fazl bir süre sonra Ubeydullah el-Mehdi ile ilgisini kesmiş ve devleti 303'te (915) ölümünden sonra uzun ömürlü olmamıştır. İbn Havşeb ise Ubeydullah el-Mehdi'ye daima sadık kalmıştır."},{"k":"li","x":"**Fatımî Devleti'nin Kuruluşu:** Ubeydullah el-Mehdi, dâîsi Ebû Abdullah eş-Şiî'nin daveti üzerine 289 (902) yılında Suriye'nin Selemiye beldesinden ayrılarak Kuzey Afrika'ya ulaşmıştır. Burada tutuklanıp hapsedilse de, Ebû Abdullah eş-Şiî'nin Ağlebî hâkimiyetine son vermesiyle hapisten kurtulmuştur. 297'de (910) mehdiliğini ilan ederek \"setr devri\"ni sona erdirmiş ve \"zuhur devri\"ni başlatmıştır. Ebû Abdullah eş- Şiî'nin kurduğu devleti devralarak \"emîrü'l-mü'minîn\" ve \"Mehdî-Lidînillâh\" unvanlarıyla halife ilan edilen Ubeydullah, kısa zamanda Mağrib'de hakimiyetini kurmuştur. 299 (911) yılında Ebû Abdullah eş-Şiî ve kardeşini öldürterek hareketin mutlak hâkimi olmuş ve Fatımî Devleti'nin temellerini atmıştır."},{"k":"li","x":"**Reddeden Gruplar:** Irak, Bahreyn ve Batı İran'daki İsmaili topluluklar, Ubeydullah'ın imametini ve daha sonraki Fatımî iddialarını reddetmişlerdir. Karmatîler, Muhammed b. İsmail el-Mektûm'un imametini ve onun tekrar geleceğini savunarak Ubeydullah aleyhindeki propagandaları sürdürmüşlerdir."}]},{"h":"Fatımîler'in Mısır'ı Fethi ve İsmailî Tarihindeki Bölünmeler","b":[{"k":"h5","x":"1. Mısır'ın Fethi (969)"},{"k":"li","x":"**Halife Muiz-Lidînillâh,** 969'da Mısır'ı ele geçirerek **Fatımî Devleti'ni** burada güçlendirdi."},{"k":"h5","x":"2. Hâkim-Biemrillâh ve Dürzilik İddiası"},{"k":"li","x":"6. Fatımî halifesi **Hâkim-Biemrillâh,** son yıllarında **ilahlık iddiasında** bulundu ve **Dürzilik** hareketini başlattı. Bu iddia, diğer İsmailî dâîler tarafından reddedildi. Hâkim'in ölümünden sonra Dürzîler cezalandırıldı."},{"k":"h5","x":"3. Müstansır-Billâh Dönemi ve Büyük Bölünme (1094)"},{"k":"li","x":"**Halife Müstansır-Billâh'ın** uzun saltanatından sonra, **veraset krizi** çıktı:"},{"k":"li","x":"**Nizar** (büyük oğul) geleneksel imam adayıyken,"},{"k":"li","x":"**Ahmed (Müsta‘lî),** vezir **Efdal b. Bedr el-Cemalî'nin** desteğiyle halife ilan edildi."},{"k":"li","x":"Nizar hapsedilerek öldürüldü. Bu olay, İsmailîleri **Nizariyye** (Nizar taraftarları) ve **Müsta‘liyye** (Müsta‘lî taraftarları) olarak **ikiye böldü.**"},{"k":"li","x":"**Nizarîler** (Alamut merkezli) ve **Müsta‘lîler** (Yemen ve sonra Hindistan/Bohralar) şeklinde günümüze kadar ulaşan bir ayrışma yaşandı."}]},{"h":"İsmailiyye Doktrini","b":[{"k":"p","x":"İlk İsmailiyyelerin imamet konusundaki düşünceleri tam olarak net olmasa da İmamiye kaynakları, ilk İsmailiyye'nin Cafer Sadık'ın ilahlığını ve kendisinin onun tarafından peygamber olarak görevlendirildiğini iddia eden **Ebü'l-Hattâb el-Esedî'nin** mensupları olduğunu öne sürer. Ancak daha sonraki İsmaili doktrini genellikle Ebü'l-Hattâb'ı kötülemiştir. **İ. Zâhir ve Bâtın Ayrımı:**"},{"k":"p","x":"İleriki dönemlerde çeşitli vesilelerle ıslah edilen İsmailiyye doktrininin en belirgin özelliği \"zâhir\" ve \"bâtın\" ayrımıdır. Bu düşünceye göre:"},{"k":"li","x":"**Zâhir:** Nasların (Kur'an ve Sünnet) görünürdeki, dışsal anlamıdır."},{"k":"li","x":"**Bâtın:** Nasların ötesindeki asıl, gizli anlamıdır."},{"k":"li","x":"**Te'vil:** Bâtınî mânayı ortaya çıkarmak için kullanılan yorumlama metodudur. İsmailiyye, bu metodu aşırı derecede kullandığı için uzun süre **\"Bâtıniyye\"** ismiyle anılmıştır."},{"k":"li","x":"**Üstünlük:** Onlara göre, gönderilen kitap ve şeriatlar peygamberlere göre değişmesine rağmen, bâtınî hususiyetler değişmeyen aslî gerçeklerdir. Bu sebeple bâtın daima zâhirin üstündedir."},{"k":"li","x":"**Şeriatın Yorumu:** Bâtına ulaşmak için şeriata bağlı kalma zorunluluğu, sâlikin (yolcu) mânevî ilerleyişine bağlı olarak değişebilir. Namaz, oruç, hac gibi ibadetler bile bâtınî anlamlarla yorumlanmıştır (örneğin, namaz imama kalben yönelmek, oruç davetin sırlarını ifşa etmemek, hac imamı ziyaret etmek)."},{"k":"h","x":"Kozmoloji ve Devrî Kutsal Tarih"},{"k":"p","x":"İsmailiyye, kendilerine özgü bir kozmoloji anlayışı ve devrî kutsal tarih prensibine sahiptir."},{"k":"li","x":"**İlk Kozmoloji (Fâtımîler Öncesi):** Allah'ın \"kün\" (ol!) emrinden \"kûnî\" (dişil) ve \"kader\" (eril) olmak üzere iki orijinal prensip ortaya çıktığına inanılır. Bu prensiplerden üç büyük tabiatüstü güç (\"ced, feth, hayal\") ortaya çıkmıştır."},{"k":"li","x":"**Devrî Tarih:** Her devir bir \"nâtık nebî\" (konuşan peygamber) ile başlar, ardından bir \"vasî\" (destekçi) ve altı \"sâmit imam\" (sessiz imam) gelir. Nâtık peygamber vahyin zâhirî anlamını, imamlar ise bâtınî anlamını ortaya koyarlar. Her devrin yedinci imamının ilahi bir güce sahip olduğu düşünülür."},{"k":"li","x":"**Nâtıklar ve Esasları:** Âdem'in esası Şît, Nûh'un Sâm, İbrahim'in İsmail, Musa'nın Harun ve İsa'nın Şem'ûn'dur. Hz. Muhammed'in esası ise Ali'dir ve ondan sonra Hasan, Hüseyin, Zeynelâbidîn, Muhammed el-Bâkır, Cafer es-Sâdık ve İsmail b. Cafer gelir. Muhammed b. İsmail'in esası ise Abdullah b. Meymûn el-Kaddâh'tır."},{"k":"li","x":"**Yedinci İmam İnancı (Seb'iyye):** İsmailiyye'nin ilk dönemlerinde, Muhammed b. İsmail el-Mektûm'un gizlenmiş son imam ve mehdî olduğu, tekrar geldiğinde nâtık olarak görev yapacağı, İslam şeriatını ortadan kaldırıp kendi şeriatını getireceği ve bütün âleme hâkim olacağı inancı yaygındı. Bu inanç nedeniyle ilk dönemlerde \"Seb'iyye\" (yedili sistemi benimseyenler) olarak anılmışlardır. Bu isim günümüz İsmailiyyeleri tarafından kullanılmamaktadır."},{"k":"li","x":"**Yeni Eflâtuncu Kozmoloji (Fatımîler Dönemi):** IV. (X.) yüzyılın başlarından itibaren eski kozmolojik telakki terk edilerek, dâî Ebû Ahmed en-Nesefî tarafından Yeni Eflâtuncu âlem anlayışı benimsenmiştir. Bu anlayışa göre Allah mutlak varlık olarak her türlü idrakin ötesindedir. Allah kendi emriyle önce aklı (ilk yaratılan) yaratmıştır. Akıldan sudur yoluyla nefis, nefisten de felekler, yıldızlar ve elementler oluşmuştur. Bu anlayışta akıl yerine kalem ve arş, nefis yerine levh ve kürsî gibi İslami kavramlar kullanılmıştır."},{"k":"h","x":"Fatımîler Döneminde İmamet ve Doktrin Islahı"},{"k":"p","x":"Fatımîler'in ortaya çıkmasıyla İsmailiyye'nin ilk imamet doktrini zorunlu olarak ıslah edilmiştir. Ubeydullah el-Mehdi, imametin Cafer Sadık'tan sonra diğer oğlu Abdullah el- Eftah'a intikal ettiğini ve kesintisiz olarak kendisine kadar geldiğini savunmuştur. Fatımîlerle birlikte, Muhammed b. İsmail'in dünyaya huzur ve sükûn getiren mehdî olarak döneceği düşüncesi terk edilmiş, yerine \"kâim\" yani halen mevcut olan imam kavramı getirilmiştir. İmamın nasuti (beşerî) ve lahuti (ilahi) sıfatları vardır. İnsanlar onu beşerî vasıflarıyla tanır ve idrak ederler. Onun ilahi vasıfları ise ancak kendilerine izin verilen kişiler tarafından bilinir. Bu nedenle İmam'a **\"Yedullah\", \"Vechullah\", \"Cenbullah\"** gibi ifadeler nispet ederler. **IV. Fıkıh Anlayışı:**"},{"k":"p","x":"İlk İsmaili doktrinindeki zâhirin kıymetini düşürme eğilimi, Fatımîler döneminde zâhir ve bâtının eşit derecede değerlendirilmesine yönelmiştir. Bu sayede İsmaili fıkhı gelişmiş ve Kadı Numan'ın \"Deâimü'l-İslâm\" adlı eseri kaleme alınmıştır. İsmailiyye fıkhı birçok konuda İmamiye fıkhına yakınlık gösterse de müt'a nikahını kabul etmeme ve mirasçıların izni olmadan yapılan vasiyetin geçersiz sayılması gibi konularda farklılık gösterir."},{"k":"h","x":"Davet Teşkilatı ve Hiyerarşi"},{"k":"p","x":"İsmailiyye daveti, Fatımîler öncesinde ve Fatımîler döneminde dâîlerin iyi hazırlanması ve belli bir hiyerarşiye tabi tutulması sayesinde geniş bir yayılma imkânı bulmuştur. Hamîdüddin el-Kirmânî'ye göre onlu bir hiyerarşi ve her kademede üstlenilen görevler şöyledir:"},{"k":"n","n":1,"x":"**Nâtık:** Vahyin sözlerini getirme (tenzil)."},{"k":"n","n":2,"x":"**Esas:** Te'vil yetkisini kullanma."},{"k":"n","n":3,"x":"**İmam:** Ümmetin içinden gelip emir ve idare yetkisini elinde bulundurma."},{"k":"n","n":4,"x":"**Hüccet:** Hak ve batıl konularında hüküm verme."},{"k":"n","n":5,"x":"**Bab (dâî'd-duât):** Kesin hüküm verme."},{"k":"n","n":6,"x":"**Dâî-i belâğ:** Tebliğ ve uhrevî meseleleri belirleyip tarif etme."},{"k":"n","n":7,"x":"**Dâî-i mutlak:** Yüksek dereceli hudûdu ve bâtınî ibadeti tarif etme."},{"k":"n","n":8,"x":"**Dâî-i mahdûd:** Aşağı dereceli hudûdu ve ibadeti tarif etme."},{"k":"n","n":9,"x":"**Me'zûn-i mutlak:** Ahid ve mîsâk alma."},{"k":"n","n":10,"x":"**Me'zûn-i mahdûd (mükâsir):** Mezhebe ilgi duyanları celbetme."}]},{"h":"Nizâriyye'nin Gelişimi ve Alamut Devri","b":[{"k":"p","x":"Fatımiler'in yıkılmasından sonra Nizari İsmailileri, siyasi ve coğrafi sebeplerle birçok dini metnini kaybetti. Hasan Sabbah liderliğinde Nizari doktrini yeniden şekillendi ve Şia'nın **ta'lim** (öğreti) anlayışını vurguladı. Bu yeni dönem **(ed-da'vetü'l-cedîde),** Fatımi İsmaililiğinden farklıydı ve bilginin sadece tanrısal atanmış imamdan öğrenilebileceğini savundu."},{"k":"p","x":"Alamut Kalesi'nde dördüncü hükümdar **Hasan Ala Zikrihisselam,** 1164'te imametini ilan ederek **kıyamet** doktrinini başlattı. Şeriat hükümlerini kaldırdı, ibadetleri askıya aldı ve içkiyi serbest bıraktı. Oğlu **II. Muhammed,** bu doktrini sürdürerek imamı peygamberden üstün konuma yerleştirdi."},{"k":"p","x":"Ancak **Celaleddin Hasan** (1210 sonrası) bu radikal doktrini reddetti, Sünni İslam'a bağlılık gösterdi ve şeriatı yeniden uygulattı. Bu durum sonradan **takiyye** (gizlenme) olarak yorumlandı. Alamut'un Moğollar tarafından yıkılmasından sonra Nizari İsmailileri, Sufi kimliğine büründü ve öğretilerini şiirlerle ifade etti."}]},{"h":"Günümüz İsmailiyyeleri","b":[{"k":"p","x":"Günümüzde Nizârî ve Müsta'lî İsmailiyyeleri, Hindistan, Pakistan, Afganistan, Pamir, İran, Yemen gibi geniş bir coğrafyada yaygın bir toplum özelliği göstermektedir. Kesin sayıları hakkında net bilgi olmamakla birlikte, Müsta'lî İsmailiyyelerinin yaklaşık 2 milyon, Nizârî- İsmailiyyelerinin ise 10 ila 20 milyon civarında olduğu tahmin edilmektedir."},{"k":"p","x":"Günümüz Nizârî-İsmaili toplumu düzenli bir hareket tarzından ziyade imamlarının tavsiye ettiği davranışları benimser. Özellikle Alamut devresindeki \"el-imâmü'l-kāim\" denilen mevcut imamın fermanları her şeyin üstünde tutulur. İmamı sevmek ve emirlerine uymak dinin en önemli rüknü sayılır. Nizârî-İsmailiyye, geçmişte formüle edilmiş kanunların değişeceğini kabul eder ve bu değişimin içtihatla değil, imamın takdiriyle olacağına inanır. Yaşayan imam, kendi dönemindeki şartlara göre mensuplarını yönetir."},{"k":"h","x":"İsmâiliyye Mezhebinin Tarihî Gelişim Tablosu"},{"k":"tbl","r":[["Mezhep/Kol","Kime Bağlı / Nereden Türemiştir?","Ne Zaman Ortaya Çıkmıştır?","Temel Özellikler / Ayrışma Sebebi"],["İmamiyye (Caferiyye)","Cafer es-Sâdık sonrası Musa el-Kâzım'ı imam kabul eder","H. 2. yy sonu","İsmail'in vefat ettiğini ve imametin Musa Kazım'a geçtiğini savunur"],["İsmailiyye (Sebʿiyye)","Cafer es-Sâdık sonrası oğlu İsmail'i ve onun soyunu imam kabul eder","H. 2. yy sonu","İmamet İsmail'e ve oğlu Muhammed b. İsmail'e geçmiştir. 7 İmam anlayışı (Sebʿiyye)"],["→ Mübârekiyye","İsmail’in öldüğünü, imametin oğlu Muhammed'e geçtiğini savunur","Erken dönem","Ana İsmailiyye kolu; Fatımîler buradan gelişmiştir"],["→ Karmatîler","Mübârekiyye'den kopan hizip","H. 3. yy (877'den itibaren)","Radikal yapı; Bahreyn'de devlet kurdular, Fatımîleri tanımadılar"],["→ Fatımîler","Mübârekiyye'den gelişir; Ubeydullah el-Mehdî’nin imametini esas alır","909’da kuruldu","Şiî-İsmailî halifelik, Mısır’ı fethedip merkez yaptı. İmamet silsilesi yeniden yazıldı"],["→ Dürzîlik","Hâkim-Biemrillâh döneminde ayrıldı","1021 sonrası","Hâkim’in ulûhiyet iddiaları kabul edildi; İsmailîlikten farklılaşarak yeni dinleşti"],["→ Müstaʿliyye","Fatımî Halifesi el- Müstansır’dan sonra oğlu Ahmed (Müstaʿlî) taraftarları","1094","Yemen ve Hindistan’da yayıldı. Günümüzde Bohralar olarak bilinir"],["→→ Tayyibîyye (Bohralar)","Müstaʿliyye'nin devamıdır","12. yy","Müstaʿlî'nin oğlu Tayyib’in gaybete girdiği kabul edilir; gizli imam inancı vardır"],["→ Nizâriyye","el-Müstansır’ın büyük oğlu Nizar’ı imam kabul edenler","1094","Hasan Sabbah liderliğinde Alamut merkezli yapı; hâlen yaşayan imam inancı vardır"],["→→ Alamut Nizârîliği","Hasan Sabbah ve sonrası","11-13. yy","Kıyâmet doktrini, şeriatın kaldırılması; sonra Sünnî takiyyesi"],["→→ Modern Nizârî İsmailîler (Ağa Hanîler)","Nizâriyye’nin günümüzdeki hâli","19-21. yy","Ağa Han imamdır; modernizm, sadaka, eğitim ve sosyal kalkınma vurgusu"],["↳ Reddedenler (Irak, Bahreyn, İran’daki İsmailîler)","Fatımîliği ve Ubeydullah'ı reddetmişlerdir","10. yy sonrası","Karmatî çizgisinde kalıp, Muhammed b. İsmail'in mehdiliğini savunmuşlardır"]]}]},{"h":"Kavramlar ve Hızlı Tekrar","b":[{"k":"d","t":"Bâtıniyye","x":"Nasların zahirinin ardında masum imamın bildiği gizli anlamlar bulunduğunu savunan İsmâilîlere verilen ad."},{"k":"d","t":"Seb'iyye","x":"Sistemlerini yedi sayısına dayandırdıkları için İsmâilîlere verilen ad."},{"k":"d","t":"Setr devri","x":"Muhammed b. İsmail'den Ubeydullah el-Mehdî'ye kadar imamların gizli kaldığı ve hareketi dâîlerin yönettiği dönem."},{"k":"d","t":"Nâtık","x":"Yeni bir şeriat getiren konuşan peygamber; her devir bir nâtıkla başlar."},{"k":"d","t":"Sâmit (esas)","x":"Nâtığın vasisi; vahyin bâtınını te'vil eden kişi."},{"k":"d","t":"Dâî","x":"İsmâilî davetini yürüten, hiyerarşide görevli propagandacı."}]}],"ht":[{"s":12,"x":"İsmâiliyye, Ca'fer es-Sâdık'tan sonra imametin İsmail ve oğlu Muhammed'e geçtiğini savunanlardan doğdu."},{"s":12,"x":"Fâtımî Devleti 909'da Kuzey Afrika'da kuruldu, 969'da Mısır'ı aldı; Karmatîler Ubeydullah'ı tanımayıp Bahreyn'de devlet kurdu."},{"s":12,"x":"1094'te Nizâr-Müsta'lî ayrılığı yaşandı: Nizârîler (Alamut, Hasan Sabbâh, bugün Ağa Han), Müsta'lîler (Tayyibî, Bohralar)."},{"s":12,"x":"İsmâilî doktrini: zahir-bâtın ayrımı ve te'vil, masum imam, yedi devir, nâtık-sâmit, Yeni Eflatuncu kozmoloji, on kademeli davet hiyerarşisi."}],"oz":{"t":"İsmâiliyye · Özet","intro":"Ünitenin özü: İsmâiliyye nasıl doğdu, setr devrinde nasıl örgütlendi, Fâtımîlerle nasıl iktidara geldi, hangi kollara ayrıldı ve bâtınî doktrini neyi savunur?","s":[{"h":"Adlar ve Doğuş","b":[{"k":"tbl","r":[["Ad","Sebebi"],["İsmâiliyye","Ca'fer es-Sâdık'tan sonra oğlu İsmail'i imam kabul ettikleri için"],["Bâtıniyye","Nasların zahirinin ardında masum imamın bildiği bâtınî anlamlar bulunduğunu savundukları için"],["Karâmita (Karmatîler)","Kûfeli dâî Hamdân Karmat'a nispetle"],["Ta'limiyye","Hakikatin ancak masum imamın öğretmesiyle (ta'lîm) bilinebileceğini söyledikleri için"],["Seb'iyye","Sistemlerini yedi sayısı üzerine kurdukları için"]]},{"k":"p","x":"Ca'fer es-Sâdık'ın vefatıyla (148/765) imametin İsmail'e mi Mûsâ el-Kâzım'a mı geçtiği tartışıldı. İsmail babasından önce ölmüştü. Bir grup onun ölmediğini, takiyye gereği ölmüş gibi gösterildiğini söyledi; çoğunluk (**Mübârekiyye**) ise imametin İsmail'in oğlu **Muhammed b. İsmail**'e geçtiğini kabul etti. Ebü'l-Hattâb ve Hattâbiyye çevresi de fırkanın oluşumunda etkili oldu."}]},{"h":"Setr Devri ve Fâtımîler","b":[{"k":"li","x":"**Setr (gizlilik) devri:** Muhammed b. İsmail'den Ubeydullah el-Mehdî'nin zuhuruna (296/909) kadar imamlar gizli kaldı; hareketi **dâîler** yönetti. Kûfe'de Hamdân Karmat ve Abdân, Yemen'de İbn Havşeb ve Ali b. Fazl, Kuzey Afrika'da Ebû Abdullah eş-Şîî, Bahreyn'de Ebû Saîd el-Cennâbî faaliyet gösterdi."},{"k":"li","x":"**Bölünme:** Ubeydullah'ın imamet iddiasını kabul etmeyen **Karmatîler** ayrıldı ve Bahreyn'de devlet kurdu."},{"k":"li","x":"**Fâtımî Devleti:** 909'da Kuzey Afrika'da kuruldu; Halife **Muiz** 969'da Mısır'ı aldı."},{"k":"li","x":"**Hâkim Biemrillah** döneminde ilahlık iddiaları **Dürzîliği** doğurdu."},{"k":"li","x":"**Nizâr-Müsta'lî ayrılığı (487/1094):** Müstansır'ın ölümünden sonra büyük oğul **Nizâr** yerine vezir Efdal'in desteklediği **Müsta'lî** halife yapıldı. Nizârîler Hasan Sabbâh önderliğinde **Alamut**'u merkez edindi (1164'te Hasan Alâ Zikrihisselâm \"kıyamet\" ilan edip şeriatı kaldırdı). Müsta'lîler ise Tayyibî kolu ile Yemen ve Hindistan'da (**Bohralar**) devam etti."}]},{"h":"Doktrin","b":[{"k":"li","x":"**Zahir-bâtın ayrımı ve te'vil:** Her zahirin bir bâtını vardır; bâtınî anlamı imam ve onun yetkilendirdiği dâîler bilir."},{"k":"li","x":"**İmamet ve velâyet:** Dinin aslı imama iman ve itaattir; imam masumdur, ilâhî nur imamlar arasında intikal eder."},{"k":"li","x":"**Nâtık-sâmit (esas):** Her devir bir nâtık peygamberle başlar (Âdem, Nûh, İbrâhim, Mûsâ, İsa, Muhammed), yanında bir sâmit/vasî bulunur (Şît, Sâm, İsmail, Hârûn, Şem'un, Ali); yedinci nâtık **Kāim**'dir."},{"k":"li","x":"**Sayıların kutsallığı ve yedi devir.**"},{"k":"li","x":"**Kozmoloji:** İlk dönemde \"kûnî\" ve \"kader\" kavramlarına dayanan anlatı, Fâtımîler döneminde Yeni Eflatuncu sudûr nazariyesine dönüştü."},{"k":"li","x":"**Davet hiyerarşisi:** nâtık, esas, imam, hüccet, bâb, dâî-i belâğ, dâî-i mutlak, dâî-i mahdûd, me'zûn-i mutlak, me'zûn-i mahdûd."}]},{"h":"Nizârî ve Müsta'lî Karşılaştırması","b":[{"k":"tbl","r":[["Konu","Nizârîler","Müsta'lîler"],["İmam","Yaşayan, hazır imam (Ağa Han)","Gizli imam (Tayyib), yerine dâî-i mutlak"],["Namaz","İmamın bilgisine ulaşmak; dua denilen üç vakit","Günde üç vakit namaz"],["Hac","Dönemin imamını ziyaret","Mekke'ye hac"],["Zekât","İmama verilen pay","Dâîler tarafından toplanır"]]},{"k":"p","x":"**Günümüz:** Nizârîler (Ağa Han cemaati) Hindistan, Pakistan, Afganistan, Pamir, İran ve Batı'da; Müsta'lî Bohralar Hindistan ve Yemen'de yaşar."}]}]}},{"t":"Bâtınî Eğilimli Akımlar: Nusayrîlik","intro":"Nusayrîliğin adı, teşekkülü ve tarihçesi, inanç esasları, ibadetleri, dinî hiyerarşi, Anadolu Aleviliği ile benzerlik ve farkları, literatürü ve günümüzdeki durumu.","s":[{"h":"İsimlendirme Sorunu","b":[{"k":"p","x":"a) Nusayrilikle Hristiyanlık arasında ilişki kurmaya çalışan oryantalist iddialar: Nusayr"},{"k":"p","x":"kelimesi, Hz. İsa'nın çocukluğunun geçtiği Latince “ **Nazarie** ” isimli yerle bağlantılıdır. Diğer bir görüşe göre de Nusayri isimlendirmesi “ **Nasrâni** ” (Hristiyan) kelimesinden tahkir ifade eden bir küçültme ismidir. Bu iddialar oryantalistlerin yakıştırmasıdır."},{"k":"h","x":"b) Bazı cemaat mensuplarına göre “Nusayri\" kelimesinin ortaya çıkışı Asr-ı saadet"},{"k":"p","x":"**dönemine kadar geri gitmektedir.** Buna göre Hz. Ömer zamanında Baalbek ve Humus tarafları İslam devleti tarafından fethedilmek istenince Irak ve Mısır'dan gelen kuvvetlere Medine'den Gadir-i Hum beyatında hazır bulunan küçük bir grup da katılmıştı. Bu gruba, **küçük bir yardım grubu olması sebebiyle** “nusayra/yardımcık\" denilmişti. Savaş sonrasında cihat kuralları uyarınca fethedilen Lübnan dağı ile Antakya hattı arasında kalan dağlar ve araziler de bu gruba verildi. Zamanla bu dağlara **\"Nusayra Dağları** \", bu topraklar üzerinde yaşayanlara da Nusayrî denildi."},{"k":"h","x":"c) Mezhebin kurucusu ve ilk teologu kabul edilen Muhammed b. Nusayr en-Nemiri'ye (ö."},{"k":"p","x":"**270/883) atfen:** Tarihî vakiaya en uygun düşen görüştür. Nitekim firkanın kutsal metni **Kitâbü'l- Mecmu** 'un daha ilk bölümünde bu kişinin görüşleri nakledilir. İlk dönem Şiî tarihçileri, İbnü'n- Nusayr'ın görüşlerinden söz ederek taraftarlarının ona nispetle “ **Nemiriyye** ” diye anıldığını kaydetmektedir. Fırkanın \" **Nusayri** \" ismi ile anılmaya başlanması, muhtemelen Dürzi alim Hamza b. Ali'nin (ö. 411/1021) er-Risaletü'l-dâmiğa fir-red 'ale’n-Nusayri adlı eserinden sonra olsa gerektir."},{"k":"p","x":"Muhammed b. Nusayr'a atfedilen birtakım aşırılıklar sebebiyle mezhep mensuplarının kendilerini “ **Alevî\"** ya da \" **Arap Alevisi** ” şeklinde isimlendirirler. Osmanlı tapu kaynaklarında da bu gruba, **“Garipler Cemaati** \", Adana şer'i mahkeme sicillerinde ise “ **Bahçeciler** \" şeklinde isim lendirildikleri görülmektedir. Tarımla meşgul olduklarından dolayı halk arasında “ **fellah** \" diye bilinen bu topluluk bazen de etnik kökenlerine vurgu yapılarak “ **Arap Uşağı** \" şeklinde de anılırlar."},{"k":"p","x":"Şu hâlde başlangıç döneminde **“Nemiriyye** \", hicri V. asırdan itibaren de **“Nusayrî** ” ismiyle anılan fırka I. Dünya Savaşı'nın ardından bölgeyi ele geçiren Fransızların talebi, mensuplarının da uygun görmesiyle **Alevi** adıyla anılmaya başlanmıştır. Mezhep mensupları kendilerini **\"Mü'miniyye Mü'minûn”** ismi ile tanımlarlar. Ayrıca “Nusayri” isminin Hz. Ali'nin safinda “düşmana karşı savaşmak\" anlamlarına geldiğini de ileri sürerler."}]},{"h":"Teşekkül Süreci ve Tarihçesi","b":[{"k":"li","x":"Nusayriliğin doğuşunda etkili olan en önemli sebep, Gulat Şiî fırkaların uluhiyet ve peygamberlik telakkisi ve Şiî İmamiyye geleneğinden gelen Mehdilik inanışıdır. İbn Nusayr, görüşlerini bu anlayışa göre temellendirmiştir."},{"k":"li","x":"Kendi önderlerini tek dinî otorite olarak gören Nusayriler, dinsel anlamda kitabî bilgiden uzak bir görüntü çizdikleri için, siyasi otorite boşluğundan dolayı, mezhep kolay taraftar kazanmıştır."},{"k":"li","x":"Hristiyan kültürü de mezhebin düşünce sisteminin şekillenmesinde belirleyici faktörlerdendir."},{"k":"li","x":"Mezhep mensuplarına göre Nusayriligin ortaya çıkması, Gadir-i Hum ve Kerbela olaylarına dayanmaktadır. Onlara göre Hz. Ali'nin hakkı gasp edilmiştir."},{"k":"li","x":"Nusayrilik III. (IX.) yüzyılda Basra'da doğmuş, İsnaaşeriyye'nin X. İmamı Ali en-Naki (ö. 254/868) ile XI. İmam Hasan el-Askeri (ö. 260/873) zamanında Küfe ve Sâmerrâ'da yaşamış olan **Muhammed b. Nusayr** tarafından kurulmuştur."},{"k":"li","x":"Bir rivayete göre İbn Nusayr kendisinin Ali en-Naki tarafından gönderilmiş bir peygamber olduğu iddiasındaydı. Bir başka rivayete göre ise İbn Nusayr, Hasan el-Askeri'ye açılan kapı (bâb) olduğunu savunmuştur. XII. İmam Muhammed b. el-Hasan
