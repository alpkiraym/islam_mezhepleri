 anlamına gelir."},{"k":"li","x":"**Emevî halifesi I. Yezîd:** Ada, I. Yezîd'e bağlılıktan ve onu insanüstü saymaktan dolayı verildiği görüşüdür. Son dönem araştırmaları da isimle I. Yezîd arasında yakın bir ilişki olduğunu ortaya koymaktadır."},{"k":"li","x":"**Yezîd b. Üneyse:** Bazı yazarlar adı Hâricî (İbâzî) gruplardan Yezîd b. Üneyse'ye bağlamıştır; ancak bu ilişki yalnızca isim benzerliğine dayandığı için ilmî bulunmamaktadır."},{"k":"p","x":"Kendilerini etnik olarak Kürt sayan mensupları daha çok **Ezidî** ve **Yezîdî** adlarını kullanır. Melek Tâvûs inancı sebebiyle onlara aşağılayıcı biçimde **abedetü'l-İblîs** (şeytana tapanlar) da denmiştir."},{"k":"not","x":"Mehmet Şerefettin Yaltkaya'ya göre adın kaynağı İbn Teymiyye'nin Şeyh Adî mensuplarına yazdığı el-Vasiyyetü'l-Kübrâ risalesinden anlaşılır: Râfızîlerin sahabeye sövmesine tepki olarak bazı gruplar Yezîd b. Muâviye'yi övmeye başlamış, bu aşırılık onlara \"Yezîdî\" denmesine yol açmıştır."}]},{"h":"Ortaya Çıkışı ve Tarihçesi","b":[{"k":"p","x":"İlk araştırmacılar Yezîdîliği Mazdeizm ve Maniheizm gibi eski Doğu inançlarının devamı saymıştır. Sonraki çalışmalar ise hareketin kökeninde Abbâsîlerin ilk döneminde ortaya çıkan **aşırı Emevî taraftarlığı**nın bulunduğunu göstermiştir. Son Emevî halifesi II. Mervân'ın Kürt asıllı bir cariyeden doğmuş olması da bu eğilimi güçlendirmiştir. Emevîlerin yıkılmasından sonra bu gruplar **Hakkâri dağları**na çekilmiş, zamanla bir kısmı tasavvufa yönelmiştir."},{"k":"h","x":"Adî b. Müsâfir ve Adeviyye"},{"k":"p","x":"Ba'lebek yakınlarında doğan Emevî soylu **Adî b. Müsâfir**, Abdülkādir-i Geylânî, Ebü'n-Necîb es-Sühreverdî, Ahmed er-Rifâî ve Ebü'l-Vefâ el-Hulvânî gibi sûfîlerle görüşmüş, Hakkâri'de inzivaya çekilerek **Adeviyye** tarikatını kurmuştur. Sünnî çizgide kalmış, Şîa'ya karşı Muâviye'yi savunmuştur. 557/1162 civarında doksan yaşlarında vefat etmiş; kabri Musul'un yaklaşık 65 km kuzeyindeki **Lâliş**'tedir."},{"k":"p","x":"Adî'ye nispet edilen eserler arasında **İ'tikādü Ehli's-Sünne** (kader, sünnet ve bid'at ayrımı, Muâviye'nin savunusu), nefis terbiyesine dair bir risale ve müridlerine yazdığı vasiyetler bulunur. Bu eserlerdeki anlayış Gazzâlî çizgisine yakındır ve şeriata bağlılığı öğütler."},{"k":"h","x":"Adeviyye'den Yezîdîliğe"},{"k":"p","x":"Adî'nin kardeşinin soyundan gelen **Şeyh Hasan** döneminde, Şîa'nın I. Yezîd'e lanet etmesine tepki olarak topluluk Yezîd'i savunmaya başladı. Zamanla Şeyh Adî ve Yezîd hakkındaki görüşler aşırılaştı: Şeyh Adî kutsallaştırıldı, I. Yezîd'e ilahlık atfedildi ve müridler, şeyh onların yerine ibadet ettiği için dinî yükümlülüklerden muaf olduklarına inandı. Türbe çevresindeki çalgılı ve içkili âyinler tepki doğurdu; kaynaklara göre 817/1414'te Kürt emirleri ve Şâfiî fakihlerin katılımıyla türbe yakıldı, Şeyh'in kemikleri çıkarıldı. Yeniden yapılan türbe Yezîdîlerin kıblesi ve ziyaret merkezi olmuştur."},{"k":"p","x":"1259'da Hülâgû'nun Hakkâri ve Sincar'ı tahrip etmesi ve Adeviyye şeyhi Fahreddin'in öldürülmesinden sonra mensuplar Irak, Suriye ve Güneydoğu Anadolu'ya dağıldı. Yezîdîler hakkındaki temel bilgiler Şeref Han Bitlisî'nin **Şerefnâme**'sinde yer alır."},{"k":"h","x":"Osmanlı ve Cumhuriyet dönemleri"},{"k":"li","x":"**Akkoyunlu, Safevî ve Osmanlı dönemleri:** Yezîdîler için gerileme devridir. Onları küfre düşmüş sayan fetvalar etkili olmuş, cemaat içine kapanmış ve zaman zaman isyan etmiştir."},{"k":"li","x":"**XIX. yüzyıl:** Osmanlı onları ne Müslüman ne Ehl-i kitap saydığı için dağlık bölgelere çekildiler. 1872'de askerlik bedeli ödemeleriyle durumları görece düzeldi ve Ehl-i kitap kabul edildiler. II. Abdülhamid döneminde askerlik ve ibadethane meseleleri yüzünden silahlanma ve göçler yaşandı; Batılı devletlerin müdahalesiyle ortam yumuşadı."},{"k":"li","x":"**Cumhuriyet dönemi:** Devletle ciddi bir sorun yaşanmadı. Irak'ta da askerlik ve eğitim gibi yasal yükümlülüklere uyuldu."},{"k":"not","x":"Mehmet Şerefettin Yaltkaya'nın 1926'da Dârülfünûn İlâhiyat Fakültesi Mecmuası'nda yayımlanan \"Yezîdîler\" makalesi, bu alandaki ilk bilimsel Türkçe çalışmalardandır. Yaltkaya, Kitâbü'l-Celve ve Mushaf-ı Reş'in ilk Türkçe tercümelerini yapmış, İbn Cemîl'in er-Red ale'r-Râfıza ve'l-Yezîdiyye adlı reddiyesine de dikkat çekmiştir."},{"k":"steps","x":["**Emevî taraftarlığı:** Abbâsîlerin ilk döneminde Hakkâri dağlarına çekilen gruplar.","**Adeviyye:** Adî b. Müsâfir'in (ö. 557/1162) Sünnî çizgideki tarikatı.","**Şeyh Hasan dönemi:** Yezîd ve Şeyh Adî etrafında gulüv; Yezîdîliğe dönüşüm.","**Dağılma:** 1259 Hülâgû tahribatı sonrası Irak, Suriye ve Anadolu'ya yayılma."]}]},{"h":"İnanç Esasları","b":[{"k":"p","x":"Yezîdî inancı Zerdüştîlik, Maniheizm, Mitraizm, Yahudilik, Hristiyanlık, İslam ve tasavvuftan etkilenmiştir. Kapalı bir topluluk olduğu için inanç ve ibadetlerinin tamamı açık biçimde bilinmemektedir."},{"k":"li","x":"**Tanrı:** En sevilen adı **Hudâ**'dır. Yedi kat göğü ve yeri yaratan, mutlak kudret sahibi ve iyi bir tanrıya inanılır; ancak bu tanrı dünyayı uzaktan yönetir, yetkilerini meleklere devreder."},{"k":"li","x":"**Yedi melek:** Azâzîl, Derdâîl, İsrâfil, Mîkâil, Cebrâil, Samuel ve Nurael. Her birinin sırasıyla Şeyh Adî, Şeyh Hasan, Şeyh Şemseddin, Şeyh Ebû Bekir, Şeyh Sâceddin, Şeyh Sadreddin ve Şeyh Fahreddin'de bedenlendiğine inanılır."},{"k":"li","x":"**Melek Tâvûs:** Tavus kuşu biçiminde tasavvur edilen merkezî figürdür. Yezîdî anlatısına göre Âdem'e secde etmeyi Tanrı'ya bağlılığından reddetmiş, sonra pişmanlıkla döktüğü gözyaşları cehennem ateşini söndürmüş; Tanrı da onu affederek dünyanın yönetimini ona bırakmıştır. Bu anlayış, Tanrı'nın yaratma ve yönetme görevini ikinci bir varlığa devrettiği **gnostik demiurgos** doktrinine bağlanır. Yaltkaya'nın aktardığı bilgilere göre Melek Tâvûs ilk yaratılan varlık olarak Azrail ile özdeşleştirilir ve yedi meleğin reisi kabul edilir."},{"k":"li","x":"**Tenasüh:** Ruhun başka bedenlerde yeniden doğduğuna inanılır."},{"k":"d","t":"Melek Tâvûs","x":"Yezîdî inancında Âdem'e secde etmeyen ama Tanrı tarafından affedilip dünyanın yönetimi kendisine bırakılan, tavus kuşu biçiminde tasavvur edilen baş melek."},{"k":"d","t":"Hudâ","x":"Yezîdîlerin Tanrı için en çok kullandığı isim."}]},{"h":"Kutsal Metinler","b":[{"k":"p","x":"Yezîdîliğin iki temel metni hacimce çok küçüktür. Yazarları bilinmeyen bu metinler XIX. yüzyılın sonlarında E. G. Browne ve P. Anastase tarafından akademik dünyaya tanıtılmıştır."},{"k":"tbl","r":[["Metin","Nispet edildiği kişi","İçeriği"],["Kitâbü'l-Celve (Cilve, \"vahiy kitabı\")","Şeyh Fahreddin (Şeyh Adî'ye de nispet edilir)","Bir giriş ve beş bölüm. Melek Tâvûs'un bütün varlıkların ilki, ezelî ve ebedî olduğu, itaat edenleri ödüllendirip karşı çıkanları cezalandıracağı; tenasüh; Melek Tâvûs suretine saygı."],["Mushaf-ı Reş (\"siyah kitap\"; reş Kürtçede \"siyah\")","Hasan-ı Basrî","Yaratılış anlatısı, Cebrâil ve Fahreddin'in önemi, Âdem ile Havva, Tufan, Yezîdî hükümdarlarının listesi ve dinî yasaklar."]]},{"k":"dikkat","x":"Yaltkaya'ya göre bu metinler dilbilgisi hataları, Osmanlıca etkisi ve geç döneme ait bilgiler içerdiği için Şeyh Adî'nin kaleminden çıkmış olamaz; sonradan yazılıp ona nispet edilmiştir. Makrîzî ve İbn Cemîl'in Kitâbü'l-Celve'den hiç söz etmemesi de bu görüşü destekler."}]},{"h":"İbadetler","b":[{"k":"li","x":"**Namaz:** Sabah ve akşam, yalnızca el ve yüz yıkanarak güneşe dönülür, kollar göğüs üzerinde çaprazlanarak dua okunur. Duada güneşten korunma, milletin refahı ve neslin korunması istenir; Melek Tâvûs'un adı şahit tutulur."},{"k":"li","x":"**Oruç:** Yılda iki kez üçer gün tutulur: Aralık ayının ilk pazartesisinden itibaren (güneş bayramı) ve 18 Şubat'taki Hızır-İlyâs bayramından önce. Din adamlarının orucu yılda seksen güne ulaşır."},{"k":"li","x":"**Hac:** Lâliş vadisindeki Şeyh Adî türbesine her yıl 15-20 Eylül arasında yapılır; mazereti olmayan her Yezîdî için zorunludur."},{"k":"li","x":"**Zekât ve vergiler:** Müridler gelirlerinin %10'unu şeyhlere, %5'ini pîrlere, %2,5'ini cemaatin fakirlerine verir. Günümüzde bu oranlar ağır bulunduğundan doğum, sünnet, evlilik ve hasat gibi vesilelerle din adamlarına yardım yapılır."},{"k":"li","x":"**Sosyal kurumlar:** Sünnetsiz bir Yezîdî'nin kestiği kurban helal sayılmaz. Kirvelik ve **âhiret kardeşliği** önemli kurumlardır; her Yezîdî'nin bir şeyhi, bir pîri ve bir âhiret kardeşi bulunur, bunlar hazır olmadan cenaze namazı kılınmaz. Evlilik yalnızca topluluk içinde ve her tabaka kendi içinde yapılır."},{"k":"tbl","r":[["İbadet","Yezîdîlikteki karşılığı"],["Namaz","Sabah ve akşam güneşe dönerek dua"],["Oruç","Yılda iki kez üçer gün (din adamları için 80 gün)"],["Hac","Lâliş'teki Şeyh Adî türbesi, 15-20 Eylül"],["Zekât","Şeyhe %10, pîre %5, fakirlere %2,5"]]}]},{"h":"Dinî ve Toplumsal Hiyerarşi","b":[{"k":"p","x":"Yezîdî toplumu katı tabakalara ayrılır ve tabakalar arası geçiş yoktur:"},{"k":"li","x":"**Emîr (mîr):** En üst kademedir. Yezîd ve Şeyh Hasan'dan geldiğine inanılan Şeyhân emîri ve ailesi bu konumdadır. Maddi ve manevi otoriteyi temsil eder, kendisine karşı geleni cemaat dışı bırakabilir. Şeyh Adî vakıflarının ve Melek Tâvûs timsallerinden elde edilen gelirlerin büyük kısmı ona aittir."},{"k":"li","x":"**Şeyh:** Meleklerin bedenlenmiş hâli ya da onların soyu sayılır. Kuralları belirler, bayram zamanlarını tespit eder, ziyaret yerlerini korur; evleri mabet gibi görülür. Şeyhler Adî'nin soyundandır."},{"k":"li","x":"**Pîr:** Adî'nin müridlerinin neslinden gelir; âyinlerde şeyhlere yardım eder, gerektiğinde onların yerine geçer."},{"k":"li","x":"**Kavvâl:** Şeyh Adî şenliklerinde müzik icra eder, ilahiler okur; hacca gidemeyenler için Melek Tâvûs timsalini (sancak) köy köy gezdirir. Siyah başlıkları sebebiyle \"karabaşlar\" diye de anılırlar; tütün ve içki kullanmaz, yılda doksan iki gün oruç tutarlar."},{"k":"li","x":"**Fakir ve türbe hizmetlileri:** Türbe işlerini köçekler, çavuşlar ve ferrâşlar yürütür."},{"k":"li","x":"**Mürid:** Halkın büyük çoğunluğunu oluşturan tabakadır."},{"k":"tbl","r":[["Tabaka","Görevi"],["Emîr","Maddi ve manevi en yüksek otorite"],["Şeyh","Kanun koyma, bayram tespiti, ziyaret yerlerinin korunması"],["Pîr","Âyinlerde şeyhe yardım"],["Kavvâl","Müzik, ilahi; Melek Tâvûs timsalini gezdirme"],["Mürid","Halk"]]}]},{"h":"Bayramlar, Yasaklar ve Gelenekler","b":[{"k":"h","x":"Bayramlar"},{"k":"li","x":"**Sabit bayramlar:** Aralık ayının ilk günü güneş bayramı (ida rosa) ve ardından Sultan Ezi (Yezîd) anması; 18 Şubat'ta Hızır-İlyâs bayramı; nisan ayının ilk çarşambası yeni yıl bayramı (ida serisale)."},{"k":"li","x":"**Tarihi değişen bayramlar:** Ölüler bayramı (ida dahiye), Müslümanların bayramlarına yakın günlerde kutlanan ida ramazan ve ida heciya, Paskalya'ya denk gelen ida Îsâ."},{"k":"h","x":"Yasaklar"},{"k":"li","x":"Fasulye, marul, bakla, lahana, balık, geyik, domuz ve horoz eti yenmez."},{"k":"li","x":"Melek Tâvûs'un rengi sayılan **mavi** giyilmez; bıyık kesmek günah sayılır."},{"k":"li","x":"Melek Tâvûs'u çağrıştırdığı için **\"şeytan\"** kelimesi ve lanet ifadeleri ağza alınmaz."},{"k":"li","x":"Yılan, akrep ve boğa gibi hayvanlar kutsal sayılır."}]},{"h":"Yayıldığı Bölgeler ve Günümüzdeki Durumu","b":[{"k":"p","x":"Yezîdîler çoğunlukla köylerde yaşar. Musul'un **Şeyhân** ve özellikle **Sincar** bölgeleri en yoğun yaşadıkları yerlerdir. İran, Ermenistan (Erivan çevresi), Gürcistan (Tiflis ve Batum köyleri) ve Suriye'de de bulunurlar. Türkiye'de Batman, Nusaybin, Siirt'in Beşiri ve Kurtalan ilçeleri ile Hakkâri'nin dağlık bölgelerinde yaşamışlardır. Son dönemde Güneydoğu Anadolu'dan çok sayıda Yezîdî Batı ülkelerine göç etmiştir. Toplam nüfusun 300-400 bin civarında olduğu tahmin edilmektedir."}]}],"ht":[{"s":0,"x":"Yezîdî adı ya Yezd şehrine, ya \"tanrı\" anlamındaki İranî kelimelere ya da Emevî halifesi I. Yezîd'e bağlanır; Yezîd b. Üneyse'ye nispet ilmî bulunmaz. Mensuplar kendilerine Ezidî der."},{"s":1,"x":"Yezîdîliğin kökeninde aşırı Emevî taraftarlığı vardır; Adî b. Müsâfir'in kurduğu Adeviyye tarikatı Şeyh Hasan döneminde gulüvle Yezîdîliğe dönüşmüştür. Adî'nin Lâliş'teki türbesi Yezîdîlerin kıblesidir."},{"s":1,"x":"1872'de askerlik bedeli ödeyen Yezîdîler Osmanlı'da Ehl-i kitap kabul edilmiştir."},{"s":7,"x":"Yezîdî inancı senkretiktir; Tanrı (Hudâ) dünyayı yedi melek aracılığıyla yönetir, bunların başı Melek Tâvûs'tur. Tenasüh inancı vardır."},{"s":7,"x":"Kutsal metinler Kitâbü'l-Celve ve Mushaf-ı Reş'tir; ikisi de sonradan yazılıp Şeyh Adî çevresine nispet edilmiştir."},{"s":7,"x":"İbadetler: sabah-akşam güneşe dönük dua, yılda iki kez üç günlük oruç, Lâliş'e hac, gelirden şeyh, pîr ve fakirlere pay."},{"s":7,"x":"Hiyerarşi: emîr, şeyh, pîr, kavvâl, fakir, mürid; evlilik tabaka içinde yapılır. Mavi renk, bazı yiyecekler ve \"şeytan\" kelimesi yasaktır."}],"oz":{"t":"Yezîdîlik · Özet","intro":"Ünitenin özü: Yezîdîliğin adı, Adeviyye'den doğuşu, Melek Tâvûs merkezli inançları, ibadetleri, katı toplum yapısı ve günümüzdeki durumu.","s":[{"h":"Ad ve Doğuş","b":[{"k":"li","x":"Ad; Yezd şehrine, \"tanrı\" anlamındaki İranî kelimelere (ized, yezdân) ya da Emevî halifesi **I. Yezîd**'e bağlanır. Mensuplar kendilerine **Ezidî** der; muhalifler \"şeytana tapanlar\" (abedetü'l-İblîs) demiştir."},{"k":"li","x":"Kökeninde Abbâsîlerin ilk döneminde Hakkâri dağlarına çekilen **aşırı Emevî taraftarlığı** vardır."},{"k":"li","x":"**Adî b. Müsâfir** (ö. 557/1162 civarı) Hakkâri'de Sünnî çizgide **Adeviyye** tarikatını kurdu; kabri **Lâliş**'tedir."},{"k":"li","x":"Şeyh Hasan döneminde, Şîa'nın Yezîd'e lanetine tepkiyle Yezîd ve Şeyh Adî etrafında gulüv başladı; tarikat Yezîdîliğe dönüştü."},{"k":"li","x":"1259 Hülâgû tahribatından sonra Irak, Suriye ve Anadolu'ya dağıldılar. Osmanlı'da kâfir sayıldıkları fetvalarla zor dönemler yaşadılar; 1872'de Ehl-i kitap kabul edildiler."}]},{"h":"İnanç","b":[{"k":"li","x":"**Hudâ:** Dünyayı uzaktan yöneten iyi tanrı; yetkilerini **yedi meleğe** devreder."},{"k":"li","x":"**Melek Tâvûs:** Âdem'e secde etmeyen ama affedilip dünyanın yönetimi kendisine bırakılan baş melek; tavus kuşu biçiminde tasavvur edilir."},{"k":"li","x":"**Tenâsüh** inancı vardır."},{"k":"li","x":"**Kutsal metinler:** **Kitâbü'l-Celve** ve **Mushaf-ı Reş**; ikisi de sonradan yazılıp Şeyh Adî çevresine nispet edilmiştir (Yaltkaya'nın tespiti)."}]},{"h":"İbadet ve Toplum","b":[{"k":"tbl","r":[["Konu","Uygulama"],["Namaz","Sabah ve akşam güneşe dönük dua"],["Oruç","Yılda iki kez üçer gün"],["Hac","Lâliş'teki Şeyh Adî türbesi, 15-20 Eylül"],["Vergi","Şeyhe %10, pîre %5, fakirlere %2,5"],["Hiyerarşi","Emîr, şeyh, pîr, kavvâl, fakir, mürid; tabakalar arası evlilik yok"],["Yasaklar","Mavi renk, bazı yiyecekler (marul, fasulye, balık vb.), \"şeytan\" kelimesi"]]},{"k":"p","x":"**Günümüz:** Irak'ta Şeyhân ve Sincar, ayrıca Suriye, İran, Kafkasya ve Türkiye'nin güneydoğusu; Batı'ya önemli göç; toplam 300-400 bin."}]}]}},{"t":"Bâbîlik ve Bahâîlik","intro":"Şeyhîlik ve Bâbîliğin doğuşu, Bâb'ın iddiaları, Bahâullah ve Bahâîliğin gelişimi, idari düzeni, inanç esasları, öğretileri, ibadetleri ve günümüzdeki durumu.","s":[{"h":"Bahailiğin Ortaya Çıkışını Hazırlayan Sebepler","b":[{"k":"p","x":"**a. Sosyo-kültürel ve Dini Sebepler:** Şiî-İmamilerin hâlen gaybette olan on ikinci imamın dönüşünü bekleme şeklindeki bu kurtarıcı/ mehdi inancı, pek çok kez istismar edilmiş, farklı farklı kişiler mehdi iddiasıyla ortaya çıkarak taraftar toplamaya çalışmışlardır. Babîlik ve sonrasında Bahaîlik hareketi de böyledir."},{"k":"p","x":"**b. Siyasi Sebepler:** İran'da hüküm süren siyasi istikrarsızlık, huzursuzluk halkı yeni birtakım arayışlara itmiştir. 19. asrın başlarında ortaya çıkan Şeyhîlik, Babîlik ve sonrasında Bahaîlik hareketlerinin halk nazarında belli bir oranda taraftar bulmasında dönemin siyasi yapısı, ekonomik ve kültürel durumunun etkili olduğu anlaşılmaktadır."}]},{"h":"Bahailiğin Tarihçesi","b":[{"k":"h","x":"a. Şeyhîlik Tarikatı"},{"k":"li","x":"Mehdilik inancının Babîliğe, oradan da Bahailiğe taşınmasında Şia içerisinde ortaya çıkan ve Şeyhîlik adıyla bilinen tarikat köprü vazifesi görmüştür. 12. İmam'ın gizlenmesinden sonra, Şiilere yol göstermek üzere “ **Kamil bir Şii\"** nin varlığını gerekli görmüştür. Bu kişi 12. imamla irtibat sağalayacak olan **Şeyh Ahmed Ahsai** 'dir."},{"k":"li","x":"Ahmed el-Ahsai, Irak, Necef ve Kerbela'da iken dönemin İmamiyye ulemasının içine düştüğü buhran ve bölünmeler hakkındaki tartışmaları yakından takip etmiş, Irak'ta her iki okulun mensuplarıyla temaslarda bulunmuşsa da, ne Usûlî okulun akılcılığına, ne de Ahbarî okulun muhafazakârlığına mensup olduğunu açıklamıştır."},{"k":"li","x":"O, İmamiyye'nin beş iman esasını tevhit, nübüvvet ve imamet olmak üzere üçe indirmiş; daha sonra buna “kâmil şii\" adıyla dördüncü bir inanç esası eklemiştir. Her ne kadar Kamil Şii'nin kendisi olduğunu açıkça söylememişse de yaptığı tasvirlerle işaret etmiştir."},{"k":"li","x":"İlmi ve zühdü ile şöhret kazanan, etrafında geniş bir talebe ve hayran kitlesinin doğmasını sağlayan Ahsai, ortaya koyduğu görüşleri sebebiyle Şii ulemanın tenkidine uğramış ve tekfir edilmiştir. Hakkındaki suçlamalardan tedirgin olan Ahsai, yerini **Kâzım Reşti** 'ye bırakarak Mekke ve Medine'ye gitmeye karar vermiştir. Kâbe'yi ziyaretten dönerken 1242/1828 yılında 81 yaşında iken vefat etmiştir."},{"k":"li","x":"Reştî'nin önderliğinde Şeyhîlik hareketi, Şiilik içinde teşkilatlı bir yapı haline gelmiştir. Şeyhîlik inanışını açıkça ortaya koymuştur. Reştî, ölmeden önce 12. İmam'ın insanlar arasına dönme zamanının geldiğini bildirmiştir. Onun, talebelerinden **Mirza Ali Muhammed'e**, teveccüh ettiği bilinmekte ve Mehdi tasvirlerinde bu talebesini anlattığı söylenmektedir. Kâzım Reşti 1259/1843 yılında 60 yaşındayken ölmüştür."},{"k":"li","x":"Açıktan bir halef tayin etmeden ölmesi, pek çok gruba ayrılmalarına sebep oldu. Bunlardan Mirza Ali Muhammed'in önderlik ettiği grup **\"Babîlik** \"; Hacı Kerim Han Kirmanî'nin önderlik ettiği gruba “ **Kirmaniyye** \"; yine Reşti'nin müritlerinden Hacı Mirza Şefi'nin liderlik ettiği gruba da “ **Şefiyye** \" kolu denilmiştir."},{"k":"h","x":"b. Babîlik Hareketi ve Ortaya Çıkışı"},{"k":"li","x":"Şiîler, imamın manevi nurunu aksettirecek ve kendileriyle imam arasında irtibatı sağlayacak kâmil bir Şii'nin gerekliliğine inandıklarından \" **bab** \" fikri başlangıçtan itibaren bütün Şiî grupları içinde mevcut olmuştur. **\"Ben ilim şehriyim, Ali ise o şehrin kapısıdır (bab).**"},{"k":"li","x":"Babilik firkasının kurucusu Mirza Ali Muhammed daha değişik bir iddia ile kendisinin bab olduğunu ve beklenen mehdiye açılan kapının da yine kendisi olduğunu ileri sürmüştür."},{"k":"h","x":"c. Mirza Ali Muhammed'in Hayatı"},{"k":"li","x":"Mirza Ali Muhammed, 20 Ekim 1819'da (1 Muharrem 1235) Şiraz'da doğdu. Dayıları onu medreseye verdiler ama dersleriyle ilgilenmediler (Bunu vehbi ilim sahibi olduğuna işaret sayarlar). Daha sonra ticaret için Bûşehr'e gönderdiler. Ancak o, Hurufiliğin tesiriyle gayri tabii davranışlara girişti. Şifa bulması için gönderildiği Kerbelâ'da, Seyyid Kâzım Reşti (ö. 1259/1843) ile tanıştı ve onun tesirinde kaldı. Kısa zamanda Reşti'nin en gözde talebesi oldu. Babîlere göre Kâzım Reştî, isim vermeksizin birtakım nitelemelerle Mirza Ali'nin mehdi olduğunu söyledi."},{"k":"li","x":"Hocasının ölümü üzerine 22 Kasım 1844 (h.1260) tarihinde, Şiraz'da, kendisinin beklenen imama açılan Bab olduğunu açıkladı. Bununla da yetinmedi aynı sene Mekke'de veya Maskat'ta “beklenen mehdi\" (el-mehdiyyü'l-muntazar) olduğunu ilan etti. Onun bu iddiası ilk anda Şeyhilerden on sekiz kişi tarafından kabul edilmiştir. Hesaplara göre 19 sayısı ona işaret ediyordu! (19 sayısı Babîlik'te ve Bahaîlik'te mukaddes bir rakamdır)"},{"k":"li","x":"Onun kendi davasını ilk ilan edeceği yer olarak Mekke'yi seçmesinin nedeninin Şii kaynaklarda geçen “Mehdi'nin Mekke'de ortaya çıkacağına dair rivayet” olabileceği düşünülmektedir."},{"k":"li","x":"1845 ilkbaharından itibaren Şiraz, Tahran, Isfahan ve Tebriz'de dâîleri vasıtasıyla iddiasını yaymaya çalıştı. İleride Bahaîlik adı altında hareketin gelişmesini sağlayacak olan **Mirza Hüseyin Ali,** kardeşi **Mirza Yahya en-Nûrî** ve **Zerrîntâc** Babiliğin saflarında yer almıştı."},{"k":"li","x":"Ancak zıt fikirlerin propagandasını yapması halktan ve Şii ulemadan ciddi tepkiler almaya başladı. Isfahan valisi tarafından yakalanıp Azerbaycan'da üç yıl hapsedildi. Mahkeme sonucunda idama mahkûm edildi. Bab, Tebriz'de bütün iddialarından vazgeçtiğine dair bir mektup yazmışsa da Şii ulema tarafından bağışlanmadı ve kendisine mürted (dinden dönme) cezası uygulanmasına karar verildi. Tebriz'de **kurşuna dizilerek öldürüldü** (9 Mayıs 1850). Cesedi, atıldığı hendekten taraftarlarınca alınarak Tahran'a götürüldü, yirmi yıl saklı tutulduktan sonra Bahaullah'ın isteğiyle Akka'da Kermil dağına gömüldü."},{"k":"li","x":"**Diğer üç isim**, Rus ve İngiliz hükümetlerinin baskıları üzerine idam edilmeyip Bağdat'a sürgün edildiler. Bu Babiliğin, Bahaîlik adı altında devam etmesinin başlangıcıdır."}]},{"h":"Babîliğin Temel Görüşleri","b":[{"k":"li","x":"Mirza Ali Muhammed, bu davaya başlama nedenini gördüğü bir rüyaya bağlar. Ancak bu isabetli değildir. Mirza Ali'nin bu davaya kendisini henüz talebeyken hazırlamış olması kuvvetle muhtemeldir."},{"k":"li","x":"“ **Bablık** ” iddiasını Kur'an ve hadislerden iki temel delile dayandırmaktadır. Bunlar **“Evlerinize kapılardan (bab) giriniz.\"** (Bakara 2/189) ayeti ile **\"Ben ilmin şehriyim, Ali de kapısıdır.\"** hadisidir. Bir süre sonra bablığı da aşarak \" **Beklenen Mehdi** \" olduğunu, kaybolan Mehdi'nin ruhunun kendisine hulul ettiğini söylemiştir."},{"k":"li","x":"Bunlarla da yetinmeyen Mirza Ali, bir müddet sonra **peygamberlik iddia** etmeye başlamıştır. Kendisinin Hz. Muhammed'den, Beyan'ın da Kur'an'dan daha üstün olduğunu iddia etmiştir."},{"k":"li","x":"Bununla da yetinmemiş kendisine “ **el'ala” (en yüce)** unvanını vermiştir (Uluhiyet iddiası). Ayrıca o, \"bismillah'taki “b'nin altındaki noktayı kastederek kendisine “nokta” veya “noktatu'l-beyan\", gibi unvanlar da vermiştir. Bununla; \"b\" olmadan bismillah denemediği gibi, kendisi olmadan da Tanrı'ya gidilemeyeceğini kastetmiş olmalıdır."},{"k":"li","x":"Mirza hapisteyken Babiliğin önemli isimleri (81 kişi) toplantı yaparak eski şeriatin nesh edilip yerine yeni ve daha üstün bir şeriatin getirildiği fikri kabul edilmiştir. Toplantı sonunda **Babîliğin İslam'dan ayrı bir din olduğu ilan edilmiştir**."},{"k":"li","x":"Babilere göre **ahiret hayatı** ve ahvali, içerisinde yaşadığımız bu dünyada gerçekleşmektedir. Öte taraf tan vahyin son bulması düşünülemez ve peygamberlik de son bulmayacaktır."},{"k":"li","x":"Bab'ın küçüklü büyüklü pek çok eseri vardır. En meşhur eseri hapiste iken yazdığı **el- Beyan'** dır. Beyan kitabının Allah tarafından gönderildiğini, Kur'an'dan üstün olduğunu ve Kur'an'ın kendisinin geleceğine işaret ettiğini iddia eden Bab, buna delil olarak da Rahman suresinin ilk dört ayetini gösterir. Beyan kitabının gramer ve dilbilgisi kuralları açısından zayıf ve hatalarla dolu olduğu görülmektedir. Bab bu durumu \"Allah'ın insanların koyduğu kurallara uymak zorunda olmadığını\" söyleyerek açıklamaya çalışmıştır."},{"k":"li","x":"Cenaze namazı dışında cemaatle ibadet kaldırılmıştır. Zekât olarak malların beşte biri verilir. Bab Mirza'nın doğum yeri olan Şiraz ile hapsedildiği yerler hac merkezi olarak kabul edilmiş tir. Sigara içmek, alkollü içki kullanmak, dilencilik yapmak ve dilenciye para vermek yasaklanmıştır. Boşanma caiz, fakat hoş görülmeyen bir husustur. Dul erkekler boşandıktan doksan gün, dul kadınlar da doksan beş gün sonra tekrar evlenmeye mecburdurlar, aksi hâlde cezaya çarptırılırlar."},{"k":"h","x":"a. Bahaîlik ve Mirza Hüseyin Ali"},{"k":"li","x":"Hareket ilk etapta İslam dinine bağlı bir oluşum (Babîlik) iken, **Bedeşt toplantısı** nda Mirza Hüseyin Ali'nin çabalarıyla kendini İslamiyet'ten bağımsız bir din olarak ilan etmiştir. Bab'ın ölümünden sonra onun yerine geçen Mirza Hüseyin Ali, bir süre sonra kendi peygamberliğini ilan etmiş ve Bahaîlik dinini kurmuştur."},{"k":"li","x":"Bahaullah adıyla anılan Mirza Hüseyin Ali, 12 Kasım 1817/2 Muharrem 1233 günü Tahran'da doğdu. Ailesi saray mensubudur ve bu yüzden iyi bir tahsil görmüştür. Ancak Bahaîler onun ilminin tamamen vehbi olduğunu iddia ederler."},{"k":"li","x":"27 yaşında iken Bab Mirza Ali Muhammed'in Tahran'a propaganda için gönderdiği Molla Hüseyin ile karşılaştı (1844) ve hemen Bab'a bağlanarak görüşlerini yaymaya başladı."},{"k":"li","x":"Mirza Hüseyin Ali, Bab'ın idam edilmesinin akabinde teşkilat içindeki konumunu daha da sağlamlaştırdı. Tahran'da Babilerin intikamını almak için 1852'de Şah'a karşı düzenledikleri başarısız suikast sonucu diğer 22 Babî ile birlikte tutuklanarak hapsedildi. Ancak Rus ve İngiliz hükümetlerinin baskılarıyla Bağdat'a sürgüne gönderildiler. İki yıl kadar Süleymaniye dağlarında münzevi bir hayat yaşadı. Bu süreçte tasavvufla ilgilenip, **Saklı Sözler**, **Yedi Vadi** ve **İkan** kitaplarını yazdı. Daha sonra Bağdat'a geri dönüp faaliyetlerine devam etti. İran ve Osmanlı hükümetleri arasında varılan anlaşmaya dayanarak Nisan 1863'te taraftarlarıyla birlikte önce İstanbul'a, dört ay sonra da Edirne'ye sürgün edildi."},{"k":"li","x":"Mirza Hüseyin Ali, Edirne'de iken kendisine **“Bahaullah** \" adını verdi. Bu ismi tercihinde İmam Muhammed Bakır'dan rivayet edilen duada, **'Allah'ın Bahası'** yani ululuğu, güzelliği, ifadesi geçmektedir. Böylece \"Yıllardır dua ederek benim adıma yalvarıyordunuz.\" demek istemiştir."},{"k":"li","x":"Mirza Hüseyin Ali'nin kendisini Bahaullah olarak ilan etmesi ve insanlar kendi dinine davet etmesi kardeşi Mirza Yahya ile arasını iyice açar. Aralarındaki düşmanlık birbirlerinin yemeklerine zehir koydurtmaya kadar gider. Bunun üzerine İran'ın İstanbul sefareti iki kardeşi birbirinden ayırmaya karar verir. Böylece Babilik iki gruba ayrılır. Mirza Hüseyin Ali ve taraftarlarına **Bahaiyye**, Mirza Yahya ve arkadaşlarına **Ezeliye** veya **Beyaniyye** denir."},{"k":"li","x":"Bahaullah, sürgün edildiği Akka'da faaliyetlerine devam etmiş; valiler ve kumandanlarla iyi ilişkiler kurmuştur. Fırsat buldukça Hayfa'ya gitmiş ve Kermil Dağı'nı ziyaret etmiştir. Burası Bahaîlerce kutsal kabul edilmektedir. 29 Mayıs 1892 tarihinde 75 yaşında iken Akka'da ölmüştür. Ölmeden önce büyük oğlu Abbas Efendi'yi, Bahailerin önderi tayin etmiştir."},{"k":"h","x":"b. Bahaullah'tan Sonra Bahaîlik"},{"k":"h5","x":"1. Abbas Efendi (Abdulbaha) Dönemi"},{"k":"p","x":"Abbas Efendi, okumayı sevmemekle birlikte âlimleri hayrete düşürecek bir bilgiye sahipmiş. 1892 yılında hareketin propagandasını yapmak üzere Dr. İbrahim Hayrullah'ı Amerika'ya gönderen Abbas Efendi o güne kadar doğuda faaliyet gösteren Bahaîliğin batıya da açılmasını hedeflemiş ve bu girişimi sayesinde Bahaîlik New York ve Washington'da taraftar bulmuştur."},{"k":"p","x":"Batı dünyasına seyahatler düzenlemiş; bu seferleri sırasında Yahudi ve Hristiyan din adamları ile görüşmüş; kilise, sinagog ve camilerde konuşmalar yapmıştır. 1913 yılında Hayfa'ya gelerek burasını Bahailiğin ana merkezi yapmıştır. Birinci Dünya Savaşı sırasında İngilizler lehine gösterdiği gayretlerden dolayı Hayfa'da 1920 yılında İngiliz Hükümeti tarafından **\"Şövalyelik\"** rütbesi ile ödüllendirilmiştir. Bab'ın mezarını Hayfa'ya getirtmiş (1909) ve Kermil Dağ’ına defnettirmiştir. 28 Kasım 1921'de 78 yaşında iken ölmüştür. Bab'ın yanına defnedilmiştir."},{"k":"p","x":"Onun döneminde Bahaîler, İran'da da çeşitli okullar, hastaneler vb. sosyal yardım kurumları açarak görüşlerinin yayılmasına gayret etmişlerdir."},{"k":"h5","x":"2. Şevki Efendi Dönemi"},{"k":"p","x":"Akka'da doğmuştur (1897). Ailenin Hayfa'ya taşınması üzerine tahsiline Hristiyan okullarında devam etmiştir. Kolejden mezun olduktan sonra Oxford Universitesine giden Şevki Efendi, burada okumakta iken dedesi ölmüştür. Dedesinin vasiyeti ile 24 yaşında iken (1922) **“Veliyy-i Emr/ İlahi Emrin Yürütücüsü”** sıfatıyla Bahailer'in başına geçmiştir."},{"k":"p","x":"Şevki Efendi 36 yıllık hizmeti esnasında Bahaullah ve Abdulbaha’nın yazılarından İngilizceye yaptığı ciltler dolusu çeviri ve yazdığı kitaplarla Bahaîliğin Batı'da yayılması için çalışmıştır. 4 Kasım 1957 yılında Londra'da vefat eden Şevki Efendi buraya defnedilmiştir. Ölmeden önce “Baş Koruyucular\" adını verdiği ve Bahailerce **\"Emrin Elleri\"** denen 27 yardımcı tayin etmiştir. Bunlar, Bahaîliğin bütün dünyada yayılması için çeşitli çalışmalar yapmışlardır, 1963 yılında Milletlerarası Büyük Kongre tertip edilmiş, **Umumi Adalet Evi** kurulmuştur."}]},{"h":"Bahaîlerin idari Düzeni","b":[{"k":"p","x":"Umumi Adalet Evi'nin kurulmasından sonra Bahaîliğin idaresini burada bulunan dokuz kişi üstlenmiştir. Her şehir, köy veya kasabada kurulan idari teşkilata **Mahalli Ruhani Mahfil** denilmektedir. **Bunların görevleri**, Bahaullah'ın mesajlarını yaymak, kendi topluluk üyeleri arasında sevgi ve birliği geliştirmek; insanlara yardım etmek; gençlere destek olmak; çocukların eğitimine katkı vermek; Bahailik konusunda çeşitli yayınların yapılmasını sağlamak ve Bahailer için düzenli toplantılar tertip etmektir."},{"k":"p","x":"Umumi Adalet Evi, kitapta konulmamış kanunlar koyar, Bahaullah, Abdulbaha ve Şevki Efendi'nin koyduğu kuralları kaldıramaz, ancak yorumlayabilir. Üyeler masumdur."}]},{"h":"Günümüzdeki Durum","b":[{"k":"p","x":"Günümüzde Bahaîlerin sayılarının dünyada beş milyon, Türkiye'de ise 10 bin kadar olduğu iddia edilmektedir. Bahailerin dünyada 148 ülkede örgütlendikleri, 7 Radyo istasyonlarının bulunduğu, 29'u akademik olmak üzere toplam 84 adet okullarının bulunduğu söylenmektedir."},{"k":"p","x":"Bugün idari merkez durumundaki İsrail'in Hayfa şehrinde bulunan Umumi Adalet Evi'nden sonra gelen en önemli merkez Amerika'da İllions eyaletinde Wilmettete'dir. Dünyanın muhtelif yerlerinde **Meşriku'l-Ezkar** adı verilen Bahaî mabetleri bulunmaktadır."}]},{"h":"Bahaîliğin İnanç Esasları","b":[{"k":"h","x":"a. Allah İnancı"},{"k":"li","x":"Tevhid inancına bağlı olduklarını söylemelerine rağmen Tanrı'nın peygamberlerde ve özellikle Bahaullah'ta tecelli ettiğini kabul ederler. Onlara göre Tanrı her şeyi kuşatmıştır. Her şeyi kuşatan bir varlığın kuşatılması mümkün değildir. Bu itibarla Tanrı, ancak gönderdiği elçiler vasıtasıyla bilinebilir. Bahaullah bu zatları **“Tanrı'nın Mazharları\"** olarak nitelemektedir. Bahaullah'a göre peygamberlerin beşerî ve ilahi olmak üzere iki vasfı vardır. Bahaullah'da kendisini bir nevi ilah olarak görür."},{"k":"h","x":"b. Peygamberlik İnancı"},{"k":"li","x":"Bir peygamberler zümresinin varlığı aklen zorunludur. Peygamberler üç sınıftır: **Birincisi** bedensel (cismani), **ikincisi** insani yani nefs-i natika, **üçüncüsü** ise Tanrısal zuhur veya Rabbani görünüştür. Bu üçüncü makamın başlangıcı ve sonu yoktur."},{"k":"li","x":"Peygamberlerin temelde üç tane görevi vardır. **Birincisi**; manevi ve ahlaki gerçeklerin yenilenmesidir. **İkincisi**; bulundukları asrın icaplarına göre sosyal kanun ve doktrinlerin getirilmesi, **üçüncüsü** ise; dinlerin gelişmelerini sağlamaktır."},{"k":"li","x":"Bütün nebiler ve resuller, Baha'yı müjdelemek için gönderilmişlerdir. Bahailere göre peygamberlik, Müslümanların düşündüğü gibi ne son bulur, ne de Hz. Muhammed son peygamberdir."},{"k":"li","x":"Bahailer Hz. Muhammed dâhil gönderilen bütün peygamberlerin peygamberliğini kabul etmekte; ayrıca Müslümanlar tarafından peygamber olarak kabul edilmeyen Buda, Krişna ve Zerdüşt gibi kişilerin de peygamber olduğuna inanmaktadırlar. Bahaullah bunların en üstünüdür."},{"k":"li","x":"Bahailere göre bütün dinler Allah tarafından gönderilmiş olmaları itibariyle birdir; ancak her dinin diğer dinlerden farklı yönleri de mevcuttur. Dinlerin esasları hiçbir devirde değişmez; değişen kısmı ancak şer'i hükümleridir."},{"k":"h","x":"c. Melek ve Şeytan inancı"},{"k":"p","x":"Araştırmacılar Bahaîlerin meleklere inanmadıklarını ya da melekleri Tanrı'nın tabiata koyduğu kanunlar şeklinde izah ettiklerini belirtirler. İyi insanı meleğe, kötü insanı da şeytana benzetirler. Dört melek semboliktir. Şeytan konusunda fikirleri yoktur."},{"k":"h","x":"d. Kutsal Kitap İnancı"},{"k":"li","x":"Bahailer, Bab ile Bahaullah tarafından yazılan eserleri kutsal kabul ederler. Ayrıca Abdulbaha ve Şevki Efendi'nin, Bahaullah'ın eserlerini yorumlama yetkisine sahip olmaları dolayısıyla bu ikisi tarafından yazılan eserler de ikinci derecede kaynak olarak kabul edilir."},{"k":"li","x":"Önceki peygamberleri ve kitaplarını kabul ederler, ancak bunların dönemlerinin sona erdiğini ve hükümlerinin neshedildiğini iddia ederler. Onlara göre Bab Mirza Ali Muhammed'in kitabı **Beyan** da Allah tarafından gönderilen kutsal bir kitaptır. Diğer kutsal kitaplar Bahaullah'ı müjdeler. Kur'an'da onu müjdeleyen bölümler tahrif edilmiştir."},{"k":"li","x":"**Kitab-ı Akdes** Bahaîliğin temel kitabıdır. \"Ümmül Kitap\" olarak isimlendirilen bu eser, önceki bütün ilahî kitapların hükmünü ortadan kaldırmıştır. Onlara göre peygamber ve kitap gönderilmesi hiçbir zaman son bulmaz. Bahaullah'tan sonraki peygamber ondan bin sene sonra gelecektir."},{"k":"h","x":"e. Ahiret inancı"},{"k":"li","x":"Bahailer göre ölüm bir yok olma değil aksine yeni bir başlangıçtır. Ölüm, insanın Tanrı'ya olan manevi yolculuğunun başlangıcıdır. Ruhumuz vücudumuzdan ayrıldıktan sonra yaşamına devam eder ve Tanrı melekutunda ilerler. Fakat maddi bir şekilde dünyaya tekrar gelmez. Cesetlerin yeniden dirilmesi söz konusu değildir."},{"k":"li","x":"Bahaîlere göre kıyamet; bir din veya şeriatin zamanla tazeliğini ve gücünü kaybettiği dönemde ilahî bir elçinin ayağa kalkması demektir. Yani her bir peygamberin ortaya çıkması, önceki dinin kıyameti anlamına gelir."},{"k":"li","x":"Bahailer cennet ve cehennemin var olduğuna inanırlar. Cennet ve cehennemin hem dünyada cismani olarak hem de öbür dünyada ruhani olarak var olduğunu kabul ederler. Bahai inancında yeniden dirilmenin bedenen değil, ruhen gerçekleşeceği hususu dikkat çeker. Akıl bunların mahiyetini idrak edemez."}]},{"h":"Bahai Öğretileri","b":[{"k":"p","x":"**a. İnsanlık Aleminin Birliği:** Bahaî dininin amacı; “İnsanlık âleminin birliği'ni sağlamaktır. Bu prensip din, dil, renk, ırk, sınıf ve cins farkı gözetmeksizin bütün insanların gerek ruhani hukukta, gerek ferdi ve ailevi hukukta eşit olmaları anlamına gelmektedir. Bu fikir Kur'an-ı Kerim'de ve Hz. Muhammed'in hadislerinde sık sık vurgulanmıştır."},{"k":"p","x":"**b. Gerçeğin Araştırılması:** Günümüzde yaşanan din ve mezhep savaşlarının temel nedeni insanların gerçeği araştırmayıp, atalarının dinini kör bir taklitle devam ettirmeleridir."},{"k":"p","x":"**c. Bütün Dinlerin Birliği:** Bütün dinlerin esasta bir olduğuna, dolayısıyla din kavgalarının anlamsız olduğuna inanırlar."},{"k":"p","x":"**d. Din ve Bilim Arasındaki Ahenk:** Bahailere göre insanlığın ilerleyebilmesi için iki şeye ihtiyaç vardır ki, bunlar; din ve bilimdir. Bilim olmazsa din; hurafe ve batıl inançlardan ibaret olur. Aynı şekilde din olmazsa bilim insanlığı savaş, kavga ve kaosa sürükler."},{"k":"p","x":"**e. Kadın-Erkek Eşitliği:** Kadın-erkek arasında Allah katında hiçbir farklılık yoktur. İnsanlığın gelişip ilerleyebilmesi için kadınların da eğitilmesi ve geliştirilmesi gerekir. Kadın âlemi fazilet ve erdemlikte erkek âlemine eşit olmaz ise, insanlığın başarı ve gelişmesi gereken düzeyin gerisinde kalacaktır. Kadın vurgusuna rağmen, **Umumi Adalet Evi** üyeliğine sadece erkekleri seçmelerinin nedeni açıklanmamıştır."},{"k":"p","x":"**f. Taassupların Kaldırılması:** İnsanlar arasındaki savaşların nedenini taassuplara bağlayan Bahailer, bu taassupların başında din taassubu, milli, ırki ve cinsi taassuplar ile vatani taassupların geldiğine inanırlar. Bu değerlerin sevilmesinde sakınca görmezler."},{"k":"p","x":"**g. Dünya Barışı:** Bahaîler, savaşın olmadığı bir dünya barışı tasavvur ederler. Onlara göre, Bahaullah'ın yasalarına uyulduğu zaman bu barış gerçekleşmiş olacaktır."},{"k":"p","x":"**h. Genel ve Mecburi Eğitim:** Eğitimde kız-erkek eşitliğine vurgu yapan Bahailik erkek çocukları kadar kız çocuklarının eğitimine de önem verilmesini istemektedir. Eğitim sadece okuma-yazma değildir. İnsan rkına hizmet edebilecek şekilde eğitimi benimserler."},{"k":"p","x":"**ı. Aşırı Zenginlik ve Fakirliğin Kaldırılması:** Aşırı zenginlik gibi aşırı fakirlik de sınırlandırılmalıdır. Bahai iktisat felsefesi; işbirliği, yardımlaşma ve toplumun menfaatinin kendi menfaatinden önce düşünülmesi üzerine kurulmuştur. Bahai iktisadında tam eşitlik söz konusu değildir, ekonomide denge sağlanmalıdır."},{"k":"p","x":"**i. Evrensel Yardımcı Dil:** Dünyadaki anlaşmazlıkların bir nedeni de insanların birbirlerinin dillerinden anlamamalarıdır. Evrensel bir dil dünyanın her yerinde öğretilmelidir. Kişiler nereye giderlerse gitsinler birbirlerini anlayacakları için kendilerini evlerinde hissedeceklerdir."},{"k":"p","x":"**k. Milletlerarası Bir Mahkemenin Kurulması:** Devletler arasındaki ilişkileri düzenleyecek beynel milel yüce bir mahkeme kurulmalıdır. Böyle bir mahkeme kurulmadıkça insanlık âlemindeki savaş ve saldırıların önüne geçilemez. **Kısaca bunların hedefi bütün dünyayı** birleştirmek ve tek tip insan oluşturmaktır."}]},{"h":"Bahaî Dininde İbadetler ve Bazı Uygulamalar","b":[{"k":"li","x":"Bahailik, eğer insanlığa hizmet etme isteğine dayanıyorsa insanın çabasını ibadet olarak kabul eder."},{"k":"li","x":"İbadetlerden önce **abdest** almak şarttır. El ve yüz yıkanır. Hem maddi hem manevi temizliktir. Su bulanmayan kimse **\"En temizlerin en temizi Allah'ın adıyla\"** sözünü beş kere tekrar eder."},{"k":"li","x":"**Namaz** Allah'ı anmaktır. 15 ile 70 yaşları arasında her kadın erkeğe farzdır. Namaz münferid kılınır. Kıble, Bahaullah'ın gömülü olduğu Akka şehridir. Büyük, orta ve küçük namaz olmak üzere üç namaz vardır. Kaza ve cenaze namazı (cemaatle kılınır) da vardır."},{"k":"li","x":"**Oruç**, güneşin doğuşundan batışına kadar yeme içme ve kötü işlerden uzak durmaktır. Yolcu, hasta, hamile veya emzirenler için oruç farz değildir. Âdetli kadına da farz değildir. 15 ile 70 yaş arasında farzdır. Ala ayında, 19 gün tutulur (2 Mart-20 Mart)"},{"k":"li","x":"**Hac**, Bahaullah’ın sürgündeyken Bağdat'ta oturduğu evini veya Bab'ın Şiraz'daki evini ziyaret etmeleridir ve farzdır. Belli bir vakti yoktur. Kadınlar muaftırlar."},{"k":"li","x":"**Zekât** farzdır. Zekâtı kimlerin vereceği, ne zaman ve ne miktarda zekât verilmesi gerektiği vb. hususlar açıklanmamış, sadece bunun hükümlerinin Kur'an-ı Kerim'in hükümleriyle aynı olduğu söylenmekle yetinilmiştir."},{"k":"li","x":"Bahaîlikte zekâtın dışında mali bir ibadet olarak **Tanrı Hukuku** adında başka bir ibadet daha vardır: Buna göre her Bahai sahip olduğu para veya mal gibi taşınmaz eşyaları 19 miskal altın değerine ulaştığında, bu 19 miskal ve katlarından Tanrı Hukuku vermeye mecburdur."},{"k":"li","x":"**Mabet** lerinin adı **Meşrikul Ezkar** 'dır. Dokuz yönlü ve dokuz kapılıdır. Kapılardan her biri Sabilik, Brahmanizm, Budizm, Yahudilik, Hristiyanlık, İslamiyet, Zerdüştilik, Babîlik ve Bahaîlik dinlerini temsil eder. Arka kapısının bulunmamasının sebebi bütün insanlığa açık olduğunu simgelemektedir. Din adamlığı yoktur, münferid dua vardır."},{"k":"li","x":"**Nikâh ve cenaze törenleri** gibi görevler, Mahalli Ruhani Mahfiller tarafından yerine getirilir. Mabedin çevresinde okullar, bakım evleri, öksüz yurtları ve toplumun yararına açık olacak hayır kurumları, hastaneler ve bahçeler yapılmaktadır."},{"k":"li","x":"**Evlenme**: Evlenme makbuldür teşvik edilmiştir, mecbur değildir. Çiftlerin kendi rızaları ve ebeveynlerinin rızaları alınmalıdır. Evlenme yaşı her iki cins için de 15'tir. Nişan ve nikâh arası 95 günden fazla olamaz. Nikâh ve gerdek aynı gündedir. Bir Bahaî, diğer dinlerden olanla evlenebilir. Resmî nikahtan sonra Mahalli Ruhani Mahfil Bahaî nikahını kıyar. Tek evlilik esastır. Mut'a yoktur."},{"k":"li","x":"**Boşanma**: İzin verilmiş ama hoş değildir. Boşanmada da Mahalli Mahfilin onayı önemlidir. O, önce bir senelik süre tanır. Buna **sabır yılı** denir. Bu süre sonunda anlaşma olmazsa Mahfil bunları ayırır."},{"k":"li","x":"**Miras ve Vasiyetname**: Ölmeden önce vasiyetname yazmak farzdır. Eğer kişi ölürken arkasında bir vasiyetname bırakmamışsa o zaman miras Akdes'te belirtildiği üzere taksim edilir. Bazı durumlarda ölen kişinin mal varlığından Yüce Adalet Evi'ne de pay ayrılır."},{"k":"li","x":"**19 Sayısının Kutsallığı**: Bab, mehdilik iddiasıyla ortaya ilk çıktığında ona 18 kişi iman etmiştir, bu sayı kendisiyle birlikte 19'a ulaşmaktadır. Bu kişilere **Huruf-u Hay** denilir. Bahai yılı her biri 19 günden oluşan 19 aydan ibarettir ve her birinin ayrı bir adı vardır. Bahailik'te hafta yedi günden ibarettir. Tatil yani dinlenme günü olarak Cuma günü seçilmiştir."},{"k":"li","x":"Bahai dininde yedi tanesi bayram, iki tanesi de Bab'ın ve Bahaullah'ın ölüm günleri olmak üzere, **yıl boyunca toplam dokuz günde çalışmak haramdır**. Bu günler: **Nevruz Bayramı**; Bahaullah'ın ilk vahyini aldığı! **Rızvan Bayramı**; Bab'ın emrini açıkladığı **Bi'set Günü/Bayramı**; Bahaullah'ın **vefat ettiği gün**; Bab'ın öldürüldüğü günü; Bab'ın doğum günü; Bahaullah'ın doğum günüdür."},{"k":"li","x":"Bahaîlik'te “ **hükümete sadakat** \" önemli bir kuraldır."},{"k":"li","x":"Önemli hükümlerden biri de **siyasi işlerden uzak durmasıdır**. Bu çerçevede Bahaîler herhangi bir partinin politikasına iştirak edemezler. Bahaîlik'te misyonerlik vazifesi vardır. Bahailerin **\"ocak başı toplantıları\"** adını verdikleri ve her ailenin en az 19 günde bir kere ocak başı toplantısı düzenlemesi zorunluluğu dinin yayılmasında önemli bir etkiye sahiptir."},{"k":"li","x":"Herhangi bir **giyim veya saç şekli** belirlenmemiştir, Herkes kendi toplumunda o gün hangi kıyafeti giyiyorsa, o tarz giyinmekte serbesttir."},{"k":"li","x":"Bahailikte **faiz de helal kılınmıştır**. **Musiki** güzel sanatların bir dalı sayılmış ve hoş görülmüştür. Zina ve fiili livata haramdır. İnançlar konusunda **takiyye** yasaklanmıştır."}]},{"h":"Bâbîlik ve Bahâîlik: Genel Bilgi","b":[{"k":"p","x":"Bâbilik ve Bahâîlik, İran'da doğmuş, Şii İslam geleneğinden beslenmiş ancak zamanla kendilerini İslam'dan ayrı birer din olarak ilan etmiş iki önemli akımdır."},{"k":"p","x":"İşte bu iki akımın özetle temel özellikleri:"}]},{"h":"Kökenler ve Ortaya Çıkışı","b":[{"k":"p","x":" **Mehdi İnancı ve Şeyhîlik:** Bâbilik ve Bahâîliğin ortaya çıkışında, Şii-İmamiliğin beklenen 12. İmam Mehdi inancı önemli bir rol oynamıştır. 19. yüzyılın başlarında İran'da yaşanan siyasi istikrarsızlık, zalimane yönetim ve ekonomik sıkıntılar, insanları bir kurtarıcı bekleme ümitlerini canlandırmıştır. Şii gelenekteki bu Mehdilik beklentisi, Şeyhîlik tarikatı aracılığıyla Bâbiliğe ve oradan da Bahâîliğe taşınmıştır. Şeyhîlik, 12. İmam'ın gizlenmesinden sonra Şiilere yol gösterecek \"Kamil bir Şii\"nin varlığını gerekli görmüş; tarikatın kurucusu Şeyh Ahmed Ahsai'nin \"gaybetteki imama açılan kapı\" (bâb) olduğunu iddia etmesiyle bu anlayış gelişmiştir. Şeyh Ahmed Ahsai'nin halifesi Seyyid Kazım Reşti de 12. İmam'ın döneceğini ve \"kapı\"nın açılacağını bildirmiştir."},{"k":"n","n":2,"x":"**Bâbilik (Kurucusu:** Mirza Ali Muhammed)"},{"k":"p","x":" **Bâb'ın Ortaya Çıkışı:** Seyyid Kazım Reşti'nin öğrencisi **Mirza Ali Muhammed** (1819-1850), hocasının ölümünden sonra (1843) Mehdi'nin zuhur ettiğini ilan etmek için uygun ortamı bulmuştur."},{"k":"p","x":" **\"Bâb\" İddiası:** 22 Kasım 1844'te Şiraz'da, kendisinin beklenen imama açılan **\"Bâb\" (Kapı)** olduğunu açıklamıştır. \"Ben ilmin şehriyim, Ali de kapısıdır\" hadisini bu iddiasına dayanak göstermiştir."},{"k":"p","x":" **\"Beklenen Mehdi\" ve Peygamberlik İddiası:** Bâblıkla yetinmeyip, Mekke veya Maskat'ta **\"beklenen Mehdi\" (el-mehdiyyü'l-muntazar)** olduğunu ilan etmiştir. Bu iddiayı, kaybolan Mehdi'nin ruhunun kendisine hulul etmesiyle açıklamıştır. Daha sonra peygamberlik ve hatta \"el'ala\" (en yüce) unvanıyla ilahlık iddialarında bulunmuştur."},{"k":"p","x":" **\"Beyân\" Kitabı:** Bâb, hapisteyken en meşhur eseri olan **\"el-Beyân\"**ı yazmıştır. Bu kitapta İslami hükümlerin kaldırıldığını ve yerine yenilerinin konulduğunu belirtmiş, cennet, cehennem gibi kavramları batıni tarzda yorumlamıştır. \"Beyân\"ın Allah tarafından gönderildiğini ve Kur'an'dan üstün olduğunu iddia etmiştir."},{"k":"p","x":" **İslam'dan Ayrılış:** 1848 yılında Bedeşt'te yapılan bir toplantıda, Bâbiliğin İslam'dan ayrı bir din olduğu ilan edilmiş, eski şeriatın kaldırılıp yerine yeni bir şeriatın getirildiği kabul edilmiştir."},{"k":"p","x":" **Kutsal Sayı 19:** Bâbilik ve Bahâîlikte **19 sayısı kutsal kabul edilir.** Bâb'a ilk inanan 18 kişiye kendisi de eklenince sayı 19 olmuştur. Bâbî takvimi 19 günlük 19 aydan oluşur."},{"k":"p","x":" **Uygulamalar:** Cenaze namazı dışında cemaatle ibadet kaldırılmış, zekat olarak malın beşte biri verilmesi öngörülmüştür. Şiraz (Bâb'ın doğum yeri) ve hapsedildiği yerler hac merkezi kabul edilmiştir. Sigara ve alkollü içki yasaklanmıştır."},{"k":"n","n":3,"x":"**Bahâîlik (Kurucusu:** Bahâullah)"},{"k":"p","x":" **Bahâullah'ın Ortaya Çıkışı:** Bâb'ın 1850'de idam edilmesinin ardından, Babiler arasında öne çıkan **Mirza Hüseyin Ali** (1817-1892), 1852'deki başarısız bir suikast girişimi sonrası Bağdat'a sürgün edilmiş ve bu tarih Bâbiliğin Bahâîlik adı altında devam etmesinin başlangıcı olarak kabul edilmiştir. Mirza Hüseyin Ali, bir süre sonra kendi peygamberliğini ilan ederek Bahâîlik dinini kurmuştur."},{"k":"p","x":" **Vadedilen Kimse İddiası:** Bahâullah, kendisinin tüm dinlerin \"vadedilmişi\" olduğunu iddia etmiş, Kur'an ayetlerini batıni yorumlarla bu iddiasını temellendirmeye çalışmıştır. Ayrıca Kur'an'ın tahrif edildiğini, kendisini müjdeleyen ayetlerin çıkarıldığını öne sürmüştür."},{"k":"p","x":" **\"Kitâb-ı Akdes\":** Bahâullah'ın yüz ciltten fazla eseri olup, temel kitabı **\"Kitâb-ı Akdes\"**tir. Bu eser, önceki tüm ilahi kitapların hükmünü ortadan kaldırmıştır."},{"k":"p","x":" **Tanrı Anlayışı:** Bahâîler, Tanrı'nın sınırlı insan aklı tarafından doğrudan kavranamayacağına inanır ve Tanrı'nın peygamberlerde ve özellikle Bahâullah'ta tecelli ettiğini kabul ederler. Peygamberler, Tanrı'nın birer \"Mazharı\" (yansıması) olarak görülür."},{"k":"p","x":" **Peygamberliğin Sürekliliği:** Bahâîliğe göre peygamberlik sona ermez; Hz. Muhammed son peygamber değildir. Allah, insan soyu var oldukça yeni peygamberler ve kitaplar göndermeye devam edecektir, ancak Bahâullah'tan sonraki peygamber bin yıl sonra gelecektir. Kıyamet ise bir dinin veya şeriatin gücünü kaybedip yeni bir ilahi elçinin gelmesiyle önceki dinin son bulmasıdır."},{"k":"p","x":" **Temel Öğretiler:** Bahâîlik, insanlık aleminin birliğini, gerçeğin bağımsızca araştırılmasını, tüm dinlerin birliğini, din ve bilimin uyumunu, kadın-erkek eşitliğini, dünya barışını, genel ve zorunlu eğitimi, aşırı zenginlik ve fakirliğin kaldırılmasını ve evrensel bir yardımcı dilin kullanılmasını savunan prensipler ortaya koymuştur."},{"k":"p","x":" **İbadetler ve Uygulamalar:**"},{"k":"li","x":"**Namaz:** Günde bir defa abdest alıp kıbleye dönerek 95 kere \"Allah-u Ebha\" söylemek farzdır. Cenaze namazı dışında cemaatle ibadet kaldırılmıştır."},{"k":"li","x":"**Oruç:** Bahâî yılının son ayı olan Ala ayında (2-20 Mart) 19 gün oruç tutulur. Bu, güneşin doğuşundan batışına kadar yeme içmeden uzak durmayı içerir. 21 Mart Bahâî yılbaşıdır."},{"k":"li","x":"**Hac:** Bahâî erkeklerinin Bahâullah'ın Bağdat'taki evi veya Bâb'ın Şiraz'daki evini ziyaret etmeleri farzdır. Kadınlar hacdan muaftır."},{"k":"li","x":"**Mali İbadetler:** Zekatın yanı sıra, belirli bir mal varlığına ulaşan Bahâîlerin **\"Tanrı Hukuku\" (Huququ'llah)** adıyla gelirlerinin bir kısmını Umumi Adalet Evi'ne vermeleri gerekir."},{"k":"li","x":"**Evlilik ve Boşanma:** Tek eşlilik esastır. Evlilikte ebeveyn rızası önemlidir ve 15 yaşından sonra evlenilebilir. Diğer din mensuplarıyla evlilik mümkündür. Boşanma hoş karşılanmasa da, bir yıllık \"sabır yılı\" sonrasında mümkündür."},{"k":"li","x":"**Vasiyetname:** Ölmeden önce vasiyetname yazmak farzdır."},{"k":"li","x":"**Tatil Günleri:** Yedi Bahâî bayramı ve iki ölüm günü olmak üzere yılda dokuz günde çalışmak haramdır."},{"k":"p","x":" **İdari Yapı:** Bahâîlikte yönetim, yerel ve ulusal düzeyde Ruhani Mahfiller ve dünya genelinde **Umumi Adalet Evi** tarafından gerçekleştirilir. Umumi Adalet Evi, 1963 yılında Hayfa'da kurulmuş ve Bahâîliğin en yüksek merciidir."}]},{"h":"Günümüzdeki Durumu ve Tartışmalar","b":[{"k":"p","x":" Bahâîliğin ortaya çıkışı ve Şeyhîlik tarikatına mensup olması, onun yeni bir din mi yoksa İslamiyet'in sapkın bir mezhebi mi olduğu tartışmasını gündeme getirmiştir. Bahâîler kendilerini müstakil bir din olarak kabul ederken, bazı Müslüman müellifler Bahâîliği, Yahudilik, Hristiyanlık ve özellikle İslamiyet görüşlerinin bir araya getirilmesiyle oluşmuş \"sapık bir mezhep\" olarak değerlendirir."},{"k":"p","x":" Türkiye'de Bahâîlik, devlet tarafından kabul edilmiş bir din değildir. Bu nedenle Türkiye Bahâîleri'nin ibadethaneleri bulunmamaktadır. Bahâîlikte ibadetlerde ve bazı prensiplerde belirgin bir hafifletme olduğu gözlemlenmektedir, bu da bazı kesimleri cezbetmektedir."},{"k":"h","x":" Bahailik (Bahaiyye)"},{"k":"li","x":"**Tanım ve Köken:** XIX. yüzyılın ortalarında İran'da ortaya çıkan bir dinsel harekettir. Babiliğin devamı niteliğindedir. Kurucusu Mirza Hüseyin Ali (Bahaullah)'dır."},{"k":"h5","x":"İnanç Esasları"},{"k":"p","x":" **Bahaullah'ın İlahlığı:** Bahailer, Bahaullah'ın Tanrı'nın zuhuru olduğuna ve O'nun aracılığıyla Tanrısal iradenin yeryüzünde tezahür ettiğine inanırlar."},{"k":"p","x":" **Dinlerin Birliği ve Dünya Barışı:** Bütün dinlerin tek bir kaynaktan geldiğine ve temelde aynı mesajı taşıdığına inanırlar. Dünya birliğini ve barışını amaçlayan evrensel bir dindir."},{"k":"p","x":" **Sürekli Vahiy:** Vahyin Hz. Muhammed ile son bulmadığına, aksine ilahi iletişimin kesintisiz devam ettiğine inanılır."},{"k":"p","x":" **Yeni Şeriat:** Kuran ve Sünnet'ten türetilen İslam şeriatını kaldırdıklarına ve Bahaullah tarafından getirilen yeni hükümlere göre hareket ettiklerine inanılır."},{"k":"li","x":"**Sosyal Yapı ve Yayılım:** Merkezi yapıları ve ruhani meclisleri vardır. Özellikle İran'da ve uluslararası alanda yayılım göstermişlerdir. 20 milyon civarında mensubu olduğu belirtilmektedir."},{"k":"p","x":"Bu üç fırka, İslam düşünce tarihinde ana akım mezheplerden farklılaşmaları ve bazı inanç esaslarındaki aşırılıkları nedeniyle \"Gali Firqalar\" (aşırı fırkalar) kategorisinde değerlendirilir Bahâîlik, İran'da Mirza Hüseyin Ali (ö. 1892) tarafından kurulan, görüşleri İslâm kültürüne dayanmakla birlikte İslâm dairesinden çıkmış bir mezheptir."}]},{"h":"Kökeni ve Bâbîlik Dönemi","b":[{"k":"p","x":" Bahâîliğin tarihi, Şeyhiyye adlı tasavvufî hareket içinde doğan **Bâbîlik** ile başlar.  Bâbîliğin kurucusu **Mirza Ali Muhammed,** 1819'da Şîraz’da doğmuş ve Hurûfîlik ile Seyyid Kâzım Reştî'nin etkisi altında kalmıştır."},{"k":"p","x":" 23 Mayıs 1844'te önce **beklenen Mehdî'ye açılan \"bab\" (kapı),** ardından aynı yılın sonbaharında **bizzat \"beklenen Mehdî\" (el-mehdiyyü’l-muntazar) olduğunu ilân etmiştir.**"},{"k":"p","x":" Kendi yazdığı kutsal kitabı **el-Beyân'da** Hz. Muhammed'in nübüvvetinin 1260'ta (1844) kendi zuhuru ile sona erdiğini, **Kur'ân-ı Kerîm'in neshedildiğini ve İslâm şeriatının emir ve yasaklarının kaldırıldığını** ileri sürmüştür. El-Beyân'ın Kur'ân'dan üstün olduğunu iddia etmiştir."},{"k":"p","x":" Bâbîlik ve Bahâîlik'te **19 sayısı kutsal bir rakamdır;** yıl 19 ay, aylar da 19 gündür. Her Bâbî 19 günde bir 19 Bâbî'ye ikramda bulunmak zorundadır."},{"k":"p","x":" Cenaze namazı dışında cemaatle ibadet kaldırılmıştır. Malların beşte biri zekât olarak verilir. Mirza Ali Muhammed'in doğum yeri Şîraz ile hapsedildiği yerler hac merkezi kabul edilmiştir."},{"k":"p","x":" Sigara, alkollü içki, dilencilik yasaklanmıştır. Boşanma caiz ancak hoş görülmez. Katil, maktulün vârislerine 11.000 miskal altın öder ve 19 yıl cinsel ilişkiden uzak durur."},{"k":"p","x":" Mirza Ali Muhammed, 1850'de müctehidlerin fetvaları üzerine Nâsırüddin Şah'ın emriyle Tebriz'de kurşuna dizilerek öldürülmüştür."}]},{"h":"Bahâîliğin Kuruluşu ve Gelişimi","b":[{"k":"p","x":" Mirza Ali Muhammed'in öldürülmesinden sonra, iki Bâbî'nin Nâsırüddin Şah'a suikast girişimi (1852) üzerine, pek çok Bâbî hapsedilmiş veya öldürülmüştür."},{"k":"p","x":" Hapsedilen Bâbîlerden **Mirza Hüseyin Ali (daha sonra Bahâullah adıyla anılacak)** ve üvey kardeşi Mirza Yahyâ en-Nûrî, 1852 veya 1853'te Bağdat'a sürgün edilmiştir. Bu tarih, Bâbîliğin Bahâîlik olarak devam etmesinin başlangıcı sayılır."},{"k":"p","x":" Bağdat'ta Mirza Hüseyin Ali ile kardeşi arasında Bâb Mirza'nın vekilliği konusunda anlaşmazlık çıkmıştır."},{"k":"p","x":" Mirza Hüseyin Ali, 1863'te Bağdat yakınlarındaki Necib Paşa bahçesinde, kendisinin Bâb'ın önceden haber verdiği **\"Allah'ın ortaya çıkaracağı zat\" (men yuzhiruhu’llah)** olduğunu ilân ederek Bâbîleri kendisine uymaya çağırmıştır."},{"k":"p","x":" Daha sonra İstanbul'a (1863), Edirne'ye (1864) sürgün edilen Mirza Hüseyin Ali, burada \"men yuzhiruhu’llah\" olma iddiasını sürdürmüş ve çeşitli devlet liderlerine mektup yazarak kendisine uymaya çağırmıştır."},{"k":"p","x":" Osmanlı Padişahı Abdülaziz Han, Mirza Yahyâ'yı Kıbrıs'a, **Mirza Hüseyin Ali'yi (Bahâullah)** ve taraftarlarını ise kimseyle görüşmemeleri şartıyla **Akkâ'ya sürgün etmiştir** (1868)."},{"k":"p","x":" Mirza Yahyâ, Kıbrıs'ta 1912'de ölmüş, Mirza Hüseyin Ali ise Akkâ'da Bahâîleri kendi etrafında toplamayı başarmıştır."},{"k":"p","x":" Mirza Hüseyin Ali, 1892'de Akkâ'da ölmüştür."},{"k":"p","x":" Başlıca eserleri: **el-Îḳān,** hareketin temel eseri olan **Kitâbü’l-Aḳdes** (Kur'ân'ı taklit ederek yazdığı ve önceki kitapları neshettiğini iddia ettiği bir eser), **Kelimât-ı Meknûne** ve diğer risalelerdir."}]},{"h":"Bahâîlik'te Liderlik ve Teşkilat","b":[{"k":"p","x":" Mirza Hüseyin Ali, kendisinden sonra büyük oğlu **Abbas Efendi'yi (Abdülbahâ)** halef tayin etmiştir."},{"k":"p","x":" Abdülbahâ (ö. 1921), Bahâîliği Mısır, Avrupa ve Amerika'ya yaymak için çalışmış, İngiliz hükümeti tarafından \"şövalyelik\" rütbesiyle ödüllendirilmiştir."},{"k":"p","x":" Abdülbahâ, ölmeden önce büyük torunu **Şevki Efendi'yi \"veliyy-i emrillâh\" sıfatıyla ruhanî reis ve emrin açıklayıcısı** olarak tayin etmiştir."},{"k":"p","x":" Şevki Efendi (ö. 1957) Bahâîliği dünyaya yaymak için büyük gayret sarf etmiş ve çocuğu olmadığından idareyi \"baş koruyucular\" diye nitelendirdiği yirmi yedi yardımcıya emanet etmiştir."},{"k":"p","x":" Bahâîliğin idarî nizamı üç temel heyetten oluşur:"},{"k":"n","n":1,"x":"**Mahallî Ruhanî Mahfiller (Beytü’l-adl-i mahallî):** En az dokuz Bahâînin bulunduğu yerlerde her yıl seçilen dokuz kişilik meclislerdir."},{"k":"n","n":2,"x":"**Merkezî veya Millî Mahfiller (Beytü’l-adl-i millî-merkezî):** Ülke genelindeki Mahallî Ruhanî Mahfiller tarafından iki dereceli seçim sistemiyle belirlenen dokuz kişilik meclislerdir."},{"k":"n","n":3,"x":"**Umumi Adalet Evi (Beytü’l-adl-i umûmî):** En üst merci olup, Millî Ruhanî Mahfil üyeleri tarafından dünya Bahâîleri arasından seçilen dokuz kişilik üyelerden oluşur. Hayfa'da oturur ve Bahâullah'ın hükümlerini değiştiremezler."},{"k":"h","x":"İnanç ve İbadet Esasları"},{"k":"p","x":" **Allah, bütünüyle bilinemez** ve insan idrakinin üstündedir."},{"k":"p","x":" Allah, emrinin **\"mezâhiri\" (belirtileri)** olan nebîler ve resuller aracılığıyla zuhur eder."},{"k":"p","x":" Bahâullah'a göre peygamberlerin hem beşerî hem de ilâhî vasıfları vardır."},{"k":"p","x":" Hz. Âdem'den bu yana gelen tüm peygamberler ve resuller, sadece **\"Tanrı zuhuru\" olan Bahâ'yı müjdelemek için gönderilmiştir;** çünkü o, tüm dinlerin söz ettiği \"mev'ûd\"dur (geleceği müjdelenen)."},{"k":"p","x":" Tüm dinler Bahâ'nın zuhuru için bir başlangıç olup noksandır ve Bahâ'nın gelişiyle tamamlanmıştır."},{"k":"p","x":" Bahâ'dan sonraki Tanrı zuhuru 1000 yıldan önce olmayacaktır."},{"k":"p","x":" Bahâîliğe göre, Hz. Muhammed'in \"hâtemü’n-nebiyyîn\" (nebîlerin sonuncusu) olması, Allah'ın ondan sonra resuller göndermesini engellemez."},{"k":"p","x":" **Dünyanın son bulması veya kıyametin kopması söz konusu değildir;** ölen herkesin kıyameti ölümüyle birlikte kopar."},{"k":"p","x":" Cennet ve cehennem semboliktir; cennet Tanrı'ya yolculuğu, cehennem de yokluğa gitmeyi ifade eder."},{"k":"h","x":" İbadetler"},{"k":"li","x":"**Namaz:** Ferdi olarak sabah, öğle ve akşam samimi bir kalple Allah'ı anmaktır."},{"k":"li","x":"**Oruç:** On dokuzuncu ay olan a'lâ ayında (2-21 Mart) on dokuz gün tutulur."},{"k":"li","x":"**Hac:** Yalnız erkeklere ve malî durumu müsait olanlara farzdır. Bâb Mirza'nın Şîraz'daki evi veya Bahâullah'ın Bağdat'ta ikamet ettiği ev hac merkezidir, belli bir zamanı veya merasimi yoktur."},{"k":"li","x":"**Zekât:** Malların beşte birinden alınır. Ayrıca gelirin %19'undan ibaret **\"hakku’llah\"** denilen bir vergi vardır."},{"k":"li","x":"Her sabah ve akşam Bahâullah'a ait dua ve sözlerden okumak her Bahâî için vaciptir."},{"k":"p","x":" Herkesin geçimini temin etmek için ticaretle, sanatla veya kazanç sağlayacak başka bir işle meşgul olması **ibadet sayılır.**"},{"k":"p","x":" Yıl içinde çalışılması haram olan dokuz mübarek gün vardır."},{"k":"p","x":" **Cihad yasaklanmış** bir dinî hükümdür."},{"k":"p","x":" **Ahlâkî ve İçtimaî Esaslar (Abdülbahâ tarafından özetlenen on iki başlık):** İnsanlık âleminin birliği, gerçeğin araştırılması, bütün dinlerin birliği, birliği sağlamak için dinin lüzumu, din ve ilim arasındaki âhenk, kadın-erkek eşitliği, her türlü taassubun terkedilmesi, dünya barışına bağlılık, genel ve mecburi öğretim, aşırı zenginlik ve fakirliğin kaldırılması, yardımcı bir milletlerarası dilin kullanılması, milletlerarası bir mahkemenin kurulması."}]},{"h":"Yayılım ve Nüfus","b":[{"k":"p","x":" Bahâîler, Meşriku’l-ezkâr adlı dokuz cepheli mâbedleri çevresinde kurdukları okullar, hastahaneler, yetimhaneler gibi sosyal yardım kurumları aracılığıyla inançlarını yaymaya çalışmaktadırlar."},{"k":"p","x":" 1963 istatistiklerine göre dünyada 6151 Mahallî Ruhanî Mahfil ve 56 Millî Ruhanî Mahfil'e sahiptirler."},{"k":"p","x":" Günümüzde en fazla bulundukları yer İran'dır (300.000-1.000.000 arası). ABD'de yaklaşık 10.000, Avrupa'da birkaç yüz, Pakistan'da birkaç bin Bahâî bulunmaktadır. 1986 istatistiklerine göre dünya nüfusları 4.739.000 olarak gösterilmiştir."}]},{"h":"Kavramlar ve Hızlı Tekrar","b":[{"k":"d","t":"Bâb","x":"Gaib imama açılan kapı; Mirza Ali Muhammed'in 1844'te kendisi için kullandığı unvan."},{"k":"d","t":"el-Beyân","x":"Bâb'ın kutsal kitabı."},{"k":"d","t":"Kitâbü'l-Akdes","x":"Bahâullah'ın temel kitabı."},{"k":"d","t":"Hukûkullah","x":"Bahâîlerde belirli bir mal varlığına ulaşanların gelirinden verdikleri %19'luk pay."},{"k":"d","t":"Meşriku'l-ezkâr","x":"Bahâîlerin dokuz cepheli mâbedi."},{"k":"d","t":"Umumi Adalet Evi","x":"Bahâîliğin en üst idari kurumu (Beytü'l-adl-i umûmî)."}]}],"ht":[{"s":15,"x":"Bâbîlik, Şeyhîlik içinden doğdu; Mirza Ali Muhammed 1844'te bâb, sonra mehdî olduğunu ilan etti, 1850'de Tebriz'de idam edildi."},{"s":15,"x":"1848 Bedeşt toplantısında Bâbîliğin İslam'dan ayrı bir din olduğu ilan edildi; 19 sayısı kutsaldır."},{"s":15,"x":"Bahâullah (Mirza Hüseyin Ali) 1863'te Bağdat'ta 'men yuzhiruhullah' olduğunu açıkladı; Akkâ'ya sürüldü, 1892'de öldü."},{"s":15,"x":"Bahâî öğretileri: dinlerin ve insanlığın birliği, kadın-erkek eşitliği, din-bilim uyumu; 19 gün oruç, cihad yasak, tek eşlilik."}],"oz":{"t":"Bâbîlik ve Bahâîlik · Özet","intro":"Ünitenin özü: Şeyhîlikten Bâbîliğe, Bâbîlikten Bahâîliğe geçiş; Bâb ve Bahâullah'ın iddiaları, Bahâî inanç, ibadet ve teşkilatı.","s":[{"h":"Şeyhîlik ve Bâbîlik","b":[{"k":"li","x":"**Arka plan:** İran'da siyasi istikrarsızlık ve Şiî mehdî beklentisi. **Şeyh Ahmed el-Ahsâî**'nin kurduğu **Şeyhîlik**, \"kâmil Şiî\" (bâb) fikriyle zemini hazırladı; halefi **Seyyid Kâzım Reştî**'dir."},{"k":"li","x":"**Mirza Ali Muhammed (Bâb, 1819-1850):** Reştî'nin öğrencisi; 1844'te Şiraz'da kendisinin gaib imama açılan **bâb** (kapı) olduğunu, ardından beklenen **mehdî** olduğunu ve yeni bir şeriat getirdiğini ilan etti."},{"k":"li","x":"**el-Beyân:** Bâb'ın kutsal kitabı; Kur'an'ın hükümlerini kaldırdığını iddia eder."},{"k":"li","x":"**Bedeşt toplantısı (1848):** Bâbîliğin İslam'dan ayrı bir din olduğu ilan edildi."},{"k":"li","x":"**19 sayısı** kutsaldır: yıl 19 ay, ay 19 gündür; ilk inanan 18 kişi ve Bâb ile 19."},{"k":"li","x":"Bâb, 1850'de Tebriz'de idam edildi."}]},{"h":"Bahâîliğin Kuruluşu","b":[{"k":"li","x":"Şah'a suikast girişiminden sonra hapsedilen **Mirza Hüseyin Ali (Bahâullah)** ve üvey kardeşi **Mirza Yahyâ (Subh-i Ezel)** Bağdat'a sürüldü."},{"k":"li","x":"Bahâullah 1863'te Bağdat'ta Necib Paşa bahçesinde, Bâb'ın müjdelediği \"**men yuzhiruhullah**\" (Allah'ın zâhir edeceği kişi) olduğunu ilan etti."},{"k":"li","x":"İstanbul ve Edirne sürgünlerinden sonra Osmanlı, Yahyâ'yı **Kıbrıs**'a, Bahâullah'ı **Akkâ**'ya sürdü ve iki kardeşin yolları ayrıldı. Bahâullah 1892'de Akkâ'da öldü."},{"k":"li","x":"**Eserleri:** el-Îkān ve **Kitâbü'l-Akdes**."}]},{"h":"Liderlik ve Teşkilat","b":[{"k":"steps","x":["**Abbas Efendi (Abdülbahâ, ö. 1921):** Bahâîliği Mısır, Avrupa ve Amerika'ya yaydı.","**Şevki Efendi (ö. 1957):** \"Veliyy-i emrillâh\"; çocuğu olmadığından halef bırakmadı.","**Umumi Adalet Evi (Beytü'l-adl-i umûmî):** Hayfa'da en üst kurum."]},{"k":"p","x":"İdari yapı: **Mahallî Ruhanî Mahfiller** (en az dokuz Bahâî), **Millî Ruhanî Mahfiller** ve **Umumi Adalet Evi**."}]},{"h":"İnanç ve İbadet","b":[{"k":"li","x":"Allah bilinemez; ancak \"mezâhir\" (peygamberler) aracılığıyla zuhur eder. Bahâullah Tanrı'nın zuhurudur."},{"k":"li","x":"**Peygamberlik sürer;** hâtemü'n-nebiyyîn \"nebîlerin süsü\" diye yorumlanır; bir sonraki zuhur bin yıldan önce olmayacaktır."},{"k":"li","x":"Kıyamet ve cennet-cehennem semboliktir."},{"k":"li","x":"**Öğretiler:** insanlığın ve dinlerin birliği, hakikatin bağımsız araştırılması, kadın-erkek eşitliği, din-bilim uyumu, evrensel barış ve yardımcı bir dünya dili."},{"k":"li","x":"**İbadetler:** ferdî namaz; A'lâ ayında (2-20 Mart) 19 gün oruç; hac (erkeklere, Bahâullah'ın Bağdat veya Bâb'ın Şiraz'daki evi); zekât ve gelirin %19'u olan **hukûkullah**; tek eşlilik; vasiyet farzdır; cihad yasaktır; yılda dokuz mübarek günde çalışılmaz."},{"k":"li","x":"**Mâbet:** Dokuz cepheli **Meşriku'l-ezkâr**."},{"k":"p","x":"**Günümüz:** En kalabalık oldukları yer İran'dır; dünyaya yayılmış bir teşkilata sahiptir. Türkiye'de devletçe tanınan bir din değildir."}]}]}},{"t":"Kâdıyânîlik","intro":"Hindistan Müslümanlarının durumu, Mirza Gulâm Ahmed'in hayatı ve iddiaları, Kādiyân ve Lahor kolları, görüşleri, İslam dünyasının tepkisi ve günümüzdeki durumu.","s":[{"h":"İsimlendirme Meselesi","b":[{"k":"p","x":"**a) Mirzaiyye**: Mirza Gulam Ahmed'in adına izafetle, muhalifler koydu."},{"k":"p","x":"**b) Kadiyaniyye**: Hareketin ortaya çıktığı şehrin ismine nispetle. Şöhret bulan isimdir."},{"k":"p","x":"**c) Ahmediyye**: Gulam Ahmed'in 4 Kasım 1900 tarihinde yayımladığı bildiriyle. Batılılar kullanılır."}]},{"h":"Kadiyanilik'in Teşekkülü ve Gelişim Süreci","b":[{"k":"h","x":"a. Hindistan Müslümanlarının Dini, Siyasi ve Psiko-Sosyal Durumu"},{"k":"h5","x":"a.a. Hindistan Müslümanlarının Sosyal, Siyasi ve Askerî Durumu"},{"k":"p","x":"Müslümanlar 19 ve 20. yüzyıllarda, siyasi, askerî, ekonomik ve toplumsal alanda büyük buhran yaşadı. Hayatın her safhasında Batı'nın gerisine düştü. Batı İslam ülkelerini işgal ediyor ve misyonerlik faaliyetleriyle her açıdan sömürüyor, farklı etnik grupları birbirine kışkırtıyordu."},{"k":"p","x":"Hint alt kıtası sömürgeciliği en derinden yaşadı. Müslümanlar, İngilizlerin işgal girişimleri ve başarıları karşısında büyük bir ümitsizliğe düştüler. Hristiyanlaştırma faaliyetleri Müslüman halk arasında büyük nefrete sebep oldu. 1857'de **Sipahiler** 'in başlattığı isyan başarısızlıkla sonuçlandı. Bu olumsuz durum, onların bir kurtarıcı beklemelerine zemin hazırladı."},{"k":"h5","x":"a.b. Misyonerlik Faaliyetlerinin Etkileri"},{"k":"p","x":"Hristiyan misyonerler, açtıkları eğitim kurumları ve propaganda merkezleriyle Müslümanlar arasında şüphe ve fitne tohumlarını ekmeye devam ettiler. Sömürü düzenlerini kalıcı kılabilmek için Müslümanlar ile Hinduları birbirine düşman etmeye çalıştılar. Örneğin, kurban ibadeti."},{"k":"h5","x":"a.c. Hindistan'da Müslümanların Dinî Durumu"},{"k":"p","x":"İslam bu bölgeye girince buradaki inançları etkilmiş aynı zamanda etkilenmiştir. Yıllarca süren itikadi ve ameli tartışmalar neticede Hindistan'da Müslümanlar arasında gelenekçi ve akılcı bazı hareketlerin ortaya çıkmasına sebep oldu. Mehdilik fikri, Kadiyanîliğin kurucusu üzerinde de etkili oldu ve aynı fikri o da benimsedi."},{"k":"p","x":"Gulam Ahmed'in ortaya koyduğu mehdi ve kurtarıcı fikirlerini düşünmeden kabul edecek bir Müslüman kitlesi vardı. Çaresiz Müslümanlar, Tanrı tarafından gönderilecek karizmatik bir önder beklemeye başlamışlardı..."},{"k":"h","x":"b. Mirza Gulam Ahmed'in Hayatı ve Faaliyetleri"},{"k":"li","x":"Gulam Ahmed, 1839 yılında Pencab eyaletinin Kadiyan şehrinde doğmuştur. Yaşadığı dönem Hindistan'ın Sihlerin elinden İngiliz sömürgesine geçtiği döneme denk gelir. Mirza Gulam'a göre İngiliz Hükümetinin bölgede bulunması büyük bir nimettir (Babası da İngiliz destekçisidir)."},{"k":"li","x":"Gulam Ahmed altı yaşından itibaren Kur'an öğrenmeye başladı; Farsça, Arapça sarf-nahv, mantık ve felsefe dersleri aldı. Dört yıl memurluk yaptı, 1868'de Kadiyan'a geri döndü ve inziva hayatı yaşamaya başladı. Bu süreçte denemeler kaleme aldı. Kendisinin “vahiy\" dediği bazı sesler duyduğunu ileri sürmesi de bu yıllara rastlar."},{"k":"li","x":"1876 yılından itibaren gazetelerde Hindular ve Hristiyanlara karşı yazılar yazdı ve Müslümanlar tarafından tanınmaya başladı. Vahyin kesilmediği, Resûl-i Ekrem'e tam anlamıyla uyan bir kişinin peygambere verilen bilgilerle donatılacağı gibi konuları ele aldı. İngiliz hükümetini överek silahla cihat fikrine karşı çıktı. Gazetedeki yazılarını 50 ciltlik kitap kadar devam edeceğine söz verdi ama beş ciltte kaldı (Berâhîn-i Ahmediyye)"},{"k":"li","x":"Mirza Gulam'ın pek çok hastalığı bulunmaktadır. histeri, karasevda hastalığı, oğlancık hastalığı (cin), verem ve göğüs hastalıkları, idrar yolları hastalıkları, diyabet, sinir zayıflığı, unutkanlık ve koleradır. Aşırı derecede unutkandır."},{"k":"li","x":"Münzevi bir hayat yaşamıştır. Ilk defa vahiy aldığını iddia ettiği dönem babasının rahatsız olduğu dönemdir. Babasının öleceğinin kendisine vahiy yoluyla bildirildiğini iddia etmiştir."},{"k":"li","x":"Mirza Gulam hayatının her döneminde birtakım iddiaları vardır. İlk olarak 1885 yılında hicri XIV. yüzyılın müceddidi olduğunu ilan etti. 1888'de Allah'ın kendisine ayrı bir cemaat oluşturmasını emrettiğini bildirdi."},{"k":"li","x":"1891 yılında aldığı vahiy ve ilhamlara göre İsa b. Meryem'in diğer nebiler gibi tabii bir ölümle öldüğünü, Allah'ın kendisini Hristiyanların ve Müslümanların beklediği mesih ve mehdi olarak gönderdiğini beyan etti. Bu konudaki görüşlerini arka arkaya yayımladığı **Feth-i İslam** (1891), **Tavzîh-i Meram** (1891) ve **İzale-i Evham** (1891) adlı kitaplarında açıkladı. Bu iddialarından dolayı Müslümanlar, Hristiyanlar ve bir kısım Hindular şiddetle karşı çıktılar. Daha önce Berahîni Ahmediyye'yi öven Muhammed Hüseyin el- Batalevî, 1891 yılında onun küfrüne dair bir fetva neşretti."},{"k":"li","x":"1900 yılında, Kurban bayramı namazında Arapça olarak irticalen okuduğu hutbenin Allah'ın vahyine dayalı olduğunu iddia etti. 1901'de bir Cuma hutbesinde taraftarlarından Mevlevi Abdülkerim, Mirza Gulam için Nebi ve Resul sıfatlarını kullandı. Kendisi buna karşı çıkmadı bizzat nübüvvetinin “Allah'ın has ve seçilmiş bir kulu\" manasında değerlendirilmesi gerektiğini (mecazi) ifade etti. Bu konudaki itirazlara karşı da **Tuhfetü'n-nedve** (Kadiyan 1902) ve **Hakikatü'l-vahy** (Kadiyan 1907) adıyla iki eser telif etti."},{"k":"li","x":"Öte taraftan Gulam Ahmed'e yöneltilen önemli eleştirilerden biri, eserlerini kendisinin yazmadığı, zira bunları yazacak ilmî biriminin olmadığı şeklindedir. Bu iddiayı dile getirenlere göre Gulam’ın ortaya koyduğu eserler, İngilizler tarafından kaleme alınmaktadır."},{"k":"li","x":"Bir toplantı için bulunduğu Lahor'da 26 Mayıs 1908'de ani bir şekilde öldü ve Kadiyan'da defnedildi. Cenaze namazından önce, onun 14 Aralık 1905'te yayımladığı vasiyetine uyularak yapılan seçimde **Hakim Nureddin** \"Mesihin Birinci Halifesi\" sıfatıyla hareketin başına getirildi."},{"k":"li","x":"Nureddin, Gulam'a ilk beyat eden kişidir. Gulam Ahmed'e nispetle daha sistemli ve ciddi bir eğitim görmüş olduğu için perde arkasında hareketin fikir babası odur. Gulam'ın yazdığı Arapça eserleri kontrolden geçirip yanlışlarını düzeltmek onun vazifesidir."},{"k":"li","x":"O'da ölümünden önce halifeliğe Gulam Ahmed'in oğlu Mirza Beşirüddin Mahmud'u aday göstermişti. Bir topluluk önceki gibi seçimi benimseseler de Mahmud Ahmed \"mesihin ikinci halifesi\" unvanıyla halifeliğe getirilmiş, diğer grup da Kadiyan'dan aynlarak Lahor'a yerleşmiştir. Böylece hareket ikiye ayrılmıştır."},{"k":"h","x":"c. Kadiyan Ahmedileri"},{"k":"li","x":"Mirza Beşirüddin Mahmud Ahmed halifeliğe seçildi. 51 yıl süren halifelik döneminde babasına atfedilen olağanüstü hâller ona da atfedildi. Bunlardan biri, Kur'an'ın gerçek anlamının Beşirüddin'e vahyolunduğudur."},{"k":"li","x":"Mirza Beşirüddin Mahmud, halifeliği süresince aktif olmuş, eğitim öğretime önem vermiş; **Sadr-ı Encümen-i Ahmediyye** 'nin yetkilerini sınırlayarak kendi buyruğu altına sokmuştur. O, kendisine bağlı birtakım kuruluşlar ihdas etmiştir: **Encümen-i Ensarullah**; **Meclis-i Meşveret**; dünyaya **Tahrik-i Cedid; Huddamu'l Ahmediyye**; Etfal'ul Ahmediyye."},{"k":"li","x":"Kadiyan Ahmedilerinin dinî eğitim merkezleri yanında laik eğitim veren kolejleri de vardır. Erkekler için **Ta'limu'l İslam High School**, sadece kız öğrenciler içinse **Nusret College** adında eğitim kurumları bulunmaktadır. **Karma eğitim yasaktır**. Propaganda aracı olarak bir çok dillerde dergiler yayınlamışlardır."},{"k":"li","x":"Hindistan 15 Ağustos 1947'de Pakistan ve Hindistan olarak ikiye aynldı. Lahor kolu Pakistan'da, Kadiyan kolu ise Hindistan'da kaldı. Ancak Mirza Beşirüddin Mahmud, grubun Hindistan'da kalmasının doğru olmayacağına karar verdi ve Pakistan'da Rebve bölgesine taşındı."},{"k":"li","x":"1965'de Beşirüddin Mahmud ölünce yerine oğlu Mirza Nasir “ **Mesih'in Üçüncü Halifesi”** unvanıyla geçti. Mirza Nasir, Îngiltere Oxford Universitesi'nde okumuş eğitimli bir kimseydi. Nasir, 1970'de Afrika'ya giderek bölgede klinik, hastane ve okullar yaptırmış, aynı şekilde Avrupa'da da camiler açmıştır. Mirza Nasir’ın 1982 yılında vefatı üzerine Kadiyan Ahmedilerinin başına \" **Mesih'in Dördüncü Halifesi** \" unvanıyla oğlu Mirza Tahir geçmiştir. Hâlâ hareketin başında olan bu şahsın dikkat çeken belirgin bir faaliyeti bulunmamaktadır."},{"k":"h","x":"d. Lahor Ahmedileri"},{"k":"li","x":"Lahor'a yerleştiler ve Ahmediyye Encümen-i İşaat-i İslam adı altında organize oldular. Halife unvanı yerine \"Ahmediyye Encümen-i İşaat-i İslam Başkanı\" adını kullandılar. Kadiyan kolu kadar büyük olmasalar da daha aktiftirler. Lahor Ahmedîlerinin ilk başkanı Mevlana Muhammed Ali'dir."},{"k":"li","x":"Bu şahıs, İngiliz Dili ve Edebiyatı üzerine master yapmış, ardından hukuk fakültesini bi tirmiştir. 1897'de Mirza Gulam Ahmed'e beyat etmiş, tavsiyesi üzerine Avrupa ve Amerika'ya yayılmak amacıyla 1902'de the Review of Religions dergisini çıkarmaya başlamıştır. 1913'te Lahor'da yüksek okul kurdu. 1917'de Kur'an'ı İngilizceye çevirmiştir. Muhammed Ali öldükten sonra yerine Mevlana Sadruddin'i başkan seçti. Onun ölümünden sonra da 1982'de Seyyid Ahmed teşkilatın başına getirildi."},{"k":"li","x":"Bunlar Gulam Ahmed'in peygamberliğinden söz etmemekte, onu sadece bir müceddid ve zaman zaman \"mesih-i mev'ûd” olarak nitelemektedirler."}]},{"h":"Kadiyaniliğin Görüşleri","b":[{"k":"h","x":"a. Müceddidlik iddiası"},{"k":"li","x":"Gulam Ahmed, kendisini 14. yüzyıl müceddidi olarak ilan eder. Bu iddiasını ispat için “Muhakkak ki Allah her yüzyılın başında bu ümmete, onların dinlerini yenileyecek birini gönderir.\" mealindeki hadisi delil gösterir. Lahor kolu, Gulam’ın müceddidliğini onaylar ve onu, İslam'ı ilk zamanki saflığına kavuşturmakla görevli bir din büyüğü kabul eder. Kadiyan kolu Gulam Ahmed'in müceddid vasfıyla pek ilgilenmez, çünkü onlar için Gulam'ın nübüvveti daha önemlidir."},{"k":"li","x":"Gulam Ahmed, kimsenin kullanmadığı sıfatları da kendisi için kullanmıştır: Hakem, imam, halife, Adem'in benzeri, Meryem'in oğlu Mesih, el-Mesîhu'l-Mevûd veya el-Mehdi el-Ma'hûd."},{"k":"h","x":"b. Mesihlik iddiası"},{"k":"li","x":"Mirza Gulam, 1880'li yıllarda mesih ile tabiatlarının benzediğinden bahseder. Takriben bir on yıl sonra Hz. İsa'nın göğe yükselmediği, tabii bir ölümle bu hayattan ayrıldığı, kendisinin İsa gücü ile mesih olarak gönderildiği hususunu dile getirir."},{"k":"li","x":"Gulam Ahmed, mesihlik iddiasını doğrudan Hz. İsa'nın ölümü üzerine kurgulamıştır. Bu itibarla, Hz. İsa'nın tabii bir şekilde öldüğünü ispat edebilmek için büyük gayret sarf etmiştir. Gulam Ahmed, İsa'nın tekrar dünyaya gelmesi şeklindeki iddianın İslam'ın nübüvvet anlayışına ters düştüğünü ileri sürer. Çünkü eğer gelecek olan İsa olsaydı nübüvvet işi tamamlanmamış olurdu."},{"k":"li","x":"Dolayısıyla İsa b. Meryem ile Beklenen Mesih ayn kişilerdir. Ama bu Mesih'in Muhammed ümmetinden çıkacağı ve bunun da Mirza Gulam Ahmed olduğu kesin olarak kabul edilmektedir."},{"k":"p","x":"**c. Mehdilik iddiası:** Kur'an'ı insanların kalbine, mehdi yerleştirecektir. Gelişi söz verileri Mehdi (el-Mehdiyye el-Mev'ûd) zamanın imamıdır. Gulam Ahmed'e göre Mesih ile Mehdi aynı kişidir ve kendi şahsında bunlar cem edilmiştir."},{"k":"p","x":"**d. Nebilik iddiası:** Kendisi için nebi ve resul kelimelerini 1900 yılından önce kullanmışsa da tepkiler dolayısıyla açıkça nebilik iddiasında bulunmamıştır. Bu dönemden sonra Mirza Gulam Ahmed, başına bazı sıfatlar eklemek suretiyle kendisinin nebiliğini kabul etmektedir, ama nebiliğinin Hz. Muhammed'in son peygamber oluşunu zedelemediğini ileri sürmektedir. Ona göre Hz. Muhammed nübüvvet yönünden sonuncudur, kendisi ise velayet yönünden (Hatemül Evliya) sonuncudur."},{"k":"p","x":"Gulam Ahmed, kendi nebiliğini birtakım kelimelerin ardına sığınarak açıklamaya çalışır. Bunlardan en fazla dikkat çekeni \" **muhaddes** \" kavramıdır. Mirza Gulam'a göre muhaddes, Allah'la konuşan, kendisine ilahi sırlar vahyolunan, vahiyleri şeytanın bozmasından uzak olan, kendisine şeriatın ruhu öğretilen, gelişi nebinin gelişi gibi olan, nebilik iddiasını ilan etmek zorunda olan, reddedenlerin cezaya çarptırılacağı kimsedir. Buna göre nebi muhaddes, muhaddes de bir nebidir."},{"k":"p","x":"Gulam Ahmed'in düşüncelerini izah etmek için kullandığı kavramlardan biri de **zıllî** veya **burûzî** nebi (gölge nebi) terimleridir. Zıllî nebi, bir nebi değil onun nurunu yansıtan bir nebidir. Burûzî nebilik ise, nebi olmayan birinin belirme. (burûz) yoluyla bir nebinin vekili olmasıdır. Lahor ekolüne göre gerçek nebinin inkânı kişiyi kâfir yapar, ancak müceddid veya muhaddes birinin inkârı kişiyi kâfir yapmaz Kadiyan Ahmedîleri bunun hilafınadır."},{"k":"p","x":"**e. Krişna-Avatar iddiası:** Hinduların yaşadığı bir coğrafyada “Krişna-Avatar\" olduğunu da iddia eder. “ Benim bu çağdaki gelişim yalnız Müslümanlar için değildir. Yüce Allah benimle Hindular, Müslümanlar ve Hristiyanlardan ibaret üç ümmetin yenilenmesini sağlamak istedi. Ben Müslüman ve Hristiyanlar için Mesih-i Mev'ud'um. Hindular için ise avatar olarak gönderildim.\" der."},{"k":"h","x":"İtikadî Görüşleri"},{"k":"p","x":"Kadiyaniler, genel olarak Ehl-i Sünnet itikadına mensup olmakla birlikte nübüvvet, mehdi, mesih ve bunlarla alakalı bazı konularda farklı görüşler ortaya koymuşlardır. Kadiyaniler, Eş'arî ve Matüridîler gibi iman esaslarını Amentü'de geçen şekliyle aynen kabul ederler. Ancak Hz. Peygamber'den sonra vahyin devam ettiğini söylemeleri hem kitaplara iman hem de peygamberlere iman konusunda bazı sorunlar ortaya çıkarmaktadır. Lahor Ahmedileri ise, Cebrail yoluyla gelen vahyi, peygamberlere has olan en yüksek vahiy türü olarak görürler. Cebrail, Hz. Muhammed'den sonra nebevi vahiy getirmeyecektir. Gerçek nebilik için Cebrail'in gelmesi şarttır. Kadiyanîler, Hanefidir. İçtihat kapısı kapanmamıştır. Kur'an'da nasih-mensuh yoktur. Kurban kesmek nefsini dünyanın güzelliklerinden anndırmaktır. Kadınların örtünmesi, çok evlilik uyulması mutlak faydalı olan emirlerdir."},{"k":"h","x":"Siyasi Görüşleri"},{"k":"p","x":"Kadiyanîler'e göre, hilafet dinî ve siyasi otoriteyi temsil eder; İslam dünyasının dini liderliğidir. Toplumun kesinlikle bir hâlifeye ihtiyacı vardır. Bütün İslam dünyası için tek bir halife yerine, dönemin siyasi şartlarına ve ulus devlet anlayışına uygun olarak milli devlet ve onun başında milli halife bulunması görüşünü benimsediler."},{"k":"p","x":"Kadiyanîler görünen düşmana, şeytana ve kişinin nefsine karşı olmak üzere **üç çeşit cihat** olduğunu söylerler. Mirza Gulam'a göre, kılıçla cihat zamanı geçmiştir. Kalem, dua ve büyük kerametlerle yapılacak olandan başka cihat kalmamıştır. Gulam Ahmed'in cihat anlayışı, sömürgeci İngiliz yönetimine karşı problem çıkartan, hakkını arayan ve hürriyet talep eden bir Müslüman yerine pasif bir Müslüman tipi yaratmayı amaçladı."}]},{"h":"Kadiyaniliğin Günümüzdeki Durumu","b":[{"k":"p","x":"Kadiyaniler, İslam dışı azınlık olarak ilan edilmelerinden sonra özellikle İngiltere, Hollanda, Almanya, Danimarka, İspanya, İsviçre, ABD, Afrika ve bazı Pasifik ülkelerinde teşkilatlanarak faaliyet göstermeye devam ettiler."},{"k":"p","x":"Lahor Kadiyânîleri ise Lahor'a yerleşerek Ahmediye Encümen-i İşaat-ı İslam adlı bir örgüt kurarak çalışmalarını sürdürmektedirler. Bunların, özellikle kültürel çalışmalarıyla Afrika ve Avrupa'da İslam'ın yayılmasına önemli katkıları oldu. Türkiye'de de Ahmediyye Cemaati adı altında faaliyet göstermektedirler. Bütün dünyada iki milyon civarında olduğu sanılmaktadır. 3 \"Ve'l-hamdülillâhi Rabbi'l-âlemîn... Tarihçi müelliflerimizin ve cümle ehl-i imanın ruhu için el-Fatiha..."}]},{"h":"Kādiyânîlik: Ayrıntılı Bilgi","b":[{"k":"h","x":"İsimlendirme"},{"k":"p","x":"Hareket, kurucusu Mirza Gulâm Ahmed'e nispetle **Mirzâiyye**, doğduğu yer olan Kādiyân'a nispetle **Kādiyâniyye** diye anılır. Gulâm Ahmed 4 Kasım 1900 tarihli bildirisiyle **Ahmediyye** adını ilan etmiş, mensupları ve Batılılar bu adı kullanmıştır. Müslüman âlimler ise bu adın Hz. Peygamber'e değil Gulâm Ahmed'e işaret ettiğini belirterek Kādiyâniyye adını tercih etmiştir."},{"k":"h","x":"Mirza Gulâm Ahmed'in hayatı ve iddiaları"},{"k":"steps","x":["**1839:** Pencap'ın Gurdâspûr bölgesindeki Kādiyân'da doğdu.","**1880-1884:** Berâhîn-i Ahmediyye'nin ilk dört cildini yayımladı (V. cilt 1905).","**1885:** Hicrî XIV. yüzyılın müceddidi olduğunu ilan etti.","**1 Aralık 1888:** Allah'ın kendisine biat alıp ayrı bir cemaat kurmasını emrettiğini bildirdi.","**1891:** Hz. İsa'nın tabii ölümle öldüğünü, kendisinin vaat edilen mesîh ve mehdî olduğunu iddia etti.","**1900:** Taraftarları onun için \"nebî\" ve \"resul\" sıfatlarını kullanmaya başladı.","**2 Kasım 1904:** Hindular için Krişna-Avatar olduğunu ilan etti.","**26 Mayıs 1908:** Lahor'da öldü, Kādiyân'da Bihiştî Makbere'ye gömüldü."]},{"k":"p","x":"Gulâm Ahmed, \"nebî\" sıfatını kendisine nispet ederken bunu **zıllî** (gölge), **burûzî** (belirme) ve **muhaddes** (ilham alan) gibi kavramlarla açıklamış, böylece yeni bir şeriat getirmeyen, Hz. Muhammed'e tabi bir nübüvvet iddia etmiştir."},{"k":"d","t":"Burûz","x":"Kādiyânîlikte bir peygamberin manevi niteliklerinin başka bir kişide yeniden belirmesi; Gulâm Ahmed nübüvvet iddiasını bu kavramla açıklamıştır."},{"k"
