'ın Mehdi olduğunu kabul etmiş; gaybete girmesiyle de bâblık görevinin kendisine geçtiğini, hatta onun sefiri olduğunu öne sürmüştür."},{"k":"li","x":"Mezhebin ikinci kurucusu sayılan **Hüseyin b. Hamdan el-Hasibî'** nin mezhebin sistemleşmesi ve yayılmasında önemli bir rolü vardır. Büveyhî hükümdarı Seyfüddevle'ye **el-Hidayetü'l-Kübrâ ve el-Mâide** adlı eserlerini ithaf etmiştir. Hamdan'a nispet edilen on altı bölümden oluşan **Kitabu'l-Mecmû'** adlı eser ise mezhebin kutsal kitabı niteliğindedir. Hasibî, Şiî biyografi kaynaklarında genellikle \"yalancı, lanete uğramış, itikadı bozuk, fikirlerine itibar edilmemesi gereken kimse\" gibi ifadelerle eleştirilmiştir."},{"k":"li","x":"Hasibi'den sonra fırka liderliğini **Muhammed b. Ali el-Cilli** (ö. 384/994) devralmış, Nusayrilik hakkında eserler vermiş olan **Ebû Said Meymun b. Kasım et-Taberânî'** yi de kendi halefi olarak bırakmıştır."},{"k":"li","x":"Nusayrilik, Muhammed b. Yunus el-Kilazî zamanında (ö. 1011/ 1602) Kitâbü'l-Mecmu'da yer alan Hz. Muhammed ile Hz. Ali'den bahseden bazı ibarelerin yorumu konusunda muhtelif kollara ayrılmıştır. Dört kola ayrılmalarına rağmen ana yapı **Ali el-Haydari** 'ye nispetle **Haydariyye** (Gaybiyye, Şemsiyye) diye anılmış, sayıca daha az olan kesim ise **İbn Yunus el** - **Kilazi** 'ye nispet le **Kilâziyye** (Kameriyye) adını almıştır."},{"k":"li","x":"XI. yüzyılın sonlar ile XII. yüzyılın başlarında Haçlı seferlerine maruz kaldığında halk göçler, ekonomik sıkıntılar ve sefaletlerle dolu bir hayat geçirmiştir. Bazı kaynaklarda Nusayrîler'in **Haçlılar'a yardım** ettiğinin kaydedilmesine mukabil tarihçiler bunu reddeder."},{"k":"li","x":"Lazkiye ve çevresinin **Selahaddin-i Eyyubi** tarafından Haçlılar'dan kurtarılmasının (584/1188) ardından Eyyubîler'in hâkimiyetine girmişlerdir. **Memlüklüler** döneminde Sultan Baybars Nusayriler'in yaygın İslamî anlayışa mensup zümrelere katılması için teşebbüslerde bulunmuştur."},{"k":"li","x":"Mercidabik Savaşı (922/1516) sonrasında Nusayriler **Osmanlı idaresine girmiş**, uzun süre Halep'te mahalli şeyhlerin denetiminde serbest bir hayat yaşamışlardır. Mısırlı İbrahim Paşa'nın Osmanlı yönetimine karşı giriştiği harekatta (1839) büyük kayıplar vermelerine rağmen Nusayrîler devlete sadık kalmışlardır. **II. Abdülhamid** zamanında mecburi askerliğe tabi tutulan Nusayriler'e bölgedeki Hristiyan misyonerlerinin propagandalarına karşı tedbir talepleri dikkate alınarak destek vaadinde bulunulmuş, belli yerleşim merkezlerine camiler inşa edilip imamlar tayin edilmiştir. Ancak bu tedbirler sınırlı oranda işe yaramıştır."},{"k":"li","x":"Savaşın aka inde Fransızlarla Suriyeli yetkililer arasında gerçekleşen görüşmelerin ardından 1920'de Alevî toprağı adı altında idari bir birim kurulmuş, bu isim 1922'de **Aleviler Devleti** olarak değiştirilmiştir. 1936'da Suriye Devleti'nin vilayeti, 1942 yılında Lazkiye idaresi Suriye'ye katılmıştır."},{"k":"li","x":"İkinci Dünya Savaşı sonrasında tam bağımsızlığına kavuşan Suriye 1963-1970'li yıllardan itibaren **Nusayri aileler** tarafından yönetilmeye başlanmıştır. **Hafız Esed** Suriye'nin ilk Nusayrî başkanı olmuştur. Günümüzde Beşar Esed devlet başkanlığı görevini yürütmektedir!?"}]},{"h":"Nusayrî İnanç Esasları","b":[{"k":"h","x":"a. Tanrı İnanışları"},{"k":"li","x":"Hz. Ali, zahirde imam ise de bâtini olarak Tanrı'dır. İlahî sıfatlara sahiptir. O'nu \"nurların nuru\" olarak kabul ederler. Bu inanış, mezhebin kutsal kitabı olan Kitabu'l-Mecmû'da; \" Ey Ali b. Ebi Talib! Ey her arzu edenin sevip dilediği, ey uluhiyeti ezeli olan, ey"},{"k":"p","x":"**bütün yaratılmışların aslı! Sen bizim gizli ilahımız, açık imamımızsın.\"** tarzında çok net bir şekilde görülmektedir."},{"k":"li","x":"Hz. Ali'yi, Tanrı’nın tecessüm etmiş bedeni olarak görürler ve Kur'an-ı Kerim'de yer alan ilahî sıfatların hepsinin Ali için kullanıldığını iddia ederler. Buna göre, “O ölmemiştir, nurlar âlemindeki makamına gitmiştir... O, bu dünyadaki bedeni bırakmak istediği için İbn Müceyleme'yi getirtip beden olan Ali'yi öldürtmüştür. **Bu yüzden İbn Müceyleme suçsuzdur**."},{"k":"li","x":"Nusayrilere göre Ali, kendi nurundan Muhammed'i yaratmıştır. Muhammed de Selman el- Farisi'yi yaratmıştır. Ali, **\"mana\"** dır; Muhammed de **“isim\"** dir; Selman ise **“bâb** \"dır. Bu inanış, ayn-mim-sin (a-m-s) harfleriyle sembolleştirilmiş ve kelime-i şehadette; **“Ben** şehadet ederim ki Ali b. Ebî Talib'ten başka ilah yoktur, övülmüş Muhammed'den başka hicap yoktur, kendisine dönülen Selman el-Farisi'den başka bâb yoktur.\" şeklinde ortaya konulmuştur."},{"k":"li","x":"Hz. Ali için **\"Arılar Emiri\"** (Emîr en-nahl) sıfatını da kullanan Nusayrilere göre Tanrı'nın zahir âlemde insan şeklinde görünmesinin sebebi, insanları doğru yola daha kolay iletebilmektir."},{"k":"li","x":"Fırka içerisinde uluhiyetin Ali'ye hulul ettiğine inananlar da vardır, Ancak günümüzde Nusayrî yazarlar, gizlilik ilkesi gereğince olsa gerek Ali'nin ilahlığını gündeme getirmeksizin onun insanüstü bazı yönlerine işaret etmekle yetinirler; bu konuda kuşku uyandıracak ifadelere de yer vermezler."},{"k":"h","x":"b. Peygamber İnanışları"},{"k":"p","x":"Mana olan Tanrı, Adem, Nuh, Yakup, Musa gibi bazı peygamberlere hulul ederek tecelli etmiştir. Hz Ali'nin uluhiyeti ilk peygamberlerden başlayarak bütün peygamberlere ve filozofların da bazılarına hulul etmiştir. Peygamberler Tanrı'nın yeryüzündeki yansıması olduğu için onlar yeryüzüne vücutsuz olarak inip sonrasında bedene bürünürler. Görünen bedene rağmen gerçekte yemek yemezler ve eşleriyle birlikte olmazlar. Peygamber Tanrı'dan bir parça olduğundan onun emirlerini açıklayan (Natik) konumundadır. Tanrı ise konuşmaz. emirlerini peygamber tarafıyla insanlara aktarır."},{"k":"h","x":"c. Melek ve Şeytan İnançları"},{"k":"li","x":"Islam tarihinin ilk dönemlerinde yaşamış birçok şahsiyet, Hz. Ali'nin yanında yer almış kişiler melektir. Hz. Ali'nin eşi ve çocukları da kendisi gibi tanrısal varlıklardır. Bu kişilerin insan olarak nitelendirilmesi düşünülemez, ısrar edenler kafir olur."},{"k":"li","x":"Hz. Ebû Bekir, Ömer, Osman, Talha, Sa'd, Muaviye, Yezid, Haccac ile Ahmedu'l-Bedevi, Ahmed er-Rifai, Abdülkadir Geylânî gibi velileri şeytanın sembolleri olarak değerlendirirler ve onlara lanet ederler."},{"k":"li","x":"Gökteki yıldızların melek olduğuna, bilinen yedi gezegenin yedi büyük meleğin sembolü olduğuna inanırlar."},{"k":"h","x":"d. Bab inancı"},{"k":"p","x":"Nusayrilerin **\"Seyyid Silmen** ” diye isimlendirdiği, insan olmayan bizzat Muhammed tarafından yaratılmış kutsi bir varlıktır. Ancak günümüz Nusayrî yazarları, beşer üstü bu özellikleri reddetmektedir. Bazıları bunların da takiyyeci olduğunu söylerler."},{"k":"h","x":"e. Beş Eytam (Beş Yetim)"},{"k":"p","x":"Dünya işlerinin düzenleyicileri olarak kabul edilen \"eytam/ yetimler\" adı verilen bir grup vardır. Bab'ın yarattığı bu beş eytamın (beş şerefli yetim) her birinin ayrı vazifeleri bulunmaktadır. Mikdad b. el-Esved, Ebû Zerr el-Gifarî, Abdullah b. Revâha, Osman b. Ma'zun, Kanber b. Kadân ed-Devsî. Bunlar aynı zamanda beş büyük yıldızdır. Hz. Peygamber'in ashabı yerdeki yıldızlardır. Yerden göğe çıkan bu yıldızlar yukarıda isimleri zikredilen beş eytamdır."},{"k":"h","x":"f. Yaratılış Teorileri"},{"k":"p","x":"Yaratılış nazariyeleri bakımından bâtini anlayışı benimseyen Nusayriler bedensel bir varlık olmadan önce Ali'nin uluhiyyetine inanmış ve onun hikmetine erme bahtiyarlığına ulaşmışlardır. Onlar ışıklı yıldızlar ve nurlar idiler ve orada Ali'ye itaatte bulunurlardı. Bu 7077 sene 7 saat devam eden süreçte Ali onlara saçı sakalı bembeyaz bir şeyh şeklinde göründü ve onları imtihan etmek için kendisinin kim olduğunu sordu, fakat onlar bilemediler. Bunun üzerine Ali gururlarından ötürü kendisini tanıyamadıkları için onları insan bedenine hapsetmek suretiyle cezalandırdı."},{"k":"h","x":"g. Cennet-Cehennem İnanışları"},{"k":"li","x":"Tenasüh inancı olduğundan cennet ve cehennem semboliktir. Ruhların pek çok defa dünyaya gelmesi sürekli bir yükselme ya da düşüşü akla getirmektedir. Bu durumun cennet veya cehennem olarak isimlendirildiği anlaşılmaktadır. Nusayriler; ölüm sonrasında semavi mevcudatın yer aldığı ruhani ve parlak bir âleme gidileceğine inanırlar. Semanın gezegenleri olan bu ruhani alem dört sınıftır: Büyük ve parlak alem, Küçük parlak âlem, Büyük karanlık âlem, Küçük karanlık âlem."},{"k":"li","x":"Ruh, ölümle birlikte cisimden ayrılınca kişinin yaşadığı dönemde iyi bir Nusayri olup olmamasına göre yeni bir libasa girer. Kişi, kötü bir kimse ise günahlarından temizleninceye kadar Hristiyan ya da Müslüman âlimler şeklinde dünyaya gelir..."},{"k":"h","x":"h. Tenasüh İnancı"},{"k":"p","x":"Onlar, hulül inancının yanı sıra ölümden sonra insan ruhunun farklı bedenlerde varlığını devam ettirdiğine de inanırlar. Tenasüh inancı, mezhebin en temel akidelerinden biri olduğundan mükâfat veya cezalandırmada buna göre olmaktadır. Günümüz Nusayri inanç önderleri, tenasüh inancının varlığını kabul ederler."}]},{"h":"Diğer Bazı İnançları","b":[{"k":"h","x":"a. Gizlilik ve Takiyye"},{"k":"li","x":"Nusayrîlikte gizliliğin mutlak olarak sağlanabilmesi için birtakım tedbirler alınmıştır. Buna göre gizlilik özelliği taşıyan mezhebî hususlar hakkında çocuklara, kadınlara ve sıradan kişilere asla bilgi verilmez."},{"k":"li","x":"Nusayrilere göre gizlilik bâtin ehlinin özelliğidir. Zahire göre hüküm vermek, karanlık ve zulmet ehline özgüdür. Sırra sahip olmak önemli bir meziyettir ve sırları ifşa edenleri öldüklerinde toprak kabul etmeyecek ve hayvan suretine dönüşeceklerdir."},{"k":"li","x":"Nusayriler, başka din ve mezhep mensuplar arasında bulunduklarında onlardan görünürler ve onlar gibi davranırlar."},{"k":"h","x":"b. Şarabın Kutsanması"},{"k":"li","x":"**Nakfi** adı verilen, kuru veya yaş üzümden yapılan bu içecek, mezhebin bütün gruplarınca kutsal ve uluhiyetin simgesi kabul edilmektedir."},{"k":"li","x":"Şarabın takdisi, kutsanması son derece büyük gizlilik içinde icra edilir. **Kuddes** denilen bu törene sadece Nusayrî yetişkinler katılabilir. Kadınlar ve çocuklar kesinlikle yer alamazlar."}]},{"h":"İbadetler ve Dinî Hayat","b":[{"k":"p","x":"**Namaz:** Müslümanların kıldığı şekilde bir namaz ibadetinden bahsedilemez. Onlar, namazı sesli yapılan dua şeklinde kabul edip uygularlar. Ferdi ve cemaat hâlinde olmak üzere namaz iki çeşittir. Gerçek namaz, Ali'ye açılan bir kalbin niyazı şeklinde ferdî yapılmalıdır. Ancak bayramlarda, mukaddes günlerde veya çok meşhur bir şeyhin, bir kasabayı ziyareti münasebetiyle cemaat hâlinde ibadet yapılır. Esasen cemaat hâlinde icra edilen namaz, fevkalade gizlidir. Bu sebepten Nusayrîlikte camiye ihtiyaç yoktur"},{"k":"p","x":"**Namaz öncesi abdest alınmaz**. Nusayrilerde beş vakit namazın kendilerine tahsis edildiği Muhammed, Fatima (Fâtır), Hasan, Hüseyin ve Muhsin olmak üzere beş de masum vardır (öğleden sabaha doğru). Namazın başında **“Ali, Muhammed ve Selman’ı yüceltiriz**.\" demek, bitişinde de **“Ey yüce, büyük ve anların efendisi Ali, bize merhamet et!\"** diyerek sona erdirmek yeterlidir. Namaz dua olduğu için yürürken, meşgulken yapılabilir. Kıble şartı da yoktur. **Oruç**: Oruç, Hz. Muhammed'in babası Abdullah'ın sessizliğini sembolize eder. Buna göre Ramazan Abdullah, Kur'an Hz. Muhammed'dir. Ramazan günleri ise Nusayrilerin kutsal kişilerini temsil eder."},{"k":"p","x":"**Zekât**: Zekâtın anlamı dini öğrenmek ve insanlara aktarmaktır. Pratikte her Nusayrî zekâtını maddi durumuna göre şeyhe verir. Her konudaki tevil ve yorumun tek istisnası zekât konusudur. **Hac ya da ziyaretler**: Değişik geometrik şekillerde inşa edilen bu yerler önemine binaen beyaz renge boyanır. Kutsal şahıslarınkine kubbe de yapılır. Bir din adamının kabri ziyaret yeri olabileceği gibi, görülen rüya üzerine kişinin oturduğu ev de ziyaret mekânı olabilir."},{"k":"p","x":"**Cihad**: Hz. Ali'ye haksızlık ettiklerine inanılan sahabeye, özellikle Ebû Bekir, Ömer ve Osman'a lanet etmektir."},{"k":"p","x":"**Hızır kültü:** Hızır, Hz. Âdem'den bu yana çeşitli bedenlerde ortaya çıkarak ihtiyaç içindeki insanların yardımına koşan ölümsüz bir güçtür. Hızır türbeleri Samandağ, İskenderun ve Antakya'da oldukça fazladır. Türbelerin yakınındaki ağaçlar kutsal sayılır ve dilek ağacı olarak kullanılır. Hızır kimliği bilinmeyen bir zat olduğu gibi; veli bir zat, Cebrail, Hz. Muhammed, Hz. Ali olduğuna dair inanışlar da yaygındır."},{"k":"p","x":"**Evlilik**: Evlilikleri kendi içlerinden yaparlar. Nişanlılık döneminde erkek, nişanlısına çeyizlik hediyeler alıp sunmak zorundadır. Ev eşyalarnın bir kısmın erkek, bir kısmını kız tarafının alması âdet olmuştur. Boşanma, ayıplanan ve kınanan bir şeydir. Zina ve ahlaksızlık mutlak boşanma sebebidir."},{"k":"p","x":"**Kadının dini konumu**: Kadınları hor, değersiz ve düşük yaratıklar olarak görürler. İnançlarına göre kadınlar şeytanların günahlarından yaratıldıkları için mümin olamazlar. Ancak bir Nusayri kadını düzgün bir hayat yaşarsa bir sonraki yaşamında mümin bir erkek olarak dünyaya gelir. İnsan, küfründe ileri gittikçe kadın suretinde bir şeytan olur."},{"k":"p","x":"Kadınların hiçbir dinî sorumluluğu ve yükümlülüğü yoktur. Bu inançları sebebiyle günahsız kabul ettikleri Hz. Fâtıma’nın adını kullanmazlar kelimenin müzekkeri diye \"Fatır\"ya da “Fatim\"ismini kullanırlar."},{"k":"p","x":"**Ölüm ve cenaze merasimleri**: Ölenin cinsiyeti ve konumuna göre merasim yaparlar. Defin işlemlerinin hepsi evde veya kutsal kabul edilen bir ziyaret yerinde gerçekleştirilir, Cenaze olan evde yedi gün yemek pişmez, hiçbir ev işi yapılmaz, eğlenceden uzak durulur ve müzik dinlenmez. Bu yedi gün boyunca her sabah mezar ziyaret edilir. Yedinci gün ise kurban kesilir ve dinî bir tören yapılır. Ölünün kırkıncı gününde, bayramlarda ve ölüm yıl dönümlerinde de mezar ziyareti yapılır ve yoksullara çeşitli yiyecekler dağıtılır."},{"k":"p","x":"**Bayramlar**: Fıtır (Ramazan), Adha (Kurban), Gadir (Hz. Ali'nin imam tayin edildiği gün), Mübâhâle (Necranlı Hristiyanlarla Hz. Muhammed arasındaki lanetleşme olayı), Firaş (Hz. Ali'nin hicret gecesi Hz. Peygamber'in yatağına yatması), 9 Rebiyülevvel (Hz. Ömer'in şehit edildiği gün), 24/25 Aralık gecesi Hz. İsa'nın doğumu, Nevruz ve Mihrican bayramları. 10 Muharrem Aşure gününü ve Selman-ı Farisi'nin öldüğü 15 Şaban'ı matem günü olarak ihya ederler."}]},{"h":"Dini Hiyerarşi ve Fırkaya Giriş","b":[{"k":"p","x":"**a) Büyük Şeyhlik**: Geniş bir otoriteye sahip olup Hz. Ali'nin yeryüzündeki gölgesidir. Ataları melektir. Şeyhleri ve imamları seçerler."},{"k":"p","x":"**b) Şeyhlik**: Atalarının melek olduğuna inanılır. Şeyh olmak için şeyh ailesinden gelmek ve kültürlü olmak şarttır. Bunlar, en güzel ve en zengin kızlarla evlenirler. Bunlar topluma önderlik yaparlar. Ahirette şefaatçidirler.."},{"k":"p","x":"**c) Nüvvab:** Aşağı tabakanın şeyhleridir. Şeyh adayı statüsünde olup şeyhlere yardım ederler. Tecrübe kazanmaları ve yeterli görülmeleri hâlinde şeyh olarak görevlendirilirler."},{"k":"p","x":"**d) İmam**: II. Abdülhamit döneminde ihdas edilmiş bir sınıftır. Müslüman olduklarını beyan ettikleri için, onlara imam kadrosu tahsis edilmiş ve yerleşim merkezlerine camiler yaptırılmıştır. **Mezhebe Giriş Törenleri**: Mezhebe giriş, belirli yaş ve zihinsel olgunluğa ulaştıktan sonra bazı aşamalarla gerçekleşir. Yetişkin erkek kırk günlük, yedi veya dokuz aylık sınama dönemlerinden sonra mezhebe kabul edilir. Mezhebe girecek kişinin anne-baba yönünden Nusayri olması gerekir, Bir gencin cemaate dâhil olabilmesi için ana babasının Nusayrî olması, belli bir yaşı (muhtemelen 16-18 yaş) doldurması ve ölümle tehdit edilse bile sır saklayabilecek derecede güvenilir olması gerekir. Nusayrilikte cemaate giriş Nusayrî sayılmanın temel şartıdır."},{"k":"p","x":"Mezhebe giriş süreci ise üç aşamalı olup toplamda dokuz ayı bulmaktadır. Erkek çocuk mezhebe girecek yaşa geldiğinde babası güvendiği bir Nusayriye gider ve mezhebe girmesine aracı olmasını ister. **Din amcası** diye isimlendirilen bu kişi, mezhebe girecek bu gencin mürebbisi olma görevini üstlenir. Din amcası ile talip arasında sanal bir akrabalık olduğu kabul edilir; din amcasının çocukları onun kardeşleri olur ve birbirleriyle asla evlenemezler. Talip, din amcasının yanında öğrendiklerinden imtihana tabi tutulur, eğer başarılı olursa mezhebe giriş süreci başlatılır. **1) İlk Aşama ya da Meşveret Cemiyeti:** Çocuk nefsini alçalttığını, itaatkâr olacağını göstermek üzere şeyhin ve oradakilerin ayakkabılarını başına koyar. Bu aşamada çocuğa, a-m-s harflerinin sırrı verilmeden sadece bunlar bir şifre olarak tekrar ettirilir. Toplantı sonunda da uluhiyyet sembolü demek olan bir kadeh şarap içer ve \" **abdu'n-nur** \" adını alır."},{"k":"p","x":"**2) İkinci Aşama Melik Cemiyeti:** Birincisinden 40 gün sonra yapılan bir merasimdir. Şeyhin huzurunda mezhebe giren şahsa bir kadeh içki verilir ve a-m-s harflerinin sırrı açıklanır ve her gün 500 defa tekrar etmesi istenilir."},{"k":"p","x":"**3) Üçüncü Aşama:** ilk aşamadan yaklaşık dokuz ay sonra yapılan bu cemiyette kurban kesilip cemaat namazı kılınır, Şeyh gencin başına Kur'an-ı Kerim'i koyar ve onun ahlaki gelişimine orada bulunanların şahit olup olmadıklarını sorar. Cemaat onaylarsa kişi mezhebe kabul edilebilir."},{"k":"p","x":"Nusayrîler, mezhep mensubu bir ailenin çocuğu olarak dünyaya gelen, ancak daha sonra mezhepten ayrılan kimseleri **veled-i zina** kabul ederler ve onların mezhep içinde iken yaptıkları namaz ve kurban gibi önceki sevaplarni satın alırlar."}]},{"h":"Arap Aleviliği ile Anadolu Aleviliği Arasındaki Benzerlik ve Farklılıklar","b":[{"k":"p","x":"Nusayrilere geçtiğimiz asırda “Arap Alevîleri, Akdeniz Alevileri\" vb. isimler verilmiştir. Bu benzerlik Anadolu Aleviliği ile Arap Aleviliğinin aynı gerçekliğe sahip olduğu şeklinde yanlış bir anlamaya sebep olmuştur. İlim adamları bu farkı açıklarken Türk Aleviliğinin \" **Bektaşilik** \" olduğunu, buna asla Alevilik denilemeyeceğini belirttikten sonra, Anadolu Aleviliğinin İslam şeriatının Türk yorumu olduğunu ve bu sebeple **Türk kökenli Alevilerin şeriatçı ve tarikatçı** olduklarını dile getirmiştir."},{"k":"p","x":"**a) Köken açısından**: Mukayese edildiğinde Türkiye Alevilerinin kökeni Türk'tür, Suriye Alevilerinin kökeni Arap'tır. Türkiye Alevilerinin manevi önderleri Ahmet Yesevi, Hacı Bektaş-ı Veli gibi Türkmen sufilerdir. Hâlbuki Arap Alevîleri Arap şahsiyetleri önder kabul ederler."},{"k":"p","x":"Nusayrilik ayrı bir mezhep kabul edildiği hâlde, Anadolu Aleviliği İslam'ın içinde **Anadolu'ya özgü tasavvufi bir anlayış** olarak değerlendirilir."},{"k":"p","x":"Anadolu Aleviliği **Hanefi-Matüridî gelenek içinde teşekkül etmiştir**. Örneğin, Alevilerde abdest alırken çıplak ayak mesh edilmediği gibi, müt'a birlikteliği de yoktur."},{"k":"p","x":"**b) İnanç esasları:** Anadolu Aleviliğinde Hz. Peygamber, Kur'an, ahiret, melek gibi İslam'ın temel inanç ilkeleri hususunda genel olarak aşırılıklar bulunmazken, Nusayrilerin din anlayışında ciddi farklılıklar mevcuttur."},{"k":"p","x":"**c) Kutsal Kitap Tasavvuru**: Anadolu Alevileri, Kur'an'ın bir kısım ayetlerini Sünniler gibi yorumlamazlarsa da, kutsal kitabın bütünlüğü ve bağlayıcılığı hususunda farklı düşünmezler. Buna mukabil Nusayriler, Kur'an'ın muhtevasindaki mesajların niteliğinde ve niceliğinde, hatta kitabın adında bile muhalefet etmişlerdir. Onlar Kitâbü'l-Mecmu'yu kutsal kabul ederler."},{"k":"p","x":"**d) Ehl-i Beyt ve Sahabe Anlayışı**: Anadolu Aleviliğinde Hz. Ali ve Ehl-i Beyt'e karşı sevgi ve muhabbet olmakla birlikte -Ümeyye oğulları hariç- diğer sahabeye karşı bir nefret ve kötü söz vaki değildir. Nusayrîler, bütün sahabeyi lanetlerler."},{"k":"p","x":"**e) Âlem tasavvuru ve yaratılış:** Yukarıda geçtiği üzere alemin yaratılışı Hz. Ali üzerinden devam eder. Anadolu Aleviliğinde böyle inançlara yer yoktur."},{"k":"p","x":"**f) Ahiret inancı:** Anadolu Aleviliğinde ahiret, cennet ve cehennemin varlığıyla alakalı olarak birtakım tasavvufi yorumların dışında genel İslami anlayıştan farklı bir yan bulunmaz. Nusayrilerde ise reenkarnasyon inancı olduğundan İslamî anlamda bir ahiret hayatından söz edilemez."},{"k":"p","x":"**g) Bazı erkan ve uygulamalar**: Anadolu Alevîleri, erkanın gereklerini cem adı verilen toplantılarda yerine getirirler. Nusayrilik bireysel ibadeti esas alırken, Anadolu Alevilerinde ibadetler toplu halde yapılır. Alevilikteki cem evlerine karşılık, Nusayrilikte nüdeyveler vardır. Bununla birlikte Nusayri meskûn mahallinde cami de bulunmaktadır. Buralar insanı ilgilendiren tüm sosyal faaliyetlerin (nişan merasimi, evlenme, düğün, sünnet vs.) icrasında insanlara mutluluk getirdiğine inanılan kutsal mekânlardır. Anadolu Aleviliğinde camiler, ibadet mahalli olarak kabul edilmekte ve pek çok bölgede Alevi vatandaşlarımız namazlarını camilerde yerine getirmektedirler. Ayrıca semah ritüeli, Nusayrî mensekleri arasında yer almaz."},{"k":"p","x":"**h) Kadınların konumu**:. Nusayriler, kadınların erkeklerden aşağı bir varlık olduğunu, bu çerçevede dinen sorumlu olmadıklarını ve cemaate asla alınmamaları gerektiğini ileri sürerler. Anadolu Aleviliğinde böyle bir şey yoktur."},{"k":"p","x":"**k) Bayramlar:** Nusayrilerde bayramlar, Ehl-i Beyt ile ilgili önemli dini-siyasi olaylara endekslidir. Hristiyan bayramlarından da etkilenmişlerdir. Anadolu Aleviliğinde Türk ve İslam kültürünün dışındaki bayramlara yer verilmez."},{"k":"h","x":"Bazı Benzerlikler"},{"k":"li","x":"Anadolu Aleviliğinde sosyal ve ekonomik bir kurum olarak **musahiplik** müessesesi varken, Nusayrilikte de **din amcalığı** kurumu vardır, Nusayriler, belli bir yaşa ulaşmış genci din amcasına teslim ederek onun yetişmesini amaçlarlar. Anadolu Alevilerinde ise bu görevi musahip yapar."},{"k":"li","x":"Her iki grupta da **cemaate giriş** törensel bir mahiyet arz eder. Ancak Anadolu Alevîliğinde kadınlar da cemaate katılabilir."},{"k":"li","x":"Her iki inanç grubunun da dini inançlarını yaymak gibi bir hedefleri yoktur. Bundan dolayı tebliğ ya da propaganda yapma ihtiyacı hissetmezler."},{"k":"li","x":"Alevilik ve Nusayrîlik, doğuştan gelen ve asla sonradan kazanılan bir özellik de değildir."},{"k":"li","x":"Cemaat mensu bu olmak için Alevî ya da Nusayri bir anne-babadan doğmak gerekir."},{"k":"li","x":"Nusayriler, işe başlarken veya Ali'nin adı anıldığı yerde “ **Bism-i Ali** ” derler. Takdis ifade eden bu zikir tarzı Alevî-Bektaşilerde ise **“Bism-i Şah\"** şeklindedir."}]},{"h":"Nusayriliğin Yazılı Edebiyatı (Literatür)","b":[{"k":"li","x":"Nusayriler için bir eğitim ve ibadet kitabı olan **Kitabü'l-Mecmû'**, dinin temel kaynağıdır. **Hamdan el-Hasibi** (ö. 873-957) tarafından yazılmıştır."},{"k":"li","x":"**Hasibi'** nin Hz. Peygamber'i ve on iki imamı anlattığı **el-Hidayetü'l-Kübrâ** ile **el-Ma'ide** ve **divan** ını da zikretmek gerekir."},{"k":"li","x":"**Ebû Said et-Taberâni** 'nin Nusayri bayramlarını anlattığı Mecmû'u'l-A'yad, **Muhammed b. Hasan Müntecibüddin** 'in el-Hayâtü'r-Rühiyye, **Mekzûn es-Sincârî'nin** Ma'rifetullah, **Yusuf b. Acûz el-Halebi** 'nin el-Münazara, **Muhammed b. Yunus el-Kilazi** 'nin Divan ile Kitâbü't-Te'yid'i de önemlidir."},{"k":"li","x":"Yeni eserlerden **Süleyman Efendi'nin (Azeni)** el-Bakûretü's-Süleymaniyye fi Keşfi Esrân Diyaneti'n-Nusayrîy ye'si ve **Muhammed Emin Galib et-Tavil'in** (ö. 1932) Târîhu'l-'Aleviyyin' önemlidir."},{"k":"li","x":"**Ülkemizde** ise Türkiye Nusayrîliği konusunda ilk çalışma **Baha Said** (ö. 1939) tarafından yapılmıştır. İkinci çalışma Hatay'ın Türkiye'ye katılmasının akabinde **Hasan Reşit Tankut** tarafından 1938'de gerçekleştirilmiş olup eserde Nu sayrilerin etnik kökenleri üzerinde durulmuştur. Yine son yıllarda konu hakkında bazı akademik çalışmalar ve makaleler yayımlanmıştır."}]},{"h":"Günümüzdeki Durumları","b":[{"k":"p","x":"Günümüzde Nusayrilik çoğunlukla Suriye'nin Lazkiye ve Cebel-i Ensariyye yöresinde, Lübnan'ın kuzey bölgesinde, Türkiye'de başta Antakya olmak üzere Adana, Mersin, İskenderun ve Tarsus civarında varlığını sürdürmektedir. Elde kesin bir veri olmamakla birlikte Nusayrilerin toplam nüfusunun **bir buçuk milyon** kadar olduğu; bunun takriben **500 bin kadarının Türkiye'de** yaşadığı tahmin edilmektedir. Günlük konuşmalarında yaygın bir şekilde Arapçayı kullanan Türkiye'deki Nusayrilerin, Suriye'deki Nusayrilerle bağlarının devam etmediği dikkat çekmektedir. Bu farklılaşmada devletlerin takip ettiği millî bütünlük politikalarının etkili olduğu düşünülmektedir."}]},{"h":"Tanım ve İsimlendirme","b":[{"k":"p","x":"Nusayrilik, Şii kökenli ve batıni (içrek) karaktere sahip bir mezheptir. İnanç sisteminde **Hz. Ali'nin ilahlaştırılması (hulul)** ve **tenasüh (ruh göçü)** gibi aşırı fikirleriyle bilinir ve farklı din ve felsefelerden karma bir yapıya sahiptir."},{"k":"p","x":"Mezhep, büyük ihtimalle kurucusu **Ebu Şuayb Muhammed b. Nusayr en-Nemiri'den (ö. 270/883)** adını almıştır. Başlangıçta **\"Nemiriyye\"** olarak anılırken, Hicri V. asırdan itibaren (11. yüzyılın ortaları) **\"Nusayri\"** ismi yaygınlaşmıştır."},{"k":"p","x":"Mezhep mensupları, kendilerine atfedilen aşırılıklar nedeniyle **\"Nusayri\"** ismini hoş görmemiş ve özellikle son dönemlerde kendilerini **\"Alevi\"** ya da **\"Arap Alevisi\"** olarak adlandırmayı tercih etmişlerdir. Türkiye'de bazen **\"Çukurova Aleviliği\", \"Suriye Aleviliği\", \"Akdeniz Aleviliği\",** Osmanlı kaynaklarında **\"Garipler Cemaati\",** Adana şer'i mahkeme sicillerinde **\"Bahçeciler\",** halk arasında **\"fellah\"** ve etnik kökenlerine vurguyla **\"Arap Uşağı\"** gibi isimlerle de anılırlar. Mezhep mensupları kendilerini daha çok **\"Mü'miniyye/Mü'minün\"** olarak ifade ederler ve **\"Nusayri\"** isminin **\"zafer kazanmak\"** ve Hz. Ali'nin safında **\"düşmana karşı savaşmak\"** anlamlarına geldiğini ileri sürerler. I. Dünya Savaşı'nın ardından, Fransız Mandası döneminde (1920'ler) mensuplarının uygun görmesiyle **\"Alevi\"** adıyla anılmaya başlanmıştır."}]},{"h":"Oluşum Süreci ve Tarihçe","b":[{"k":"p","x":"Nusayrilik, Hicri III. ve IV. yüzyıllarda (9. ve 10. yüzyıllar), felsefi cereyanların, antik Yunan eserlerinin Arapçaya tercümelerinin ve Şii-batıni düşüncelerin yaygınlık gösterdiği bir dönemde ortaya çıkmıştır. Gulat Şii fırkalarının uluhiyet ve peygamberlik telakkisi ile Şii İmamiyye geleneğinden gelen Mehdilik inancı, Nusayriliğin doğuşundaki en önemli sebepler arasındadır. Dini alandaki bilgi yetersizliği ve Abbasiler dönemindeki siyasi otorite boşluğu da mezhebin ortaya çıkışını kolaylaştırmıştır. Mezhep mensupları, Nusayriliğin kökenini Gadir-i Hum ve Kerbela olaylarına dayandırır; Hz. Peygamber'in Hz. Ali'yi halife tayin etmesine rağmen bu vasiyete sadık kalınmadığına ve Hz. Ali'nin hakkının gasp edildiğine inanırlar."},{"k":"p","x":"Mezhep, III. (IX.) yüzyılda muhtemelen **Basra'da Muhammed b. Nusayr** tarafından kurulmuştur. İbnü'n-Nusayr, Onikinci İmam Ali el-Hadi en-Naki'nin ilahlığını, kendisinin de onun peygamberi olduğunu iddia etmiş; tenasühü benimsemiş ve haramları helal saymak gibi aşırı görüşler ileri sürmüştür."},{"k":"p","x":"İbnü'n-Nusayr'dan sonra fırkanın başına **Muhammed b. Cündeb,** ardından da **Ebu Muhammed Abdullah b. Muhammed el-Cenan el-Cünbülanî** geçmiştir. Cünbülanî, Cünbülaniyye adıyla bir tarikat kurarak fırkaya tasavvufi bir boyut kazandırmıştır."},{"k":"p","x":"Cünbülanî'nin ölümü üzerine hareketin başına geçen **Ebu Abdullah Hüseyin b. Hamdan el- Hasibi (ö. 346/957 veya 358/969),** fırkanın dini-mistik karakterinin geliştirilmesi ve yayılmasında en önemli şahsiyetlerden biri olmuş ve bu sebeple **\"Şeyhüddin\"** olarak anılmıştır. Hasibi, Nusayri inanç, ibadet ve uygulamalarını yazılı hale getiren kişidir. Hasibi'den sonra fırka, V. (XI.) yüzyılda **Meymun et-Taberanî** döneminde inanç esaslarının son şeklini almasıyla Lazkiye'ye taşınmıştır."},{"k":"p","x":"**Muhammed b. Yunus el-Kilazi zamanında (ö. 1011; 1602)** fırka, Hz. Muhammed ve Hz. Ali'den bahseden ibarelerin yorumu konusunda **Haydariyye (Gaybiyye, Şemsiyye)** ve **Kilaziyye (Kameriyye)** olmak üzere ikiye ayrılmıştır."},{"k":"p","x":"Nusayrilik, Irak'ta ortaya çıkmasına rağmen V. (XI.) yüzyılın ortalarından itibaren daha çok **Suriye ile Adana-Mersin yöresinde** yaygınlık kazanmıştır. Haçlı seferleri döneminde halk büyük sıkıntılar yaşamış, fırkanın Haçlılar'a yardım ettiğine dair iddialar olsa da Nusayri tarihçileri toplumun Haçlılar'a karşı mücadele ettiğini belirtir. Memlükler döneminde (Sultan Baybars ve Kalavun zamanı) Nusayriler'i yaygın İslami anlayışa katma teşebbüsleri olmuş, fırkaya girmek yasaklanmış ve cami yapma mecburiyeti getirilmiş, ancak bu camiler kısa sürede âtıl kalmıştır."},{"k":"p","x":"**Mercidabık Savaşı (922/1516)** sonrasında Osmanlı idaresine girmişler, 1839'daki Mısır isyanında devlete sadık kalmışlardır. II. Abdülhamid döneminde zorunlu askerliğe tabi tutulmuşlar, camiler inşa edilmiş ve imamlar tayin edilmiş, ancak bu tedbirler sınırlı kabul görmüştür. I. Dünya Savaşı'nın ardından bölge önce İngiliz, sonra Fransızlar tarafından işgal edilmiş ve Osmanlı etkisi yitirilmiştir. **1920'de \"Alevi toprağı\"** adıyla idari bir birim kurulmuş, bu isim **1922'de \"Aleviler Devleti\"** olarak değiştirilmiştir. **1936'da Suriye Devleti'nin** bir vilayeti olmuş, **1942'de Lazkiye idaresi Suriye'ye** katılmıştır."},{"k":"p","x":"**Günümüzde Nusayriler,** Suriye'de (özellikle Lazkiye ve Cebel-i Ensariyye bölgeleri, nüfusun %8-12'si), Türkiye'de (Hatay, İskenderun, Adana, Mersin, Tarsus) ve Lübnan'ın kuzey bölgelerinde yaşamaktadırlar."},{"k":"p","x":"**Hafız Esad (1970'ten itibaren) ve Beşar Esad** dönemlerinde Aleviler (Nusayriler) devlet yönetiminde etkili olmuş, ancak bu durum bir **\"Alevi diktatörlüğü\"** olarak yanlış algılanmıştır; Esadlar, Sünni çoğunluğu yönetimde tutmuş, Alevileri ise istihbarat ve kritik pozisyonlarda kullanmışlardır. Esad ailesinin doğum yeri olan Kardaha, Alevilerin yoğun olduğu bir bölge olmasına rağmen buraya yatırım yapılmamıştır."},{"k":"p","x":"**Suriye İç Savaşı'nda (2011'den itibaren)** Aleviler hedef alınmış, özellikle Humus ve Lazkiye'de katliamlara maruz kalmışlardır. HTŞ (Heyet Tahrir eş-Şam) gibi grupların kontrol ettiği bölgelerde Alevilere yönelik ayrımcılık ve şiddet rapor edilmiştir; örneğin, Humus'ta 147 Alevi öldürülmüş, kadınlar tacize uğramış ve kontrol noktalarında mezhep sorgulamaları yapılmıştır. Zulüm nedeniyle yaklaşık 100.000 Alevi Lübnan'a kaçmıştır. Türkiye'de Hatay'da Alevilere yönelik şiddeti protesto etmek isteyen gruplar engellenmiş, bu durum gelecek kaygılarını artırmıştır. Aleviler, Suriye'de yeni kurulacak hükümetlerde temsiliyet ve eşitlik talep etmektedirler."}]},{"h":"Nusayrî İnanç Esasları","b":[{"k":"p","x":"Nusayri inançları, İslam'dan kaynaklanmakla birlikte tamamen batıni tevillere dayanır. Hristiyanlık, Yahudilik, Paganizm, Mecusilik, Mazdekilik, Yeni Eflatuncu felsefe ve Sabilik gibi farklı din ve felsefelerden etkileşimler taşır."},{"k":"p","x":" **Hz. Ali'nin İlahlaştırılması (Hulul):** Nusayri görüşlerinin temelini oluşturur. Mezhebe göre, Tanrı zuhur ve tecelliler yoluyla insanlar arasında ortaya çıkmıştır ve en önemlisi **Hâkim Biemrillah'ta** meydana gelmiştir. Hz. Ali, Tanrı'nın yeryüzündeki yansıması olarak görülür ve ilahi bir varlık kabul edilir. Tanrı'nın daha önce altı defa beşer olarak tezahür ettiği, yedincisinin ise Hz. Muhammed döneminde Hz. Ali'de gerçekleştiğine inanılır. Bu \"yedi devir\"; Adem (Habil), Nuh (Şit), Yakup (Yusuf), Musa (Yuşa'), Süleyman (Asaf), İsa (Batıra/Petrus) ve Hz. Muhammed (Ali) dönemleridir. Haydariyye'ye göre Ali göktedir (mana'nın bulunduğu yer) ve Muhammed'i temsil eden güneşte oturmaktadır; Kilaziler'e göre ise ay Ali'nin makamı, güneş Muhammed, gök Selman'dır."},{"k":"p","x":" **Tenasüh (Ruh Göçü/Tekammus):** Ruhun ölümden sonra başka bedenlerde varlığını sürdürdüğü inancı temeldir. İyi ruhların yıldızlara dönüşerek nur alemine yükseleceğine, kötü ruhların ise hayvan bedenlerine gireceğine inanılır. Yeni beden, ölen kişinin önceki inanç ve yaşayışına göre değişir. Sırları bilerek ve gereklerine göre yaşayan bir Nusayri mümin, yedi değişim geçirip yıldızlar arasında yerini alır. İnkârı ve kötülüğü seçenler köpek, deve, katır, koyun gibi hayvanlar; çok çirkin davrananlar ise necis hayvanlar veya haşerelerin bedenlerine girerler. Kafirlere için hayvan olarak dünyaya gelme devirler boyu devam eder ve sonunda Mehdi el-Muntazar ortaya çıkınca bunları insan şekline döndürüp öldürür. Bu inanç, cennet ve cehennemin sembolik olarak yorumlanmasına yol açar."},{"k":"p","x":" **Mana-İsim-Bab Üçlemesi:** Uluhiyetin simgesi olarak kabul edilen bir üçleme vardır: **Allah (Mana), Hz. Muhammed (İsim) ve Selman-ı Farisi (Bab)** arasındaki ilişki esastır. Nusayri şehadeti \"A-M-S\" harflerinden oluşur ve bu Ali, Muhammed ve Salman anlamlarına gelir. Ali'nin nurunun Muhammed'e, Muhammed'in nurunun da Salman'a geçtiğine inanılır. Ana kitapları **Kitabü'l-Mecmu',** bu inancı \"Ben şehadet ederim ki Ali b. Ebu Talib'den başka ilah, Muhammed Mahmud'dan başka hicab, Selman-ı Farisi'den başka bab yoktur\" şeklinde özetler."},{"k":"p","x":" **Gizlilik (Takiyye/Sır):** Mezhebin önemli bir özelliğidir. Mezhebe ait sırlar çocuklara, kadınlara ve sıradan kişilere açıklanmaz. Sırrı ifşa edenler ölümle cezalandırılır. İbadetler, dualar ve zikirler gizli toplantılarda yapılır."},{"k":"p","x":" **Zahir-Batın Ayrımı ve Tevil:** Kutsal metinlerin zahiri (açık) anlamlarının yanı sıra batıni (gizli, gerçek) anlamları olduğuna inanılır. Hakikate ancak batıni ilimle ulaşılabileceği düşünülür."},{"k":"p","x":" **Sayıların Kutsallığı (Yedi):** Özellikle yedi sayısı kutsal kabul edilir ve alemin nizamı ile tarihi hadiseler bu sayıya göre tertiplenir (örn. yedi tecelli, yedi devir peygamberi)."},{"k":"p","x":" **Peygamberlik Anlayışı:** Peygamberlerin ilahi nurdan bir parça olduğuna, insan üstü vasıflara sahip olduklarına inanılır. Nurdan olup cesetsiz iner, sonra bedene bürünürler. Adem'den Hz. Muhammed'e kadar 100.000 peygamber gelmiştir ve Hz. Muhammed bunların temsilcisidir."},{"k":"p","x":" **Melek İnancı:** Allah'ın sayılamayacak kadar meleği olduğuna inanılır. Arşı taşıyan sekiz kutsal melek vardır. Zuhal yıldızı Mikail meleğidir ve yeryüzündeki karşılığı **Mikdad b.** Esved'dir. Hz. Ali'nin çocukları Hasan ve Hüseyin birer melektir."},{"k":"p","x":" **Vahiy:** Davud'a Zebur'un, Musa'ya Tevrat'ın, İsa'ya İncil'in ve Hz. Muhammed'e Kur'an'ın verildiğini kabul ederler. Kur'an'a saygı gösterirler ancak batıni manalarının bulunduğuna ve kendilerinin bu manalara vakıf olduğuna inanırlar."},{"k":"p","x":" **Sahabeye Bakış:** Hz. Ebubekir, Ömer, Osman, Talha, Sa'd ve Muaviye gibi bazı sahabelere karşı kin ve düşmanlık beslerler, onları şeytanın sembolleri olarak görürler."}]},{"h":"İbadetler ve Dini Hayat","b":[{"k":"p","x":"Nusayrilikte İslam'ın beş şartı isim olarak aynı olsa da yerine getirilişleri tamamen farklı ve batıni özellikler taşır."},{"k":"p","x":" **Namaz:** Fiziksel bir ibadet değil, sesli yapılan bir dua şeklindedir. Gizli ve bireyseldir, camiye ihtiyaç yoktur. Kıble şartı aranmaz. Genellikle öğleye kadar güneşe doğru, öğleden sonra batıya doğru kılınır. \"Batıni namaz\" adını taşır ve Ali'ye açılan kalbin niyazı anlamındadır. Beş seçkini (Hz. Muhammed, Fatır-Fatıma, Hasan, Hüseyin ve Muhassin) zihinde tutmak, dua esnasında gülmemek ve konuşmamak, siyah takke giymemek, gizliliğe riayet etmek ve namazı \"Müminlerin emiri büyük ve yüce Ali, bize merhamet et\" diyerek bitirmek temel şartlarıdır. Kur'an-ı Kerim'den bazı kısa sureler ile Kitabü'l-Mecmu'daki sureleri ve **\"kuddas\"** adı verilen özel duaları okumaktan ibarettir. Toplu namazlar şeyh ziyareti, bayramlar ve yola giriş merasimleri gibi vesilelerle kılınır; kadınlar ve topluma kabul edilmemiş olanlar alınmaz. Bu namazda ezan okunur, elde dolaşan kadehten bir yudum alınır ve bazı surelerin okunması sırasında secde edilir. **\"Teberri duası\"** gibi dualar okunur ve bu duada ilk üç halifeden uzak oldukları belirtilir."},{"k":"p","x":" **Oruç:** Hz. Muhammed'in babası Abdullah'ın sessizliğini sembolize eder. Sırları başkalarından gizlemek anlamına gelir. Ramazan ayı Abdullah, Kur'an Hz. Muhammed'dir. Ramazan günleri kutsal kişileri temsil eder."},{"k":"p","x":" **Zekât:** Dini öğrenmek ve insanlara aktarmak anlamına gelir. Selman-ı Farisi'yi temsil eder. Pratikte maddi zekâtın şeyhe verilmesi zorunludur."},{"k":"p","x":" **Hac/Ziyaretler:** Mekke ve Medine ziyareti yerine kendi kutsal mekanlarına (ziyaret yerleri veya türbeler) yapılan ziyaretler hac yerine geçer. Samandağ'da Hızır Türbesi başta olmak üzere yirmiye yakın ziyaret yeri bulunmaktadır. Bilinen hac ibadetiyle ilgisi yoktur."},{"k":"p","x":" **Cihad:** Hz. Ali'ye haksızlık ettiklerine inanılan sahabelere lanet etmek olarak yorumlanır."},{"k":"p","x":" **Şarap Kültü:** Üzüm suyu veya şarap **\"Nakfi\"** adıyla kutsal sayılır ve uluhiyetin simgesi kabul edilir. Özel gizli törenlerde **(Kuddes)** içilir."},{"k":"p","x":" **Bayramlar:** Ramazan ve Kurban Bayramları ile Şiiler'e has kutsal günlerden başka, bazı eski dini inançlardan gelen bayramlar da vardır: Gadir Bayramı, Firaş Bayramı, Nevruz Bayramı, Mihrican Bayramı ve İsa'nın doğumu Bayramı."},{"k":"p","x":" **Boşanma:** Nusayrilikte boşanma **ayıplanan ve kınanan bir şeydir.** Bununla birlikte, zina ve ahlaksızlık mutlak boşanma sebebidir. Boşanmış kadın, dini bayramlar, adaklar ve hayır işleri dahil hiçbir dini etkinliğe katılamaz"}]},{"h":"Sosyal Yapı ve Hiyerarşi","b":[{"k":"p","x":"Nusayrilik, katı bir kast sistemine benzer sınıflar arası geçişlere izin vermeyen bir yapıya sahiptir."},{"k":"p","x":" **Dini Hiyerarşi: \"Ukkal\"** (bilenler) ve **\"Cuhhal\"** (bilmeyenler/avam) olmak üzere iki ana gruba ayrılır. Ukkal sınıfı içinde Büyük Şeyh, Şeyh, Nüvvab, İmam, Pir, Fakir, Kavval ve Köçekler bulunur. Hiyerarşi, Büyük Şeyhlik, Şeyhlik, Nakiblik ve Neciblikten oluşur."},{"k":"li","x":"**Büyük Şeyh:** Geniş bir otoriteye sahip olup Hz. Ali'nin yeryüzündeki gölgesi kabul edilir."},{"k":"li","x":"**Şeyhlik:** Babadan oğula intikal eder ve şeyhler toplumun dini ihtiyaçlarını karşılar."},{"k":"li","x":"**Nakibler:** Şeyhlere yardımcı olan şeyh adaylarıdır."},{"k":"li","x":"**Neciblik:** Toplantılarda şeyhe yardımcı olan yaşlı veya itibarlı kimselerin yerine getirdiği ara bir görevdir."},{"k":"p","x":" **Mezhebe Giriş:** Belirli bir yaşa (16-18) ve zihinsel olgunluğa ulaştıktan sonra belirli aşamalarla gerçekleşir. Giriş töreni üç aşamalı olup dokuz ayı bulur ve gencin **\"din amcası\"** denilen bir mentor yanında eğitim görmesi esastır. Giriş merasiminden sonra genç, Kitabü'l-Mecmu' ve diğer duaları öğrenir. Nusayrilik gizliliği benimseyen bir fırkadır ve bütün öğretiler sır konumundadır; bunları başkalarına bildirmek ağır suçtur."}]},{"h":"Kadınların Konumu","b":[{"k":"p","x":"Nusayrilerde kadınlar hor, değersiz ve düşük yaratıklar olarak görülür. Şeytanların günahlarından yaratıldıklarına ve ruhlarının olmadığına inanılır. Kadınların dini bilgileri ve sırları öğrenmeleri kesinlikle yasaktır, dini sorumlulukları ve yükümlülükleri yoktur. Bu sebeple Hz. Fatıma'nın adını kullanmaktan kaçınarak \"Fatır\" ya da \"Fatım\" ismini tercih ederler. Nusayri bir kadın düzgün bir hayat yaşarsa, bir sonraki yaşamında mümin bir erkek olarak dünyaya geleceğine inanılır. **Bir kaynakta ise kadınların \"sırrı ifşa edebilirler\" gerekçesiyle toplantılara katılmadığı ancak günlük hayatta eşit muamele gördüğü belirtilmektedir.**"}]},{"h":"Yazılı Edebiyat (Literatür)","b":[{"k":"p","x":"Nusayrilik hakkında fırka mensubu müelliflerin klasik ve yeni dönemde kaleme aldıkları eserler ile modern dönemde yapılan çalışmalar olmak üzere iki ana literatür grubu bulunur.  **Klasik ve Yeni Dönem Eserleri:**"},{"k":"li","x":"En önemli kutsal kitabı, Hasibi'ye nispet edilen ve her Nusayri'nin ezberlemesi gereken **Kitabü'l-Mecmu'dur.** Bu eser, Süleyman Efendi tarafından neşredildikten sonra Batılı müsteşriklerin ilgisini çekmiş ve çeşitli dillere çevrilmiştir."},{"k":"li","x":"Diğer önemli eserler arasında Süleyman Efendi'nin **\"el-Baküretü's- Süleymaniyye fi keşfi esrarı diyaneti'n-Nuşayriyye\"** ve Muhammed Emin Galib et-Tavil'in **\"Tarihu'l-'Aleviyy'in\"** sayılabilir. Ayrıca Hasibi'nin \"el- **Hidayetü'l-kübra\"** ve **\"el-Ma'ide\",** Mekzun es-Sincari'nin **\"Ma'rifetullah\"** gibi eserleri de bulunmaktadır."},{"k":"h5","x":" Modern Çalışmalar"},{"k":"li","x":"Rene Dussaud, Louis Massignon gibi batılı şarkiyatçıların ilk çalışmaları 1930'lara kadar uzanır."},{"k":"li","x":"R. Storthmann, Claude Cahen ve Kais M. Firro gibi isimlerin fırkanın tarihi ve bölgesel siyasal/kültürel gelişmeleri hakkındaki çalışmaları bulunur."},{"k":"li","x":"Doğu dünyasından Abdurrahman Bedevi, Muhammed Ahmed el-Hatib ve Sahir Muhammed Ali el-Fil gibi yazarların önemli yayınları vardır."},{"k":"li","x":"Türkiye'deki ilk çalışmalar Bahir Said Bey'in saha araştırmalarıdır. Ahmet Turan, İlhan Keser, Engin Sertel ve Cahit Aslan gibi isimlerin doktora tezleri ve kitapları da önemli Türkçe kaynaklardır."}]},{"h":"Günümüzdeki Durumu","b":[{"k":"p","x":"Nusayrilik, günümüzde Suriye'nin Lazkiye ve Cebel-i Ensariyye yöresi, Lübnan'ın kuzey bölgesi ve Türkiye'de Hatay, Adana, Mersin, İskenderun ve Tarsus civarında varlığını sürdürmektedir. Tahmini nüfusları bir buçuk milyon civarında olup, yaklaşık 500 bini Türkiye'de yaşamaktadır."},{"k":"p","x":"Modern eğitim ve dünya görüşleri nedeniyle, özellikle Ay, Güneş ve Göğe dair inançlardaki çelişkiler genç kuşaklarda sorgulamalara yol açmıştır. Son yıllarda sosyo-politik sebeplerle Nusayrilik ile İmamiyye Şiiliği arasında ciddi yakınlaşmalar görülmektedir. Suriye'de %11- 12'lik bir nüfusa sahip olan bu grup, Esad yönetimi altında kısmen etkili olsa da iç savaşta hedef haline gelmiştir"}]},{"h":"Arap Aleviliği (Nusayrilik) ile Anadolu Aleviliği Arasındaki Farklar","b":[{"k":"p","x":" **Köken:** Anadolu Aleviliği Türk kökenli ve Türkçe konuşurken, Nusayrilik Arap kökenli ve Arapça konuşur."},{"k":"p","x":" **Manevi Önderler:** Anadolu Aleviliğinde Ahmet Yesevi, Hacı Bektaş-ı Veli gibi Türkmen sufiler varken, Nusayrilerde Arap şahsiyetler önder kabul edilir."},{"k":"p","x":" **Mezhepsel Yapı:** Anadolu Aleviliği Hanefi-Matüridi gelenek içinde gelişmiş, İslam'ın içinde tasavvufi bir anlayış olarak değerlendirilir. Nusayrilik ise Şii kökenli, daha batıni ve kendine özgü inançlara sahiptir."},{"k":"p","x":" **İnanç Esasları:** Nusayrilerde Hz. Ali'nin tanrısal yönü ön plandadır; Anadolu Aleviliğinde ise genel İslami inanç ilkelerine bağlılık daha belirgindir."},{"k":"p","x":" **Kutsal Kitap:** Anadolu Alevileri Kur'an'ın bütünlüğüne inanırken, Nusayriler, Abdullah bin Hamdan el-Hasibi'nin **\"Kitabü'l-Mecmu'\"** adlı eserini kutsal kitap kabul ederler. Onlara göre Kur'an'daki bazı ayetler kasten çıkarılmıştır."},{"k":"p","x":" **Ahiret İnancı:** Nusayrilerde reenkarnasyon (tenasüh) inancı temeldir, geleneksel İslami ahiret inancından farklıdır. Anadolu Aleviliğinde ise tenasüh inancı bulunmaz."},{"k":"p","x":" **İbadetler:** Nusayrilik bireysel ve gizli ibadeti esas alırken, Anadolu Aleviliğinde ibadetler cemevlerinde topluca yapılır. Nusayrilikte camilere ihtiyaç duyulmaz, ibadet yeri olarak kullanılmazlar. Semah ritüeli Anadolu Aleviliğine özgüdür, Nusayrilerde bulunmaz."},{"k":"p","x":" **Kadınların Konumu:** Nusayrilerde kadınlar dini bilgi ve sırlardan mahrum bırakılır, cemaate alınmazlar ve dini sorumlulukları yoktur. Anadolu Aleviliğinde ise kadın- erkek eşitliği esastır ve dini ayinler bir arada yapılır."}]},{"h":"Kavramlar ve Hızlı Tekrar","b":[{"k":"d","t":"Mânâ-İsim-Bâb","x":"Nusayrî üçlemesi: Ali (mânâ), Muhammed (isim) ve Selmân-ı Fârisî (bâb)."},{"k":"d","t":"Tekammus","x":"Ruhun ölümden sonra başka bir bedene geçmesi (tenâsüh)."},{"k":"d","t":"Beş eytâm","x":"Nusayrî inancında âlemin yaratılışında görevli beş kutsal şahsiyet: Mikdâd, Ebû Zer, Abdullah b. Revâha, Osman b. Maz'ûn, Kanber."},{"k":"d","t":"Ukkāl ve cühhâl","x":"Dinî sırlara vâkıf olanlar (ukkāl) ve bilmeyen halk (cühhâl) ayrımı."},{"k":"d","t":"Kitâbü'l-Mecmû'","x":"Hasîbî'ye nispet edilen, her Nusayrî'nin ezberlemesi gereken temel kitap."}]}],"ht":[{"s":18,"x":"Nusayrîlik, adını Muhammed b. Nusayr en-Nemîrî'den (ö. 270/883) alır; Hüseyin b. Hamdân el-Hasîbî ile yayıldı, merkezi Suriye'ye kaydı."},{"s":18,"x":"Nusayrî inancının temeli Hz. Ali'nin ilahlaştırılması (hulûl) ve tenâsühtür; şarap kutsal sayılır, gizlilik ve takiyye esastır."},{"s":18,"x":"İbadetler bâtınî yorumlanır: namaz gizli dua, oruç sırları saklamak, hac kutsal mekânları ziyaret, cihad sahabeye lanet."},{"s":18,"x":"Anadolu Aleviliğinden farkı: Arap kökeni, Ali'nin tanrısallığı, tenâsüh, gizli ve bireysel ibadet, kadınların dinî hayattan dışlanması."}],"oz":{"t":"Bâtınî Eğilimli Akımlar: Nusayrîlik · Özet","intro":"Ünitenin özü: Nusayrîlik nasıl doğdu, Hz. Ali'yi nasıl konumlandırır, ibadetleri ve hiyerarşisi nasıldır, Anadolu Aleviliğinden nasıl ayrılır?","s":[{"h":"Ad ve Tarihçe","b":[{"k":"li","x":"**Ad:** Büyük ihtimalle kurucusu **Ebû Şuayb Muhammed b. Nusayr en-Nemîrî**'den (ö. 270/883) gelir; önce \"Nemîriyye\" denmiş, V/XI. yüzyıldan itibaren \"Nusayrî\" adı yaygınlaşmıştır. Oryantalistlerin Hristiyanlıkla ilişkilendiren iddiaları ve mensupların Asr-ı saadete dayandıran açıklamaları da vardır. Mensupları bu adı sevmez; kendilerine **Alevî** veya **Arap Alevî** derler."},{"k":"li","x":"**Doğuş:** III/IX. yüzyılda Irak'ta, onuncu imam Ali en-Nakī ve on birinci imam Hasan el-Askerî zamanında ortaya çıktı. İbn Nusayr'ın Hasan el-Askerî'ye açılan kapı (**bâb**) olduğunu, bir rivayete göre de Ali en-Nakī'nin ilahlığını ve kendisinin onun peygamberi olduğunu iddia ettiği nakledilir."},{"k":"li","x":"**Gelişme:** **Hüseyin b. Hamdân el-Hasîbî** (ö. 346/957 veya 358/969) mezhebin dinî-mistik karakterini geliştirip yaydı; merkez zamanla **Suriye**'ye (Lazkiye, Cebel-i Ensâriyye) kaydı. Muhammed b. Yûnus el-Kilâzî zamanında (ö. 1011/1602) mezhep, Kitâbü'l-Mecmû'daki bazı ibarelerin yorumu yüzünden **Haydariyye (Şemsiyye)** ve **Kilâziyye (Kameriyye)** diye ikiye ayrıldı."},{"k":"li","x":"**Osmanlı ve sonrası:** 922/1516 Mercidâbık'tan sonra Osmanlı idaresine girdiler. Hâfız Esed (1970) ve Beşşâr Esed dönemlerinde Suriye yönetiminde etkili oldular."}]},{"h":"İnanç Esasları","b":[{"k":"li","x":"**Tanrı inancı:** Hz. Ali'nin ilahlaştırılması (hulûl); **Mânâ-İsim-Bâb** üçlemesi: Ali (mânâ), Muhammed (isim/hicap), Selmân-ı Fârisî (bâb)."},{"k":"li","x":"**Beş Eytâm (beş yetim):** Mikdâd, Ebû Zer, Abdullah b. Revâha, Osman b. Maz'ûn ve Kanber b. Kâdân; âlemin yaratılışında görevli kutsal şahsiyetler."},{"k":"li","x":"**Tenâsüh (tekammus):** Ruh başka bedenlere geçer; iyiler yıldızlara yükselir, kötüler hayvan bedenlerine girer."},{"k":"li","x":"**Cennet ve cehennem** semboliktir; peygamberler ilâhî nurun parçasıdır; melekler ve şeytanlar sembolik yorumlanır."},{"k":"li","x":"**Gizlilik ve takiyye:** Sırlar kadınlara, çocuklara ve yabancılara açıklanmaz."},{"k":"li","x":"**Şarabın kutsanması:** Şarap (nakfi) uluhiyetin sembolü sayılır."}]},{"h":"İbadetler ve Dinî Hayat","b":[{"k":"tbl","r":[["İbadet","Nusayrîlikteki anlamı"],["Namaz","Sesli, gizli ve bireysel dua; camiye ihtiyaç yok"],["Oruç","Sırları gizlemek; Hz. Muhammed'in babası Abdullah'ın sessizliğini sembolize eder"],["Zekât","Dini öğrenip aktarmak; Selmân'ı temsil eder"],["Hac","Kendi kutsal mekânlarını (ziyaret yerleri) ziyaret"],["Cihad","Hz. Ali'ye haksızlık ettiği düşünülen sahabeye lanet"]]},{"k":"p","x":"Bayramlar arasında Ramazan ve Kurban bayramlarının yanında **Gadîr-i Hum**, **Nevruz**, **Mihrican**, Noel ve Paskalya gibi günler de vardır."}]},{"h":"Toplumsal Yapı","b":[{"k":"li","x":"**Ukkāl** (bilenler) ve **cühhâl** (avam) ayrımı; büyük şeyh, şeyhler (babadan oğula), nakipler ve necipler."},{"k":"li","x":"Mezhebe giriş 16-18 yaşlarında, belirli aşamalarla ve gizlilik yeminiyle olur."},{"k":"li","x":"Kadınlar dinî bilgi ve sırlardan uzak tutulur, cemaate alınmaz."}]},{"h":"Arap Aleviliği ile Anadolu Aleviliği","b":[{"k":"tbl","r":[["Konu","Nusayrîlik","Anadolu Aleviliği"],["Köken ve dil","Arap, Arapça","Türk, Türkçe"],["Önderler","Hasîbî ve Nusayrî şeyhleri","Ahmed Yesevî, Hacı Bektaş-ı Velî"],["İnanç","Ali'nin tanrısal yönü öne çıkar; tenâsüh temeldir","Tasavvufî, Kur'an'ın bütünlüğü kabul edilir"],["İbadet","Bireysel ve gizli","Cemevlerinde, kadın-erkek birlikte"],["Kadın","Sırlardan mahrum","Cemlere katılır"]]}]},{"h":"Literatür ve Günümüz","b":[{"k":"li","x":"Temel kitap Hasîbî'ye nispet edilen ve her Nusayrî'nin ezberlemesi gereken **Kitâbü'l-Mecmû'**dur; Süleyman Efendi'nin **el-Bâkûretü's-Süleymâniyye**'si mezhebin sırlarını ifşa eden önemli bir kaynaktır."},{"k":"li","x":"Bugün Suriye (nüfusun yaklaşık %8-12'si), Lübnan'ın kuzeyi ve Türkiye'de Hatay, Adana ve Mersin çevresinde yaşarlar."}]}]}},{"t":"Dürzîlik","intro":"Dürzîliğin adı, Fâtımî ve İsmâilî arka planı, Hâkim Biemrillah'ın ulûhiyeti, Hamza b. Ali, hudud ve yedi esas, toplum yapısı, risaleleri ve günümüzdeki durumu.","s":[{"h":"İsimlendirme Meselesi","b":[{"k":"li","x":"Batılı bazı araştırmacılar, Dürzîlerin Haçlı Seferleri sırasında Lübnan dağlarına yerleşmiş olan **Dreux Kontu** ve adamlarının soyundan geldiğini savunarak Dürzî sözcüğünün de Dreux'den türediğini iddia etmişlerdir."},{"k":"li","x":"Bazı âlimler, Dürzi fırkasını Batinilikte aşırı giden, Hâkim Biemrillah'ın uluhiyyetine inanan, İsmailiyye fırkasından ayrılan ve eski bir Mecusi olan dâilerden **Neştekin ed- Derezi** 'ye nispet edilen bir fırka olarak tarif ederler."},{"k":"li","x":"Dürzilere isminin verildiği iddia edilen diğer kişi ise; **Ebû Mansur Anuştekin ed- Dürzi** 'dir. O, Hâkim Biemrillah'ın komutanlarından birisidir. Dürziler günümüze kadar Neştekin'e lanet edip Anuştekin'i yüceltmişlerdir."},{"k":"li","x":"Dürzi toplumu kendilerinin “Dürzî” olarak adlandırılmasından hoşlanmazlar. Kendilerinin “Dürzi\" değil, el-Hakim'i birleyen \"muvahhidler\" ya da \"tevhid ehli” olduklarını iddia eder, inançlarnı da “mezhebü't-tevhid” diye isimlendirirler."},{"k":"li","x":"Dürzilerin isimlendirilmesi kadar etnik kökenleri de tartışmalıdır. Bazıları kökenlerini Hititlere ya da Galatlara kadar götürerek Perslerle ve Medlerle ilişkilendirmiştir. Dürzîleri Asurluların sürgün ettiği barbar bir kavme bağlayanlar da vardır. En çok kabul gören görüşe göre Dürziler, Yemen'deki Süryani kökenli Araplardır."}]},{"h":"Dürziliğin Teşekkül Süreci ve Tarihî Arka Planı","b":[{"k":"li","x":"**Muhammed b. İsmail ed-Derezî** tarafından h. 408 (1017) tarihinde VI. Fatimi halifesi Hakim Biemrillah'ın ilahlığının açıkça ilan edilmesiyle Dürzîler tarih sahnesine çıkmıştır. Dürzi inancının temelini oluşturan Hâkim Biemrillah'a uluhiyyet izafe etme fikrini ilk ortaya atan kişinin **el-Fergâni** olduğu söylenir."},{"k":"li","x":"**El-Fargâni'** nin bir suikast sonucu öldürülmesiyle onun başlattığı hareketin liderliği Neştekin ed-Derezî ve Hamza b. Ali'ye kalmıştır. Dürzilik, **Hamza b. Ali** tarafından kurumsallaştırılmıştır. O mezhep kurucusu olarak kabul edilmektedir."},{"k":"li","x":"Hamza'dan sonra davetin liderliğine getirilen **Muktena Bahaeddin**, 434/1042 yılında son risalesini yazarak gaybete girmiştir. O tarihten itibaren Dürzilik, ortaya koyulan prensiplere sıkı sıkıya bağlı kalan, dışandan gruba girmek isteyenlere izin vermeyen, çıkmak isteyenlere de müsamaha göstermeyen kapalı bir mezhep halini almıştır."},{"k":"h","x":"a. Tarihsel Arka Plan: Hâkim Biemrillah'a kadar Fatimiler"},{"k":"p","x":"Dürziliğin ortaya çıktığı Fatimilerin altıncı halifesi Hakim Biemrillah zamanında İslam dünyasında mezhep mücadeleleri yoğun olarak yaşanmakta, bazı felsefi akımlar Müslümanlar ara sında yaygınlaşmaya başlamakta, sosyo-politik yönden de oldukça karmaşık bir görünüm göze çarpmaktaydı."},{"k":"p","x":"Hilafetin kendi hakkı olduğunu iddia eden **Abbasiler**, **Endülüs Emevileri** ve **Fatimiler** olmak üzere üç büyük devlet İslam dünyasına hakim olmaya çalışmaktaydı. Dürzîliğin ortaya çıkış sürecini daha iyi anlayabilmek için İsmailîliği ve dolayısıyla Fatimi devletini bir nebze tanımak faydalı olacaktır. (Bkz. s.405-407)"},{"k":"h","x":"b. Felsefi-Dinî Arka Plan: İsmaililiğin Dürzîliğe Etkisi"},{"k":"p","x":"İsmailik bölümünde anlatıldığı üzere İsmaililiğin temel inanç esasları Dürziliğe etki etmekle beraber Yahudilik, Hristiyanlık, Zerdüştlük, Maniheizm, Mezdekizm, Budizm ve Hinduizm gibi inanışlar da Dürzîliğin şekillenmesinde etkili olmuştur."},{"k":"p","x":"Fetihlerle genişleyen İslam coğrafyası özellikle Şiî gruplar, Yeni Eflatunculuk, Hermescilik, Phsagorculuk gibi felsefi düşüncenin ve özellikle Müslümanlar arasında etkili olan felsefi akımlardan **İhvan-ı Safa'** nın etkisiyle düşüncelerini yeniden şekillendirmişlerdir."}]},{"h":"Dürziliğin Temel Prensipleri","b":[{"k":"p","x":"**1.** Hâkim Biemrillah'ın ilah olduğuna inanmak,"},{"k":"p","x":"**2.** Emr'i yani Hamza b. Ali'yi bilmek,"},{"k":"p","x":"**3.** Hudud veya vezirleri tanımak"},{"k":"p","x":"**4.** Yedi esası bilmek şeklinde ele almaktadırlar. Bunların yanında tekammus, ahiret hayati, takiyye ve sırların muhafazası gibi esasları da vardır."},{"k":"h","x":"1. Hâkim Biemrillah'ın Uluhiyetine İnanmak"},{"k":"h5","x":"a. Hâkim Biemrillah'ın Hayatı, Şahsiyeti ve Ölümü ile İlgili İddialar"},{"k":"li","x":"Hakim Biemrillah, 375/985 yılında doğdu. Sekiz yaşında babası Aziz Billah tarafından veliaht tayin edildi. Babası'nın 386/996 yılında ölmesi üzerine on bir yaşında iken hocası ve devlet adamı Bercevan'ın vasiliğinde halife oldu. Bercevan'ın devlet işlerinde hâkimiyeti ele geçirdiğini gören Hakim, 390/1000 senesinde Bercevan'ı öldürterek gerçek iktidarına kavuştu."},{"k":"li","x":"Hâkim Biemrillah sert mizaçlı, merhametsiz, insanları öldürmekten âdeta zevk alan, kendisine nasihat edenlere zulümle karşılık veren, bazen aşırı cömert bazen cimri, ilmî sevip âlimlerden intikam alan, küçük-büyük her türlü suçu şiddetle cezalandıran bir kişi idi."},{"k":"li","x":"Hâkim'in hilafeti dört devreye ayırırlar: **Birinci devrede** idari işlerin hiçbirisinde söz sahibi değildir. **İkinci devrede** Müslüman olmayanlara baskı uygularken, Şiî olmayan Müslümanlara acımasız davrandığı dönemdir. Yahudi, Hristiyan ve Müslümanlar dışındakilerin özel bir işaret takmalarını emretti. Bazı kiliseleri tahrip eettirdi. Hz. Ali'nin yanında olmayan sahabeye küfrettirdi. Küfür ifadelerinin yazılarak sokaklara, dükkan ve cami duvarlarına asılmasını emretti. **Üçüncü devrede** taassup politikasını değiştirdi. Teravih namazını yasakladı medreseler inşa edip oralara hocalar atadıktan sonra onları öldürüp medreseleri yıktırdı. **Dördüncü devre** de aklının iyice karıştığı, zikzaklı bir yol izlediği, din ve mezhep farklılıklarına bakılmaksızın bütün halkına baskı ve şiddet uyguladığı bir dönemdir. Hz. Ebû Bekir ve Hz. Ömer'in kabirlerini açtırmak istedi, hatip minberde ismini zikrettiğinde halkın saf hâlinde ayağa kalkmalarını emretmiştir."},{"k":"li","x":"Ahlaki bozulmayı sebep göstererek kadınlara ayakkabı yapılmasını ve onların sokağa çıkmasını yasaklamış, köle ve cariyelerini azat etmiş, devlet arazilerini yoksul halka dağıtmıştır. Bir ara taze hurma ve üzüm satışını durdurmuş, üzüm bağlarını söktürmüş, musikiyle meşgul olmayı, satranç oynamayı, Nil üzerinde sandalla gezmeyi men etmiş, ilm-i nücûm ile uğraşılmasını yasaklayıp müneccimleri sürgüne göndermiş, Kahire'de bulunan dükkanların gündüz kapatılıp gece açılmasını ve aydınlatılmasını emretmiştir. Onun zamanında Dâru'l-Hikme kurulmuş, İsmaililiğin kurumsallaşmasına ve dâîlerin yetişmesine büyük önem verilmiş, bu medresenin yanına İslam ülkelerinde kaleme alınan birçok kaynak eseri ihtiva eden Dâru'l-İlm adlı bir de kütüphane yapılmıştır. **Dürziler** Hâkim'in bu tavırlarını onun Tanrı olduğunun delili olarak görürler."},{"k":"li","x":"Hâkim gösterişten uzak bir hayat yaşamıştır. Saçını ve tırnaklarını uzatması, yün elbise giymesi, binek olarak eşeği tercih etmesi, onun tevazusunun sonucudur. Köpekleri ve domuzları öldürtmesi, bazı hastalıklara sebebiyet verdikleri için içki yasağı getirmesi, kadınlara uygulanan bir kısım sınırlamalarla toplumun ahlaki yaşantısını düzeltmek istemesi; şehrin geceleri aydınlatılıp dükkanların açık tutularak üretimi artırmak ve ülkesinin ne kadar güvenli bir yer olduğunu göstermek istemesi yaptıklarına sebep olarak gösterilmiştir."},{"k":"li","x":"Son yıllarda kendine zahidâne bir hayat seçmişti. Kahire ve Fustat sokaklarında korumasız bir şekilde dolaşır, gece yarısından sonra ise Mukaddam dağına çıkardı. 27 Şevval 411/13 Şubat 1021 tarihinde gezilerinden birine çıkmış, esrarengiz bir şekilde kaybolmuş, geri dönmemiştir. Birkaç gün sonra eşeği ve hançerlenmiş gömleğinden başka bir şey bulunamamıştır."},{"k":"h5","x":"b. Dürzî İnancında Tanrı Anlayışı ve Hâkim Biemrillah'ın Uluhiyyeti"},{"k":"li","x":"Dürzîlerin inanç esaslarından en önemlisi Hâkim Biemrillah'ın uluhiyyetine iman etmektir. Bu esasa göre Hâkim'in, bir birinden ayrılmayan lahutîlik ve nasutîlik olmak üzere iki yönü vardır. O hiçbir isim ve sıfatla tanımlanamaz, hiçbir dil onu ifade edecek bir tabire sahip değildir ve her türlü tariften de münezzehtir. O, hiçbir şeye benzemez ve onun dengi de yoktur. Bu yüceliklere sahip olan Tanrı'nın insanlarla konuşması mümkün olmadığından muhtelif zuhur ve tecellilerle insanlara yaklaşmıştır."},{"k":"li","x":"Dürziler O'na ibadet ederler ve O'nu yüceltirler. Gaybetinden sonra O'nun zuhurunu beklerler. Bu inanç, Dürzi akidesinin üzerine bina edildiği temel esastır. Dürzîler, Tanrı'nın bir cisme girdiğini, yani hulul ettiğini kabul etmezler. Onlar bu durumu izah ederken Tanrı'nın bir hicap ve nasuti suret edindiğini ileri sürerler ve insanlara karşı yazıdaki mana gibi perdelendiğini ifade ederler."},{"k":"li","x":"Akıllı ruhlar, insan vücutlarında bulunan kalbe girerler. Varlıkların yaratılmasıyla ceset ve ruh, iyi ve kötüyü ayırma kabiliyetine ve ilahi kaynaklı bilgiye ulaşırlar. İnsan yaratılışın gayesidir. İnsanların ruhları bir defada ve sınırlı olarak yaratılmıştır. Bu sebeple insan ölünce ruhu derhal başka bir cesette yeniden doğar ve cesedi bir zarf veya elbise gibi kullanır (**tekamus**: gömlek değiştirme)"},{"k":"h","x":"2. Emri Tanımak yani Hamza b. Ali'yi Bilmek"},{"k":"li","x":"Hamza b. Ali 375/985 senesi Hakim Biemrillah'la aynı gün ve aynı tarihte doğdu. Daru'l- Hikme'deki derslere devam etti. İsmaili dâîler arasında Fatimi lakabıyla şöhret buldu. Dürzîliğin sistematiğini oluşturan kişi olan Hamza, Hakim Biemrillah’ın ilahlığı noktasında propaganda yaparken kendisini de imam olarak atamıştır."},{"k":"li","x":"Hasan b. Haydara el-Fergani (408/1018) ve Neştekin ed-Derezî (410/1020) öldürülünce Hamza, hareketin yegâne lideri olmuştur. Bu tarihten itibaren Hamza b. Ali, Kahire surları dışındaki Reyhan Camii'ni kendisine merkez edinerek yeni inancı temellendirmeğe ve yaymaya başladı. Merkez olarak burayı seçmesin de, gözlerden uzak olup daha rahat hareket etme düşüncesinin etkili olduğu söylenebilir."},{"k":"li","x":"Hamza, tüm ipleri eline geçirince ilk önce örgütünü oluşturarak yüz altmış dört kişiden oluşan davetçi grubunu meydana getirdi ki bunlara **Hudûdu's-Sidk** adı verilmektedir. Her dâînin belli bir rütbesi vardı ve kendisi de yaratılanların en üstünü olan **Külli Akıl** makamını almıştı."},{"k":"li","x":"Dürzi İlmihalinde Hamza kendisine kozmik sıfatlar vererek, Tanrı'dan sonra en yüce mertebeye kendisini yerleştirmektedir."},{"k":"li","x":"Hamza b. Ali mahlukatın en şereflisi olup, insana hulul etmiş bir cevherdir. İlk yaratılan varlık odur. Kâinat ondan zuhur etmiştir. Akl-i Külli'dir; yer, içer, görür ve el ile tutulur. Babası ve anası vardır. Karısı ve çocuklar yoktur. Günümüzde de Dürziler aynı inancı devam ettirmekte olup Hamza'ya büyük saygı duymaktadırlar."},{"k":"h","x":"3. Hududu Bilmek"},{"k":"li","x":"Hudud, Dürzilere göre Hâkim veya Hamza tarafından görevlendirilen, İslam'daki peygamberler derecesinde bulunan, dini bakımdan salahiyetli ve muayyen görevleri yüklenen kimselerdir. Dinin esaslarından olduğu için hudud'u bilmemek, tevhid davetini bilmemektir. Hududu bilip iman etmek, en önemli farzlardandır. Bunlar, evlenmez ve masumdurlar. Dürzî risalelerine göre bu hududların sayısı beştir:"},{"k":"p","x":"**a) Külli Akıl:** Hamza b. Ali b. Ahmed'dir. (Yeşil)"},{"k":"p","x":"**b) Külli Nefs**: Ebû İbrahim İsmail b. Muhammed b. Hamid et-Temimi'dir. (kırmızı) **c) Kelime**: Ebû Abdullah Muhammed b. Vehb el-Kureşi'dir. (sarı)"},{"k":"p","x":"**d) Sâbık**: Ebu'l-Hayr Selem b. Abdulvahhab es-Sâmiri'dir. (mavi)"},{"k":"p","x":"**e) Talî**: Ebû'l-Hasan b. Ahmed et-Tâî es-Semûkî'dir. (beyaz)"},{"k":"not","x":"Dürzîlerin bu renklerden oluşan bayrakları Beyrut'ta ve ABD'deki Dürzî merkezlerinde bugün dahi asılmaktadır"},{"k":"h","x":"4. Yedi Esası Bilmek"},{"k":"p","x":"**a- Doğru Sözlülük**: Namaz'a karşılık olarak konulmuştur."},{"k":"p","x":"**b- Din Kardeşlerini korumak**: Zekât'ın yerine konulmuştur."},{"k":"p","x":"**c- Var Olmayana ve Bühtana İbadetten Vazgeçmek**: Oruç'a karşılık konulmuştur."},{"k":"p","x":"**d- İblisler ve Azgınlardan Uzaklaşmak:** Hac'ca karşı konulmştur. Maksat geçmiş peygamberlerdir. Bütün peygamberlere muhaliftirler. Ancak günümüz Dürzîleri Hz. Muhammed hakkında daha mülayim bir yol takip ederek onun Tanrı elçisi olduğunu kabul ederler."},{"k":"p","x":"**e- Hâkim Biemrillah’ı Her Zaman ve Her Devirde Tek İlah Olarak Tanımak**: Şehadeteyn'e karşılık konulan bu kural gizlilik esasına riayet maksadıyla başka din mensuplarının yanında lisanen terk edilip kalben uygulanabilir."},{"k":"p","x":"**f- Hâkim Biemrillah’ın Hüküm ve Fiillerine Rıza göstermek**: Cihad'a karşılık konulmuştur."},{"k":"p","x":"**g- Kolaylık ve Zorlukta Hâkim'in Emirlerine Boyun Eğmek**: Şia'daki Velayet'in yerine konulmuştur."}]},{"h":"Diğer Bazı Görüşleri","b":[{"k":"p","x":"**a) Tekammus**: Ruhun bir cisimden başka bir cisme intikaline inanan Dürzîler buna tenasüh değil, tekammus adını verirler. Bu nazariyede ruh ölmez, ölen sadece cisimdir. İnsanların ruhları bir defada ve sınırlı olarak yaratılmıştır. Bu sebeple sayıları artmaz ve eksilmez. İnsan ölünce ruhu derhal başka bir cesette yeniden doğar ve cesedi bir zarf veya elbise gibi kullanır. İnsan ruhu sadece insan bedeninde ortaya çıkar."},{"k":"p","x":"**b) Kıyamet Günü:** Dürzilerde ahiret günü kıyamet günü anlamına gelmektedir. Hesap günü ruhların gelişiminin son mertebesidir. Bu vakitte yeryüzü adalet ve eşitlikle dolacaktır."},{"k":"p","x":"**c) Takiyye ve Sırların Muhafazası (İlahi Bilgiyi Gizli Tutma):** Günümüze kadar Dürzîler tarafından uygulanan 'gerçeği gizlemenin ahlaksal prensibi'dir. Dinin emirlerini başkalarına anlatmayı dinden çıkmak olarak değerlendirirler. Mezhebin en önemli esaslarından biri takiyye olduğundan mezhep mensuplarının vereceği bilgiler her zaman kuşku ile karşılanmıştır."}]},{"h":"Dürzi Toplumu ve Hiyerarşi","b":[{"k":"p","x":"Muktenâ Bahauddin'in 434/1042 yılında son risalesini yayınlayıp gaybete girmesinden sonra Dürziliğe giriş ve çıkış kapanmıştır. Dürzi toplumunun ayakta kalması amacıyla alınan bu tedbir, bazı nüfuzlu aileler hariç genel olarak uygulanmıştır. Bu itibarla, Dürziliğin misyoner teşkilatına ihtiyacı olmamıştır. Onlar, gizli ve kapalı bir toplum olarak varlıklarını devam ettirmişlerdir. Fertler arasındaki en önemli bağ din bağıdır."},{"k":"p","x":"Dürzîler dini hükümlere vakıf olup olmama hususunda \" **Ukkal** \" ve \" **Cuhhal** \" olmak üzere iki ana kısma ayrılmışlardır. Erkeklerden olduğu gibi kadınlardan da Ukkal sınıfına girenler bulunmakta ve bunlara Akilât adı verilmektedir."},{"k":"p","x":"**Ukkal**, mezhebin prensiplerine sıkı sıkıya bağlı olan kişilerdir. İçki içmemeleri, dürüst olmaları, yeme ve içmede israf etmemeleri gerekir. Bunların lüks içinde yaşamaları caiz değildir. **Cuhhal** ise dinin gerçeklerine ve sırlarına vakıf olmayan kimselerdir. Yedi esası bilmelidir, Cemaatin kahir ekseriyetini oluşturan Cuhhal sınıfının Dürzî Risâlelerini okumaları yasaktır. Sadece Kurban bayramı törenlerinde, Dürzî risalelerinden bir kısmını dinlemesine müsaade edilir.Şerhlerin bir kısmını ve basılı eserleri okuyabilirler."},{"k":"p","x":"Dürzi toplumunda “ **Muvahhidler** \" kardeş ve bacı kabul edildiğinden birbirlerine yardım etmeleri zorunludur. Birbirlerine karşı yalan konuşmaları şirktir. Evliliklerde kadın erkek eşit kabul edilmekte, malın kadınla paylaşılması emredilmektedir. Evlenme yaşı kadınlarda 17, erkeklerde 18'dir ve sadece cemaat içinden olabilmektedir. Boşanma bir defa olup geri dönüşü yoktur. **Miras taksimi Sünni-Hanefi hukuk sistemi** nin tatbikatına uygun yapılmakla beraber yazılı vasiyet yaygındır."},{"k":"p","x":"Diğer hukuki mükellefiyetler ve müeyyideler İslamî kurallara uygun olarak yapılır. Ramazan Bayramı gününe denk gelen küçük bayram ve Kurban Bayramı günü kutladıkları büyük bayram diye senede iki bayramlan vardır. Dini bayramlardan önce din adamlan on gün oruç tutarlar."}]},{"h":"Dürzi Risaleleri ve Dürziliğe Dair Kaynaklar","b":[{"k":"li","x":"Klasik kaynakların en önemlisi hiç şüphesiz **Dürzi Risaleleridir** (Kitâbü'l-Hikme, Resâilü'l-Hikme veya el-Hikmetü'ş-Şerîfe) Hamza b. Ali, İsmail et-Temimi ve Muktenâ Bahauddin tarafından oluşturulmuştur. Dürzîliğin esaslarını ihtiva eden kutsal risaleler **İbrahim Paşa** ’nın Suriye seferi sonucunda ele geçirilmiştir. Bu tarihten sonra mezhebin Dürzi olmayan ilim adamlarınca tanınması, araştırılması ve bu konuda eserler ortaya konmasını mümkün olmuştur."},{"k":"li","x":"Dürzilik tarihi hakkında en eski eser, **Salih b. Yahya** 'nın (ö. 839/1435) Târihu Beyrut'u ve **Hamza b. Sebât** ’ın (ö. 926/1520) Târihu İbn Sebat adlı eseridir."},{"k":"li","x":"Dürzîliği bir bütün olarak ele alan eserler de bulunmaktadır. Bunlar arasında **Abdurrahman Bedevi'** nin Mezâhibü'l-İslamiyyin (Beyrut 1973) ve **M. Ahmed el- Hatîb'in**, Akidetü'd-Dürûz (Amman 1980) sayılabilir."},{"k":"li","x":"Türkçedeki çalışmalar arasında ise **İzmirli İsmail Hakkı'** nın “Dürzi Mezhebi\" adlı makalesi ile **Ahmet Bağlıoğlu** 'nun İnanç Esaslan Açısından Dürzîlik (Ankara 2004) doktora çalışması zikredilebilir."}]},{"h":"Günümüzde Dürzîler","b":[{"k":"p","x":"Tarihte ve günümüzde Dürzî toplumuna dört büyük aile hâkim olmuştur. Bunlar Tenühiler, Şihâbîler, Ma'niler ve Canbulat aileleridir. Canbulat ailesi günümüzde Dürzîler arasındaki en itibarlı ailedir. Günümüzde Dürzîler'in kesin sayısı bilinmemekle birlikte Lübnan, Suriye, Filistin ve Ürdün'de yaklaşık 400-450.000 civarında Dürzi nüfusunun bulunduğu sanılmaktadır. 40.000 civarında Dürzi bugün Venezuella, Brezilya, Arjantin ve Meksika'da yaşamaktadır. 1948 işgalinden sonra topraklarına bağlılıklarından dolayı yerlerini terketmemişlerdir. Terörist İsrailin İşgali esnasında mukavemet göstermedikleri için burada bulunan Dürzîler diğer Araplar'dan daha iyi muamele görmektedirler."}]},{"h":"Dürzilik: Batıni Karakterli, Aşırı Şii Kökenli Bir Mezhep","b":[{"k":"p","x":"Dürzîlik, kökenleri aşırı Şiî telakkilere dayanan ve Yeni Eflâtuncu görüşlerden etkilenerek karma bir inanç sistemine sahip olmuş, kendine özgü prensipleri, ahlak kuralları ve ibadet şekilleri bulunan bir dindir. Kendilerini **\"Dürzî\"** olarak adlandırmaktan hoşlanmazlar; bunun yerine **Hâkim Biemrillah'ı** birleyen **\"muvahhidler\"** veya **\"tevhid ehli\"** olarak anılmayı tercih ederler ve inanç sistemlerine **\"mezhebü't-tevhid\"** derler. Dürzî teriminin, **Hamza b.** Ali'ye isyan eden ve inançlarından çıkan ed-Derezi'ye nispetle yanlış bir adlandırma olduğunu düşünürler."}]},{"h":"1. Temel İnanç Esasları ve Yaratılış","b":[{"k":"li","x":"**Allah İnancı ve Yaratılış (Sudûr):** Dürzîlik'te yaratılış, tıpkı Allah inancında olduğu gibi Yeni Eflâtuncu görüşlere dayanır. Bütün varlığın kaynağı Allah'tır; ancak O, fizikî âlemle doğrudan teması düşünülemeyecek kadar yücedir. Bu sebeple, kendisinden **(sudûr yoluyla) çıkan Küllî Akıl,** yaratıcı ile yaratılmışlar arasında bir aracıdır. Çokluk ve karmaşıklık Allah'tan değil, bu Küllî Akıl'dan gelir. Tek bir varlıktan çıkan Küllî Akıl, Nefse, oradan da maddeye uzanır. Küllî Akıl'ın nurundan, İblîs ortaya çıkmıştır; çünkü Küllî Akıl kendi nurundan hayrete düşüp gururlanmıştır. Küllî Akıl'ın hatasının ürünü olan İblîs'in ortaya çıkması üzerine, Küllî Akıl'ın af dilemesiyle **Küllî Nefis** yaratılmıştır. Küllî Akıl'ın nuru Küllî Nefis'e hâkim olurken, İblîs'in zulmetinden bir kısım da Nefis'e intikal etmiştir."},{"k":"li","x":"**Varlığın Devamı:** Bütün hayat Küllî Nefis'ten ortaya çıkmıştır. Küllî Nefis'in nurundan iyiyi ve kötüyü seçmekte serbest olan **Kelime,** ondan **Sâbık (el-cenâhu'l- eymen),** ondan da **Tâli (el-cenâhu'l-eyser)** zuhur etmiştir. Semalar, arz (yeryüzü), soğukluk-sıcaklık, kuruluk-yaşlık, dört unsur (hava, su, ateş, toprak) ve beşinci unsur olan madde Tâli'den zuhur etmiştir."},{"k":"li","x":"**İnsan ve Tekammus (Gömlek Değiştirme):** İnsan, Allah'a kulluk etmek ve O'nun birliğini tanımak için var edildiğinden yaratılışın gayesidir. İnsanların ruhları bir defada ve sınırlı olarak yaratılmıştır; bu sebeple sayıları artmaz veya eksilmez. Dürzîler, ruhun hayvan veya bitkilere geçtiği inancını içeren **tenasüh** yerine, ruhun ölümden sonra derhal başka bir insan bedeninde yeniden doğmasına **\"tekammus\"** adını verirler. Bu, ruhun değişimi olmayıp yükselmek için çeşitli hallere geçişidir. Kör, topal, fakir veya cahil doğmanın önceki hayatta işlenen günahlar nedeniyle olduğuna inanılır. Dürzîler, tekammusun Kur'an-ı Kerim'de de yer aldığını iddia ederek bazı ayetleri delil gösterirler. Tekammus inancı Nusayrilik'te de temel bir unsurdur."},{"k":"li","x":"**Kıyamet Günü:** Dürzilerde ahiret günü kıyamet günü anlamına gelmektedir. Çünkü tekammus inancı gereğince ruhun ölmesi veya diriltilmesi diye bir şey söz konusu değildir. Hesap günü ruhların gelişiminin son mertebesidir. İlahi irade tarafından, kötülüğün tamamen bastırılacağı bir vakit gelmelidir. Bu vakitte yeryüzü adalet ve eşitlikle dolacaktır. Kıyamet veya hesap gününden sonra yeryüzü cennet halini almış olacaktır. Hakim'in yönetimindeki erdem devleti yeryüzüne hükmederek ilahi bilgi Muvahhidlerin ödülü, aykırı yaşayanların da cezası olacaktır."},{"k":"li","x":"**Hâkim Biemrillah'ın Uluhiyeti:** Dürzî inancının en önemli esası **Fâtımî Halifesi Hakim Biemrillah'ın ilahlığına imandır.** Hakim'in, birbirinden ayrılmayan **lahutilik** (duyularla anlaşılamayan ilahi yön) ve **nasutilik** (görünen insan sureti) olmak üzere iki yönü olduğuna inanılır. Onun en son ve en mükemmel tecelli ve zuhuru olduğu kabul edilir. Dürzîler, Hakim'in kayboluşunu (gaybet), inananlara bir imtihan olarak Tanrısal varlığın kendi isteğiyle gizlenmesi olarak yorumlarlar."},{"k":"li","x":"**Emr'i Tanımak (Hamza b. Ali):** Dürzî inancının ikinci akidesi, \"emr\"i, yani **Hamza b. Ali'yi tanımak/bilmektir.** Hamza, Dürzîliğin sistematiğini oluşturan kişidir ve Hâkim Biemrillah'ın ilahlığı konusunda propaganda yaparken kendisini de imam olarak atamıştır. O, Küllî Akıl olarak da kabul edilir ve Âdem, Nuh, İbrahim, Musa, İsa ve Muhammed dönemlerinde farklı isimlerle (örn. Selmân-ı Fârisî) dünyaya geldiğine inanılır."},{"k":"li","x":"**Hududu Bilmek: \"Hudud\",** Hâkim veya Hamza tarafından görevlendirilen, dinde peygamberler derecesinde bulunan yetkili kimselerdir. Beş hudud bulunmaktadır: Külli Akıl (Hamza b. Ali b. Ahmed), Külli Nefis, Kelime, Sabık ve Tâli."},{"k":"li","x":"**Yedi Esas (Ahlaki Görevler):** Dürzî ahlak sisteminde yedi temel esas vardır:"},{"k":"n","n":1,"x":"**Doğru sözlülük** (Namaza karşılık)"},{"k":"n","n":2,"x":"**Din kardeşlerini korumak ve karşılıklı yardımlaşma** (zekât yerine konulmuştur)."},{"k":"n","n":3,"x":"**Var olmayana ve bühtana ibadetten vazgeçmek** (Oruca karşılık gelir, Hakim'den önceki ibadetlerin geçersiz sayılması)."},{"k":"n","n":4,"x":"**İblislerden ve azgınlardan uzaklaşmak** (Hacca karşılık gelir)."},{"k":"n","n":5,"x":"**Hâkim Biemrillah'ı Her Zaman ve Her Devirde Tek İlah Olarak Tanımak:** (Şehadeteyn'e karşılık konulan Allah'ın bütün fiillerinde O'nun rızasına ve iradesine teslimiyet ve rızıkla ilgili konularda kanaat)"},{"k":"n","n":6,"x":"**Hâkim Biemrillah'ın Hüküm ve Fiillerine Rıza göstermek:** (Cihad'a karşılık)"},{"k":"n","n":7,"x":"**Kolaylık ve Zorlukta Hakim'in Emirlerine Boyun Eğmek:** Şia'daki Velayet'in yerine konulan bu kural, Hamza b. Ali'ye göre bütün öğretilerin gayesini teşkil etmektedir"}]},{"h":"2. İbadetler ve Sosyal Hayat","b":[{"k":"li","x":"**İbadet Eksikliği:** Dürzî inanç sisteminde, namaz, oruç gibi geleneksel İslami ibadetler ilke olarak bulunmaz."},{"k":"li","x":"**Toplumsal Bölünme:** Dürzî cemaati, dini konuları bilen **\"ukkāl\" (aydın zümre)** ve bilmeyen **\"cühhâl\" (cahiller sınıfı)** olmak üzere ikiye ayrılır. Ukkâl, mezhebin prensiplerine sıkı sıkıya bağlıdır, sigara, içki gibi şeylerden kaçınır, lüksten uzak durur. Kadınlardan da ukkâl grubuna girenler \"âkılât\" olarak anılır ve aynı yükümlülükleri taşırlar. Ukkâl grubuna katılmak için en az kırk yaşında olmak, Dürzî inançlarına vakıf olmak ve şeyhü'l-akldan talepte bulunmak gerekir. Cuhhal, dini sırları bilmeyen ve risaleleri okuması yasak olan kesimdir."},{"k":"li","x":"**Gizlilik (Takiyye):** Dürzîler, inançlarını kendilerinden olmayanlardan gizler ve tehlikelerden korunmak amacıyla takıyye uygularlar. Dinin emirlerini başkalarına anlatmayı dinden çıkmak olarak değerlendirirler. Bu gizlilik, mezhebin önemli bir özelliğidir. Nusayrilikte de takiyye önemli bir yer tutar."},{"k":"li","x":"**Kutsal Metinler:** Dürzîlerin ahlaki ve medeni sistemlerinin dayandığı kutsal metinler, **Resâʾilü’l-hikme veya el-Hikmetü’ş-şerîfe** adıyla bilinen 111 risaleden oluşur. Bu risaleler didaktik ve polemik mahiyetinde yazılmıştır ve çelişkili veya müphem pasajlar, şifreli ibareler içerir."},{"k":"li","x":"**Evlilik ve Boşanma:** Dürzîler, kadın ve erkeğin eşit olduğunu savunur ve hukuk açısından aralarında bir fark bulunmadığını ortaya koymaya çalışır. Evlenme yaşı kadınlarda on yedi, erkeklerde on sekizdir. Birden fazla kadınla evlenmek yasaktır. Dürzî toplumu dışından biriyle evlenmek kesinlikle yasaktır. Boşanma hoş karşılanmasa da mümkündür ve tek seferde icra edilir; boşanan kadın aynı erkekle tekrar evlenemez. Kadınların da boşama hakkı vardır."},{"k":"li","x":"**Miras:** Miras taksimi genellikle Sünni Hanefi hukuk sistemine uygun olsa da yazılı vasiyet uygulaması yaygındır."}]},{"h":"3. İlişkisi ve Coğrafya","b":[{"k":"li","x":"**İslam ile İlişkisi:** Kaynaklar, Dürzîliğin İslam'ın titizlikle korumak istediği tevhid prensibiyle hiçbir şekilde bağdaşmadığını vurgular. Namaz, oruç gibi temel ibadetlerin ilke olarak Dürzîlik'te bulunmayışı da bu sistemin Müslümanlıkla şekil açısından olabilecek ilgisini ortadan kaldırmaktadır. Dürzîlerin zaman zaman ayet ve hadisleri ilmî bir metoda bağlı kalmaksızın çeşitli yorumlara tâbi tutmaları, onların İslam'a bağlılığından dolayı değil, sadece kendi görüşlerini destekleme gayesine yöneliktir. Genel olarak Dürzilik, yakın kökleri Batınî İsmailîyye'ye dayanan, çeşitli din ve düşünce akımları ile aşırı Şiî telakkilerinden etkilenmiş **karma bir sistem** olarak görülmektedir."},{"k":"li","x":"**Köken Tartışmaları:** Dürzilerin kökenleri tartışmalıdır. En çok kabul gören görüşe göre, Yemen'den gelen Süryani kökenli Araplardır ve İslam'ı benimseyerek Lübnan'ın dağlık bölgelerinde yaşamaya devam etmişlerdir."},{"k":"li","x":"**Günümüzdeki Durum:** Günümüzde Dürzîler çoğunlukla **Lübnan, Suriye, İsrail, Ürdün** ve belirli ölçüde **Amerika Birleşik Devletleri ve Kanada** gibi ülkelerde yaşamaktadırlar. Ortadoğu'daki Dürzîler azınlık olmalarına rağmen sosyal, ekonomik, politik ve kültürel hayatta etkindirler."}]},{"h":"Kavramlar ve Hızlı Tekrar","b":[{"k":"d","t":"Muvahhidûn","x":"Dürzîlerin kendileri için kullandığı ad; Hâkim'i birleyenler."},{"k":"d","t":"Hudûd","x":"Hâkim veya Hamza tarafından görevlendirilen, peygamber derecesinde sayılan beş yüce şahsiyet."},{"k":"d","t":"Resâilü'l-hikme","x":"Dürzîlerin 111 risaleden oluşan kutsal metinleri."},{"k":"d","t":"Âkılât","x":"Dürzîlerde ukkāl zümresine giren kadınlar."}]}],"ht":[{"s":11,"x":"Dürzîlik, Fâtımî halifesi Hâkim Biemrillah'ın ulûhiyetini kabul eden ve Hamza b. Ali tarafından kurumsallaştırılan bir inanç sistemidir."},{"s":11,"x":"Dürzîler 'Dürzî' adını sevmez; ad, Hamza'ya isyan eden Neştekîn ed-Derezî'ye nispettir."},{"s":11,"x":"Temel prensipler: Hâkim'in ulûhiyeti, Hamza'yı (emr) tanımak, beş hudûdu bilmek, yedi esas; İslam'ın beş şartı yoktur."},{"s":11,"x":"Dürzîler Lübnan, Suriye, İsrail ve Ürdün'de yaşar; topluluk dışından evlilik ve çok evlilik yasaktır."}],"oz":{"t":"Dürzîlik · Özet","intro":"Ünitenin özü: Dürzîlik Fâtımî-İsmâilî ortamdan nasıl çıktı, Hâkim Biemrillah'ı nasıl görür, temel prensipleri ve toplum yapısı nedir?","s":[{"h":"Ad ve Arka Plan","b":[{"k":"li","x":"Kendilerine **muvahhidûn** (Hâkim'i birleyenler) veya **ehl-i tevhid**, inançlarına **mezhebü't-tevhid** derler. \"Dürzî\" adı, Hamza b. Ali'ye isyan eden dâî **Neştekîn ed-Derezî**'ye nispetle verildiği için bu adı sevmezler."},{"k":"li","x":"**Tarihsel arka plan:** Fâtımî halifesi **Hâkim Biemrillah** tuhaf ve tutarsız uygulamalarıyla tanındı; çevresindeki bazı dâîler onun ilahlığını ilan etti. Hâkim'in 27 Şevval 411/13 Şubat 1021'de esrarengiz biçimde ortadan kaybolması \"gaybet\" olarak yorumlandı."},{"k":"li","x":"**Felsefi-dinî arka plan:** İsmâilî bâtınîliği ve Yeni Eflatuncu sudûr anlayışı."},{"k":"li","x":"**Kurucular:** Davetin asıl teorisyeni ve mezhebi kurumsallaştıran **Hamza b. Ali**'dir; Derezî ondan ayrıldı ve öldürüldü."}]},{"h":"Temel Prensipler","b":[{"k":"n","n":1,"x":"**Hâkim Biemrillah'ın ulûhiyetine inanmak:** Tanrı insan suretinde (nâsût) Hâkim'de tecelli etmiştir; Hâkim ölmemiş, gaybete çekilmiştir ve dönecektir."},{"k":"n","n":2,"x":"**\"Emr\"i tanımak (Hamza b. Ali'yi bilmek):** Hamza, Küllî Akıl'ın mazharı ve zamanın imamıdır."},{"k":"n","n":3,"x":"**Hudûdu bilmek:** Hâkim ve Hamza tarafından görevlendirilen, evlenmeyen ve masum sayılan beş hudûd: Küllî Akıl (Hamza b. Ali; yeşil), Küllî Nefs (kırmızı), Kelime (sarı), Sâbık (mavi), Tâlî (beyaz). Bu beş renk Dürzî bayrağını oluşturur."},{"k":"n","n":4,"x":"**Yedi esas (ahlâkî görevler):** doğru sözlülük (namaza karşılık), din kardeşlerini korumak (zekâta), eski inançları terk etmek (oruca), iblis ve azgınlardan uzak durmak (hacca), Hâkim'i her devirde tek ilah olarak tanımak (şehadete), onun fiillerine rıza (cihada), emirlerine teslim olmak (velâyete)."},{"k":"li","x":"**Tekammus (gömlek değiştirme):** Ruh ölümden sonra başka bir insan bedenine geçer."},{"k":"li","x":"İslam'ın beş şartı ve şeriat ilke olarak kaldırılmıştır."}]},{"h":"Toplum ve Kaynaklar","b":[{"k":"li","x":"**Ukkāl** (sırlara vâkıf aydınlar) ve **cühhâl** (bilmeyenler) ayrımı; takiyye ve gizlilik esastır."},{"k":"li","x":"Ukkāl grubuna girmek için en az kırk yaşında olmak gerekir; kadın ukkāle **âkılât** denir."},{"k":"li","x":"Kadın ve erkek eşit kabul edilir; çok evlilik ve topluluk dışından evlilik yasaktır; boşanan kadın aynı erkekle tekrar evlenemez."},{"k":"li","x":"Kutsal metinleri, 111 risaleden oluşan **Resâilü'l-hikme** (el-Hikmetü'ş-şerîfe)'dir."}]},{"h":"Günümüz","b":[{"k":"p","x":"Dürzîler başta **Lübnan, Suriye, İsrail ve Ürdün** olmak üzere yaşar; ayrıca Amerika ve Avrupa'da topluluklar vardır. Kaynaklar Dürzîliğin İslam'ın tevhid ilkesiyle bağdaşmadığını ve ayrı bir din olarak değerlendirildiğini belirtir."}]}]}},{"t":"Yezîdîlik","intro":"Yezîdîliğin adı ve kökeni, Adî b. Müsâfir ve Adeviyye'den Yezîdîliğe geçiş, Osmanlı ve Cumhuriyet dönemleri, inanç esasları ve Melek Tâvûs, kutsal metinler, ibadetler, toplumsal hiyerarşi, bayramlar, yasaklar ve günümüzdeki durumu.","s":[{"h":"İsimlendirme","b":[{"k":"p","x":"Topluluğun adının kökeni hakkında farklı görüşler vardır:"},{"k":"li","x":"**Yezd şehri:** Mensuplarının çoğunun İran'ın Yezd şehrinden geldiği, adın buradan türediği ileri sürülmüştür."},{"k":"li","x":"**\"Tanrı\" anlamındaki kelimeler:** Yeni Farsça *ized* (melek, tanrı), Avesta dilindeki *yezata* (ibadete layık) ve Farsça *yezdân* (tanrı) kelimelerine bağlanır. Buna göre Ezidî, İzidî ve İzdî biçimleri \"tanrıya kulluk edenler\"
