:"h","x":"Hz. İsa ve cihad hakkındaki görüşleri"},{"k":"p","x":"Gulâm Ahmed'e göre Hz. İsa çarmıhta ölmemiş, mezara konulduktan sonra kendine gelip yaralarını tedavi etmiş ve **Keşmir**'e gitmiştir; orada 120 yaşında ölerek **Srinagar**'a gömülmüştür. Âhir zamanda gelmesi beklenen mesîh, Muhammed ümmetinden İsa'ya benzeyen bir kişidir ve bu kişi Gulâm Ahmed'in kendisidir."},{"k":"p","x":"Silahlı cihada karşı çıkmış, cihadı tebliğ yoluyla yapılan bir faaliyet olarak tanımlamış; İngiliz yönetimini övmüş ve kraliçeye bağlılığını eserlerinde açıkça dile getirmiştir."},{"k":"h","x":"Halifeler ve bölünme"},{"k":"p","x":"Gulâm Ahmed'in ölümünden sonra **Hakîm Nûreddin** birinci halife oldu (ö. 1914). Ardından **Mirza Beşîrüddin Mahmud Ahmed** ikinci halife seçildi (ö. 1965). Bu sırada **Muhammed Ali Lâhûrî** ve arkadaşları halife seçilmemesi ve işlerin bir encümen tarafından yürütülmesi gerektiğini savunarak Lahor'a yerleşti ve ayrı bir kol kurdu."},{"k":"tbl","r":[["Kol","Merkez","Gulâm Ahmed hakkındaki görüşü"],["Kādiyân kolu","Kādiyân, Pakistan'ın kuruluşundan sonra Rabve","Gerçek anlamda nebîdir; ona inanmayan kâfirdir. Halifelik sistemi sürer."],["Lahor kolu","Lahor","Hz. Muhammed son peygamberdir; Gulâm Ahmed müceddid ve vaat edilen mesîhtir. Muhammed Ali'nin 1917'de tamamladığı Kur'an tercümesi ve Batı'daki misyon faaliyetleriyle tanınır."]]},{"k":"p","x":"Nübüvvet, mehdîlik ve cihad dışındaki konularda Ehl-i sünnete yakın düşünürler; amelî konularda Hanefî fıkhına tabidirler."},{"k":"h","x":"İslam dünyasının tepkisi"},{"k":"p","x":"Muhammed İkbal, Mevdûdî ve Ebü'l-Hasan en-Nedvî gibi isimler hareketi reddeden eserler yazmıştır. Pakistan'da 1953'te büyük olaylar yaşanmış, **7 Eylül 1974**'te Pakistan parlamentosu Kādiyânîliğin her iki kolunu **\"İslam dışı azınlık\"** olarak kabul etmiştir. Anayasaya eklenen hükümle Hz. Muhammed'in son peygamber olduğuna mutlak olarak inanmayanlar Müslüman sayılmamıştır."},{"k":"h","x":"Günümüzdeki durumu"},{"k":"p","x":"Mensuplarının sayısı Pakistan dahil 2 milyon civarında verilir. Faaliyetlerini ağırlıklı olarak Avrupa, Asya, Amerika ve Afrika'daki misyonlar aracılığıyla yürütürler. Gelir kaynakları, aylık gelirin on altıda biri oranındaki zorunlu ödemeler, beytülmal payları ve bağışlardır; ayrıca üyelerin ölümünde malının onda birinin cemaate bırakılması istenir."}]}],"ht":[{"s":4,"x":"Mirza Gulâm Ahmed (1839-1908): 1885'te müceddid, 1891'de mesîh-mehdî, ardından zıllî-burûzî nebî ve Krişna-Avatar olduğunu iddia etti."},{"s":4,"x":"Hz. İsa'nın Keşmir'de ölüp Srinagar'a gömüldüğünü savunur; silahlı cihadı reddeder ve İngiliz yönetimini destekler."},{"s":4,"x":"Kādiyân (Rabve) kolu onu nebî kabul eder; Lahor kolu (Muhammed Ali Lâhûrî) müceddid ve mesîh sayar."},{"s":4,"x":"Pakistan parlamentosu 7 Eylül 1974'te her iki kolu \"İslam dışı azınlık\" ilan etti."}],"oz":{"t":"Kâdıyânîlik · Özet","intro":"Ünitenin özü: Kâdıyânîliği doğuran Hint ortamı, Mirza Gulâm Ahmed'in iddiaları, iki kolu ve İslam dünyasının tepkisi.","s":[{"h":"Doğuş Ortamı","b":[{"k":"li","x":"1857 Sipahi ayaklanmasından sonra İngiliz hâkimiyeti altında ezilen Hindistan Müslümanları; misyonerlik ve Arya Samaj gibi Hindu hareketlerinin saldırıları; mehdî ve mesîh beklentisi."}]},{"h":"Mirza Gulâm Ahmed (1839-1908)","b":[{"k":"steps","x":["**1885:** Hicrî XIV. yüzyılın müceddidi olduğunu ilan etti.","**1888:** Allah'ın emriyle biat alıp ayrı cemaat kurduğunu bildirdi.","**1891:** Hz. İsa'nın öldüğünü, kendisinin vaat edilen **mesîh** ve **mehdî** olduğunu iddia etti.","**1900 sonrası:** Zıllî ve burûzî **nebî** olduğu iddiası.","**1904:** Hindular için **Krişna-Avatar** olduğunu ilan etti.","**1908:** Lahor'da öldü."]},{"k":"li","x":"**Hz. İsa:** Çarmıhta ölmemiş, Keşmir'e gitmiş, Srinagar'da gömülüdür."},{"k":"li","x":"**Cihad:** Silahlı cihadı reddeder, İngiliz yönetimine bağlılığı savunur."}]},{"h":"Kollar","b":[{"k":"tbl","r":[["","Kādiyân kolu","Lahor kolu"],["Gulâm Ahmed","Gerçek nebî","Müceddid ve mesîh-i mev'ûd"],["İnanmayanlar","Kâfir","Kâfir sayılmaz"],["Önderlik","Halifelik (Hakîm Nûreddin, Beşîrüddin Mahmud...)","Muhammed Ali Lâhûrî, encümen"],["Merkez","Kādiyân, sonra Rabve","Lahor"]]}]},{"h":"Tepkiler ve Günümüz","b":[{"k":"li","x":"Muhammed İkbal, Mevdûdî ve Ebü'l-Hasan en-Nedvî reddiyeler yazdı."},{"k":"li","x":"**Pakistan parlamentosu 7 Eylül 1974'te** her iki kolu \"İslam dışı azınlık\" ilan etti."},{"k":"li","x":"Avrupa, Afrika, Amerika ve Asya'da misyonlarla faaliyet gösterir; sayılarının 2 milyon civarında olduğu belirtilir."}]}]}},{"t":"Selefî Akımlar","intro":"Selefiyye'nin ortaya çıkışı; Vehhâbîliğin doğuşu, Suud devletleri, İhvan teşkilatı ve düşünce sistemi; ilmî, siyasi ve cihadî Selefîlik; el-Kâide ve DEAŞ.","s":[{"h":"Ehl-i Sünnet-i Hâssa / Selefiyye","b":[{"k":"p","x":"Sözlükte \"önce gelmek, geçmek, geçmişte kalmak\" anlamındaki selef kelimesinden gelen Selefiyye; “geçmiş insanlar, soy, fazilet ve ilim bağlamında önce gelip geçenler\" demektir. Terim olarak Selefiyye ise, **\"İtikatta Resulullah ve sahabeye uyan tabiin, mezhep imamları, fukaha ve muhaddislerin yolu** \" şeklinde tanımlanmıştır. Selefiyye, \"Eseriyye, Ehlü'l-Hadis, Ashabu'l- Eser, Sahibüs-Sünne\" isimleriyle de anılmıştır. Muhalifleri onları nakilciler anlamında: **Eseriyye**, doğru yanlış ayırmadan buldukları nakle göre amel edenler manasında **Haşviyye** ve naslardaki teşbih ile alakalı hususlan te’vil etmeyip kabullendikleri için **Müşebbihe,** Allah'ın zatî, fiilî, haberi tüm sıfatlarını kabul ettiği için **Sıfatiyye** olarak adlandırmışlardır."}]},{"h":"Selefiyye'nin Ortaya Çıkışı ve Teşekkülü","b":[{"k":"li","x":"Raşit halifeler döneminde Müslümanlar, değişik din ve kültürlerle karşılaştı. Farklı din ve kültürle re mensup insanlar ya din olarak benimsemek veya kendi din ve kültürlerinde kalıp eleştirmek maksadıyla İslam'la ilgilendi. Cehmiyye ve Mu'tezile bu gruplarla fikren mücadelede bulunurken onların delil ve yöntemlerini kullandı. Bu dönemde ortaya çıkan ve kendilerini **ashabu'l-hadis** diye isimlendiren âlimler, ashap ve tabiilerin bu işlerle uğraşmadığını, bu tür delillerden hareket etmediklerini, münakaşaya girmediklerini iddia ederek bu tarz ve üslubu bid'at olarak değerlendirdiler ve böyle hareket edenlere reddiyeler yazdılar."},{"k":"li","x":"Hicri ilk asırlarda İslam dünyasında hâkim olan akide Selef akidesidir. Şam'da Evzai (ö. 157/774); Kufe'de es-Sevri (ö. 161/778); Basra'da Hammad b. Seleme (ö. 165/781); Medine'de Malik b. Enes (ö. 179/795); Mısır'da Leys b. Sa'd (ö. 175/791) ile İmam Şafii (ö. 204/819); Maveraünnehir'de Abdullah b. Mübarek (ö. 181/797) gibi meşhur âlimler bid'at ehline ve görüşlerine karşı ortak bir tutum geliştirmişlerdir."},{"k":"li","x":"Dört mezhep imamından Ahmed b. Hanbel'in Mu'tezile'ye karşı mücadelesi onu Ehl-i Hadis ve Selef ekolünün sembol ismi haline getirmiştir. Diğer bölgelerde İshak b. Rahaveyh (ö. 238/852), İbn Küllab el-Basri (ö. 240/854), Haris el-Muhasibî (ö. 243/857), gibi önemli âlimler de Mu'tezîle'ye karşı Ahmed b. Hanbel'i desteklemişlerdir. Hadis taraftarlığı ve Mu'tezîle karşıtlığı çerçevesinde oluşan bu geniş muhalefet cephesinde fıkhi alanda III/IX. asırdan itibaren Malikî, Şafiî, Hanbelî ve Zahirî mezhebi olarak dört gruba ayrılmışlarsa da itikat alanında Selefiyye, Ahmed b. Hanbel'in (ö. 241/855) öncülük ettiği itikadî mezhebin genel adı olmuştur."},{"k":"li","x":"Ahmed b. Hanbel Ehl-i Hadis literatürünün modelini oluşturacak şekilde Selef düşüncesinin temellerini ortaya koymuştur. Onun yaşadığı çağın alimlerinden olan **Buhârî**, Halku Efali'l-İbâd, **İbn Kuteybe** Te'vîlü Muhtelifi'l-Hadis ve **Ebû Said ed- Darimi** de er-Reddü ale'l-Cehmiyye gibi eserleriyle, bid'at ehli gruplara karşı reddiyeler yazmışlardır. III/IX. ve IV/X. yüzyıllarda Selefiyye ekolünü Hanbelî imamlardan Ebû Bekir el-Hallal, Hasan b. Ali el-Berbeharî, İbn Battah el-Ukberî gibi âlimler temsil etmişlerdir."},{"k":"li","x":"V-VI. XII-XI. asırlarda Selefiyye ekolünde kelam metodunu kısmen benimseyen ve bazı itikadî konularda te’vile müracaat eden ılımlı bir anlayış oluşmuştur. Bu oluşum Kadı Ebû Ya'la el- **Ferrâ** (ö. 458/1066) ile başlamış, öğrencisi **İbn Aki** l'le gelişmiş ve **İbnü'l-Cevzi** (ö. 597/1200) ile devam etmiştir. VI/XII. asırda özellikle Muvaffakuddin **İbn Kudame** (ö. 620/1223) ile temsil edilmiş, o, kelamcılara karşı adeta savaş ilan etmiştir. Nitekim aynı coğrafyada yetişen **İbn Teymiyye** (ö. 728/1328) ve öğrencisi **İbn Kayyim el- Cevziyye'** nin (ö. 751/1350) çalışmaları neticesinde Ehl-i Hadis ekolü sistematik Selefiliğe dönüşmüştür."},{"k":"li","x":"Son iki asırda Ehl-i Sünnet kelamcılarının oluşturduğu Eş'arî ve Maturidîlik kollarının İslam dünyasında yayılması ile itikadi konularda Selef zihniyeti giderek zayıflamış ve temsilcileri birkaç alimden ibaret kalmıştı. İşte böyle kritik bir dönemde yetişen İbn Teymiyye ve İbn Kayyim el-Cevziyye ile Selefiyye ekolünde önemli bir dönüşüm yaşanmış ve **Müteaahirîn Selefiyye Dönemi** başlamıştır. Bu iki âlimin en önemli özellikleri ele aldıkları meselelerde kelam, tasavvuf ve felsefeye alternatif bir sistem ortaya koymalarıdır. Onlar, Kur'an ve Sünnet çerçevesinde dinî Kur'ani akılcılığa yer veren bir zihniyet geliştirmişlerdir."},{"k":"li","x":"Bu iki âlimden sonraki müteahhirin dönemi Selefiyye'nin önde gelenleri Yemenli alim **İbnü'l-Vezîr** (ö. 840/1436) ve Hintli alim **Şah Veliyyullah ed-Dihlevî'** dir (ö. 1176/1762). Bu ekolün modern döneme intikal etmesinde büyük katkısı olan şahsiyetlerden birisi de yine Yemenli olan Muhammed b. Ali **eş-Şevkâni'** dir (ö. 1834)."},{"k":"li","x":"İslam dünyasının son asırlarda güç kaybetmesi ve batılı güçler tarafından sömürgeleştirilmesi üzerine ulema arasında çıkış yollan aramaya başlanmıştır. Bu çerçevede dini inanç ve prensiplerin geleneksel yorum ve ilavelerden temizlenmesi gerektiğini düşünen âlimler, batının ilmî ve teknik ilerlemesinin etkisinde kalarak eğitim, idare ve siyasette de modernleşmeyi teşvik etmişlerdir. Bu görüşlerin daha önce İbn Teymiyye'nin görüşleriyle örtüşmesi sebebiyle modern dönemde ıslahat yapılmasını isteyen **Sıddık Hasan Han**, Muhammed **Abduh**, **Reşid Riza**, Cemaleddin **Kasimî**, Mahmud Şükri **Alûsî** gibi alimler Selefilik'le ilişkilendirilmiştir."},{"k":"li","x":"I. Dünya Savaşı sonrasında İslam âleminde ekonomik ve sosyal şartların giderek ağırlaşması, Batı'ya bağımlılığın daha da artması, ayrıca din ve inanç özgürlüğü üzerinde baskıların görülmesiyle Selefîlik hareketi sertleşme eğilimine girmiş ve çeşitli siyasal örgütler hâlinde kendini göstermeye başlamıştır, Mısır'da **Hasan el-Bennâ** 'nın önderliğinde **İhvan-ı Müslimin**, daha sonra Pakistan'da **Ebü'l-A'lâ el-Mevdudî** ve onun öncülüğündeki **Cemaat-i İslami** ile başlayan bu süreç Selefiliği bir dinî ideoloji hâline getirmiş, böylece Batı ve Sovyet blokları arasındaki soğuk savaş şartlarının etkisiyle 1970'lerden itibaren politik yönü ağır basan aksiyonel gruplar ortaya çıkmıştır."},{"k":"li","x":"Geleneksel İslam yorumlarına olduğu kadar Batı'dan gelen her şeye karşı çıkan söz konusu hareket birçok yönüyle dışa kapalı bir tavır geliştirmiştir. Filistin sorunu ve Afganistan'ın işgali bu anlayışın Arap dünyası ve Hint alt kıtasında yayılmasını hızlandırmıştır. Artık Selefilik hareketini bile temsil edemeyecek kadar radikalleşen gruplar dinin ruhundan ve hedeflerinden ziyade lafzına ve şekline vurgu yapan, kültürel ve folklorik zenginlikleri reddeden bir söylem geliştirmiştir. Ayrıca çağdaş dünyada şiddetle anılan bir Müslüman imajının oluşmasına yol açmışlardır."},{"k":"li","x":"Suudi Arabistan'da ortaya çıkan ve Muhammed b. Abdülvehhâb’ın yolundan gitmeyi amaç edindiği için Vehhabî diye anılan, ancak kendini daha çok Selefi olarak tanıtan hareket de Hanbelîliğin literal yorumuna dayalı ve yeniliğe kapalı bir çizgiye girmiştir."},{"k":"li","x":"Modernlikle ilgi kurmayan, siyasi yönü bulunmayan, tamamen geleneksel anlamda selefin yolundan giden veya tasavvufun bünyesinde varlığını sürdüren Selefi cemaatler de mevcuttur."},{"k":"p","x":"**2. Selefiyye'nin İnanç Esasları:** Gazzâlî, sahabe ve tabiin mezhebi olarak tavsif ettiği selef ekolünün bazı usul ve yöntemlerini yedi esasa çıkarmaktadır. Bunlar şöyledir:"},{"k":"p","x":"**1. Takdis**:Cenab-ı Allah'ı şanına uygun düşmeyen şeylerden ve cismiyetten tenzih etmek"},{"k":"p","x":"**2. Tasdik**:Nasslarda Allah'ın isim ve sıfatları hakkındaki ifadeleri olduğu gibi kabul etmek"},{"k":"p","x":"**3. Aczini itiraf etmek**:Müteşabih nasslarda geçen ifadeler hakkında tevile gitmeden bunların maksadını Allah'a bırakmak, bunların bilinemeyeceğini itiraf etmek"},{"k":"p","x":"**4. Sükut (susmak):** Müteşabihlerin anlamını sormamak, onlara dalmamak, cahilin bunları sormaması, âlimin de cevap vermemesi"},{"k":"p","x":"**5. İmsak (uzak tutma)**: Müteşabih ifadeler üzerinde yorum ve te'vilden sakınmak"},{"k":"p","x":"**6. Keff:** Müteşabih olan hususlarla zihnen ve kalben bile meşgul olmamak"},{"k":"p","x":"**7. Ma'rifet ehline teslim:** Hz. Peygamber, sahabe ve Allah'ın bildirdiği kimselerin belirtilen hususları bilebileceğini kabullenmek, mütehassıs âlimlerin söylediklerini tasdik etmek."}]},{"h":"Vehhâbîlik: İsimlendirme Meselesi","b":[{"k":"li","x":"\" **Vehhabi** \" adı, kurucusu olan Muhammed bin Abdulvehhab'ın babasına nispetle muhalifleri tarafından verilmiş, fırka mensuplarınca benimsenmemiştir. Bunun sebebi, oluşan menfi imajdır."},{"k":"li","x":"Muhalifleri tarafından verilmiş bir başka isim ise \" **Haricilik** \"tir. Osmanlı halifelerine isyan etmeleri, büyük günah işleyenleri tekfir etmeleri ve şiddete başvurmaları sebebiyle bu hareket Türkler tarafından böyle isimlendirilmiştir. Yine Müslümanlar için büyük öneme sahip birçok eseri yok ettikleri için \" **Mabet Yıkıcılar\"** olarak da adlandırılmışlardır."},{"k":"li","x":"Onlar hareketlerini **“Da'vet, Da’vetü't-Tevhid, ed-Da'vetü's-Selefiyye** \" olarak isimlendirmekte, kendilerine \" **Muvahhidun** \" demektedirler. Yine kendilerine **“Amelde ve itikatta Hanbeliyiz.\"** derler. Son zamanlarda ise **Selefiyye** adını tercih etmeye başlamışlardır."}]},{"h":"Mezhebin Teşekkül ve Gelişim Süreci","b":[{"k":"h","x":"a. Mezhebin Ortaya Çıktığı Coğrafya ve Dönemin Genel Özellikleri"},{"k":"li","x":"Vehhabilik on sekizinci asırda Necid bölgesinde ortaya çıkmıştır. Bu bölgenin bazı özelliklerinin bilinmesi Vehhabiliği anlama açısından faydalı olacaktır."},{"k":"li","x":"Bu bölge Hz. Peygamber zamanında Müslüman olmakla beraber tam anlamıyla İslamlaşabilmiş değildir. Burası, eski medeniyetler altında çok çeşitli akidelere ev sahipliği yapmıştır. Bu farklı inançların etkisinin silinmediği bölgede Müseylime, Secah, Tuleyha gibi sahte peygamberler ortaya çıkmıştır. Yine Hz. Peygamber zamanında Medine yönetimi ile mücadeleye girişmiş, Hz. Ali ve Muaviye karşılaşması sırasında ise Şii-Harici çatışmalara sahne olmuştur."},{"k":"li","x":"Bu insanlar bedevi kültür ile yetişmiş isyankâr ruhlu ve yağmaya eğilimli kişilerdir. Kabile yapısının en önemli davranış biçimlerinden biri hiç kuşkusuz kendi dışındakini **\"öteki\"** kabul etmesidir. Ayrıca sufilik akımının yayılması, ulemanın eleştirileri Vehhabîliğin doğmasında etkili olmuştur."},{"k":"li","x":"Necid bölgesinde hâkim olan görüş Hanbeli Mezhebi'dir. Ahmed bin Hanbel'in ve daha sonra onun yolunu takip eden İbn Teymiyye'nin görüşleri oldukça belirgindir. Özellikle tevhid ve bid'at konularındaki beyanları, İbn Abdülvehhab'ın görüşlerini dayandıracağı temel esaslardan olmuştur. Bundan dolayı mensupları bu hareketin yeni bir mezhep olduğunu kabul etmezler. Vehhabilerin katı ve sert tutumları İbn Teymiyye'den kaynaklanmaktadır. Bununla birlikte Vehhabi görüşün her faaliyetini İbn Teymiyye'ye dayandırmak yanlış olur. Çünkü bazı konularda onun onaylamayacağı görüşler öne sürmüşlerdir."},{"k":"h","x":"b. Muhammed b. Abdülvehhab'ın Hayatı"},{"k":"li","x":"Muhammed b. Abdülvehhab, 1115/1703 yılında Arabistan'ın Necid bölgesindeki Uyeyne kasabasında doğmuştur. Beni Temim kabilesine mensuptur. Babası ve dedesi siyasi ağırlığı olan ilim adamlarıydı. İbn Abdülvehhab küçüklüğünden itibaren babasından tefsir, hadis ve akaid kitapları okudu. Hanbeli fıkhını ve selef mezhebinin ilkelerini öğrendi. On yaşında hafız oldu. On iki yaşında ilim için Mekke'ye gitti. Sonra Medine'ye geçti. Buradaki bilginlerden dersler aldı. Medine, farklı beldelerden gelen öğrenci ve hocaların buluşma merkeziydi. Bu sebeple İbn Abdülvehhab, hocalarını seçme imkânına sahip oldu. Ancak Medine'de hac ziyareti için gelen insanların Hz. Peygamber'in mezarını ziyaret ettiklerini ve ondan yardım dilediklerini görünce onların bu davranışlarını eleştirmeye başladı."},{"k":"li","x":"Bu bölgedeki dinî durumu değerlendiren Hocası Şeyh Abdullah b. İbrahim en-Necdi ve İbn Abdulvehhab bölgenin batıl akide ve amellerle iç içe olduğunu düşünmekteydi. Hocası bir gün kendisine “Sana şehrim için hazırladığım silahları göstereyim mi?\" şeklinde bir soru yönelttiğinde şaşıran İbn Abdülvehhab, hocasına \"evet\" cevabını vermiş ve kendisine bunun nasıl bir silah olduğunu sormuştu. Cevap olarak gösterilen kitap dolu bir odayı gördüğünde ise hocasının bid'atlerle ilmî yönden mücadeleyi anlatmak istediğini kavramıştı. İbn Abdülvehhab temel hadis külliyatını hocasından okumuş ve icazet almıştır. Hocası en önemli özelliği İbn Teymiyye hayran olmasıdır."},{"k":"li","x":"İbn Abdülvehhab'ın Medine'deki diğer hocası muhaddis şeyh **Muhammed Hayat es- Sindî** 'dir. Bir gün İbn Abdülvehhab'a Hz. Peygamber'in kabri başında yapılan bid'atler hakkında ne düşündüğünü sormuştur. Onun, \"Şüphesiz onların içinde bulundukları din yıkılmıştır, yapmış oldukları da bâtıldır.\" şeklindeki cevabı hocasının çok hoşuna gitmiştir. Daha sonra hocası, İbn Abdülvehhab ile şirk ve tevhit konusunda dersler yapmışlardır."},{"k":"li","x":"Medine'den sonra Basra'ya gitmiş ve orada da ilim öğrenmeye devam etmiş aynı zamanda bildiklerini halka anlatmaya çalışmış, fikrî münakaşalara katılmıştır. Basra kozmopolit bir şehirdi. Halkta görülen velilere aşırı hürmet ve bunlara ibadet gibi algılanabilecek dindarlık tezahürleri, kendi davasını başlatmasına zemin hazırladı. Ortaya koyduğu fikirlerinden dolayı Basra'dan zorunlu olarak ayrıldı."},{"k":"li","x":"Necid bölgesine tekrar yerleşti. 1740 yılında babasının ölümünün ardından şirk olarak gördüğü bazı dini uygulamalara karşı çıkarak istılah hareketi başlattı. Fakat kasaba ahalisinin büyük tepkisi ile karşılaştı. Sonuç alamayacağına karar verince de Uyeyne'ye döndü. Uyeyne'nin yöneticisi ou destekleyince faaliyetlerine burada devam etti. Hz. Ömer'in kardeşi Zeyd bin el-Hattab'ın türbesini yıktırması sonrasında halktan büyük tepki topladı ve burayı da terk etti. Riyad yakınlarındaki Dir'iyye’ye geldi. Orada, Muhammed b. Suud ile Allah yolunda cihat etmek, tevhit kelimesini yükseltmek ve birbirlerine yardım etmek üzere **1157/1744 yılında** bir anlaşma yaptılar. Böylece birisi fikirlerini yayacak diğeri Arabistan'a sahip olacaktı."},{"k":"li","x":"Muhammed b. Abdülvehhab'ın öğretilerini, Hanbeli doktrini üzerine bina ederek kaleme aldığı temel eseri **Kitâbu't-Tevhid'** dir. Tevhide uymayan Müslümanlara bir reddiye olarak da **Keşfü'ş-Şübühât** adlı eserini kaleme almıştır. Kitâbü Usuli’d-Dîn, Akidetü'l- Fırkati’n-Naciye, Risale Fi'rred ‘ale'r-Rafiza gibi eserleri de vardır."}]},{"h":"Siyasi Gelişmeler ve Hareketin Mezhepleşme Süreci","b":[{"k":"p","x":"Muhammed b. Suud tarafından desteklenmesiyle siyasi bir hareket niteliği kazandı. İnsanların şirk içinde bulunduğu, bunların mal ve canlarının kendisine inanan kişilere helal olduğu gibi fetvalar Suud'un ganimetlerle yandaşlarını çoğaltıyor, gücünü artırıyordu. Böylece 1744'te Vehhabi Devletinin temelleri atılmış oluyordu."},{"k":"h","x":"a. Birinci Suud Devleti"},{"k":"li","x":"1744 yılında imzalanan **Dir'iyye anlaşması** sonucunda Vehhabî anlayış Suud ailesinin himayesi altına girmiştir. Bu ittifak beklenen sonucu kısa süre içerisinde vermiş, Muhammed bin Suud'un 1765 yılında vefatına kadar neredeyse bütün Necid bölgesi Suudilerin hâkimiyeti altına girmiştir."},{"k":"li","x":"Oğlu **Abdülaziz döneminde** de cihat anlayışı üzerine kurulu bir din telakkisi kısa sürede çok sayıda taraftar toplamıştır. Abdülaziz'in, ganimetlerin beşte dördünü savaşanlar arasında paylaştırması taraftarlarının sayısını arttırmıştır."},{"k":"li","x":"13 Mayıs 1802 yılında Kerbela'ya baskın düzenleyen Suudlular, iki binden fazla Şii’yi öldürmüşler; Hz. Hüseyin türbesi içindeki altın ve gümüşler ile değerli eşyaları alıp Der'iyye'ye geri dönmüşlerdi."},{"k":"li","x":"18 Şubat 1803'te Taif Vehhabiler tarafından ele geçirildi. Çok sayıda Taifli öldürüldü, malları talan edildi. **Mekke ise 30 Nisan 1803 günü Vehhabîlerin eline geçti**. İhram giyerek şehre giren Abdülaziz'e şehrin ileri gelenleri ve halk biat etmek zorunda kaldı. Başta Hz. Hatice'nin evi olmak üzere bilinen ve hatıra olarak korunan tarihi eserler birer birer yıkıldı. Abdülaziz buradan Cidde'ye geçti. Mekke şerifi Galip, Mekke'yi geri aldı. Necid Bölgesi'ne geri dönen Abdülaziz Dir'iyye'ye gelen bir Şii tarafından bıçaklanarak öldürüldü."},{"k":"li","x":"Abdülaziz'in yerine geçen **Suud** 1805 yılında Medine'yi tekrar ele geçirdi. İnsanları Vehhabiliğe davet etti kabul etmeyenlerin öldürüleceğini duyurdu. Başta Baki' Kabristanlığı olmak üzere şehirdeki birçok mezar ve türbe yıktırıldı. Ertesi yıl Mekke'yi tekrar ele geçirdiler. Şehirdeki bütün kahvehaneler kapatılarak nargileler ve çalgı aletleri kırıldı."},{"k":"li","x":"Bu gelişmeler İstanbul'da büyük rahatsızlık meydana getirmişti. I. Mahmut, III. Mustafa, I. Abdülhamit ve III. Selim siyasi problemler nedeniyle müdahalede bulunamadılar. 19. yüzyılın başlarında işin ciddiyeti üzerine Sultan II. Mahmud, Mısır Valisi Kavalalı Mehmed Ali Paşa'yı sorunu çözmekle görevlendirdi. Mehmet Ali Paşa, oğlu Tosun komutasındaki orduyla 1812-13 yılları arasında Mekke, Medine ve Taif'i Vehhabîlerin elinden kurtardı. Daha sonra bizzat Emir Abdülaziz'in üzerine yürüdü. Emir Abdülaziz'in 1814'te ölümü üzerine Vehhabîler ağır bir yenilgiye uğradı. 1818 yılında mezhep taraftarlarından önemli bir kesim ele geçirildi ve elebaşları idama mahkûm edildi. Nihayet Mehmet Ali Paşa’nın kumandanı İbrahim Paşa, meseleyi kökten çözmek için Dir'iyye'yi kuşatma altına aldı. Dir'iyye'de mahalleler, bahçe ve sokaklar ateşe verilerek iskâna imkânsız hâle getirildi. Bu kuşatmada Vehhabi ulemasının ileri gelenleri de yakalandı; bazılan idam edilmekle beraber birçoğu hapsedildi. Nihayetinde Abdülaziz'in yerine geçen oğlu Abdullah ve çocuklarını esir ederek İstanbul'a gönderdi. Bunların 1819 yılında İstanbul'da asıldılar."},{"k":"h","x":"b. İkinci Suud Devleti"},{"k":"li","x":"Dir'iyye işgalinden sağ kurtulan Suud ailesinden Türkî bin Abdullah (ö. 1834) ve oğlu Faysal (ö. 1865), Necd Bölgesi'nde Suud ailesinin hâkimiyeti için çalışmalara başladılar. 1822'de Riyad'ı ele geçirerek burayı başşehir yaptılar."},{"k":"li","x":"Necid bölgesinin yönetimini babasından devralan **Faysal** sonra Mısır ordusuna esir düştü. 1840 yılında Mehmet Ali Paşa'nın bağımsızlığını ilan etmesi üzerine Faysal Kahire'den kaçmayı başardı. Tekrar devletin başına geçen Faysal, babası Türkî zamanındaki sınırlara yeniden ulaştı."},{"k":"li","x":"Bu dönemde bir Bedevi kabilesinin lideri olan **Muhammed b. Reşid** güçlü bir siyasi yapı kurmayı başarmıştı. Osmanlı Devleti'yle anlaşıp Necid'in büyük bir bölümünü ele geçirdi. Yapılan savaşlarda Suud ailesini yenilgiye uğratan Reşid, 1861 yılında Riyat'taki otoriteyi tamamen ele geçirince Suud ailesi Riyad'ı terk etmek zorunda kaldı."},{"k":"h","x":"c. Suudi Arabistan Krallığı"},{"k":"li","x":"Suud hanedanından **Abdülaziz İbn Suud**, 1901'de Vehhabi devletini yeniden ihya etti. Abdülaziz, sadece altı adamını yanına alarak surları aştı ve gece yarısı Riyad'a girdi. Yaptığı birkaç ev baskınıyla şehrin önemli kişilerini etkisiz hale getirdi. Sabah olduğunda dışarıdaki adamları içeri girerek tüm şehri kontrol altına aldılar. Öldürülen kişilerin içerisinde Riyad valisi de bulunmaktaydı. Bu olay Vehhabî tarihinin dönüm noktalarından biri olmuş ve bugünkü Suudi Arabistan Devleti'nin temellerinin atılmasında önemli rol oynamıştır."},{"k":"li","x":"Abdülaziz, Hindistan-İngiliz hükümetinin desteğini alıp İngilizlerle 26 Aralık 1916 tarihinde bir anlaşma imzaladı. Böylece kendisine bağlı bölgelerin mutlak hükümdarı oldu. Osmanlı Devleti, 1918 yılı sonlarında Medine'den çekilince Vehhabiler, 1921-1925 yılları arasında Hâil, Taif, Mek ke, Medine ve Cidde'yi ele geçirdiler. Abdülaziz İbn Suud, “Necid ve Hicaz Kralı” oldu. 1953 tarihinde ölümüne kadar Suudi Arabistan Kralı olarak yaşadı. Kendisinden sonra halefleri Suud (1953 1964), Faysal (1964-1975), Halid (1975- 1982), Fahd (1982 2005) ve Abdullah (2005-2015) devleti yönettiler."},{"k":"li","x":"Görüldüğü gibi Vehhabîlik teşekkül etmeye başladığı andan itibaren siyasi ilişkisini var olan otorite ve güç odaklarıyla hep sürdürmüş, petrol kaynaklarının da kullanılmaya başlanmasıyla maddi gücü arkasına alarak Batılı devletlerle olan ilişkisini her zaman güçlü konumda tutmuştur."}]},{"h":"İhvan Teşkilatı","b":[{"k":"li","x":"Çeşitli bedevi kabilelerin Abdülaziz b. Suud liderliğinde yürüttüğü ve 1912-1930 yılları arasında etkisini gösteren Vehhabi kaynaklı dinî ve siyasi harekete **\"ihvan\"** hareketi denilmektedir."},{"k":"li","x":"İhvan adı verilen sakinler, toprağı işlemenin yanı sıra, günü geldiğinde cihada katılmak için birtakım sınıflara ayrıldılar. Bu göçebe bölgeleri kısa zaman sonra fanatikliğin ve fundamentalizmin kaleleri haline gelmiştir."},{"k":"li","x":"Abdülaziz b. Suud'un kutsal şehirleri geri almak en büyük idealiydi. Bu ideal için iyi yetişmiş askerlere ihtiyacı vardı. Bu askerlerin yetişmesi için hazırlanan iskân politikası ihvan teşkilatının temellerini oluş turmuştur. Kabilevi bağlılıklar yerini din kardeşliğine bırakacaktır. Bir kimsenin ihvana mensup sayılması için göçebe hayatı bırakıp bir hücrede yerleşik hayata geçmesi gerekir."},{"k":"li","x":"Hicrelerin geçim kaynağı olan çiftçilik iskân planının önemli bir parçası olsa da tutmadı. Çünkü Necid Bölgesi kurak bir araziydi. Ayrıca savaşlar tarımı olumsuz etkiliyordu. Bu durum hicrelerde fakirliğini beraberinde getiriyordu. İbn Suud “ **mutavvi** \" denilen görevlileri hicrelere göndererek **fakir müminin zengin müminden daha hayırlı** olduğunu anlattırmıştır."},{"k":"li","x":"İhvan mensupları tarafından insanlar üç kez davet edilir kabul edilmezse onlar savaşılırdı. Sigara sıkı takip edilir, yeni buluşlar bid'atti. Kol saati, fotoğraf makinesi, telefon, telgraf gibi araçlar \"gâvur icadı” idi. İhvan İbn Suud'un askerî kuvvetinin büyük bir kısmını oluşturmaktaydı. Onlar kendilerini korkusuzca tehlikeye atabiliyorlardı."},{"k":"li","x":"İhvan Teşkilatını ortadan kaldırmaya niyet eden Abdülaziz, 30 Mart 1929'da gerçekleşen ve **\"Sebile\"** diye isimlendirilen bir meydan savaşı ve bir yıl sonra vuku bulan **Ahsa operasyonları** ile ihvan Teşkilatını ortadan kaldırmıştır."}]},{"h":"Vehhabîliğin Düşünce Sistemi","b":[{"k":"h","x":"a. Tevhid ve Şirk"},{"k":"li","x":"Kullukta Allah'ı bir tanımak anlamındaki tevhid, Hz. Peygamber'in bildirdiği en büyük farzdır. Tevhidi inkâr eden de kâfir olur. İbn Abdülvehhab'a göre, “tevhid\"in dil ikrar kalp ile tasdikin yanında bir de ameli yönü vardır. Bu üç umdeden birisi eksik olursa insan Müslüman sayılmaz."},{"k":"li","x":"Tevhidi Allah'a ibadet etmek, Tağut'tan uzak durmak şeklinde tanımlar. Ona göre tevhid, Rablıkta Allah’ı birlemek (**Tevhidu'r-Rububiyyet**), ilahlıkta Allah'ı birlemek (**Tevhidu'l- Uluhiyyet**) ve zat ve sıfatlarında Allah'ı birlemek (**Tevhidü’z-Zat ve's-Sıfat**) olmak üzere üçe ayrılır."},{"k":"p","x":"**Tevhid-i Rububiyyet:** Allah'ı kendi fiilleriyle birlemek anlamına gelir. Allah'ın kitabı ve Peygamber'in sünnetine uymak ve onun dışındakileri tanımamak bu tür bir tevhiddir. Buna **ameli tevhid** de denir. İman ile küfrü ayırt eder. Bu tevhidi yerine getirmeyenlerin malları ve canları muvahhidlere helaldir."},{"k":"p","x":"**Tevhid-i Uluhiyet:** Allah'ın bütün mahlukatın ilahı olduğu, bütün ibadetlerin sadece ona yapılacağının bilinmesi ve bunun fiilen yerine getirilmesidir. Dolayısıyla Allah'tan başkasından yardım isteyen, ibadet eden, nezreden kimse kâfir olur."},{"k":"p","x":"**Tevhid-i Zat ve Sıfat**: Allah'ın bütün yönleri ile mutlak kemal, azamet, celal ve cemal sıfatları ile muttasıf olduğu, bu konuda hiçbir şeyin O'na şerik olmadığı, ancak kendisi ve peygamberinin bildirdiği şanına layık isimlerle anılacağına inanmaktır. Şirk'e gelince, büyük, küçük ve gizli olmak üzere üç çeşittir."},{"k":"p","x":"**a) Büyük Şirk**: Allah'a ortak koşmaktır."},{"k":"p","x":"**b) Küçük Şirk**: Dünya hayatını isteyerek dünyayı ahirete tercih etmek, riya ile ibadet etmek."},{"k":"p","x":"**c) Gizli Şirk**: Allah'ın dışında ruhban ve azizlere itaat, onları yüceltmek şeklindedir."},{"k":"h","x":"b. Şefaat ve Tevessül"},{"k":"p","x":"Vehhabi anlayışa göre Allah'tan başka herhangi bir şeyden; meleklerden, peygamberlerden şefaat umulmaz. \"Allah dilediğine ve hoşnut olduğuna izin vermedikçe göklerde bulunan nice meleklerin şefaati bir işe yaramaz.\" “ De ki: Bütün şefaat Allah'ın iznine bağlıdır... \" gibi ayetleri delil gösterirler. Aslında Hz. Peygamber'in şefaat edebileceğini inanırlar, şefaati ondan istemeyi reddederler."},{"k":"p","x":"**Tevessül inancı** da şirktir. Birtakım şeyhlerin, velilerin hem hayatlarında hem de öldükten sonra tasarruf sahibi olduklarına inanılması da böyledir. Tevessülden tövbe edilmelidir aksi halde sonu ölümdür."},{"k":"p","x":"Vehhabîler, tasavvufu da şiddetli eleştiriye tabi tutmuşlardır. Onlara göre tarikat, başkalarını istismar etmek için bir vasıta ve mürşidin kendisine çıkar sağlamak için girdiği bir yoldur. Üçlere, yediler, kırklara inanmak; velilerin ve zahit kimselerin manevi güçlere sahip olduklarına inanmak; Dalailü'l-Hayrat okumak rabıta yapmak vb. hususlar kabul edilemez davranışlardır."},{"k":"h","x":"c. İman ve Ameller"},{"k":"p","x":"İmanı söz ve amel olarak tanımlarlar. Onlara göre iman artar ve eksilir. Gerçek iman, kalple tasdik ve onunla amel etmek, dil ile söylemek ve dinin rükünlerini yerine getirmektir. Bunu daha da ileri götürerek amelleri tevhidin bir parçası haline getirmişler ve buna **ameli tevhid** demişlerdir. Ameli terki küfür gördükleri için Müslüman kanı dökmüşlerdir."},{"k":"h","x":"d. Bid'at"},{"k":"p","x":"Kur'an ve Sünnet'te olmayan her şey bid'attır. Bir bid'atin zuhuruna sebebiyet veren kimse melundur ve çıkardığı şey reddedilmelidir. Bid'atların çoğu insanları şirke düşürmektedir."},{"k":"p","x":"Vehhabiliğin bid'atler konusunda ve özellikle mezar ve türbeler hususundaki bu katı tutumu kendi taraftarlarınca bile eleştirilmiştir.Onlara göre sevap umarak Hz. Muhammed'in kabrini ziyaret bile şirke neden olabilir. Hz. Peygamber'in anısını yüceltmek, hırka-i şerif, sakal-ı şerif ziyaretleri yapmak gibi hususlar Allah'tan başkasına ibadet etmek, yani şirk koşmaktır. Mevlit toplantıları düzenlemek, bu toplantılarda mevlid okumak, mescitlerde sünnet ya da nafile namazlar kılmak yasaklanmalıdır. Yine camileri süslemek, minare yapmak, tütün içmek, soğan sarımsak yemek, namazı cemaatsiz kılmak, nazar boncuğu takmak gibi uygulamalar da bid'at sayılmıştır. Hz. Peygamber'e salavat getirirken “ **seyyidina** ve **mevlana\"** demek de bid'attir. Bid'at ortaya koyan kimseler lanetlenmelidir."},{"k":"h","x":"e. İyiliği Emredip Kötülüğü Yasaklamak"},{"k":"p","x":"Bu prensibi daha ziyade “bid'atlerle mücadele\" şeklinde anlamıştır. Sakındırılması gereken hususlara gelince bunlar haramlar, kötülükler, kâfirleri taklit ve Cahiliye âdetleridir. İnsanları kötülükten uzaklaştırmak her Müslüman'a farzdır. Gücü yettiği ölçüde kişinin eliyle, diliyle ve kalbiyle bunu yapması gerekir. Bu prensibin uygulanmasından birinci derecede devlet başkanı sorumlu tutulmuştur. Sonuç olarak katı tutumları kendileri dışındaki tüm Müslümanları tekfir etmelerine sebebiyet vermiş ve İslam dünyasında huzursuzlukların doğmasına zemin hazırlamıştır."}]},{"h":"Vehhabîliğin İslam Dünyasındaki Tesirleri ve Günümüzdeki Durumu","b":[{"k":"p","x":"Vehhabi hareketi, yenilikçi veya gelenekçi şahsiyetlere ve dini akımlara doğrudan veya dolaylı olarak ilham kaynağı olmuştur. XIX. yüzyıldan itibaren Güney Asya yarımadasında, İran körfezinde, Kuveyt ve Bahreyn'de derin tesirler icra etmiş ve yeni hareketlerin oluşmasına sebebiyet vermiştir."},{"k":"p","x":"Günümüzde Vehhabilik, Suudi Arabistan'ın resmi mezhebidir. Vehhabilik, bugün fıkıhta Hanbeliliğin, itikatta Selefiliğin himayesine sığınmıştır. Selefi din söylemi, Ahmet b. Hanbel, İbn Teymiyye, İbn Kayyım el-Cevzi ve İbn Abdülvehhab'ın eserleri yoluyla propaganda edilmektedir. Selefilik de Suudi hükümetini eleştiren ve cihadı öne çıkaran **Cihadi Selefilik** ve Suudi Selefilik sürecine girmiştir. Günümüzde Vehhabiliği eleştiren çok sayıda eser kaleme alınmaktadır."}]},{"h":"Selefî Düşüncenin Temel Özellikleri","b":[{"k":"p","x":"Selefi akımlar, İslam düşüncesi tarihinde ortaya çıkmış, \"selef-i salihin\" yani ilk salih nesillerin anlayışını ve yaşam tarzını model almayı hedefleyen muhafazakâr ve gelenekçi bir düşünce ve zihniyettir. Bu anlayış, nasların yorumlanması ve şer'i hükümlerin çıkarılması sırasında gözetilmesi gereken metodolojik bir ilke olarak başlamış, zamanla sistematik bir nazariyeye, dini ve siyasi bir akıma, hatta radikal ve savaşçı bir yapıya dönüşmüştür."},{"k":"p","x":"Selefi düşüncenin temel karakteristik özellikleri şunlardır:"},{"k":"li","x":"**Allah'ın sıfatları ve müteşabihler konusunda te'vili reddetme ve teslimiyeti benimseme:** Selefiler, Allah'ın sıfatlarını ve müteşabih nasları zahir manalarıyla anlayarak, teşbih ve tecsime yaklaşan, bu konularda akıl yürütmek yerine teslim olmayı öneren bir yaklaşım sergilerler."},{"k":"li","x":"**İman-amel birlikteliği:** İmanın \"söz ve amelden ibaret\" olduğunu savunurlar. Amel eksikliğinin imanı etkileyeceğini, hatta büyük günahta ısrarın imanı tamamen yok edip kişiyi küfre sürükleyebileceğini ileri sürerler. Bu, katı bir ahlakçılığa ve \"tekfir\" eğilimine yol açmıştır."},{"k":"li","x":"**Kur'an'ın mahluk olmadığına inanma:** Bu konudaki ısrarlı tutumları, Kur'an'ın manasının ancak sünnet ve selef-i salihin söz ve uygulamalarıyla açıklanabileceği anlamına gelir."},{"k":"li","x":"**Akıl-nakil ilişkisinde naklin üstünlüğü:** Selefiler, aklı nakle tabi kılarlar, hatta aklın temelini nakil olarak görürler. Re'y ve kelami düşünceyi kötüleyip dışlarlar."},{"k":"li","x":"**Kur'an ve Sünneti eşit kategoride sayma:** Sünneti, Kur'an'ı açıklama işlevi ve dini öğrenme aracı olarak Kur'an ile eşdeğer görürler."},{"k":"li","x":"**Selefin görüş ve uygulamalarını dini bir otorite ve kaynak olarak kabul etme:** Sahabe, tabiun ve etbau't-tabiin'in \"altın nesil\" olduğunu benimserler. Bu ilk üç nesilden sonraki tüm fikri gelişmeleri \"bid'at\" (yenilikler/sapkınlıklar) olarak değerlendirir ve bunlarla mücadele ederler."},{"k":"li","x":"**Hilafetin Kureyş kabilesinin hakkı olduğuna inanma:** Bu inanç, Arap milliyetçiliğinin ilham kaynaklarından biri olmuş ve selefilerin siyasi rol üstlenmelerine neden olmuştur."}]},{"h":"Muhammed b. Abdülvehhab'ın Hayatı","b":[{"k":"li","x":"**Doğumu ve Eğitimi:** Muhammed b. Abdülvehhab, 1115/1703 yılında Arabistan'ın Necd bölgesindeki Uyeyne kasabasında doğmuştur. Hayatının çoğunu bu bölgenin önemli vahalarından olan Uyeyne, Hureymila ve Deriyye'de geçirmiştir. İlim tahsili için Basra, Ahsa, Mekke ve Medine gibi şehirlere gitmiş ve buralarda beş altı yılını geçirmiştir. Babası Abdülvehhab bin Süleyman, Uyeyne kadısı ve dedesi Süleyman b. Ali de Necid müftüsü olup, ilmi geleneğiyle meşhur Al-i Müşerref ailesine mensuptur. Muhammed b. Abdülvehhab, küçüklüğünden itibaren babasından tefsir, hadis ve akaid kitapları okumuş, Hanbeli fıkhını ve selef mezhebinin ilkelerini öğrenmiştir. Özellikle İbn Teymiyye ve İbn Kayyım el-Cevziyye'nin kitaplarını babasıyla birlikte erken dönemde bitirmiştir. On yaşında hafızlığını tamamlamış ve ilmi seviyeye ulaşmıştır."},{"k":"h5","x":"Hocaları ve Fikri Etkileşimleri"},{"k":"li","x":"Medine'deyken Abdullah b. İbrahim b. Seyf en-Necdi, Süleyman el-Kürdi ve Muhammed Hayat es-Sindi gibi bilginlerden dersler almıştır. Özellikle hocası Şeyh Abdullah'ın İbn Teymiyye hayranı olması ve onun fikirlerini çokça dile getirmesi, İbn Abdülvehhab'ın fikirlerinin oluşmasında büyük rol oynamıştır."},{"k":"li","x":"Hocası Muhammed Hayat es-Sindi, İbn Abdülvehhab'a Hz. Peygamber'in kabri başında yapılan bid'atler hakkında ne düşündüğünü sormuş, İbn Abdülvehhab'ın \"Şüphesiz onların içinde bulundukları din yıkılmıştır, yapmış oldukları da batıldır\" şeklindeki cevabı hocasının hoşuna gitmiştir."},{"k":"li","x":"Muhammed b. Abdülvehhab, kendisinin dönemindeki bütün ilmi disiplinlerden bağımsız olduğunu, hiçbir ekolün mutaassıp taraftarı olmadığını iddia etmiştir. Sıkça atıfta bulunduğu ve eserlerinden nakiller yaptığı İbn Teymiyye (ö.1328) ve İbn Kayyim el-Cevziyye (ö.1350) de taklidi uygun bulmuyorlardı."},{"k":"li","x":"**Bid'at Karşıtlığı ve Tevhid Anlayışı:** Muhammed b. Abdülvehhab, insanları bütün bid'atlerden uzak, gerçek dine davet etmeye başlamıştır. Bu yeni akımın en önemli esaslarından biri bid'at aleyhtarlığıdır. Vehhabilik, genel olarak, tasavvufu bid'at olarak görür ve reddeder. Eserlerinde, özellikle de mektuplarında, Arîd'in vahalarında yaşayan bazı Sufilerle ve diğer bedevi kabileleriyle mücadele ettiği görülmektedir. Muhammed b. Abdülvehhab, Sufi pratikleri ile çeşitli şekillerde yayılmış olan \"halk dini\" arasında kategorik bir ayrım yapmamıştır. Kabirlerin kutsanması yoluyla ortaya konan dini tezahürler ve uygulamalar için kullandığı kavram \"el-itikâd fi'l-enbiya ve's- Sâlihîn\" olup, ona göre bütün bu uygulamalar küfürdür."},{"k":"li","x":"Muhammed b. Abdülvehhab, Sufi çevrelere göre \"Delâilu'l-Hayrât\" ve \"Ravdu'r-Reyâhîn\" gibi kitapları yakmakla itham edilmiştir. Ravdu'r-Reyâhîn hakkında sessiz kalmış, Delâilu'l-Hayrât konusundaki suçlamaları ise reddetmiş, sadece taraftarlarına bu nevi eserlerle uğraşmamalarını tavsiye ettiğini, zira bu tür kitapların insanları Allah'ın kitabından alıkoyduğunu ifade etmiştir."},{"k":"li","x":"Onun doktrininin temelinde **\"tevhid\"** anlayışı yatmaktadır. Tevhidi; Tevhîd-i Rububiyyet, Tevhîd-i Ulûhiyet ve Tevhîdu'l-Esma ve's-Sıfat olarak üçe ayırmaktadır. Tevhîd-i Ulûhiyet, Allah'ın kulların fiilleri ve ibadetleriyle birlenmesi anlamına gelir ve bu, Muhammed b. Abdülvehhab'ın doktrininin temel esaslarından olup, kişinin iman edip etmemesini belirler. Dua, havf, reca, tevekkül, inabe, rağbet, tazim, nezr, istiğase gibi fiillerin sadece Allah için yapılması gerektiğini savunmuştur. Bu eylemlerin Allah dışında birilerine yönelmesi şirke yol açar. Ona göre bu tür fiilleri yapanlar Tevhîd-i Ulûhiyet'i yerine getirmemiş ve İslam dairesinden çıkmıştır."},{"k":"li","x":"Şirki tevhidin zıddı olarak kabul etmiş ve büyüğüne, küçüğüne ve gizlisine değinmiştir. Ona göre, kendi dönemindeki insanların şirki, Cahiliyye Araplarının şirkinden daha ağırdır."},{"k":"li","x":"Tevessülü de sapıklık olarak görmüş, bunun tövbe edilmesini gerektirdiğini, aksi takdirde yapanın öldürüleceğini belirtmiştir."},{"k":"li","x":"Muhammed b. Abdülvehhab'ın mezarlar ve türbelerle ilgili görüşleri tamamen İbn Teymiyye'den gelmektedir. Ona göre Kur'an ve Sünnet'te olmayan her şey bid'attır. Kabir ziyaretleri, türbe yapımı, ölülere niyaz, falcılara inanmak, Hz. Peygamber'in anısını yüceltmek gibi uygulamaları şirk olarak görmüştür. Ayrıca mevlit toplantıları, müzik dinlemek, tütün içmek gibi birçok şeyi de bid'at saymıştır."},{"k":"li","x":"**Aksiyon Adamı Kimliği:** Muhammed b. Abdülvehhab'ın eserleri göz önüne alındığında onun bir teorisyenden ziyade günlük hayatla iç içe, reddiyelere mukabele eden, muarızlarıyla mücadele eden bir aksiyon adamı olduğu görülür. O, Arîd'de daha ziyade babasının ve Arîd dışında da başkalarının temsil ettiği ilim anlayışına karşı çıkıyordu."},{"k":"li","x":"**Yeni Toplum Projesi:** Muhammed b. Abdülvehhab, kendisini \"doğru yolda olan, kendiliğinden ortaya çıkan ve kendi yorum ve bakış açısını kabul etmeyenlerle savaşan\" şeklinde tanımlayan 'yeni İslam toplumu' projesinin entelektüel altyapısını oluşturan temel fikirleri ortaya koymuştur."}]},{"h":"Birinci Suud Devleti","b":[{"k":"li","x":"**İttifak ve Kuruluş:** Muhammed b. Abdülvehhab'ın düşünceleri, Dir'iyye emiri olan Muhammed b. Suud tarafından desteklenmesiyle siyasi bir hareket niteliği kazanmıştır. İkisi, 1157/1744 yılında bir anlaşma yapmışlardır. Bu anlaşmaya göre İbn Abdülvehhab, siyasi lider olarak Muhammed b. Suud'a biat etmiş, İbn Suud da bunun karşılığında İbn Abdülvehhab'ın dini daveti için gerekli siyasi, askeri ve lojistik desteği sağlamayı üstlenmiştir. Bu ittifak, \"fundamentalist bir vaiz ile savaşçı bir kabile liderinin iş birliği\" olarak tanımlanmıştır."},{"k":"li","x":"**Genişleme ve Uygulamalar:** 1744 yılında imzalanan Dir'iyye anlaşması sonucunda Vehhabi anlayış Suud ailesinin himayesine girmiştir. Muhammed b. Suud'un 1765'teki vefatına kadar neredeyse tüm Necid bölgesi Suudilerin hakimiyetine girmiştir. Abdülaziz döneminde de cihat anlayışı üzerine kurulu din telakkisiyle faaliyetler devam etmiştir. Elde edilen ganimetlerin beşte birinin lidere ayrılıp kalanının savaşanlar arasında paylaşılması taraftar sayısını artırmıştır."},{"k":"li","x":"13 Mayıs 1802'de Suudlular, Kerbela'ya baskın düzenleyerek iki binden fazla Şii'yi öldürmüş, Hz. Hüseyin türbesi içindeki altın ve gümüşler ile değerli eşyaları alıp Dir'iyye'ye geri dönmüşlerdir. Bu baskının gerekçesi olarak Gadir Hum törenlerini bid'at olarak değerlendirmeleri ve bu bid'atı işleyenlerin kanlarını helal kabul etmeleri gösterilmiştir."},{"k":"li","x":"1803'te Taif'i, 30 Nisan 1803'te Mekke'yi ele geçirmişlerdir. Mekke'de Hz. Hatice'nin evi başta olmak üzere ileri gelen sahabilere ait olduğu bilinen ve hatıra olarak korunan tarihi eserler yıkılmıştır. 1805 yılında Medine'yi ele geçirmiş, insanları Vehhabiliğe davet etmiş ve bu daveti kabul etmeyenlerin öldürüleceğini duyurmuşlardır. Başta Baki' Kabristanlığı olmak üzere kutsal mekanlardaki kabirler, türbeler ve mescitler yıkılmıştır. Kabir ve türbelerin tahrip edilmesi, Muhammed b. Abdülvehhab'ın tepkilerinin ve değerlendirmelerinin en belirgin sonucuydu. Bu tahribatlar Vehhabi isminin ilk akla gelen uygulamalarından biri olmuştur."},{"k":"li","x":"Vehhabiler, kendileri gibi düşünmeyen Müslümanları tekfir etme konusunda aceleci davranmış, şiddet uygulamış ve işgal ettikleri yerlerde mezarları yıkmış, kültürel kitapları yok etmiş, günlük ibadetler hususunda kontrol ve cezalar uygulamışlardır. Ayrıca, hac ibadetini (özellikle Suriye ve Mısır'dan gelen kafilelerin) engellemişlerdir, zira hacıların yaptığı pek çok şeyin İslami olmadığı iddia edilmiş ve bu nedenle Harameyn'e girişleri yasaklanmıştır."},{"k":"li","x":"**Çöküşü:** Birinci Suud Devleti, Abdülaziz'in Kerbela'da öldürülen Şiilerin intikamını almak isteyen bir Şii tarafından bıçaklanarak öldürülmesiyle zayıflamıştır."}]},{"h":"İkinci Suud Devleti","b":[{"k":"li","x":"**Yeniden Kurulum ve Mücadeleler:** İlk Vehhabi devletinin yıkılmasından sonra, Faysal'ın Kahire'den kaçarak tekrar devletin başına geçmesiyle ikinci Suud Devleti kurulmuştur. Bu dönemde Necid'in kuzeyinde Muhammed b. Reşid adında güçlü bir siyasi yapı ortaya çıkmıştır. Osmanlı Devleti ile anlaşan Reşid, Necid'in büyük bir bölümünü ele geçirmiş ve Suud ailesini Riyad'ı terk etmek zorunda bırakmıştır. Suud ailesi Kuveyt'e sığınmış ve Osmanlı Devleti tarafından maaşa bağlanmıştır. Böylece ikinci Vehhabi devleti de son bulmuştur."},{"k":"p","x":"Günümüz Selefi akımları farklı tezahürlere sahiptir:"}]},{"h":"Vehhabilik","b":[{"k":"p","x":"Vehhabilik, yaklaşık iki asır önce Necd bölgesinde Muhammed b. Abdülvehhab'ın (1703-1792) faaliyetleriyle şekillenmiş, **İslam'ın ilk yıllarına dönme çağrısıyla Müslümanları kurtuluşa davet eden dini ve siyasi bir mezheptir.** Günümüzde Suudi Arabistan'ın resmi mezhebi konumundadır ve Mısır, Hindistan ve bazı Afrika ülkelerinde de taraftarları bulunmaktadır."},{"k":"p","x":"**İsimlendirme ve Kendini Tanımlama:** Mezhebin mensupları bu hareketi \"Da'vet, Da'vetü't- tevhid, ed-Da'vetü's-selefiyye\" olarak adlandırmakta ve kendilerine \"Muvahhidûn\" (tevhid ehli) demektedirler. Ayrıca kendilerini Ahmed bin Hanbel mezhebine mensup Sünniler olarak tanıtarak \"Amelde ve itikatta Hanbeliyiz\" derler. Son zamanlarda ise ilk üç neslin (sahabe, tabiîn, sonraki nesil) dini tasavvurlarına ve yaşam biçimlerine dönmeyi talep etmeleri sebebiyle **\"Selefiyye\" adını tercih etmeye başlamışlardır.** Ancak muhalifleri tarafından \"Vehhabî\" ismi yaygınlaşmıştır. Özellikle Osmanlı döneminde, meşru halifelere isyan etmeleri, amelleri imandan sayarak büyük günah işleyenleri tekfir etmeleri ve şiddete başvurmaları nedeniyle **\"Çağdaş Haricilik\" olarak isimlendirilmişlerdir.** Ayrıca, bid'at görüşleri doğrultusunda birçok İslamî eseri yok ettikleri için **\"Mezar Yıkıcılar\" olarak da adlandırılmışlardır.**"},{"k":"h","x":"Düşünce Sisteminin Temel Özellikleri"},{"k":"li","x":"**Tevhid ve Şirk Anlayışı:** Vehhabiliğin temelinde tevhid inancı bulunur. Onlara göre **kabir ziyareti, şefaat, tevessül (aracı kılma) ve benzeri tasavvufi uygulamalar şirktir** ve sahibinin tövbe etmesini gerektiren sapıklıklardır; aksi takdirde yapan kişi öldürülebilir. Muhammed b. Abdülvehhab, Hz. Peygamber'in şefaat edebileceğini kabul etse de ondan şefaat istenmesine karşı çıkar."},{"k":"li","x":"**İman ve Amel İlişkisi:** Vehhabiler, **imanı söz ve amel olarak tanımlarlar.** Kalple tasdik ve dille söylemenin yeterli olmadığını, farzların yerine getirilmesi gerektiğini savunurlar. **Amellerin imandan olduğunu ve ameli tevhidin bir parçası olduğunu ileri sürerler.** Bu anlayış, tembellik sonucu farz namazlardan birini terk eden veya zekatını vermeyen bir kişinin kafir sayılarak öldürülmesini ve mallarının talan edilmesini meşru görebilmektedir."},{"k":"li","x":"**Bid'at Karşıtlığı: Kur'an ve Sünnet'te olmayan her şeyi bid'at olarak kabul ederler.** Muhammed'in mevlidini ve kandil gecelerini kutlamak, Kur'an'ı makamla okumak, tesbih kullanmak gibi uygulamalar bid'at kapsamında değerlendirilir. Bu konudaki tutumlarında İbn Teymiyye'nin görüşlerinden yararlanmışlar, hatta ondan daha ileri gitmişlerdir."},{"k":"li","x":"**Tasavvufa Yaklaşım: Tasavvufu ve tarikatları şiddetle eleştirirler.** Onlara göre tarikatlar başkalarını istismar etmek için bir vasıta, mürşitler ise kendilerine çıkar sağlamak için bu yolu kullananlardır. Üçlere, yediler, kırklara inanmak, velilerin ve zahitlerin manevi güçlere sahip olduğuna inanmak gibi uygulamaları kabul edilemez görürler."},{"k":"li","x":"**Emr bi'l-Ma'ruf ve Nehy ani'l-Münker**: Gerçek tevhidin gönüllere yerleşmesi, şirk ve bid'atın izalesi için bu prensibin uygulanmasını zaruri görürler. Eğer insanlar şirk ve bid'atlardan vazgeçmiyorlarsa, imamın izni ve kuvvetiyle **gerekirse savaşılarak kötülüğün giderilmesi gerektiğini savunurlar.**"},{"k":"li","x":"**Metodoloji:** Vehhabiler, **katı bir nasçı yaklaşıma sahiptirler.** Akıl-nakil ilişkisinde naklin üstün olduğuna inanırlar ve aklın, dinin getirdiği gerçekleri anlamak için bir vasıta olduğunu kabul etmekle birlikte, akli tefekkürü nakil tarafından belirlenen bir çerçevede tutarlar. Kelâmî düşünceyi ve re'y (akıl yürütme) ehli olanları kötüleyip dışlarlar."},{"k":"li","x":"**Selef Anlayışı:** İslam'ın ilk üç neslini (selef-i salihin) dini otorite olarak kabul ederler ve onların görüş ve uygulamalarını dini ve hukuki hayatlarının merkezine yerleştirirler. Daha sonraki asırlarda ortaya çıkan bütün fikri gelişmeleri ve katkıları ise İslam dininin asli muhtevasına dahil olmayan bid'atler ve yeni türemeler olarak değerlendirirler. **Onlar için geçmiş, şimdi ve geleceği esir almış; bu durum Vehhabiliği koyu bir muhafazakarlığa ve katı bir gelenekselciliğe dönüştürmüştür.**"},{"k":"h","x":"Uygulamaları ve Etkileri"},{"k":"h","x":"Önemli Özellikleri ve Uygulamaları"},{"k":"li","x":"**Bid'at karşıtlığı:** Bid'at aleyhtarlığı, Vehhabilik'in en önemli esaslarından biridir."},{"k":"li","x":"**Tasavvufu reddi:** Vehhabilik, genel olarak tasavvufu bid'at olarak görür ve reddeder. Tarikatları başkalarını istismar etmek ve şeyhin kendine çıkar sağlamak için kullandığı yollar olarak nitelendirir. Ateşe girme, şiş saplama gibi bazı tarikat ritüellerini şirk olarak görür. Üçler, yediler, kırklar gibi inanışları, velilerin manevi güçlerine inanmayı, Dalailü'l-Hayrat okumayı ve rabıta yapmayı kabul edilemez davranışlar olarak değerlendirir. Bu nedenle, iktidarda oldukları dönemlerde tarikat şeyhlerini ve tasavvuf erbabını ülkeden uzaklaştırmışlardır."},{"k":"li","x":"**Kabir ve türbe yıkımı:** Kabir ve türbe gibi mekanları, insanların İslam inancına uygun olmayan bir şekilde velileri, peygamberleri ve ölmüş diğer kişileri tazim ettikleri, hatta Allah'tan başkasına ibadet ettikleri yerler olarak tanımlarlar. Türbelerin ve sandukaların öpülmesini, kabirlerde mum yakılmasını, lamba takılmasını küfür olarak görürler ve türbeler üzerine inşa edilen kubbelerin, kabirlere yapılan süs ve tezyinatın tahrip edilmesi gerektiğini savunurlar. **Kamusal alanda geniş çaplı kabir ve türbe yıkımları** gerçekleştirmişlerdir. Ancak, kaynaklar Vehhabiliğin ilk dönemlerinde ve Hicaz boyunca yayılması sırasında sufilere ait yerleri tahrip ettiğine dair açık bilgi vermez."},{"k":"li","x":"**Bilgi ve eğitimde tekdüzelik:** Vehhabilik, bilgiyi tekdüze hale getirmiş; kendi öğretilerine uymayan eserleri yasaklamış veya tahrip etmiştir. Medrese sistemlerinin ve mezheplerin kurumsallaşmış çerçevesini dağıtmıştır. Dini eğitim, camilerde, medreselerde ve diğer kurumlarda sadece Vehhabi kaynaklarına uygun olarak, Vehhabi hocalar tarafından verilmeye başlanmıştır."},{"k":"li","x":"**Dindarlıkta katılık:** Dindarlığın renkli ve çeşitli sosyal tezahürlerini ortadan kaldırıp yerine tekdüze, katı bir dindarlık anlayışı getirmişlerdir. Camiler, kişinin dindarlığını ortaya koyabileceği yegâne mekanlar haline gelmiştir. Salih kişilere, velilere ait mekanlar ve her türlü manevi aracılık ortadan kalkmıştır. Vefat etmiş bir veliyi anma (mevlid) veya yaşayan bir kişiyi tazim şirk olduğu veya şirke götürdüğü gerekçesiyle yasaklanmıştır."},{"k":"li","x":"**Siyasallaşma:** Muhammed b. Abdulvehhâb'ın en önemli yeniliği, Selefiliğin siyasallaşması ve **Suudi devleti nezdinde bir devlet mezhebine dönüşmesidir.** İyiliği emretme ve kötülüğü yasaklama prensibini, alim, adil ve otorite sahibi bir yöneticinin Müslümanların başında olması şartına bağlar. Şirk ve bid'atlardan vazgeçmeyenlere karşı gerekirse silahlı mücadele yürütülmesini savunmuştur."},{"k":"li","x":"**Tekfir ve şiddet:** Vehhabilik, Selefiyye bünyesindeki bir \"uçlanma\" olarak değerlendirilmektedir. Bu uçlanma, tekfir unsurunun aşırı kullanımı ve bu yolla Müslüman kesimlere yöneltilen şiddetle tezahür etmiştir. Cihat adı altında Osmanlı Devleti'ne, Hicaz hükümetine, Şiilere ve diğer rakiplerine karşı silahlı mücadele yürütmüşlerdir. Kendileri gibi düşünmeyen Müslümanları tekfir etmede acelecilikleri ve şiddet uygulamaları nedeniyle Haricilikle nitelenmişlerdir. Müslümanların birliğini bozan ve nifak tohumları eken bir hareket olarak eleştirilmiştir."},{"k":"li","x":"**İhvan Hareketi:** Vehhabi kaynaklı dini ve siyasi bir hareket olan İhvan, bedevi kabilelerin Vehhabiliğin esasları çerçevesinde eğitilip savaşçı olarak yetiştirilmesiyle ortaya çıkmıştır. Bu yerleşim bölgeleri, dışarıdakilere selam vermeyecek kadar katılaşıp, kendi gibi düşünmeyen Müslümanları müşrik sayıp öldürülmeleri gerektiğini benimseyen **fanatizmin kaleleri haline gelmiştir.** İhvan mensupları modern araçları ve yeni buluşları bid'at olarak görmüşlerdir. Bu teşkilat aynı zamanda İbn Suud'un askeri gücünün önemli bir kısmını oluşturmuş ve dini duyguları savaşlarda ölmeleri durumunda cennete gideceklerine inanan mensuplarına büyük bir motivasyon sağlamıştır. Ancak daha sonra kral Abdülaziz tarafından ortadan kaldırılmıştır."},{"k":"li","x":"**Modern Selefiliğin Ayrışımı:** Günümüz Selefiliği, Suudi hükümetini eleştiren ve cihadı öne çıkaran **\"Cihadi Selefilik\"** ile Suudi hükümetine bağlılığını sürdüren **\"Suudi Selefilik\"** olarak ikiye ayrılmıştır. Cihadi Selefiliğin, Vehhabilik ile çağdaş siyasal İslamcılığın bir sentezi olduğu ve müesses Selefiliği rahatsız ettiği belirtilmiştir."},{"k":"h","x":"Eleştiriler ve Katkılar"},{"k":"li","x":"**Eleştiriler:** Vehhabilik, dini anlama ve yaşamalarındaki katı, sert ve yorumsuz tutumları nedeniyle eleştirilmiştir. Ameli imanın bir parçası olarak kabul etmeleri, kendileri gibi düşünmeyen diğer Müslümanları tekfir etmelerine yol açmış ve İslam dünyasında ayrılık tohumları ekmiştir. Bazı alimler tarafından \"dini tahrif ve medeniyeti tasfiye\" etmekle suçlanmıştır."},{"k":"li","x":"**Katkılar:** Vehhabilerin tasavvuf anlayışına ve veli/zahit kimselere gösterilen aşırı sevgiye yönelik eleştirileri, türbe ve yatırların sorgulanması, Orta çağ dini otoritelerinin reddi ve içtihadın teşvik edilmesi gibi yaklaşımları İslam düşünce tarihinde yeni ıslah hareketlerinin ortaya çıkmasına zemin hazırlamıştır. Ancak kaynaklar, bu hareketin bugüne kadar kayda değer hiçbir düşünce veya sorunlara çözüm üretemediğini ve **\"usulsüz metincilik\"** olarak tanımlandığını belirtir, zira köklü metodolojilerden yoksundur."}]},{"h":"İlmi Selefilik (Suudi Selefiyye / Müesses Selefiyye)","b":[{"k":"p","x":"İlmi Selefilik, kaynaklarda \"Suudi Selefiyye\" veya \"Müesses Selefiyye\" olarak da geçer ve Vehhabiliğin **1930 sonrasında militer özelliğini kaybederek kurumsallaşmış halidir.** Suudi yöneticilerinin Vehhabiliğin devlet karşıtı bir pozisyona geçmesini önlemek için tedricen uyguladığı bir politikanın ürünüdür. Bu akım, **muhafazakâr Selefiliğin tüm unsurlarını paylaşmasına rağmen, İbn Abdülvehhab'ı taklide dönüşen bir Suudi kimliğine taraf olmamaya** çalışır."},{"k":"h","x":"Önemli Özellikleri"},{"k":"li","x":"**Öncelik akidede:** Söylemlerinde öncelik aktivitede değil, akidededir. Davet ve cihat faaliyetlerinin, akidevi netlik sağlanmadan faydasız ve boş uğraşlar olduğunu savunurlar."},{"k":"li","x":"**Konu odakları:** Daha çok bid'atlar, namaz, hac, nikah, peçe, sakal, kabir gibi konular üzerine yazar ve konuşurlar."},{"k":"li","x":"**Cihat anlayışı:** Filistin, Keşmir, Çeçenistan gibi sıcak çatışma alanlarındaki mücadelelere, **meşru bir liderin izni ve emriyle yürütülmediği gerekçesiyle soğuk dururlar.** Ümmetin silahlı cihada henüz hazır olmadığını, bu yüzden şirki terk edip tevhide sarılmaya davet etmenin ve İslam aleminin Selef akidesi üzerinde buluşmasını sağlamanın öncelikli olduğunu belirtirler."},{"k":"li","x":"**Diğer İslami cemaatlerle ilişkiler:** Diğer İslami cemaat ve hareketlerle iş birliğine sıcak bakmazlar. İş birliği için onların \"Kur'an ve sünnet çizgisinde,\" yani doğru Selefilik üzere olmalarını şart koşarlar. Bu koşul yerine gelmemişse, \"hecr prensibi\" gereğince bu tür cemaatlerden uzak durulmasının vacip olduğunu ifade ederler."},{"k":"li","x":"**Eleştiriler:** Cihadi Selefiyye tarafından, Müslüman yöneticileri ve ulemayı yeterli kanıtlara dayanmadan küfürle suçlamamak, kanlı eylemlerle Müslüman ülkeleri savaş alanlarına çevirmemek gibi konularda eleştirilirler."},{"k":"li","x":"**Kurumsallaşma:** Vehhabi ulemanın temsil kabiliyeti tümüyle resmi dini kurumlar bünyesine alınmıştır. Seküler kanunlaştırma faaliyetleri, Batılı devletlerle ilişkiler ve eğitimde modernleşme hamleleri gibi konulara uyum sağlamışlardır."}]},{"h":"Siyasi Selefilik","b":[{"k":"p","x":"Siyasi Selefilik, 2005 sonrası dönemde, özellikle Arap Baharı süreçleriyle birlikte ortaya çıkan bir duruştur. **Cihadi Selefiyye bünyesinde, \"cihadın\" yasal ortamlarda sivil siyasetin çeşitli vasıtalarıyla mı yoksa illegal ya da militer yöntemlerle mi yürütüleceği hususunda ilkesel bir ayrışma** olarak belirginleşmiştir."},{"k":"h","x":"Önemli Özellikleri"},{"k":"li","x":"**Sivil siyasete katılım:** Siyasi parti şeklinde örgütlenme ve serbest seçimlerde yer alma eğilimi göstermişlerdir."},{"k":"li","x":"**Tavizler:** Kadınları ve gayrimüslimleri üye veya aday kaydetme, İran ve İsrail ile ilişkilerde ılımlı tutum sergileme, liberal, milliyetçi ve laik partilerle iş birliği yapma gibi konularda **muasır Selefiyye'nin bazı tabularına dokunacak kadar cesur davranmışlardır.** Bu tavizlerin, din adına elde edilecek menfaatlerin, gelmesi muhtemel zararın üzerinde olduğu hükmüne dayandığı belirtilmiştir."},{"k":"li","x":"**Örnekler:** Mısır'da el-Vatan gibi partiler, Yemen'de Hizbü'r-Reşid, Tunus'ta Cebhetü'l- Islah, Libya'da el-Ümmetü'l-Vasat ve el-Vatan gibi Selefi partiler siyasi Selefiliğin örnekleridir. Bu partiler, İhvan-ı Müslimin çizgisindeki siyasi oluşumların alternatifleri ve rakipleri olarak boy göstermektedirler."},{"k":"li","x":"**Köken:** Siyaseti ilk defa yüreklendiren kişi olarak Kuveyt'te 1981 yılında iki Selefi milletvekilini meclise seçtirmeyi başaran sahve çevreleri gösterilir."}]},{"h":"Cihadi Selefilik","b":[{"k":"p","x":"Cihadi Selefilik, Selefi düşüncenin radikal ve savaşçı bir yapıya dönüşmüş halidir. **Vehhabilik ile çağdaş siyasal İslamcılığın bir sentezi** olarak da görülebilir."},{"k":"h","x":"Önemli Özellikleri"},{"k":"li","x":"**Öncelik aktivitede ve cihadda:** Onlar için hayat iman ve cihattan ibarettir. Cihat ertelenemez bir ödevdir. Müminlerin meşru bir siyasi liderliği olmadığı bir zamanda, Müslüman cemaatlerin kendi aralarından seçtikleri bir liderin emrinde cihat etmesi gerektiğini savunurlar."},{"k":"li","x":"**Konu odakları:** Daha çok hakimiyyet ve devlet, Yahudiler, Haçlılar, Amerika ve Siyonist komplolar, siyasi mücadeleler, cihadlarda yaşanan mucizeler, şehadet ve şehitler hakkında yazar ve konuşurlar."},{"k":"li","x":"**Diğer İslami gruplarla iş birliği:** Emperyalist kafir güçlere karşı güçlü bir saf oluşturabilmek için Selefi olmayan İslami kesimlerle zorunlu iş birliğine gidilebileceğini savunurlar. İlkesel farklılıkların daha sonra ele alınmak üzere gündemden düşürülebileceğini belirtirler."},{"k":"li","x":"**İbn Teymiyye'nin etkisi:** İbn Teymiyye'nin Moğol işgaline karşı verdiği cihat fetvaları, günümüzdeki gayrimeşru rejimlere karşı silahlı mücadele yürüten Selefi örgütler için bir ilham kaynağı olmuştur. Ayrıca, İbn Teymiyye'nin Nusayrilik ve Dürzilik gibi mezheplere karşı verdiği sert fetvalar da şiddet yanlısı örgütler için meşruiyet kaynağı teşkil etmiştir."},{"k":"li","x":"**Eleştiriler:** Cihadi alimlerin önemli bir bölümü tarafından Üsame bin Ladin ve arkadaşlarının eleştirilmesinin temel nedenleri şunlardır: **Örgütün Müslüman yöneticileri ve ulemayı geçerli kanıtlara dayanmadan küfürle suçlaması,** kanlı eylemlerle Müslüman ülkeleri savaş arenalarına çevirmesi."}]},{"h":"el-Kaide","b":[{"k":"p","x":"el-Kaide, Arapçada \"üs\" anlamına gelen ve **1988 yılında Afgan Cihadı'nın sona ermesiyle bir teşkilat olarak kurulan** bir yapıdır. Teşkilatın kuruluşunda Dr. Abdullah Azzam'ın ismi sıklıkla zikredilir. El-Kaide, özellikle Usame bin Ladin liderliğindeki yapılanmasıyla tanınır ve **Afganistan cihadı konusunda Suudi Arabistanlı selefi düşünceye sahip Üsame bin Ladin ile anlaşan talebelerin desteğini almıştır.** Bu dönemde Afganistan, sadece Afganlıların savaştığı bir alan olmaktan çıkarak, selefi düşünceye mensup uluslararası radikal ve savaşçı (cihadi, cihadist) grupların talimgahı haline gelmiştir."},{"k":"h","x":"Ana İdeoloji ve Yaklaşım"},{"k":"li","x":"El-Kaide, Amerikan işgaline ve Batı karşıtı bir \"küresel cihat\" gerekçesi üzerine oluşmuştur."},{"k":"li","x":"Taliban'ın 1996'da kurduğu Afganistan İslam Emirliği'nde güçlü bir korunak bulan El- Kaide, Mısır kaynaklı tedhişçi ve dışlamacı ideolojinin de etkisiyle \"küresel cihat\" fikrine yönelmiştir."},{"k":"li","x":"Cihadi Selefiliği, **Vehhabilik ile çağdaş siyasal İslamcılığın bir sentezi** olarak görülebilir."},{"k":"li","x":"Söylemlerinde öncelik aktivitede değil akidededir; davet ve cihat faaliyetleri, akidevi netlik sağlanmadan faydasız ve boş uğraşlardır."},{"k":"li","x":"Emperyalist kafir güçlere karşı kuvvetli bir saf oluşturabilmek için Selefi olmayan İslami kesimlerle zorunlu iş birliğine gidilebileceğini savunmuşlardır. Nitekim El- Kaide'nin Hanefi ve sufi orijinli bir yapılanma olan Taliban ile iş birliği bu tür bir değerlendirmenin ürünüdür."},{"k":"li","x":"El-Kaide'nin müftülerinden sayılan Şeyh Hamud ibn 'Ukla (ö. 2002), **masumu suçludan ayırt etmeyen toplu imha silahlarının kullanımına cevaz vermekteydi.** Ayrıca, kafirlerin canlı kalkan olarak kullanılabileceğine dair fetvalar da mevcuttu. Bu, dini içerisindeki bazı araçların şiddet normlarının üretimi için seferber edildiğini gösterir."},{"k":"li","x":"DEAŞ'ın dayanak aldığı rivayete göre A‘mâk veya Dâbık bölgelerinde Müslümanlarla Hristiyanlar arasında büyük bir savaş yaşanmadan kıyamet kopmayacaktır. El- Kaide'nin de bu inanç ve eğilimde olduğu zaten bilinmektedir."},{"k":"h","x":"Faaliyetleri ve Etkileri"},{"k":"li","x":"El-Kaide, **kanlı eylemler düzenleyerek halkı Müslüman olan ülkeleri savaş arenasına dönüştürmesi** ve eylemlerinde İslam savaş hukukuna aykırı biçimde **masum sivilleri hedef alması** gibi sebeplerle tenkit edilmiş ve diğer cihadi gruplardan ayrılmıştır. Örneğin, **11 Eylül 2001 tarihinde Amerika Birleşik Devletleri'nde bazı hedeflere saldırması** ve bunun üzerine Amerika'nın Afganistan ve Irak'ı işgal etmesi, küresel etkileri olan bir dönüm noktası olmuştur."},{"k":"li","x":"Şiddet ve terör, El-Kaide gibi örgütlerde grubun psikolojik gerilemesiyle ilişkilendirilmiştir. Grup, üyelerine uygulanan şiddetin, kendilerine uygulanan şiddetten daha hafif kaldığı mesajını verebilir."},{"k":"li","x":"El-Kaide liderliği, Afganistan'daki iç savaş sırasında dışarı çıkma yollarını aramış ancak başarısız olmuştur."},{"k":"li","x":"2011'den itibaren Yemen'de Zeydi isyancılar olan Hûsilere karşı da cihat ilan etmiş ve intihar saldırıları düzenlemiştir."},{"k":"li","x":"El-Kaide'nin meşhur yayın organlarından birinin adı olan **\"Dabık\",** Yavuz Sultan Selim'in Memluk sultanı Kansu Gavri'yi yendiği savaşın yapıldığı Mercidabık (24 Ağustos 1516) şehrinin adıdır. Bu durum, bölgedeki kanlı Selefi örgütlerin tarihsel olayları referans almasına bir örnektir."},{"k":"h","x":"İlişkileri ve Eleştiriler"},{"k":"li","x":"El-Kaide'nin askeri gücünün önemli bir kısmı yabancı savaşçılardan oluşmuştur; örneğin, Taliban'ın Kuzey İttifakı güçlerine karşı girdiği savaşlarda Taliban birliklerinin üçte birini El-Kaide'ye bağlı yabancı savaşçılar teşkil etmekteydi."},{"k":"li","x":"Usame bin Ladin ve arkadaşlarının Taliban liderliğinin karar alma mekanizmasında gittikçe artan bir söz sahibi olmaya başlaması, Taliban'ın hedeflerini Afganistan sınırlarının dışına, özellikle Orta Asya ülkelerine taşımıştır."},{"k":"li","x":"Usame bin Ladin’le Cihadi Selefilik içerisinde yaşanan aşırılığa ve teröre doğru savrulma, Cihadi alimlerin önemli bir bölümü tarafından tenkit edilmektedir. Bu eleştiriler üç ana noktada yoğunlaşmaktadır:"},{"k":"n","n":1,"x":"Örgütün Müslüman yöneticileri ve ulemayı geçerli kanıtlara dayanmadan küfürle suçlaması."},{"k":"n","n":2,"x":"El-Kaide'nin düzenlediği kanlı eylemlerle halkı Müslüman ülkeleri savaş arenalarına çevirmesi."},{"k":"n","n":3,"x":"Eylemlerinde İslam savaş hukukuna aykırı biçimde masum sivilleri hedef alması."},{"k":"li","x":"Irak-Şam İslam Devleti (DEAŞ) örgütlenmesi, **tekfirci tutumunda haddi aştığı ve savaşını gayrimüslim ve zalimlere değil de İslamcı yapılara ve Müslüman kitlelere karşı yürüttüğü gerekçesiyle** başta El-Kaide olmak üzere Cihadi Selefi oluşumlar tarafından **Haricilik ile itham edilmektedir.**"},{"k":"li","x":"El-Kaide merkezi ile Irak'taki kolu (DEAŞ'ın öncülü) arasında yaşanan sorunlar, 2006 yılında Zerkavi'nin Irak İslam Devleti'ni kurduğunu ilan etmesiyle daha karmaşık hale gelmiştir. Usame bin Ladin, küçük bir hakimiyet alanı elde edince hızla İslami emirliğe dönüştürme ve şer'i hadleri uygulama gibi adımları doğru bir strateji olarak görmemiştir."},{"k":"li","x":"Irak'taki El-Kaide'nin 2005'teki genel seçimlere katılımı, ABD askeri varlığına karşı silahlı mücadele yürütmekte olan El-Kaide'nin muhalefetiyle karşılaşmıştır."},{"k":"li","x":"Günümüzde Selefi hareketlerin kendi içinde \"Cihadi Selefilik\" (Suudi hükümetini eleştiren ve cihadı öne çıkaran) ile \"Suudi Selefilik\" (Suudi hükümetine bağlılığını sürdüren) olarak ayrıştığı belirtilmektedir."},{"k":"h","x":"DEAŞ (Irak-Şam İslam Devleti- IŞİD)"},{"k":"p","x":"DEAŞ, kaynaklarda **Selefilikten Hariciliğe geçişin bir numunesi** olarak değerlendirilmektedir. Muhammed b. Abdülvehhâb'ın fikirleri etrafında şekillenen Vehhabilik hareketinden esas etkilendiği belirtilmektedir."},{"k":"h","x":"Önemli Özellikleri"},{"k":"li","x":"**Lafızcı-Selefi çizgi ve çarpıtmalar:** DEAŞ ve benzeri gruplar, kendilerini **Selef-i Sâlihîn'e (ilk nesillere) nispet ederek meşruiyet arayışına girerler.** Lafızcı eğilimleri seçerler. Ancak bu lafızcılık, sistematik ve tutarlı bir yaklaşım olmaktan uzaktır; tamamen **keyfi ve seçmeci bir nitelik taşır** ve bir metodolojiye sahip değildir."},{"k":"li","x":"**Şirk bahanesiyle tarihi mirası tahrip:** Diğer Selefi gruplarda olduğu gibi, özellikle **türbeleri ve mezarları ziyaret etme ile velileri vesile kılarak yapılan duaları şirk olarak değerlendirir.** Bu, İslam kültür mirası açısından telafisi imkânsız kayıplara yol açan **geniş çaplı kabir ve türbe yıkımlarına** neden olmuştur. Peygamber mezarı olarak kabul edilen binaların yıkılması, kilise ve havralara dokunulmaması gibi selefin tutumlarına aykırı davranmışlardır."},{"k":"li","x":"**Tekfir ve ötekileştirme:** DEAŞ'ın diğer Müslümanları dışlayıcı ve ötekileştirici tavrının ardında, benimsedikleri Selefi-Vehhabi çizginin iman anlayışını kendi amaçları doğrultusunda yorumlamaları yatar. İmanı \"kalp ile tasdik, dil ile ikrar ve amellerin ifası\" olarak tanımlar ve bunlardan birinin eksik olmasının imanı etkilediğini savunurlar. Geleneksel Sünni iman tanımına (imanın asıl olanın tasdik olduğu, amellerin mahiyetine dahil olmadığı) karşıt bir tutum sergilerler. **\"İrcâ\" kavramını (ameli sonraya bırakma) İslam inancını tehdit eden en tehlikeli bid'at olarak niteleyerek Müslümanları tekfir eder ve infaz gerekçesi olarak kullanırlar.**"},{"k":"li","x":"**Şiddet ve işkence:** Dehşet ve korku salma amaçlı işkence yöntemlerini bir savaş ve caydırma aracı olarak meşru görür ve yaygın olarak kullanırlar. Ürdünlü pilotun yakılarak infazı gibi eylemlerini, **kısas yoluyla ve maslahata dayanarak** yaptıklarını söylemişlerdir. Onların \"maslahat\" dedikleri şey, ilgili eylemin örgütün yerleştirmek istediği imaja yapacağı katkıdır. Toplu öldürme ve soykırım uygulamaları İslam'ın asla razı olmadığı eylemlerdir."},{"k":"li","x":"**Kadınların konumu:** Kontrol altına aldıkları yerlerde kadınları evlere hapsetmiş, ilim tahsili için dahi dışarı çıkma hakkı vermemiş, çalışma hayatından tamamen soyutlamıştır."},{"k":"li","x":"**Yezidilere yönelik zulüm:** Yezidilerin yüzlercesini öldürmüş, geri kalanlarını vatanlarını bırakıp kaçmaya zorlamışlardır. Esir edilen Yezidi kadınlarını köleleştirip cariye muamelesine tabi tutmuş, esir pazarlarında satmışlardır ki bu, **şer'i dayanağı olmayan bir tasarruftur.**"},{"k":"li","x":"**İslam mirasından sapma:** İslam medeniyetinin doğup geliştiği kadim İslam şehirlerindeki Hz. Peygamber, Sahabe ve Selef-i Sâlihîn'in hatıralarını taşıyan birçok eseri ortadan kaldırmışlardır. Bu durum, lafızcı-Selefi zihniyetin tarih ve kültür bilinci noktasında ne kadar tahripkâr olduğunu göstermektedir."},{"k":"li","x":"**Ulema sınıfının yokluğu:** DEAŞ gibi yapılanmalar, ulema sınıfı olmayan ve bu haliyle bütünüyle modern bir karakter taşıyan yapılanmalardır. Köklü fıkıh birikimi olmayan kişilerin fetva makamlarında yer aldığı belirtilmiştir."},{"k":"li","x":"**Kaynak kullanımında seçmecilik:** Kendi meşruiyetleri için rivayetlerden destek ararken, muhaliflerinin de DEAŞ'ı dışlamak için rivayetlere başvurduğu görülür. **Sistematik tutarlılık aranmadan her türlü referansa atıf yapılabilmektedir.** Örneğin, hilafet konusunu temellendirmek için iman anlayışlarını ortaya koyarken, \"ircâ bid'ati\" olarak niteledikleri Eş'ari çizgiye mensup Cüveynî ve Gazzâlî gibi müelliflere atıf yapmaktan çekinmezler. İntihar saldırılarını meşrulaştırmak için \"şeriat naslarının zahirine donup kalınmaması gerektiği\" gibi gerekçeler ileri sürmüşlerdir."},{"k":"li","x":"**Daru'l-İslam- Daru'l-Harb ayrımı:** İslam Devleti adı altında Müslümanların yegâne meşru temsilcisi olduğunu iddia ederek, bu karşıtlığı kullanarak bütün Müslümanları bölmeye çalışırlar. Günümüz uluslararası düzenini klasik fıkıhtaki bu ayrımla değerlendirmeyi sağlıklı bulmayan fıkıhçılar, kavramların güncellenmesi gerektiğini ifade ederler."},{"k":"li","x":"**Cihat anlayışında çarpıtma:** Sadece örgüte muhalif olan tüm grupları, Müslüman olsun olmasın \"düşman\" kategorisine sokarak \"kıtâl cihadı\"nı (savaş cihadı) öncelemektedirler."},{"k":"li","x":"**Psikolojik yönlendirme:** Kendilerini \"gerçek\" ilahi metin ve kurallara sahip, kötülüğün kurbanı ama aynı zamanda onu tersine çevirmeye muktedir tek taraf olduğuna inanan marjinal dini gruplar arasında yer alırlar. Mensuplarına \"yalnız\" (garib) olma bilinci aşılayarak, dışarıdaki kimsenin bilgisine ihtiyaç duymadıklarını düşündürürler. Bu durum, dini bilginin ideolojik bir bakış açısıyla çarpıtılarak mensupları için birer dogma haline gelmesine yol açar."},{"k":"li","x":"**Muhalefet:** Geleneksel İslam mezhepleri olan Eş'ârî ve Mâtürîdîler ile Ehl-i Sünnet çizgisindeki tasavvufî eğilimlere karşıdırlar."},{"k":"p","x":"Bu akımlar, Selefilik düşüncesinin tarihsel serüveninde ortaya çıkan farklı yönelişleri ve zaman zaman ulaştığı radikal uç noktaları göstermektedir."}]},{"h":"Gelenekçilik ve Selefiyye'nin Konumu","b":[{"k":"p","x":"Çağdaş İslami akımlar sınıflandırılırken **gelenekçilik** ayrı bir ana grup olarak ele alınır. Gelenek, kuşaktan kuşağa saygıyla aktarılan bilgi, âdet, davranış ve kültürel kalıplardır. Gelenekçi yapılar mensup oldukları geleneği sahih-sahih değil ayrımı yapmadan bütünüyle kabul eder, silsile ve icazetle meşruiyetlerini Hz. Peygamber'e bağlar ve hiyerarşik bir düzene sahiptir. Gelenekçilik üç damarda incelenir: **Selefî gelenekçilik**, **medrese gelenekçiliği** ve **tarikat gelenekçiliği**."},{"k":"p","x":"Ehl-i Sünnet'in iki ana damarından biri olan **Ehl-i Hadis**, sahabe ve tâbiînin (selef-i sâlihîn) anlayışını esas aldığı için Selefiyye diye de anılır. Haberî sıfatları te'vil etmekten kaçınmaları, bazı Selefî âlimleri teşbih ve tecsîme düşmekle eleştirilir hâle getirmiştir. **İbn Teymiyye**'nin tevhid anlayışı ve Nusayrîlik, Dürzîlik gibi gruplara karşı verdiği sert fetvalar, günümüz Selefî hareketleri için önemli bir ilham kaynağıdır."},{"k":"h","x":"Vehhâbîliğin düşünce esasları (kısaca)"},{"k":"li","x":"İman tasdik, ikrar ve amelden oluşur; artar ve eksilir."},{"k":"li","x":"Haberî sıfatlar te'vil edilmez."},{"k":"li","x":"Tevhid **rubûbiyyet**, **ulûhiyyet** ve **esmâ-sıfât** tevhidi olarak üçe ayrılır; türbe, şefaat ve tevessül uygulamaları şirk ve bid'at kapsamında görülür."},{"k":"li","x":"Emr-i bi'l-ma'rûf, âlim, adil ve güç sahibi bir yöneticiye (imama) biat şartına bağlanır."},{"k":"p","x":"Vehhâbîler 1803-1806'da Mekke ve Medine'yi alıp Bakî' kabristanı başta olmak üzere birçok türbeyi yıktı. Osmanlı'ya bağlı Mısır valisi Mehmed Ali Paşa'nın ordusu 1812-1813'te Hicaz'ı geri aldı, 1818'de Vehhâbîlerin merkezi **Dir'iyye**'yi ele geçirdi."}]},{"h":"Günümüz Selefiyyesinde Ayrışma","b":[{"k":"p","x":"Suudi devletinin kurumsallaşmış dinî ideolojisi olan **Suudi (müesses) Selefiyye**, Medine İslam Üniversitesi gibi kurumlarda yetişen yabancı öğrenciler ve uluslararası teşkilatlar aracılığıyla Fas'tan Endonezya'ya kadar yayıldı. Zamanla bu gövdeden farklı kollar ayrıldı:"},{"k":"tbl","r":[["Kol","Yöneticiye bakışı","Yöntemi","Örnekler"],["Suudi Selefiyye","Meşru yöneticiye itaat; isyan ve muhalefet fitnedir","Ders, fetva, kurumsal davet","Suudi resmî ulema"],["Cihadî Selefiyye","Şeriatla hükmetmeyen yöneticiler kâfirdir","Silahlı mücadele, küresel cihat","el-Kâide, IŞİD"],["Siyasi Selefiyye","Sistem içinde değişim","Parti, seçim, meclis","Kuveyt, Mısır'daki Selefî partiler"]]},{"k":"h","x":"Kırılma noktaları"},{"k":"li","x":"**Cüheymân el-Uteybî** ve \"İhvan\" adını kullanan cemaati 1979'da Kâbe'yi (Harem-i Şerîf) işgal etti; olay Suudi Selefiyyesi içindeki ilk büyük kırılma oldu."},{"k":"li","x":"**Sahve (uyanış) hareketi:** 1990-1991 Körfez Savaşı sırasında Amerikan askerlerinin ülkeye getirilmesine karşı çıkan Sefer el-Havâlî ve Selmân el-Avde gibi âlimler, İhvân düşüncesiyle Selefîliği buluşturan siyasi bir muhalefet geliştirdi."},{"k":"li","x":"Cihadî Selefîler kendilerini Ahmed b. Hanbel, İbn Teymiyye ve İbn Abdülvehhâb'ın mücadeleci çizgisinin varisi olarak görür."}]},{"h":"el-Kâide ve Küresel Cihat","b":[{"k":"p","x":"Afgan cihadında savaş tecrübesi kazanan ve ülkelerine dönemeyen Arap gönüllüler, el-Kâide'nin insan kaynağını oluşturdu. 1998'deki Kenya ve Tanzanya büyükelçilik saldırıları küresel cihat kampanyasının ilk büyük eylemleri, **11 Eylül 2001** New York saldırısı ise örgütün üstlendiği en büyük eylem oldu. ABD'nin Afganistan'ı işgali ve Tâlibân yönetiminin yıkılmasıyla örgüt büyük darbe yedi."},{"k":"h","x":"Cihadî ihtilaflar"},{"k":"p","x":"Cihadî gruplar kendi aralarında şu sorularda ayrışır:"},{"k":"li","x":"Önce \"yakın düşman\" (yerel rejimler) mi, yoksa \"uzak düşman\" (ABD ve Batı) mı?"},{"k":"li","x":"Yeterli güç oluşmadan bir bölgede devlet veya emirlik ilan etmek doğru mu?"},{"k":"li","x":"Bağlayıcı otorite saygın ulemanın fetvaları mı, yoksa cemaat liderliğinin kendi fıkhı mı?"},{"k":"li","x":"Siyasi partilere ve meclise katılmak caiz mi?"}]},{"h":"Selefîlikten Hâricîliğe: IŞİD","b":[{"k":"p","x":"Irak'ta 2003 sonrası Ebû Mus'ab ez-Zerkāvî'nin örgütü, Şiîlere ve diğer Sünnî gruplara yönelik şiddeti nedeniyle el-Kâide lideri **Zevâhirî** tarafından bile eleştirildi. Örgüt **Irak İslam Devleti** adını aldı; Suriyeli üyelerin kurduğu **Nusra Cephesi** ile yolları ayrıldı. **Ebû Bekir el-Bağdâdî**, 2014 Ramazan'ında Musul Ulu Camii'nde okuduğu hutbede kendisini \"Müslümanların halifesi\" ilan etti ve bütün İslami grupları biate çağırdı. Muhaliflerini toptan tekfir etmesi ve şiddeti nedeniyle IŞİD, Selefîlikten Hâricîliğe geçişin bir örneği olarak değerlendirilir."}]},{"h":"Siyasi Selefîlik","b":[{"k":"p","x":"Suudi itaatçiliği ile cihadî şiddet arasında üçüncü bir yol olarak siyasete katılımı benimseyen Selefîlerdir. Üç kaynaktan beslenir:"},{"k":"li","x":"**Sahve kökenli siyasallaşma:** Kuveyt'te Abdurrahman Abdülhâlik'in etkisiyle Selefîler 1981'de meclise milletvekili soktu."},{"k":"li","x":"**Cihadî kökenli siyasallaşma:** Mısır'da silahlı mücadeleyi bırakan gruplar şiddet ile teslimiyet arasında üçüncü bir yol arayışına girdi."},{"k":"li","x":"**Suudi kökenli siyasallaşma:** Arap Baharı sürecinde Mısır'da Nur Partisi gibi Selefî partiler kuruldu; bu partilerin ulemaya göre, ödünler asgari düzeyde tutulduğu sürece din adına elde edilecek fayda zarardan büyüktür."},{"k":"p","x":"Suudi Selefiyyesi, kendisinden ayrılan grupları klasik makâlât kitaplarındaki bid'at fırkaları gibi adlandırır (Kutbiyye, Sürûriyye gibi). Selefî kimlik, namazda âmini yüksek sesle söyleme, elleri göğüs hizasında bağlama gibi uygulamalar ve dış görünüşle de kendini belli eder."}]},{"h":"Kavramlar ve Hızlı Tekrar","b":[{"k":"d","t":"Selef-i sâlihîn","x":"Sahabe, tâbiîn ve tebe-i tâbiînden oluşan ilk üç nesil."},{"k":"d","t":"Vehhâbîlik","x":"Muhammed b. Abdülvehhâb'ın (d. 1115/1703) tevhid davetine dayanan ve Suud devletiyle kurumsallaşan Selefî hareket."},{"k":"d","t":"Ulûhiyyet tevhidi","x":"İbadetin yalnız Allah'a yapılması; Vehhâbîler şefaat ve tevessülü bu tevhide aykırı görür."},{"k":"d","t":"Cihadî Selefîlik","x":"Şeriatla hükmetmeyen yöneticileri tekfir edip silahlı mücadeleyi savunan Selefî kol."},{"k":"d","t":"Sahve","x":"1990'larda Suudi Arabistan'da Selefîlik ile siyasi muhalefeti buluşturan 'uyanış' hareketi."}]}],"ht":[{"s":21,"x":"Gelenekçilik üç damardır: Selefî, medrese ve tarikat gelenekçiliği."},{"s":21,"x":"Günümüz Selefîliği: Suudi (itaatçi), Cihadî (el-Kâide, IŞİD) ve Siyasi Selefîlik; kırılma noktaları 1979 Harem baskını (Cüheymân) ve 1990'lar Sahve hareketi."},{"s":21,"x":"IŞİD lideri Ebû Bekir el-Bağdâdî 2014'te Musul'da hilafet ilan etti; toptan tekfir nedeniyle Hâricîliğe benzetilir."}],"oz":{"t":"Selefî Akımlar · Özet","intro":"Ünitenin özü: Selefiyye'nin doğuşu, Vehhâbîliğin oluşumu ve düşüncesi, günümüz Selefîliğinin Suudi, siyasi ve cihadî kollara ayrılması; el-Kâide ve IŞİD.","s":[{"h":"Selefiyye","b":[{"k":"li","x":"\"Selef-i sâlihîn\"in (sahabe, tâbiîn, tebe-i tâbiîn) anlayışını model alan, Ehl-i Sünnet'in **Ehl-i Hadis** damarıdır; öncüsü **Ahmed b. Hanbel**, en etkili sistemleştiricisi **İbn Teymiyye**'dir."},{"k":"li","x":"**Temel özellikleri:** sıfatlarda te'vili reddetme, iman-amel birlikteliği, Kur'an'ın mahluk olmadığı, akıl-nakil ilişkisinde naklin üstünlüğü, Kur'an ve sünneti eşit kaynak sayma, selefin görüşlerini otorite kabul etme."}]},{"h":"Vehhâbîlik","b":[{"k":"li","x":"**Muhammed b. Abdülvehhâb** (1115/1703'te Necd'de doğdu) Hanbelî ve İbn Teymiyye çizgisinde bir tevhid daveti başlattı."},{"k":"li","x":"**Suud ailesiyle ittifak** (Dir'iyye): Birinci Suud Devleti (Mekke-Medine'nin alınması, türbelerin yıkılması; 1818'de Mehmed Ali Paşa'nın Dir'iyye'yi almasıyla sona erdi), İkinci Suud Devleti, Abdülazîz b. Suûd ile **Suudi Arabistan Krallığı**."},{"k":"li","x":"**İhvan teşkilatı:** Krallığın kuruluşunda kullanılan bedevî savaşçı yerleşimleri; sonradan krala isyan etti."},{"k":"li","x":"**Düşünce:** tevhid ve şirk (rubûbiyyet, ulûhiyyet, esmâ-sıfât tevhidi; büyük, küçük, gizli şirk), şefaat ve tevessülün reddi, iman tasdik-ikrar-amel bütünüdür, bid'atla mücadele, emr-i bi'l-ma'rûfun güç sahibi imama bağlanması."}]},{"h":"Günümüz Selefîliği","b":[{"k":"tbl","r":[["Kol","Tutumu","Örnek"],["İlmî (Suudi, müesses) Selefîlik","Yöneticiye itaat, siyasi muhalefeti fitne sayma","Suudi resmî ulema"],["Siyasi Selefîlik","Parti ve seçimle sistem içinde değişim","Kuveyt, Mısır'da Nur Partisi"],["Cihadî Selefîlik","Şeriatla hükmetmeyen yöneticiyi tekfir, silahlı mücadele","el-Kâide, IŞİD"]]},{"k":"li","x":"**Kırılmalar:** 1979 Cüheymân el-Uteybî'nin Harem baskını; 1990'larda Sahve hareketi."},{"k":"li","x":"**el-Kâide:** Afgan cihadından doğdu; Üsâme bin Lâdin; 11 Eylül 2001 saldırısı; Tâlibân'ın koruması."},{"k":"li","x":"**IŞİD (DEAŞ):** Zerkāvî'nin örgütünden Irak İslam Devleti'ne; 2014'te Ebû Bekir el-Bağdâdî'nin Musul'da hilafet ilanı. Muhalifleri toptan tekfiri, geleneksel ulema ve mezhepleri dışlaması, seçmeci kaynak kullanımı ve \"darü'l-İslam-darü'l-harp\" ayrımını çarpıtmasıyla Hâricîliğe benzetilir."}]}]}},{"t":"Sosyopolitik Dinî Akımlar","intro":"Siyasal ıslahatçılık; İhvân-ı Müslimîn, Cemaat-i İslâmî, Ensârullah (Husiler), Lübnan Hizbullahı, Tebliğ Cemaati ve Tâlibân.","s":[{"h":"Siyasal Islahatçılık","b":[{"k":"li","x":"**Tavandan tabana doğru** bir ıslahat programı öngörür. Devlet nizamını ele geçirmeyi veya etkili bir pozisyon elde etmeyi amaçlar."},{"k":"li","x":"**Sendikalar, partiler** gibi politik araçları veya **direniş örgütleri** gibi militer yapılanmaları kullanır. \"Dini siyasete alet etme\" suçlamasıyla karşılaşırlar."}]},{"h":"İhvân-ı Müslimîn","b":[{"k":"h","x":"Kuruluş ve Yayılım"},{"k":"li","x":"Mısır’da kurulan ve bazı Ortadoğu İslam ülkelerinde de faaliyet gösteren dinî- siyasî bir teşkilât ve harekettir."},{"k":"li","x":"**Mart 1928’de İsmailiye’de Hasan el-Bennâ tarafından Cem‘iyyetü’l- ihvâni’l-müslimîn adıyla kuruldu.** Hasan el-Benna, 1906 yılında Mahmudiye kasabasında doğmuş bir öğretmendi. Babası Ahmed el-Benna, hadis ilmiyle yoğun meşguliyeti olan bir saatçiydi ve Ahmed b. Hanbel’in Müsned’ini düzenleyen Fethü’r-Rabbânî adlı eserin sahibiydi."},{"k":"li","x":"1932’ye kadar Süveyş Kanalı bölgesindeki şehirlerde taraftar bularak şube
