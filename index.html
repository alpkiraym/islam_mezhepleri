ler açtı, 1932’de idare merkezi Kahire’ye taşındı. Daha sonra Suriye, Lübnan ve Filistin’e de temsilciler göndererek örgütlenmesini sürdürdü."},{"k":"li","x":"1948’de şube sayısı Mısır’da 2000’e, Sudan’da elliye ulaştı; ayrıca Filistin, Doğu Ürdün, Suriye, Pakistan ve İran’da da şubeler açıldı."},{"k":"h","x":"İdeoloji ve Yaklaşım"},{"k":"li","x":"**Hasan el-Bennâ, İhvân-ı Müslimîn’i Sünni, Selefi, Sufi, siyasi ve sportif bir cemaat, ilmî ve kültürel bir cemiyet, ekonomik bir şirket ve sosyal bir fikir sistemi olarak tanıtmaktadır.** Bu tarifte Selefilik ve Sufiliğin bir arada yer alması dikkat çekicidir."},{"k":"li","x":"Hasan el-Bennâ’nın Selefiliğinin, dini metinleri literalist biçimde yorumlayan Vehhabilik eğilimli Selefiyye gelenekçiliği ile bir ilişkisi bulunmamaktadır."},{"k":"li","x":"İslam’ı hem inanç hem ibadet hem din hem devlet olarak görür. Öğretilerinde **Kitap ve Sünnet’e ayrı bir vurgu yaparak İslam’ı sahâbenin, tâbiînin ve selef-i sâlihînin anladığı şekilde anladığını söyler.** İslam’ı asrın rengine değil, asrı İslam’ın rengine sokmak gerektiğini savunur."},{"k":"li","x":"Şeriatın hükümlerinin bütün zaman ve mekânlarda tatbik edilebilir olduğunu ve bunun hem dinî hem sosyal ve kültürel açıdan bir zorunluluk olduğunu vurgular. **İçtihad kapısının sürekli açık tutulması gerektiğini savunur.**"},{"k":"h","x":"Siyasi Faaliyetler ve Tutum"},{"k":"li","x":"**Parlamenter sistemi bazı şerhlerle kabul ettiğini açıklamış,** ancak ümmeti bölmekte olan particiliğin ve bütün siyasî partilerin kaldırılmasını savunmuştur. Ancak 1970'li yılların ortalarından itibaren çok partili sisteme geçen Mısır'da siyasi parti kurmaya çalışmış, buna izin verilmeyince de çeşitli partilerle ittifaklar yaparak seçimlere katılmıştır."},{"k":"li","x":"**Filistin meselesiyle yakından ilgilenmiş,** siyonizm tehdidine dikkat çekmiş ve Filistin’i kurtarmak için cihad çağrısı yapmıştır. 1948 Arap-İsrail Savaşı’nda teşkilât mensupları fiilen yer almışlardır."},{"k":"li","x":"**Emperyalizme karşı cihad etmenin her Müslümanın üzerine farz olduğunu belirtir.** Hasan el-Benna, silahlı devrime karşı çıkarken, örgütün üyelerinin Cemal Abdünnâsır rejimi tarafından işkencelere maruz bırakılmasından sonra cihad anlayışını daha geniş bir alana yaydığı ve fikirlerinde radikalleştiği görülür."},{"k":"li","x":"**Seyyid Kutub’un fikirleri** (toplumu Câhiliye sayma ve ona karşı cihat edilmesi gerektiği) her ne kadar İhvân-ı Müslimîn’in resmî görüşleri değilse de **1960’lı yıllardaki İhvân hareketini yönlendirdiği ve sonraları Mısır’da daha radikal örgütlerin ortaya çıkmasında rol oynadığı bir gerçektir.**"},{"k":"li","x":"Ancak İhvân-ı Müslimîn, **1970’li yıllardan sonra Hasan el-Bennâ’nın yolundan giderek rejimle uzlaşmacı bir tavır takınmış** ve herhangi bir tekfir girişiminde bulunmadığı gibi her türlü aşırı davranıştan ve yöneticilere karşı cihat fikrinden uzak olduğunu ilân etmiştir. Ömer Tilimsânî liderliğindeki İhvan, şiddeti yöntem olarak kullanan İslami grupların tüm eylem ve düşüncelerini kınamıştır."},{"k":"h","x":"Uluslararası Etki"},{"k":"li","x":"Suriye, Ürdün, Sudan, Kuveyt, Yemen, Pakistan, Kuzey ve Orta Afrika ile Avrupa’nın bazı ülkelerinde şube açtığı gibi buralarda farklı isimler altında çeşitli örgütlerin ortaya çıkmasında da büyük bir rol oynamıştır."},{"k":"li","x":"**Ürdün kolu, meşru bir örgüt olarak kabul edilmiş ve parlamentoda temsil edilmiştir.**"},{"k":"li","x":"**Sudan’da Hasan et-Türâbî liderliğinde önemli bir güç haline gelmiştir.**"},{"k":"li","x":"**Yemen’de Abdülmecid ez-Zindani figürüyle Islah Partisi’ni kurmuştur.**"},{"k":"li","x":"**Suudi Arabistan, 1970’lerden sonra Mısır, Suriye ve Irak’tan muhacir olan birçok İhvan mensubuna ev sahipliği yapmıştır.** Bu durum, Suudi Arabistan’ın çağdaş İslamcılıkla tanışmasına ve İhvan’ın siyasi düşüncelerinin bazı prensler ve Vehhabi alimler üzerinde etkili olmasına neden olmuştur."},{"k":"li","x":"**Cezayir’de Fransız sömürgeciliğine karşı savaşta bağımsızlık mücadelesini desteklemiştir.**"},{"k":"li","x":"**Fas’ta Adalet ve Gelişim Partisi, İhvan-ı Müslimîn fikriyatının temsilcisi olarak bilinmektedir.**"},{"k":"li","x":"**Afganistan’da Sovyet işgaline karşı Cihad’da Cemiyet-i İslami ve Hizb-i İslami gibi İhvan tipi örgütlenmeler olmuştur.**"},{"k":"li","x":"ABD’deki Müslüman Öğrenciler Birliği (MSA), İhvan mensubu Araplar ile Cemaat-i İslami mensubu Hint Müslümanlarının öncülüğünde kurulmuştur."}]},{"h":"Cemaat-i İslâmî","b":[{"k":"h","x":"Kuruluş ve Önderlik"},{"k":"li","x":"**İngiliz Hindistanı’nda İslami uyanışı başlatmak isteyen Ebü’l-A’la Mevdudi’nin (1903-1979) çağrısı üzerine 1941’de Lahor şehrinde yetmiş beş delege tarafından kuruldu.** Mevdudi, Türkiye’de Seyyid Kutub ile en çok tanınan siyasal İslamcı şahsiyetlerdendir."},{"k":"h","x":"İdeoloji ve Amaçlar"},{"k":"li","x":"**İslam dinini insan hayatının dünyevi ve uhrevi yanlarını tüm yönleriyle kuşatan külli bir sistem olarak görür.**"},{"k":"li","x":"Mevdudi’ye göre şehadet kelimesini söyleyen bir insan, İslam’ın külli sistemini bütünüyle kabul etmiş demektir. \"İlah\", \"rab\", \"ibadet\" ve \"din\" kavramlarını hakiki manalarıyla bilip idrak etmeyenler, Allah’tan başkasına ibadet etmekte ve O’nun dininden başka bir dine girmiş bulunmaktadır."},{"k":"li","x":"Demokrasi, anayasal düzen ve ekonomik sistem gibi modern Batılı değerleri İslam’a uyarlayarak bir devlet, hukuk ve ekonomi projesi ortaya koyar."},{"k":"li","x":"Keramet, keşif ve ilham sahibi kutsal ve karizmatik lider fikrine karşı olmuş, hurafeci olmayan, bilakis insanın manevi yönünü dirilten ve nefisleri tezkiye eden bir tasavvuf anlayışını teşvik etmiştir."},{"k":"h","x":"Siyasi Tutum ve Faaliyetler"},{"k":"li","x":"1972’de liderliği bırakmıştır. Zülfikar Ali Butto’nun sosyalist ideolojisine şiddetle muhalefet etmiş, ancak **askeri darbeyle iktidara gelen General Ziyaülhak’ı desteklemiştir.**"},{"k":"li","x":"**Afgan Cihadı’nda (1979-1989) mücahit örgütlerine doğrudan destek vermiştir.** Keşmir Müslümanlarının işgalci Hindistan yönetimine karşı mücadelesinde Hizbü’l-Mücahidin adlı mücahit bir grupla iş birliği yapmıştır. Ancak Pakistan’ı bir İslam toprağı saydığı için, bu ülkede silahlı mücadeleyi bizzat içinde yer almayı meşru görmemekteydi."},{"k":"li","x":"Sendikalar, meslek odaları, kadınlar, gençlik ve öğrenci yapılanmaları, sosyal yardımlar, okullar ve sağlık hizmetleri gibi birimleriyle toplumla sürekli iletişim halindedir."},{"k":"li","x":"Yasaklı bir organizasyon olmaması nedeniyle İhvan-ı Müslimîn’in yaşadığı zorlukları yaşamamıştır."},{"k":"h","x":"Diğer Akımlarla İlişki"},{"k":"li","x":"Hint alt kıtasında İhvan-ı Müslimîn’in muadili sayılmaktadır."},{"k":"li","x":"Seyyid Kutub’un fikirlerini etkilemiştir."}]},{"h":"Ensârullah (Husiler)","b":[{"k":"h","x":"Köken ve İdeoloji"},{"k":"li","x":"Yemen’de Zeydiyye mezhebine mensup bir harekettir."},{"k":"li","x":"**Hüseyin Hûsî’nin siyasi söyleminde İran İslam Devrimi’ne, devrimin önderlerine ve Lübnan’daki Hizbullah hareketine güçlü bir öykünme vardır.** Bu durum, mezhep değiştirip İsnaaşeriyye’ye geçtiği iddialarıyla izah edilse de esasen bu unsurların ABD ve siyonizm karşıtı sert tavırlarına olan bir takdir hissinden kaynaklandığı kesindir."},{"k":"li","x":"Toplantılar, anma merasimleri ve sokak gösterilerinde **“Allahu Ekber, kahrolsun Amerika, kahrolsun İsrail, lanet Yahudilere, zafer İslam’a” sloganı** sürekli olarak kullanılır ve bu slogan Hûsi hareketiyle özdeşleşmiştir."},{"k":"h","x":"Çatışmalar ve İlişkiler"},{"k":"li","x":"Hüseyin Hûsî ve arkadaşları 2004 Eylül’ünde Marran dağlarında sıkıştırılmış ve öldürülmüşlerdir."},{"k":"li","x":"**2009 yılında Suudi Arabistan’ın fiilen çatışmalara girmesi, Hûsi isyanını uluslararası bir sorun haline getirmiştir.**"},{"k":"li","x":"Hûsilerin İslamcı çizgisi, yöntemlerinde İran devrimcilerini ve Hizbullah’ı model almaları ve İran’dan maddi destek aldıkları iddiaları Suudileri rahatsız etmiştir."},{"k":"li","x":"2014’te Hûsi hareketinin başkent San’a’nın kontrolünü ele geçirmesiyle Yemen’deki Islah Partisi’nin (İhvan yanlıları) devlet üzerindeki gücü önemli ölçüde azalmıştır."}]},{"h":"Lübnan Hizbullahı","b":[{"k":"h","x":"Kuruluş ve Arka Plan"},{"k":"li","x":"**1979 İran İslam Devrimi’nin Lübnan’daki yegâne başarısı olarak kabul edilir.**"},{"k":"li","x":"**Lübnan Müslümanlarının yaklaşık yarısını teşkil eden Şii nüfusun yoğunlaştığı Güney Lübnan veya Cebel-i Amil, Hizbullah’ın doğum yeri ve kalesi olarak bilinmektedir.**"},{"k":"li","x":"İran devrim hükümetinin Lübnan’a gönderdiği **1500-2000 kadar Devrim Muhafızları (Sipah-ı Pasdaran) taburu olmasaydı, Hizbullah’ın doğuşu belki de gerçekleşmeyecekti.**"},{"k":"li","x":"**“Allah’ın grubu” anlamına gelen ismini Kur’an’daki bir ayetten alır.**"},{"k":"h","x":"Faaliyetler ve Stratejiler"},{"k":"li","x":"**İlk hedefi İsrail işgalini sona erdirmek olmuştur.** 1982’den 2000’e kadar 18 yıl boyunca İsrail’le fiili mücadele eden en etkili Lübnanlı gruptu."},{"k":"li","x":"Lübnan İç Savaşı’nın 1990’da sona ermesiyle, diğer militer grupların silahları bırakırken Hizbullah, İsrail tehdidine karşı Güney Lübnan’daki silahlı gücünü muhafaza etmesine izin verilmiştir."},{"k":"li","x":"**Düzenlediği önemli suikastler, esir elde ettiği operasyonlar ve Müslüman dünyada ilk defa uyguladığı intihar saldırıları veya “şehadeti isteme operasyonları” direnişini güçlendiren nedenlerdir.** Bu tür eylemlerin meşruiyeti Ayetullah Seyyid Hüseyin Fadlallah tarafından tartışılmıştır."},{"k":"li","x":"1990’lı yıllarda askeri biriminin yanı sıra sivil siyaset birimlerini de teşkil ederek Lübnan politikasına girmiş ve bu durum **“Hizbullah’ın Lübnanlaşması” olarak değerlendirilmiştir.**"},{"k":"li","x":"1992’den bu yana Lübnan parlamentosunda temsilci bulundurmakta ve bazı hükümetlere koalisyonun parçası olarak katılmaktadır."},{"k":"li","x":"**“Devlet içinde devlet” olarak tanımlanmaktadır;** silahlı kuvvetleri, adalet ve müftülük birimleri, eğitim kurumları, sendikalar, bankacılık faaliyetleri, dış ilişkiler ofisi, kreş, klinik ve hastaneleri, televizyon (el-Menar) ve radyo kanalı ile Lübnan devletine paralel bir hükümet gücünü yürütmektedir."},{"k":"h","x":"İlişkiler ve Algı"},{"k":"li","x":"**İran’ın finansal, Suriye’nin de lojistik desteği olmadan bu hacimde büyümesi ve etkili hale gelmesi mümkün değildi.**"},{"k":"li","x":"İsrail karşısındaki direnişi sadece Şiilerin değil, Sünnilerin, hatta Lübnan vatandaşı Hıristiyan ve Dürzilerin de desteğini kazanmıştır. Sayyid Hassan Nasrallah, Ürdün ve Suriye’de Sünni kesimler nezdinde bir İslam kahramanına dönüşmüştür."},{"k":"li","x":"Ancak **2011 yılından itibaren Suriye iç savaşında İran siyasetinin bir parçası olarak Baas rejimi yanında savaşa müdahil olması, Hizbullah’ın İslam dünyasının genelinde sahip olduğu teveccüh ve saygınlığa büyük darbe indirmiştir.**"},{"k":"li","x":"Bugün başta ABD olmak üzere birçok Batılı ülke ve Körfez’deki monarşik Arap rejimleri tarafından **terörist bir örgüt olarak tanınmaktadır.** Avrupa Birliği’nin de içinde olduğu bazı ülkeler ise örgütün sadece askeri kanadını terör listelerine almaktadır."}]},{"h":"Tebliğ Cemaati","b":[{"k":"li","x":"1920'li yılların sonunda Kuzey Hindistan'da Muhammed İlyas Kandehlevi tarafından kurulmuştur."},{"k":"li","x":"**\"Altı prensip\"** etrafında faaliyet gösterir: Kelime-i tevhid, namaz, ilim-zikir, ikram-ı Müslim, niyet ve tefriğ-i vakt (tebliğ için vakit ayırmak)."},{"k":"li","x":"\"Tefriğ-i vakt\" prensibiyle kendine mahsus bir kimlik kazanır. Farz bir ibadet olarak tebliğ, Müslümanın hayatının ayrılmaz bir parçası olduğu için belli bir vakit ve maddi imkân tahsis edilmesi gerekir."},{"k":"li","x":"Haftada birkaç saat mahalli tebliğ faaliyetlerine, her ay üç tam gün bölge dışında tebliğe, her yıl kırk gün tebliğ gruplarında göreve, deneyimli tebliğciler ise ömründe bir defa aralıksız dört ay tebliğ çalışmalarına katılmalıdır."},{"k":"li","x":"Faaliyetler, 10-15 kişilik \"teşkil\" grupları halinde, bir \"emir\"in başkanlığında yürütülür. Konaklama genellikle camide olur."},{"k":"li","x":"Tebliğ, camilerde ikindi ve akşam namazları sonrası 15-20 dakikalık sohbetlerde yapılır. Konuşmalar altı prensipten biri etrafında şekillenir, Kur'an ayetleri ve Hz. Peygamber ile sahabe söz ve davranışlarıyla örneklendirilir."},{"k":"li","x":"Katılım resmi bir üyelik veya prosedür gerektirmez. Tebliğ seyahatlerinde (Hurüc veya teşkile çıkmak) herkes kendi masrafını karşılar; aidat sistemi yoktur."},{"k":"li","x":"**Temel nokta, cemaatin belli bir mezhep yöneliminin olmamasıdır.** Herkes kendi mezhebini izlemekte serbesttir."},{"k":"li","x":"Modern giysiler yerine geleneksel kıyafetler (cübbe, şalvar, çarşaf) tercih edilir. Kadınların tebliğ çalışmaları hemcinslerine yönelik yapılır."},{"k":"li","x":"**Siyasi konularda tarafsız kalmayı prensip edinmişlerdir.** Cihat kavramını daha çok nefse ve şeytana karşı mücadele olarak anlarlar. Bu nedenle siyasal İslamcı teşkilatlar tarafından \"siyasi duyarsızlıkla\" ve \"İslam karşıtı hükümetlerle uzlaşmakla\" suçlanırlar."},{"k":"li","x":"**Gevşek bir teşkilat sistemine sahiptir** ve en üstünde bir şura heyeti bulunur; ancak başkanın lider pozisyonunda olduğu söylenemez."},{"k":"li","x":"Faaliyetler mahalli olarak organize edilir. Güney Delhi’deki Nizamüddin Merkez Mescidi genel merkez kabul edilse de Pakistan’da Raiwand, İngiltere’de Dawsbury Darululum gibi büyük kurumları vardır. Türkiye’deki merkezleri Sultangazi’deki Mescid-i Selam’dır."},{"k":"li","x":"**Herhangi bir resmi teşkilat üyeliği veya tüzük/yönetmelikle belirlenmiş bir prosedür söz konusu değildir.**"},{"k":"li","x":"Üyeliğe giriş ve bağlılık, **“Hurüc” veya “teşkile çıkmak” denilen tebliğ seyahatleri sırasında gerçekleşir.** Bu seyahatlerde herkes kendi masrafını karşılar; cemaatin bir aidat sistemi yoktur. Bu faaliyetler hem insanlara tebliğ yapılmasını hem de tebliğcinin manevi terbiyesini amaçlar."},{"k":"h","x":"Düşünsel Yaklaşım"},{"k":"li","x":"**“Davet devletten öncedir” ilkesini benimseyen dini gruplar arasında yer alır.**"},{"k":"li","x":"**İçtihat karşıtı bir tutum sergilemekte,** fıkhı klasik metinler ekseninde anlayıp uygulamakta, zamansal değişimleri dikkate almadan nasları yorumlamakta, akli çözümlere uzak durmakta ve çağdaş gelişmelere elverişli şer’i çözümler üretememektedir."}]},{"h":"Tâlibân","b":[{"k":"h","x":"El-Kaide ile İlişkisi"},{"k":"li","x":"El-Kaide, **1996’da Taliban’ın kurduğu Afganistan İslam Emirliği’nde güçlü bir korunak bulmuştur.**"},{"k":"li","x":"El-Kaide, **Afganistan cihadı konusunda Suudi Arabistanlı selefi düşünceye sahip Usame bin Ladin ile anlaşan talebelerin desteğini almıştır.** Afganistan, selefi düşünceye mensup uluslararası radikal ve savaşçı (cihadi, cihadist) grupların talimgahı haline gelmiştir."},{"k":"li","x":"Taliban’ın Kuzey İttifakı güçlerine karşı girdiği savaşlarda, Taliban birliklerinin **üçte birini El-Kaide’ye bağlı yabancı savaşçılar teşkil etmekteydi.**"},{"k":"li","x":"Usame bin Ladin ve arkadaşlarının Taliban liderliğinin karar alma mekanizmasında gittikçe artan bir söz sahibi olmaya başlaması, **Taliban’ın hedeflerini Afganistan sınırlarının dışına, özellikle Orta Asya ülkelerine taşımasına** neden olmuştur."},{"k":"li","x":"El-Kaide’nin Hanefi ve Sufi orijinli bir yapılanma olan Taliban ile iş birliği, **emperyalist kâfir güçlere karşı kuvvetli bir saf oluşturabilmek için Selefi olmayan İslami kesimlerle zorunlu iş birliğine gidilebileceği değerlendirmesinin bir ürünüdür.**"},{"k":"li","x":"Afganistan’daki iç savaş sırasında El-Kaide, ülkeden çıkma yollarını aramış ancak başarısız olmuştur."}]},{"h":"Medrese Gelenekçiliği","b":[{"k":"p","x":"Kökleri XI. yüzyıla uzanan medreseler, XIX-XX. yüzyıllarda birçok dinî akım ve teşkilatın doğduğu yerler oldu. Klasik eserler üzerinden eğitim veren bu kurumlar, ders kitabı geleneği, icazet silsilesi ve hiyerarşik yapısıyla gelenekçiliğin önemli bir damarını oluşturur."},{"k":"h","x":"Diyobendiyye"},{"k":"p","x":"Hindistan'da Deoband'da kurulan Dârululûm etrafında oluşan harekettir. Düşünce kökleri tasavvufla hadise dayalı fıkhı dengeleyen **Şah Veliyyullah Dihlevî**'ye (1703-1762) uzanır. Mezhep taklidini (Hanefîlik) esas alır; bu yönüyle Ehl-i Hadis'ten ve Ehl-i Kur'an gibi modernist hareketlerden ayrılır. Medreseler halkın bağışlarıyla ayakta durur; bugün Pakistan, Hindistan, Bangladeş ve Afganistan başta olmak üzere geniş bir ağa sahiptir."},{"k":"li","x":"**Meclis-i Tahaffuz-ı Hatm-i Nübüvvet:** Diyobendî kökenli, Kādiyânîliğe karşı nübüvvetin sona erdiği inancını korumak için kurulmuş teşkilat."},{"k":"li","x":"**Sipâh-ı Sahâbe:** Diyobendî kökenli, Şiî karşıtı militan teşkilat; terör bağlantıları yüzünden 2002'de yasaklanmış, sonra farklı adla faaliyet göstermiştir."},{"k":"li","x":"**Cemiyet-i Ulemâ-i İslâm:** Diyobendîliğin Pakistan'daki siyasi temsilcisi."},{"k":"h","x":"Tâlibân ve Pakistan Tâlibânı"},{"k":"p","x":"Sovyet işgali sonrası savaş baronlarının zulmü altındaki Afganistan'da, Pakistan'daki Diyobendî medreselerinde okuyan talebeler (tâlib) Molla Muhammed Ömer önderliğinde örgütlendi. Ülkeye barış ve düzen getirmek iddiasıyla yola çıkan hareket 1996'da Kabil'i aldı ve **Afganistan İslam Emirliği**'ni kurdu; Kuzey İttifakı'na karşı savaştı. Siyasallaşmamış, katı bir dinî gelenekçiliği temsil eder; Şiîlere, Selefîlere (\"Vehhâbî\") ve İhvâncı İslamcılara mesafelidir. el-Kâide ile kurulan ittifak, Tâlibân'ın uluslararası yalnızlaşmasına yol açtı. 2007'de Beytullah Mahsûd'un önderliğinde **Tahrîk-i Tâlibân-ı Pakistan** çatı örgütü kuruldu."},{"k":"h","x":"Tebliğ Cemaati"},{"k":"p","x":"**Muhammed İlyas Kandehlevî** tarafından 1920'lerin sonunda Delhi yakınlarındaki Mevat bölgesinde, dinden uzaklaşmış Müslümanlar arasında başlatıldı. Kurucu, tebliğ görevini Diyobendiyye'nin kurucularından hocası Reşîd Ahmed Gangûhî'den rüyasında aldığını anlatır. Altı prensibi: kelime-i tevhid, namaz, ilim ve zikir, Müslümanlara ikram, ihlas ve **tefrîğ-i vakt** (tebliğe vakit ayırma). Yüz yüze sözlü tebliği esas alır, medyayı ilke olarak kullanmaz, siyasetten uzak durur."},{"k":"h","x":"Şiî medrese geleneği"},{"k":"p","x":"Şiî ilmiyye havzaları (Kum, Necef) idari ve mali bakımdan bağımsız, kurumsallaşmış yapılarıyla Sünnî medreselerden ayrılır. 1979 devriminden sonra Kum havzası Şiî dünyada baskın konuma geldi; Necef, Âyetullah Sîstânî'nin karizmasına rağmen bu dengeyi henüz kuramamıştır."}]},{"h":"Siyasal Islahatçılığın Diğer Temsilcileri","b":[{"k":"h","x":"Seyyid Kutub ve radikalleşme"},{"k":"p","x":"İhvân-ı Müslimîn'in fikir adamı **Seyyid Kutub**, Nâsır döneminin hapishanelerinde toplumu \"câhiliye\" içinde gören ve hâkimiyetin yalnız Allah'a ait olduğunu vurgulayan görüşler geliştirdi. Bu görüşler 1960'lardan itibaren İhvân içinde ve dışında radikal grupların doğmasında etkili oldu. İhvân ise 1980'lerden sonra Hasan el-Bennâ'nın ılımlı ve siyasi katılımcı çizgisine döndü."},{"k":"h","x":"Hizbü't-Tahrîr"},{"k":"p","x":"1953'te Kudüs'te **Takıyyüddin en-Nebhânî** tarafından kuruldu. Temel hedefi **hilafetin yeniden kurulması**dır; değişimin halk tabanında değil, yönetimin ele geçirilmesiyle (\"nusret\") gerçekleşeceğini savunur. Siyasi partilerin ve demokrasinin İslam'la bağdaşmadığını düşünür; birçok ülkede yasaklanmıştır."}]},{"h":"Kavramlar ve Hızlı Tekrar","b":[{"k":"d","t":"Siyasal ıslahatçılık","x":"Tavandan tabana ıslah öngören, devlet nizamını ele geçirmeyi veya etkilemeyi hedefleyen yaklaşım."},{"k":"d","t":"Tefrîğ-i vakt","x":"Tebliğ Cemaati'nde tebliğe düzenli olarak vakit ayırma prensibi."},{"k":"d","t":"Huruç","x":"Tebliğ Cemaati'nde tebliğ seyahatine (teşkile) çıkma."},{"k":"d","t":"Diyobendiyye","x":"Hindistan'da Deoband medresesi etrafında oluşan, Hanefî taklidi esas alan medrese hareketi."}]}],"ht":[{"s":7,"x":"Diyobendiyye: Şah Veliyyullah çizgisi, Hanefî taklit, geniş medrese ağı; Tâlibân bu medreselerden doğmuştur (1996 Afganistan İslam Emirliği)."},{"s":7,"x":"Tebliğ Cemaati: Muhammed İlyas, Mevat; altı prensip, siyasetten uzak, yüz yüze tebliğ."},{"s":8,"x":"Seyyid Kutub'un câhiliye ve hâkimiyet fikirleri radikal grupları etkiledi. Hizbü't-Tahrîr (Nebhânî, 1953) hilafetin yeniden kurulmasını hedefler."}],"oz":{"t":"Sosyopolitik Dinî Akımlar · Özet","intro":"Ünitenin özü: Siyasal ıslahatçılığın özellikleri ve başlıca temsilcileri; medrese gelenekçiliğinden doğan Tâlibân ve Tebliğ Cemaati.","s":[{"h":"Siyasal Islahatçılık","b":[{"k":"p","x":"Tavandan tabana bir ıslah öngörür; devlet nizamını ele geçirmeyi veya etkili olmayı hedefler. Parti, sendika gibi siyasi araçları ya da direniş örgütlerini kullanır."},{"k":"tbl","r":[["Akım","Kuruluş","Temel özellikleri"],["İhvân-ı Müslimîn","Hasan el-Bennâ, İsmailiye (Mısır), 1928","İslam'ı din ve devlet olarak gören kapsayıcı teşkilat; Filistin meselesi; Seyyid Kutub ile radikalleşme, 1970'lerden sonra siyasi katılım; Ürdün, Sudan, Yemen, Fas vb. kolları"],["Cemaat-i İslâmî","Mevdûdî, Lahor, 1941","İslam'ı külli bir sistem olarak görme; Pakistan siyasetinde parti; Afgan cihadına destek; Hint alt kıtasında İhvân'ın muadili"],["Ensârullah (Husîler)","Hüseyin el-Husî, Yemen (Zeydî)","İran devrimi ve Hizbullah'ı model alma; \"Allahu ekber, kahrolsun Amerika, kahrolsun İsrail\" sloganı; 2014'te San'a'nın kontrolü"],["Lübnan Hizbullahı","1982 sonrası, İran Devrim Muhafızları desteğiyle","İsrail işgaline direniş; 1992'den beri mecliste; \"devlet içinde devlet\"; 2011'den sonra Suriye'de Esed rejiminin yanında savaşması saygınlığını zedeledi"],["Hizbü't-Tahrîr","Takıyyüddin en-Nebhânî, 1953","Hilafetin yeniden kurulması hedefi; parti ve demokrasiyi reddetme"]]}]},{"h":"Medrese Kökenli Hareketler","b":[{"k":"li","x":"**Diyobendiyye:** Şah Veliyyullah Dihlevî çizgisi; Hanefî taklit; Hint alt kıtasında geniş medrese ağı."},{"k":"li","x":"**Tâlibân:** Diyobendî medreselerinde okuyan talebeler; Molla Ömer önderliğinde 1996'da Kabil'i alıp Afganistan İslam Emirliği'ni kurdu; el-Kâide'yi korudu. 2007'de Pakistan Tâlibânı (TTP) kuruldu."},{"k":"li","x":"**Tebliğ Cemaati:** Muhammed İlyas Kandehlevî, Mevat (1920'ler). **Altı prensip:** kelime-i tevhid, namaz, ilim ve zikir, Müslümana ikram, ihlas, tefrîğ-i vakt. Yüz yüze tebliğ, siyasetten uzak durma, gevşek teşkilat, \"davet devletten öncedir\" ilkesi."}]}]}},{"t":"İslam Dünyasında Yenilenme ve Modernleşme Hareketleri","intro":"İhyâ, tecdîd ve ıslah kavramları; İslamcılığın doğuşu, temel meseleleri ve ilk temsilcileri; Osmanlı'dan günümüze İslamcılık; Cedîdcilik ve Mûsâ Cârullah; ıslahatçı oluşumlar; metinselci ve tarihselci modernizm; gelenekselcilik.","s":[{"h":"İhya Hareketlerinin Doğuşu","b":[{"k":"p","x":"İslam dünyasının Batı karşısında gerilemesi genellikle XVIII. yüzyılın ikinci yarısından itibaren başlatılır. Bu gidişatı durdurmak ve ümmeti eski gücüne kavuşturmak isteyen âlim ve aydınlar, yürüttükleri çabaya **ihyâ** (diriliş), **tecdîd** (yenilenme) ve **ıslah** (düzeltme, iyileştirme) adlarını verdi. Bireysel çabalar zamanla İslam dünyasının düşünce ve siyasetinde etkili olan organize hareketlere dönüştü. Bu hareketlerin bir kısmı geleneğe tutunup yenilenmeye mesafeli kaldı, bir kısmı geleneği sert biçimde sorgulayıp modern bir reformculuğa yöneldi, bir kısmı da ikisi arasında pragmatik bir çizgi izledi."},{"k":"d","t":"İhyâ","x":"Diriliş; ümmeti Kur'an ve sünnete döndürüp inançları bid'at ve hurafelerden arındırma çabası."},{"k":"d","t":"Tecdîd","x":"Yenilenme; dinin aslına dönerek yapılan tazelenme. \"Reform\" kelimesi Hristiyan reformunu çağrıştırdığı için İslamcılarca pek tercih edilmemiştir."},{"k":"d","t":"Islah","x":"Bozulan kısımları onarma, eksikleri giderme, iyileştirme."},{"k":"d","t":"İslamcılık","x":"XIX-XX. yüzyıllarda İslam'ı inanç, ibadet, ahlak, siyaset, hukuk ve eğitimiyle yeniden hayata hâkim kılmayı; Müslümanları sömürüden, istibdattan, taklitten ve hurafelerden kurtarıp birleştirmeyi ve kalkındırmayı amaçlayan aktivist, modernist ve seçmeci düşünce ve hareketlerin bütünü."},{"k":"h","x":"Hazırlayıcı sebepler"},{"k":"li","x":"Batı'nın rönesans, reform ve sanayi devrimiyle teknik ve ekonomik üstünlük kazanması."},{"k":"li","x":"Sömürgecilik: 1798'de Napolyon'un Mısır'ı işgali, Hint alt kıtasının İngiliz hâkimiyetine girmesi, Kuzey Afrika'nın Fransız ve İtalyan işgali, 1882'de Mısır'ın İngilizlerce alınması; Osmanlı'nın kapitülasyonlar ve toprak kayıpları."},{"k":"li","x":"Batı hayranlığı, pozitivizm gibi Aydınlanma ideolojilerinin yayılması; oryantalizm ve misyonerliğin Müslümanların özgüvenini sarsması."},{"k":"h","x":"İslamcıların temel meseleleri"},{"k":"tbl","r":[["Mesele","Kısaca"],["İlk kaynaklara dönüş","Gerilemenin sebebi İslam'ın özünden uzaklaşmaktır; çözüm asr-ı saadete, Kur'an ve sünnete dönmek, bid'at ve hurafeleri ayıklamaktır."],["Terakki için içtihat","İslam akla uygundur ve ilerlemeyi emreder; kapanan içtihat kapısı açılmalı, mezhep taklitçiliğine son verilmelidir."],["Batı'dan faydalanma","Batı'nın bilim ve tekniği seçmeci (eklektik) biçimde alınmalı, ideoloji ve ahlak anlayışı alınmamalıdır."],["Tasavvufa çift taraflı bakış","Tarikatlar tembellik ve hurafecilikle eleştirilmiş; vahdet-i vücûd ise bazı İslamcılarca ilgi görmüştür."],["Eğitimde reform","Medrese müfredatı ıslah edilmeli, felsefe ve pozitif bilimler okutulmalıdır (Aligarh, el-Ezher ıslahı, Medresetü'z-Zehrâ projesi)."],["İslam birliği (ittihâd-ı İslâm)","Sömürgeciliğe karşı tek çare; II. Abdülhamid bunu devlet politikası yaptı. Efgânî'ye göre dayanakları din bağı, hac ve hilafettir."],["Şûraya dayalı yönetim","Hilafet \"millete vekâlet\" olarak yorumlandı; meşveret, şûra ve biat kavramları anayasa ve meclisle ilişkilendirildi."],["Yazılı üretim","Materyalizm ve oryantalizme reddiyeler; Kur'an'ı modern bilimle uyumlu gösteren tefsirler (Tantâvî Cevherî'nin el-Cevâhir'i)."]]},{"k":"h","x":"Ortak ve farklı yönler"},{"k":"p","x":"İslamcıların neredeyse hepsi İslam'ın ilerlemeye engel olmadığını, Batı'yı üstün kılan unsurların aslında Müslümanlardan alındığını, ümmetin birliğinin zorunlu olduğunu savunur. Ancak \"nereden başlamalı?\" sorusuna cevapları farklıdır: **Efgânî** siyasete ve inkılaba, **Abduh** eğitim ve kurumların ıslahına öncelik verir; Abduh'un öğrencisi **Reşîd Rızâ** ise Menâr ekolünü daha siyasi ve Selefî bir çizgiye taşır. Silahlı mücadeleyi seçen ıslah hareketleri de olmuştur: Bengal'de **Ferâizî** hareketi, Seyyid Ahmed Şehîd'in **Tarîkat-ı Muhammediyye**'si, Endonezya'da **Pedri** hareketi, Batı Afrika'da **Osman dan Fodio**, Kuzey Afrika'da **Senûsiyye**."}]},{"h":"Islah Kavramı ve Modern Islah Hareketi","b":[{"k":"d","t":"Islah (sözlük)","x":"\"İyi ve yararlı olma\" anlamındaki salâh kökünden; düzeltmek, daha iyi hâle getirmek. Kur'an'da kırk kadar ayette geçer ve ifsadın (bozgunculuğun) karşıtıdır."},{"k":"d","t":"Müceddid","x":"Ebû Dâvûd'daki tecdid hadisine göre her yüzyılda dini yenilemek üzere gelecek kişi. İbn Hazm, Gazzâlî, İbn Teymiyye, İbn Hacer ve Şevkânî bu geleneğin örnekleri sayılır."},{"k":"p","x":"Modern dönemde ıslah, Muhammed Abduh ve Reşîd Rızâ öncülüğünde gelişen ve Selefî (ilk kaynaklara dönüşçü) yönü ağır basan düşünce akımının adı olmuştur. Dayanağı emr-i bi'l-ma'rûf ilkesidir (Âl-i İmrân 3/104, 110)."},{"k":"h","x":"Modern ıslah hareketini hazırlayan etkenler"},{"k":"li","x":"Vehhâbîliğin bid'at ve hurafelere karşı Kur'an-sünnet vurgusu."},{"k":"li","x":"Bulak Matbaası (1822) ve Arapça basının fikrî uyanışa katkısı."},{"k":"li","x":"Batı kültürü ve misyonerliğin hem tepki hem örnek alma eğilimi doğurması."},{"k":"li","x":"Tanzimat (1839) ve Islahat (1856) fermanları."},{"k":"h","x":"Temsilciler"},{"k":"tbl","r":[["Dönem / Bölge","İsimler ve eserler"],["İlk aşama","Efgânî, Abduh, Abdurrahman el-Kevâkibî; el-Urvetü'l-vüskā (1884)"],["Teorisyen","Reşîd Rızâ: el-Menâr dergisi (1898) ve Tefsîrü'l-Menâr"],["Cezayir","Abdülhamîd b. Bâdîs: Cem'iyyetü'l-ulemâi'l-müslimîn (1931), eş-Şihâb dergisi"],["Tunus","Muhammed Tâhir b. Âşûr"],["Mısır (devam)","Ferîd Vecdî, Muhammed Mustafa el-Merâgī, Mahmûd Şeltût, Ahmed Emîn"],["1950 sonrası","Siyaset ıslahçı düşüncenin yerini aldı; İhvân-ı Müslimîn ve Seyyid Kutub öne çıktı."]]},{"k":"h","x":"Islahın ilkeleri"},{"k":"li","x":"**Kur'an ve sünnete dönüş:** Taklit yerine bilinçli bağlılık (ittibâ); içtihat teşvik edilir ama inanç ve temel ibadetler içtihadın dışındadır."},{"k":"li","x":"**İcmâ:** Genellikle sahabe icmâıyla sınırlanır."},{"k":"li","x":"**İbadet-âdet ayrımı:** İbadetler değişmez; âdetler, örf ve siyasi-hukuki düzenlemeler zamana göre değişebilir."},{"k":"li","x":"**Savunmacılık:** İslam akla, bilime ve ilerlemeye uygun bir din olarak tanıtılır."}]},{"h":"Islahatçı Oluşumların Özellikleri","b":[{"k":"p","x":"**\"Islahatçılık\"** kavramı, kökü 'sulh' olan 'ıslah' kelimesinin çoğuludur ve genel olarak herhangi bir usul, kurum veya devlet düzeninde **eskimiş, bozulmuş veya aksayan yanları düzeltmek, iyileştirmek, eksiklikleri tamamlamak, bozulmaları onarmak ve gayesine elverişli hale getirmek** anlamına gelmektedir."},{"k":"p","x":"Bazen **diriliş** anlamındaki \"ihya\" ve **yenilenme** anlamındaki \"tecdid\" terimleri de ıslah yerine kullanılabilmektedir. Ancak ıslah kavramı daha çok **somut iyileştirmelere** işaret ederken, Batı kökenli \"reform\" kelimesi \"yeniden şekil verme\" manası taşıdığı için ıslahatçılar tarafından ihtiyatla karşılanır ve genellikle modernist anlayışları tanımlamak için kullanılır. Islahatçılar, bozulmayı İslam'ın kendisinde değil, Müslümanların din algılarında, yaşantılarında, dini kurumlarda ve devlet düzeninde ararlar. Bu, Batılı emperyalist güçlere karşı kültürel veya siyasi bir savaşım verme zorunluluğunu da içerir."},{"k":"p","x":"**Islahatçı Akımın Özgün Karakteri ve Önemli Özellikleri:** Islahatçı akımlar, kültürel ve siyasal ıslahatçılar arasında yöntem farklılıkları olsa da bazı ortak özelliklere sahiptirler:"},{"k":"li","x":"**Islahatın Hedefi:** Müslümanların kötü durumunun İslamiyet'ten değil, Müslümanların yanlışlarından ve dış güçlerden kaynaklandığı inancıdır."},{"k":"li","x":"**Dini Geleneğe Bakış:** Bozulmada yanlış geleneklerin de rolü olduğuna inanıldığı için geleneğe saygı duymak veya onu korumak öncelikli değildir. Ancak, büyük kitlelerden destek kaybetmemek adına derin bir gelenek sorgulamasına da gitmezler; **pragmatik bir tutum** sergilerler."},{"k":"li","x":"**Batılılaşma ve Moderniteye Yaklaşım:** Batılılaşma ve modernizm güçlü şekilde eleştirilse de **faydacı ve seçmeci bir yaklaşımla Batı'dan ve modern dünyadan yararlanma** yoluna gidilir. Bu durum hem gelenekçiler hem de modernistlerden eleştiri almalarına neden olur."},{"k":"li","x":"**Temel Kaynak ve Referanslarda Nakil-Akıl Dengesi:** Nakli bilgi ve akli çözümlemeler arasında bir denge gözetilmeye çalışılır. Aşırı nakilci gelenekçilik ve nakli kaynakları göz ardı eden modernizm, ifrat ve tefrit olarak değerlendirilir. Bu denge arayışı bazen **pragmatizm ve fırsatçılık** olarak da yorumlanır."},{"k":"li","x":"**Dinamizm ve Teşkilatçılık:** Islahatçı oluşumlarda **sürekli faaliyet, dinamizm ve teşkilatçılık** ön plandadır. Söz ve yazıdan ziyade **iş, eylem ve hareket** odaklıdırlar. Kurucuları güçlü ilim ve fikir adamları olsa da teorik çıktılar dahi çoğu zaman insanları iş yapmaya motive eden içeriktedir."},{"k":"li","x":"**Faaliyet Alanları:** Dini-ilmi meselelerden ziyade **siyaset, ekonomi, eğitim-öğretim, basın-yayın** odaklıdırlar. Müslümanların \"düştükleri\" yerden \"ayağa kalkmaları\" hedeflenir."},{"k":"li","x":"**Hedef Kitle ve Kadro Profili:** Kadroları genellikle **elit bir tabaka** oluşturur ve hitap ettikleri kesimler de onları anlayabilecek seviyededir. Bu, sıradan halkın anlayacağı basit bir dil kullanan gelenekçi akımlardan farklıdır."},{"k":"li","x":"**Liderlik Profili:** Liderliğe yükselmede dini tahsil çok önem arz etmez; daha çok **teknokrat, mühendis, ekonomist, eğitimci, gazeteci gibi seküler eğitimden gelenler** bulunur. **Organizasyon becerisi, yönetim tecrübesi, karizmatik kişilik** gibi hususlar önemlidir."}]},{"h":"Kültürel Islahatçılık","b":[{"k":"li","x":"**İnsan unsuru** üzerine odaklanır ve toplumun sosyal tabanından başlayıp yönetime ulaşan bir ıslahat programı öngörür."},{"k":"li","x":"**Eğitim-öğretim, basın-yayın, sivil toplum ve insani yardım kuruluşları** gibi organlar aracılığıyla halka ulaşırlar."},{"k":"p","x":"**Nurculuk:** Said Nursi tarafından kurulmuş olup, özellikle genç nesillerin **imanını akli delillerle tahkim etmeyi** hedefler. \"Risale-i Nur\" eserleriyle Nurculuğun felsefesini oluşturmuştur. Said Nursi'nin \"şeytandan ve siyasetten Allah'a sığınırım\" sözüyle siyaseti vasıta edinen bir ıslahat hareketi yerine halkın imanını kurtarmaya odaklandığı belirtilir. **Süleymancılık:** Süleyman Hilmi Tunahan tarafından kurulmuş olup, Osmanlı usulünde klasik medrese eğitimini Kur'an kursları üzerinden sürdürmeyi amaçlar. Devletin din eğitimi kurumlarına (İmam-Hatip ve İlahiyat fakülteleri) mesafeli duruş sergilemişlerdir."},{"k":"p","x":"**Nedvetü'l-Ulema ve Medresetü'l-Islah (Hint Alt Kıtası):** Geleneksel medrese sistemini uygulayan köklü eğitim kurumlarıdır. Diyobendiyye'nin gelenekçiliğine alternatif olarak ortaya çıkmış, programlarında modern izler taşımış ve toplumsal ıslahı hedeflemişlerdir. İktidara ulaşma çabasından ziyade imanı yayma ve halkı terbiye etme metodunu savunmuşlardır."},{"k":"p","x":"**Muhammediyye (Endonezya):** Klasik medreselerin ıslahını hedeflemiş, dini ilimler yanında modern bilimleri de müfredatlarına dahil etmişlerdir. Cemaat kendi partisini kurmak yerine duruma göre farklı partileri desteklemiş, sosyal ve insani yardım faaliyetleriyle geniş kitlelere ulaşmıştır."}]},{"h":"İlk İhyacılar / İslamcılar","b":[{"k":"tbl","r":[["Şahsiyet","Hayatı","Görüşleri"],["Seyyid Ahmed Han (1817-1898)","Delhi'de doğdu, İngiliz idaresinde hâkimlik yaptı; 1857 Sipahi ayaklanmasında İngilizlerin yanında kaldı. 1877'de Aligarh kolejini kurdu (1920'de üniversite).","Tabiata uygunluk ilkesi; mucizeleri tabiat kanunlarıyla yorumlar, akla ve tabiata uymayan hadisleri reddeder; din ile siyasetin ayrılmasını savunur. Laik İslam tezinin öncülerinden sayılır; Efgânî ve Abduh onu İngilizlere hizmetle suçlamıştır."],["Cemâleddin Efgânî (1838-1897)","Hindistan, Mısır, İran, İstanbul, Paris ve Londra'da bulundu. Abduh ile Paris'te el-Urvetü'l-vüskā dergisini çıkardı (1883-1884). İran'daki tütün imtiyazına karşı mücadeleye öncülük etti. İstanbul'da öldü.","İslamcılığın ilk ve asıl kuramcısı. İslam birliği, meşveretle yönetilen hilafet, istibdada ve emperyalizme karşı siyasi mücadele, içtihat kapısının açıklığı. Islahta tavandan tabana yöntem."],["Muhammed Abduh (1849-1905)","Efgânî'nin öğrencisi ve dava arkadaşı; Mısır müftüsü oldu, el-Ezher'in ıslahı için çalıştı.","Siyasetten uzak, eğitim ve kurumların ıslahı; akaidi sadeleştirme, dinî meselelere modern çözümler; din ile bilim alanlarını ayırma."],["Mustafa Sabri Efendi (1869-1954)","Son Osmanlı şeyhülislamı.","Muhafazakâr İslamcı; içtihada ve modernist yorumlara karşı, Cumhuriyet devrimlerine muhalif."]]},{"k":"not","x":"Osmanlı İslamcılarından Mustafa Sabri, İskilipli Âtıf ve Said Nursî muhafazakâr çizgide, İzmirli İsmail Hakkı, Şemseddin Günaltay ve Şerefeddin Yaltkaya ise modernist çizgide değerlendirilir. Muhafazakârlar genellikle Cumhuriyet devrimlerine muhalif kalırken modernistler yeni rejimde görev almıştır."}]},{"h":"İslamcılık: Osmanlı'dan Günümüze","b":[{"k":"d","t":"İslamcılık (geniş ve dar anlam)","x":"Geniş anlamda siyasette Müslüman kimliğini merkeze koyan her aktör; dar anlamda devlet gücüyle şeriata dayalı bütüncül bir düzen kurmayı hedefleyen çizgi."},{"k":"p","x":"XIX. yüzyılın üçüncü çeyreğinden Birinci Dünya Savaşı'na kadar bu eğilim çoğunlukla **ittihâd-ı İslâm** (panislamizm) adıyla anıldı."},{"k":"steps","x":["**Yeni Osmanlılar:** Nâmık Kemal, Ali Suâvi, Ziyâ Paşa; hilafet etrafında birlik, şûra-meşveret ile meşrutiyetin uyumu.","**II. Abdülhamid dönemi:** Kānûn-ı Esâsî askıya alındı; hilafet ve dinî değerler öne çıktı.","**II. Meşrutiyet (1908):** İslamcılık müstakil bir fikir hareketi oldu; Sırât-ı Müstakîm (sonra Sebîlürreşâd), Beyânülhak, Volkan ve İslâm Mecmuası dergileri. Mehmed Âkif, Said Halim Paşa, Şehbenderzâde Ahmed Hilmi, Mustafa Sabri; Âkif ve Said Nursî kavmiyetçiliği eleştirdi.","**Cumhuriyet:** 3 Mart 1924'te hilafetin kaldırılması, tevhîd-i tedrîsat ve tekkelerin kapatılmasıyla geri çekilme; Necip Fazıl (Büyük Doğu), Nurettin Topçu (Hareket), sonra Sezai Karakoç (Diriliş).","**1960 sonrası:** İhvân ve Cemaat-i İslâmî eserlerinin tercümesi; Necmettin Erbakan önderliğinde Millî Görüş partileri."]},{"k":"p","x":"**Temel fikirleri:** Geri kalmışlığın sebebi İslam değil ondan uzaklaşmaktır; çözüm Kur'an ve sünnete dönüş, içtihat ve eğitimin ıslahıdır; Batı'nın bilim ve tekniği alınır, ahlakı alınmaz; İslam belirli bir devlet biçimi dayatmaz, meşrutiyet şûra ile uyumludur. **Elmalılı Hamdi**'ye göre halife milletin vekilidir."},{"k":"p","x":"**Diğer ülkeler:** Mısır'da Hasan el-Bennâ (İhvân, 1928) ve Seyyid Kutub; Hint alt kıtasında Mevdûdî (Cemaat-i İslâmî, 1941); İran'da 1979 devrimi, Humeynî'nin velâyet-i fakîh anlayışı ve Ali Şerîatî'nin devrimci Şiî yorumu."}]},{"h":"Cedîdcilik","b":[{"k":"d","t":"Cedîdcilik","x":"XIX. yüzyılın sonlarında Rusya Müslümanları arasında eğitim ve kültür alanında başlayan yenileşme hareketi; adını usûl-i cedîd (yeni usul) eğitim yönteminden alır."},{"k":"p","x":"Geleneksel mekteplerde (usûl-i kadîm) yalnız okuma, ilmihal ve bazı surelerin ezberi öğretiliyordu. Cedîdçiler bunun yerine Batı'dan etkilenen yeni bir yöntem önerdi; karşıtlarına **Kadîmciler** denir."},{"k":"h","x":"İsmail Gaspıralı"},{"k":"p","x":"Kırımlı **İsmail Gaspıralı** (ö. 1914) hareketin en önemli temsilcisidir. 1883'te Kırım'da **Tercümân** gazetesini çıkardı ve \"**Dilde, fikirde, işte birlik**\" ilkesini savundu. 1884'te Bahçesaray'da ilk usûl-i cedîd mektebini açtı. Önerileri: mekteplerin medreselerden ayrılması, maaşlı öğretmen, okumayla birlikte yazma öğretimi, coğrafya ve matematik gibi derslerin müfredata girmesi, kızlar için ayrı okullar."},{"k":"h","x":"Bölgelere göre gelişimi"},{"k":"tbl","r":[["Bölge","Öncüler ve gelişmeler"],["Kazan (İdil-Ural)","Kursavî'nin başlattığı tartışma; Şehâbeddin Mercânî, Rızâeddin Fahreddin, Abdülkayyûm Nâsırî, Mûsâ Cârullah; Âlimcan Barudî'nin Muhammediyye Medresesi (1901)"],["Azerbaycan","Abbaskulu Ağa Bakıhanlı; Hasanbey Zerdâbî'nin Ekinçi gazetesi (1875-1877) ve ilk Türk kız okulu"],["Türkistan","Geç ve sınırlı; ilk usûl-i cedîd mektepleri Buhara (1900), Taşkent (1901), Semerkant (1903); Münevver Kārî, Mahmud Behbudi"]]},{"k":"p","x":"1910 civarında Rusya Türk-Müslüman toplumlarında usûl-i cedîd mekteplerinin sayısı 5000'e ulaştı. 1905'ten sonra hareket siyasallaştı; 1912'de Çarlık yönetimi bu mektepleri \"ihtilal ocakları\" sayarak öğretmenleri tutukladı. Sovyet döneminde Mîr Said Sultan Galiev gibi Cedîdçiler Stalin'in tasfiyesine uğradı; Cedîdçi aydınların büyük bölümü öldürüldü veya sürüldü. Sovyetlerin dağılması sürecinde Cedîdcilik millî uyanış hareketlerine ilham verdi."}]},{"h":"Mûsâ Cârullah Bigiyef","b":[{"k":"p","x":"**Mûsâ Cârullah** (1875-1949), Rostov yakınlarındaki Novoçerkassk'ta doğan Tatar âlimidir. Kazan'da Kül Buyı Medresesi'nde ve Buhara'da okudu; yaklaşık on beş yıl İstanbul, Kahire, Mekke, Medine, Hindistan ve Şam'da dolaştı; Kahire'de Muhammed Abduh ile tanıştı. 1905'ten sonra Rusya Müslümanlarının kongrelerinde görev aldı; 1917'deki V. Kongre'de kadın-erkek eşitliğini savunan bir rapor sundu. Sovyet döneminde tutuklanıp sürgün edildi, 1930'da Rusya'dan ayrıldı; Berlin, Japonya ve Hindistan'da bulundu, Türk vatandaşlığına alındı ve 25 Ekim 1949'da Kahire'de vefat etti."},{"k":"tbl","r":[["Eser","Konusu"],["Rahmet-i İlâhiyye Bürhanları (1911)","İlâhî rahmetin genişliği; Mustafa Sabri Efendi tarafından eleştirildi"],["Islâhat Esasları (1915)","Rusya Müslümanlarının siyasi hareketleri"],["Şeriat Esasları (1917)","İçtihat, mezhepler, kadın hakları"],["Hâtun (1933)","Tesettür, çok evlilik, boşanma ve mirasta geleneksel yaklaşımların eleştirisi"],["el-Veşîa (1935)","Şîa eleştirisi"],["Kitâbü's-Sünne (1945)","Hadisi inkâr eden Kur'âniyyûn'a cevap"]]},{"k":"h","x":"Fikirleri"},{"k":"li","x":"İslam dünyasının gerilemesini içtihat serbestliğinin kaybolup taklidin yayılmasına bağlar."},{"k":"li","x":"Kelâmı sade akideyi karmaşıklaştırmakla eleştirir; tasavvufun hoşgörüsünü takdir eder, ruhbanlığa dönüşen yönlerini reddeder."},{"k":"li","x":"Âhirette sonsuz azabın ilâhî rahmetle bağdaşmayacağını, mağfiretin herkesi kapsadığını savunur."},{"k":"li","x":"Kadının sosyal hayattan dışlanmasını eleştirir; medreselerde hadis, tefsir, tarih ve modern ilimlerin okutulmasını ister."},{"k":"li","x":"Hem Kadîmcilerin hem de yalnız modern ilimleri savunan Cedîdçilerin karşısında, Kursavî ve Mercânî'nin ıslahat çizgisinde durur."}]},{"h":"İslam Modernizmi","b":[{"k":"p","x":"Batı'da Aydınlanma ile doğan modernizm, geleneksel kurumların miadını doldurduğunu ve çağdaş, bilimsel değerlerle değiştirilmesi gerektiğini savunur. İslam modernizmi ise bu yaklaşımı dinî düşünceye taşıyarak dinin kaynaklarını, anlaşılma usullerini ve tarihî geleneği derin bir sorgulamaya tabi tutar."},{"k":"h","x":"Modernizmin diğer yenilikçi hareketlerden farkı"},{"k":"p","x":"Modernist İslam düşüncesinin fikir babası sayılan **Fazlurrahman** yenilenme hareketlerini sınıflandırır: Hadis merkezli bir eğitim mirası bırakan \"eski ihyacılık\", İhvân ve Cemaat-i İslâmî gibi siyasi ıslah projelerini temsil eden \"yeni ihyacılık\", klasik modernizm ve kendi temsil ettiği yeni modernizm. Islahatçılar bozulmanın sebebini Müslümanların hatalarında ve dış güçlerde ararken modernistler asıl sorunun \"bugüne İslam diye gelen din\" anlayışı olduğunu ileri sürer."},{"k":"h","x":"Özellikleri"},{"k":"li","x":"**Derin sorgulama:** Gelenek, fıkıh, kelâm, hadis ve tasavvuf mirası eleştiriye tabi tutulur. Ali Şerîatî bunu bir \"teşrih\" (anatomik inceleme) olarak niteler."},{"k":"li","x":"**Akıl merkezcilik:** Akıl ve bilim dinî metinlerin yorumunda belirleyicidir."},{"k":"li","x":"**Bireysellik:** Hiyerarşik cemaat ve örgüt disiplini yerine gönüllülük ve bireysel katılım öne çıkar; bu yüzden uzun soluklu teşkilatlar zor oluşur."},{"k":"li","x":"**Kur'an merkezlilik:** Kur'an metin olarak korunmuştur; hadisler aynı güvenilirlikte görülmez."},{"k":"h","x":"Metinselci modernizm (Kur'âniyyûn / Ehl-i Kur'an)"},{"k":"p","x":"Kur'an'ın başka kaynağa ihtiyaç bırakmayacak kadar açık ve yeterli olduğunu (En'âm 6/38, 59) savunur; hadisleri büyük ölçüde dışarıda bırakır."},{"k":"li","x":"**Hint alt kıtası:** Seyyid Ahmed Han öncüdür (miracı rüya, cinleri dağ adamları olarak yorumlama). XIX. yüzyıl sonunda \"münkirîn-i hadis\" denen gruplar doğdu; Abdullah Çekrâlevî ve Amritsarî gibi isimler namaz vakitleri ve bayram namazları gibi konularda farklı görüşler ileri sürdü. **Gulâm Ahmed Perviz** (ö. 1985) en bilinen temsilcidir."},{"k":"li","x":"**Mısır:** Muhammed Tevfik Sıdkî (ö. 1920) \"İslam yalnızca Kur'an'dır\" görüşüyle öncülük etti; Ali Abdürrâzık İslam'ın belirli bir yönetim sistemi öngörmediğini ve hilafetin dinî bir kurum olmadığını savundu. Günümüzde Ahmed Subhî Mansûr bu çizginin temsilcisidir."},{"k":"li","x":"**Türkiye:** 1980'lerden itibaren Kur'an'ı mealler üzerinden anlamaya çalışan \"mealciler\"."},{"k":"li","x":"**19'culuk:** Mısırlı biyokimyacı Reşad Halîfe'nin Kur'an'da 19 sayısına dayalı matematiksel kodlar bulunduğu iddiası; ABD'de (Arizona) cemaat oluşturmuştur."},{"k":"h","x":"Tarihselci modernizm"},{"k":"p","x":"Metinselcileri Kur'an'ın indiği tarihî şartları görmezden gelmekle eleştirir. Tarihselcilere göre ayetlerin hükümleri nüzul ortamındaki şartlara bağlıdır; bugün uygulanması gereken, bu hükümlerin arkasındaki **evrensel ilkelerdir** (tevhid, adalet, hürriyet, eşitlik, şûra)."},{"k":"li","x":"**Fazlurrahman** (1919-1988): Pakistan'ın Hezâre bölgesinde doğdu; Oxford'da İbn Sînâ üzerine doktora yaptı, Durham ve McGill'de ders verdi. 1962'de Karaçi'deki İslami Araştırmalar Enstitüsü'nün müdürü oldu. \"Islam\" (1966) adlı eserinde vahyin anlam olarak Peygamber'in kalbine indiğini, onun kelimeleriyle ifade edildiğini söylemesi büyük tepki çekti; Pakistan'dan ayrılarak 1969'da Chicago Üniversitesi'ne geçti ve orada vefat etti. Sünneti Peygamber'in \"mutlak sünnet\"i ve toplumun uygulamaya dönüştürdüğü \"yaşayan sünnet\" olarak ikiye ayırır. Başlıca eserleri: Islamic Methodology in History, Major Themes of the Qur'ān, Islam and Modernity. Önerdiği **çift hareket yöntemi**: Önce siyer ve nüzul sebepleri yardımıyla ayetin indiği döneme gidilip genel ilke tespit edilir, sonra bu ilke günümüze taşınıp somut hükümler yeniden üretilir."},{"k":"li","x":"**Abdülkerîm Sürûş:** İran devriminin destekçisiyken dinî bilginin tarihî ve beşerî olduğunu savunan liberal ve çoğulcu bir yaklaşıma yöneldi."},{"k":"li","x":"**Mahmud Muhammed Taha** (Sudan, Cumhuriyetçi Kardeşler): Mekke ayetleri İslam'ın evrensel aslını, Medine ayetleri ise dönemin toplumuna yönelik geçici şeriatı oluşturur; 1985'te idam edildi."},{"k":"li","x":"**Muhammed Arkoun, Hasan Hanefî** (sol İslam), Ali Şerîatî ve Batı'daki \"ilerici Müslümanlar\" (Amina Wadud vb.) da modernist yelpazede yer alır."},{"k":"tbl","r":[["","Metinselci modernizm","Tarihselci modernizm"],["Temel kaynak","Yalnız Kur'an metni","Kur'an'ın tarihî bağlamı ve evrensel ilkeleri"],["Hadis","Büyük ölçüde reddedilir","Tarihî bir veri olarak değerlendirilir"],["Yöntem","Kelimelerin semantiğinden hareket","Nüzul ortamına dönüp ilkeyi günümüze taşıma"],["Temsilciler","Ahmed Han, Tevfik Sıdkî, Perviz, Subhî Mansûr, mealciler","Fazlurrahman, Sürûş, Taha, Arkoun"]]},{"k":"h","x":"Modernizme yöneltilen eleştiriler"},{"k":"li","x":"Ayetlerin sünnet ve icmâ dikkate alınmadan yorumlanması."},{"k":"li","x":"Fikirlerin çoğunlukla Batı'nın seküler ve pozitivist etkisi altında üretilmiş olması ve bu yüzden kuşkuyla karşılanması."},{"k":"li","x":"Bireyci ve disiplinsiz yapı nedeniyle iç ihtilaflar ve bölünmeler."},{"k":"h","x":"Modernizm karşıtı bir akım: Gelenekselcilik"},{"k":"p","x":"Gelenekselcilik (traditionalism), \"çağdaş\" olmakla birlikte modernizme karşı bir harekettir; geleneği bütün dinlerin özünde bulunan **ezelî hikmet** (sophia perennis) olarak görür. Kurucusu **René Guénon**'dur (Abdülvâhid Yahyâ, ö. 1951); **Frithjof Schuon** ile \"dinlerin aşkın birliği\" tezi gelişmiş, **Seyyid Hüseyin Nasr** en tanınmış Müslüman temsilcisi olmuştur. Tasavvufu İslam'ın kalbi sayar, seçkinlere hitap eden elitist bir yapıya sahiptir."}]}],"ht":[{"s":0,"x":"İhyâ diriliş, tecdîd yenilenme, ıslah iyileştirmedir; bu çabalar topluca İslamcılık diye anılır."},{"s":0,"x":"İslamcıların temel meseleleri: ilk kaynaklara dönüş, içtihat, Batı'dan seçmeci yararlanma, eğitim reformu, İslam birliği ve şûraya dayalı yönetim."},{"s":1,"x":"Islah: salâh kökünden, düzeltme; ifsadın karşıtı. Modern ıslah: Abduh ve Reşîd Rızâ (el-Menâr, 1898); Cezayir'de İbn Bâdîs, Tunus'ta İbn Âşûr."},{"s":4,"x":"Seyyid Ahmed Han: Aligarh (1877), mucizeleri tabiatla yorumlama, din-siyaset ayrımı. Efgânî: İslam birliği ve siyasi ıslah. Abduh: eğitim ve kurum ıslahı. Reşîd Rızâ: Menâr ekolünü Selefî çizgiye taşıdı."},{"s":5,"x":"İslamcılık XIX. yüzyılda \"ittihâd-ı İslâm\" adıyla başladı; II. Meşrutiyet'te Sırât-ı Müstakîm/Sebîlürreşâd çevresinde müstakil fikir hareketi oldu."},{"s":6,"x":"Cedîdcilik: Rusya Müslümanları, usûl-i cedîd; Gaspıralı, Tercümân (1883), \"Dilde, fikirde, işte birlik\", Bahçesaray mektebi (1884); karşıtları Kadîmciler."},{"s":7,"x":"Mûsâ Cârullah (1875-1949): içtihat savunusu, Rahmet-i İlâhiyye Bürhanları (Mustafa Sabri'nin eleştirisi), Hâtun, Kitâbü's-Sünne; Kahire'de vefat etti."},{"s":8,"x":"Modernizm dinin kaynaklarını ve geleneği sorgular; metinselciler (Ehl-i Kur'an) yalnız Kur'an'ı esas alır, tarihselciler (Fazlurrahman) nüzul bağlamından evrensel ilkeleri çıkarır."},{"s":8,"x":"Fazlurrahman'ın çift hareket yöntemi: nüzul dönemine gidip ilkeyi bulmak, sonra ilkeyi bugüne uygulamak."},{"s":8,"x":"Gelenekselcilik: Guénon, Schuon, Nasr; ezelî hikmet ve dinlerin aşkın birliği."}],"oz":{"t":"İslam Dünyasında Yenilenme ve Modernleşme Hareketleri · Özet","intro":"Ünitenin özü: Tecdid, ihyâ ve ıslah; İslamcılığın doğuşu ve temsilcileri; Cedîdcilik ve Mûsâ Cârullah; modernizmin metinselci ve tarihselci kolları.","s":[{"h":"Kavramlar","b":[{"k":"tbl","r":[["Kavram","Anlamı"],["İhyâ","Diriliş; Kur'an ve sünnete dönüş, bid'at ve hurafeden arınma"],["Tecdîd","Dinin aslına dönerek yenilenme; her yüzyılda bir müceddid hadisi"],["Islah","Düzeltme, iyileştirme; ifsadın karşıtı; modern dönemde Abduh-Reşîd Rızâ akımı"],["İslamcılık","İslam'ı hayatın her alanında yeniden hâkim kılmayı amaçlayan XIX-XX. yüzyıl hareketi"]]}]},{"h":"İslamcılık","b":[{"k":"li","x":"**Hazırlayıcı sebepler:** Batı'nın üstünlüğü, sömürgecilik (1798 Mısır işgali vb.), pozitivizm, oryantalizm ve misyonerlik."},{"k":"li","x":"**Temel meseleler:** ilk kaynaklara dönüş, içtihat, Batı'dan seçmeci yararlanma, eğitim reformu, İslam birliği, şûraya dayalı yönetim."},{"k":"li","x":"**İlk temsilciler:** **Seyyid Ahmed Han** (Aligarh 1877; tabiata uygunluk, laik eğilim), **Cemâleddin Efgânî** (İslam birliği, siyasi ıslah, el-Urvetü'l-vüskā), **Muhammed Abduh** (eğitim ve kurum ıslahı), **Reşîd Rızâ** (el-Menâr, Selefî yöneliş)."},{"k":"li","x":"**Osmanlı ve Türkiye:** Yeni Osmanlılar; II. Meşrutiyet'te Sırât-ı Müstakîm/Sebîlürreşâd çevresi (Mehmed Âkif, Said Halim Paşa); Cumhuriyet'te Necip Fazıl, Nurettin Topçu, Sezai Karakoç; Millî Görüş."},{"k":"li","x":"**Islahatçı oluşumların özellikleri:** dinamizm ve teşkilatçılık, nakil-akıl dengesi, Batı'ya faydacı-seçmeci yaklaşım, siyaset-ekonomi-eğitim odaklılık; **kültürel** (Nurculuk, Nedvetü'l-Ulemâ, Muhammediyye) ve **siyasal** ıslahatçılık."}]},{"h":"Cedîdcilik ve Mûsâ Cârullah","b":[{"k":"li","x":"**Cedîdcilik:** Rusya Müslümanları arasında usûl-i cedîd eğitim hareketi; **İsmail Gaspıralı**, Tercümân (1883), \"Dilde, fikirde, işte birlik\", Bahçesaray mektebi (1884); karşıtları Kadîmciler; Sovyet döneminde tasfiye."},{"k":"li","x":"**Mûsâ Cârullah Bigiyef (1875-1949):** İçtihadı savunup taklidi eleştirdi; Rahmet-i İlâhiyye Bürhanları'nda azabın ebedî olmadığını savundu (Mustafa Sabri'nin eleştirisi); Hâtun, Kitâbü's-Sünne, el-Veşîa; Kahire'de vefat etti."}]},{"h":"Modernizm","b":[{"k":"tbl","r":[["","Metinselci (Kur'âniyyûn)","Tarihselci"],["Yaklaşım","Yalnız Kur'an, hadisi büyük ölçüde dışlama","Nüzul bağlamından evrensel ilkeleri çıkarma"],["Temsilciler","Ahmed Han, Tevfik Sıdkî, Perviz, Subhî Mansûr, mealciler, Reşad Halîfe (19'culuk)","Fazlurrahman, Sürûş, Mahmud Muhammed Taha, Arkoun"]]},{"k":"li","x":"**Fazlurrahman (1919-1988):** Karaçi'de İslami Araştırmalar Enstitüsü müdürü, sonra Chicago; mutlak ve yaşayan sünnet ayrımı; nüzul bağlamından ilkeye, ilkeden bugüne iki aşamalı yöntem."},{"k":"li","x":"**Eleştiriler:** sünnet ve icmâyı dışlama, Batı'nın seküler etkisi, bireyci yapının doğurduğu bölünmeler."},{"k":"li","x":"**Gelenekselcilik:** Guénon, Schuon, Seyyid Hüseyin Nasr; ezelî hikmet ve dinlerin aşkın birliği."}]}]}},{"t":"Ek Ünite: Mu'tezile","intro":"Mu'tezile'nin adı, doğuşu, tarihçesi, Basra ve Bağdat okulları, beş temel esası, diğer görüşleri ve yayıldığı coğrafya.","s":[{"h":"Mu'tezile: İsimlendirme ve Doğuşu","b":[{"k":"p","x":"Mu'tezile, İslam toplumu bünyesinde II/VII. asırda ortaya çıkan, itikadî meselelerin yorumunda akla ve iradeye öncelik tanıyan, \"tevhid, adalet, vaad-vaid, el-menzile beyne'l-menzileteyn ve emri bi'l-ma'ruf\" prensiplerini (usûl-i hamse) mezhebin temel esasları olarak kabul eden, itikadî ve siyasi gayelerle zuhur etmiş bir kelam mezhebidir."},{"k":"p","x":"**1. İsimlendirme Meselesi**: Sözlükte \"ayırmak, uzaklaştırmak” anlamındaki \"a-z-l” kökünden sıfat olan Mu'tezîle kelimesi \"uzaklaşan, ayrılıp bir köşeye çekilen \" anlamına gelmektedir. Bir anlayışa göre \"i'tizal\" kelimesi, Hz. Ali ile Hz. Muaviye çekişmesi yahut Hz. Hasan'ın hilafeti Hz. Muaviye'ye bırakması üzerine \" hiçbir gruba katılmayan, tarafsız kalanlar \" için kullanılmış ve söz konusu gruplara \"Mu'tezile” denmiştir. Diğer bir anlayışa göre ise Mu'tezîle ismi, aşırı uçlardan uzak durduklarını ifade etmek için mezhebin kendi mensuplarınca tercih edilmiştir."},{"k":"p","x":"Terim olarak Mu'tezile isminin ortaya çıkışı hususunda farklı tezler ileri sürülmüştür. Bunlardan en fazla dikkat çekeni Hasan Basri (ö. 110/728) ile Vasıl b. Ata (ö. 131/748) arasında vuku bulduğu kabul edilen hadiseye dayandırılan görüştür. Buna göre Mu'tezile mensupları büyük günah işleyen bir Müslümanın dinî konumu hakkında \"el-menzile beyne'l-menzileteyn \" görüşünü ileri sürdüklerinden bu isimle anılmışlardır. Öte taraftan bu ekol mensupları, kendilerini isimlendirirken \" i'tizal \" kavramının Kur'an'da müspet manada kullanıldığını gerekçe göstermişler ve aşırı uçlardan uzak durduklarını ifade etmek için de \"Mu'tezile” ismini tercih ettiklerini bildirmişlerdir. Muhalif bazı âlimler Mu'tezîle mensuplarını, kaderi tartışmaya açıp inkâr ettikleri için **Kaderiyye**; Cehm b. Safvân'dan etkilendikleri için **Cehmiyye**; “Allah şerri yaratmaz.\" dedikleri için **Seneviyye** ve **Mecûsiyye**; tövbe etmeden ölenlerin bağışlanmayacağını söyledikleri için **Vaidiyye**; Allah'a bazı kadim sıfatları nispet etmekten kaçındıkları için **Muattila** olarak da adlandırmışlardır. Ancak Mu'tezîle âlimleri bu isimleri reddetmiş, kendileri için \"Mu'tezile\" isminin yanı sıra “ **Ashâbü'l-adl ve't-tevhid, Adliyye, Ehl-i adl, Ehl-i hak, el-Fırkatü'n-nâciye** \" gibi adları kullanmayı tercih etmişlerdir.\" Mu'tezilî âlimler de hasımlarına Mücbire, Kaderiyye, Müşebbihe, Haşviyye gibi isimler izafe etmişlerdir."},{"k":"p","x":"Her mezhep, kendisini Hz. Peygamber'e nispet etmek, onun kanalıyla ortaya çıktığını anlatmak ister. Bazı alimler bu hareketin Hz. Ali vasıtasıyla Resulullah'a dayandığını iddia etmişlerdir."},{"k":"p","x":"**2. Mu** ' **tezile'nin Doğuşu ve Gelişimi:** Mu'tezili fikirlerin oluşumuna tesir eden faktörleri iç ve dış olmak üzere ikiye ayırmak mümkündür."},{"k":"p","x":" **İç Faktörler**: Müslümanlar arasındaki ihtilaflara çözüm arayışları Mu'tezili fikirlerin ortaya çıkmasında başat rol oynar. Başta imamet meselesi olmak üzere büyük günah meselesi, Allah'ın sıfatları, insanın iradi fiilleri, Kur'an'ın mahluk olup-olmadığı gibi siyasi ve fikri/itikadî tartışmaları gündeme getirmişti."},{"k":"p","x":" **Dış Faktörler**: Bunlar daha ziyade varlığın mahiyeti, cevher, araz, hareket, sükun gibi felsefi konular üzerinde yoğunlaşmakta idi. Fetihlerle genişleyen İslam coğrafyasına farklı din ve inançlara mensup insanlar dâhil olmuştu. Bunların İslam'a yönelttiği ciddi itirazlara cevap verilmesi gerekiyordu. İşte bunu Mu'tezîle ekolüne mensup âlimler yapmaya çalışmıştır. Bu metot, nakli yani dini nasları delil kabul etmekle birlikte akaid konularında akla da önem veren, akıl ile naklin çatışır gibi göründüğü yerlerde aklın ışığı altında nakli te’vil eden bir metottur."},{"k":"p","x":"Ekolün teşekkül sürecinde etkili olan âlimlerin başında mezhebin kurucusu kabul edilen **Vâsıl b. Ata** ve **Amr b. Ubeyd** gelmektedir. Bunlar, **\"el-menzile beyne'l-menzileteyn”** esası başta olmak üzere bazı görüşleri ortaya atmışlar ise de, bu görüşlerin düzenli bir sistem haline gelmesi **Ebu'l- Hüzeyl-el-Allâf** (ö. 227/841), **Bişr b. Mu'temir** (ö. 210/825), **İbrahim en-Nazzam** (ö. 221/835) gibi önemli alimlerin elinde gerçekleşmiştir."}]},{"h":"Mu'tezîle'nin Tarihçesi","b":[{"k":"li","x":"İç savaşlarda Müslümanların birbirlerini öldürmeleri **\"kebire”** (büyük günah) meselesini gündeme getirmişti. İşte böyle bir dönemde II. (VIII.) yüzyılın başlarında Basra'da, büyük günah işleyen kişi hakkında Haricîler'le Mürcie'nin ileri sürdüğü görüşlere karşı Vâsıl b. Ata (ö. 131/748) ve Amr b. Ubeyd'in (ö. 144/761) farklı bir teori ortaya koymalarıyla Mu'tezîle ekolünün tarih sahnesine çıktığı kabul edilir."},{"k":"li","x":"Emevî valilerinin Horasan'da ihtida edenlerden cizye toplaması Mu'tezililer'in tepkisini çekmişti. Mu'tezîle mensupları, fiili olmasa da sözlü olarak Emevîlerin uygulamalarını eleştirmiş, ancak Hariciler gibi açık tavır da almamışlardı. Yöneticilerden uzak duran **Vâsıl b. Ata**, İslam dünyasının çeşitli bölgelerine gönderdiği davetçilerle birçok taraftar kazanmıştır."},{"k":"li","x":"Vâsıl'ın ölümünden sonra kayın biraderi **Amr b. Ubeyd** faaliyetlerini Basra ve Bağdat'la sınırlı tuttu. Bazı Mu'tezililer, Muhammed b. Abdullah en-Nefsüzzekiyye isyanına katılmıştı. Halife, isyana destek veren bu Mu'tezilîleri takip altına almış, bir bakıma i'tizal görüşünün yayılmasını kısıtlamıştı. Bu itibarla, Amr döneminde Mu'tezile'nin yeterince yaygınlaşma dığı söylenebilir."},{"k":"li","x":"**Harunürreşid'** in (ö. 193/809) iktidara gelmesiyle Mu'tezilîler yeniden itibar görmeye başladı. Mu'tezili âlimlerin bilgisine ve ikna gücüne önem veren halife, bazılarını tebliğ ve irşat için Çin'den Bizans'a kadar uzanan bölgeye davetçi olarak gönderdi."},{"k":"li","x":"**Me'mun** 'un iktidara gelmesiyle birlikte (218/833) ekolün yıldızı parlamış, âdeta altın dönemini yaşamıştır. Halife, Araplara ve İranlılara karşı Türklerden, Ehl-i Hadis ve Şia'ya karşı Mu'tezililer'den istifade etme siyaseti gütmüştür. Mu'tezîle alimleri (Bişr b. Mu'temir (ö. 210/825), Me’mun'un iktidarda olduğu dönemde sarayda gerçekleştirilen ilmî tartışmaların vazgeçilmez gözdeleri olmuş ve böylece Abbasi sarayında nüfuz elde etmişlerdir. Bu bağlamda tevhit esasının bir gereği olarak tartışılan **\"halku'l-Kur'an\"** meselesi,"},{"k":"li","x":"Me’mun döneminden itibaren devletin resmi politikası haline dönüştü ve Kur'an'ın mahluk olduğunu kabul etmeyenler baskı görmeye **(mihne)** başladı. Bu politikanın izlenmesinde vezir **Ahmed b. Ebû Duad'** ın (ö. 240/854) ismi ön plana çıkmaktadır. Mihne siyasetinin halife **Mu'tasım** (ö. 227/842) ve **Vasık** (ö. 232/847) dönemlerinde de aynen devam ettirildiği bilinmektedir."},{"k":"li","x":"Ancak **Mütevekkil** halife olunca (ö. 247/861) devletin Mu'tezile'yi destekleme siyasetine son verdiği gibi, Mu'tezili âlimlere de sınırlama getirmiş, bir bakıma onları tasfiye etmiştir."},{"k":"li","x":"Teoride ferdin hürriyetini savunan Mu'tezîle’nin uygulamada baskıcılığa destek vermesi onun çöküşünü hızlandırmıştı. Öte yandan **Matüridî** ile **Eş'arî'nin** Sünni kelam ekollerini kurmaları Mu'tezile için ağır bir darbe oldu."},{"k":"li","x":"Abbasîlerin güç kaybedip **Şii Büveyhoğullarına** mahkûm olmaları (320/932) ve özellikle ikinci Büveyhi hükümdarı **Adudüddevle** ’nin Mu'tezilî âlim ve devlet adamı Sâhib b. Abbâd'ı vezir yapması üzerine Mu'tezîle yeniden ilgi ve alaka görmeye başladı. Nitekim **Kâdi Abdülcebbâr** da bu dönemde kadılkudâtlığa tayin edilmiştir."},{"k":"li","x":"**Gazneli Mahmud'** un Büveyhî yönetimine son vermesi üzerine (420/1029) Mu'tezili âlimler tamamen hamisiz ve Horasan bölgesine göç etmek zorunda kaldılar."},{"k":"li","x":"Gaznelileri mağlup eden Tuğrul Bey'in veziri Kündürî (ö. 456/1064), aşırı bir Mu'tezîle taraftarıydı. Ancak Kündüri'nin görevden alınmasıyla birlikte (456/1064) Mu'tezile'nin siyasi desteği sona erdi."},{"k":"li","x":"Alparslan'ın veziri ve koyu bir Eş'arî taraftarı olan **Nizamülmülk** sürgüne gönderilen Sünni-Eşarî âlimlerin geri dönmesini sağladı ve bunlar adına medreseler açtırdı. Ayrıca devlet desteğini arkasına alan **Cüveynî** ve **Gazzâlî** gibi Sünni otoritelerin yönelttiği tenkitler sonucu Bağdat ve civarında tutunamayan Mu'tezililer, Horasan ve Hârizm bölgelerine göç ettiler."},{"k":"li","x":"Burada Mu'tezilî gelenek özellikle Cârullah **ez-Zemahşerî** (o. 538/1144) tarafından devam ettirildi. Zemahşerî, el-Keşşaf adlı tefsiriyle sadece Mu'tezililerin değil Sünnilerin de takdirini kazandı."},{"k":"li","x":"Sonraki dönemlerde Mu'tezîle, Sünni dünyadan silikleşmişse de tamamen yok olmamış, **Yemen Zeydiliği** ve kısmen **İmamiyye** içinde varlığını sürdürmüştür."}]},{"h":"Mu'tezîlenin Kolları","b":[{"k":"p","x":"Abbasîler devrinde Muîtezile mezhebi Basra ve Bağdat kollarına ayrılmış, bu kollar zamanla iki okul haline dönüşmüştür. Her iki okulda beş esası kabul etmekle birlikte ayrıntıda farklı görüşler benimsemiştir."},{"k":"h","x":"a. Basra Okulu"},{"k":"li","x":"İlk temsilcisi, mezhebin kurucusu da kabul edilen **Vâsıl b. Ata'** dır. Vâsıl mezhebin tevhid, menzile beyne'l-menzileteyn ve emir bi'l-ma’rûf nehiy ani'l-münker; halefi **Amr b. Ubeyd** ise adalet, vaad ve vaid esaslarını geliştirdi."},{"k":"li","x":"Usûl-i hamseden oluşan inanç sisteminin teşekkülü **Ebü'l-Hüzeyl el-Allaf'ı** n el-Usûlü'l- hamse adlı kitabıyla tamamlanmıştır. Allâf'tan sonra en meşhur isimler **İbrahim en- Nazzam**, ve **Câhiz** 'dir (Eserleri: El-Beyan ve't-Tebyin, Kitabu'l-Hayavan, Resailü'l-Cahiz, Kitabu'l-Buhala, Kitabu'l-'Usmaniyye)."},{"k":"li","x":"Daha sonra Basra Mu'tezîlesinin en meşhur temsilcileri Ebû Ali el- **Cübbâi** (ö. 303/916) ve oğlu Ebû Hâşim **el-Cübbâi'dir**. Bu döneme gümüş çağ denir."},{"k":"li","x":"Bu okulun son dönemdeki en önemli temsilcisi ise **Kâdi Abdülcebbâr el-Hemedâni** 'dir (Eserleri: Şerhu Usûli Hamse, el-Muğni, Tesbitü delâili'n-nübüvve). O, Mu'tezile düşüncesinin kayda geçmesinde büyük rol oynamıştır. Kâdi Abdülcebbâr, ilmi olduğu kadar siyasi bağlantılarıyla da yaşadığı dönemde dikkat çekmiştir."},{"k":"h","x":"b. Bağdat Okulu"},{"k":"li","x":"Bu okulun kurucusu ve ilk önemli temsilcisi **Bişr b. Mu'te mir** (ö. 210/825)'dir. Bişr, Harunürreşid'in veziri Fazl b. Yahya el-Bermekî ile sıcak ilişkiler kurmuş ve bu vesile ile görüşlerini saray çevresine benimsetmeye çalışmıştır. En meşhur öğrencileri Sümame b. **Eşres**, Ebû Musa **el-Murdâr** ve Ahmed b. **Ebu Duâd'** dır. **Ebu Duâd** Me'mûn ile tanışmış, Mu'tezilî görüşlerin yönetim tarafından desteklenmesini sağlamıştır. Ayrıca Ebü'l-Hüseyin **el-Hayyât** da Mu'tezîle ekolünün savunulmasında önemlidir. Bu okulun müteahhir âlimlerinden olan Ebü'l-Kasım **el-Kâbî el-Belhî**, Tirmiz'de açtığı medrese ile İslam düşüncesinde silinmez izler bırakmıştır."},{"k":"li","x":"Basra Okulu siyasetten uzak kalırken, Bağdat Okuluna mensup âlimler, Abbasîlerin başkentinde yaşamalarının etkisiyle olacakki daha fazla siyasete müdahil olmuşlardır."},{"k":"li","x":"Öte yandan Basra Mu'tezilesi fikri mücadeleden yana olan, usul ve füruda aklı ve vahyi birlikte değerlendiren bir okuldur. Buna karşılık daha çok amelî ve siyasi alanda temayüz eden Bağdat Mu'tezilîleri, mezhebin görüşlerinin emri bi'l-ma'rûf çerçevesinde devlet eliyle etkili bir şekilde yayılması taraftarıydı."},{"k":"li","x":"Bağdat ekolü, imamete daha çok vurguda bulunmuştur. Bu bakımdan onları Basralılardan ayıran en önemli görüş, Hz. Ali'nin fazileti konusudur. Bağdat Mu'tezilesi, Hz. Ali'yi sahabenin en üstünü kabul ederken, onlar, Hz. Ali'nin sahabenin en faziletlisi olduğu halde ondan daha aşağı derecede olan bir başka sahabinin halife olmasını caiz görmeleri anlamında \"imametü'l-mefdul\" görüşünü kabul ettiler. Basralılar ise en erdemli olanın imamet makamına getirilmesini öngören “imamette efdaliyet\" görüşünü benimsediler. Bu itibarla, Basralılar, Hz. Peygamber'den sonra sahabenin en faziletlişi ola rak sırasıyla Hz. Ebû Bekir, Ömer, Osman ve Ali'yi kabul ettiler."}]},{"h":"Mu'tezîlenin Temel Görüşleri","b":[{"k":"p","x":"İtikadî alanı sistematik bir şekilde ifade eden ilk mezhep Mu'tezîle'dir. Başlangıçtan itibaren Mu'tezile kelamcıları İslam dininin temel ilkelerini **“usûl-i hamse”** başlığı altında ele almışlardır. Kâdi Abdülcebbâr usûl-i hamse’den birine dahi muhalefet edenin bazan kâfir, bazan fasık, bazan da muhti (hatalı) olacağını kaydeder."},{"k":"h","x":"a. el-Menzile Beyne'l-Menzileteyn (İki Mevki Arasında Bir Yer)"},{"k":"li","x":"Bu kavram, büyük günah işleyen bir Müslümanın ne mümin ne de kâfir olduğunu, bu ikisi arasında bir yerde bulunduğunu ve bu günahından tövbe etmediği takdirde ebedî olarak cehenneme gideceğini, ama cezasının kâfirlerden daha hafif olacağını ifade eder. Mu'tezîle bu kişiyi **\"fasık\"** diye nitelendirmektedir; onlara göre fasık tövbe etmeden öldüğü takdirde ebediyen cehennemde kalacaktır."},{"k":"li","x":"Mezhebin teşekkülünde oynadığı rolün önemine binaen bu ekol mensuplarına **\"Menâziliyye\"** adı dahi verilmiştir. Dönemin en önemli tartışmalarından birinin, Müslüman olduğu halde büyük günah işleyen bir kimsenin dinî konumunun ne olacağıdır. Vasıl, bu yaklaşımıyla farklı görüşler arasında ortak bir nokta bulmayı amaçlamış; bu görüşünü siyasi alana da uygulayarak Hz. Ali ile Hz. Muaviye taraftarlarından birinin hatalı olduğunu, fakat tespitinin mümkün bulunmadığını, dolayısıyla haklarında karara varmayıp konuyu Allah'a havale etmenin gerektiğini söylemiştir."},{"k":"li","x":"Vasıl, **“el-menzile\"** görüşüyle amelin imanın bir parçası olduğunu kabul etmektedir. Bu kavram çerçevesinde iman, küfür, nifak, fısk, kebire ve mürtekib-i kebire gibi kavramlar tartışılmıştır."},{"k":"h","x":"b. Vaad ve Vaid Esası (Mükâfat ve Ceza Verme Sözü)"},{"k":"li","x":"Mu'tezîleye göre **vaad**, Allah'ın iyilik yapanları Kur'an'da söz verdiği şekilde mutlaka mükafatlandırması ve bu hususta sözünden asla dönmemesidir. **Vaîd** de kötülük yapanlar ve günah işleyenler için belirlemiş olduğu cezaları mutlak uygulaması ve bu husustaki tehdidinden asla vazgeçmemesidir."},{"k":"li","x":"Diğer İslam mezheplerine göre Allah vaadinden asla dönmez, ancak vaidinden dilerse dönebilir ve kötülük yapanları dilerse affedebilir. Mu'tezîle ise, Allah'ın vaadinden dönmediği gibi, vaidinden de dönmeyeceğini iddia eder. Onlara göre dünyada iyilik yapanlar mükafatlandırması, günah işleyenleri de cezalandırması zorunludur. Dolayısıyla büyük günah işleyen bir kimsenin eğer tövbe etmemişse affedilmesi vaid ile alakalı ayetlerin içeriğine ters düştüğünden kabul edilmesi söz konusu olamaz."},{"k":"li","x":"Mu'tezile bu başlık altında iman, fısk, küfür, kebire, tövbe, kötülüklerin iyilikleri boşa çıkarması, iyiliklerin günahlara kefaret olması, sevap, ikab, şefaat, ivaz, kabir azabı gibi ahiret ahvali, bunların maddî varlıklara tekabül edip etmediği, büyük günah işleyenlerin cehenneme girdikten sonra oradan bir daha çıkmayacakları gibi konuları ele almaktadır."},{"k":"h","x":"c. Emri bi'l-ma'ruf ve'n-nehy ani'l-münker (İyiliği Emretmek Kötülükten Sakındırmak)"},{"k":"li","x":"Mu'tezîle'ye göre her Müslümanın iyiliği emretmesi ve kötülükten sakındırması zorunlu bir görevdir. Mu'tezililer, ilk zamanlar bu esası uygulayarak Berahime, Mecusilik, Yahudilik, Hristiyanlık gibi dinlere; Mücessime, Müşebbihe, Rafizîlik, zındıklık gibi mezhep ve akımlara karşı İslam'ı güçlü bir şekilde savunmuş, bu amaçla Horasan ve Maveraünnehir'e kadar gitmişlerdir."},{"k":"li","x":"Sonraki devirlerde bu tutumlarını değiştirerek muhalefette iken bazı isyan hareketlerini desteklemede olduğu gibi, iktidarda iken mihne olaylarında olduğu gibi muhalifleri yola getirme ve hasımları susturma hususunda bu esastan faydalanmışlardır."},{"k":"li","x":"Bu prensibin zulme karşı güçle karşı koyma ve adil olmayan yönetime isyan etme şeklinde siyasi bir boyutu, iyiliğin yerleştirilmesi ve kötülüğün ortadan kaldırılması şeklinde de ahlaki bir yönü bulunmaktadır."},{"k":"h","x":"d. Tevhid"},{"k":"li","x":"Mu'tezîle mensuplarının tevhid konusuna yaptıkları bu vurgu onların özellikle sıfatlarla ilgili duyarlılıklarından kaynaklanmaktadır. Çünkü onların döneminde İslamî çevrede oluşan gruplar sıfatlar hakkında farklı fikirler öne sürüyor, Hıristiyanlar teslis inancına inanıyorlardı. Bu sebeple Mu'tezîle, tevhid prensibini Allah Teâlâ'yı sıfatlardan arındırma anlayışı üzerine inşa etmiştir."},{"k":"li","x":"Onlar, Allah'ın her şeyden münezzeh olduğu fikrini korumak endişesiyle Kur'an ve hadiste teşbih ifade eden bütün ifadeleri Allah'ın zatından ayrı olmaları anlamında yorumlamıştır. Teşbih ve tecsim sapkınlığına düşmemek ve teaddüd-i kudemaya meydan vermemek için kadim manaları zattan ayrı kabul etmemiş, Allah Teâlâ'nın zatının havadise mahal teşkil etmemesi için de hadis manaları reddetmiştir."},{"k":"li","x":"Onlara göre Allah, zatî sıfatlarının kaynağıdır. Bu sebeple O, zâtıyla alim, zâtıyla hay, zâtıyla semi ve zâtıyla basîr'dir. Ancak O'nun için hayat, ilim, vb. sıfatlardan -teaddüdü kudema olacağından- söz edilemez."},{"k":"li","x":"Sıfatlar üzerinde yapılan bu tartışmalar onları, yed, vech, istiva, semada oluş gibi Kur'ani ifadeleri tenzih ilkesine göre yorumlamaya, Kur'an'ın mahluk oluşuna ve Ruyetullahın imkansızlığı görüşüne itmiştir."},{"k":"h","x":"e. Adl (Adalet)"},{"k":"li","x":"Adl, Allah'ın iyi (hasen) fiilleri işlemesi, kötü (kabih) fiillerin meydana gelmesinde etkisinin bulunmamasıdır. Bu, bütün fiillerinin hikmet, adalet ve isabet niteliği taşıması demektir. Dolayısıyla kötü fiillerin Allah tarafından yaratılması caiz değildir."},{"k":"li","x":"Onlara göre, irade hürriyeti bulunmayan bir insanın Allah tarafından sorumlu tutulması O'nun adalet ve hikmetiyle bağdaşmaz. Bu ilkeden hareketle Mu'tezîle, insanın kendi fiilini yarattığı, Allah'ın insanları kendi iradelerinde hür bıraktığı ve bu sebeple onları sorumlu varlıklar olarak kabul ettiği gibi meseleleri ele almıştır."}]},{"h":"Mu'tezile'nin Diğer Bazı Görüşleri","b":[{"k":"li","x":"**Ru'yetullah**: Görme işini dünya şartlarında düşünüp Allah'ın zaman ve mekandan münezzeh olduğunu ileri sürerek O'nun asla görülemeyeceğini iddia etmiş ve bu anlama gelebilecek ayet ve hadisleri tevil yoluna gitmiştir."},{"k":"li","x":"**Halku'l-Kur'an**: Mu'tezile, tevhit prensibinin bir gereği olarak kelam sıfatının Allah'a nispet edilmesine karşı çıkmış ve kelamullah'ın mahluk olduğu görüşünü savunmuştur. (Mihne süreci)"},{"k":"li","x":"**Şefaat**: Onlara göre hem adalet hem de vaad ve vaid prensipleri ahirette şefaatin olmamasını gerektirir. Çünkü Allah vaad ve vaidinden dönmeyeceğine göre günahkarların bağışlanması mümkün değildir. Bu itibarla Hz. Peygamber'in ümmetine olan şefaati sadece cennetliklerin mertebelerinin artırılması şeklindedir."},{"k":"li","x":"**İmâmet**: Bu konuda müttefik değillerdir. Onlar, temelde imametin gerekli bir kurum olduğunu kabul ederek devlet başkanını tayin görevinin Müslüman toplumun seçkinlerine ait olduğunu ileri sürerler. Bu konuda her çağın koşulları dikkate alınmalıdır. İmam olacak kişinin adil olması, doğruluğu ilke edinmesi, bilgili olması, Kitap ve Sünneti bilerek bunlarla hüküm vermesi oldukça önemlidir. İmamet konusunda **efdaliyetin** (Basra) gerektiği fikrini savunanlar ve **mefdul imamı** (Bağdat ekolü) kabul edenler diye iki ana gruba ayrılırlar."},{"k":"p","x":"**7. Mu'tezîle'nin İslam Düşüncesine katkıları:** İlk Mu'tezili bilginlerin İslam akaid esaslarının yerleşmesi, özellikle müdafaa ve muhafaza edilmesi konusunda büyük hizmetler verdiklerini çoğu araştırmacı kabul etmektedir. Diğer dinlerin hâkim olduğu coğrafyalarda İslam'ın tebliğinde, yayılmasında, zındıklık gibi karşıt akımların önünün kesilmesinde Mu'tezile'nin önemli katkıları olmuştur. Yine nübüvvet müessesesinin müdafaası da önemlidir. Onlar, İslam'ı savunmak için nakli delillerle yetinmemiş, aklı ve mantığı da işin içine katmıştır. Bu doğrultuda Mu'tezile'nin geliştirdiği bu metoda kelam denilmiştir. Böylece Ehl-i Sünnet kelamının oluşmasında büyük rolünün olduğu kabul edilmektedir. (Cübbai, Eş'ari ve üç kardeş meselesi)"},{"k":"p","x":"Mu'tezîle kelamcıları, hür fikirli oluşları ve taklidi reddetmeleri sebebiyle çekinmeden birbirlerine muhalefet edebildiler. Mu'tezîle ekolü naslara bağlı kalmakla birlikte İslami tefekküre aklı da getirmişlerdir. İslam ilimler tarihinde kelam, belagat, cedel, münazara gibi ilimlerin onlar tarafından tesis edildiği kabul edilmektedir. Ayrıca Mu'tezîle’nin İslam dünyasında dinî ilimlerin yanı sıra tabii ilimlerin gelişmesine de büyük katkısı olmuş; özellikle tabiat ilimlerinde deney ve gözlem metodunun kullanılması sağlanmıştır."},{"k":"p","x":"Onlar doğrudan Kur'an üzerinde yoğunlaşmışlardır. Eğer bir konuda nakli delil getireceklerse bu Kur'an'dan olmalıydı. Dirayet tefsir metodu ilk defa onların başvurduğu bir yöntemdir."}]},{"h":"Mu'tezile'nin Yayıldığı Coğrafya","b":[{"k":"p","x":"Genel olarak bu ekolün mensuplarının yaygın olduğu coğrafyaya bakılınca başta Basra, Bağdat gibi ilim ve siyasetin merkezi olan şehirlerin yanında İran, Maveraünnehir, Yemen, Mağrip ve Mısır gibi çok geniş alanda etkin oldukları anlaşılmaktadır."},{"k":"p","x":"Mu'tezîle günümüzde kısmen Şii muhitlerde, yoğun olarak da Yemen'deki Zeydiyye içinde varlığını sürdürmektedir. Ancak günümüzde Mu'tezîle mezhebine mensubiyeti ile bilinen herhangi bir ülke bilinmemektedir."}]},{"h":"Kavramlar ve Hızlı Tekrar","b":[{"k":"d","t":"İ'tizâl","x":"Ayrılma, uzaklaşma; Mu'tezile adının kaynağı."},{"k":"d","t":"el-Usûlü'l-hamse","x":"Mu'tezile'nin beş esası: tevhid, adl, va'd-vaîd, el-menzile beyne'l-menzileteyn, emr-i bi'l-ma'rûf."},{"k":"d","t":"el-Menzile beyne'l-menzileteyn","x":"Büyük günah işleyenin ne mümin ne kâfir, fâsık olduğu görüşü."},{"k":"d","t":"Mihne","x":"Abbâsîler döneminde Kur'an'ın mahluk olduğunu kabul etmeyenlere uygulanan sorgulama ve baskı."},{"k":"d","t":"Aslah","x":"Allah'ın kulları için en uygun olanı yapmasının gerekliliği görüşü."}]}],"ht":[{"s":6,"x":"Mu'tezile, Vâsıl b. Atâ'nın büyük günahkâr meselesinde Hasan-ı Basrî'den ayrılmasıyla doğdu."},{"s":6,"x":"Me'mûn, Mu'tasım ve Vâsık dönemlerinde resmî mezhep oldu; mihne uygulandı."},{"s":6,"x":"Basra okulu: Vâsıl, Amr b. Ubeyd, Allâf, Nazzâm, Câhız, Cübbâîler, Kādî Abdülcebbâr. Bağdat okulu: Bişr b. Mu'temir, Sümâme, Murdâr, Hayyât, Ka'bî."},{"s":6,"x":"Beş esas: tevhid, adl, va'd-vaîd, el-menzile beyne'l-menzileteyn, emr-i bi'l-ma'rûf ve nehy-i ani'l-münker."}],"oz":{"t":"Ek Ünite: Mu'tezile · Özet","intro":"Ünitenin özü: Mu'tezile'nin adı ve doğuşu, tarihi, Basra ve Bağdat okulları, beş esası ve diğer görüşleri.","s":[{"h":"Ad ve Doğuş","b":[{"k":"li","x":"\"Ayrılan\" demektir. **Vâsıl b. Atâ** (ö. 131/748), büyük günah işleyenin durumu konusunda hocası **Hasan-ı Basrî**'nin meclisinden ayrılıp \"ne mümin ne kâfir, ikisi arasında bir yerde\" görüşünü savununca Hasan \"i'tezele annâ\" (bizden ayrıldı) demiş, ad buradan doğmuştur."},{"k":"li","x":"Kendilerine **ashâbü'l-adl ve't-tevhîd**, **Adliyye**, **ehl-i hak** derler; muhalifleri kaderi inkâr ettikleri için **Kaderiyye**, Cehm b. Safvân'dan etkilendikleri için **Cehmiyye** adlarını kullanmıştır."},{"k":"li","x":"Kaderiyye'nin (Ma'bed el-Cühenî, Gaylân ed-Dımaşkī) kader görüşleriyle birleşmiştir; tercüme faaliyetlerinden en çok etkilenen mezheptir."}]},{"h":"Tarihçe","b":[{"k":"li","x":"Abbâsî halifeleri **Me'mûn**, **Mu'tasım** ve **Vâsık** dönemlerinde resmî mezhep oldu; vezir Ahmed b. Ebû Duâd'ın etkisiyle Kur'an'ın mahluk olduğunu kabul etmeyenler baskıya (**mihne**) maruz kaldı."},{"k":"li","x":"Resmî destek sona erdikten sonra Büveyhîler döneminde Kādî Abdülcebbâr'ın kadılkudâtlığıyla yeniden canlandı."}]},{"h":"Okullar","b":[{"k":"tbl","r":[["Basra okulu","Bağdat okulu"],["Vâsıl b. Atâ, Amr b. Ubeyd, Ebü'l-Hüzeyl el-Allâf (el-Usûlü'l-hamse), Nazzâm, Câhız, Ebû Ali ve Ebû Hâşim el-Cübbâî (\"gümüş çağ\"), Kādî Abdülcebbâr","Bişr b. Mu'temir (kurucu), Sümâme b. Eşres, Ebû Mûsâ el-Murdâr, Ahmed b. Ebû Duâd, Ebü'l-Hüseyin el-Hayyât, Ebü'l-Kāsım el-Ka'bî el-Belhî"],["Siyasetten uzak; fikrî mücadele; imamette efdaliyet","Siyasete daha yakın; Hz. Ali'nin üstünlüğü ve mefdulün imameti"]]}]},{"h":"Beş Esas (el-usûlü'l-hamse)","b":[{"k":"n","n":1,"x":"**Tevhid:** Sıfatlar zatın aynıdır; rü'yetullah ve teşbih reddedilir; Kur'an mahluktur."},{"k":"n","n":2,"x":"**Adl:** Allah zulmetmez; insan kendi fiillerinin yaratıcısıdır; Allah kulları için en uygun olanı (aslah) yapar."},{"k":"n","n":3,"x":"**Va'd ve vaîd:** Allah vaadini ve tehdidini mutlaka yerine getirir; tövbe etmeyen büyük günahkâr ebedî cehennemliktir."},{"k":"n","n":4,"x":"**el-Menzile beyne'l-menzileteyn:** Büyük günah işleyen ne mümin ne kâfirdir, **fâsık**tır."},{"k":"n","n":5,"x":"**Emr-i bi'l-ma'rûf ve nehy-i ani'l-münker:** Gerektiğinde güç kullanarak da yerine getirilmesi gereken bir görevdir."}]},{"h":"Diğer Görüşler ve Yayılma","b":[{"k":"li","x":"Hüsün ve kubuh akılla bilinir; akıl nakilden önce gelir; şefaat büyük günahkârlar için değildir; kabir azabı ve keramet gibi konularda farklı görüşler."},{"k":"li","x":"Irak (Basra, Bağdat) merkezli olarak İran, Horasan, Yemen ve Mağrib'e yayıldı; Zeydiyye ve İmâmiyye kelâmını etkiledi."}]}]}}];
