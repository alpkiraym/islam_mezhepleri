abilecek bir dönemde itikadî ve siyasi açıdan çeşitli bölünmelere uğradı ve birçok kola ayrıldı. Bu fırkalar arasında **Vehbiyye** ve **Nükkâriyye** gruplarını özellikle vurgulamak gerekir."}]},{"h":"İbâziyye’nin Görüşleri","b":[{"k":"h","x":"a. Siyasi Görüşleri"},{"k":"p","x":"**1.** İbâziyye, imamların Kureyş'ten olması yolundaki anlayışı reddeder. İmametin vasiyet veya tayinle değil cemaatin ittifakı gerçekleşeceği hususu temel prensiplerindendir. Onlara göre imamet için soy ve nesep önemli değildir. Lider mümin vasfını taşıdıktan başka ilim, züht ve adalet vasıflarını da taşımak zorundadır. Bu nitelikleri taşıyan herkes imam/ lider/devlet başkanı olabilir. Bu görüşleri sebebiyle pek çok gayr-i Arap unsurun Haricî saflarına katıldığı bilinmektedir."},{"k":"p","x":"**2.** Seçim için gerekli olan şart biattir. Biat iki kademeli olarak yapılır. Mevcut imam, bir sonraki imamın seçilmesi için şura oluşturur, şuradan çıkan sonuç halka sunulur ve halkın onayı alınır. Bu ikinci kademe çok önemlidir. Şayet halk isteyerek biat etmemişse seçilen aday imam unvanına sahip olamaz, bunun yerine \"sultan\" ve \"melik” gibi isimlerle anılır."},{"k":"p","x":"**3.** İmamın görevi Kur'an'ın hükümlerini harfiyyen yerine getirmek ve adaleti sağlamaktır."},{"k":"p","x":"**4.** İmam, Allah'ın kitabından ayrılır, sapkınlığa düşerse veya halkına zulmederse azledilebilir. **5.** Seçilen imamdan daha faziletli birisi cemaat içinde varsa, genel kanaat seçilen göreve devam eder. Efdal-mefdul tartışmasında Vehbiyye ve Nükkâriyye ihtilaf etmişlerdir."},{"k":"p","x":"**6.** İslam coğrafyasının farklı bölgelerinde aynı anda birden fazla \"imam” bulunabilir."},{"k":"h","x":"b. İtikadi Görüşleri"},{"k":"p","x":"**1.** Kur'an-ı Kerim, gerek inanç gerekse pratik hayat açısından yegâne devlet nizamıdır."},{"k":"p","x":"**2.** İbâzîyye, kendi dışındaki Müslümanları ve muhaliflerini müşrik değil \"nimeti inkâr edenler anlamında kâfir\" olarak görmüştür. Onların sadece savaş mühimmatı ganimet olarak alınabilir. Onların bulunduğu bölge iman yurdu değil, tevhit yurdudur."},{"k":"p","x":"**3.** Ruyetüllah ne dünyada ne de ahirette mümkün değildir. (Mutezile'den etkilendiler)"},{"k":"p","x":"**4.** Günahkâr kimse için şefaat söz konusu değildir."},{"k":"p","x":"**5.** Büyük günah işleyen müşrik değil, muvahhiddir. Ancak Müslüman bir kişi, günahları inkâr ettiği veya onları işleme konusunda israr ettiği takdirde şirke düşmüş olur. İbâzîler küfrü, \"nimet küfrü\" ve \"şirk küfrü” olmak üzere ikiye ayırırlar ve büyük günah işleyenin “nimet küfrü\" içinde olduğunu söylerler. Büyük günah işleyen bir kimsenin ceza çekmesinde ve cehenneme girmesinde şüphe yoktur. Ancak cehennem ateşinden ebediyyen kurtulmanın tek çaresi büyük günah işleyenin tövbe etmesidir. Onlara göre tövbe kapısı açıktır."},{"k":"p","x":"**6.** Harici olmayan Müslümanların miraslarını helal, onlarla evlenmeyi caiz görüp şahitliklerini kabul ederler."},{"k":"p","x":"**7.** Bütün İbâzîler \"emr-i bi'l ma'ruf nehy-i ani'l-münker\" vazifesini yapmak zorundadır."},{"k":"p","x":"**8.** Kur'an'ın mahluk olduğunu savunurlar. (Kıdem sıfatı en önemli sıfattır) Ancak Allah'ın dilemesi olmadan hiçbir şeyin gerçekleşemeyeceğini kabul ederler. Bu itibarla, kulların fiillerinin mahluk olduğunu savunurlar."},{"k":"p","x":"**9.** Sahabe, -fasık olduğu bildirilenler hariç- hepsi adalet sahibidir."},{"k":"p","x":"**10.** İsti'raz caiz değildir."},{"k":"not","x":"Ezarika mensupları, kendilerinden olduğunu iddia eden bir kimseyi imtihana tabi tutarlar, -kendilerinden olmayan birini öldürmek gibi- ağır bir vazife ona verirler, eğer verilen görevi yerine getirmezse onun münafık olduğuna hükmedip öldürürlerdi. Ancak istiraz uygulamasını Yahudi ve Hristiyanlara uygulamayı haram kabul etmişlerdir. Bedir ashabından Abdullah b. Habbab b. Eret'in bu yolla şehit edildiği nakledilir."}]},{"h":"İbâziyye'nin Günümüzdeki Durumu","b":[{"k":"p","x":"İbâzîyye, diğer Harici fırkalardan farklı olarak günümüze kadar gelmeyi başaran tek Harici fırkasıdır. Bunlar, muhtemelen diğer İslami gruplardan da etkilenerek başlangıçtaki aşırı Harici görüşleri yumuşatmışlardır. İbâziler günümüzde Uman başta olmak üzere Hadramut, Zengibar, Libya, Tunus, Cezayir ve Batı Sahra'nın çeşitli yerleşim alanlarnda yaşamaktadırlar. Uman'da 1992 yılı itibariyle 1.500.000'luk nüfusun % 40-45'ini İbâzîler oluşturmaktadır. Bu gün Gâfiri ve Hinâ kabileleri bu mezhebe mensupturlar. 1972'den beri ülkeyi yöneten Uman Sultanı **Kâbus b. Said**, İbâzî bir aileye mensuptur. Bu aile 1749'dan bu yana iktidarı elinde tutmaktadır. Uman devleti, İbaziyenin kültürel ve dini kaynaklarına sahip çıkarak onları bir dizi olarak yayınlamaktadır. Dünya Müslümanlan arasında İbâzî nüfusun yaklaşık olarak 2-3 milyon olduğu tahmin edilmektedir."}]},{"h":"İbâziyye: İsimlendirme ve Kuruluş","b":[{"k":"p","x":"İbâziyye, Hâricî fırkaların en mutedili kabul edilir ve günümüze ulaşan tek Hâricî koludur. Adını kurucusu sayılan **Abdullah b. İbâz**'dan alır. Kuzey Afrika ve Umman'da ad \"Ebâziyye\" diye telaffuz edilmiş, Umman İbâzîlerine \"Beyâsî\" de denmiştir. İbâzîler ise kendilerini **ehlü'l-hak**, **ehlü'l-istikāme**, **ehlü'd-da've**, **cemâatü'l-müslimîn** gibi adlarla anmış, Hâricîlikle özdeşleştirilmeye karşı çıkmışlardır."},{"k":"p","x":"Fırkanın kuruluşunda yalnız Abdullah b. İbâz değil, Mirdâs b. Üdeyye çevresi ve özellikle **Câbir b. Zeyd el-Ezdî** (ö. 93/712) belirleyici olmuştur. İbâzî kaynaklarına göre mezhebin fıkıh ve usul kaidelerini koyan, yani asıl kurucusu Câbir b. Zeyd'dir; bu yüzden \"fikir babası\" sayılır. Câbir'in takipçilerinin kendilerine İbâzî demesi III. yüzyılın sonlarında başlamıştır."},{"k":"not","x":"İbâzîler, Kur'an tefsirini, hadisi ve fıkhı ilk tedvin edenlerin kendileri olduğunu ileri sürer."}]},{"h":"İbâziyye'nin Tarihçesi","b":[{"k":"h","x":"Basra dönemi"},{"k":"p","x":"İbâzîler, Nâfi' b. Ezrak'ın Hâricî olmayan Müslümanlara yönelik aşırı görüşlerine katılmadılar. Abdullah b. İbâz silahlı isyan yerine Basra'da cemaatini gizli ve sakin biçimde korumayı seçti; Halife Abdülmelik b. Mervân ile yazıştı. Haccâc döneminde Câbir b. Zeyd ve ileri gelenler sürgün edildi. **Ebû Ubeyde Müslim b. Ebû Kerîme**, yetiştirdiği öğrenci gruplarını (**hameletü'l-ilm**) Mağrib, Yemen, Hadramut, Umman ve Horasan'a göndererek mezhebi yaydı."},{"k":"h","x":"Hicaz, Yemen ve Hadramut"},{"k":"p","x":"Ebû Hamza eş-Şârî 128/746'da Hadramut'ta Abdullah b. Yahyâ el-Kindî'yi imam seçti; \"Tâlibü'l-Hak\" diye anılan bu imamın kuvvetleri 129/747'de Mekke ve Medine'yi aldı. Ancak 130/748'de Vâdilkurâ'da Emevî kumandanı İbn Atıyye'ye yenildiler ve bu bölgedeki İbâzî hâkimiyeti dağıldı."},{"k":"h","x":"Umman"},{"k":"p","x":"Umman İbâziliği, Hadramut'taki çöküşten kısa süre sonra **Cülendâ b. Mes'ûd**'un imametiyle başladı. Abbâsîlerin bu imamı öldürmesiyle kesintiye uğradı, II/VIII. yüzyılın ikinci yarısında yeniden toparlandı. XVI. yüzyıldan itibaren imamet hânedan ve veliaht sistemiyle yürümeye başladı; 1749'dan beri ülkeyi aynı hânedan yönetmektedir."},{"k":"h","x":"Kuzey Afrika ve Rüstemîler"},{"k":"p","x":"Mezhep II/VIII. yüzyıl başlarında Mağrib'de yayıldı; Hevvâre ve Zenâte gibi Berberî kabileleri tarafından benimsendi. **Ebü'l-Hattâb el-Meâfirî** 140/757'de imam seçildi, 141/758'de Kayrevan'ı aldı, 144/761'de öldürüldü. Ardından **Abdurrahman b. Rüstem** Tâhert'te **Rüstemî imameti**ni kurdu. Bu imamet Vehbiyye ve Nükkâriyye diye bölündü; zayıflayan Tâhert 296/908'de Fâtımîlerin eline geçti."},{"k":"h","x":"Doğu Afrika ve Sudan"},{"k":"p","x":"İbâzîlik Doğu Afrika'ya III/IX. yüzyıldan itibaren Ummanlı tüccarlarla, Sudan'a ise tüccar ve dâîler aracılığıyla ulaştı."},{"k":"steps","x":["**Basra:** Abdullah b. İbâz ve Câbir b. Zeyd; gizli ve barışçı teşkilat.","**Hameletü'l-ilm:** Ebû Ubeyde'nin öğrencileri mezhebi Mağrib'den Horasan'a yaydı.","**Hadramut-Hicaz:** Tâlibü'l-Hak imameti (128-130/746-748).","**Umman:** Cülendâ b. Mes'ûd ile başlayan ve bugüne uzanan imamet geleneği.","**Mağrib:** Ebü'l-Hattâb ve Tâhert'te Rüstemî imameti (Fâtımîlerin eline geçişi 296/908)."]}]},{"h":"İbâziyye'nin İmamet Anlayışı ve Kolları","b":[{"k":"h","x":"İmamet"},{"k":"p","x":"İbâzîlere göre Kur'an devletin tek nizamıdır ve devlet başkanı belirlemek dinî bir görevdir. İmamet soy ya da tayinle değil, **seçim (biat)** ile gerçekleşir. Seçim iki kademelidir: Önce şûra veya meşâyih meclisi adayı belirler, ardından halkın biatı alınır. İmamların Kureyş'ten olması şartı reddedilir; mümin olmak, ilim, zühd ve adalet yeterlidir."},{"k":"d","t":"Kitmân","x":"İbâzîlerde imamın gizli kaldığı, cemaatin açıkça imam seçemediği dönem."},{"k":"d","t":"İmâmü'd-difâ'","x":"Cemaate saldırı olduğunda savunma amacıyla seçilen lider."},{"k":"d","t":"İmâmü'l-bey'a","x":"Normal şartlarda biatla seçilen imam."},{"k":"h","x":"Muhaliflere karşı tutum"},{"k":"li","x":"Ezârika'nın aksine ehl-i kıbleyi müşrik saymazlar; onlar **\"nimet küfrü\"** içindedir. Bu yüzden isti'râz (muhalifleri sorgulayıp öldürme) uygulanmaz; ganimet dışında muhaliflerin malları, kadınları ve çocukları haramdır."},{"k":"li","x":"Cihad, ancak başka çare kalmadığında ve önce davet yapıldıktan sonra başvurulacak bir yoldur."},{"k":"li","x":"Muhaliflerin arasında yaşayan Hâricîler tekfir edilmez."},{"k":"h","x":"Kolları"},{"k":"tbl","r":[["Kol","Kurucu / Dönem","Özelliği"],["Hârisiyye","Hâris b. Yezîd (II/VIII. yy.)","Kader konusunda Mu'tezilî görüş taşır."],["Vehbiyye","Abdülvehhâb b. Abdurrahman'ın imametiyle","Ana İbâzî gövdesini oluşturur."],["Nükkâriyye","Ebû Kudâme Yezîd b. Fendîn","Mağrib'de III/IX. yüzyılda etkili oldu, zamanla sönükleşti."],["Diğerleri","Tarîfiyye, Nefâsiyye, Halefiyye, Ömeriyye vb.","Küçük ve kısa ömürlü gruplar."]]},{"k":"h","x":"Günümüzdeki durumu"},{"k":"p","x":"İbâzîler bugün **Umman** (nüfusun yaklaşık %40-45'i), **Zengibar**, **Libya** (Züvâre ve Cebelinefûse), **Tunus** (Cerbe adası) ve **Cezayir**'de (Vercelân ve Mizab vadisi) yaşar. Toplam sayılarının 2-3 milyon civarında olduğu tahmin edilmektedir."}]},{"h":"İbâziyye'nin Dokuz İlkesi (el-Usûlü't-Tis'a)","b":[{"k":"p","x":"Mu'tezile'nin temel inanç esasları **el-usûlü'l-hamse** (beş ilke) olarak sistemleştirildiği gibi, İbâzî kelâmcılar da kendi temel esaslarını genellikle **el-usûlü't-tis'a** (dokuz ilke) başlığında toplamıştır. Ebû Zekeriyyâ el-Cennâvunî ve Âmir eş-Şemmâhî (ö. 792/1389), ümmetin bu dokuz mesele yüzünden ihtilafa düştüğünü söyler. Bazı İbâzî âlimler sekiz ilke sayarken Tebgûrîn el-Melşûtî \"el-esmâ ve's-sıfât\"ı ayrı bir onuncu ilke olarak ekler."},{"k":"tbl","r":[["İlke","İbâziyye'nin görüşü","Mu'tezile ile ilişkisi"],["1. Tevhid","Allah zatında, sıfatlarında ve fiillerinde birdir; cisim değildir ama \"şey\" ve \"mevcut\" denebilir. Teşbih ifade eden ayetler (yed, istivâ) te'vil edilir. Sıfatlar zatın aynıdır.","Mu'tezile'ye yakın; Eş'arî ve Mâtürîdîlerin \"ne aynı ne gayrı\" görüşünden ayrılır."],["2. Kader","Fiilleri yaratan Allah'tır, insan onları kesb eder (halk ve kesb). Hem Kaderiyye hem Cebriyye reddedilir. Hayır ve şerriyle kadere iman inanç esasıdır.","Mu'tezile'den ayrılır, Eş'ariyye'ye yakındır."],["3. Adalet","Allah'ın kendi mülkünde dilediği gibi tasarruf etmesidir; Allah bir şeyi yapmaya mecbur tutulamaz, O'na zulüm nispet edilemez.","Mu'tezile'nin \"aslah\"a dayalı adalet anlayışından farklıdır."],["4. Va'd ve vaîd","Allah müminlere vaat ettiği cenneti verecek, tövbe etmeden ölen büyük günahkârı ebedî cehennemle cezalandıracaktır.","Mu'tezile ile aynı."],["5. el-Menzile beyne'l-menzileteyn","Büyük günah işleyen ne tam mümindir ne müşriktir; muvahhiddir ama **nimet küfrü** içindedir.","Mu'tezile'deki \"fâsık\" yerine \"nimet küfrü\" (küfrân-ı nimet, amelî nifak) kavramı kullanılır."],["6. Lâ menzile beyne'l-menzileteyn","İman ile küfür dışında üçüncü bir hükmî ad yoktur; mükellef ya mümindir ya kâfirdir (nimet küfrü anlamında).","Mu'tezile'nin \"fâsık\" ara konumuna itirazdır."],["7. el-Emr ve'n-nehy","İyiliği emretmek ve kötülükten sakındırmak farzdır; vacip, müstehap ve mendup kısımları vardır. İmametin farz oluşu da bu ilkeye bağlanır.","Mu'tezile'nin beşinci ilkesiyle örtüşür."],["8. Velâyet ve berâet","Müslümanları dost edinmek (velâyet), kâfirlerden ve büyük günah işleyen zalimlerden uzak durmak (berâet) iman esasıdır.","Hâricî ve Şiî kelâmında öne çıkan bir kavramdır."],["9. el-Esmâ ve'l-ahkâm","Kişilere verilecek isimler (mümin, kâfir, münafık) ve bunlara bağlı dünyevî-uhrevî hükümler.","4, 5 ve 6. ilkeler bu başlıkta birleştirilebilir."]]},{"k":"not","x":"İbâzî kelâmcılar insan fiilleri konusunda tam bir birlik içinde değildir: Ebû Hazr Yağlâ b. Zeltâf fiillerin yaratıldığını savunurken Avtebî, insanın güç yetirdiği fiillerin yaratıcısı olduğunu ileri sürmüştür. Son dönem âlimlerinden Süleyman el-Bârûnî ise İbâziyye'nin bu konuda Eş'ariyye gibi düşündüğünü belirtir."},{"k":"h","x":"Değerlendirme"},{"k":"p","x":"İbâziyye, tevhid, va'd-vaîd ve emr-i bi'l-ma'rûf gibi konularda Mu'tezile'ye yakın dururken büyük günah işleyenin adlandırılması ve özellikle insan fiilleri meselesinde ondan ayrılır. Kesb nazariyesini Dırâr b. Amr, Eş'ariyye ve Mâtürîdiyye ile birlikte paylaşması, erken dönem bir fırka olarak İbâziyye'nin özgün yönlerinden biridir. Ayrıca insanın bireysel ve toplumsal sorumluluklarına verdiği önemle dikkat çeker."}]}],"ht":[{"s":11,"x":"İbâziyye: günümüze ulaşan tek ve en mutedil Hâricî kolu; adını Abdullah b. İbâz'dan alır, fikir babası Câbir b. Zeyd'dir; Ebû Ubeyde'nin hameletü'l-ilm'i mezhebi yaymıştır."},{"s":11,"x":"İmamet seçimle (biat) olur, Kureyş şartı yoktur; kitmân, imâmü'd-difâ' ve imâmü'l-bey'a dönemleri vardır. Rüstemîler Tâhert'te, Umman imameti ise bugüne kadar sürmüştür."},{"s":11,"x":"Muhalif Müslümanlar müşrik değil \"nimet küfrü\" içindedir; isti'râz yoktur."},{"s":12,"x":"İbâziyye'nin dokuz ilkesi: tevhid, kader, adalet, va'd ve vaîd, el-menzile beyne'l-menzileteyn, lâ menzile beyne'l-menzileteyn, emr ve nehy, velâyet ve berâet, esmâ ve ahkâm."},{"s":12,"x":"İnsan fiillerinde Eş'arîler gibi halk ve kesb görüşü; büyük günahkâr hakkında \"nimet küfrü\" kavramı; va'd-vaîd ve emr-i bi'l-ma'rûfta Mu'tezile'ye yakınlık."}],"oz":{"t":"Hâricîlik ve İbâdiyye · Özet","intro":"Ünitenin özü: Hâricîler kimdir, Sıffîn'den sonra nasıl ortaya çıktılar, hangi kollara ayrıldılar ve günümüze ulaşan tek kol olan İbâziyye neyi savunur?","s":[{"h":"Hâricîlik","b":[{"k":"li","x":"**Ad:** \"Ayrılan, isyan eden\" anlamındaki hurûc kökünden gelir; Hz. Ali'den ayrıldıkları için bu adı almışlardır. Toplandıkları yere nispetle **Harûriyye**, \"hüküm ancak Allah'ındır\" sloganları yüzünden **Muhakkime** de denmiştir; Abdullah b. Vehb er-Râsibî'yi lider seçtikleri için \"Vehbiyye\" diye de anılırlar."},{"k":"li","x":"**Doğuşu:** Sıffîn'de (37/657) Şamlıların mızraklara Mushaf sayfaları takmasıyla tahkime gidildi. Tahkimi önce zorla kabul ettiren grup sonra bunu küfür sayıp Hz. Ali'den ayrıldı ve **Harûrâ**'da toplandı; Abdullah b. Vehb er-Râsibî'yi emir seçtiler. Hz. Ali onları 38/658'de **Nehrevan**'da yendi; kaçanlardan **İbn Mülcem** 40/661'de Hz. Ali'yi şehit etti."},{"k":"li","x":"**Sosyal arka plan:** Çoğunluğu bedevî Arap kabilelerinden (özellikle Temîm) gelen, Kureyş otoritesini kabullenmekte zorlanan, şehirleşmenin getirdiği değişime uyum sağlayamamış, Kur'an'ı lafzî okuyan kurrâ grubudur."},{"k":"h","x":"Ayrılık gerekçeleri"},{"k":"n","n":1,"x":"Hz. Ali'nin \"Emîrü'l-müminîn\" unvanını tahkimnameden sildirmesi."},{"k":"n","n":2,"x":"Tahkimi kabul etmesi."},{"k":"n","n":3,"x":"Hakemlerin bu işe ehil olmaması."},{"k":"n","n":4,"x":"Allah'ın hüküm verdiği bir meselede insanların hüküm veremeyeceği (\"lâ hükme illâ lillâh\")."},{"k":"h","x":"Fırkaları"},{"k":"tbl","r":[["Fırka","Kurucusu","Görüşü"],["Ezârika","Nâfi' b. Ezrak (ö. 65/685)","En aşırı kol; kendilerinden olmayanları müşrik sayar, kadın ve çocuklarını öldürmeyi caiz görür, isti'râz uygular."],["Necedât","Necde b. Âmir (69/689)","Ezârika'yı ilk eleştiren koldur; küfrü \"nimet küfrü\" ve \"din küfrü\" olarak ikiye ayırır."],["Sufriyye","Abdullah b. Asfar et-Temîmî","Günahkârı müşrik sayar ama muhaliflerin kadın ve çocuklarını öldürmeyi caiz görmez."],["Acâride","Abdülkerîm b. Acred","Kâfirlerin çocukları hakkında ergenliğe kadar hüküm verilmez; Hâricîlerin yanına hicret farz değil faziletlidir."],["İbâziyye","Abdullah b. İbâz","En mutedil kol; muhalifleri \"nimet küfrü\" içinde görür, günümüze ulaşmıştır."]]},{"k":"h","x":"Ortak görüşleri"},{"k":"li","x":"**Hilafet:** Kureyşli olmak şart değildir; adil, âlim ve zâhid her Müslüman seçimle halife olabilir. Ebû Bekir ve Ömer'in hilafeti meşrudur; Osman'ın son altı yılı ve Ali'nin tahkimden sonraki dönemi meşru değildir."},{"k":"li","x":"**Amel imanın parçasıdır;** büyük günah işleyen kâfir olur (İbâziyye hariç)."},{"k":"li","x":"**Adalet** devletin temel vasfıdır; zalim imama karşı çıkmak gerekir."}]},{"h":"İbâziyye","b":[{"k":"li","x":"**Kurucu:** Abdullah b. İbâz; fikir babası **Câbir b. Zeyd** (ö. 93/712). **Ebû Ubeyde Müslim b. Ebû Kerîme**'nin yetiştirdiği \"hameletü'l-ilm\" mezhebi yaydı."},{"k":"li","x":"**Devletler:** Hadramut'ta Tâlibü'l-Hak (129/747), Mağrib'de Tâhert merkezli **Rüstemîler**, **Umman** imameti (bugün de İbâzî hânedan)."},{"k":"li","x":"**İmamet:** Seçimle (biat) olur, Kureyş şartı yoktur. Gizlilik dönemine **kitmân** denir; saldırı karşısında seçilen lidere **imâmü'd-difâ'**, normal şartlarda seçilen imama **imâmü'l-bey'a** denir."},{"k":"li","x":"**İtikad:** Sıfatlar zatın aynıdır, Kur'an mahluktur, rü'yetullah dünyada da âhirette de imkânsızdır, büyük günahkâr için şefaat yoktur ve tövbe etmezse ebedî cehennemliktir. Kader konusunda kesb görüşü (Eş'ariyye'ye yakın)."},{"k":"li","x":"**Muhaliflere bakış:** Diğer Müslümanlar müşrik değil, **nimet küfrü** içindedir; isti'râz caiz değildir, onlarla evlenmek ve miraslaşmak caizdir."},{"k":"li","x":"**Dokuz ilke (el-usûlü't-tis'a):** tevhid, kader, adalet, va'd-vaîd, el-menzile beyne'l-menzileteyn, lâ menzile beyne'l-menzileteyn, emr ve nehy, velâyet ve berâet, esmâ ve ahkâm."},{"k":"li","x":"**Günümüz:** Umman (nüfusun yaklaşık %40-45'i), Zengibar, Libya (Cebel-i Nefûse), Tunus (Cerbe), Cezayir (Mizab); toplam 2-3 milyon."}]}]}},{"t":"Şîa ve İmâmiyye","intro":"Şîa'nın adı, doğuşu ve mezhepleşmesi; dayandığı ayet ve hadisler; İmâmiyye'nin adları, oluşumu, on iki imam, gaybet, tarihçesi, inanç esasları, fıkhı ve günümüzdeki durumu.","s":[{"h":"Şia'nın İsimlendirilmesi Meselesi","b":[{"k":"p","x":"**1. Şia'nın İsimlendirilmesi Meselesi:** \"ş-y-a” kökünden gelen şia kelimesi; isim olarak “taraftar, partizan, yardımcı\" anlamlarına gelmektedir. Kur'an-ı Kerim ve hadislerdeki kullanımı bu çerçevededir. Henüz terimleşmeden önce \"Şiatu Ali, Şiatu Osman ve Şiatu Muaviye\" şeklinde belli görüşler etrafında birleşen siyasi toplulukları ifade ederdi. **Hz. Hüseyin'in (ö. 61/680) şehit** edilişinden sonra Şia, Emevîlere karşı Hz. Hüseyin'in intikamını almak, bu arada Hz. Ali ve"},{"k":"p","x":"**soyunun haklarını aramak için toplananları ifade eden siyasi bir terim olmuştur**. Nevbahti (ö. 300/912) Şia'yı tanımlarken, “Hz. Peygamber'in yaşadığı dönemde Ali taraftarlığıyla bilinen ve onun vefatından sonra da sadece Ali'ye bağlılıklarıyla tanınan ve onun imametine inananların meydana getirdiği bir firka\" olduğunu ifade ederek ilgili terimin Hz. Peygamber'in sağlığında mevcut olduğuna işaret eder."},{"k":"p","x":"**Mezhepler Tarihine ait bir terim olarak**, \"Şia, Hz. Muhammed'den sonra insanların en faziletlisi olarak Ali b. Ebû Talib'i kabul edip onun nass ve tayinle imam olduğuna, Ali'den sonra imametin kıyamete kadar onun soyundan devam edeceğine inanan toplulukların müşterek adı\" olmuştur."},{"k":"p","x":"Kullanılan en yaygın terim Şia olmakla birlikte bunun dışında **\"Rafizi\"** ve **\"Sebeiyye”** terimleri de vardır. **Rafizî** (dağılmak ve yayılmak) teriminin kökeni Zeyd b. Ali'nin Emevîlere karşı başarısız isyanına kadar gider (122/740). Bunlar, Zeyd’in Ebû Bekir ve Ömer'den kendini ayırt etmesini ve bu ikisinin büyük günah işlediğini açıklamasını istemişlerdir. Ancak İmam Zeyd, onların arzularına göre cevap vermeyince kendisini terk etmişlerdir. Bunun üzerine Zeyd b. Ali, onlara bu ismi vermiştir. Bu yaygın kabulden ayrı olarak “rafiza\" isminin Muhammed Bakır'ın ölümü üzerine imametin kendisine geçtiğini ileri süren Muğire b. Said'in imametini kabul etmeyerek onu terk edip Cafer b. Muhammed'in imametine inananların müşterek adı olduğunu belirtenler de vardır."},{"k":"p","x":"**Sebeiyye** ise, hicri I. asrın ikinci yarısından itibaren özelde Hz. Osman genelde Emevî aleyhtarlığı ve daha sonra ilk üç halife aleyhtarlığı yaparak Hz. Ali, Muhammed b. el-Hanefiyye ve oğlu Ebû Hâşim'in adı etrafında aşırı fikirler benimseyen Sebeiyye ve onun taraftarları için kullanılmıştır. Bazı kaynaklara göre, Hz. Ali hakkında aşırı fikirler ileri süren Abdullah b. Sebe taraftarları için de kullanılmıştır."}]},{"h":"Şia'nın Doğuşu","b":[{"k":"li","x":"Bazılarına göre Şiîlik, Hz. Peygamber'in sağlığında ortaya çıkmış olup, bizzat Allah Elçisinin tavsiyesi ile Hz. Ali'nin faziletini kabul eden ve ona bağlanan kimseleri kapsar"},{"k":"li","x":"Bazıları da Şiiliğin, Resulullah'ın vefatını takiben Hz. Ali'nin meşru halife olduğu talebiyle baştan sona siyasi bir hareket olarak başladığını söylerler. Nitekim nass ile tayinin Şia'da önemli bir umde olduğu dikkate alındığında Hz. Ali'nin imametinin Hz. Peygamber'in vefatıyla başlaması gerektiği anlaşılır."},{"k":"li","x":"Bazıları da şu görüşleri ileri sürdü: **a)** Hz. Osman dönemindeki olaylar sırasında, **b)** Hz. Ali'nin hilafeti döneminde, **c)** Hz. Ali'nin şehit edilmesinden sonra, **d)** Hz. Hüseyin'in şehit edilmesinden sonra meydana gelen Tevvâbun hareketiyle (688), **e)** 66/685 yılındaki Muhtar es-Sakafi olayından sonra."},{"k":"li","x":"Zikredilen hadiselerin Şiiliğin ortaya çıkış sürecinde katkısı olduğunu söylemek daha doğru olur. Esasen Ali taraftarı ile Şia arasında bir ayrım yapılması gerekir. Çünkü Hz. Ali'nin yanında yer alan sahabilerin yaşadıkları dönemde Müslümanlar büyük çoğunluğu oluşturuyorlardı. Bu bağlamda **Şiiliği temel Şiî fikirlerle başlatmak daha isabetli olacaktır**. Bu da en erken birinci asrın sonlarından on İkinci İmam Muhammed Mehdi'nin gaybete girdiği h. 260 sonrasına kadar devam etmiştir."},{"k":"li","x":"Şiiliğin İran, Arap ya da Yahudi-Hristiyan asıllı olduğu şeklinde üç farklı yaklaşım vardır. **İran asıllı olduğu görüşü daha isabetlidir.** Şiiliğin özü ile Fars kültürü arasında benzerlikler vardır. İslami fetihlerle birlikte Sasani krallığının ortadan kaldırılması Farslıların zihin dünyasında yer etmiş olan kral ve kraliyet ailesi tasavvurunu yok etmemişti. Buna göre kral ve ailesinin birtakım insanüstü vasıflar taşıdığına inanılmakta idi. Onlar bu anlayışlarını Ehl-i Beyt'e yansıtmışlardır. Ayrıca Hüseyin b. Ali'nin İran hükümdarı Yezdicürdün kızıyla evli olması sebebiyle Hz. Hüseyin'in neslini eski hükümdarlarının varisleri gibi kabul etmişlerdi. Dahası Selman-ı Farisî İran kökenli olması da Fars kültürünün Şiilikte etkin olmasına zemin hazırlamıştır. **Sonuç olarak** Şia'nın en önemli doktrininin imamet anlayışı olduğu, bununda Fars kültürünün etkisiyle şekillendiği rahatlıkla söylenebilir."}]},{"h":"Şia'nın Mezhepleşme Süreci","b":[{"k":"li","x":"Hicri I. asırda vuku bulan Tevvâbûn hareketi, Muhtar es-Sakafi isyanı ve İbn Sebe fitnesinin Şii fikirlerin teşekkülüne zemin hazırladığı kabul edilir. **Tevvâbûn hareketi**, Hz. Hüseyin'i Kufe'ye davet eden fakat yanı başlarında şehit edilmesine seyirci kalanların bu davranışlarından dolayı pişman olduklarını göstermek ve Kerbela'nın intikamını almak niyetiyle giriştikleri bir harekettir."},{"k":"li","x":"Hezimetle neticelenen Tevvâbûn hareketinden kurtulanlarla birlikte “ Allah'ın kitabı, Resulullah'ın Sünnet'i, Ehl-i Beyt'in intikamı, zayıfları savunma ve günahkarlara karşı cihat” sloganıyla ve Hz. Ali'nin Hz. Fatıma'dan doğmamış olan üçüncü oğlu Muhammed b. el-Hanefiye'nin \"imamlık\" ve \"mehdilik\"ini ileri sürerek ortaya çıkan **el-Muhtar b. Ebî Ubeyd es-Sakafi** (567/687)'dir. Mehdilik, gaib imam, rec'at ve beda fikirleri ona aittir."},{"k":"li","x":"**İbn Sebe** 'ye gelince, onun kimliği meçhul olup araştırıcılar arasında müşterek noktalar bulmak da mümkün değildir. Bazı kaynaklarda İbn Sebe, Hz. Ali'nin Tanrılığını iddia etmiş, bunun üzerine sürgüne gönderilmiş ve orada da fikirlerini yaymıştır. Öte taraftan Hz. Osman dönemindeki olaylara katılanların çoğunluğunun Güneyli olması hasebiyle onlara “Sebeiyye” sıfatının verilmiş olması da mümkündür."},{"k":"li","x":"İkinci hicri asırda ortaya çıkan Şiî karakterli fırkalar zaman zaman Muhammed el- Bakır'ın, Cafer es-Sadık'ın, Musa el-Kâzım'ın ve diğer imamların isimlerini kullanmışlardır. Aşırı Şiî fırkalar bir tarafta tutulursa genel anlamda Şiilik; Zeydiyye, İsmailiyye ve İmamiyye şeklinde üç ana grup hâlinde teşekkül etmiştir."}]},{"h":"İmâmiyye: İsimlendirme Meselesi","b":[{"k":"p","x":"**a) İmamiyye**: İmameti dinin temel unsuru kabul ettikleri için bu adla anılmışlardır. \"İmamiyye\" terimi Şia ve İsnaaşeriyye terimleri ile eş anlamlı olarak kullanılır. İlk defa ne zaman kullanıldığı meçhuldür. Ancak ilk defa Küçük Gizlilik sırasında Nevbahti'nin kaleme aldığı Fıraku'ş-Şi'a adlı eserinde zikredilmektedir. İmamiyye’nin oluşum sürecinin en az üç asır devam ettiği dikkate alınırsa imamet kavramı süreç içerisinde tekâmüle ermiş olmalıdır. İkinci yüzyılda “imamet” anlayışı ekolün değişmez esası olarak kabul edilmiş, daha sonra da küçük değişikliklerle bu inanç devam etmiştir."},{"k":"p","x":"**b) İsnaaşeriyye**: İmamiyye mensupları, imamların sayısını on iki ile sınırlandırdıkları ve on ikinci imamın dönüp geleceğini kabul ettikleri için bu isimle anıldılar. Bu kavram IV./ X. yüzyıl sonlarına kadar gündeme gelmemiştir. Kavramın ilk zikredildiği yer, Mes'udi'nin (Ö. 345/956) et- Tenbîh ve'l-israf adlı eseridir. Buna göre onlar inançlarını Hz. Peygamber'in Hz. Ali'ye: **\"Sen ve senin neslinden on iki kişi gerçek imamlardır.\"** dediği şeklindeki rivayete dayandırmaktadırlar. Daha sonra İsnaaşeriyye ile İmamiyye eş anlamlı olarak kullanılmıştır,"},{"k":"p","x":"**c) Caferiyye**: İsnaaşeriyye Şiasının **fıkıh mezhebi** nin adıdır. İmamet anlayışında Zeydiyye fırkasının dışındaki diğer fırkaların hepsi Cafer Sadık'ın imametinde ittifak etmişlerdir. Cafer Sadık, diğer imamlara nispetle daha özgür bir ortamda yaşamasından dolayı bilgisini yayma imkanı bulmuştur. Bu sebeple İsnaaşeriyye Şiası'nın fıkıhta imamı olmuştur."},{"k":"p","x":"**d) Rafiza:** “Ayrılan, terk eden\" anlamlarına gelen bu kelimenin ilk kullanılışı, Emevîlere karşı isyan eden Zeyd b. Ali'nin taraftarları arasındaki bölünmeye dayanmaktadır (Yukarıda anlatıldı). Olaylar neticesinde İmam Zeyd **\"Rafeztumûni\"** (Beni terk ettiniz) diyerek onları kendisine karşı çıkmak ve terk etmekle suçlamıştır. Genel olarak Zeydiyye’nin dışındaki Şiiler ve özellikle İmamiyye mensupları için kullanılan “Rafizi\" terimi, sonraki nesillerde İmamiyye'nin küçük düşürücü bir lakabı hâline dönüşmüştür. Bu isimlendirme, Zeydiler açısından İmam Zeyd'in terk edilmesi, Sünniler açısından da ilk iki halifenin reddedilmesini hatırlatmaktadır.“Rafizi\" isimlendirmesini başlangıçta kabul edilmese de daha sonra mezhep mensupları tarafından özel övgü ifade eden bir isme dönüştürülmüştür."}]},{"h":"İmamiyyenin Oluşum Süreci","b":[{"k":"li","x":"Hz. Ali - Muaviye meselesinde Hz. Ali yanlısı olanlar, Küfe ve Basra'ya yerleşmişlerdi. Siyasi otoriteler tarafından Ehl-i Beyt aleyhine yürütülen politikalar, Irak halkınca hoş karşılanmamış, hilafetin Hz. Ali ve evladına ait olduğu fikri etrafında birçok grup zuhur etmiştir. Hz. Hüseyin'in şahadetinden sonra Şii cemaati, Keysâniyye, imametin kesintiye uğradığına inananlar ve Ali b. Hüseyin Zeynelabidin'in imametini benimseyenler olmak üzere üç gruba ayrılmıştır."},{"k":"li","x":"İmamiyye ekolünün teşekkül sürecinde etkili olan unsurlardan biri ilk dönem Şii kelamcılarıdır. Bu âlimler, akaid meseleleri ile beraber Resûl-i Ekrem'in açıkça Hz. Ali'yi halife tayin ettiğini, ashabın büyük çoğunluğunun Hz. Peygamber'in bu sözünü yerine getirmeyerek günaha girdiğini iddia etmişlerdir."},{"k":"li","x":"Hicri I. asırdan itibaren Şia imamet nazariyesi II./VIII. yüzyıl ortalarında **Hişam b. Hakem** ve **Ebû Cafer el-Ahvel** ile büyük oranda son şeklini almış, daha sonraki asırda önemli bir değişikliğe uğramadan on birinci imam **Hasan el-Askerî'** nin vefatına (260/874) kadar devam etmiştir."},{"k":"li","x":"Askerî'nin ölümüyle birlikte Şia, imametin kime intikali konusunda on dört - on beş gruba ayrılmıştır. Bu gruplardan biri Hasan el-Askerî'den sonra bir oğlu bulunduğunu, bu imamın gizlendiğini, zamanı gelince zuhur edeceğini benimsemiştir. Bu fırka ilk defa İmamiyye diye adlandırılmıştır."},{"k":"li","x":"On ikinci imamın 260 (874) yılında gizlenmesinin ardından yaklaşık bir asır içinde diğer muhalif fırkalar kaybolurken Imamiyye Şiasi gelişerek varlığını sürdürmüştür. IV./X. yüzyıl sonlarına doğru İmamiyye doktrinine son şekli verilmiş; imamların sayısı on iki ile sınırlandırılmış, on ikinci imamın önce küçük gaybete, ardından kendisiyle irtibat kurulamayan ve hâlen devam eden büyük gaybete girdiği düşüncesi fırkaya hâkim olmuştur."}]},{"h":"İmamiyye/İsnaaşeriyye'nin Tarihçesi","b":[{"k":"h","x":"a. Gaybet Öncesi İmamlar Dönemi"},{"k":"p","x":"**1) Ali b. Ebû Talib** (ö. 40/661): Künyesi Ebû'l-Hasan'dır. \"Ebû Turâb, el-Murtaza, Haydar, Esedullah, Emîru'l-mü'minîn\" gibi lakabları vardır. Mekke'de 29 Temmuz 599 tarihinde dünyaya geldi. Hz. Peygamber'in amcası Ebu Talib'in oğlu ve aynı zamanda Resûlullah'ın damadıdır. Müslümanların dördüncü halifesi olan Hz. Ali, Kûfe'de İbn Mülcem tarafından yaralandı ve üç gün sonra (21 Ramazan 40/28 Ocak 661) vefat etti. Kabri Irak/Necef-i Şerif şehrindedir."},{"k":"p","x":"**2) Hasan b. Ali** (ö. 49/669): Künyesi Ebû Muhammed, lakabı ise “Mücteba”dır. 624'de Medine'de doğmuştur. Yüzden fazla evlenmiş, on beş çocuk sahibi olmuş ve soyu Hasan el- Musenna ve Zeyd ile devam etmiştir. 37 yaşında iken Kûfe'de beyat almak suretiyle (19 Ramazan 40/ 26 Ocak 61) hilafet makamına gelmiştir. Müslümanların kanının dökülmemesi için hilafet hakkından Muaviye ölünceye kadar feragat etmiştir. Henüz Muaviye hayatta iken zehirlenerek şehit edilmiştir. Kabri, Baki mezarlığındadır."},{"k":"p","x":"**3) Hüseyin b. Ali** (ö. 61/680): Künyesi Ebû Abdullah, lakabı “Sıbe\" (torun) ve “Şehîd\"dir. Hicretin dördüncü yılında Medine'de doğdu. İsyancılara karşı Hz. Osman'ın kapısında nöbet tutmuştur. Babasının hilafeti döneminde onunla bütün savaşlara katılmıştır. Daha sonra abisine beyat etmiş, Muaviye'nin ölümüne kadar da ilim ve ibadetle meşgul olmuştur. Ancak Yezid'in veliaht tayin edilmesi sonucunda Hz. Hüseyin Yezid’e karşı isyan etmek üzere Kûfe'ye hareket etmiş, 10 Muharrem 61/15 Ekim 680 tarihinde Yezid'in ordusu tarafından Kerbela'da hunharca şehit edilmiştir."},{"k":"p","x":"**4) Ali b. el-Hüseyin Zeynelabidin** (ö. 94/713): Künyesi Ebû Muhammed ve Ebû'l-Hasan'dır. Lâkabı, “Zeynelabidin\" ve “Seyyidu's-sacidin\"dir. 5 Şaban 38/6 Ocak 659'da Medine'de doğmuştur. Kerbelâ vakası esnasında tutuklanarak Şam'a götürülmüştür. Yezid, yanındakilerle birlikte Medine'ye dönmesine müsaade etmiş, hayatının geri kalan kısmını bu şehirde ilim ve ibadetle geçirmiştir. Bu durumu Emevîlerce takdir edilmiştir. Zeynelabidin, 22 Muharrem 95/17 Ekim 713 tarihinde vefat etmiştir. Kabri, Baki mezarlığındadır."},{"k":"p","x":"**5) Muhammed Bâkır** (ö. 114/733): Künyesi Ebû Cafer, lakabı ise “Bakır”dır. 3 Safer 57/16 Aralık 676'da Medine'de doğmuştur. Babası Zeynelabidin gibi siyasetten uzak kalmıştır. Sufyan es-Sevri ve Ebû Hanife ile fikir teatisinde bulundu. 7 Zilhicce 114/28 Ocak 733'te Medine'de vefat etmiş ve babasının yanına defnedilmiştir."},{"k":"p","x":"**6) Cafer Sadık** (ö. 148/ 765): Muhammed Bakır'ın oğludur. Künyesi Ebû Abdullah, lakabı ise “Sadık\"tır. Medine'de 17 Rebiülevvel 80/23 Mayıs 695 tarihinde doğmuştur. Karışık bir dönemde yaşamasına rağmen hem siyasetten uzak durabilmiş hem de takibe uğramamıştır. Hiçbir zaman imamet iddiasında bulunmamıştır. Cafer, öğrenci yetiştirmiştir. Şiî fıkhını ve itikadını tedvin eden Cafer Sâdık, 25 Şevval 148/15 Aralık 765 tarihinde Medine'de vefat etmiş ve Baki mezarlığına defnedilmiştir."},{"k":"p","x":"**7) Musa Kâzım** (ö. 183/799): Künyesi Ebû'l-Hasan, lakabı da “Kazım\"dır. 128/ 745 tarihinde Ebvâ'da doğmuştur. Cafer Sadık'ın öğrencilerinin girişimi ile imam kabul edilmiş ve zamanla ana bünyenin de lideri olmuştur. Harun Reşid tarafından isyan edebileceği düşüncesiyle Bağdat'a getirilmiş, hapiste iken 25 Recep 183/1 Eylül 799 tarihinde vefat etmiştir."},{"k":"p","x":"**8) Ali Rıza b. Musa** (ö. 203/818): Künyesi Ebû'l-Hasan, lakabı “Rıza'dır. Medine'de 148/765 tarihinde doğmuştur. Me’mun tarafından Irak'a getirilmiş ve veliaht tayin edilmişse de, 17 Safer 203/24 Ağustos 818 tarihinde ölmüştür. Meşhed şehrinde medfundur."},{"k":"p","x":"**9) Muhammed Takî b. Ali** (ö. 220/835): Künyesi Ebû Cafer, lakabı \"Taki\" dir. 15 Ramazan 195/11 Nisan 811 tarihinde Medine'de doğmuş ve Bağdat'ta yirmi dört yaşında iken 30 Zilkade 220/25 Kasım 835'te eceli ile vefat etmiş ve Kâzımeyn'e defnedilmiştir."},{"k":"p","x":"**10) Ali Naki b. Muhammed** (ö. 254/868): Künyesi Ebu'l-Hasan, lakabı “Naki\" ve \"Hadi\"dir. Medine'de 212/ 827'de doğmuş ve 3 Recep 254/28 Haziran 868 tarihinde vefat etmiştir. Zorunlu ikamet ettiği Samarra şehrinde vefat etmiştir."},{"k":"p","x":"**11) Hasan b. Ali el-Askeri** (ö. 260/ 874): Künyesi Ebû Muhammed, lakabı \"Askeri\" ve \"Zekî”dir. Medine'de 232/846 tarihinde doğmuş ve iki yaşında Samarra'ya götürülmüştür. yirmi dört yaşında imamet makamını devralmış 8 Rebiülevvel 260/2 Ocak 873'te Samarra'da vefat etmiştir. Evli olmadığı ve bir çocuğunun olmadığı (cariyeleri var) iddia edilmiş, İmamiyye bunu kabul etmemiştir."},{"k":"p","x":"**12) Muhammed el-Mehdi b. Hasan el-Askerî**: Künyesi Ebu'l-Kasım; lakabı “Muntazar, Hüccet, Kâim, Sahibu'z-Zaman, Mehdi”dir. Şiî-İmamî kaynaklar (Sünni kaynaklar 11 imamı zikreder 12. imama dair bilgi yok), 15 Şaban 255/30 Temmuz 869 tarihinde Samarra'da dünyaya geldiğini kabul etmektedir. Şii-İmamiyye'ye göre, on ikinci imam babasının vefatından sonra gizlenmiştir; hâlen sağdır ve kıyametten önce zuhur ederek zulümle dolmuş olan dünyayı adaletle dolduracaktır. **Rec'at** bir müddet sonra ekolün temel bir inanç esası haline gelmiştir. İmamiyye'ye göre Muhammed el-Mehdi'nin ismi anıldığında \"Accelallahu ferecehu” (Allah onun zuhurunu çabuklaştırsın) denilmesi bir zorunluluktur. Bu döneme **\"gaybet dönemi** \" denir. 329 (941) yılına kadar süren ilk kısmına **\"el-gaybetüs-suğra/ Küçük Gaybet** \", bu tarihten günümüze kadar devam eden kısmına da \" **el-gaybetü'l-kübra/ Büyük Gaybet** \" adı verilmektedir."},{"k":"p","x":"**b. Küçük Gaybet / Sefirler Dönemi (** 260/873- 328/940 **)**"},{"k":"p","x":"Bu dönemde dört kişinin onunla görüşerek irtibat sağladıklarına ve sefirlik hizmeti gördüklerine inanılır. Ancak bir çok sahte sefir ortaya çıkmıştır. Gerçek sefirler (Dört Sefir/Sufera-i Erbaa veya Dört Naib/ Nüvvâb-ı Erbaa) Ebû Amr Osman b. Said, Ebû Cafer Muhammed b. Osman, Hüseyin b. Ruh en-Nevbahti, Ali b. Muhammed es-Semerri'dir."},{"k":"p","x":"Bu sefirler, imamdan yazılı emir ve tavsiyeler almışlar, ortaya çıkan meselelere dair çözümler getirmişler ve ayrıca Şii cemaatin imama vermesi gereken humusu ve diğer vergileri imam adına toplamışlardır. Böylece Küçük Gaybet dönemi sona ermiş ve gaybetteki İmam ile Şiî toplum arasındaki bağlantı ve sefirlik dönemi bitmiştir. Bu dönemin önemli alimleri Sa'd b. Abdullah el- Kummî' el-Makâlât ve'l-Fırak) Hasan b. Musa en-Nevbahtî (Firaku'ş-Şia)'dir."},{"k":"h","x":"c. Büyük Gaybet Dönemi"},{"k":"p","x":"Bu dönem devam etmektedir. Şii-İmamî alimlere göre, bu gaybete inanmak dinin aslındandır. **Şeyh Müfid** (ö. 413/1032) gibi müellifler, bu gaybeti akli delillerle izaha çalışmıştır. Ona göre Mehdi'nin doğumunun kendi ailesinden ve dost-düşman bütün insanlardan gizlenmesi örfün dışında alışılmadık bir durum değildir. Buna benzer hallerin bazı kral ve yöneticiler tarafından uygulanageldiği bilinen bir husustur. Müfid'e göre Hasan el-Askerî, oğlunun doğumunu çok yakın dostları hariç herkesten gizlemiştir. O, On İkinci İmam'ın uzun ömürlü oluşunu Kur'an kıssalarıyla desteklemiş ve bu bağlamda Hz. Âdem ve Hz. Nuh'un uzun ömürlü oluşlarını Kur'anî bir delil olarak zikretmiştir."},{"k":"p","x":"Gaybet inancının tezahür ve teşekkülünde iç ve dış faktörler etkilidir. Dış sebeplerin başında diğer din ve kültürlerden etkileşim gelmektedir. Gaybet inancının örnekleri Yahudilik ve Hristiyanlık gibi dinlerde de vardır. Yine gaybet inancının teşekkülünde hem Emeviler hem de Abbasîler döneminde Şiî liderlerin ve taraftarlarının şiddete maruz kaldığı hususu göz önünde bulundurulursa bu inancı dile getiren kimselerin sosyal ve siyasi açıdan baskı altında oldukları, dolayısıyla bir kurtarıcı bekledikleri anlaşılır. Neticede gaybet inancı, Şiî grupların birlik ve bütünlüğünü sağlamıştır."},{"k":"p","x":"İsnaaşeriyye Şiiliği, Büveyhîler döneminde (932-1062), kendi varlığını rahatça açıklayabilmiş ve mezhebi bazı uygulamaları hayata geçirebilmiştir. (Muizzüddevle'nin emireriyle) Gadîr-i Hum olayının vuku bulduğu tarihi bayram olarak kutlamaları, Hz. Hüseyin için matem tutulması (Aşûre matemi), imamların kabirlerinin türbeye dönüştürülmesi, hadis külliyatının üç temel eserinin bu dönemde kaleme alınması (Kutub-i erbaa) önemlidir."},{"k":"p","x":"Bu dönemde **Şeyh Müfid** ve öğrencisi **Şerîf el-Murtazâ**, “ **Usuli** \" anlayışı başlatan âlimler olarak kabul edilirler. Büveyhîler devrinde Şiilik siyasi açıdan başarılı olmuşsa da Kum, Necef ve Bağdat'ın bir kısmı hariç, İran coğrafyasının Sünni olduğu bilinmektedir."},{"k":"p","x":"Büveyhî hanedanlığına son veren **Selçuklular** (447/1055), Şiiliğe karşı bir tutum almışlar ve yayılmasını engellemeye çalışmışlardır. Selçukluların hâkimiyetinden uzak kalan bölgelerde **Ebû Cafer et-Tûsî, Tabersi** ve **İbn Şehrâşüb** gibi bazı güçlü şahsiyetler de yetişmiştir."},{"k":"p","x":"**İlhanlılar Dönemi** (1256-1336) İsnaaşeriyye mensupları için rahat bir dönem olmuştur. Özellikle Moğol Hükümdarı Hülagü'ya müşavirlik yapan filozof ve kelamcı Nasiruddîn et-Tusinin (ö. 1201-1274) girişimleri ile mezhep mensuplarının rahat bir nefes aldığı söylenebilir. Daha sonra İran coğrafyasını **Timur** ele geçirmiş ve böylece İsnaaşeriyye için yeni bir devir başlamıştır. Timur'un, Şiiliğe karşı düşmanca tutum sergilemesi İsnaaşeriyye'yi yine **takiyye** durumuna geçmeye mecbur etmiştir."},{"k":"p","x":"İsnaaşeriye fırkası, **Safevilerle** (1501-1737) birlikte İran'da resmî mezhep hâline gelmiştir. Safevi Hanedanlığı adını Tebriz'in doğusundaki Erdebil'de Sünni bir tarikatın kurucusu olan Şeyh Safiyyüddîn Erdebili'den (1252-1334) almıştır. Tarikat Hâce Ali'nin (ö. 1429) şeyhliğine kadar (794/ 1392) Sünni iken onun zamanında İsnaaşeriyye Şiiliği'ne meyletmiştir. Şeyh Haydar, müritlerine on iki dilimli kırmızı taç giymelerini emretmiş ve onlara \" **kızılbaş** \" adını vermiştir. **Şah İsmail** zamanında siyasi birlik sağlamış, İsnaaşeriyye Şiiliği resmî mezhep olmuştur. Sünniler zorla şiileştirilmeye başlanmış, kabul etmeyeler takibata uğramış, meşhur Sünnilerin kabirleri açılıp kemikleri yaktırılmıştır. Hutbelerde Hz. Ebû Bekir, Ömer ve Osman ile Muaviye b. Ebû Süfyan'a lanet edilmesini ve aksine hareket edenlerin öldürülmesini emretmiştir. Ezana bugün de kullanılan; \"Eshedü enne Aliyyen veliyyullah” ve “Hayye alâ hayri’l-amel” cümlelerini ekletmiştir."},{"k":"p","x":"Türk asıllı Avşar aşiretinden **Nadir Şah**, Safevi, iktidarına son vermiştir (1148/ 1736). İran'da Sünniliği yeniden tesis edip Şiiliği ortadan kaldırmayı amaçlayan Nadir Şah, Şiî ulemanın ciddi mukavemetiyle karşılaşmıştır. Şii âlimleriyle Sünni âlimler arasında tertip edilen toplantılar sonunda, Şîîlerin sahabeye dil uzatmamaları, birtakım hatalı inanışlarını bırakarak doğru yolu bulmaları konularında bir karara vanlmıştır (1156/ 1743)."},{"k":"p","x":"1925 yılına kadar devam eden **Kaçar aşiretinden Ağa Muhammed Şah** döneminde İran'da ulema gücünü artırmaya devam etmiş, bazen devletle birlikte olmuş bazen da ona karşı tavır almaktan çekinmemiştir. Bu dönemde dikkat çeken hadiselerden biri **anayasa hareketi** ile **Ahmed el-Ahsâi** 'nin kurduğu **Şeyhiyye** hareketidir. Şeyhiyye tarikatına mensup olan Mirza Ali Muhammed, **Babilik** ve sonrasında **Bahaîlik** hareketlerinin ortaya çıkmasına sebebiyet vermiştir. **Pehlevîler Döneminde** (1925-1979) köklü reform ve Batılılaşma faaliyetleri gerçekleşmiştir. Ancak ulemanın Batılılaşma hareketine tepkisi çok sert olmuştur. Hükümetin faaliyetleri karşısında ulema muhafazakar, merkezci ve radikaller olmak üzere üç gruba ayrılmıştır. **Ayetullah Humeynî** 'nin liderlik ettiği Radikaller grubu, İran rejimini ve şahı acımasızca eleştiriyor, din ve dünya iktidarının ulemanın elinde olması gerektiğini savunuyordu. Bu grup, İsnaaşerî düşüncesine **velayet-i fakih** inancını yerleştirmiş, ulemayı gaib imamın yetkileriyle donatılmış olarak kabul ettikten başka onların devlete meşruluk kazandırmak için siyasi güç ve fonksiyonlara da sahip olduklarını ileri sürmüştü. 1979 yılında Humeynî, İran'da devrimini gerçekleştirmiş ve devletin başkanı olmuştur."}]},{"h":"İmamiyyenin Görüşleri","b":[{"k":"p","x":"**a. Tevhid:** Allah'ın varlığını ispat konusunda kullandıkları deliller İslam âlimleriyle aynı gibidir. Allah'ın sıfatları konusunda Mu'tezile ile benzerlik vardır. Buna göre Tevhid; Tevhid-i Zat, Tevhid-i Sıfat, Tevhid-i Fiil ve Tevhid-i İbadet olmak üzere dört kısma ayırılır. **Tevhid-i Zat**, Allah'ın zatı itibariyle birlenmesi, noksan sıfatlardan tenzih edilmesi; **Tevhid-i Sıfat**, Allah Teâlâ'nın Semi', Basir, Alîm, Hakim, Kadir, Aziz, Hayy, Kayyum, Vahid, Kadîm gibi vasıflara sahip olması; **Tevhid-i Fiil**, varlık âleminde Allah'tan başka bir müessir gücün bulunmaması **Tevhid-i İbadet**, ibadetin sadece Allah'a yapılması anlamlarına gelir."},{"k":"p","x":"**b. Adalet:** Allah'ın adil olması, hiçbir kimseye zulmetmemesi, insanların da iradesinde ve fiillerinde hür olması demektir. İnsan aklıyla hüsün ve kubuhu bilebilir. Külli anlamda ihtiyar Allah'a ait olmakla birlikte kulun şahsına ait işlerde ihtiyarı vardır. Dolayısıyla kulların mükafatlandırılması veya cezalandırılması buna göredir. İlk dönemlerde kader konusunda cebir düşüncesine sahip olmakla beraber Hz. Hüseyin'in katillerini aklama manasına geleceğini düşünerek Mu'tezile'nin adalet prensibini benimsemiştir."},{"k":"p","x":"**C. Nübüvvet:** Lutfu açısından peygamber göndermek Allah'a vaciptir. Lütuf, “mükellefin kendisiyle itaate yakın olduğu ve günahtan uzaklaştığı şeydir.” Nübüvvet vehbidir. Peygamberlerin ilki Âdem, sonuncusu Hz. Muhammed olmak üzere 124.000 peygamber gönderilmiştir. Mucize haktır. Hz. Muhammed'in en büyük mucizesi Kur'an-ı Kerim'dir. Mevcut Kur'an'ın Hz. Muhammed'e indirilen mushaf olup ve onda herhangi bir değişiklik yoktur. Peygamberler masumdur ve bilgilidirler."},{"k":"p","x":"**d. Mead:** Kur'an ve hadislerde yer alan açıklamalara inanmanın şarttır. İnkâr eden kafir olur. Onlar, Allah'ın kıyamet günü insanları ceset ve ruhuyla yeniden dirilteceğine inanırlar. Bu tekrar dirilişin mahiyeti bilinemez. Bu konuda diğer itikadî mezheplerden \" **imametin önemini ortaya koyan rivayetler** \"le ayrılırlar. Kabir sorgulamasında **\"imamın kimdir?”** sorusunun bulunması, mahşerdeki geçiş yerlerinden birinin \" **velayet\"** adını taşıyıp buradan ancak on iki imama bağlılık gösterenlerin geçebileceği, sıratın **\"cehennem köprüsü\"** anlamının yanında **\"imamlar** \" manasına da geldiği, Allah'ın, bu köprüden imamlara itaat etmiş kimselerin geçmesine izin vereceği bazı örneklerdendir. Şefaat haktır. İmamlara da bu yetki verilmiştir."},{"k":"p","x":"**e. İmamet:** İmam, \"Peygamber'e vekaleten, din ve dünya işlerinde umumun liderliği kendine ait olan kimsedir. Şia'nın mezhebi kimlik kazanmasında ve şekillenmesinde imamet anlayışı belirleyici bir rol oynamıştır. İmam, Allah tarafından seçilmiş ve tayin edilmiştir. İmamların isimleri, Cebrail vasıtası ile Hz. Peygamber'e vahyedilmiş, o da bu isimleri Ali'ye bildirmiştir. İmamet, nübüvvetin uzantısıdır. İmam tayin etmek Allah'a vaciptir. Nebilerin özellikleri imamlara da verilmiştir. İmamlarda; nass ile tayin ya da **vasilik**, **masumiyet**, **efdaliyet**, **kuşatıcı bir bilgi** ve **mucize gösterebilme** şeklinde beş temel özelliğin bulunması gerekir. İmamlarda bulunması gereken özellikleri şöylece açıklayabiliriz."},{"k":"p","x":"**a) Nas ile tayin / vasilik**: Hz. Ali'nin imameti bizzat Peygamber tarafından açıklanmıştır. Veda haccı dönüşünde Gadir-i Hum olayı delildir. Aynı şekilde her imam da kendisinden sonra gelecek olan imamı aynı tarzda belirlemiştir."},{"k":"p","x":"**b) Masumiyet**: İmamların ismet sıfatına büyük önem verirler. Bu masumiyet Hz. Peygamber tarafından onaylanmış olup çok sayıda delil getirirler."},{"k":"p","x":"**c) Bilgi ve sınırları**: İmamın dinî ve dünyevi riyaset göreviyle Allah tarafından atanmış mevkiine halel gelmemesi için masumiyetiyle uyumlu, diğer insanların sahip olmadığı bilgi ve bilgi kaynağı ile teçhiz edilmiş olması gerekir. İmam peygamberle aynı kaynaktan bilgi alır. Böyle olduğundan dolayıdır ki, imamın sözü Allah ve elçisinin sözü gibi kutsal kabul edilmiştir. İlim sıfatı imametin şartlarındandır. Bu bilgi dinî konularla sınırlıdır."},{"k":"p","x":"**d) Efdaliyet**: Hilafete en layık kişi Hz. Ali'dir. İlk üç halifenin imametini batıl gören Şia imametin Hz. Ali'den sonra oğlu Hasan'a intikal ettiğini iddia etmişlerdir. Efdal olanın belirlenmesinde, söz konusu kişinin peygamber nezdindeki konumu, dinî ve dünyevi başarıları, Müslümanların onun hakkındaki hüsnü zannı gibi delillerin yanı sıra Şia'nın ayrıca nas ile tayin fikrini geliştirdiği anlaşılmaktadır. Şii-İmami anlayışa göre imamlar, -Hz. Peygamber hariç- diğer bütün enbiyadan daha faziletlidir ve onlardan daha üstündür. Ayrıca imamların meleklerden daha üstün olduğu da kabul edilmektedir."},{"k":"p","x":"**e) Mucize Göstermeleri**: Peygamberler nübüvvetini ispat etmek üzere mucize gösterdiği gibi, imamlar da kendi doğruluklarını açıklamak üzere mucize (ayet, burhan) göstermişlerdir."},{"k":"p","x":"Bu temel prensiplerin dışında İsnaaşeriyye'nin görüşleri arasında “ **rec'at** ”, “ **beda** ” ve “ **takiyye** \" gibi bazı inanışlar da vardır."},{"k":"p","x":"**a) Beda**: \"Allah'ın belli bir şekilde vuku bulacağını haber verdiği bir olayın daha sonra başka bir şekilde gerçekleşmesi\" demektir. Muhtar es-Sakafi tarafından ileri sürülmüştür. Hz. Hüseyin'in intikamını almak üzere çıktığı isyanda başarılı olamayınca \"beda” olduğunu söylemiştir. İmamiyye'nin bedâ telakkisini benimsemesi, gayba ait haberleri bildiklerine inanılan imamların, vuku bulacağını önceden haber verdikleri olayların sonradan başka türlü gerçekleşmesi üzerine inandırıcı bir izah bulmak suretiyle tartışmaları önleme amacı gütmektedir."},{"k":"p","x":"**b) Gaybet ve Ricat**: Bu inanç Şiî-İmamiyye'ye göre bir hakikattir ve buna inanmak Şiî inancının temel unsurlarından biridir. Hz. Üzeyir ve Ashab-ı Kehf'in durumları bu inanca örnek gösterilmiştir. Ayrıca Muhammed ümmetinin önceki ümmetleri aynen takip edeceği şeklindeki hadis rivayeti de delildir. Tenkitlerden dolayı bazı Şii alimler bunun iman konusu olmadığını söylemişlerdir."},{"k":"p","x":"**c) Takiyye**: Takiyye, din veya dünya hususunda bir tehlikenin meydana gelebileceği gerekçesiyle hakkı gizlemek, bu husustaki gerçek inancı örtmek, muhaliflere karşı örtülü davranmak ve kendi davranışlarını terk etmek şeklinde açıklanmıştır. Takiyye'yi terk etmek namazı terk etmek gibidir. Usuliler takiyye konusunda şartlara bağlı olarak farz veya vacip ve bazı durumlarda da gereksiz olduğunu kabul etmişlerdir. Müfid, ulemanın takiyye yapması durumunda hakikatin kaybolacağını belirterek bunun ancak avam için geçerli olabileceğini açıklamıştır."},{"k":"p","x":"**d) Tevella ve Teberra:** Ehl-i Beyti sevmeyi (tevella), onları dost kabul etmeyi ve onlara sevgi besleyenlere muhabbet duymayı farz kabul etmiştir. Ayrıca Hz. Ali başta olmak üzere imamlara ve Ehl-i Beyt mensuplarına düşman olanlara kin ve düşmanlık beslemeyi (teberri) ve onlardan uzaklaşmayı da gerekli görmüşlerdir."},{"k":"h","x":"Fıkhî Bazı Görüşleri"},{"k":"li","x":"Şer'i hükümlerin kaynağı kitap, sünnet (Hz. Peygamber ve imamların sözleri), icma ve akıldır. Kıyası kabul etmezler. Bu dört kaynakla hüküm çıkarana müçtehit denir. Mezhebi olmaz."},{"k":"li","x":"Furu-i din, ibadetler ve muamelattan oluşmaktadır. İbadetler: Namaz, Oruç, Hac, Zekât, Humus, Cihad, Emr bi'l-maruf, Nehiy ani'l-münker, Tevella, Teberra'dan oluşmaktadır. Namaz beş vakit olup üç vakitte icra edilmektedir. Abdestte, ayakların meshedilmesi farzdır. Secde, temiz toprağa yapılmalı, halı gibi şeylere secde edilmesi caiz değildir. Bu sebeple toprağa secde etme imkânı bulamayanlar, topraktan bitmiş fakat yenilmesi ve giyinilmesi adet olmayan çimen, çayır, tahta, taş, hasır, kağıt gibi şeyler üzerine secde edebilirler. Secdenin **türbet** veya **mühür** denilen Kerbela toprağından yapılmış kil üzerine olması efdaldir. Ezana, “ **Eşhedu enne Aliyyen veliyullah\"** ve \" **Hayya ala hayri'l-amel\"** şeklinde iki cümle ekleme yaparlar."},{"k":"li","x":"Zekât önemli bir ibadet olup Sünni uygulamayla paralellik arz eder. İmamiyye’yi farklı kılan uygulamalardan biri hiç şüphe siz \" **humus** \" anlayışıdır. Onlar, “... Biliniz ki, ele geçirdiğiniz ganimetin beşte biri Allah'ın, peygamberin ve yoksulların, yetimlerin, düşkünlerin ve yolcularındır..\" (Enfal 8/41) ayetine dayanarak Ehl-i Beyt mensuplarına - zekâta bedel olarak- verilmesini zorunlu kabul etmişlerdir. Humus, altıya bölünür ve üç payı Allah'a, Resülüne ve yakınlarına aittir. Bu üç hisse, imam hayatta ise ona, değil ise imamın naibi olan müçtehide verilir. Diğer üç hisse ise, Haşimoğullarından olup kendilerine zekât ve sadakanın haram kılındığı fakirlere verilir."},{"k":"li","x":"Muamelat konusunda da İmamiyye ekolü ile diğer İslamî fırkalar arasındaki en önemli farklılık **müt'a** birlikteliği (muvakkat evlilik) konusundadır. Onlar, Nisa 4/24 ayetini delil gösterirler."}]},{"h":"İmamiyye'nin Günümüzdeki Durumu","b":[{"k":"p","x":"İsnaaşeriyye Irak'ta ortaya çıkmış olmakla birlikte zamanla diğer bölgelere de yayılmış, başta İran olmak üzere Azerbaycan, bazı körfez ülkeleri, Afganistan ve Hint alt kıtası gibi yerlere ulaşmıştır. Ancak diğer İslam fırkaları gibi İsnaaşeriyye’nin nüfusuyla ilgili kesin rakamlardan söz etmek mümkün değildir. Bununla birlikte İsnaaşeriyye mensuplarının, toplam Müslüman nüfusun %6,2'si ile % 10'u arasında değişen bir yekûnu oluş turdukları tahmin edilmektedir. En yoğun Şii nüfusu barındıran ülke **İran** olup nüfusunun % 85'i İmamiyye/İsnaaşeriyye şiasına mensuptur. İsnaaşeriye fırkasının nüfusa göre yoğun olduğu ikinci ülke **Azerbaycan'dır**. Bu ülke nüfusunun yaklaşık % 70'i İsnaaşeri'dir. Ancak burada din alimi yetiştirmeye yönelik eğitim kurumları yoktur ve ihtiyaç hissedilen din adamları İran'dan gelmektedir. **Irak** nüfusunun % 60'nın Şii olduğu bilinmektedir. Irak'ta Şislik İmamiye mezhebine göre şekillenmiştir. **Bahreyn**, Şiî nüfusun çoğunluğu oluşturduğu, ancak Sünnî anlayışın iktidarda bulundu ğu bir Körfez ülkesidir. **Katar** nüfusunun yaklaşık % 16'sını Şii azınlık teşkil etmektedir. **Birleşik Arap Emirlikleri'** nde yüzde 30 civarında bir Şiî nüfus bulunmaktadır. **Pakistan'da** tahminen bir milyon civarında Şii- İmamiyye'ye, bir o kadar da İsmailiyye'ye mensup insan bulunmaktadır. **Hindistan** 'daki % 14'lük Müslüman nüfusun % 2'si İmamiyyye ve İsmailiyye'den oluşur. **Afganistan** 'da tahminen % 10-15 dolaylarında İmamiyye mezhebine mensup oldukları bilinen Şiî nüfus vardır."}]},{"h":"Şiîliğin Tanımı","b":[{"k":"h","x":"Şiîlik (Şîa)"},{"k":"p","x":"Hz. Ali'nin Hz. Peygamber'den (s.a.v.) sonra **açık bir nas (atıf ve tayin)** ile halife/imam olarak tayin edildiğine inanan ve imametin onun soyundan devam etmesi gerektiğini savunan topluluğa verilen isimdir."},{"k":"p","x":"Şia kelimesinin henüz terimleşip tarih sahnesindeki yerini almadan önce kelime anlamına uygun bir şekilde belli gruplan ifade etmek üzere kullanıldığı görülür. Nitekim \"Şiatu Ali, Şiatu Osman ve Şiatu Muaviye\" şeklinde Hz. Osman ve Hz. Ali döneminde belli görüşler etrafında birleşen siyasi toplulukları ifade etmek üzere kullanıldığı bilinmektedir."},{"k":"li","x":"**Etimolojik kökeni:** Arapça **“ş-î-a”** kökünden gelir, \"taraftar\", \"takipçi\", \"yardımcı\" anlamlarındadır."},{"k":"li","x":"Kur’an’da bu kelime, çeşitli gruplar, hizipler veya taraftar anlamlarında kullanılmıştır."},{"k":"li","x":"Şiî kaynaklar, Hz. Ali’nin imameti konusunda ayetler ve hadisler zikrederek, bu görüşü inanç temeli hâline getirmiştir."}]},{"h":"Şiîliğin Doğuşunun Temelleri","b":[{"k":"p","x":"Şiîlik, tarihsel bir gelişim olarak, Hz. Ali'nin hilafete geçememesini **bir zulüm ve gasp** olarak değerlendirir. Bu anlayışa göre:"},{"k":"li","x":"**İmamet,** inanç sisteminin bir parçasıdır; ona iman etmeyenler iman yönüyle eksiktir."},{"k":"li","x":"Hz. Ebu Bekir, Hz. Ömer ve Hz. Osman’ın halifeliği meşru kabul edilmez."},{"k":"li","x":"Hz. Ali’nin sessiz kalışı **“takiyye”** ile açıklanır."},{"k":"li","x":"İmamlar masum kabul edilir ve onların sözleri, sünnetle eş değer kabul edilir."}]},{"h":"Şiîliğin Dayandığı Ayetler","b":[{"k":"n","n":1,"x":"“Ey Ehl-i Beyt! Allah sizden her türlü günahı gidermek ve sizi tertemiz yapmak istiyor.”"},{"k":"li","x":"Şiîler bu ayetin Ehl-i Beyt'in (Hz. Ali, Hz. Fatıma, Hz. Hasan, Hz. Hüseyin) imametine delil olduğunu savunur."},{"k":"n","n":2,"x":"“Bugün size dininizi tamamladım...”"},{"k":"li","x":"Bu ayetin, Gadir Hum’da Hz. Ali’nin imametinin ilanından sonra nazil olduğu ve dinin tamamlanmasının bu şekilde gerçekleştiği ifade edilir."},{"k":"n","n":3,"x":"“Sizin dostunuz ancak Allah, O’nun Resulü ve rükû hâlindeyken zekât veren müminlerdir.”"},{"k":"li","x":"Şiî yorumunda, bu ayette geçen \"mümin\" Hz. Ali olarak kabul edilir."},{"k":"n","n":4,"x":"“Ben sizden akrabalık sevgisinden başka bir ücret istemiyorum.”"},{"k":"li","x":"Ehl-i Beyt sevgisinin vurgusu olarak değerlendirilir."},{"k":"n","n":5,"x":"**Mübahele Ayeti**"},{"k":"li","x":"Hz. Peygamber'in yanına yalnızca Ehl-i Beyt’ini alması, onlara özel bir makam verdiğini gösterdiği iddia edilir."}]},{"h":"Şiîliğin Dayandığı Hadisler","b":[{"k":"h5","x":"Sakaleyn Hadisi"},{"k":"p","x":"“Size iki ağır emanet bırakıyorum: Allah’ın kitabı ve itretim (Ehl-i Beyt)...”"},{"k":"li","x":"Sünnî kaynaklarda da yer almakla birlikte, Şiîlikte Ehl-i Beyt’e bağlılığı öne çıkaran bir delil olarak görülür."},{"k":"h5","x":"Gadir-i Hum Hadisi"},{"k":"p","x":"“Ben kimin mevlâsı isem, Ali de onun mevlâsıdır.”"},{"k":"li","x":"Şiî yoruma göre bu söz, Hz. Ali’nin halife tayin edildiğinin açık ilanıdır."},{"k":"li","x":"**İlk Davet Hadisi (Yakin Akrabaların Uyarılması):**"},{"k":"p","x":"“Bu benim kardeşim, vasim ve halifemdir; onu dinleyin ve itaat edin.”"},{"k":"li","x":"Şiî kaynaklar bu ifadeyi Hz. Ali’nin imametinin ilk ilanı olarak görür."}]},{"h":"Sünnî Eleştiriler","b":[{"k":"li","x":"Şiîliğin tarihî anlatımı, rivayetlerin gidişatına ve sahabe hakkındaki Kur’ân ayetleriyle bağdaşmaz."},{"k":"li","x":"Hz. Ali için öngörülen **veraset yoluyla imamet,** ilk defa Muaviye tarafından uygulanan ve sonradan gelen bir bidat olarak görülür."},{"k":"li","x":"Şiîlerin nas olarak sunduğu delillerin ya zayıf ya da yorumla delillendirilmiş olduğu ifade edilir."},{"k":"p","x":"Şia’nın kabul ettiği imamet inancının kaynağı üzerine çeşitli fikirler yürütülmüştür. Bunlar;"},{"k":"li","x":"a. Şiilik Yahudi asıllıdır;"},{"k":"li","x":"b. Şiilik Yahudi Hristiyan asıllıdır;"},{"k":"li","x":"c. Şiilik İran asıllıdır;"},{"k":"li","x":"d. Şiilik Arap asıllıdır."},{"k":"h","x":"Şiiliğin doğuşuyla ilgili iddialar yedi grupta toplanıştır"},{"k":"n","n":1,"x":"Şii müellifler, Şiiliğin doğuşunu Hz. Peygamber zamanına kadar götürürler. Ancak, Hz. Peygamber'in sağlığındaki Şiiliğe manevi Şiilik adını verirler."},{"k":"n","n":2,"x":"Şiilik, ilk hilafet tartışmaları esnasında oluşmuştur."},{"k":"n","n":3,"x":"Şiilik, Hz. Osman zamanında, ona karşı yapılan isyandan sonra doğmuştur. Hz. Osman'ın şehadetinden sonra Müslümanlar, Hz. Ali ve Muaviye taraftarı olarak ikiye bölünmüşler; Hz. Ali'nin ölümünden sonra Şia, sadece Hz. Ali taraftarlarına verilen bir ad olmuştur."},{"k":"n","n":4,"x":"Şiilik, Hz. Ali'nin riyaseti (başkanlığı/halifeliği) esnasında Hz. Talha ve Hz. Zübeyr'in ona karşı çıkması üzerine Hz. Ali'ye uyanlara verilen bir ad olarak başlamış, Cemel vakası'nı müteakip teşekkül etmiştir."},{"k":"n","n":5,"x":"Şiilik, Hz. Ali'nin öldürülmesinden sonra teşekkül etmiştir."},{"k":"n","n":6,"x":"Şiilik, Hz. Hüseyin'in Kerbela'da şehadetinden sonra oluşan Tevvâbûn hareketiyle başlamıştır."},{"k":"n","n":7,"x":"Şiilik, nass ve tayin akîdesiyle birlikte ortaya çıkmıştır. Buna göre, Şia'nın zuhuru Hicri 1. asrın sonlarına kadar uzanır."},{"k":"p","x":"Şiîliğin kurumsal bir yapı kazanması hicrî 80-120 yılları arasında gerçekleşmiştir. Dolayısıyla Şiîliğe nispet edilen Kerbelâ Faciası, Tevvâbûn Hareketi ve Muhtar b. Ebî Ubeyd İsyanı gibi gelişmeler bu mezhebin doğuşuna zemin hazırlayan olaylar olarak değerlendirilmelidir."},{"k":"p","x":"İlk önemli gelişme, Hucr b. Adiyy’in Hz. Ali’ye olan bağlılığı nedeniyle siyaseten öldürülmesi olayıdır (51/671). Bu olayda “Şii” ya da “Sebeî” nitelemesi ilk defa siyasi bir anlamda Hz. Ali taraftarı olanlar için kullanılmıştır."},{"k":"h5","x":"Kerbelâ Olayı (61/680)"},{"k":"p","x":"Hz. Hüseyin’in Yezid’e biat etmeyerek Kûfe’ye doğru yola çıkması ve Emevî güçlerince Kerbelâ’da ailesiyle birlikte kuşatılıp katledilmesi, Şiîliğin şekillenmesinde merkezî rol oynayan dramatik bir hadisedir. Bu olay, Hz. Hüseyin’i bir “masum kurban” olarak konumlandırarak Şii söyleminin temel duygusal ve sembolik zeminini oluşturmuştur. **Tevvâbûn Hareketi (65/685):**"},{"k":"p","x":"Hz. Hüseyin’in ölümünden duydukları pişmanlıkla hareket eden Kûfeliler, onun intikamını almak ve günahlarını telafi etmek amacıyla **Süleyman b. Surad** önderliğinde bir ayaklanma başlatmış, ancak **Aynü’l-Verde’de** Emevîlerce bastırılmışlardır. Bu hareket, Şiî geleneğin duygusal-tevbe temelli yönünün erken örneklerinden biridir. **Muhtar es-Sakafî Hareketi (66-67/685-686):**"},{"k":"p","x":"Muhtar b. Ebi Ubeyd'i fırsatçı ve koyu bir Emevî karşıtı olarak tasvir eder. Muhtar, siyasi ortamdan faydalanarak Kufe'ye dönmüş ve **Hz. Ali'nin Fatıma soyundan olmayan oğlu Muhammed ibnü'l-Hanefiyye adına biat toplamaya başlamıştır.** Bu durum, o dönemde henüz Fatıma soyuna hasredilmiş bir Ehl-i Beyt anlayışının olmadığını göstermesi açısından önemlidir. Abbasoğulları'nın da daha sonra hilafet iddialarını Ebû Haşim Abdullah'ın kendilerine vasiyeti esasına dayandırmaları bu duruma bağlanır. Muhtar hareketini **Hz. Hüseyin'in intikamını alma** ve **mazlumların hakkını zalimlerden alma** iddiaları üzerine kurmuştur. **İlk iddia** ile Hişamoğulları ve sempatizanlarının, **ikinci iddia** ile ise genellikle ana muhalefet konumunda bulunan ve çoğunluğu İran kökenli olan Mevâli'nin desteğini kazanmıştır. Bu dönemde İran kökenli Mevâli aracılığıyla batıl itikatların Ehl-i Beyt'e nispet edilerek yayıldığını ve Şii doktrininin oluşum aşamasından itibaren gayr-i İslami unsurlarla iç içe geçmiştir."},{"k":"p","x":"Muhtar, Kufe'de hem şehrin ileri gelenlerinden hem de Mevâli'den oluşan önemli bir güç toplamış ve şehri ele geçirmiştir. (66/685) Ancak savaşlarda Mevâli ile eşit tutulmayı kabullenemeyen Kufe eşrafının isyanı, Muhtar'ın askeri gücünü parçalamış ve harekette Mevâli'nin etkinliğini artırmıştır. Muhtar kısa süre sonra **Mus'ab b. Zübeyr** tarafından yenilerek öldürülmüştür (67/686)."},{"k":"p","x":"Muhtar'a doğrudan atfedilen aşırı görüşlere rastlanılmamış, ancak taraftarları içinde, özellikle dini bilgileri yetersiz Mevâli arasında bazı aşırı fikirlerin ortaya çıkmıştır. Muhammed ibnü'l-Hanefiyye'ye nispet edilen mehdilik fikrinin ve ölümünden sonra ortaya çıkan Keysaniyye fırkasındaki bazı inançların (Muhammed b. el-Hanefiyye'nin ölmediği ve bir gün döneceği gibi) bu dönemde şekillendiği ifade edilir."},{"k":"p","x":"Ayrıca, Hicri 2. yüzyılın başlarında (Hicri 80-120 arası) Ebû Bekir ve Ömer'den teberri fikrinin izlerinin görülmeye başlandığı ve Zeyd b. Ali isyanında bu inancın yaygınlaştığı belirtilir. Vasiyet fikrinin de Ebû Haşim Abdullah'ın ölümünden sonra Keysanî çevrelerde farklı kişiler tarafından sahiplenilerek Şii fikir hayatına girdiği ve Abbasoğulları ile Alioğulları arasındaki rekabette bir unsur haline geldiği anlatılır."},{"k":"p","x":"Tüm bu gelişmelerden hareketle, mehdilik, gaib imam, ric'at (geri dönüş), vasiyet ve muhaliflerden teberrî gibi imametle ilgili inanç unsurlarının Hicri 2. yüzyılın başlarında ortaya çıktığını ve dolayısıyla Şiiliğin Hicri 80-120 yılları arasında doğduğunu sonucuna varılır."},{"k":"p","x":"Muhtar, siyasi bir aktör olarak Hz. Hüseyin’in intikamını almak ve mazlumların hakkını korumak iddialarıyla Kûfe'de destek toplamış; özellikle Mevâlî adı verilen Arap olmayan Müslümanlardan ciddi destek almıştır. İmamet iddiasını Hz. Hüseyin’in kardeşi Muhammed b. el-Hanefiyye üzerinden dillendirmesi, imametin Fatıma soyuyla sınırlandırılmadığını göstermektedir. Bu durum, Şiîliğin erken dönemde henüz Ehl-i Beyt anlayışını kesin çizgilerle tanımlamadığını ortaya koyar."},{"k":"p","x":"Muhtar’ın ölümünden sonra onun etrafında toplananlar arasında uç fikirler ortaya çıkmıştır. Özellikle Keysâniyye fırkası, Muhammed b. el-Hanefiyye'nin ölmediğini, Radva dağında gizlendiğini ve kıyamet öncesi Mehdi olarak ortaya çıkacağını savunmuştur. Bu inançlar, Şiîliğin içinde zamanla gelişecek olan \"gaybet\" ve \"mehdîlik\" gibi temel öğretilerin ilk örnekleri olarak görülebilir."},{"k":"h5","x":"Teberri ve Vesayet Düşüncesi"},{"k":"p","x":"Hz. Ali dışındaki ilk iki halifeye karşı açık tavır alma (teberri), bu dönemde şekillenmiş ve Zeyd b. Ali isyanıyla birlikte daha geniş halk kitlelerine yayılmıştır. Öte yandan, imametin bir vasiyet yoluyla intikal ettiği düşüncesi, Ebû Hâşim Abdullah’tan itibaren Abbasîler ve diğer Haşimoğluları tarafından sahiplenilmiş ve imametin sadece Ali soyuna değil, daha geniş Haşimoğlularına ait olabileceği düşüncesine kapı aralamıştır. Bu anlayış, Şiîliğin imamet doktrininde vasiyet temasının temelini oluşturur."}]},{"h":"İmamiyye / İsnâaşeriyye Şîası","b":[{"k":"h","x":"İmâmiyye/İsnâaşeriyye Mezhebi"},{"k":"p","x":"Şia, başlangıçta Hz. Ali, Hasan ve Hüseyin zamanında sadece **siyasi bir grup olarak Irak'ta (özellikle Kufe'de)** ortaya çıktı. Hz. Hüseyin'in şehit edilmesinden sonra bu grup **dini bir fırkaya dönüşmeye başladı.**"},{"k":"p","x":"Bu dönüşümle birlikte Şia üç ana kola ayrıldı:"},{"k":"n","n":1,"x":"**Keysâniyye:** Muhammed b. Hanefiyye'nin (Hz. Ali'nin diğer oğlu) imamlığını savunanlar."},{"k":"n","n":2,"x":"**İmametin kesintiye uğradığına inananlar:** İmamet zincirinin bittiğini düşünenler."},{"k":"h5","x":"3. İmâmiyye'nin selefleri: Ali b. Hüseyin Zeynelâbidîn'in imamlığını benimseyenler."},{"k":"p","x":"Bu grup, Zeynelâbidîn'i ilim ve amel açısından en üstün ve imamet için en layık kişi olarak gördü, diğer iddiaları reddetti ve Hz. Peygamber'den gelen delillerle kendi görüşlerini destekledi."},{"k":"p","x":"Sonuncu grup, bugünkü **İmâmiyye Şiası'nın (On İki İmam Şiası)** temelini oluşturan düşünceyi geliştirmeye başlamıştır."},{"k":"p","x":"İmâmiyye/İsnâaşeriyye, Şia'nın en kalabalık koludur ve imameti Hz. Ali, Hz. Hasan, Hz. Hüseyin ve Hz. Hüseyin'in soyundan gelen on iki imama nispet eder. Hicri 260 (Miladi 873) yılında gaybete girdiğine inanılan On İkinci İmam Muhammed Mehdi'yi kabul ettikleri için **\"İsnâaşeriyye\"** olarak adlandırılırlar. Günümüzde Safeviler döneminden beri İran'da hâkim ve resmi mezhep olup **\"İran Şiiliği\"** olarak da bilinir. Bazı klasik kaynaklarda ise Zeyd b. Ali'yi savaşta terk edip İmam Cafer Sadık'a tabi olanlar anlamında **\"Rafiziyye\"** olarak geçerler. Râfizî isimlendirmesi, Zeydîler açısından İmam Zeyd'in terk edilmesi, Sünniler açısından da ilk iki halifenin reddedilmesi şeklindeki iki büyük günahı hatıra getirmektedir. Bu yaygın kabulden ayrı olarak \"rafiza\" isminin Muhammed Bakır'ın ölümü üzerine imametin kendisine geçtiğini ileri süren Muğire b. Said'in imametini kabul etmeyerek onu terk edip Cafer b. Muhammed'in imametine inananların müşterek adı olduğunu belirtenler de vardır."},{"k":"h","x":"Tarihçesi ve Gelişimi"},{"k":"p","x":"On İkinci İmam Muhammed Mehdi'nin Hicri 260'taki gaybeti, İmâmiyye Şiası içinde fırkalaşma sürecini hızlandırmıştır. Zahirde bir imamın bulunmaması, Zeydiler dışındaki Şii gruplarda belirgin bir hareketliliğe yol açmıştır. Özellikle İsmaililer bu dönemde teşkilatlanarak devlet kurmuşlardır."},{"k":"p","x":"İmâmiyye Şiası ise gaybetin ilk yıllarını **Gaybet-i Suğra** (Hicri 260-328 / Miladi 873-940) dönemi olarak kabul eder. Bu dönemde gaib imamın dört özel elçi **(sefir)** aracılığıyla insanlarla iletişim kurduğuna ve sorunlarını çözdüğüne inanılır. Dört sefir şunlardır: Ebû Amr Osman b. Saîd, Ebû Cafer Muhammed b. Osman, Ebu'l-Kâsım Hüseyin b. Ruh en-Nevbahtî ve Ebu'l-Hasan Ali b. Muhammed es-Samerri."},{"k":"p","x":"Dördüncü sefirin ölümü ve Mehdi'den gelen son mektupla **Gaybet-i Kübra** (Hicri 329 / Miladi 941 sonrası) dönemi başlamıştır. Bu dönemde artık yeni bir elçi gönderilmeyeceği ve imamın zuhurunun Allah'ın iznine bağlı olduğu bildirilmiştir."},{"k":"p","x":"Hicri 4. yüzyılın ikinci çeyreğinde Büveyhîler'in desteğini kazanan İmâmiyye, bu dönemde temel eserlerini (literatürünü) derlemiştir. Şii hadis külliyatının en önemlilerinden sayılan **\"Kütüb-ü Erbaa\"dan el-Kâfî** – el-Kuleynî **Men Lâ Yahduruhu’l-Fakîh** – Şeyh Sadûk (el- Kummî) **Tehzîbu’l-Ahkâm** – Şeyh Tûsî **el-İstibsâr** – Şeyh Tûsî üçü bu dönemde yaşamış önemli İmami âlimler tarafından telif edilmiştir."},{"k":"p","x":"**Kelamî ve Felsefî Öncüler:** Şeyh el-Müfid (ö. 1023): **“Evâilü’l-Makâlât”** ve **“Tashîhu’l- İtikâd”** Şerîf er-Radî (ö. 1016): **“Nehcü’l-Belâğa”yı** derleyen Şerîf el-Murtazâ (ö. 1041): **“el- Emâlî”** müellifi Molla Sadrâ (ö. 1640): irfânî düşüncenin önemli temsilcisi olarak sayılır. Gaybet döneminde ortaya çıkan önemli bir gelişim de İmâmiyye içindeki metodolojik ayrılıktır. İmamın yokluğunda dini meselelerde nasıl hüküm verileceği konusu, âlimleri **Ahbârîlik** (sadece hadislere dayanma) ve **Usûlilik** (hadislerin yanı sıra içtihadı kabul etme) olarak iki ana ekole ayırmıştır. Bu ayrım sonraki dönemlerde İmâmiyye düşüncesini şekillendirmiştir. İmâmiyye düşüncesi, fıkıh ve akaid alanının yanı sıra, özellikle Molla Sadra gibi isimlerle felsefe ve irfan alanında da etkili olmuştur."},{"k":"p","x":"Büveyhîler sonrası duraklama döneminde Şeyh Tabersi gibi âlimler yetişmiştir. Moğol istilası döneminde Sünnilere karşı Moğollarla iş birliği yapan Nasiru'd-Dîn Tûsi ve onun öğrencisi Allâme el-Hilli (İlhanlı Olcayto Hüdâbende'nin Şiiliği benimsemesinde etkili olmuştur) gibi isimler İmâmiyye'nin sonraki yüzyıllardaki önemli şahsiyetlerindendir."},{"k":"p","x":"Ebû Said Bahadır Han dönemiyle birlikte İmamiyye Şiiliği devlet desteğini kaybetmiş olsa da, 1501 yılında Safevîler'in Tebriz'de iktidara gelmesiyle yeniden resmî mezhep statüsü kazanmıştır. Safevîler, İmamiyye'yi klasik çizgisinden saparak daha müfrit ve siyasallaşmış bir yapıya dönüştürmüş, Anadolu ile bağlarını kullanarak mezhebi Osmanlı topraklarına yaymaya çalışmış, ancak bu Yavuz Sultan Selim’in müdahalesiyle engellenmiştir."},{"k":"p","x":"Safevîler, tarikat kökenli yapıları nedeniyle şeyhlik ve Şahlık makamlarını birleştirmiş, Şiî âlimleri özellikle Irak ve Lübnan’dan İran’a davet ederek mezhebi yeniden yapılandırmışlardır. Bunlardan Kereki gibi bazıları saray yanlısı bir duruş sergilemiştir. Ancak ulemâ büyük oranda saraydan bağımsız kalmıştır. 17. yüzyılda Ahbârilik yeniden canlanmış; Feyz el-Kâşânî ve Muhammed Bakır Meclisî gibi âlimler yetişmiştir."},{"k":"p","x":"Safevîlerin ardından gelen **Avşar** ve **Kaçar** hanedanları döneminde Usûlî ulemâ halk nezdinde otoritelerini artırmış, Ayetullah Behbehânî döneminde Ahbârîlere üstünlük sağlamıştır. Bu süreçte \"mutlak merci-i taklid\" kavramı ile ulemânın halk üzerindeki etkisi kurumsallaşmıştır."},{"k":"n","n":19,"x":"yüzyıldaki Tütün İsyanı ve 1905 Anayasa Hareketleri, ulemânın siyasî gücünü pekiştirdiği dönüm noktalarıdır. Pehlevîler dönemindeki modernleşme girişimlerine ulema tepki göstermiş, özellikle vakıf arazilerinin kaybı ve Batıcı reformlar Şiî ulemâyı harekete geçirmiştir. Humeynî'nin önderliğinde başlayan muhalefet, onun velâyet-i fakih öğretisiyle teorik bir çerçeveye oturtulmuştur."},{"k":"p","x":"Velâyet-i fakih anlayışı, imamın gaybeti döneminde onun temsil yetkisinin en yetkin fakih tarafından yürütülmesini esas alır. Bu teori, halkı devrime yönlendirmede bir araca dönüşmüş ve 1979 Devrimi'ne öncülük etmiştir. Humeynî’nin ölümünden sonra Ali Hâmeneî velâyet makamına geçmiştir."},{"k":"p","x":"Devrim sonrası oluşan yönetim, cumhuriyet biçiminde teşkilatlanmışsa da velâyet-i fakih ile ruhânî otoriteye bağlı kalmıştır. Ancak zamanla Mehdi’nin zuhurunun gerçekleşmemesi ve sosyal sorunlar, bu yapının sorgulanmasına neden olmuştur."},{"k":"h","x":"İmâmiyye/İsnâaşeriyye'nin İnançları ve Dini Pratikleri"},{"k":"p","x":"İmâmiyye/İsnâaşeriyye mezhebine göre imanın temel esasları (Usûlü'd-Dîn) beştir: Tevhid, Adalet, Nübüvvet, Mead (Ahiret) ve İmamet. Özellikle İmamet inancı, diğer Müslüman mezheplerinden farklı olarak, mümin olmanın zorunlu bir şartı kabul edilir."},{"k":"h","x":"İnanç Esasları (Usûlü'd-Dîn)"},{"k":"n","n":1,"x":"**Tevhid:** Allah'ın var ve bir olduğuna, eşi ve benzeri olmadığına inanırlar. Allah'ın sıfatları konusunda genellikle Mu'tezile'ye benzer şekilde sıfatların zâtın aynı olduğunu savunurlar. Bunun doğal sonucu olarak Kur'an'ın sonradan yaratıldığını ve rüyetullahı inkâr ederler. Tevhidi; zât, sıfat, fiil ve ibadet tevhidi olarak dört başlıkta incelerler. Bu tasnifin amacı, imamlara atfettikleri yüksek statü nedeniyle yanlış anlaşılmaları önlemektir; bu bağlamda ibadet edilecek tek varlığın Allah olduğunu kesin dille ifade ederler. \"Bedâ\" inancı da Tevhidle ilişkilidir; bu, Allah'ın bir şeyi bildirmesinden sonra, masum imamlardaki bilgi tıkanıklığını veya görünen durumun değişmesini açıklamak için, o şeyin farklı tecelli etmesidir (Nesh'e benzetilir)."},{"k":"n","n":2,"x":"**Adalet:** Allah'ın mutlak adil olduğuna ve kulların fiillerinde hür ve sorumlu olduğuna inanırlar. Cebr ve Tefviz (tam yetki verme) arasında orta bir yol benimserler."},{"k":"n","n":3,"x":"**Nübüvvet:** Kur'an'da adı geçen ve geçmeyen tüm peygamberlere iman ederler. Peygamberin ismet, fetanet, sıdk ve emanet sahibi olması gerektiğine inanırlar. Hz. Muhammed'in en üstün peygamber olduğuna ve Kur'an'ın onun en büyük mucizesi olduğuna inanırlar."},{"k":"n","n":4,"x":"**Mead (Ahiret):** Ahiret hayatı, haşir, hesap, mizan, sırat, cennet ve cehennem gibi temel konularda diğer Müslümanlarla ortak inançlara sahiptirler. **Ancak bu konularda Şia'ya özgü yorumlar bulunur; örneğin kabirde imanın kim olduğunun sorulması, Hz. Ali'nin sancaktar olması, İmamların şefaat yetkisine sahip olması gibi.**"},{"k":"n","n":5,"x":"**İmamet:** İmâmiyye'nin merkezî ve sadece kendilerine özgü inancıdır. Allah ve Peygamber tarafından açık ve gizli nas ile belirlenen on iki masum imamın imamlığını bilmek ve onlara bağlanmak imanın şartıdır. İmamlara; ilahi ilhamla bilgi alan, dini hükümleri yorumlayan, hatta dini hayatta bağlayıcı yeni hükümler koyabilen (vahiy almamakla birlikte), masum ve her türlü hata ve kusurdan uzak varlıklar olarak inanılır. İmam, aynı zamanda velayet ve vesayet sahibidir. On ikinci İmam Muhammed Mehdi'nin Hicri 260'ta gaybete girdiği ve Allah izin verdiğinde zuhur edeceğine inanılır. İmamın zuhurundan sonra, ona ve önceki imamlara zulmedenlerin (ilk üç halife dahil) cezalandırılacağı inancı yer alır."},{"k":"h","x":"Dini Kaynaklar ve Pratikler"},{"k":"li","x":"**Dini Kaynaklar:** Kur'an, Sünnet (2+12 masumdan gelen haberler), İcmâ ve Akıl (İçtihad) İmâmiyye fıkhının kaynaklarıdır."},{"k":"li","x":"**Sünnet Anlayışı:** Sünnet, sadece Hz. Muhammed'in söz, fiil ve takrirleri değil, aynı zamanda Hz. Fatıma, Hz. Ali ve on bir imamın söz, fiil ve takrirlerini de içerir. İmamların sözleri Hz. Peygamber'in sözleri kadar bağlayıcı kabul edilir. Hadis külliyatlarının (Kütüb-ü Erbaa gibi) büyük çoğunluğu İmamlardan, özellikle İmam **Cafer es-Sadık'tan** rivayet edilir. Sahabeye yönelik olumsuz bakış açıları nedeniyle, çok az sayıda sahabeden (Hz. Ali'nin hilafet hakkını savunan sahabe Salman Farisi, Mikdat, Ammar, Ebû Zer gibi on altı kişi) hadis alırlar, diğerlerini reddederler. Bu durum \"Tevelli\" (Ehl-i Beyt'i ve sevenlerini sevmek) ve \"Teberri\" (Ehl-i Beyt'i sevmeyenlerden uzaklaşmak/reddetmek) inancının bir yansımasıdır."},{"k":"li","x":"**Kur'an Anlayışı:** Usûli kolu mevcut Kur'an'ın tahrif edilmediğini kabul ederken, Ahbârî kolunda tahrif iddialarına rastlanır (el-Kâfi'deki bazı rivayetler gibi). Ancak Usûliler bu iddiaları reddeder ve Kur'an'ı kendi imamet inançlarını destekleyecek şekilde tefsir etme eğilimindedirler."},{"k":"li","x":"**Gaybet Dönemi ve Ulema:** İmamın gaybetinde dini liderlik ulemaya geçmiştir. Halk, hayatta olan bir müctehidi taklit etmekle yükümlüdür. Bu durum, Mollalık, Hüccetü'l- İslâm, Ayetullah ve Ayetullahü'l-Uzma gibi hiyerarşik bir ulema sınıfının oluşmasına yol açmıştır."},{"k":"h5","x":"Şiî Âlimler Hiyerarşisi (İmâmiyye Şîası)"},{"k":"tbl","r":[["Sıra","Unvan / Makam","Açıklama"],["1","Mectehid-i Mutlak / Merce‘-i Taklîd","En yüksek otorite. Fıkhî konularda taklit edilen büyük müctehid. Halk, onun fetvalarına uyar."],["2","Âyetullāh el-‘Uzmâ","“En büyük Allah'ın işareti” unvanı taşıyan yüksek dereceli müctehid. Genellikle Merce‘ olanlardır."],["3","Âyetullāh","Büyük müctehidler sınıfında. Kendine has içtihadı olabilir ama genellikle Merce‘lik makamında değildir."],["4","Hüccetü’l-İslâm ve’l- Müslimîn","Yüksek dereceli ilim sahibi ama henüz içtihad derecesine ulaşmamış veya fetva vermeyen âlim."],["5","Şeyh / Allâme / Fakih","Alanında derin bilgi sahibi olan ama içtihad makamına ulaşmamış orta ve ileri düzey alim."],["6","Talebe (Tâlibu’l- ‘İlm)","Medresede ilim tahsil eden öğrenciler. Henüz icazet almamış olanlar."]]},{"k":"h5","x":"İbadet ve Uygulamalar"},{"k":"li","x":"**Namaz:** Abdestte ayakları mesh ederler. Ezanlarında \"Eşhedü enne Aliyyen Veliyyullah\" ve \"Hayye a'la hayri'l-amel\" eklemeleri bulunur. Öğle ile ikindi, akşam ile yatsı namazlarını birleştirerek kılarlar. Kerbela toprağından yapılmış küçük toprak parçaları (mühür) üzerine secde ederler. Cuma namazı konusunda farklı görüşler vardır (Ahbâriler kılınmayacağını, Usûliler isteyenin kılabileceğini söyler)."},{"k":"li","x":"**Oruç ve Hac:** Temel prensipler diğer Müslümanlarla aynı olmakla birlikte, Ehl-i Beyt'in mezarlarını ziyaret etmek büyük önem taşır."},{"k":"li","x":"**Zekât ve Humus:** Zekâtın yanı sıra, elde edilen kazancın beşte birinin (Humus) verilmesi zorunludur. Humus'un bir kısmı İmama aittir ve gaybet döneminde adaletli müctehide verilir. Diğer kısımlar ise fakir, yetim ve yolda kalmış Haşimoğulları'na verilir (ihtiyaten bu da müctehide teslim edilir)."},{"k":"li","x":"**Mut'a Nikâhı:** Belirli bir süre ve bedel karşılığında yapılan geçici evliliği (Mut'a), Nisa suresi 24. ayete ve Hz. Peygamber'in uygulamasına dayanarak caiz görürler. Hz. Ömer'in bu uygulamayı yasaklamasını keyfi bir yorum olarak değerlendirirler."},{"k":"h","x":"Dünya Şiî Mezhepleri ve Yüzdelik Dağılımı (Tahmini)"},{"k":"tbl","r":[["Mezhep / Grup","Alt Kollar / Özellikler","Toplam Şiîler İçindeki Oranı","Müslümanlar İçindeki Oranı"],["1. İmâmiyye (İsnâ‘aşeriyye)","Caferî mezhebi, 12 İmam inancı, Velâyet-i Fakih, Merce‘lik sistemi","%80–85","%10–12"],["a) Usûlî","İçtihad ve taklit sistemini benimser","(İmâmiyye'nin %95’i)","—"],["b) Ahbârî","Sadece hadisleri esas alır, içtihad karşıtıdır","(İmâmiyye'nin %5’i)","—"],["2. İsmâilîyye","Yedi İmamı tanır, bâtınî yorumlar güçlüdür","%10–12","%1–2"],["a) Nizârî (Ağa Han Cemaati)","En yaygın İsmâilî koludur, Ağa Han liderliğinde","(İsmâilî'nin %85– 90’ı)","—"],["b) Musta‘lî (Bohra grupları)","Hindistan ve Yemen’de yoğunlaşır","(İsmâilî'nin %10– 15’i)","—"],["3. Zeydiyye","5. İmam Zeyd’i takip eder, fıkıh açısından Sünnîliğe daha","%3–5","%1"],["a) Hâdisî / Mutazilî eğilimli","5. İmam Zeyd’i takip eder, fıkıh açısından Sünnîliğe daha yakındır","—","—"],["4. Gulat / Fırak-ı Dâlle","Yemen’deki Husi hareketi bu gruptandır","%2–3","%0.5–1"],["a) Alevî (Nusayrî)","vs. Suriye’de yoğunlaşır, Ali’nin ilahî yönünü vurgular","(Gulat içinde önemli bir grup)","—"],["b) Dürzî","Suriye’de yoğunlaşır, Ali’nin ilahî yönünü vurgular","(Çoğu artık kendini Müslüman saymaz)","—"]]},{"k":"h","x":"İsnâaşeriyye (On İki İmam) Tablosu"},{"k":"tbl","r":[["Sıra","İmamın Adı","Doğum Vefat","Babası"],["1","Ali b. Ebî Tâlib","600 – 661","Ebû Tâlib"],["2","Hasan b. Ali","625 – 670","Ali b. Ebî Tâlib"],["3","Hüseyin b. Ali","626 – 680","Ali b. Ebî Tâlib"],["4","Ali Zeynelâbidîn","658 – 712","Hüseyin b. Ali"],["5","Muhammed el-Bâkır","677 – 732","Ali Zeynelâbidîn"],["6","Ca‘fer es-Sâdık","702 – 765","Muhammed el-Bâkır"],["7","Mûsâ el-Kâzım","744 – 799","Ca‘fer es-Sâdık"],["8","Ali er-Rızâ","766 – 818","Mûsâ el-Kâzım"],["9","Muhammed el-Cevâd (Taqî)","811 – 835","Ali er-Rızâ"],["10","Ali el-Hâdî (en-Nakî)","827 – 868","Muhammed el-Cevâd"],["11","Hasan el-Askerî","846 – 874","Ali el-Hâdî"],["12","Muhammed el-Mehdî (el-Kâim)","869 – (?)","Hasan el-Askerî"]]}]},{"h":"Emevîlerin Son Döneminde Şiî Ayaklanmalar","b":[{"k":"p","x":"Tevvâbûn hareketi ve Muhtar isyanından sonra bir süre, \"gâib imam\"a inananlar arasında imam zuhur etmeden silahlı harekete geçilmemesi gerektiği düşüncesi hâkim oldu. Bu inanç yüzünden imamın zuhurundan önce harekete geçmek isteyen bazı gruplar kılıç yerine tahta sopalar taşımış ve **Haşebiyye** adıyla anılmıştır. 110/737 dolaylarından itibaren Emevî yönetiminin zayıflamasını fırsat bilen kişiler, kendi adlarına ya da Ehl-i Beyt adına yeni isyanlar başlattı."},{"k":"tbl","r":[["İsyan","Liderler","Özellikleri"],["Beyân-Muğîre isyanı (119/737)","Beyân b. Sem'ân et-Temîmî ve Muğîre b. Saîd el-İclî","Beyân önce Ebû Hâşim'in imametini ve onun elçisi olduğunu ileri sürdü; Muğîre tecsîme dayalı bir yaratılış anlayışı geliştirdi. Irak valisi Hâlid el-Kasrî ikisini yakalatıp yaktırdı."],["Ebû Mansûr isyanı (121-127/738-744 arası)","Ebû Mansûr el-İclî","Muhammed el-Bâkır'ın vasisi olduğunu, göğe çıkarılıp peygamber olarak görevlendirildiğini iddia etti. Taraftarları (Mansûriyye) muhaliflerini kılıç yerine boğarak öldürmeleriyle tanındı. Kûfe valisi Yûsuf b. Ömer es-Sakafî tarafından idam edildi."],["Zeyd b. Ali isyanı (122/740)","Zeyd b. Ali","Kûfe'de başladı; Zeydiyye'nin doğuşuna zemin hazırladı (bkz. 6. ünite)."],["Abdullah b. Muâviye isyanı","Abdullah b. Muâviye (Ca'fer et-Tayyâr soyundan)","Emevîlerin son yıllarında İran'ın bazı bölgelerinde hâkimiyet kurdu; aşırı fikirli gruplar etrafında toplandı."]]},{"k":"not","x":"Bu isyanların taraftarları hem Arap hem de mevâlîden oluşuyordu. Becîle, Kinde ve İcl kabileleri hem Muhtar'ın hem Muğîre'nin hem de Ebû Mansûr'un isyanlarında yer almıştır."},{"k":"d","t":"Haşebiyye","x":"İmam zuhur etmeden kılıç kullanılamayacağına inandıkları için tahta sopalarla donanan erken dönem Şiî grup."}]},{"h":"Gaybet-i Suğrâ'nın Dört Sefiri","b":[{"k":"p","x":"Küçük gaybet döneminde (260-329/874-941) on ikinci imam ile Şiî topluluk arasındaki irtibatı sağladığına inanılan dört sefir şunlardır:"},{"k":"n","n":1,"x":"**Osman b. Saîd el-Amrî**"},{"k":"n","n":2,"x":"**Muhammed b. Osman el-Amrî** (Osman b. Saîd'in oğlu)"},{"k":"n","n":3,"x":"**Hüseyin b. Rûh en-Nevbahtî**"},{"k":"n","n":4,"x":"**Ali b. Muhammed es-Simerî**"},{"k":"p","x":"Dördüncü sefir ölmeden önce imamdan gelen son mektupta artık sefir tayin edilmeye
