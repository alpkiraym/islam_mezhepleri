 halife olarak tanımışlardı. Onun döneminde Allah Müslümanlara birçok fetihler müyesser kılmış, esirler ve ganimetler son derece çoğalmıştır. Hem Hz. Ebû Bekir hem de Hz. Ömer, ümmetin halifesi olarak birlik ve beraberliğe büyük ehemmiyet vermiş, ihtilafların fitneye dönüşmemesi için gerekli önlemleri almışlardı."},{"k":"p","x":"Hz. Ömer'in ölümünü takiben şûra üyeleri Hz. Osman b. Affan'a biat hususunda ittifak ettiler. Hz. Osman'ın zamanında İslam daveti devam etti, fetihler çoğaldı, beytülmal doldu, halife insanlara en güzel tarzda davrandı, cömertlik gösterdi. Fakat bu esnada Ümeyyeoğullarından olan akrabalar onun felaketine sebep olacak olaylara ön ayak oldular, halka zulmettiler ve sonuçta suç halifeye yüklendi. Onun zamanında ortaya çıkan ve kendisinin sorumlu tutulduğu pek çok hadisede Ümeyyeoğullarının rolü vardır. Bunların hepsi zor gününde Hz. Osman'ı yalnız bırakmışlar ve sonuçta evinde mazlum olarak öldürülmüştür. Bu zulümden dolayı hala da sönmemiş bir fitne ortaya çıkmış bulunmaktadır."}]},{"h":"Mezheplere Ayrılmaya Yol Açan Sebepler","b":[{"k":"h","x":"1. Dinî Sebepler"},{"k":"p","x":"**a. Nübüvvet Döneminden Uzaklaşılması:** Bu devirde Müslümanlar sosyal ve amelî alanda olduğu gibi akaid sahasında da herhangi bir problemle karşılaştıklarında bunu doğrudan Hz. Peygamber'e müracaat ederek çözüyorlardı. Bunun yanı sıra Hz. Peygamber, Müslümanlar arasında ihtilaf çıkarabilecek, onların inançlarında şüpheler uyandırabilecek konuların ortaya atılmasına ve tartışılmasına asla müsaade etmiyordu. Bu yüzden **“kader\"** hakkında konuşulmasına müsaade etmemiş, ataları kutsama inancına yol açacağı mülahazasıyla ilk dönemlerde kabir ziyaretlerini yasaklamış, Kâbe'yi yıkıp Hz. İbrahim'in temelleri üzerine yeniden inşa etmekten vazgeçmiştir."},{"k":"p","x":"Hz. Peygamber vefat ettikten sonra Müslümanların başında halife bulunsa bile, hiç kimse Resulullah'ın maddi-manevi otoritesine sahip olamayacağı için, ortaya çıkan problemleri Kur'an ve sahih sünnet ışığında çözme konusunda farklı anlayışlar ortaya çıkıyordu. Buna ilaveten Müslümanlar arasına karışmış bulunan münafıklar asr-ı saadette ve ilk iki halife döneminde kötü emellerini ortaya çıkarma fırsatı bulamamışlar; bu fırsatı Hz. Osman ve sonraki dönemlerde yakalayabilmişlerdi. Hülasa nübüvvet nurunun giderek gücünü yitirmesi Müslümanlar arasında ihtilafların çıkmasına yol açmıştır."},{"k":"p","x":"**b. Nasların Karakterinden Doğan Sebepler:** Nasların sahip olduğu özellikler, üslup ve sübut- delalet özellikleri olmak üzere iki açıdan ele almak mümkündür."},{"k":"li","x":"Gerek ayetler gerekse hadislerin hepsinin üslup özellikleri aynı olmayıp, Arap dilinin belagat ve dil kurallarına göre çeşitli farklılıklar içerirler. Naslarda teşbih, temsil, mecaz, kinaye gibi edebî üsluplar kullanılmış, muhkem ve müteşabih karakterli naslar ortaya çıkmıştır."},{"k":"li","x":"Ayetlerin sübutu ve sıhhati hususunda Müslümanlar arasında herhangi bir ihtilaf bulunmamaktadır. Ancak, ayetlerin belli bir konuya delil olup olmadıkları konusunda ihtilaf vardır. Buna ayetlerin delaletlerinin kat'i veya zanni oluşu denilmektedir. Hadislere gelince, bunların hem sübut hem de delaletleri noktasında ihtilaf vardır."},{"k":"p","x":"**C. Nasların Anlaşılması Zor Bazı Konular İçermesi:** Kur'an ayetlerinin hepsi üslup açısından aynı özellikte değildir. Kur'an'da ifade edildiği üzere (bkz. Âl-i İmran, 3/7) bazı ayetler muhkem bazı ayetler müteşabihdir. Bu ayetlerin metin içerisinde hakikat, mecaz, teşbih, temsil gibi kullanımlarının olması onların anlaşılmasını güçleştirmektedir."},{"k":"p","x":"Bazı ayet ve hadisler Allah'ın zatı, sıfatları, insanın iradesi ve özgürlüğü, kader, ruh, ahiret gibi her yönüyle anlaşılması güç soyut konuları içermektedir. Bu gibi mücerred ve bir ölçüde dinî- felsefi konuların anlaşılmasında ortaya çıkan görüş ayrılıkları da mezheplerin oluşmasına yol açan etkenlerdendir. Zira insanların idrakleri, bilgi birikimleri ve anlayış kapasiteleri farklı seviyelerdedir."},{"k":"p","x":"Lüğavi anlamlar hususunda da ihtilafa düşüldü. Muhkem ve müteşabih ayetler, tecsim ve tenzih görüşünü savunan grupları, kaza ve kader \"cebir' ve “ihtiyar\" görüşlerini; mümin, fasık, kâfir kelimelerinin lüğavi yorumları \"el-menzile beyne'l-menzileteyn\" problemini ortaya çıkardı."},{"k":"p","x":"**d. Dinî Metinlere Yaklaşımda Metot Farklılığı:** Naslara yönelik bu tavırlar, teslimiyetçi, akılcı, zahirçi ve sembolik metotlar olarak belirtilebilir. Nitekim teslimiyetçi bakış **Selefiyye'yi**, zahirî- yüzeysel tavır siyasi ve itikadi alanda **Haricileri**, fıkhî sahada ise **Zahiriyye'yi,** batıni tavır **Batıniyye'yi**, sırf akılçı-felsefi yaklaşım **Mu'tezîle'yi**, akıl ve nakil arasında uyumlu bir ilişki kuran telifçi yaklaşım ise **Eşariyye** ile **Matüridîyye**, mezheplerini ortaya çıkardı."},{"k":"p","x":"**e. İslam'da Fikir Hürriyeti ve İnsanın Düşünen Varlık Olması Gerçeği:** İnsan düşünen, akleden ve ilahî hitaba muhatap bir varlıktır. İnsanın bu özelliği, fikir ihtilaflarını meydana getiren tüm diğer sebeplerin de kaynağıdır. Kur'an-ı Kerim, Müslümanların dinin hakikatini anlamaları için düşünmelerini, akıllarını kullanmalarını istemiş, akla ve düşünceye büyük önem vermiştir. Bu itibarla, Allah, körü körüne inanmayı değil; bilerek, tefekkür ederek ve araştırarak inanmayı emretmektedir."},{"k":"p","x":"Müslümanlar, Kur'an'a yönelip onu okumaya ve tefekkür etmeye başladıklarında Kur'an'ın ameli hayata yönelik kanunlarından fıkıh mezhepleri, metafiziği irdeleyen bir kitap olarak bakıldığında kelam ilmî, uhrevi bir kitap gözüyle bakıldığında züht, tasavvuf ve ahlak sistemi doğdu. İhtilafı reddetmek, insan fitratını kabul etmemek ve düşünceyi donuklaştırmak demektir. İhtilafın olduğu yerde doğru da yanlış da olacak ama önemli olan hakikati arama çabasıdır."},{"k":"p","x":"**f. Kader ve ilahî Takdir Sorunu:** Müslümanların tecrübe ettiği acı olaylar, kader ve ilahî takdir meselesini tartışmalarına sebebiyet vermiştir. Müslümanların birbirleriyle savaşmaları ve bunlara katılanların dini durumu tartışılmış; “Kader nedir? İnsanın belirlenmiş, değiştirilemez bir kaderi var mıdır? Varsa insanın yaptıklarından ve yapmadıklarından sorumlu olmasının anlamı nedir? İnsan bu hayatta iş yaparken kendi iradesiyle mi hareket etmektedir? İrade nedir? Allah'ın iradesiyle insanın iradesi nasıl bir ilişki hâlindedir? Hürriyet nedir, sınırları nelerdir? İnsan için mutlak bir hürriyetten bahsedilebilir mi? tarzında pek çok soru ve mesele gündeme gelmiş, tartışılmıştır. Elbette bu nevi sorulara verilen cevaplar da aynı olmamış, farklı görüş ve anlayışlar ortaya çıkmıştır. Öte taraftan kader ya da insan hürriyeti meselesinin politik çıkarlar için istismar edildiği de bilinmektedir. (Hz. Ali ile Hz. Muaviye arasındaki içtihad farklılıkları örnektir)"},{"k":"h","x":"2. Psikolojik Sebepler"},{"k":"p","x":"**a. İnsanların Karakterlerinin Farklı Olması:** İnsanlar farklı özelliklerde yaratılmışlardır. Şüphesiz insanların yetişmesinde içinde bulunduklan çevrenin, kültür ve medeniyetin önemli bir payı vardır. Bazı insanların sahip olduğu psikolojik özellikler onların inanç dünyasına yansımaktadır. Bazıları lider olma, bazıları ise lidere tabi olma mizacındadır. Muhtar es-Sakafi, Mirza Hüseyin Ali ve Mirza Gulam Ahmet gibi şahsiyetlerin çevresinde oluşan mehdilik hareketlerini hem liderleri hem de onlara tabi olanlar açısından örnektir."},{"k":"p","x":"**b. İnsanların Zihniyet ve Gayelerinin Farklı Olması:** İslam'a girenlerin hepsinin aynı inanç ve samimiyet içinde oldukları söylenemez. Hz. Peygamber döneminde bile -siyasi, ekonomik birtakım sebeplerden ötürü- Müslüman görünen ancak ilk firsatta İslam'a ve Müslümanlara saldırmayı gözetleyen birtakım art niyetli kimseler vardı. Bunlar, Müslümanların birlik ve beraberliğini yıkmaya yönelik her tür muhalefet hareketinin içine girmekten çekinmemişler, bizzat bu tür faaliyetleri ihdas etmişler ya da yönlendirmişlerdir. Nitekim Hz. Osman'ın şehit edilmesinden sonra Hz. Ali'nin halife seçilmesi ve Ali-Muaviye çekişmesi sürecinde vuku bulan hadiseler burada örnek verilebilir."},{"k":"p","x":"**c. Liderlik Tutkusu:** İnsanların ihtilaf etmelerinin sebeplerinden biri de liderlik sevdası ve başkalarına hükmetme arzusudur. Bu durum özellikle siyasi sahadaki ihtilaflarda kendisini göstermektedir. Bazen ırki taassuplar da ihtilafların ortaya çıkmasına sebebiyet verebilir. Nitekim İslamiyet öncesindeki Ümeyyeoğulları-Haşimoğulları arasındaki iktidar mücadelesi, Hz. Osman'ın hilafetinin son yıllarında özellikle Emevî ailesine mensup bazı valiler tarafından körüklenmiş, diğer ailelerin de bu noktadaki duyarlılıklarını diriltmiştir. Emevîlerin liderlik sevdasının ilk dönemden itibaren Müslümanların en önemli ihtilaf konusu olan imamet tartışmalarına zemin hazırlamıştır."},{"k":"h","x":"3. Sosyal Sebepler"},{"k":"p","x":"İnsan sosyal bir varlık olup, hayatını devam ettirebilmek için diğer insanlara muhtaçtır. Bu ihtiyaç, onun topluluklar hâlinde yaşamasına ve fert olarak içinde yaşadığı toplumla diyalog kurmasına; onların inanç, kültür ve fikirlerinden etkilenmesine; aynı gelenek ve görenekleri benimsemesine sebebiyet vermiştir. Bu itibarla, mezheplerin ortaya çıkış süreçleri incelenirken onların hangi çevrede, toplumda veya coğrafyada zuhur ettiklerini tetkik etmek gerekir. Toplumların eğitim düzeyleri, toplumun ya da fertlerin göçebe, yarı göçebe veya yerleşik oluşları onların dinin asıl kaynaklarını anlama ve algılama süreçlerini etkilemektedir."},{"k":"p","x":"**a. Irkçılık:** İslam dini **\"Müminler kardeştir.\"** ayetiyle bütün müntesiplerini manevi çatısı altında birleştirmiş, dil ve kan birliği temeline dayalı eski binayı yıkarak onun yerine inanç birliği üzerine kurulu bir toplum vücuda getirmiştir. Kur'an'da bu topluluğun adı \" **ümmet** ” olarak ifade edilmiştir. Kur'an-ı Kerim muhataplarını şu veya bu kavim isimleriyle değil, müminler-kafirler, iyiler-kötüler, akıllılar- akılsızlar, doğru sözlüler-yalancılar gibi değişik değerlere sahip manevi topluluklar olarak isimlendirmektedir. Kur'an, ırkların varlığını ilahi bir tensip olarak görmekte, ırk farklılıklarını bir hikmete dayandırmaktadır. Bu hikmet, millet ve kabilelerin tearufu yani insanların birbirlerini tanımalarıdır."},{"k":"p","x":"Irkçı ya da kabileci yaklaşımların ne denli önemli olduğunu görmemiz açısından **“yalancı peygamberler”** meselesini örnek göstermek mümkündür. Nitekim Hz. Peygamber'in vefatından hemen sonra bazı Arap kabileleri, Kureyş kabilesinin siyasi üstünlüğüne bir tepki olarak “ **Kureyş'in Peygamberi** \" yerine kendi kabilelerinden peygamberler çıkarma gayreti içine girmiş lerdir."},{"k":"p","x":"**b. Ekonomik Sebepler:** Hz. Peygamber döneminin sade, gösterişten ve lüksten uzak hayatı kısa zamanda sonuçlarını vererek Müslümanların her alanda büyük atılımlar yapmasına vesile olmuştu. Dünya malına değer vermeyen Müslümanlar bütün gayretlerini ve imkânlarını İslam'ın yayılması için harcadılar ve bunda başarılı da oldular."},{"k":"p","x":"Sonraki dönemlerde ganimetlerin çokluğu sade ve gösterişsiz hayatı etkiledi ve Müslümanların refah seviyesi arttıkça dünya malına verdikleri değer de arttı. Bu durum, asr-ı saadetin mütevazı hayatına alışmış samimi Müslümanları rahatsız etmiş, engel olamayınca da dünyadan el-etek çekerek kendilerini züht ve takvaya vermelerine sebep olmuştur. Böylece züht ve takva ile başlayan bu hareket İslam düşüncesinin disiplinlerinden birisi olan tasavvufun kurumlaşıp kök salması sonucunu doğurmuştur."},{"k":"h","x":"4. Siyasi Sebepler"},{"k":"p","x":"**a. Devlet Yönetimi (İmamet-Hilafet Meselesi):** Hz. Peygamber'in vefatıyla birlikte devlet başkanının kim olacağı, bunun belirlenmesinde nasıl bir ölçünün esas alınması gerektiği gibi hususlar gündeme gelmiş, hicri birinci asırdan itibaren bu meseleye istinaden pek çok ihtilaf zuhur etmiştir. Öyle ki bu ihtilaf çağlar boyu devam etmiş ve günümüzde bile canlılığını korumaktadır. (Halife seçimi için kırtas hadisesine bakınız)."},{"k":"p","x":"İmamet tartışmalanyla alakalı sürecin sonunda ilk olarak Hariciler ortaya çıkmıştır. Bunlar, Hakem olayını kabul etmemiş; Hz. Ali, Hz. Muaviye ve Amr b. As'ı küfürle itham etmişlerdir. Bu tartışmalardan uzak kalmaya çalışan ve Müslümanların birbiriyle yaptıklan savaşlarda ölen ve öldürülenlerin dinî konumuyla alakalı açıklama yapmaktan çekinen ve bunların durumunu ahirete irca edenler ise Mürcie fırkasının ilk temsilcileri olmuştur. Daha sonra buna farklı anlamlar yüklenerek iman konusu haline getirilmiş ve usu li'd-din'den saymıştır. Nitekim Şia, Hz. Ali ve neslinden gelen on bir imamın imametlerini kabul etmeyi hem Şiî olmanın ön şartı saymış hem de Müslümanlığın bir gereği olarak görmüştür."},{"k":"p","x":"**b. Siyasi Anlaşmazlıklar ve İç Savaşlar:** Fırkaların zuhuruna tesir eden amillerden biri de; hiç şüphesiz Müslümanlar arasında vuku bulan savaşlar ve “Büyük günah işleyen/mürtekib-i kebire”nin dinî konumu olmuştur (Hz. Osman'ın şahadeti, Cemel ve Sıffin vakıaları). Müslümanlar Hz. Peygamber döneminde ve ilk iki halife devrinde çeşitli savaşlara katılmış, ölüm ve öldürme hadiseleriyle karşılaşmışlardı. Ama bizzat kendi içlerinde ve bir birlerine karşı böyle bir mücadele yaşanmamış ve bu ölçülerde ağır sonuçlarla karşılaşmamışlardı. Onun için bu olayların sonucunda daha önce sorulmamış sualler soruluyor ve bunlara cevaplar aranıyordu."},{"k":"p","x":"O halde büyük günah işleyen bir müminin iman bakımından dindeki konumu nedir? Bu önemli soruya verilen cevaplar Haricilik, Mürcie, Mu'tezile, Ehl-i Sünnet gibi pek çok mezhebin ortaya çıkmasına sebebiyet vermiştir. Yine büyük günah işleyenlerin durumuyla alakalı olarak; \"İman nedir, tanımı ve mahiyeti nedir? İman-amel ilişkisi nasıldır?\" gibi sorulara cevap aranmıştır. İmanı sadece ikrar ve tasdik olarak kabul edenlerin yanı sıra amelleri onun ayrılmaz parçası olarak kabul edenler de olmuştur."},{"k":"h","x":"5. Dış Sebepler"},{"k":"p","x":"**a. Diğer Din ve Medeniyetlerle Karşılaşma:** Hz. Peygamber döneminde Müslümanlar Yahudi, Hristiyan ve putperest toplumlarla ilişki içinde olmuşlar, bunlara karşı nasıl bir tavır takınılması gerektiğini bizzat Hz. Peygamber'in uygulamaları ve tavsiyeleriyle öğrenmişlerdi."},{"k":"p","x":"Onun vefatından sonra, Müslümanlar, Irak ve İran'ın hazineleriyle birlikte bu topraklarda yaşamış antik kültür kalıntılarıyla karşılaşmış; Babil, Kelde, Asûr, Med, Pers, Elam kültür birikintisi ve bunlara ait işaretler Müslümanlar arasında görülmeye başlanmıştır. Bilhassa İran Mazdeizm'i, Maniheizm'i tüm canlılığıyla Müslüman çevrelerde kendini hissettirmiştir. Diğer taraftan Suriye'nin fethiyle birlikte Müslümanlar, Fenike, Grek, Süryani, Ermeni, Yâkubî ve hepsinden çok daha etkin biçimde egemen olan Bizans kültür ve medeniyetiyle karşılaşmışlardır. Kültür etkileşimini çok iyi gözleyen Halife Hz. Ömer, elinden geldiğince önleyici tedbirler almaya çalışmıştır. Mesela o, Müslümanların gayrimüslim kadınlarla evlenmesini, helal olduğu halde Müslüman neslin bozulmasına sebep olacağı endişesiyle yasaklamıştır."},{"k":"p","x":"Emevîler devriyle birlikte İslam devletinin başkentinin -her türlü dış etkiye kapalı olan Peygamber şehrinden uzaklaşarak Kûfe gibi Irak ve İran etkisine açık, Şam gibi Bizans ve Yunan tesir alanındaki bölgelere taşınması ve ardından Bağdat gibi yakın ve uzak doğunun etkisinde bir yere nakledilmesi yabancı kültürlerin etkisinin artmasında rol oynamıştır."},{"k":"p","x":"Diğer taraftan yeni fethedilen ülkelerde yaşayan insanların pek çoğu eski dinlerinden vazgeçerek İslam'a giriyorlardı. Ancak, bu yeni Müslümanlar arasında eski inançlarından tamamen sıyrılamayanlar, bunların etkisinden kurtulmaya muvaffak olamayanlar vardı. Onlar, İslam'a tamamen aykırı olmayan bazı örf, adet ve geleneklerini İslam örtüsü altında devam ettirmişlerdi. Buna örnek olarak geleneksel Türk dinindeki bazı uygulamaların Türklerin İslam'a girmesinden sonra da devam ettiği hususunu vermek mümkündür. Nitekim Türkler arasında atalara saygı inancı çok yaygındı. Bu inanca bağlı olarak ölünün ardından yedi, kırk, elli ikinci gün veya ölüm yılı devriyesinde düzenlenen periyodik törenler, kabir ve türbeleri ziyaret etmek, buralarda çaput bağlamak gibi birtakım âdetler eski din ve inançlardan getirilmiş, bir şekilde İslamlaştırılmıştır, denilebilir."},{"k":"p","x":"Mezheplerin ortaya çıkmasında Yahudilik ve Hristiyanlığın etkisini de göz ardı etmemek gerekir. Ehl-i kitaba mensup olduğu hâlde daha sonra ihtida eden pek çok kimse, Kur'an veya hadislerde açık olmayan, yorumu gerektiren bir çok hususta İsrailiyat denilen pek çok haberi İslam'a dâhil etmekte bir sakınca görmemişlerdir. Diğer taraftan fetihlerle birlikte Müslümanlar geniş bir coğrafyaya hâkim olmuş ve buraların halkıyla yakın diyaloğa girmişler, onların kültürlerinden etkilenmişlerdir."},{"k":"p","x":"**b. Tercüme Faaliyetleri:** İslam Kültür ve medeniyetinin oluşumunda, daha önceki medeniyetlerin ve bu medeniyetlerle kültür alış verişinin büyük katkısı olmuştur. Müslümanlar eski ilmî birikime karşı bir tavır takınmayarak kendi evrensel dünya görüşlerine destek olacak unsurları bünyelerine almakta sakınca görmediler."},{"k":"p","x":"Diğer kültürleri tanıma faaliyeti, onların önemli sayılabilecek eserlerini Arapçaya kazandırmaya yani tercüme faaliyetlerine kapı açmıştır. Gerçekleştirilen tercüme hareketlerinde sadece felsefi kitaplar değil aynı zamanda tabiat, tıp, kimya, astroloji, simya ve ahlak kitapları da yer almıştır. Eski Yunan ilimlerini Arapçaya tercüme faaliyeti Emevîlerin son dönemlerinde başlamış, Abbasî halifelerinden Mansûr (ö. 158/775), Harun Reşid (ö. 193/809) ve Me'mûn (ö. 218/833) dönemlerinde devam etmiştir."},{"k":"p","x":"Yunan felsefesinin İslam dünyasına aktarılmasında dönemin birer ilim merkezi olan ve felsefeden tabiat bilimlerine kadar pek çok ilmin okutulduğu İskenderiye, Cundişapur, Harran okullarının rolü büyüktür. Bu okulların bir kısmında Yunanca, bir kısmında Süryanice, diğer bir kısmında ise Pehlevice konuşuluyordu."},{"k":"p","x":"Müslümanların kültür alış verişinde bulunduğu milletlerden biri olan ve ilme büyük önem veren İranlılar da köklü bir kültüre sahiptiler. İslam coğrafyasının genişlemesiyle Müslümanların Helenistik, İran, Hint ve diğer kültürlerle temasları sonucu bunlara karşı kendilerinde geniş bir ilgi ve merak uyanmıştı"},{"k":"p","x":"Gerek fetihler gerekse tercüme hareketleri sonucunda İslam kültürüyle diğer kültürlerin karşılaşması neticesinde meydana gelen etkileşim kelam ilminin tartışma yönteminin gelişmesine, konularının derinleşmesine ve daha felsefi bir boyut kazanmasına vesile olmuştur. Böylece kelam alimleri mantık ilmini bir alet ilmî olarak görmeye ve bazı akaid ve felsefe konularının izahında onun felsefi terimlerini kullanmaya başladılar."},{"k":"p","x":"Tercüme faaliyetlerinden en fazla etkilenen İslam mezhebi Mu'tezile'dir. Mu'tezile ekolü bir taraftan felsefeyle ilgilenip orada İslam akidesiyle bağdaşmayan düşünceleri cevaplandırmaya çalışırken, diğer taraftan yeni fethedilen ülke halklarına İslam'ı tebliğ etmek ve İslam inancına yöneltilen eleştirileri cevaplandırmak için çabalıyordu. Nitekim erken dönem Mu'tezili âlimlerin tebliğ faaliyetleri için Horasan, Mağrip, Yemen, Irak, Küfe ve Ermeniyye bölgelerine gittikleri ve buralarda halkı irşat ettikleri bilinmektedir..."}]},{"h":"Temel Kavramlar: Mezhep, Fırka, Milel-Nihal, Makâlât","b":[{"k":"d","t":"Mezhep (sözlük)","x":"\"Gitmek\" anlamındaki zehâb kökünden gelir; hem \"gitme\" hem de \"gidilecek yer ve yol\" anlamını taşır."},{"k":"d","t":"Mezhep (terim)","x":"Dinin aslî veya fer'î hükümlerinin dayandığı delilleri bulup hüküm çıkarmada otorite kabul edilen âlimlerin görüşlerinin bütünü ya da onların ortaya koyduğu sistemdir."},{"k":"p","x":"Aslî hükümler inanç esaslarıyla, fer'î hükümler ise ibadetler ve insanlar arası ilişkilerle ilgilidir. Bu ayrımdan **itikadî (kelâmî)** ve **fıkhî** mezhepler doğar. Yönetim meselesi etrafında oluşan gruplar ise **siyasi** mezhepler olarak ayrıca incelenir; bunlar da zamanla kendi itikadî ve fıkhî görüşlerini geliştirmiştir."},{"k":"d","t":"Fırka (çoğulu fırak)","x":"Ortak bir düşünce etrafında toplanmış zümre. Mezhepten daha dar, grup merkezli bir kavramdır ve mezhepler tarihi literatüründe en yaygın kullanılan terimdir."},{"k":"d","t":"Makâle (çoğulu makâlât)","x":"\"Söz, görüş\" demektir. Belli bir meselede görüş ortaya koyanlara ashâbü'l-makâlât denmiş; fırkaların görüşlerini derleyen eserlere de makâlât adı verilmiştir."},{"k":"d","t":"Milel ve nihal","x":"Millet \"din\", nihle (çoğulu nihal) \"iddia, görüş, dinî zümre\" anlamına gelir. el-Milel ve'n-nihal ifadesi \"dinler ve mezhepler\" demektir."},{"k":"d","t":"Ehl-i ehvâ","x":"Hevâ (çoğulu ehvâ) \"tutarsız, temelsiz düşünce\" anlamındadır. Ehl-i ehvâ ifadesi, dayanağı zayıf görülen grupları nitelediği için bir değer yargısı taşır."},{"k":"d","t":"Ehl-i bid'at","x":"Dinin temel konularında şer'î bir delile dayanmadan farklı görüş ileri sürenler. Karşıtı, Hz. Peygamber ve ashabın yolunu izleyen ehl-i sünnettir."},{"k":"tbl","r":[["Kavram","Anlamı","Vurgusu"],["Mezhep","Gidilen yol; görüşler bütünü veya sistem","En kapsayıcı kavram"],["Fırka","Ortak düşünce etrafında toplanan zümre","Grup yapısı"],["Makâle / makâlât","Görüş, söz; görüşleri derleyen eserler","Görüş ve literatür"],["Milel ve nihal","Dinler ve mezhepler","Dinler-mezhepler birlikte"],["Ehl-i ehvâ / ehl-i bid'at","Dayanağı zayıf görülen gruplar","Olumsuz değer yargısı"]]},{"k":"not","x":"\"Mezhep\" en geniş kavramdır. \"Fırka\" ve \"nihal\" grup yapısını öne çıkarırken \"ehvâ\" ve \"bid'at\" olumsuz bir değerlendirme içerir."},{"k":"h","x":"Mezheplerin doğuşunu hazırlayan etkenler (genel çerçeve)"},{"k":"li","x":"**Nasların yapısı:** Muhkem-müteşâbih ayrımı ve sıfatlar, âhiret gibi konularda ayrıntının verilmemesi yorum farklılıklarına yol açmıştır."},{"k":"li","x":"**Kader problemi:** İnsan iradesi ile ilâhî takdir arasındaki ilişki üzerine tartışmalar Kaderiyye ve Cebriyye gibi grupları doğurmuştur."},{"k":"li","x":"**Siyasi sebepler:** Hilâfet tartışmaları, Sıffîn'deki tahkim ve Emevî-Hâşimî rekabeti Hâricîliği ve Şîa'yı ortaya çıkarmıştır."},{"k":"li","x":"**Kabile asabiyeti:** Câhiliye dönemindeki kabile rekabetleri Hz. Osman döneminden itibaren yeniden canlanmıştır."},{"k":"li","x":"**Sosyokültürel etkenler:** İslam'ın farklı kültürlere yayılması eski inanç ve geleneklerin yeni anlayışlara karışmasına yol açmıştır."},{"k":"li","x":"**Bireysel etkenler:** Konuların güçlüğü, bilgi ve ilgi farkları ile liderlik hırsı da etkili olmuştur."}]},{"h":"73 Fırka Hadisi ve Fırkaların Tasnifine Etkisi","b":[{"k":"p","x":"Ümmetin 73 fırkaya ayrılacağını ve bunlardan yalnızca birinin kurtuluşa ereceğini bildiren rivayet, mezhepler tarihinde **iftirak hadisi** ya da **73 fırka hadisi** olarak bilinir. En meşhur şekline göre Yahudiler 71, Hristiyanlar 72 fırkaya ayrılmış; ümmet de 73 fırkaya ayrılacak, bunlardan biri cennette, 72'si cehennemde olacaktır. Kurtuluşa erecek fırka bir rivayette \"cemaat\", bir başkasında \"benim ve ashabımın üzerinde bulunduğu yolda olanlar\" diye tarif edilir."},{"k":"dikkat","x":"Bu hadisin hiçbir rivayeti Buhârî, Müslim ve Nesâî'de yer almaz."},{"k":"h","x":"Hadisin doğurduğu sorular"},{"k":"li","x":"73 sayısı gerçek bir sayı mı, yoksa çokluktan kinaye mi?"},{"k":"li","x":"Kastedilen ana fırkalar mıdır? Hiçbir müellif ana fırkaların sayısını 10-12'nin üzerine çıkaramamıştır; alt kollar sayılırsa 73 kolayca aşılır."},{"k":"li","x":"Bir grubun fırka sayılmasının ölçütü nedir ve 73 fırkayı kim belirleyecektir?"},{"k":"li","x":"Yahudilere göre bir fazla olmanın anlamı nedir? Goldziher'e göre hadis aslında İslam'ın 73 meziyetini (haslet) bildiren bir sözün yanlış anlaşılmasından doğmuştur. Bazıları ise fazlalığı İslam'ın tanıdığı düşünce hürriyetiyle açıklamıştır; ancak bu açıklama, yalnız bir fırkanın kurtuluşuyla bağdaşmamaktadır."},{"k":"h","x":"Tekfir meselesi ve farklı tutumlar"},{"k":"p","x":"Hadis, kendini fırka-i nâciye sayan grupların haklılıklarını meşrulaştırmasına ve diğerlerini \"ehl-i bid'at\" ya da cehennemlik ilan etmesine araç olmuş, böylece **tekfir** problemini gündeme getirmiştir."},{"k":"li","x":"**Eş'arî:** Birbirine muhalif fırkaları dışlamak yerine \"İslam'ın onları bir araya topladığını\" söyleyerek hepsini İslam dairesinde kabul eder."},{"k":"li","x":"**Gazzâlî:** Tekfirin ancak Peygamber'in getirdiklerini yalanlama hâlinde mümkün olduğunu vurgular; Faysalü't-tefrika'da \"Ümmetim yetmiş küsur fırkaya ayrılacak, zındıklar hariç hepsi cennetliktir\" rivayetini tercih eder ve iki rivayeti uzlaştırır: Zındıklar kesin cehennemlik, bir fırka hesapsız cennetlik, aradakiler ise hesap, şefaat veya ceza sonrasında kurtulacaktır."},{"k":"li","x":"**Bağdâdî:** \"Sapık fırkaları\" bazı hükümlerde ümmetten sayar (Müslüman mezarlığına gömülme, ganimetten pay, mescide girme), bazı hükümlerde saymaz (arkalarında namaz kılınmaması, kestiklerinin yenmemesi, evlenme yasağı)."},{"k":"li","x":"**Makdisî:** Kerrâmiyye ve Mürcie'den bazı grupların \"72'si cennette, biri cehennemde\" rivayetine dayanarak her müctehidin isabet ettiğini savunduğunu aktarır."},{"k":"h","x":"Makâlât yazarlarının hadise bakışı"},{"k":"p","x":"Hadis, itikadî mezhepleri tanıtmak ve çoğu zaman reddetmek amacıyla yazılan makâlât eserlerinin hem planını hem muhtevasını hem de yazarlarının zihniyetini şekillendirmiştir. Yazarların tutumu üç grupta toplanabilir:"},{"k":"h5","x":"1. Hadisi sahih kabul edenler"},{"k":"p","x":"**a) 73 sayısını gerçek kabul edenler** fırka sayısını tutturmak için çeşitli formüller geliştirmiştir:"},{"k":"tbl","r":[["Formül","Müellifler","Açıklama"],["4 × 18","Berbehârî, Âcurrî, İbn Batta, Seksekî","Fırka-i nâciye dışındaki dört ana fırka (Ravâfız, Havâric, Kaderiyye, Mürcie) on sekizer kola ayrılır; çoğunlukla Hanbelî müelliflerin tercihidir."],["6 × 12","Ebû Mutî' en-Nesefî, İbnü'l-Cevzî, Keşşî, İbn Kemal Paşazâde, Birgivî","Altı ana fırka on ikişer kola ayrılır; Birgivî bu tasnifi Ebû Hanîfe'ye dayandırır."],["3 × 24","Ebû Temmâm (İsmâilî)","Fırka-i nâciye sayılan Ehl-i Bâtın dışındaki fırkalar üç ana ihtilaf konusunda yirmi dörder kola ayrılır."],["Kalıpsız","Malatî","Zenâdıka 5, Cehmiyye 8, Kaderiyye 7, Mürcie 12, Râfıza 15, Harûriyye 25 = 72."]]},{"k":"p","x":"Hadisi anarak fırkaların 73'e ulaşacağını söyleyen ilk müellif tespit edilebildiği kadarıyla **Nâşî el-Ekber**'dir (ö. 293/906). Sayıyı tutturma kaygısı bazen fırkaların birleştirilmesine (ör. Neccâriyye'nin on küsur kolunu üçe indirmek) ya da önemsiz grupların öne çıkarılmasına yol açmıştır."},{"k":"p","x":"**b) 73 sayısını mecaz kabul edenler:** Arapçada 7, 70, 700 sayılarının çokluk bildirdiğini söyleyenlerdir. **İbnü'l-Cevzî** kolların sayısının sayılamayacak kadar çok olduğunu belirtir. **Fahreddin Râzî** iki ihtimal sunar: Kastedilen büyük fırkalar olabilir ya da 73 bir alt sınırdır; ancak kendisi ana fırkaları dokuz olarak saymıştır. **Devvânî**'ye göre sayı fırkalar arasındaki ihtilaf konularına hamledilebilir veya fırkaların bir dönemde bu sayıya ulaştığı düşünülebilir."},{"k":"h5","x":"2. Hadisi sahih görmeyenler"},{"k":"li","x":"**İbn Hazm:** \"Bu ümmet 70 küsur fırkaya ayrılacak, biri dışında hepsi cehennemliktir\" rivayetinin isnad bakımından sahih olmadığını, haber-i vâhidi delil sayanlar için bile hüccet olamayacağını söyler; el-Fasl'da fırkaları 73'e göre tasnif etmez."},{"k":"li","x":"**İbnü'l-Vezîr el-Yemânî:** \"Biri dışında hepsi cehennemliktir\" ilavesinin senedinde Hz. Ali'ye dil uzatan bir nâsıbî bulunduğunu, Tirmizî'nin sahih saydığı rivayette bu ilavenin yer almadığını belirtir."},{"k":"h5","x":"3. Hadisi dikkate almayanlar"},{"k":"li","x":"**Eş'arî:** Makâlâtü'l-İslâmiyyîn'de hadisten hiç söz etmez; fırkaları on ana gruba ayırır ve alt kollarla birlikte sayı 73'ü fazlasıyla aşar."},{"k":"li","x":"**Neşvânü'l-Himyerî** (Zeydî, ö. 573/1178): el-Hûru'l-'în'de hadise değinmez ve 73 sayısını gözetmez."},{"k":"h","x":"Sonuç ve değerlendirme"},{"k":"p","x":"Hadis, özellikle IV/X. yüzyıldan sonra makâlât eserlerini, fiilen var olan grupları tespit etmek yerine 73 fırkayı sıralayan ve yazarın kendi mezhebi dışındakileri sapkın gösteren eserlere dönüştürmüştür. Sayıyı tutturma kaygısı hayali fırkalar üretmeye, tek bir kelâmî görüş farkını başlı başına bir fırka saymaya yol açmıştır. Kurtuluşun dinî sorumlulukları yerine getirmeye değil bir mezhebe mensubiyete bağlanması da eleştirilen bir sonuçtur. Bu nedenle mezhepleri tespit ve tasnif etmek isteyen araştırmacının 73 sayısını değil gözlem ve araştırmaya dayalı, tutarlı verileri esas alması gerekir."}]}],"ht":[{"s":5,"x":"Mezhep: dinin aslî veya fer'î hükümlerinde otorite kabul edilen âlimlerin görüşleri ya da sistemi; itikadî, siyasi ve fıkhî olmak üzere üç alanda görülür."},{"s":5,"x":"Fırka grubu, makâle görüşü, milel ve nihal \"dinler ve mezhepler\"i, ehl-i ehvâ ve ehl-i bid'at ise olumsuz değerlendirmeyi ifade eder."},{"s":6,"x":"73 fırka (iftirak) hadisinin hiçbir rivayeti Buhârî, Müslim ve Nesâî'de yoktur."},{"s":6,"x":"Sayıyı gerçek kabul edenlerin formülleri: 4×18 (Berbehârî, Âcurrî, İbn Batta, Seksekî), 6×12 (Birgivî, İbnü'l-Cevzî vd.), 3×24 (İsmâilî Ebû Temmâm); hadisi anarak 73'e ulaşacağını söyleyen ilk müellif Nâşî el-Ekber."},{"s":6,"x":"Hadisi sahih görmeyenler: İbn Hazm, İbnü'l-Vezîr. Hiç dikkate almayanlar: Eş'arî (Makâlât), Neşvânü'l-Himyerî."},{"s":6,"x":"Gazzâlî tekfiri ancak Peygamber'i yalanlama hâlinde mümkün görür ve \"zındıklar hariç hepsi cennetlik\" rivayetini tercih eder."}],"oz":{"t":"İslam Mezhepleri Tarihine Giriş · Özet","intro":"Ünitenin özü: mezhepler tarihi nedir, nasıl çalışılır, mezhep nasıl tanımlanır ve mezhepler neden doğmuştur?","s":[{"h":"Tanım, Konu, Amaç ve Metot","b":[{"k":"d","t":"İslam Mezhepleri Tarihi","x":"Siyasi ve itikadî gayelerle ortaya çıkmış İslam düşünce ekollerini; doğdukları ortam, doğuş sebepleri, teşekkül süreçleri, fikirleri, literatürü ve yayıldığı bölgelerle birlikte tarafsız ve betimleyici biçimde inceleyen ilim dalı."},{"k":"li","x":"**Konusu:** Fıkhî değil siyasi ve itikadî ekollerdir; yalnız tarihte kalanları değil günümüz akımlarını da kapsar."},{"k":"li","x":"**Bir mezhep incelenirken bakılanlar:** isimlendirme, doğuş sebepleri, teşekkül süreci, doğduğu ve yayıldığı yer, kurucu ve ilk destekçiler, temel fikirler, yazılı kaynaklar, alt kollar, diğer mezheplerle ilişki, günümüzdeki durum ve İslam düşüncesine katkı."},{"k":"li","x":"**Amacı:** Dinin farklı anlaşılmasının sebeplerini ortaya koymak; mezheplerin beşerî oluşumlar olduğunu ve dinin yerine konamayacağını göstermek."},{"k":"li","x":"**Metodu:** Betimleyici (deskriptif) yöntem; görüşleri doğru-yanlış diye yargılamak yerine \"var olanın resmini çizmek\". **Fikir-hadise irtibatı** ve **zaman-mekân bağlamı** gözetilir."},{"k":"li","x":"**Diğer ilimlerle ilişkisi:** Kelam savunmacı ve hüküm verici, mezhepler tarihi tasvirîdir. İslam tarihi devletlerin, mezhepler tarihi gruplaşmaların tarihini inceler. Dinler tarihiyle hem tarihsel hem yöntemsel bağı vardır."}]},{"h":"Temel Kavramlar","b":[{"k":"tbl","r":[["Kavram","Anlamı"],["Mezhep","Gidilen yol; otorite âlimlerin görüşleri veya sistemi"],["Fırka","Ortak düşünce etrafında toplanan zümre"],["Makâlât","Görüşler; fırkaların görüşlerini derleyen eserler"],["Milel ve nihal","Dinler ve mezhepler"],["Ehl-i ehvâ / ehl-i bid'at","Dayanağı zayıf görülen gruplar (olumsuz değer yargısı)"]]}]},{"h":"Mezhep Olmanın Ölçütleri ve Tasnif","b":[{"k":"p","x":"**İbn Hazm** tevhid, kader, iman-küfür, imamet ve sahabenin fazileti konularında farklı görüşü; **Şehristânî** ise dört ana kaidede (tevhid-sıfatlar; kader-adalet; va'd-vaîd, esmâ ve ahkâm; akıl-sem', risalet ve imamet) farklılaşmayı ölçüt alır. Buna göre bir hareketin mezhep sayılması için **sistemli bir teolojisi, yazılı literatürü, toplumsal tabanı ve fıkhî/amelî boyutu** olmalıdır."},{"k":"p","x":"Tasnifler **tematik** (itikadî, siyasi, fıkhî), **kronolojik**, **şematik** (73 fırkaya göre) ve **alfabetik** olabilir."}]},{"h":"73 Fırka Hadisi","b":[{"k":"li","x":"Hiçbir rivayeti Buhârî, Müslim ve Nesâî'de yoktur."},{"k":"li","x":"73'ü gerçek sayanlar (Malatî, Bağdâdî, İsferâyînî, Şehristânî vb.) 4×18, 6×12, 3×24 gibi formüllere başvurmuş; çokluk ifadesi sayanlar (İbnü'l-Cevzî, Râzî, Devvânî, Şâtıbî) sayıyı mecaz kabul etmiştir."},{"k":"li","x":"İbn Hazm ve İbnü'l-Vezîr hadisi (özellikle \"biri hariç hepsi cehennemde\" ilavesini) sahih görmez; Eş'arî Makâlât'ta hadise hiç değinmez."},{"k":"li","x":"Goldziher'e göre hadis, İslam'ın önceki dinlere göre üstünlüğünü anlatmak için söylenmiştir."}]},{"h":"İlk İhtilaflar","b":[{"k":"p","x":"Hz. Peygamber döneminde fırkalaşma yoktur; çünkü vahiy devam etmekte ve Peygamber'in otoritesi her meseleyi çözmektedir. Yine de **kalem-kâğıt (kırtas) hadisesi, Üsâme ordusu, Peygamber'in vefatında şüphe, defin yeri ve hilafet meselesi** sonraki tartışmaların ilk nüveleri sayılır. Hz. Ebû Bekir döneminde **Peygamber'in mirası (Fedek), zekât vermeyenler ve Kur'an'ın toplanması** konularında ihtilaf çıkmış ama fitneye dönüşmemiştir. Hz. Osman döneminde başlayan siyasi karışıklıklar fırkalaşmanın zeminini hazırlamıştır."}]},{"h":"Mezheplere Ayrılmanın Sebepleri","b":[{"k":"tbl","r":[["Sebep","Örnekler"],["Dinî","Nübüvvet döneminden uzaklaşma; nasların üslubu (muhkem-müteşâbih), sübut ve delaleti; soyut konular (sıfatlar, kader); metin yorumunda metot farkı; fikir hürriyeti; kader sorunu"],["Psikolojik","Karakter farkları, farklı niyet ve zihniyetler, liderlik tutkusu"],["Sosyal","Irkçılık ve kabilecilik (Arap-mevâlî), ekonomik farklılaşma ve lüks"],["Siyasi","İmamet-hilafet tartışması; Cemel, Sıffîn ve iç savaşlar; büyük günah meselesi"],["Dış","Diğer din ve kültürlerle karşılaşma, Yahudilik ve Hristiyanlığın etkisi; tercüme faaliyetleri (en çok Mu'tezile etkilenmiştir)"]]}]}]}},{"t":"Ehl-i Sünnet ve Mâtürîdiyye","intro":"Ehl-i Sünnet'in adı, oluşumu ve ekolleri; İmam Mâtürîdî'nin hayatı, eserleri ve ilmî kişiliği; Mâtürîdîliğin gelişimi, temel görüşleri ve yayıldığı coğrafya.","s":[{"h":"İsimlendirme Meselesi","b":[{"k":"p","x":"**1. İsimlendirme Meselesi:** \"Sünnet ve cemaat mensupları taraftarları\" anlamına gelmekte olup kısaca Ehl-i Sünnet şeklinde kullanılmaktadır. Bu kavram üç terimden oluşmaktadır:"},{"k":"p","x":" **Ehl/ehil**: aile, yakın akrabalar; bir soya, dine, mesleğe, eve ve beldeye mensup olanlar."},{"k":"p","x":" **Sünnet**: yol, siret, gelenek, âdet ve başlatılan tarz ve çığır anlamına gelen sünnet kelimesi ise İslam'la birlikte dinî bir anlam kazanmış; Hz. Peygamber'in dini beyan, tutum ve davranışlarının özel adı olmuştur. **Ehl-i Sünnet** ismi, sünnette geçen prensiplere bağlı olup onu uygulayanlar anlamını ifade eder. Zamanla sünnet, sahabe, tabiin ve tebei tabiin yolunu da içermiştir, Bu durumda Ehl-i Sünnet ismi ya sahabe ve tabiinin yoluna tabi olarak müteşabih ayetlerin manalarına dalmaksızın, onların bilgisini Allah'a havale edenler. Ehl-i Sünnet'e mensup kimse anlamına gelen \" **Sünni** \" kelimesi ise Ehl-i Sünnet tabirinden önce kullanılmış ve bununla sünnete mensup olanlar' kastedilmiştir. Sünni terimini ilk olarak bazı sahabenin henüz hayatta olduğu sıralarda kullanıldığı bilinmektedir."},{"k":"p","x":" **Cemaat**: Sözlükte, “Bir araya gelmiş grup, topluluk,\" demektir. Ümmetin yetmiş üç fırkaya ayrılacağı, bunlar içinde \"cemaat\" ehli olanların kurtuluşa ereceği, cemaatin dışında kalanların cehenneme gidecekleri, Allah'ın rahmetinin cemaatle olduğu, cennete girmek isteyenlerin cemaatten ayrılmamaları gerektiği gibi hadisler Ehl-i Sünnet isminin yanına cemaat isminin de eklenmesine vesile olmuştur."},{"k":"p","x":"Ehl-i Sünnet Müslümanların çoğunluğunu toplumun oluşturmuş, “Ashabu'l-Hadis, Ashabu's- Sünne, Ehlu’l-Hak, Ehlu'l-İsbat, Fırka-i Naciye, es-Sevadu'l-â’zam (Büyük çoğunluk), Ehlu's- Sünne ve'l Cemâ'a ve'l-Asâr, Ehlu'l-Hadis ve's-Sünne, Ehlu's-Sünne ve'l-İstikame\" gibi bazı övgü isimleri kullanmıştır. Bu terkibin, önce **Ahmed b. Hanbel** (ö. 241/855), sonra da **İbn Kuteybe** (ö.276/889) döneminde yerleştiği bilinmektedir."},{"k":"p","x":"İfade edilen cemaat kelimesiyle başta Hz. Peygamber'in oluşturduğu sahabe cemaati olmak üzere tabiin, tebei tabiinden oluşan ilk üç neslin müçtehit âlimleri ve onların yoluna uyan her dönemdeki Müslümanlar kastedilmiştir."},{"k":"p","x":"Muhalif gruplar tarafından Ehl-i Sünnet'e birtakım isimler verilmiştir. **Mu'tezîle**, kulların iradî fiillerinin de Allah'ın kader ve kazası ile olacağını belirttiği için **Mücbire**; Allah'ın sıfatlarını olduğu gibi kabul ettiklerinden dolayı **Müşebbihe** demiştir. **Mürcie**, Selefiyye ve Eşarîyye mensuplarına “İnşallah müminim ” dediklerinden dolayı **Şukkâkiyye (Şüpheciler)** demişlerdir. **Şia (Rafizîler**) sıradan Müslümanların oluşturduklarını düşünerek **Ehl-ü'l-Amme**; devlet başkanının seçim yoluyla belli olacağını benimsemeleri sebebiyle **Nasıbe** adını vermiştir. Yine Allah'a atfedilen sıfatlar sebebiyle onlara **\"Sıfatiyye\"** de denilmiştir."},{"k":"p","x":"Ehl-i Sünnet, bir fırka değil, Hz. Peygamber'in ve ashabının yolunu takip eden büyük çoğunluktur. Ehl-i Sünnet, dinde bid'atlerin ve çeşitli fikirlerin ortaya çıkmasından sonra sünnetin savunulması ve ümmetin bütünlüğünün korunması hareketi olarak ortaya çıkmıştır."}]},{"h":"Ehl-i Sünnet Zihniyetinin Oluşumu","b":[{"k":"p","x":"Hz. Osman'ın şehit edilmesi (ö. 35/656); Hz. Ali (ö. 40/661) dönemindeki Cemel ve Sıffin savaşları, Hakem olayı gibi siyasi olaylar ile Haricîler, Şia, Cebriye, Kaderiyye, Mu'tezîle gibi grupların zuhuru, ve toplumu derinden etkilemesi doğal olarak alimlerin harekete geçmelerine sebep oldu."},{"k":"p","x":"Ehl-i Sünnet'in sonradan oluştuğu hususu yanlış anlaşılmamalıdır. Ehl-i Sünnet diğer aykırı fırkalar gibi ana gövdeden ayrılan bir yapı değil; aksine Hz. Peygamber ve sahabeden beri var olan bir harekettir."},{"k":"p","x":"Hz. Ali döneminden itibaren ana gövdeden ayrılmalar başladı. Hz. Ali'nin hilafetinde İslam ümmetini temsil eden otoriteye tabi olanlar ile itikadî alanda aykırı görüşlerden uzak duran Müslümanlar, meşru ana cemaat olarak tezahür etti, bir bakıma Müslümanların ana gövdesini oluşturdu."},{"k":"p","x":"İtikadî açıdan Ehl-i Sünnet inancı, Sahabe döneminden itibaren gelişen olaylar çerçevesinde tedricen oluşmaya başlamıştır. Ortaya çıkan itikadî-fikri sorunlar, Müslümanların Ehl-i Sünnet adı altında sistemli bir birliktelik sağlamasına zemin hazırlamıştır. Mesela, Hz. Ali, büyük günah işleyen bir kimsenin dini konumu hususunda Haricilerle fikrî mücadelede bulunmuş ve böylesi bir müminin asla küfre nispet edilemeyeceğini ısrarla vurgulamıştır. Abdullah b. Ömer de, kaderin iman esaslarından olduğunu vurgulamış ve kaderi inkâr eden Ma'bed el-Cüheni'den (ö. 118/736) uzak durmuştur."},{"k":"p","x":"Tabiin nesli de siyasi tutum ve inançlar da Ehl-i Sünnet zihniyetinin teşekkülünde belirleyici olmuştur. İbrahim en-Nehaî (ö. 96/714), Ömer b. Abdülaziz (ö. 102/720), Hasan el-Basri (ö. 110/728), Zührî (ö. 124/742), Cafer Sadık (ö. 148/765), Ebû Hanife (ö. 150/767) gibi önde gelen şahsiyetlerin görüş ve tutumları önemlidir. Bunların müşterek özelliği devlete ve İslam'ın getirdiği temel esaslara bağlılık, fitneye sebep olabileceği korkusuyla ümmet arasındaki tartışmalı konulardan uzak durmak, cemaatin devamı, gelişmesi ve istikrarı için gayret gösterme olarak ifade edilebilir."},{"k":"p","x":"Tarihî süreç içinde gelişerek oluşan Ehl-i Sünnet, tek boyutlu olmayıp siyasi, itikadî, fıkhî ve tasavvufi boyutlarıyla bütüncül bir yapıdır. Ehl-i Sünnet, aykırı fırkalara nispeten daha sonra sistemleştiği için mevcut fırkaları gözlemleme ve değerlendirme imkânına sahip olmuş; vakadan hareket ettiğinden ifrat ve tefritten uzak, dengeli bir sistem geliştirmiştir. Ehl-i Sünnet, itikadî prensipleriyle Müslüman olmanın şartlarını, sosyal-siyasi görüş ve tutumuyla da ümmet-cemaat olmanın ilkelerini ortaya koymuştur."},{"k":"p","x":"Ehl-i Sünnet âlimleri, Sünni anlayışın sadece itikadi ya da siyasi bir anlayış olmadığını; bilakis Kitap ve Sünnet'in hayata tatbiki anlamında bir yaşam tarzı olduğunu kabul ederler. Onlara göre itikatta orta yol, Ehl-i Sünnet'in yolu olup, “İşte böylece biz, sizi orta (dengeli) bir ümmet yaptık.” (Bakara 2/143) ayetinde ifade edildiği üzere itidaldir. Böylece Ehl-i Sünnet âlimleri, kendilerini merkeze alıp diğer fırkaları kendilerine yakınlık ve uzaklığa göre konumlandırmışlardır."}]},{"h":"Ehl-i Sünnet Ekolleri","b":[{"k":"p","x":"Ehl-i Sünnet ana yapısının genelde iki ana bölümde ele alınması âdet olmuştur. Bunlardan ilki Selef yahut Selefiyye denilen, Kur'an ve Sünnet'te varit olan itikadî esasları te’vil, teşbih ve ta'til olmadan ele alan, buna göre o esasları kabul edip inanan zümredir. İkinci grup ise Ebû Mansur el- Maturidi'ye mensup olan Maturidiyye ile Ebu'l-Hasan el-Eş'ari'ye mensup bulunan Eş'arîyye zümrelerinin oluşturduğu Halef yahut Halefiyye'dir. Anılan bu iki zümre Selef gibi naslarda geçen ifadeleri literal olarak ele alıp inanıp kabullenmek yerine, teşbih ve tecsim ifade eder gibi görünen sıfatları te’vil etmeye yönelerek bir anlamda mücmel iman ve bilgiyle yetinmeyen, dinin ve aklın gereklerine göre yorum getiren ekollerdir. Selefiyye'ye **“Ehl-i Sünnet-i Hassa\"**, Eş'arîyye ve Maturidiyye'ye de “ **Ehl-i Sünnet-i Âmme\"** de denilmiştir."}]},{"h":"Mâtürîdîlik (Mâtürîdiyye)","b":[{"k":"p","x":"İslam akaidinde İmam Ebu Mansur el-Matüridi'nin (238-333/852-944) görüşlerini benimseyenlerin meydana getirdiği topluluğa Maturidiyye denilir. Ehl-i Sünnet-i Âmme'nin en geniş kolunu oluşturan Maturidilik, kökleri Ebû Hanife'ye kadar geri gitse de sistemli bir kelam okulu olarak Ebû Mansur el- Matüridî tarafından Semerkand bölgesinde kurulmuştur."}]},{"h":"İmam Mâtürîdî'nin Hayatı ve İlmî Kişiliği","b":[{"k":"li","x":"Ebû Mansur Muhammed b. Muhammed b. Mahmûd el-Matüridi es-Semerkandî, günümüzde Özbekistan Cumhuriyeti'nin Semerkand şehrinin Matürid köyünde doğmuş, doğduğu yere nispetle de Matüridî ve Semerkandî nisbeleri ile anılmıştır. Abbasîler'in merkezi otoritelerinin zayıfladığı bir dönemde hilafete bağlı müstakil beyliklerden Samanoğullan'nın Maveraünnehir'e hâkim oldukları devirde yaşamıştır."},{"k":"li","x":"\"İmamü'l-hüda (hidayet imamı), Alemü'l-hüda (Hidayet bayrağı) İmamu'l-mütekellimin (kelamcıların önderi), Musahhihu akaidi'l-müslimîn (Müslümanların akidelerini arındıran) ve Reisü Ehli's-Sünne (Ehl-i Sünnet'in Reisi)” gibi lakaplarla anılmıştır"},{"k":"li","x":"Ebû Mansur künyesi ile ilgili bir ayetin tefsirinde o, künyelerin anlamları üzerinde açıklama yaparken “Ebû Mansur\" künyesinin örfen, evladı olmayan kişiye Mansûr adında oğlu olması temennisiyle verilebileceğini kaydeder. Bu künyenin örnek olarak seçimi bir rastlantı değilse kendisinin erkek evladı bulunmadığının bir işareti sayılabilir. Kökeniyle alakalı bazı iddialar dile getirilmişse de onun Türk asıllı olduğu kuvvetle muhtemeldir."},{"k":"li","x":"Maturidi, Hanefi mezhebinin üçüncü kuşak âlimlerindendir. Bir çok hocalardan ilim tahsil etmişse de öğrenimini henüz yirmi yaşlarında iken hocası Ebû Bekir Ahmed el-Cüzcânî ile birlikte ulema reisliğini deruhte eden Ebû Nasr el-İyâzi'den tamamlamıştır."},{"k":"li","x":"Eğitim hayatı, seyahatleri ve hacca gidip gitmediği, resmi bir görev alıp almadığı gibi hususlar bilinmemektedir. Ancak zalim olduğu kesinlik derecesinde sübut bulan zamanının sultanına adil diyen ve dolayısıyla zulmü adaletle vasıflandıran kimsenin küfre girdiği yolunda kanaat belirtmesi, devrin siyaset ve devlet adamlarıyla münasebetlerinin iyi olmadığını göstermektedir."},{"k":"li","x":"Eser telifi yanında öğrenci de yetiştiren Maturidi'den Ebû Ahmed el-İyâzî, Ebu'l-Hasan Ali b. Said er-Rüstufağni (ö. 345/956) ve Ebû Muhammed Abdülkerim b. Musa el- Pezdevi gibi âlimlerin fıkıh ve kelam tahsil ettikleri bilinmektedir. Matüridî, 333/944 yılında Semerkand'da vefat etmiştir. Matüridi'nin türbesi uzun zaman muhafaza edilmiş olmasına rağmen Sovyetler Birliği döneminde söz konusu mezarlık iskana açılmış ve türbenin bulunduğu yer bir evin bahçesinde kalmıştır. Ancak 2000'li yılarda Türkiye'nin girişimiyle kabri yeniden türbe hâline getirilmiş ve etrafına da bir külliye inşa edilmiştir."},{"k":"li","x":"Maturidi'nin tefsir, kelam, fıkıh ve usulü, mezhepler tarihi alanlarında önemli mevkiine rağmen kaynaklarda ihmal edildiği belirtilmiştir. Matüridî'nin hilafet merkezi Bağdat'tan uzakta yaşamış olması, Arap tarihçileri tarafından kasıtlı olarak zikredilmemesi, siyasi iktidarla anlaşmazlık içinde bulunması, Eşarîliğin Nizamiye medreselerinde okutulmasına mukabil Matüridîliğin resmî eğitim kurumlarına girememesi, Hanefî çevrelerinin Maturidi'nin Ebû Hanife’nin otoritesini gölgelemesinden endişe etmeleri, eserlerinin dil ve üslup açısından problemli oluşu gibi sebepler zikredilebilir."},{"k":"li","x":"Maturidi'nin ihmal edilişi konusunda Ebü'l-Yüsr el-Pezdevî (0.493/1100) ve Alâeddin es- Semerkandî (ö. 539/1144) gibi geleneğe mensup âlimler, onun eserlerini son derece sağlam delil ve güçlü istidlallere dayanmasına rağmen ilgi görmemesinden yakınmış ve bunun sebebinin lafız ve manalarının anlaşılır olmayışı veya himmet ve gayret azlığında aranması gerektiğini belirtmişlerdir."},{"k":"li","x":"Maturidi'nin yaşadığı bölgenin çeşitli istilalara maruz kalıp dini eserlerin tahrip edilmesine ve dönemin ilim merkezlerine uzak olmasına dikkat çeken **Bekir Topaloğlu'** na göre de bu ihmalin temelinde muhaddislerle fakihlerin Matüridî'nin görüşlerini Mu'tezile'ye yakın kabul etmeleri kuvvetle muhtemeldir."},{"k":"li","x":"Bununla beraber Matüridî, İslam dünyasında tamamen ihmal edilmiş değildir. Görüşleri ve biyografisine dair bazı bilgiler, erken dönemlerden itibaren bilhassa kendisini büyük bir otorite kabul eden Maveraünnehir Hanefilerinin teliflerinde, VII. (XIII.) yüzyıldan itibaren de çok sınırlı biçimde diğer mezheplere ait eserlerde yer almaya başlamıştır."},{"k":"li","x":"Matüridî'yi bir ekol sahibi olarak benimseyen ve geleneğin ikinci kaynağı sayılan Tebsirata’l-edille'yi telif eden alim **Ebü'l-Muîn en-Nesefi** (ö. 508/1115) olmuş ve onunla birlikte Matüridîlik bir kelam akımı olarak tarihteki yerini almıştır. Bundan sonra Hanefi- Maturidi âlimlerinin yanı sıra Eşarî ve diğer firkalara mensup âlimler tarafından da dikkatle takip edilmiştir."},{"k":"li","x":"Biyografik kaynaklarda Matüridî'nin kendisine aidiyeti kesin olan eserlerden sadece iki tanesi günümüze ulaşmıştır:"},{"k":"p","x":"**a) Kitâbü't-Tevhid**: Bu eserin tek nüshası Cambridge Üniversitesi'nde kayıtlı olup, **Fethullah Huleyf** tarafından neşredilmiştir (Beyrut 1970). Birçok yanlış ihtiva eden bu ilk neşrinden sonra **Bekir Topaloğlu** ve **Muhammed Aruçi** eseri yeniden yayımlamış (Ankara 2003), ayrıca Bekir Topaloğlu kitabı Türkçeye çevirmiştir. Müellifin bu eseri, nakil yanında akla da önem veren kelam ilmi ile ilgili temel konuları ele alan ilk eser özelliği taşımaktadır.“"},{"k":"p","x":"**b) Te'vilatü'l-Kur'an**: Matüridi'ye asıl şöhretini sağlayan çalışması, bu geniş hacimli Kur'an tefsiridir. Eser, kelam, fıkıh ve usulü alanlarında da zengin bilgi içerir. Ayrıca İslamî firkalar ve İslam dışı akımlarla dinlere ait inanç ve görüşlerin tenkidi bakımından da önemlidir. Eser, Maturidi'nin öğrencilerine yaptığı takrirlerden oluşmuştur. Te’vilât'ın çeşitli kütüphanelerde kırk civarında nüshasının bulunduğu bilinmektedir. Eserin bütününün neşri **Bekir Topaloğlu** 'nun ilmi kontrolünde bir heyet tarafından gerçekleştirilmiştir."}]},{"h":"Mâtürîdîlik ve Tarihî Gelişimi","b":[{"k":"li","x":"Temel kelami görüşler dikkate alındığında Matüridi anlayışın Ebu Hanife’nin görüşlerini birebir takip ettiği görülür, Bundan dolayı bazı eserlerde mezhebin adı **el-Hanefiyyetü'l- Maturidiyye** şeklinde verilmiştir. Yine Maturidi ekolünün kelamcılarından bazılarının Ebû Hanife'yi ekolün imamı olarak göstermesi, Maturidi'nin kelam ve fıkıh konularında onun yoluna uyduğunu belirtmesi buna işaret eder."},{"k":"li","x":"İmam Ebû Yusuf'un Abbasîler döneminde baş kadı tayin edilmesinin ardından, Maveraünnehir'e tayin edilen kadıların Hanefi anlayışa mensup olması, Hanefi mezhebinin yayılmasına imkân sağlamıştır. İmameynin talebesi olan **Ebû Süleyman el- Cüzcânî** Maveraünnehir'de Darü'l-Cüzcâniyye adında birmedrese kurmuştur. Bu zatın iki önemli öğrencisinden biri Ebû Mansur el-Mâtürîdi'dir (Diğeri **İyazi**). Anılan bu zevatın teşkil ettiği ekol Maveraünnehir'de Cuzcâniyye veya İyâziyye adıyla kelam faaliyetlerini yürütmüşlerdir. İşte Maturidi, bu geleneğin içinden gelen bir kelam âlimi olarak belirtilen silsile vasıtasıyla Ebu Hanife’nin itikadî görüşleri ve dinî telakkilerini sistemleştirmiştir."},{"k":"li","x":"Matüridi'nin düşünceleri ve kurduğu sistem kendisinden sonra Sevâdü'l-a'zam'ın müellifi **Hakîm es-Semerkandi** (ö. 342/953) ve Ebû Nasr el-İyâzi'nin oğulları **Ebû Ahmed** ve **Ebu Bekir el-İyâzî** tarafından devam ettirildi. Maturidi'nin bir başka öğrencisi olan **Ebu'l-Hasan Ali b. Said er-Rüstüğfani** (ö. 350/961) ise yazdığı İrşadü'l-mühtedî isimli eserinde hocasının görüşlerine iştirak ettiğini belirtmiştir. **Ebü'l-Yüsr el-Pezdevî'** ye (Ö. 478/1085) vanncaya kadar bu bölgede yüz kadar kelam aliminin yetiştiği kabul edilmektedir. İmam Maturidi'den başlayıp Pezdevî ile son bulan Matüridîliğin bu dönemine **Mütekaddimin Matüridîliği** denilir."},{"k":"li","x":"**Ebu'l-Muîn en-Nesefi** (ö. 508/1115) ile **Matüridîliğin müteahhirin dönemi** başlar. Nesefî, Matüridî kelamının sistemleşmesinde önemli bir dönüm noktasıdır ve bu noktada Gazzali'nin Eş'ariyye içindeki konumuna benzer bir mevkidedir. O, **Temhid** ve **Tebsira** isimli eserleriyle İmam Maturidi'nin görüşlerini açıklayıp geliştirdiği gibi aynı zamanda bu ekolün önemli temsilcileri ve tarihçesi hakkında da bilgiler sunmuştur. Müteahhirin uleması arasında **Abdüsseyyid el-Keşşî**, **İbrahim b. es-Saffâr**, **Necmeddin en** ve **Ali b. Osman el-Uşi** (ö. 575/1179) zikredilmesi gerekir. Yine **el-Bidâye fi'l-hidaye'** nin müellifi **Nureddin es-Sâbuni** (ö. 580/1184) de önemlidir. Daha sonra **Ebü'l-Berekât en-Nesefi** (ö. 710/1310), **Hüseyin b. Ali es-Sığnâki**, **Ömer b. Muhammed el-Habbazi** (ö. 691/1292) gibi âlimler yazdıkları eserlerle mezhebin gelişip yayılmasında etkili olmuşlardır."},{"k":"li","x":"VIII./XIV. asırdan itibaren Matüridî kelamcılığı gerileme sürecine girmiş ve böylece şerh ve haşiyecilik dönemi başlamıştır. Maturidi kelamcıları, İslam dünyasında ağırlık kazanan Eşarîliğin nüfuzu altında kalmışlar ve Eşarîlerin görüşleri çerçevesinde kelam yapmaya çalışmışlardır. Onların bu tutumu Maturidiliğin ikinci plana düşmesine yol açmıştır. Bu dönemin önemli simaları olarak **İbnü'l-Hümam** (ö. 861/1457), **Hızır Bey** (ö. 863/1458), **Kemaleddin el-Beyazi** (ö. 1098/1687), **İbn Kutluboğa** (ö. 879/1474) gibi âlimler zikredilebilir."},{"k":"li","x":"XIX. yüzyılda başlayan **Yeni İlm-i Kelam Dönemi** nde, Matüridî kelamcıları klasik kelam konularını işlemekle birlikte daha ziyade **materyalizm**, **ateizm**, **pozitivizm**, **Darvinizm** gibi yarı felsefi yarı dini hareketlerle mücadele etmişlerdir. Bu dönemin önemli şahsiyetleri arasında **Muhammed Zahid el-Kevseri**; **Harputlu İshak Efendi**; **Abdullatif** el-Harpûtî; Ömer Nasuhi Bilmen; İsmail Hakkı İzmirli; Mehmet Ali Ayni, Filibeli"},{"k":"p","x":"**Ahmed Hilmi**, **İsmail Fenni Ertuğrul** zikredilebilir."}]},{"h":"Mâtürîdiyye'nin Genel Görüşleri","b":[{"k":"p","x":"**1. Bilgi Teorisi:** Maturidiyye'ye göre bilginin kaynağı duyular, akıl ve doğru haberdir."},{"k":"p","x":"**Duyular:** Beş duyu organı (havas-i selime) vasıtasıyla elde edilen bilgi her türlü bilginin esası ve en açık olanıdır. Eğer duyular sağlıklı değilse, elde edilen bilgi de doğru değildir. **Akıl:** Akıl hem bir kısım zaruri bilgileri, hem de zaruri olmayan bilgileri üretir. Akıl daha ziyade duyular ötesindeki alemi algılama vasıtası ise de, duyular ve haberlerden bilgi elde etmenin de vazgeçilmez aracıdır. Akıl yürütmekle ulaşılan bilgi eğer akıl yürütenler bir kısım illetlerle malul değilse doğru bilgi olarak değerlendirilir. Akılla istidlalde bulunanların farklı neticelere ulaşmalar ise ya hatalı istidlalden ya da akılla ulaşılacak bilgiyi kabullenmemekten kaynaklanır. Bu sebeple kendilerine peygamber daveti ulaşmamış bulunan **ehl-i fetret** diye isimlendirilen kimseler, istidlalleriyle Allah'ın varlığını ve birliğini bilmek ve ona karşı tazim hissi duymakla yükümlü kabul edilmişlerdir."},{"k":"p","x":"**Doğru haber (haber-i sadık)**: Selim duyular yahut akılla ortaya konulamayan türdeki bilgiler, ancak doğru haberle elde edilebilir. İnsanların günlük hayatındaki birçok bilgiler bu türdendir. Bu sebeple yalan karşabileceğini dikkate alarak haberi, bir bilgi kaynağı olmaktan çıkarmak isabetli olmayacaktır. Doğru haber; mütevatir haber ile peygamberin verdiği haberler olmak üzere iki kısımda değerlendirilir."},{"k":"p","x":"**2. Allah'ın Varlığı ve Sıfatları:** Allah'ın varlığı, evren hakkında yapılacak basit bir tefekkür sonunda bilinebilecek bir husus olmakla birlikte bazen apaçık gerçekler kişilere farklı görünebilir. Evrenin var oluş açısından incelenmesi halinde ilim, kudret ve irade sahibi yüce bir varlık tarafından yaratıldığına hükmetmek aklen zorunludur. İnkârcılar problemi akli değil duyu bilgileriyle çözmek istemektedir, bu ise bütün varlık alanını duyusal alana indirgemektedir. Duyularla algılanmamak yokluğu gerektirmez. Yine Allah'ın diğer varlık ve yaratılmışlar gibi olmadığı, benzeri bulunmadığı bahis konusu olmadığı için, mahiyeti söz konusu edilemez. Allah hakkında bilgi sahibi olmak, ancak onun isim ve sıfatlarını bilip öğrenmekle mümkündür. Maturidiyye'nin müteahhir âlimleri sıfat meselesi üzerinde öncekilerden daha çok durmuşlardır. Onlara göre ilahî zat ile sıfatlar arasında bir başkalık bulunmayıp sıfatlar zattan müstakil veya bağımsız varlıklar değillerdir. Böylece **sıfatlar zatın aynı da gayrı da değildir**, şeklindeki formül ortaya konularak Mu'tezîle’nin, **taaddüdü'l-kudema** görüşü bertaraf edilmiştir. Örneğin Tekvin sıfatının diğerleri gibi ezeli olması, yaratılanların da ezeli olmasını gerektirmez. Yine Allah'ın kelamı, zatıyla kaim ezelî bir manadan ibaret olup **nefsi kelam** diye isimlendirilir. Bu durumda beşer dillerinden birinde varid olan kelam yani harf ve seslerden oluşan **lafzi kelam** hadistir. Mutlak bir şekilde Kur'an'ın mahluk olduğunu söylemek isabetli olmayıp, buna mukabil lafızların mahluk olduğunu söylemek gerekir. Naslarda Allah'a atfedilen ve **haberi sıfatlar** olarak isimlendirilen kavramları zahiri üzere kabul etmek, tecsim, teşbihe düşüreceğinden bu tür nasları dil kurallarına ve dinin geneline uygun bir tarzda yorumlamak gerekir. Maturidiyye'nin ekseriyeti ilahi isimlerin tevkifi olduğunu kabul eder. Bununla birlikte Allah'ın eksiklik ve noksanlık özelliği taşımayan **sâni'**, **vâcibu'l-vücûd** gibi isimlerle isimlendirilmesi mümkündür. Eşya ve yaratılmış nesneler kastedilmeksizin Allah'ın “ **şey** ” diye isimlendirilmesi de caizdir. Allah'ın hakim oluşu fiillerinin **hikmetl** i olmasını gerektirir. İnsanlar, ilahî fiillerden bazılarının hikmetini biliyorsa da aklın hikmetini anlamaktan aciz kaldığı ilahî fiiller de vardır. İnsanlarca Allah'ın fiili zannedilen şerler, fiilinin kendisi değil onun bir sonucudur. Bu sebeple mesela inkâr olgusu doğrudan değil insanı iradeli bir varlık olarak yaratmasının sonucudur. **Şerler mutlak değil** izafîdir, bir yönden şer olan diğer yönden hayır taşıyabilir. **Hikmetsiz fiil** bilgisizlikten ve ihtiyaçtan kaynaklandığından Allah'ın fiilleri hikmetsiz olamaz."},{"k":"p","x":"**3. Allah'ın Görülmesi:** Allah, cennette cisimlere ait olan özelliklerden münezzeh olmak üzere müminler tarafından görülecektir. Zira Allah görülemez olsaydı, “O'nu gözler idrak edemez.\" şeklinde varid olan, dünyada idrakin nefyedilmesinin bir anlamı kalmazdı. İdrak ancak görmekle mümkündür. Yine Hz. Musa, \"Rabbim bana kendini göster, seni göreyim..” demiştir. Eğer Allah'ın görülmesi muhal ve imkânsız olsaydı Musa'nın böyle bir niyazda bulunması cehalet olurdu. Devamında Musa'nın Allah'ı göremeyeceği belirtilmiş, fakat Rabbi dağa tecelli ettiğinde yerinde durursa göreceği şeklindeki mümkün bir şarta bağlanmıştır. Fakat görme işi dünyada değil ahirette cereyan edecektir,"},{"k":"p","x":"**4. Nübüvvet:** Nefsani arzulara uymanın kötülüğünü öğretecek ve toplumun dirliğini sağlayacak bilgileri getirip hayata geçirecek bir kılavuzun varlığı aklen gereklidir. Bu kılavuz, her şeyi bilen yüce yaratıcının elçisi olması hâlinde insanların gönüllü olarak kendisine itaat etmesini sağlayabilir, manevi bir yaptırım gücüne sahip olduğundan tesir icra edebilir. Nübüvvet ayrıca insanın yaratılış amacını ve bu amaca uygun hayat tarzını da öğretmektedir. Matüridî ve Ebü'l-Muîn en-Nesefi gibi kelamcılar **mucizeyi** nübüvvetin kanıtlayıcı delilleri arasında zikretmekle birlikte daha çok **imkân**, **gereklilik**, **tarihi gerçeklik** ve **beşeri ihtiyaç** gibi sosyolojik açılardan peygamberliği temellendirmişlerdir. Müteahhir dönem Maturidîler ise özellikle hissi mucizeler ve velilerle gösterilen kerametler aracılığıyla nübüvveti kanıtlamaya çalışmışlardır. **Maturidiyye’ye göre, peygamberler** yalandan uzak, kötülük işlemeyen, güvenilir, akıllı, zeki, erkek kişiler arasından seçilmiştir. **Kadınlardan peygamber gönderilmemiştir**. Peygamberlerin sayısı ile ilgili nakledilen sayılar kesin olmayıp, her kavme bir uyarıcı gönderildiği hususu naslarda belirtilmektedir. Peygamberlerin sonuncusu Hz. Muhammed'dir. **Onun mucizelerinin başında** Kur'an-ı Kerim gelir. Bunun dışında Hz. Peygamber'in şahsı, hayat safhaları, davranışları, insanlara karşı merhamet ve şefkati, toplumunu kısa zamanda teşkilatlandınıp, dünyanın en büyük toplumlarından biri haline getirmesi onun diğer önemli mucizelerindendir. Öte taraftan velilerin elinde gerçekleşen **kerametler** Hz. Peygamber'in devam eden hissi mucizeleridir."},{"k":"p","x":"**5. Kulların Fiilleri:** Maturidiyye âlimleri, insanı gerçek anlamda fiil işleyen bir varlık olarak kabul ederler. Kur'an'da insan fiillerinin onun yanı sıra Allah'a da nispet edilmesi kula aidiyetini ortadan kaldırmaz, aksine bunların Allah'la irtibatlı olduğunu gösterir, bu irtibat ise fiillerin Allah tarafından yaratılmasıdır. Şu halde fiiller kazanılmaları (kesb) ve icra edilmeleri yönünden insanın, yaratılmaları yönünden ise Allah'ın tesiriyle meydana gelir. Fiil yapamayan birine emir verip yasak koymak anlamsızdır. İnsanın kendini hür hissetmesi ve istediği fiilleri yapması fiillerinin faili olduğunu kanıtlar. Eğer sözü edilen fiiller Allah tarafından yaratılmasaydı O'nun halk fonksiyonu eksik kalır ve yaratmasının kapsamına girmeyen alanlar mevcut olurdu. Bu ise uluhiyyet anlayışına aykırı bir durum teşkil ederdi. Fiillerinin ilke bazında Allah tarafından yaratılması **kişinin sorumluluğunu ortadan kaldırmaz.** Fiilin oluşmasında asıl rol insana verildiğinden kişi sorumludur, mükafat veya cezayı hak eder. İnsanın külli iradesi hadis olmakla birlikte cüz'î, iradesi hadis değildir ve insanın fiillerinde hür olması için yeterlidir. **İstitaat** ın fiilden önce var olduğunu kabul etmekle Maturidiyye, bu konuda Eş'arilikten ziyade Mu'tezili anlayışa yakın olmuştur."},{"k":"p","x":"**6. Kader ve Kaza:** Kader ve kaza sorumlu bulunduğu fiillerinde insanı icbar altında bırakmaz ve yükümlülükten kurtarma aracı olarak görülemez. Çünkü insan kader ve kazaya ilişkin bilgilerden habersiz ve iradesini kullanmak suretiyle fiillerinde rol oynar. Canlıların ecelleri ve rızıkları, her canlının ölümü ilahî ilim ve iradeye göre gerçekleşir, İnsanın ömrü sıla yapıp yapmayacağı ve sadaka verip vermeyeceği dikkate alınarak belirlendiği için sıla ve sadaka ömür uzunluğu ve kısalığı üzerinde etkilidir."},{"k":"p","x":"**7. Ahiret Ahvali:** İnsanın iyilik yapana mükafat, kötülük işleyene ceza vermek gerektiğini benimseyip bunu dünyada uygulaması ahiret hayatını fikren zorunlu kılar. Zira ahiret âleminin gerçekleşmeyeceğini var saymak iyilik yapanla kötülük işleyeni sonuç itibariyle eşit hâle getirir, bu da adaletsizliğe yol açar. Ahiret düşüncesinin insanların büyük çoğunluğu arasında kabul görmesi bu akli zorunluluğun bir yansıması olarak algılanmalıdır. Ölenin kabirde sorguya çekilmesi, azap veya nimet görmesi ahad hadislerle sabittir, ancak buna işaret eden ayetler de vardır. Kabir hâllerini dünya hayatı ve şartlarına benzetip inkâr etmek doğru değildir. Bu, ruhla beden arasında bizce bilenmeyen bir şekilde geçici bir süre için kurulacak irtibatla sağlanabileceği gibi, cesette bir tür hayatın yaratılmasıyla da gerçekleşebilir."},{"k":"p","x":"Ölenlere ait ruhlar mertebelerine göre berzah âleminde değişik makamlarda bulunur. Matüridîler'in bir kısmına göre ruh bir tür cisim kabul edilirken, diğer bir kısmı onun mücerred bir varlık olduğuna inanır. Kıyametin kopmasından sonra ölülerin bedenleriyle birlikte dirileceği ayetlerle sabit olan kesin bir itikadî hükümdür. Bunu inkâr edenin Müslüman olamayacağında âlimler icma etmişlerdir. Matüridî ve ona uyan bir kısım kelamcı **“misliyle iade\"** yi ve ruhlu-bedenli dirilişi benimsemiştir. Müteahhir Matüridiler ise **aynıyla iadeyi** daha doğru kabul etmiştir. Naslarda bildirilen hesap, mizan ve diğer ahiret hâllerine inanmak gerekir, keyfiyetlerini bilmek mümkün olmadığından bunları te’vil etmek doğru değildir. Havz-ı Kevser'e Hz. Peygamber'e verilen \"yüksek makam ve itibar\" anlamıyla te’vil edilmelidir. Cennet ve cehennem yaratılmış olup cennet yedi göğün üstünde, cehennem yedi yerin altındadır. Kıyametin kopmasıyla cennet ve cehennemin helak olmaz. Cennet ve cehennemin tasvirleri hakikat manasının yanında özendirme ve sakındırmaya yönelik hedefleri de içerir. Cennet ve cehennem ebedidir. Şirk ve inkârda direnişin cezası ebediyen cehennemdir. İnatçı kâfir sonsuza kadar inkâr etmek ister, cezasının kaldırılması bu açıdan hikmetle bağdaşmaz. Bu durum iyi ile kötü arasındaki farkı ortadan kaldırır ve zulme yol açar."},{"k":"p","x":"**8. İman-Amel llişkisi:** İmanın asli unsuru, inanılması gereken şeyleri kalple tasdik etmek, inanmak ve benimsemektir. Dil ile ikrar ise, kalpte bulunan imanın ifadesi, başkaları tarafından bilinebilmesi için bir vasıtadır. Bundan, imanın Allah'ın bütün emirlerine itaat etme ve onları yerine getirme olduğu anlaşılmaz. Öte yandan iman emir ve yasakları bilmek anlamında da değildir. Çünkü bazı şeyleri bilmeyen sadece onları bilmemiş olur, inkâr etmiş sayılmaz."},{"k":"p","x":"**İmanın kendisinde artma ve eksilme olmaz**. Diğer taraftan iman edilecek şeyler de belirli olup, onlarda da artma ve eksilme bahis konusu değildir. Yalnız artan ve eksilen, yakin, imanın ve ikrarı her an devamı, itmi'nan ve imanın güçlülüğünün artıp eksilmesi gibi psikolojik unsurlardır. İman ve İslam kelimeleri aynı anlamı ifade ederler. Bu duruma göre her mü'min müslim, her müslim de mü'mindir. Fırkaların aksine kişinin kendini tavsif ederken yahut nitelendirirken **“İnşaallah mü'minim\"** gibi bir ifade kullanmayıp, istisna edatı olmadan kendisini doğrudan “mü'minim\" gibi bir ifade ile belirtmesini isterler. Zira istisna kesin olarak belirli olmayan hususlarda kullanılır, zan ve tahmin gibi bir mana ifade eder. Hâlbuki imanda şek, şüphe, zan ve tahmine yer yoktur. **Mukallidin imanı** sahih kabul edilmekle birlikte, istidlali terketmesi cihetiyle günahkârdır. **Fetret ehli** diye isimlendirilen kimselerin, yaşadığı alemi dikkatle izleyerek bir yaratıcının bulunduğu neticesine ulaşmaları, Allah'a iman etmeleri, tazim hissi duymaları onların ahirette kurtuluşlarına vesile olur. Maturidiyye, marifetullahı şer'i olmaktan çok akli olarak kabul etmektedir. Bu sebeple şeriat gelmese de kullar Allah'ın varlığını, yaratılanlara göre anlama ve inanma durumundadırlar. **İşlediği günahı hafife almayan** veya helal saymayan kimse dinden çıkmaz. Amel, iman unsurunun bir cüz'ünü teşkil etmediği için **kebire işleyen kimse imandan çıkmış olmaz**. Bu tür kimselerin cehennemde ebedî kalacağı iddia edilirse onların işledikleri en büyük amel olan iman karşılıksız bırakılmış olur. Kebire işleyen kimse tövbeden önce veya sonra ahirete gidince, Allah dilerse affeder, dilerse cezalandırır. Fakat bu durumda olan bir kimse cehennemde ebedî kalmayacaktır. Günahkâr müminler tövbe ile günahlarından arınabilecekleri gibi, ahirette şefaat ile de affa ulaşabilirler. **Şefaate hak kazananlar ise sadece müminler olacaktır.** Bir mü'minin kâfir olması için zarurat-ı diniyye olarak isimlendirilen dinin bildirdiği kesin esaslardan birini inkâr etmesi ya da başka bir dinin alameti farikası olan şeyi kendi rızasıyla kullanması gerekir. Ayrıca Allah ve peygambere dil uzatıp tezyif eden, Kur'an ayetlerini ve mütevatir sünneti red ve inkâr eden kimselerin de küfre düştüğü kabul edilir."},{"k":"p","x":"**9. İmamet:** Matüridiyye’ye göre seçilecek imam yahut devlet başkanının adil ve liyakatli olması gereklidir. Seçilecek kimsede bu vasıflar dışında diğerleri tamamen mevcut bulunmayabilir. Onlara göre Hz. Ali ve evlatlarının imametiyle ilgili iddialar sağlam bir asla dayanmamaktadır. Keza imamların ilk dönemde Kureyş'e mensup bulunmaları da zamanla ilgili bir şart olup, ilk dönemde bu işin çözümüne yardımcı olmuştur."},{"k":"p","x":"**d. Matüridiyye'nin Yayıldığı Coğrafya:** Ehl-i Sünnet'in en yaygın ve en geniş kolu olan Maturidiyye, Hanefî mezhebinin yayıldığı bütün bölgelerde hâkim durumdadır. Mezhep mensupları ve düşünceleri, Türkiye, Balkanlar, Kuzey Afrika, Orta Asya, Hindistan, Pakistan, Malezya ve Endonezya başta olmak üzere geniş ve büyük bir coğrafyaya yayılmış bulunmaktadır. Mezhebin yayılmasında etkili olan faktörlerin başında İmam Matüridî ve gelenekten gelen diğer âlimlerin dinî barış, birlik ve beraberliğin kaynağı olarak kabul etmeleri, imanın tasdik ve takrirden oluştuğu görüşünü benimsemeleri ve kişileri yapıp ettiklerinden dolayı -mümin olduklarını kabul ettikleri müddetçe- dışlamamalan gibi hususlar sayılabilir."}]},{"h":"Ehl-i Sünnet: Kavram ve Tarihî Gelişim","b":[{"k":"p","x":"Sözlükte \"mânevî alanda çizilen yolu benimseyenler\" anlamına gelen ehl-i sünnet (ehlü’s-sünne) tamlaması, ehlü’s-sünne ve’l-cemâa (ehl-i sünnet ve’l-cemâat) ifadesinin kısaltılmış halidir. Buradaki sünnetten maksat, Hz. Peygamber'in İslâm'ın temel konularını anlama ve benimseme tarzıdır. Cemaat kavramı ise farklı şekillerde yorumlanmış olsa da, tercih edilen görüşe göre vahyin ilk muhatapları olan ve İslâm'ı bütün yönleriyle sonraki nesillere aktaran ashap cemaati anlamına gelir. Dolayısıyla Ehl-i sünnet, \"Hz. Peygamber ile ashap cemaatinin dinin temel konularında takip ettikleri yolu benimseyenler\" olarak tarif edilebilir. Bu tarifteki \"dinin temel konuları\" ise İslâm'dan olduğu kesin olarak bilinen ve \"usûlü’d-dîn\" olarak adlandırılan hususlardı"},{"k":"p","x":"Erken dönem hadis kaynaklarında \"ehl-i sünnet\" tabiri geçmemekte, ancak \"sünnet\" ve \"cemaat\" kavramlarına yer verilmektedir. Bu rivayetlerde Hz. Peygamber, ümmetin farklı fırkalara ayrılacağını ve \"cemaat fırkası\"nın kurtuluşa ereceğini belirtmiştir. Cemaatten ayrılmanın tehlikeleri vurgulanmış ve ihtilaf durumunda büyük çoğunluğa uyulması emredilmiştir. Vefatından sonra ortaya çıkacak ayrılıklara karşı kendi sünnetine ve Hulefâ-yi Râşidîn'in sünnetine sıkıca sarılma tavsiye edilmiştir. Bazı geç dönem eserlerinde ise Hz. Peygamber'e nispet edilen \"ehl-i sünnet\" tabiri ve bu tabirin esasları zikredilmektedir."},{"k":"p","x":"Ehl-i sünnet mensupları, “ehl” kelimesine “hadis, cemaa, istikame, hak, iman, isbat” kelimeleri eklenerek oluşturulan terkiplerle ve “sıfâtiyye” (ilâhî sıfatları benimseyenler), “fırka-i nâciye” (kurtuluşa eren zümre) ve “sevâd-ı a‘zam” (büyük çoğunluk) tabirleriyle de anılır."},{"k":"p","x":"Ehl-i sünnet ve’l-cemâat tabirinde yer alan “sünnet” ashabın yaygın telakkisi, “cemaat” de çoğunluğun siyasî temayülü şeklinde yorumlanmıştır. Özellikle cemaat kavramının Muâviye tarafından ortaya konulduğu ve Hz. Hasan’ın hilâfetten çekildiği 41. (661) yıla “cemaat yılı” denildiği nakledilmektedir"},{"k":"p","x":"Sünnî terimi tâbiînden Saîd b. Cübeyr’e (ö. 95/713) nispet edilen bir rivayetten anlaşıldığına göre kelime I. yüzyılın sonuna doğru (VIII. yüzyılın başları) ortaya çıkmış olmalıdır. Ehl-i sünnet tabiri ise Dârimî’de yer alan bir rivayete bakılırsa ilk defa Hasan-ı Basrî tarafından kullanılmıştır."},{"k":"p","x":"Şîa’ya karşı ilk dört halifenin yanı sıra Muâviye’nin hilâfetini meşrû kabul edenlere Osmâniyye adı verilmiş ve böylece Havâric dışındaki Müslümanlar siyasî bakımdan büyük çoğunluğu teşkil eden Osmâniyye ile azınlık durumunda bulunan Şîa gruplarına ayrılmıştır. Osmâniyye başlangıçta siyasî anlamda Ehl-i sünnet’i ifade eden bir kavram olarak kabul edilmelidir."},{"k":"p","x":"Başlangıç dönemi Ehl-i sünnet sisteminin şekillenmesinde önemli rol oynayan âlimlerin başında Hasan-ı Basrî gelir. Emevîler’in uygulamalarını gerektiğinde ağır bir dille eleştirmesine rağmen onları Hulefâ-yi Râşidîn’den sonra meşrû idareciler olarak kabul edip Ehl-i sünnet’in konuyla ilgili ilk habercisi rolünü oynamıştır"},{"k":"p","x":"Ehl-i sünnet akaidinin oluşmasına tesir eden âlimlerin en önemlisi şüphe yok ki Ebû Hanîfe’dir. Onun bazı kaynaklarda Mürcie gruplarından birinin kurucusu olarak gösterilmesi, o dönemde mezheplerin henüz teşekkül safhasında bulunması sebebiyle terimlerin yerleşmemiş olmasından ve Sünnî akîdenin değişik zümrelerin katkılarıyla teşekkül dönemini yaşamasından kaynaklanmaktadır."},{"k":"p","x":"Ebû Hanîfe’den sonra İmam Mâlik, Mu‘tezile ile diğer bid‘at fırkalarının akaide dair faaliyetlerine paralel olarak sünneti ön plana çıkarıp ta‘tîl, teşbîh ve tecsîm görüşlerini reddetmiş, İmam Şâfiî İsbâtü’n-nübüvve ve er-Red ʿalâ ehli’l-ehvâʾ adlı eserlerinde muhafazakâr akîdeyi savunmuştur."},{"k":"p","x":"III. yüzyılın ikinci yarısında Mu'tezile'nin Abbâsîlerin desteğiyle güçlenmesiyle Ehl-i sünnet'i iki ana grup temsil etmeye başlamıştır. Bunlardan ilki, Ahmed b. Hanbel'in öncülüğünü yaptığı ve Kur'an, sünnet ve Selef'in görüşlerine bağlı kalarak bid'at ehli şiddetle eleştiren Ehl-i Hadîs (Selefiyye, Eseriyye) grubudur. Bu gruba Buhârî, Süfyân es-Sevrî gibi hadis âlimleri dahildir. Ahmed b. Hanbel, ilâhî sıfatların ispatı, Kur'an'ın ezeliliği ve rü'yetullah gibi konulara odaklanmış ve akide esaslarının naslardan hareketle belirlenmesi gerektiğini savunarak nakli ön plana çıkarmıştır. İman esasları konusunda Ebû Hanîfe ile benzer görüşlere sahip olsa da, aklın rolü ve hadisin önemi noktasında farklı telakkileri bulunmaktadır."},{"k":"p","x":"Ehl-i Hadîs'in Sünnî akidenin belirlenmesi ve yaygınlaşmasındaki önemli eserleri arasında Abdullah b. Muhammed el-Cu'fî'nin er-Red ʿale’l-Cehmiyye'si, Buhârî'nin el-Câmiʿu’s-ṣahîh'indeki ilgili bölümler ve Halku efʿâli’l-ʿibâd'ı, İbn Kuteybe'nin el-İhtilâf fi’l-lafz ve Teʾvîlü muhtelifi’l-hadîs'i, Ebû Dâvûd'un Kitâbü’s-Sünne'si, Osman b. Saîd ed-Dârimî'nin er-Red ʿale’l-Cehmiyye ve er-Red ʿale’l-Merîsî'si ile İbn Ebû Âsım ve Abdullah b. Ahmed b. Hanbel'in Kitâbü’s-Sünne'leri sayılabilir. Ehl-i Hadîs'in temsil ettiği bu Sünnî anlayış, bütünüyle sünnet çizgisi üzerinde olduğu ve Selef'in ihtilaf etmediği konulara odaklandığı için \"Ehl-i sünnet-i hâssa akîdesi\" olarak adlandırılmıştır. Mâtürîdiyye ile Eş‘ariyye’nin temsil ettiği Sünnî akîdeyi benimseyenlere, Selefiyye’nin alternatifi olarak “Ehl-i sünnet-i âmme” de denilmiştir"},{"k":"p","x":"III. (IX.) yüzyıldaki tercüme faaliyetleri ve İslâm ülkesinin farklı kültürlerle karşılaşması, Selef âlimlerinin benimsediği itikadî esasların akıl ilkeleriyle desteklenme ihtiyacını doğurdu. Bu durum, İbn Küllâb el-Basrî ve Hâris el-Muhâsibî öncülüğünde \"ehl-i hadîs kelâmcıları\" olarak anılan yeni bir grubun ortaya çıkmasına yol açtı. Felsefi akımların güçlenmesi, fıkıh mezheplerinin kurulması ve hadislerin tedvin edilmesi gibi gelişmeler, âlimleri müteşâbih nasları yeniden incelemeye ve iman esaslarını aklî delillerle desteklemeye yöneltti. Bu yeni Ehl-i sünnet kelâmcıları hareketi, IV. (X.) yüzyılın başlarından itibaren Müslüman çoğunluğun hâkim mezhebi haline gelmeye başladı."},{"k":"p","x":"Bu yeni akım, İbn Küllâb'dan sonra Ebü’l-Hasan el-Eş‘arî ve Ebû Mansûr el-Mâtürîdî ile canlılık kazandı. Eş‘arî, ehl-i hadîsin akidesini benimsediğini belirtse de inanç esaslarını kelâmî delillerle kanıtlamaya çalıştı ve onun metodu Bâkıllânî, Cüveynî ve Gazzâlî gibi âlimler tarafından geliştirildi. Diğer bir Sünnî kelâm mektebi olan ve kökleri Ebû Hanîfe'ye dayanan Mâtürîdiyye ise Ebû Mansûr el-Mâtürîdî tarafından Mâverâünnehir'de kuruldu. Bu mezhep, Hakîm es-Semerkandî ve Ebü’l-Muîn en-Nesefî gibi âlimlerce güçlendirildi. Mâtürîdiyye ve Eş‘ariyye'nin birbirlerinden haberdar olmadıkları iddiası doğru değildir; zira Nesefî gibi âlimler Eş‘arî görüşlerini eleştirmişlerdir. Mezhep tarihçisi Bağdâdî'nin Ehl-i sünnet'i ehl-i re'y (Mâtürîdiyye) ve ehl-i hadîs (Eş'ariyye ve diğerleri) olarak ayırması da bu iki ekolün varlığını ve farklılığını göstermektedir. Nesefî'nin Eş'arî âlimlerine \"ehl-i hadîs kelâmcıları\" demesi de bu durumu desteklemektedir."},{"k":"p","x":"Sünnî kelâm ekolü büyük çoğunluğun tasvibini kazandıktan ve bir bakıma resmî mezhep halini aldıktan sonra fikrî hayatın çeşitli cepheleriyle kendini takviye etmeye başlamış, onun bu hâkimiyeti Mu‘tezile, Mürcie, Müşebbihe, Felâsife gibi grupların zayıflayıp zamanla fiilen ortadan kalkması sonucunu doğurmuştur. Ehl-i sünnet’in kurumlaşmasına paralel olarak Şîa da yeniden şekillenip azınlığı temsil eden muhalif grubu teşkil etmiştir."},{"k":"li","x":"Ebû Abdullah el-Halîmî’nin kaydettiği rivayete göre Resûl-i Ekrem her emîrin arkasında namaz kılmayı, her halifenin idaresinde cihad yapmayı ve ehl-i kıbleden olup vefat eden herkesin cenaze namazını kılmayı Ehl-i sünnet’in üç esası olarak göstermiştir (el-Minhâc, III, 180)."},{"k":"li","x":"Ehl-i sünnet âlimlerine göre naslardan isabetli hükümler çıkarmak ve ihtilâflı konuların çözümüne ulaşabilmek için anlamı açık olan muhkem âyetlerden hareket etmek, sahih hadislerin beyanlarını dikkate almak, nasları bütünlük içinde anlamaya çalışmak, naklî ve aklî bir zaruret bulunmadıkça nasların zâhirine bağlı kalıp aklı nakle tâbi kılmak gerekir. Nas bulunmayan konularda ise aklın temel ilkelerine başvurularak Kur’an’ın genel muhtevasına ve özüne uygun bir şekilde ictihad etmek lâzımdır"},{"k":"h","x":"Ehl-i Sünnet Kapsamı: Selefiyye Âlimlerinin Görüşleri"},{"k":"li","x":"Âcurrî, İbn Hazm, İbn Teymiyye, Seksekî, M. Reşîd Rızâ, Abdullah Ebâ Betîn: Selefiyye'yi Ehl-i sünnet'in tek temsilcisi olarak görmüş, Eş‘ariyye ve Mâtürîdiyye'yi Ehl-i sünnet'e intisap iddiasında bulunan gruplar olarak değerlendirmişlerdir."},{"k":"li","x":"İbn Hazm: Eş‘ariyye'nin Ehl-i sünnet'e en uzak fırka olduğunu belirtmiştir."},{"k":"h","x":"Mâtürîdî Âlimlerinin Görüşleri"},{"k":"li","x":"Ebü’l-Yüsr el-Pezdevî ve Ebü’l-Muîn en-Nesefî: Ehl-i sünnet'i gerçek anlamda sadece Mâtürîdiyye'nin temsil ettiğini, Eş‘ariyye, Küllâbiyye ve Sûfiyye'nin ise kendilerini Ehl-i sünnet'e nispet eden gruplar olduğunu belirtmişlerdir."},{"k":"h","x":"Eş‘arî Âlimlerinin Görüşleri"},{"k":"li","x":"Abdülkāhir el-Bağdâdî: Ehl-i sünnet'in ehl-i hadîs ve ehl-i re'yden oluştuğunu söyleyip, bunları kelâm, fıkıh, tefsir, kıraat ve Arap dili âlimleri, şeriata bağlı sûfîler, mücahidler ve Sünnî akaidin hâkim olduğu bölgelerdeki Müslüman halk kitlesi olarak sekiz gruba ayırmıştır."},{"k":"li","x":"Şehristânî: Eş‘ariyye'yi Sıfâtiyye içinde değerlendirmiş ve Sıfâtiyye'yi bir anlamda Ehl-i sünnet karşılığında kullanmış, Müşebbihe ve Kerrâmiyye'yi de Ehl-i sünnet'e dahil etmiştir."},{"k":"li","x":"Sübkî: Ehl-i sünnet'i ehl-i hadîs, ehl-i nazar (Eş‘ariyye ve Hanefiyye) ve ehl-i keşf olarak üç gruba ayırmıştır."},{"k":"li","x":"Cürcânî: Ehl-i sünnet'e Selefiyye ve Eş‘ariyye'yi dahil etmiş, Mâtürîdiyye'den bahsetmemiştir."},{"k":"h","x":"Diğer Görüşler"},{"k":"li","x":"Şîa'dan İbn Şâzân: Hilâfete aynı açıdan baktıkları için Şîa dışındaki bütün grupları Ehl-i sünnet'e dahil etmiştir."},{"k":"li","x":"İbnü’n-Nedîm ve İbnü’l-Murtazâ: Kullara ait fiillerin Allah tarafından yaratıldığına inandıkları için Mücbire, Neccâriyye, Mürcie, Dırâriyye ve Bekriyye fırkalarını Ehl-i sünnet'e dahil etmişlerdir."},{"k":"li","x":"Muhammed İmâre: Sünnet kavramına verilen anlama göre Şîa, Havâric ve Mu'tezile'nin de Ehl-i sünnet'ten sayılabileceğini, eğer sünnetle ashabı taklit ve muhafazakârlık kastediliyorsa sadece Selefiyye'nin Ehl-i sünnet'e dahil olduğunu belirtmiştir."}]},{"h":"Mâtürîdî ve Mâtürîdîlik","b":[{"k":"p","x":"Ebû Mansûr Muhammed b. Muhammed b. Mahmûd el-Mâtürîdî es-Semerkandî el-Hanefî (ö. 333/944), Hanefî mezhebinin itikadî düşüncesinin sistemleşmesinde ve Ehl-i Sünnet kelâmının teşekkülünde müstesna bir konuma sahip olan bir âlimdir. Tahmini olarak 238/852 yılında Semerkand’ın Mâtürîd kasabasında doğan Mâtürîdî, yaşadığı dönemin önemli bir ilim merkezi olan Semerkand'da yetişmiş ve Hanefî ulemasının önde gelen isimlerinden ilim tahsil etmiştir."},{"k":"p","x":"Mâtürîdî, 333/944 yılında Semerkand'da vefat etmiş ve aynı şehirdeki Çakerdize Mezarlığı'na defnedilmiştir."}]},{"h":"İlmî Kişiliği ve Temel Görüşleri","b":[{"k":"p","x":"Mâtürîdî'nin ilmî düşüncesinin merkezinde, İmam-ı Âzam Ebû Hanîfe'nin (ö. 150/767) fıkhî ve itikadî mirası yer almaktadır. O, Ebû Hanîfe'nin görüşlerini derinlemesine analiz ederek sistemleştirmiş ve sonraki nesillere aktarmada önemli bir köprü vazifesi görmüştür. Bundan dolayı olacak ki, bazı eserlerde mezhebin adı **el-Hanefiyyetü'l-Mâtürîdiyye** şeklinde dolayımlı olarak geçer."},{"k":"p","x":"Kelâm ilmindeki özgün metotları ve Ehl-i Sünnet akidesini farklı sapkın fırkalara karşı müdafaa etmedeki başarısı, kendisine \"Alemü'l-hüdâ\", \"İmâmü'l-hüdâ\" ve \"İmamü'l-mütekellimîn\" gibi saygın unvanların verilmesine neden olmuştur."}]},{"h":"Mâverâünnehir Bölgesindeki Etkisi","b":[{"k":"p","x":"Mâtürîdî'nin hayatının büyük bir bölümünü geçirdiği Maveraünnehir bölgesi, o dönemde Hanefî mezhebinin güçlü bir şekilde temsil edildiği bir coğrafyaydı. Mâtürîdî, bu ortamda önemli bir ilmî otorite olarak kabul görmüş ve fetvalarıyla, görüşleriyle bölgedeki dini ve fikri hayatı derinden etkilemiştir."},{"k":"p","x":"Hâkim es- Semerkandi’nin, o dönemde hepsi Hanefi ekolüne bağlı yetişmiş dört yüz civarında âlimin olduğunu söylemesi bu ilim halkasının boyutlarını göstermektedir."},{"k":"p","x":"Mâverâünnehir toprakları Bizans, Sâsânî ve Çin gibi medeniyetlerle irtibat içindedir. Bölgede Mecusîlik, Seneviyye, Sümeniyye, Berâhime, Hıristiyanlık ve Yahudilik gibi akımlara mensup kişiler, ayrıca Hanefi ve Şâfi1er, Şiî ve Mu'tezilî olanlar ile Mürciî akideyi benimseyenler bulunmaktadır."},{"k":"p","x":"Maturidi’nin hayatının sonlarına doğru bölgeye hâkim olan İsmâilî ve Karmatî propagandanın da olumsuz beraberinde getirmiş, fıkıhla meşgul olunup kelamdan uzak etkisinden bahsedilmektedir. Bu süreç, bir içe kapanmayı da aşılmıştır."},{"k":"p","x":"Her halükârda bölgede V. asırda yeniden kelâm ilmine dönüş yapılmıştır. Semerkant Hanefîlerinin kelâma yönelik geliştirdikleri mesafeli duruşun terkedilmesinde Ebû Zeyd el-Herevî (ö. 434/1043), Ebû Mansûr el-Eyyûbî (ö. 421/1043) gibi Eş'arî kelâmcılarının ortaya çıkışı akabinde Eş'arîler ile Hanefî geleneği arasında “tekvin” meselesi merkezinde başlayan tartışmaların da etkisi söz edilmektedir."}]},{"h":"Hanefî Geleneğindeki Yeri","b":[{"k":"p","x":"Mâtürîdî, Hanefî mezhebi içerisinde Ebû Hanîfe'nin doğrudan talebelerinin ardından gelen üçüncü kuşak âlimlerden sayılmaktadır. Ebû Hanîfe'nin öğrencisi **Muhammed eş-Şeybânî **(ö. 189/805) ve onun öğrencisi **Ebû Süleyman el-Cûzcânî** (ö. 200/816 civarı) gibi önemli isimlerden ders alması, onun Hanefî fıkhı ve itikadî düşüncesine olan derin bağlılığını ve bu geleneğin sağlam bir temsilcisi olduğunu ortaya koymaktadır."},{"k":"p","x":"Yetiştirdiği önemli öğrencilerden biri olan **Ebü'l-Hasan Ali b. Saîd er-Rüstüfağnî **(ö. 345/956), kendi döneminde Semerkand'daki Ehl-i Sünnet çoğunluğunu temsil etmiş ve Mu'tezile düşüncesine karşı fikrî mücadelede bulunmuştur. Yazdığı **İrşâdü'l-mühtedî** isimli eserinde hocasının görüşlerine iştirak ettiğini belirtmiştir. Bu durum, Mâtürîdî'nin ilminin ve düşüncelerinin sonraki nesillere aktarılmasında ve Ehl-i Sü
