nnet akidesinin savunulmasında ne kadar etkili olduğunu göstermektedir."},{"k":"p","x":"Mâtürîdî'nin düşünceleri ve kurduğu sistem kendisinden önceki öğrencileri tarafından devam ettirilmiştir. Özellikle Mâtürîdî'nin ders arkadaşları **Sevadü'l-a‘zam**’ın yazarı es-Semerkandî (ö. 342/953) ve Ebû Nasr el-İyazî'nin oğulları Ebû Ahmed ve Ebû Bekir el-İyazî geleneğin teşekkülünde ve sonraki nesillere aktarılmasında etkili olmuşlardır."}]},{"h":"Eserlerinin ve İlmî Kişiliğinin İhmal Edilme Nedenleri","b":[{"k":"p","x":"Ebû Hanîfe'nin öğrencilerinin gayretli çalışmaları dikkat çekicidir. Özellikle İmam Ebû Yusuf'un Abbasi yönetimi döneminde baş kadılık görevinde bulunmasının ardından, Maveraünnehir'e tayin edilen kadıların Hanefî anlayışına mensup olması, bu bölgede Hanefî mezhebinin yaygınlaşmasına imkân sağlamıştır. Nitekim İmam Ebû Yusuf ve İmam Muhammed b. Hasan eş-Şeybânî'nin öğrencisi olan Ebû Süleyman el-Cûzcânî'nin Maveraünnehir'de Hanefîliğin önderliğini yapmıştır. Bu zâtın kelâmî ilimle ilgili bulunmamasına rağmen Semerkand'da kurduğu ilim halkası, Mâtürîdî'nin yetişmesine ve kendi kelâmî sistemini inşa etmesine önemli bir zemin hazırlamıştır."},{"k":"p","x":"Çağdaş araştırmalar, Mâtürîdî'nin tefsir, kelâm, fıkıh usûlü ve mezhepler tarihi gibi alanlardaki önemli konumuna rağmen gerek müstakil eserlerde gerekse genel kaynaklarda yeterince ele alınmadığını göstermektedir. Bu ihmalin çeşitli nedenleri olabileceği düşünülmektedir."},{"k":"p","x":"Bağdat gibi merkezi bir hilafet şehrinden uzakta yaşaması, dönemin Arap tarihçilerinin dikkatini çekmemiş olabilir. Siyasî otoritelerle mesafeli bir duruş sergilemesi, Eş'arî gibi devlet destekli bir itikadî ekolün yaygınlaşması karşısında yeterli imkanlara sahip olmamasına yol açmış olabilir. Eş'arîliğin Nizamiye medreselerinde resmi olarak okutulması ve farklı coğrafyalarda geniş kitlelere ulaşması, Mâtürîdîliğin daha ziyade Hanefî çevreleriyle sınırlı kalmasına neden olmuş olabilir. Ayrıca, bazı Hanefî çevrelerinin Mâtürîdî'nin ilmî otoritesinin Ebû Hanîfe'nin önüne geçebileceği endişesi taşıması ve eserlerinin dil ve üslûp açısından zorlayıcı bulunması da bu ihmalde rol oynamış olabilir."},{"k":"p","x":"İslam dünyasında ağırlık kazanan Eş‘ariliğin nüfuzu altında kalmaları; onların eserlerinden bolca iktibaslarda bulunarak Eş‘ariliğin görüşleri çerçevesinde kelam yapmaya çalışmış olmaları Matüridiliğin ikinci plana düşmesine yol açmıştır."},{"k":"p","x":"Mâtürîdî'nin görüşlerinin bir ekol sahibi olarak benimsenmesinde ve kelâm tarihinde ikinci bir gelenek olarak sayılmasında, öğrencisi Ebü'l-Muîn en-Nesefî (ö. 508/1115) tarafından telif edilen Tebsıratü'l-Edille adlı eser önemli bir yer tutar. Bu eser, Mâtürîdî'nin kelâmî akımının sonraki nesiller tarafından anlaşılması ve takip edilmesinde temel bir kaynak olmuştur."},{"k":"li","x":"İmam Mâtürîdî'den bizzat ders alıp, Uṣûlü’d-dîn’i ve Şerḥu’l-Fıḳhi’l-ekber’i yazan Pezdevî ile son bulan Mâtürîdîliğin ikinci dönemine mütekaddimin Mâtürîdîliği denilir"},{"k":"li","x":"Ebü'l-Muîn en-Nesefî (ö. 508/1115) ile Mâtürîdîliğin müteahhirîn dönemi başlar. Nesefî, Mâtürîdî kelâmının sistemleşmesinde önemli bir dönüm noktasıdır ve bu noktadan Gazzâlî'nin Eş‘ariyye içindeki konumuna benzer bir mevkidedir."}]},{"h":"Mâtürîdî'nin Günümüze Ulaşan Eserleri ve Mâtürîdîlerin Önemli Eserleri","b":[{"k":"p","x":"Mâtürîdî'nin günümüze ulaşan en önemli eserleri şunlardır:"},{"k":"li","x":"**Kitâbü't-Tevhîd:** Mâtürîdî'nin kelâm ilminin temel konularını ele aldığı en değerli eseridir. Allah'ın birliği, sıfatları, peygamberlik, âhiret gibi temel itikadî meseleleri aklî ve naklî delillerle kapsamlı bir şekilde ele alır. Bekir Topaloğlu tarafından Türkçeye çevrilmiştir. Kelâm akımıyla ilgili temel konuları ele alan ilk müstakil eser özelliği taşımaktadır."},{"k":"li","x":"**Teʾvîlâtü'l-Kurʾân:** Mâtürîdî'nin Kur'ân tefsiridir. Eserin, Mâtürîdî'nin öğrencilerinin yaptığı takrirlerden oluştuğu düşünülmektedir."}]},{"h":"Mâtürîdî Kelâmının Temel Özellikleri","b":[{"k":"p","x":"Mâtürîdî kelâmı, kendisinden önceki kelâm ekollerinden farklılaşan bazı belirgin özelliklere sahiptir:"},{"k":"li","x":"**Akıl ve Nakil Dengesi:** Mâtürîdî, itikadî konularda hem aklî delillere hem de naklî delillere (Kur'ân ve Sünnet) büyük önem verir ve bu ikisi arasında bir denge gözetir. Akıl yürütmeyi dinin temel prensiplerini anlama ve savunmada önemli bir araç olarak kabul eder."},{"k":"p","x":"Akıl din tarafından bildirilmeden önce bile bazı şeylerin iyiliğini anlayabilirdi. Fakat bazısını bilemezdi. Dine aykırı olmayan hususlarda aklın hükmünü esas alır. Fakat dine aykırı düşerse, şüphesiz dinin hükmüne boyun eğmeyi gerekli bulur."},{"k":"p","x":"Bu ölçeğin sağ tarafında sırasıyla akıl ve nakle yakınlığı ve uzaklığı itibariyle Haşviyye, Hanâbile, Zâhiriyye, Eş’ariyye ve Mâturîdîyye; sol tarafında ise, İsmâiliyye, Mu’tezile, İsnâaşeriyye, Hâricîlik ve Zeydiyye yer almaktadır. “Kur'anî konumun” sağında yer alan mezheplerin bakış açılarının yoğunlaştığı alan, isbât ve teşbihe meyletmişken; solda yer alan mezheplerin bakış açılarının yoğunlaştığı alan, te’vîl ve tenzihe meyletmiş olmalarıdır."},{"k":"li","x":"**Hikmet merkezli bir tanrı tasavvurunun benimsenmesi: **Mâtürîdîler hem Mu‘tezile tarafından ileri sürülen \"**aslah**\" ve \"**vücûb alellah**\" görüşüne karşı çıkmış hem de Eş‘arîliğin Allah'ın dilediği her şeyi yapan, “**kâdir-i mutlak**” ve “**mâlikü'l-mülk**” oluşu öne çıkan tanrı tasavvurunu eleştirmiştir."},{"k":"li","x":"**Selef Yöntemine Bağlılık:** Özellikle Allah'ın sıfatları ve müteşabih ayetlerin yorumlanması konusunda Mâtürîdî, genel olarak Selef âlimlerinin yolunu takip etmiş ve bu tür nasların zahirî manalarını tevil etmekten kaçınmıştır."},{"k":"li","x":"**Ehl-i Sünnet Akidesinin Savunulması:** Mâtürîdî, yaşadığı dönemdeki farklı sapkın fırkalara (özellikle Mu'tezile) karşı Ehl-i Sünnet akidesini güçlü bir şekilde savunmuştur. Bu mücadelesinde aklî ve naklî delilleri ustaca kullanmıştır."},{"k":"li","x":"**Hanefî Mezhebiyle İlişkisi:** Mâtürîdî kelâmı, Ebu Hanefî’nin itikadî esaslarını temellendirme ve savunma amacını taşır. Bu nedenle Hanefî âlimleri tarafından benimsenmiş ve bu mezhebin itikadî görüşlerinin yaygınlaşmasında etkili olmuştur."}]},{"h":"İmam Mâtürîdî'nin Görüşleri (Kitâbü't-Tevhîd Esas Alınarak)","b":[{"k":"p","x":"İmam Mâtürîdî'nin temel itikadî görüşlerinden bazıları şunlardır:"},{"k":"p","x":"**1. Bilgi Edinme Yolları:** Bilgiye ulaşmanın temel yolları duyular, haber (mütevâtir haber) ve akıldır. Bu bilgi kaynakları aracılığıyla eşyanın hakikati hakkında bilgi sahibi olabiliriz."},{"k":"p","x":"**2. İman Taklidi Değil Tahkiki Gerektirir:** Mâtürîdî'ye göre iman, körü körüne bir taklit değildir. Dinde taklit geleneği ve ataların dinine tabi olmayı gerektirse de bu durum Kur'ân-ı Kerîm tarafından reddedilmiştir. Dolayısıyla iman, aklî ve naklî delillerle desteklenen bir tahkik (araştırma ve doğrulama) sonucu oluşmalıdır."},{"k":"p","x":"**3. Cisimlerin Hâdis Oluşu:** Mâtürîdî'ye göre âlemdeki tüm cisimler sonradan yaratılmıştır, yani hâdistir. Bu konuyu ispatlamak için hem aklî hem de naklî delilleri kullanır."},{"k":"p","x":"**4. Cisimlerin Hudûsu Allah'ın Varlığı İçin Delildir:** Âlemdeki her şeyin hâdis olması, yani bir başlangıcının olması, bu başlangıcı var eden bir yaratıcının zorunluluğunu gösterir. Bu durum, Allah Teâlâ'nın varlığına güçlü bir delildir."},{"k":"p","x":"**5. Allah Teâlâ'nın İsimleri Tevkîfîdir: **Allah Teâlâ'ya ancak O'nun Zât'ına nispet ettiği veya Kur'ân ve Sünnet'te geçen isimler verilebilir. Bununla birlikte Allah'ın eksiklik ve noksanlık özelliği taşımayan **sâni‘**, **vâcibu'l-vücüd **gibi isim ve vasıflarla vasıflandırıldığı görülmektedir."},{"k":"p","x":"**6. Allah Teâlâ'nın Her Çeşit Keyfiyetten Münezzeh Olarak Ahirette Görüleceği:** Allah Teâlâ'nın ahirette müminler tarafından her türlü keyfiyetten (nitelik, şekil) münezzeh olarak görüleceği naklî delillerle sabittir ve buna inanmak vaciptir."},{"k":"p","x":"**7. İstivâ ve Müteşabih Ayetlerin Tevili:** İstivâ gibi haberî sıfatlar ve bütün müteşabih ayetlerde Mâtürîdî, selefin yolunu tutmuş, tevil cihetine gitmemiştir. Çünkü ona göre tevil, bir başka tevil ihtimalini de haklı çıkarır. Bu tür ayetlerin zahirî manalarını Allah'a havale etmek daha uygundur."},{"k":"p","x":"**8. Mümin Büyük Günah İşlemekle İmandan Çıkmaz:** Mâtürîdî'ye göre mümin, büyük günah işlemekle imandan çıkmaz. İman sadece kalp ile tasdikten ibarettir. Dil ile ikrar o kişiye Müslüman muamelesi yapmak için gereklidir."},{"k":"p","x":"**9. İmanda istisna** “inşallah müminim\" demek caiz değildir."},{"k":"p","x":"**10. Nübüvvet:** Mâtürîdî'ye göre nübüvvet, Allah'ın emrettiği şeyleri yapmak, nehyettiği şeylerden kaçınmak için Allah'ın peygamber göndermesi haktır. Peygamber göndermenin zarureti konusunda aklî ve naklî deliller vardır. Allah'ın kullarına hidayeti ulaştırması ve onlara doğru yolu göstermesi peygamberler aracılığıyla gerçekleşir.  Akıl peygamberlerin gönderilişinin gerekliliğinde bir sebep olarak kabul edilir. Mutezilenin iddia ettiği “akıl gerekli kılar” söylemlerine katılmazlar."},{"k":"li","x":"Mâtürîdî geleneğinin teşekkülü sonrasındaki süreçte Ebû Şekûr es-Sâlimî (ö. 460/1068'den sonra), Ebû İshak es-Saffâr (ö. 534/1139), Necmeddin Ömer en-Nesefî (ö. 537/1142), Alâeddin el-Üsmendî (ö. 552/1157 [?]), Ali b. Osmân el-Ûşî (ö. 575/1179), Nûreddin es-Sâbûnî (ö. 580/1184) gibi isimler temayüz etmektedir."},{"k":"li","x":"Müteahhir dönemde Mâtürîdîliğin temsilcilerine gelince Ömer b. Muhammed el-Habbâzî (ö. 691/1292), Ebü'l-Berekât en-Nesefî (ö. 710/1310), Ubeydullah es-Semerkandî (ö. 701/1301), Ebü's-Senâ (Ebü'l-Mehâmid) Mahmûd b. Zeyd el-Lâmişî (VI./XII. yüzyılın ilk yarısı) gibi isimler sayılabilir. Yine el-Müsâyere adlı eseriyle öne çıkan isimler arasındadır."},{"k":"p","x":"Mâtürîdîliğin şerh ve haşiyeler dönemi olarak bilinen süreçte öne çıkan önemli âlimler şunlardır:"},{"k":"li","x":"İbnü'l-Hümâm (ö. 861/1457) Hızır Bey (ö. 863/1458) Kemaleddin el-Beyazî (ö. 1098/1687) Şemseddin Hayâlî (ö. 875/1470) İbn Kutluboğa (ö. 879/1474)"}]},{"h":"Dönemlere Göre Mâtürîdî Âlimleri ve Eserleri","b":[{"k":"h","x":"Klasik Dönem (Eserler ve İlk Talebeler)"},{"k":"li","x":"Kitâbü't-Tevhîd"},{"k":"li","x":"Teʾvîlâtü'l-Ḳurʾân"},{"k":"li","x":"Reddü Evâʾili’l-edille li’l-Kâʿbî (Mu'tezile âlimi Kâ'bî'nin görüşlerine reddiye)"},{"k":"li","x":"Beyânü vehmi’l-Muʿtezile"},{"k":"li","x":"Reddü’l-Kâʿbî fî vaʿîdi’l-füssâḳ"},{"k":"li","x":"Reddü ʿUli’l-hamse li-Ebî ʿAmr el-Bâhilî (Ebû Amr el-Bâhilî'nin beş esasına reddiye)"},{"k":"li","x":"Reddü Kitâbi’l-İmâme li-baʿzi’r-Revâfı (Şiî imamet anlayışına reddiye)"},{"k":"li","x":"er-Red ʿale’l-Ḳarâmiṭa"},{"k":"li","x":"**Ebü'l-Hasan Ali b. Saîd er-Rüstüfağnî (ö. 350/961):** İrşâdü'l-mühtedî (Mâtürîdî'nin görüşlerini içeren eser)"},{"k":"li","x":"Ebû Bekir el-İyâzî: ʿAşru mesâʾil min uṣûli’d-dîn (el-Mesâʾilü’l-ʿasr el-ʿiyâziyye)"},{"k":"li","x":"Beyânü aṣli mezhebi Ehli’s-sünne (Ehl-i Sünnet mezhebinin esaslarının açıklaması)"},{"k":"h","x":"Müteahhir Dönem"},{"k":"p","x":"Ebü'l-Muîn en-Nesefî :  Tebṣıratü’l-edille fî uṣûli’d-dîn  ve et-Temhîd li-ḳavâʿidi’t-tevḥîd"},{"k":"p","x":" Ebû Şekûr es-Sâlimî – et-Temhîd fî beyâni’t-tevḥîd"},{"k":"p","x":" Ebû İshak es-Saffâr – Telḫîṣü’l-edille li-ḳavâʿidi’t-tevḥîd"},{"k":"p","x":" Muhammed b. İbrâhim el-Hasîrî – el-Ḥâvî fi’l-fetâvâ"},{"k":"p","x":" Ali b. Osman el-Ûşî – el-Emâlî"},{"k":"p","x":" Necmeddin en-Nesefî – el-ʿAḳāʾid"},{"k":"p","x":" Nûreddin es-Sâbûnî – el-Kifâye fi’l-hidâye, el-Bidâye"},{"k":"p","x":" Ebü’l-Berekât en-Nesefî – el-ʿUmde fi’l-ʿaḳāʾid"},{"k":"p","x":" Halîl b. Ali el-Hanefî – Şerḥu ʿUmdeti ʿaḳīdeti Ehli’s-sünne"},{"k":"p","x":" Ubeydullah b. Muhammed es-Semerkandî – el-ʿAḳīdetü’r-Rükniyye"},{"k":"p","x":" Muhammed b. Eşref es-Semerkandî – eṣ-Ṣaḥâʾifü’l-ilâhiyye"},{"k":"p","x":" Hüseyin b. Ali es-Siğnâkī – et-Tesdîd fî şerḥi’t-Temhîd"},{"k":"p","x":" Ömer b. Muhammed el-Habbâzî – el-Hâdî fî uṣûli’d-dîn"},{"k":"p","x":" Ebû Şücâ‘ Necmeddin Mengübars (Baybars) b. Yalınkılıç et-Türkî – en-Nûrü’l-lâmiʿ ve’l-burhânü’s-sâṭıʿ"},{"k":"h","x":"Şerh-Haşiye Geleneği Dönemi"},{"k":"li","x":"**Hızır Bey (ö. 863/1459):** el-Ḳaṣîdetü’n-nûniyye"},{"k":"li","x":"**İbnü'l-Hümâm (ö. 861/1457):** el-Müsâyere fî beyâni meẕâhibi’l-Eşʿariyye ve’l-Mâtürîdiyye"},{"k":"li","x":"**Kemâleddin el-Beyâzî (Beyâzîzâde Ahmed Efendi) (ö. 1098/1687):** İşârâtü’l-merâm min ʿibârâti’l-İmâm Ebî Ḥanîfe fî uṣûli’d-dîn"},{"k":"li","x":"**Taşköprizâde Ahmed Efendi:** el-Meʿâlim fî ʿilmi’l-kelâm"},{"k":"li","x":"**Ali el-Kārî’:** Şerḥu’l-Fıḳhi’l-ekber"},{"k":"li","x":"**Şemseddin Hayâlî:** Şerḥu’l-Ḳaṣîdeti’n-nûniyye’si ve Ḥâşiye ʿalâ Şerḥi’l-ʿAḳāʾidi’n-Nesefiyye"},{"k":"h","x":"Modern Dönem"},{"k":"li","x":"**Ömer Nasuhi Bilmen (ö. 1971):** Muvazzah İlm-i Kelâm"},{"k":"li","x":"**İsmail Hakkı İzmirli (ö. 1946):** Yeni İlm-i Kelâm"},{"k":"li","x":"**M. Zâhid Kevserî (ö. 1952):** el-İstibṣâr fi’t-tehaddüs ʿani’l-cebr ve’l-iḫtiyâr"},{"k":"li","x":"**Abdüllatif Harpûtî (ö. 1916):** Tenḳīḥu’l-kelâm fî ʿaḳāʾidi ehli’l-İslâm"},{"k":"li","x":"**Filibeli Ahmed Hilmi:** Üss-i İslâm"}]},{"h":"Kavramlar ve Hızlı Tekrar","b":[{"k":"d","t":"Ehl-i Sünnet ve'l-cemâat","x":"Hz. Peygamber'in sünnetine ve sahabe ile ilk nesillerin cemaatine bağlı kalan Müslümanların büyük çoğunluğu."},{"k":"d","t":"Sevâdü'l-a'zam","x":"Büyük çoğunluk; Ehl-i Sünnet için kullanılan adlardan biri."},{"k":"d","t":"Ehl-i Sünnet-i hâssa","x":"Selefiyye / Ehl-i Hadis; nasları te'vil, teşbih ve ta'tîl olmadan kabul eden kol."},{"k":"d","t":"Ehl-i Sünnet-i âmme","x":"Kelâm metodunu kullanan Mâtürîdiyye ve Eş'ariyye."},{"k":"d","t":"Kitâbü't-Tevhîd","x":"Mâtürîdî'nin kelâma dair günümüze ulaşan temel eseri; tek nüshası Cambridge'dedir."},{"k":"d","t":"Te'vîlâtü'l-Kur'ân","x":"Mâtürîdî'ye asıl şöhretini sağlayan geniş hacimli tefsiri."},{"k":"d","t":"Tebsıratü'l-edille","x":"Ebü'l-Muîn en-Nesefî'nin Mâtürîdîliği sistemleştiren eseri; geleneğin ikinci kaynağı sayılır."}]}],"ht":[{"s":17,"x":"Ehl-i Sünnet bir fırka değil ana gövdedir; Selefiyye (hâssa) ile Mâtürîdiyye ve Eş'ariyye (âmme) olarak iki ana kola ayrılır."},{"s":17,"x":"Mâtürîdî (ö. 333/944) Semerkandlı Hanefî âlimidir; günümüze ulaşan eserleri Kitâbü't-Tevhîd ve Te'vîlâtü'l-Kur'ân'dır."},{"s":17,"x":"Mâtürîdîlik Ebü'l-Muîn en-Nesefî ile sistemleşti; XIX. yüzyılda yeni ilm-i kelâm temsilcileri (İzmirli, Ö. Nasuhi Bilmen) bu çizgide yazdı."},{"s":17,"x":"Mâtürîdiyye'ye göre bilginin kaynakları duyular, akıl ve doğru haberdir; iman artmaz eksilmez; kulun müstakil cüz'î iradesi vardır."}],"oz":{"t":"Ehl-i Sünnet ve Mâtürîdiyye · Özet","intro":"Ünitenin özü: Ehl-i Sünnet kimdir, nasıl oluşmuştur, hangi kollara ayrılır; Mâtürîdî kimdir ve Mâtürîdîlik neyi savunur?","s":[{"h":"Ehl-i Sünnet: Ad ve Oluşum","b":[{"k":"li","x":"**Ad:** \"Sünnet ve cemaat taraftarları\" demektir. Sünnet Hz. Peygamber'in yolunu, cemaat sahabe ile ilk nesillerin müctehidlerini ve onlara uyan çoğunluğu ifade eder. Ashâbü'l-hadis, ehlü'l-hak, fırka-i nâciye, es-sevâdü'l-a'zam gibi adlarla da anılır."},{"k":"li","x":"**Muhaliflerin verdiği adlar:** Mu'tezile onlara kader görüşü yüzünden **Mücbire**, sıfatları kabul ettikleri için **Müşebbihe** gibi adlar vermiştir."},{"k":"li","x":"**Sünnî** kelimesi I. yüzyılın sonlarında ortaya çıkmıştır. Ehl-i Sünnet bir fırka değil, ana gövdedir; ayrılan gruplara karşı kimliğini zamanla sistemleştirmiştir."},{"k":"li","x":"**Oluşum:** Hz. Osman'ın şehadeti, Cemel, Sıffîn ve tahkim olayları ile Hâricî, Şîa, Kaderiyye ve Mu'tezile'nin ortaya çıkışı, ana çoğunluğun kendini tanımlamasını gerekli kıldı. Hasan-ı Basrî, Ebû Hanîfe, Mâlik, Şâfiî ve Ahmed b. Hanbel bu zihniyetin oluşumunda belirleyici oldu."}]},{"h":"Ehl-i Sünnet'in Ekolleri","b":[{"k":"tbl","r":[["Ekol","Kısaca"],["Ehl-i Sünnet-i Hâssa (Selefiyye / Ehl-i Hadis)","Nasları te'vil, teşbih ve ta'tîl olmadan kabul eder; Ahmed b. Hanbel öncüdür."],["Ehl-i Sünnet-i Âmme: Mâtürîdiyye","Ebû Hanîfe çizgisinde, akla geniş yer veren kelâm ekolü; Hanefîlerin itikadî mezhebi."],["Ehl-i Sünnet-i Âmme: Eş'ariyye","Nakli akılla destekleyen kelâm ekolü; çoğunlukla Şâfiî ve Mâlikîlerin itikadî mezhebi."]]},{"k":"p","x":"Ehl-i Sünnet'in kapsamı konusunda görüşler farklıdır: Bazı Selefî âlimler yalnız Selefiyye'yi, bazı Mâtürîdîler (Pezdevî, Nesefî) yalnız Mâtürîdiyye'yi gerçek Ehl-i Sünnet sayar; Sübkî ise ehl-i hadis, ehl-i nazar ve ehl-i keşf olarak üçlü bir taksim yapar."}]},{"h":"İmam Mâtürîdî","b":[{"k":"li","x":"**Ebû Mansûr Muhammed b. Muhammed el-Mâtürîdî** (ö. 333/944), Semerkand'ın Mâtürîd köyünde doğdu, Semerkand'da vefat etti ve Çâkerdîze mezarlığına defnedildi."},{"k":"li","x":"Hanefî mezhebinin üçüncü kuşak âlimlerindendir; Ebû Nasr el-İyâzî ve Ebû Bekir el-Cüzcânî'den okudu. \"İmâmü'l-hüdâ\", \"Reîsü Ehli's-Sünne\" gibi lakaplarla anılır."},{"k":"li","x":"**Günümüze ulaşan eserleri:** **Kitâbü't-Tevhîd** (tek nüsha Cambridge'de) ve **Te'vîlâtü'l-Kur'ân**."},{"k":"li","x":"**İhmal edilme sebepleri:** Bağdat'tan uzak yaşaması, bölgenin istilalarla tahribi, Arap tarihçilerin ilgisizliği ve Eş'arîliğin nüfuzu."},{"k":"li","x":"Ekolün sistemleşmesi **Ebü'l-Muîn en-Nesefî** (ö. 508/1115) ve onun **Tebsıratü'l-edille**'siyle olmuştur; Nesefî'nin Mâtürîdîlikteki yeri, Gazzâlî'nin Eş'arîlikteki yerine benzetilir."}]},{"h":"Mâtürîdîliğin Gelişimi","b":[{"k":"steps","x":["**Kuruluş:** Mâtürîdî ve öğrencileri (Rüstüfağnî, Hakîm es-Semerkandî, İyâzî ailesi).","**Müteahhirûn:** Ebü'l-Muîn en-Nesefî ile sistemleşme; Necmeddin en-Nesefî'nin el-Akâid'i.","**Şerh-haşiye dönemi:** VIII/XIV. yüzyıldan itibaren; İbnü'l-Hümâm, Hızır Bey, Beyâzîzâde.","**Yeni ilm-i kelâm:** XIX-XX. yüzyılda materyalizm, pozitivizm ve Darvinizm ile mücadele (İzmirli, Ömer Nasuhi Bilmen, Harpûtî, Filibeli Ahmed Hilmi)."]}]},{"h":"Mâtürîdiyye'nin Temel Görüşleri","b":[{"k":"li","x":"**Bilgi:** Kaynaklar duyular, akıl ve doğru haberdir; akla geniş yer verilir."},{"k":"li","x":"**Allah'ın varlığı:** Âlemin hâdis oluşu Allah'ın varlığına delildir; din tebliğ edilmese de akıl sahibi insan Allah'ı bilmekle yükümlüdür."},{"k":"li","x":"**Rü'yetullah:** Allah ahirette keyfiyetsiz olarak görülecektir."},{"k":"li","x":"**Kulların fiilleri:** Fiili yaratan Allah, kesbeden kuldur; kulun **müstakil bir cüz'î iradesi** vardır."},{"k":"li","x":"**Kader:** İnsanı zorlamaz, sorumluluğu ortadan kaldırmaz."},{"k":"li","x":"**İman:** Kalple tasdiktir; dil ile ikrar dünyevi hükümler için şarttır. **İman artmaz ve eksilmez**; amel imanın parçası değildir; büyük günah işleyen imandan çıkmaz."},{"k":"li","x":"**İmamet:** Devlet başkanının adil ve liyakatli olması gerekir."},{"k":"li","x":"**Yayıldığı yerler:** Hanefîliğin yayıldığı her yerde; Türkiye, Balkanlar, Orta Asya, Hint alt kıtası, Kafkasya."}]}]}},{"t":"Eş'ariyye","intro":"Ebü'l-Hasan el-Eş'arî'nin hayatı ve eserleri, Eş'arîliğin teşekkülü ve temsilcileri, temel görüşleri, Mâtürîdîlikle farkları ve yayıldığı coğrafya.","s":[{"h":"Eş'arîlik (Eş'ariyye)","b":[{"k":"p","x":"İslam düşüncesi tarihinde İmam Ebu'l-Hasan el-Eş'ari'nin (260-324/873-936) görüşlerini benimseyenlerin meydana getirdiği topluluğa Eşariyye-Eş'arîlik denilir. Bu mezhep ilahî sıfatlar, kulların fiilleri ve iman-günah konularına dair görüşleri sebebiyle muhaliflerince Müşebbihe, Mücbire (Cebriyye) ve Mürcie gibi isimlerle de anılmıştır."}]},{"h":"Ebü'l-Hasan el-Eş'arî'nin Hayatı ve İlmî Kişiliği","b":[{"k":"li","x":"Asıl adı Ebü'l-Hasan Ali b. İsmail b. Ebî Bişr İshak b. Salim el-Eş'arî el-Basri'dir. Yemen'in Eş'ar kabilesine mensup **Ebû Musa el-Eşarî** 'nin soyundan gelmesi sebebiyle bu nisbe ile anılmaktadır. Küçük yaşta babasını kaybetmesi ve annesinin Basra Mu'tezîlesi'nin önde gelen âlimlerinden **Ebû Ali el-Cübbâi** ile evlenmesinden sonra, üvey babasının himayesinde yetişmiş ve ondan kelam ilmini öğrenmiştir. Zaman zaman gittiği Bağdat'ta, **Ebû İshak el-Mervezî** 'nin derslerine katıldı. Hocası Cübbâi'nin tesiriyle gençlik döneminde Mu'tezîle'yi benimsemiş ve bu doğrultuda eserler telif etmiştir."},{"k":"li","x":"300/912-913 yılında bir süre ortalıktan kaybolup, daha sonra bir Cuma günü Basra Camii'nin kürsüsüne çakarak Mu'tezile mezhebinden ayrıldığını, bundan böyle Ahmed b. Hanbel'in düşüncelerine yöneldiğini deklare etmiştir. Eşarî'nin bu şekilde bir dönüş yapması bazı kimseler tarafından Hz. Peygamber'i rüyasında görmesi ve onun, i’tizal mezhebinin isabetli olmadığını kendisine telkin etmesine bağlarken, bir kısmı da hocası Cübbâi ile yaptığı **üç kardeş meselesi** ne bağlamaktadır."},{"k":"li","x":"**\"İhve-i selase\"** tabiri ile kelam kaynaklarında yer verilen bu hadise kısaca şöyledir: Eşarî, hocasına biri mümin, diğeri kâfir, üçüncüsü de küçük yaşta vefat eden üç kardeşin uhrevi durumunun ne olacağını sordu. Hocası müminin cennetlik olduğunu, kâfirin cehenneme gideceğini, küçük yaşta ölen kardeşin ise yaşı buluğa ulaşıp teklife muhalap olmaması sebebiyle mazur sayılıp azaptan kurtulacağını söyledi. Bunun üzerine küçük yaşta ölen ve azaptan kurtulan kardeş “Rabbin bana ömür verseydin de, ben de cennete giden kardeşim gibi salih amel işleyip cennetlik olsaydım\" derse, durum ne olacak, diye sorunca hocası, \"Eğer ona ömür verilseydi, küfre girecek ve cehenneme gidecekti. Onun maslahatına riayetle küçükken öldürülüp azaptan kurtarılmıştır.\" şeklinde cevap verir. Bunun üzerine kâfir olarak ölen kardeş, “Rabbim küçük kardeşinin maslahatına uygun olarak onu öldürdüğün gibi, beni de küçük yaşta öldürseydin de, bu azapla karşı karşıya kalmasaydım.\" derse, buna ne cevap verileceğini sorar. Hocası tabii ki bu suale cevap veremez."},{"k":"li","x":"Muhtemelen kırk yaşları civarında Bağdat'a giderek hayatının kalan kısmını burada geçiren Eşarî, Hanbeli alimlerinden **Hasan b. Ali el-Berbeharî** ile uzun görüşmeler yaptı. Daha sonra Ahmed b. Hanbel'in itikadi sistemini savunan **el-İbâne an Usuli’d-Diyane** 'yi telif ederek Berbehari'ye takdim etti ise de ümit ettiği ilgi ve alâkayı bulamadı. Bundan sonra Sünni inançla ilgili eğitim ve öğretim faaliyetlerini Bağdat'ta sürdüren Eşari, **Ebu'l- Hasan el-Bâhili** başta olmak üzere çok sayıda öğrenci yetiştirdi."},{"k":"li","x":"Naklin akılla desteklenerek meselelerin ortaya konulması, Eşarî'nin ulaştığı önemli bir merhâle olup, o dönemde yaşayan Matüridî paralelinde Sünni kelamının oluşması için bir başlangıç dönemini teşkil etmiştir. Kaynaklarda değişik tarihler verilmesine rağmen genel kabule göre Eş'ari, Bağdat'ta 324/935-936 yılında vefat etmiş ve burada defnedilmiştir. Kaynaklarda ona çok sayıda eser atfedilmekle birlikte bunlardan sadece beş-altı tanesi günümüze ulaşabilmiştir:"},{"k":"p","x":"**i. Makâlâtül-İslamiyyin ve'htilafu'l-Musallîn**: İslam mezhepler tarihinin en önemli kaynaklarındandır."},{"k":"p","x":"**ii. El-İbâne an Usûli’d-Diyane**: Ahmed b. Hanbel'in itikadi sistemini benimsediğini ilan ederek Bağdat'a geldiğinde yazdığı, birçok konuda onun düşüncelerine katıldığını belirttiği ve zamanının Hanbeli alimi Berbeharî'ye sunduğu, ancak tasvip görmeyen çalışmasıdır."},{"k":"p","x":"**iii. El-Luma' fi'r-Reddi ala ehli Z-zeygı ve’L-bida':** Sıfatlar, iman ve kader konularını Ehl-i Sünnet itikadına göre ele aldığı, teolojik sisteminin aslını teşkil eden ana eseridir"},{"k":"p","x":"**iv. İstihsanu'l-Havd fi İlmi'l-Kelâm**: Selef âlimlerinin usül ve yaklaşımının isabetli olmadığını açıklamaya çalışmıştır."}]},{"h":"Eş'arîliğin Teşekkül Süreci","b":[{"k":"li","x":"Mu'tezîle mensuplarının nakli ihmal edip itidal çizgisini aşan akılcı bir metot takip etmeleri, Abbasîler'in nüfuzundan faydalanarak inanç ve düşünce özgürlüğünü engellemeye çalışmaları, IV. (X.) yüzyılın başlarında köklü Sünni kelam mekteplerinin doğmasına zemin hazırlamış ve Eş'arî'nin kurduğu mezhep de bunlardan birini teşkil etmiştir."},{"k":"li","x":"Eşarî, Mu'tezile ekolü içinde yetişmesine rağmen kırklı yaşlarda onlardan ayrılmış ve Ehl- i Hadis içinde yer aldığını açıklamıştı. Eş'ariyye'nin kısa zamanda geniş bir coğrafyaya yayılmasında nakille aklı birleştiren mutedil bir metot kullanmasının ve mensuplarının tasavvufa olumlu bakmasının önemli rol oynadığı kabul edilir."},{"k":"li","x":"Eş'ari'nin çizgisini kendisinden sonra güçlü âlimlerin takip etmesi hareketin sistemli bir kelam mektebi haline gelmesini sağlamıştır. IV. (X.) yüzyılda öğrencilerinden Ebü'l- Hasan el-Bahili ile İbn Mücâhid et-Tâî'nin yetiştirdiği üç büyük kelamcı olan **Bakıllanî**, **İbn Fürek** ve Ebû İshak el- **İsferayinî** mezhebe hizmet edenler arasında dikkat çeken ilk âlimlerdendir."},{"k":"li","x":"Kaynaklarda **Eşarîyye’nin ikinci kurucusu** olarak Ebu Bekir el-Bâkıllani gösterilmektedir. O, cevher, araz ve aded kavramlarına dayanarak Eş'arîyye'nin tabiat felsefesini geliştirmiş, haberi sıfatları te’vile tabi tutmaktan kaçınıp sübuti sıfatlar konusunda ahval teorisine meyletmiştir. Bakıllanî, **in'ikâs-ı edille** denilen 'delilin batıl- geçersiz olmasıyla ispat edilmek istenilen şeyin (medlûl) de batıl olması gerekir.' ilkesini benimsemiştir. İbn Fürek ise Müşkilü'l-Hadis gibi eserlerinde başta İsfahan ve Nişabur yöresi olmak üzere Eş'ariyye'yi doğudaki merkezlerde yaymıştır. **Abdülkâhir el-Bağdadi**, **Ebû Bekir el-Beyhakî** Eş'arîyye'nin üçüncü kuşağını teşkil eden âlimlerdir. **Kuşeyri**, Eş'arîyye'yi tasavvufa yaklaştıranlardandır. Bunlardan ayrı olarak Nizamiye Medresesi müderrislerinden **el-Cüveyni** (419 478/1085-1028) Eşariyye'nin gelişmesine katkıda bulunmuşlardır."},{"k":"li","x":"**Ebû Hâmid el-Gazzali** 'ye (450-505/1058-1111) gelinceye kadar Eş'arî kelamının bu dönemine **Mütekaddimîn Dönemi** denilmektedir. Bu dönemin kendine özgü bazı hususiyetleri şunlardır:"},{"k":"p","x":"**a**. Şekil, muhteva ve usul yönünden kendine özgü bir kelamdır."},{"k":"p","x":"**b**. Ana konular; varlık, Allah ve ahiret meseleleridir."},{"k":"p","x":"**c**. Metod olarak cedel metodu benimsenmiştir."},{"k":"p","x":"**d**. Mu'tezîle görüşleri çürütülmeye çalışılmış; Bâtıniyye gibi gruplarla da mücadele edilmiştir. **e**. Felsefeye yer verilmemiş, Aristo mantığı kabul edilmemiş, Kur'an mantığı benimsenmiştir. **f**. \"in'ikâs-ı edille” bir ilke kabul edilmiştir."},{"k":"li","x":"Eyyubîler'in ve Büyük Selçuklular'ın siyasi desteğini kazanan Eşarîler mezheplerini kolayca yayma imkânına kavuşmakla birlikte, Selçuklu Sultanı Tuğrul Bey döneminde Vezir el-Kundurî'nin Mu'tezili görüşleri benimsemesiyle sekteye uğramıştır. Alparslan'ın tahta geçip Kunduri'yi azletmesinden sonra Eşarîyye'ye yönelik baskılar sona ermiş, Vezir Nizâmülmülk tarafından Nizamiye medreseleri mezhebin yayılmasında önemli hizmetler görmüştür."},{"k":"li","x":"Gazzâlî ile Eşarîyye'nin **müteahhirin dönemi başladı** ve onunla kelam sisteminde köklü değişiklikler meydana geldi. Gazzâlî bir taraftan Makâsıdü'l-felasife ve Tehafütü'l-felâsife adlı eserleriyle Aristocu geleneği eleştirirken diğer taraftan Aristo mantığını İslamî ilimler arasına katarak, mantık bilmeyenin ilmine güvenilemeyeceğini savundu. Ayrıca kelam yöntemini benimsemesine rağmen nihai merhâlede gerçeğin keşf metoduyla bilinebileceğini kabul etti. Gazzâlî, Bakıllani'nin in’ikâs-ı edille ilkesini mantığa aykırı bulduğu için reddetti. Yazdığı \"İlcâmu'l-'Avâm 'an ilmi'l-Kelâm” adlı eserinde bu ilmin özellikle uzmanlık isteyen bir konu olduğu için uzmanlarca meşgul olunması gerektiğini, halk için selef yolunun daha güvenli olduğunu ileri sürdü. Bu dönemin ünlü isimlerinden **Şehristânî** Gazzâli’nin başlattığı felsefe-kelam ilişkilerini güçlendirip kelami meselelere felsefi açıklamalar getirdi. Bu dönemin önemli âlimlerinden biri de **Fahreddin er-Razi** 'dir (ö. 606/1210). O, felsefeyle kelamı birleştirerek felsefi kelam dönemini başlatmıştır. Seyfeddin **el-Amidi** (ö. 631/1233), **Kadi Beyzâvi** (ö. 685/1286), Adudüddin **el-İcî** (0.756/1355) Râzî'nin başlattığı felsefi kelam metodunu devam ettirmiştir."},{"k":"li","x":"Bundan sonra Sadeddin **et-Teftazani** (ö. 793/1390) ile mezhepte gerileme devri olarak değerlendirilen şerhçilik ve haşiyecilik dönemine girildi. Devrin ünlü şahsiyetlerinden **Seyyid Şerif el-Curcani** de (ö. 816/1413) Şerhu'l-Mevâkıf'ıyla bu çalışmalara katkıda bulundu."},{"k":"li","x":"Eş'arî kelamı hicri VIII. asır ortalarından itibaren cem, tahkik ve şerh türünden eserlerle felsefe ile birleştirilmiş kelam metoduna yönelmiştir. Yaklaşık altı asır kadar süren ve günümüze dek gelen bu döneme **Cem ve Tahkik Dönemi** denilmektedir. Bu dönemdeki çalışmalar eski çalışmalara şerhler, haşiyeler, ta'likler (notlar eklemek) yapmak veya özetlemek (telhis) ya da mevcut bir eseri yeniden düzenleyerek yazmak tarzında olmuştur."}]},{"h":"Eş'ariyye'nin Genel Görüşleri","b":[{"k":"p","x":"**1. Bilgi ve Varlık**: Bilginin kaynakları **duyular**, **akıl** ve **haber** den ibarettir. Sadece duyuların verdiği bilgiler eksik ve sınırlıdır. Akıl istidlal yoluyla teorik bilgiler üretebilir. Haberin kesin bilgi ifade edebilmesi için tevatür yoluyla gelmesi veya doğruluğu mucize ile kanıtlanmış bir peygamber tarafından bildirilmiş olması gerekir. **Eş'ariyye'nin tabiat felsefesi**, atomculuğa dayanır. Buna göre kâinat, özde farklı nitelikleri bulunmayan birbirine benzer (mütemâsil) cevherlerle değişik türlerden oluşan arazlardan meydana gelmiş olup hadistir; kadim ve aşkın bir muhdis tarafından asli bir unsur olmaksızın yaratılmıştır. Cevher ve arazların varlıklarını sürdürmeleri Allah’ın onları sürekli yaratmasına bağlıdır. Zira evrende ondan başka yaratıcı ve varlıklar üzerinde müessir olan bir fail yoktur."},{"k":"p","x":"**2. Allah'ın varlığı ve Sıfatları:** Eşarîyye âlimlerinin çoğunluğu, Allah'ın varlığına akıl yürütme yoluyla ulaşılabileceği ve bunun her yükümlü insan tarafından yapılması gerektiği kanaatindedir. Şayet insanda O'nun varlığına dair doğuştan mevcut zaruri bilgiler olsaydı, hiçbir kimse bu konuda tereddüt etmez, sonuç olarak herkes iman etmek zorunda kalırdı, Eş'ariyye kelamcıları mütekaddimin devrinde **hudus** deliline ağırlık verirken müteahhirin döneminde **imkân** delilini de kullanmışlardır. Gazzâli ve özellikle Fahreddin er-Râzi ise **gaye ve nizam** deliline ilgi göstermişlerdir. Eşarîyye âlimlerinin çoğunluğu, önemli bir ihtilaf konusu olan ilahî sıfatlar meselesine **“sıfât-ı meâni”** teorisiyle çözüm getirmeye çalışmışlardır. Şöyle ki: Naslarda Allah'ın hay, âlim, kadir, mürid olduğu bildirilmiştir. Duyular aleminde hay hayat sahibine, alim ilim sahibine, kadir kudreti olana, mürid iradesi bulunana denildiğine göre Allah'ın da hayat, ilim, kudret, irade kavramlarından (manalarından) ibaret olan sıfatları vardır. Bu kavramlar zata nispet etmeden O'nun hay, âlim vb. olduğunu söylemek kuru bir adlandırma niteliği taşır ki, böyle bir şey uluhiyyet makamı için caiz değildi r."},{"k":"p","x":"Eşarî kelamcılarının hemen hepsi ilahî sıfatların muhale değil mümkün olan şeylere taalluk ettiğini kabul eder. Bunlara göre **zatın ne aynı ne de gayri olan ilahi sıfatlar zat üzerine** zaid veya zatta mevcut olan manalardır."},{"k":"p","x":"Eş'arîler sıfatları **zatî, fiilî ve haberi** gruplarına ayırmıştır. Zatî sıfatlardan olan **kelamın** ezelî ve tek olduğu konusunda görüş birliği vardır. Harf ve sesler **lafzi kelamı** teşkil eder, nefsi kelam ise harf ve seslerin delalet ettiği manalardan ibarettir. **Buna göre Kur'an Allah kelami** olup lafzen mahluktur, lafızların delalet ettiği manalar ise Allah'ın zatı ile kaim olup kadimdir."},{"k":"p","x":"İttifakla Allah, **yarattıklarına benzemekten münezzehtir**, benzese muhdes yani yaratılmış olurdu. Kâinatın yaratıcısı ister üç boyutun kendisinde birleştiği nesne kastedilsin, isterse sadece cisim olarak isimlendirme kastedilsin **cisim değildir**. Cismin boyutları ve parçaları vardır. Oysaki Allah bir olup, cüzlerden meydana gelmiş değildir. Bu anlayışa bağlı olarak Eşarîler'in çoğunluğu vech, yed, istiva, nüzul gibi haberi sıfatlara ilişkin naslar mecaz kabul ederek zat, nimet veya kudret, hâkimiyet ve rahmet gibi manalarla tevil etmişlerdir"},{"k":"p","x":"Eş'arîyye âlimlerinin hemen hepsine göre fiili sıfatlar zat-ı ilahiyye ile kaim olmayıp hadistir, Yaratmak, rızık vermek, öldürmek, diriltmek vb. fiiller, ezelî olan-kudret sıfatının yaratıklara taallukuyla meydana gelir."},{"k":"p","x":"Kullar hakkında en uygun olanı (aslah) yaratmayı Allah için vacib gören Mu'tezile'ye karşı gösterdikleri tepkinin bir sonucu olarak ilahi fiillerin herhangi bir hikmet ve gayeye bağlı olmadığını ısrarla vurgulayıp irade sıfatını öne çıkarmışlar, böylece bir anlamda ilahi fiillerin hikmetsiz olabileceğini savunmuşlardır."},{"k":"p","x":"**3. Kader Meselesi ve İnsanın Fiilleri**: Eş'ari'ye göre kulun kudret ve fiilini yaratan Allah'tır, fiilin meydana gelişinde kula verilen hadis kudretin hiçbir etkisi yoktur. Kul, Allah tarafından yaratılan fiilin kendine ait hadis kudretle kısmen irtibatlı bulunduğu için sorumlu olur... Zira onlara göre bir eseri iki müessirin meydana getirmesi imkânsızdır. Öte taraftan kulların fiilleriyle ilgili anlayışlarına uygun olarak Eş'arîler'in çoğunluğu insanlara güç yetiremeyecekleri sorumluluklar yüklenmesini caiz görürken Cüveynî ve Gazzâli **“teklif-i mâ lâ yutak\"** ı muhal saymışlardır."},{"k":"p","x":"**4. Nübüvvet**: Eş'arîler'in nübüvveti ispat etmek için dayandıkları **en önemli delil mucizedir**. Çünkü mucize tabiatta hâkim bulunan kanunları aşan ilahî bir fiil olup peygamberin doğruluğunu tasdik eder. Allah'ın yalancı bir insanın elinde mucize yaratması vâki değildir. Gazzâli ve Râzî, nübüyvetin ispatı konusunda **mucizelerin yanı sıra akli ve sosyolojik delillere** de yer vermişlerdir. **Peygamberlerde bulunması gereken vasıflar** konusu Eş'arîler arasında tartışmalıdır. Onların yaşadıkları dönemin en akıllı insanlar olmaları, bedeni ve ruhi kusurlardan uzak bulunmaları gerektiği üzerinde görüş birliği varsa da **peygamberlerin cinsiyeti** noktasında farklı görüşler ileri sürülmüştür. Çoğunluk nebinin erkek olmasını zaruri görmemiş ve nazariyede kadınların da peygamber olabileceğine hükmedip Asiye, Meryem gibi bazı kadınların bu mertebeye ulaşmış bulunduklarını kabul etmiştir."},{"k":"p","x":"**5. Ahiret Ahvali**: Nasların haber verdiği berzaha ve ahiret hâllerine dair naslanın te’vil edilmeyip zahiri manada anlaşılması farzdır. Zira haber verilen hadiseler akıl açısından imkânsız değildir. Bunlar kabir imtihanı, oradaki azap veya nimet, kıyametin kopması, ölülerin cismani olarak dirilişi, haşir, hesap, mizan, sırat, cennet ve cehennem safhalarından ibarettir."},{"k":"p","x":"**6. İmamet:** Eşariyye'ye göre Müslümanların din ve dünya işlerini yürütecek bir kimseyi devlet başkanı olarak seçmeleri farzdır. **Başkanın ergenlik çağına girmiş, devlet işlerini yürütmeye ehil hür bir erkek olması şarttır.** Ayrıca Kureyş kabilesine mensup bulunması da teorik olarak öngörülmüş, fakat bu kabileden olmayan birçok devlet başkanı Eş'arî âlimlerince fiilen meşru kabul edilmiştir. Hz. Peygamber'in vefatından sonra sırasıyla devlet başkanlığına getirilen Hz. Ebû Bekir, Ömer, Osman ve Ali bu görevi meşru olarak elde etmişlerdir."}]},{"h":"Eş'arîlik ile Mâtürîdîlik Arasındaki Temel Farklar","b":[{"k":"p","x":"**1. Cüz’î İrade**: Mâturîdî müstakil bir cüz’i irade var. Eş’arîler müstakil değil, Allah yaratır."},{"k":"p","x":"**2. Kesb**: Mâturîdîler kesb, kulun bir şeye azim ve niyet etmesiyle o şeyin hasıl olmasıdır. Eş’arîler insanın gücünün, takdir edilenle birlikte olmasıdır."},{"k":"p","x":"**3. Husun ve Kubuh**: Mâturîdîler akılla bilinebilir. Eş’arîler bilinemez."},{"k":"p","x":"**4. Marifetullah**: Mâturîdîler dini tebliğat olmasa da insan Allah’ı bilmek zorundadır. Eş’arîler Allah’ı bilmek şer’an vaciptir."},{"k":"p","x":"**5. Tekvin**: Mâturîdîler müstakil sıfattır, Eş’arîler hakiki değil, itibaridir. kudret sıfatının taalluku. **6. Nübüvvet**: Mâturîdîler erkek olmak şart, Eş’arîlere kadın da peygamber olabilir."},{"k":"p","x":"**7. Teklif-i Ma La Yutak** (Güç Yetirilemeyenin Teklifi): Maturidi caiz değil, Eş’arîlere göre caizdir **8. Sebep Ve Hikmet:** Maturidi Allah'ın fiillerinin hikmeti var ve sebebe bağlı, Eş’arîleri hilafına. **9. Kelam-ı Nefsi:** Maturidi işitilemez, Eş’arîler işitilmesi caizdir."},{"k":"p","x":"**10. İbadet Mükellefiyeti**: Mâturîdîler, kafirler imanla mükelleftir, ibadetle değil. Eş’arîler, ikisiyle de mükelleftirler."},{"k":"p","x":"**11. İrtidat**: Matüridi, mürted yeniden iman ederse amelleri dönmez, Eş’arîler, döner."},{"k":"p","x":"**12. Tevbe-i Ye’s**: Mâturîdîler, makbul, Eş’arîler hilafına."},{"k":"p","x":"**13.** Mâturîdîler, iman artmaz ve eksilmez. Eş’arîlere göre ise iman artar ve eksilir."},{"k":"p","x":"**14.** Mâturîdîlere göre mümin muttaki kullar, büyük meleklerden efdaldir, Eş’arîler hilafına."},{"k":"p","x":"**15.** Mâturîdiler, fiillerin güzel veya çirkin oluşları aklen idrak edilebilir, Eşari nasslarla bilinir."},{"k":"p","x":"**d. Eş'ariyye'nin Yayıldığı Coğrafya**: Eş'arî mezhebi İslam dünyasının merkezi sayılan Irak'ta ortaya çıkmış ve zamanla Irak dışına taşmıştır. Doğuşunu takiben hemen her asırda Hanefîler'in itikadî mezhebi olan Matüridiyye ile at başı giden bu mezhep, daha çok Malikîlerin tamamı ve Şafiilerin büyük ekseriyeti tarafından kabul edilmiştir. Zamanımızda Ortadoğu'da, özellikle Irak, Suriye, Mısır, Kuzey Afrika ve Orta Afrika'da belirgin bir Eş'arî hâkimiyeti mevcuttur."}]},{"h":"Eş‘arî ve Eş‘arîlik: Genel Bilgi","b":[{"k":"p","x":"Ehl-i Sünnet-i Âmme'nin ikinci kolu olarak kabul edilen bu mezhebin kurucusu İmam Ebü'l-Hasan el-Eş'arî'dir (260-324/873-936). Mezhep, adını kurucusunun \"Eş'arî\" nispetinden almıştır."},{"k":"p","x":"Eş'ârîlik, ilahi sıfatlar, kulların fiilleri ile iman ve günah konularındaki görüşleri nedeniyle muhalifleri tarafından **Müsebbihe**, **Mücbire **(**Cebrîyye**) ve **Mürcie **gibi isimlerle anılmıştır."},{"k":"p","x":"Asıl adının Ebü'l-Hasan Ali b. İsmail b. Ebi Bişr İshak b. Salim el-Eş'arî el-Basrî olduğu ve Yemen'in Eş'ar kabilesine mensup Ebû Musa el-Eş'arî soyundan gelmesi sebebiyle bu nisbeyle anıldığı ifade edilmektedir. Ehl-i sünnet akîdesinin gelişip yayılmasına olan önemli katkılarından dolayı “**Nâsırüddin**” lakabıyla da anılır. Doğum tarihi hakkında farklı görüşler olmakla birlikte 260/873-874 yıllarında Basra'da doğduğu kabul edilmektedir. Küçük yaşta babasını kaybeden Ebü'l-Hasan el-Eş'arî, annesinin Basra Mu'tezilesi'nin önde gelen âlimlerinden Ebû Ali el-Cübbâî ile evlenmesinin ardından üvey babasının himayesinde yetişmiş ve kelam ilmini öğrenmiştir."},{"k":"p","x":"İmam Ebü'l-Hasan el-Eş'arî tarafından kurulan Eş'ârîlik, Ehl-i Sünnet'in önemli bir mezhebidir. Kurucusu başlangıçta Mu'tezile mezhebine bağlı iken, 300 (912-13) yılı civarında bir cuma günü Basra Camii’nde Mu‘tezile’den ayrılıp Ehl-i sünnet’e intisap ettiğini ve Ahmed b. Hanbel ile diğer hadis âlimlerince temsil edilen Selef itikadını benimsediğini açıkladı. Bu geçişi bazıları, rüyasında Hz. Peygamber'i görmesine ve onun Mu'tezile'nin doğru olmadığını belirtmesine bağlarken, bazıları da hocası el-Cübbâî ile aralarındaki \"üç kardeş meselesi\" tartışmasına bağlar. Bu gibi çeşitli nedenlere bağlanmakla birlikte, genellikle el-Eş'arî'nin hakikat arayışı ve kelâmî konulardaki derinleşen bilgisiyle açıklanır. Eş'ari, Bağdat'ta 324/935-936 yılında vefat etmiş ve burada defnedilmiştir."},{"k":"h","x":"Öne Çıkan Eserleri"},{"k":"li","x":"Risale ilâ Ehli’s-Seğr"},{"k":"li","x":"Makâlâtü’l-İslâmiyyîn"},{"k":"li","x":"el-İbâne ‘an Usûli’d-Diyâne"},{"k":"li","x":"el-Lüma‘ fi’r-Red ‘alâ Ehli’z-Zeyğ ve’l-Bida‘"},{"k":"li","x":"Risale fî İstihsâni’l-Havz fî İlmi’l-Kelâm"}]},{"h":"Eş‘arîliğin Gelişimi ve Önemli Temsilcileri","b":[{"k":"p","x":"Eş‘arîlik, 10. (X.) yüzyılın başında Basra kelam ekollerinden doğmuştur. Ebu'l-Hasan el-Eş‘arî tarafından, Mu‘tezile mensuplarının nakli ihmal edip itidal çizgisini aşan akılcı bir metot takip etmeleri, Abbasiler'in nüfuzundan faydalanarak inanç ve düşünce özgürlüğünü engellemeye çalışmaları, IV. (X.) yüzyılın başlarında köklü Sünni kelam mekteplerinin doğmasına zemin hazırlamış ve Eş‘arîliğin kurduğu mezhep de bunlardan birini teşkil etmiştir. Temel amacı, itikadi meseleleri akıl ilkeleriyle doğrulamak, nakil (ayet ve hadis) ile aklı uzlaştırmak ve Sünni kelamının baskın ekolü haline gelmektir. Mezhep, tasavvufu da bünyesine katmıştır."},{"k":"p","x":"**Ebu'l-Hasan el-Bahili ile İbn Mücahid et-Tâî’nin **yetiştirdiği üç büyük kelamcı olan **Bâkıllânî, İbn Fûrek **ve **Ebü İshâk el-İsferâyînî** mezhebe hizmet edenler arasında dikkat çeken ilk âlimlerdendir."},{"k":"li","x":"Ebu Bekir el-Bakıllânî: Eş'arîyye'nin **ikinci kurucusu **olarak görülür. Fiziğe (cevher-araz), ilahiyata (Allah'ın sıfatları) ve nübüvvete dair felsefesini geliştirmiş, kelam ilmine akıl ve Aristo mantığı prensiplerini dahil etmiştir. Öğrencileri aracılığıyla ekolün yayılmasına katkı sağlamıştır. Bâkıllânî, “**in'ikas-ı edille**” ilkesini benimsemiştir."},{"k":"li","x":"İbn Fürek: Bakıllânî ile ders vermiş, Eş'arî'nin sistemini eserleriyle \"Mücerred\", \"Şerhu'l-Âlim\" tamamlama yolunda adımlar atmıştır."},{"k":"li","x":"Ebû Abdullah el-Ezdî ve Ebû Tâhir el-Bağdâdî: Bakıllânî'nin öğrencileri olup, Eş'arîyye'yi Kuzey Afrika'ya taşımışlardır."},{"k":"li","x":"Abdulkahir el-Bağdâdî, Ebû Bekir el-Beyhakî ve Ebû İshak el-İsferâyinî: Eş'arîyye'nin üçüncü kuşağı/öncü şahsiyetlerindendirler. Başta İsfahan ve Nişabur olmak üzere çeşitli merkezlerde ekolü yaymışlardır. Abdulkahir el-Bağdâdî'nin \"Usûlü'd-din\", \"Fark beyne'l-fırak\" gibi önemli eserleri vardır. Beyhakî “Sünenü’l-Kübrâ” ve \"Şu'abi'l-Îmân\" eseriyle tanınırlar."},{"k":"li","x":"Ebu'l-Kâsım el-Kuşeyrî: \"er-Risâle\" adlı eseriyle Eş'arîyye'yi tasavvufla yakınlaştıran isimlerdendir."},{"k":"li","x":"İmamü'l-Harameyn el-Cüveynî (ö. 478/1085): Nizamiye Medreseleri'nin önemli hocalarındandır. \"el-Akîdetu'n-Nizâmiyye\", \"eş-Şâmil\" ve \"el-İrşâd\" gibi eserleriyle Eş'arîyye'nin gelişimine ve yayılmasına büyük katkı sağlamıştır."},{"k":"li","x":"Gazâlî: Gazâlî ile Eş‘arîyye’nin **mütehhirin** dönemi başladı. Eş'arî kelam sisteminde köklü değişiklikler başlatan merkezi figürdür. Mantığın bilgi için gerekliliğini savunmuş, bilginin keşf yoluyla da elde edilebileceğini kabul etmiştir. Bakıllânî ve Cüveynî gibi öncekilerin kullandığı bazı kelam yöntemlerini eleştirmiş, kelam ilminin halk için karmaşık olduğunu ve \"İlcâmü'l-'avâm 'an ilmi'l-kelâm\" adlı eseriyle bunu ortaya koymuştur. Eş'arîliğe tasavvufun kapılarını açmıştır."},{"k":"li","x":"İbn Tümer: Gazâlî'nin öğrencisi olarak gösterilir. Muvahhid Devleti'ni kurarak Eş'arîyye'yi Kuzey Afrika ve Endülüs'e yaymıştır."},{"k":"li","x":"Şehristânî: Gazâlî'nin başlattığı felsefe-kelam ilişkisini güçlendirmiştir. \"Nihayetü'l-ikdam fî'ilmi'l-kelâm\" ve dinler tarihi alanında ünlü \"el-Milel ve'n-nihal\" eserlerinin sahibidir."},{"k":"li","x":"Fahreddin er-Râzî: Müteahhirûn döneminin önde gelen ismidir. **Felsefe ile kelamı birleştirerek** \"felsefî kelam\" dönemini başlatmıştır. \"el-Muhassal\" gibi eserleriyle tanınır."},{"k":"li","x":"Seyfeddin el-Âmidî, Kâdî Beyzâvî ve Adudüddin el-Îcî: Râzî'nin başlattığı felsefî kelam metodunu eserleriyle devam ettirmişlerdir. Özellikle Beyzâvî'nin eserlerinin felsefeden etkilendiği belirtilir."},{"k":"li","x":"Sa'deddin et-Teftazânî ve Seyyid Şerif el-Cürcânî: Bu dönemde (bazılarına göre gerileme devri) etkili olmuş, daha çok **şerh ve haşiye** yazımına yönelmiş âlimlerdir. Teftazânî'nin Nesefî'nin Akâid'ine yazdığı şerh tipik örnektir."},{"k":"li","x":"Ahmed b. Yusuf es-Senûsî: Müteahhirûn döneminde Kuzey Afrika'da Eş'arîyye'yi temsil etmiş ve çeşitli risaleler kaleme almıştır."},{"k":"p","x":"Eyyûbîler ve Büyük Selçuklular'dan siyasi destek alan Eş'arîler kolayca yayılma imkânı bulmuşlardır. Ancak, Selçuklu Sultanı Tuğrul Bey döneminde Vezir Amidülmülk el-Kundurî'nin Mutezili görüşleri benimsemesiyle Eş'arîler yasaklanmış ve aralarında İmamü'l-Harameyn el-Cüveynî'nin de bulunduğu âlimler Hicaz'a sığınmak zorunda kalmıştır."},{"k":"p","x":"Bu baskı Alparslan'ın tahta geçip Kundurî'yi görevden almasıyla son bulmuştur. Daha sonra Vezir Nizâmülmülk'ün Nişabur ve Bağdat'ta kurduğu Nizamiye medreseleri, Eş'arî mezhebinin geniş alanlara yayılmasında önemli rol oynamıştır."}]},{"h":"Eş‘ariyye'nin Genel Görüşleri","b":[{"k":"h","x":"Bilgi ve Varlık"},{"k":"p","x":"Bilgi: Bilgi; duyular, akıl ve doğru haber (vahiy gibi) olmak üzere üç kaynaktan elde edilir. Akıl ve duyusal bilginin doğru haberle uyumlu olması esastır. Bilgi, doğruluğu şüphe götürmeyen zaruri ve nazar (düşünme) veya cedel (tartışma) yoluyla kazanılan iktisabî olmak üzere ikiye ayrılır. Akıl, dış dünyadan soyutlama yaparak bilgiyi oluşturur ve bu anlamda bilginin kendisi olarak da görülebilir."},{"k":"p","x":"Varlık ve Alem: Evren, bölünemeyen en küçük parçacıklar olan atomlardan (cüz/cevher) ve onlara eklenen, sadece bir an varlığını sürdürebilen değişen niteliklerden (araz) oluşur. Atomlar mahiyetçe birbirine benzerdir. Atomlar sonlu olduğu için evren de sonludur. Atomların kendi kendine birleşme gücü yoktur."},{"k":"p","x":"Allah ve Yaratma (Sürekli Yaratma): Evrendeki her şeyin varlığı, arazların sürekli yenilenmesi ve dolayısıyla cevherlerin varlıklarını sürdürmesi tamamen Allah'ın sürekli ve doğrudan yaratmasına bağlıdır. Evrende Allah'tan başka gerçek anlamda etkili (müessir) bir fail yoktur. Olaylar, cisimlerin kendi içsel güçleri veya zorunlu sebep-sonuç ilişkileriyle değil, doğrudan ilâhî irade ve kudretle, yani Allah'ın an be an yaratmasıyla gerçekleşir. Bu, Eş'arîliğin temel sürekli yaratıcılık (**halk-ı cedid**) prensibidir."},{"k":"h","x":"İlâhiyat"},{"k":"li","x":"Allah'ın Varlığının İspatı: Allah'ın varlığına doğuştan bilinen zaruri bilgiyle değil, akıl yürütme yoluyla ulaşılır. İnsanın yaratılışı, yaşamı ve ölümündeki kontrolsüzlük, her şeye gücü yeten bir yaratıcının (Allah'ın) varlığını zorunlu kılar.  Eş‘ariyye kelamcıları **mütekaddimin **devrinde **hudus **deliline ağırlık verirken **müteahhirin **döneminde klasik delillerle birlikte filozofların önem verdiği **imkân **delilini de kullanmışlardır. Gazâlî ve özellikle Fahreddin er-Râzi ise **gâye **ve **nizam** deliline ilgi göstermişlerdir."},{"k":"li","x":"Allah'ın **Sıfatları**:"},{"k":"p","x":"Cüveynî, Gazzâlî, Fahreddin er-Râzî, Kādî Beyzâvî gibi âlimler beşerî idrak seviyesini aştığından ilâhî zât ve sıfatların hakikatini akıl yürüterek bilmenin imkânsız olduğunu kabul ederken Bâkıllânî, Şehristânî, Îcî, Teftâzânî ve Cürcânî gibi âlimler yaratıkların niteliklerini dikkate alarak ilâhî varlığın yüce sıfatları bulunduğunu ve bunların hakikatinin kısmen de olsa bilinebileceğini savunmuşlardır. Eş'ariler'in taksimine göre sıfatlar zâtî, fiilî ve haberî gruplara ayrılmıştır."},{"k":"li","x":"Zâtî ve Sübûtî Sıfatlar (Ezelî Sıfatlar): Allah ilim, kudret, hayat, irade, kelam, sem' ve basar gibi ezelî sıfatlara sahiptir Âlim, Kadir, Hayy vb. olması bu sıfatların varlığını gösterir). Bu sıfatların bazıları fiilleri yoluyla, bazıları ise O'nun zâtının eksiklikten münezzeh olmasının gereği olarak akılla bilinir."},{"k":"li","x":"Fiilî Sıfatlar (Hâdis): Eş'ariyye alimlerinin hemen tamamına göre fiili sıfatlar zat-ı ilahiyye ile kaim olmayıp hadistir. Yaratma, rızık verme gibi fiillerine bağlı sıfatlar ezelî değildir; zira âlemin ezelî olmasını gerektirirdi ki bu imkânsızdır."},{"k":"li","x":"Nasslarda Geçen Lafızlar: Eş'ariler'in çoğunluğu vech, yed, istiva, nüzul gibi haberi sıfatlara ilişkin nasları mecaz kabul ederek zat, nimet veya kudret, hakimiyet ve rahmet gibi manalarla te'vil etmişlerdir."},{"k":"li","x":"Kelam Sıfatı: Allah'ın zâtında var olan kelam (kelam-ı nefsî) ezelîdir. Bu kelamı ifade eden lafızlar (Kur'an lafızları gibi) ise sonradan yaratılmıştır."},{"k":"li","x":"Allah'ın İlim ve İradesi: Allah'ın ilmi sabittir, varlıkları yaratmadan önceki bilgisi ile sonraki bilgisi aynıdır. Allah'ın iradesi mutlaktır (küllî) ve evrendeki tüm varlıkları ve olayları kuşatır; kulların fiilleri de ilâhî iradeye göre gerçekleşir."},{"k":"li","x":"Kulların Fiilleri ve Sorumluluk (Kesb): Kul fiilini, Allah'ın dileyip yarattığı sonradan kazanılmış bir güçle (kudret-i hâdise) yapar. Kul, bu güçle fiili gerçekleştirdiği için sorumlu olur. Kulun fiilinin niteliğini tamamen belirleyememesi (iyi yapmak isterken kötü olabilmesi), onun fiilinin ilâhî iradeye bağlı olduğunu gösterir. Bâkıllânî, Ebû İshak el-İsferâyînî ve Cüveynî Eş‘arî’nin cebre yaklaşan tutumunu isabetsiz bularak konuya kulun sorumluluğuyla uyum sağlayacak bir çözüm getirmeye çalışmışlardır. Eş‘arî’nin aksine Bâkıllânî kulun hâdis kudretinin fiil üzerinde etkili olduğunu kabul etmiştir."},{"k":"li","x":"İlâhî Fiillerde Hikmet ve Adalet: Allah'ın tüm fiilleri hikmet ve adalet içerir, ancak bunlar O'nun iradesine göre gerçekleşir. Allah'ın fiillerinde O'nun için menfaat elde etme veya zarar giderme gibi bir amaç aranmaz. Hiçbir şey Allah için vâcip (zorunlu) değildir. İlâhî fiillerin herhangi bir hikmet ve gayeye bağlı olmadığını ısrarla vurgulayıp irade sıfatını öne çıkarmışlar, böylece bir anlamda ilahi fiillerin hikmetsiz olabileceğini savunmuşlardır."},{"k":"li","x":"**Teklîf-i Mâ Lâ Yutâk**: Eş'ariler'in çoğunluğu insanlara güç yetiremeyecekleri sorumluluklar yüklenmesini caiz görürken Cüveyni, Gazzali ve İbnu Dakîkul’îd  \"**Teklîf-i Mâ Lâ Yutâk**''ı muhal saymışlardır."},{"k":"li","x":"İsimler ve Rü'yet: Allah'a isim verilmesi sadece nasla belirlenir. Eş‘arîler ise rü’yetullahın sadece naklî delille ispat edilebileceğini, bu husustaki aklî delilin ileri sürülen itirazları ortadan kaldıracak nitelikte olmadığını düşünmüşlerdir. Zira duyular âleminde görülen bütün nesneler var olma vasfı yanında yaratılmış olma niteliğine de sahiptir. Allah ise yaratılmış bir varlık olmadığından görülmenin keyfiyeti konusunda Allah’ı görülebilen diğer varlıklardan farklı düşünmek gerekir. **Görülme sebebini var oluşla değil mahlûk oluşla da açıklamak mümkündür**."},{"k":"h","x":"Nübüvvet"},{"k":"li","x":"Seçim ve Görev: Allah, peygamberleri yalnızca rahmetinin gereği olarak seçer. Resuller ilâhî emirleri tebliğle yükümlü iken, nebîlerin böyle bir zorunluluğu yoktur; bu nedenle kadınlardan da nebî seçildiği belirtilir."},{"k":"li","x":"Nübüvvetin Delilleri: Eş‘arilerin nübüvveti ispat etmede en önemli delilin mucize olduğunu savunurlar.  Gazâlî ve Râzî, nübüvvetin ispatı konusunda mucizelerin yanı sıra akli ve sosyolojik delillere de yer vermişlerdir. Bir peygamberin doğruluğu, kendisinden önceki peygamber tarafından haber verilmesi veya insanlarda davranışları ve öğretilerinin yol göstericiliği sayesinde oluşan zaruri bir bilgiyle anlaşılır."},{"k":"li","x":"Hz. Peygamber ve Kur'an: Hz. Peygamber'in peygamberliğinin en büyük delili, ümmî olmasına rağmen Kur'an gibi eşsiz bir kitap getirmesidir. Kur'an'ın nazım güzelliği, zengin içeriği, gayb haberleri ve tutarsızlıktan uzaklığı onun ilahi kaynaklı olduğunu kanıtlar."},{"k":"li","x":"İsmet: Bâkıllânî dışındaki âlimlere göre peygamberler nübüvvetten önce küfürden ve büyük günah işlemekten korunmuşlardır. Bâkıllânî ise nübüvvetten önce bu tür günahları işleyen bir kimsenin bile nübüvvetle görevlendirilebileceğini savunmuştur. Nübüvvetten sonra ise yanılarak (bazılarına göre kasten de olabilir) bazı küçük günahlar işleyebilirler."},{"k":"h","x":"Ahiret"},{"k":"li","x":"Bilgi Kaynağı ve Aklın Rolü: Âhiret hallerine dair bilgi edinmenin tek yolu nakildir. Ancak akıl, bu hallerin varlığının mümkün olduğunu kabul eder."},{"k":"li","x":"Aklen Mümkün Olan Durumlar: Kabirlerdeki cesetlere dünyadaki amellere göre acı veya mutluluk hissettirecek bir hayat verilmesi ve ölmüş bir canlının ikinci defa yaratılması aklen imkânsız değildir."},{"k":"li","x":"Ruhun Ölüp-**Ölmemesi:** Eş'arîler arasında farklı görüşler bulunur. Bazı erken dönem yorumları ruhun bedenle birlikte öldüğünü veya ruhun bedenden ayrı ancak kabir hayatının bedenle ilgili olduğunu düşünürken, Cüveynî ve Gazzâlî'den itibaren ruhun bedenden ayrı bir varlık olduğu ve ölümden sonra hayatına devam ettiği görüşü baskın hale gelmiştir. Bununla birlikte, bir görüşe göre ruh berzahta kalsa da kıyamet koparken yok olacak ve dirilişte yeniden yaratılacaktır."},{"k":"h","x":"İman ve Günah"},{"k":"li","x":"İman: İman, yalnızca Hz. Muhammed'in hak peygamber olduğunu **kalben tasdik etmekten ibarettir**. İnancı dil ile ikrar ve dini görevleri yerine getirmek, imanın tanımına dahil değildir."},{"k":"li","x":"Günah: İlâhî emirlere aykırı her davranış günahtır (büyük günah olarak nitelenir). Günahın büyüklüğü görecelidir. Kötülükler iyiliklerin sevabını yok etmez (ihbât anlayışı reddedilir)."},{"k":"h","x":"İmâmet"},{"k":"p","x":"İmâmet: Eş'arîlere göre Müslümanların işlerini yürütecek bir halifenin ehlü'l-hal ve'l-akd tarafından seçilmesi zorunludur. Şiîlerin iddia ettiği gibi halifenin nas ile tayin edildiğine dair bir delil yoktur. Halife gaybı bilemez ve masum değildir. Hz. Ali ile muhalifleri arasındaki çatışmalarda Ali haklı, muhalifleri ise hatalı görülmüştür."}]},{"h":"Eş‘arî'ye Yöneltilen Eleştiriler","b":[{"k":"p","x":"Eş‘arî’nin kelâmî sistemi çeşitli âlimler tarafından farklı yönlerden eleştirilmiştir. Bu eleştirilerden bazıları kişisel kanaatlere dayanırken, bazıları mezhepler arası fikrî ayrılıklardan kaynaklanmaktadır:"},{"k":"li","x":"Hasan b. Ali el-Ahvâzî, Mesâlibü İbn Ebî Bişr el-Eşʿarî adlı eserinde Eş‘arî’yi mülhidlikle itham etmiş, ancak bu suçlamalar temelsiz ve tutarsız bulunmuştur. Bu ithamlara Ebü’l-Kāsım İbn Asâkir, Tebyînü kezibi’l-müfterî adlı eseriyle cevap vermiştir."},{"k":"li","x":"Kâdî Abdülcebbâr, Mu‘tezile mezhebinin bir temsilcisi olarak, Eş‘arî’yi daha çok Ehl-i Sünnet ile Mu‘tezile arasındaki temel inanç farklılıkları üzerinden eleştirmiştir."},{"k":"li","x":"İbrâhim b. Muhammed b. Ayyâş, Eş‘arî’nin usule dair eserine Nakzu İbn Ebî Bişr fî Îzâhi’l-burhân adlı reddiyesiyle karşı çıkmıştır."},{"k":"li","x":"İbn Hazm, Eş‘arî’nin görüşlerini eksik anlamasından kaynaklanan tenkitlerde bulunmuştur. Örneğin, Eş‘arî’nin sadece Allah’a iman edenleri mümin saydığı iddiası, Eş‘arî’nin aslında naslar olmadığında bunun aklen mümkün olabileceğini söylemesiyle çelişmektedir. Ayrıca, Allah’a ezelî sıfatlar nispet etmesine dair eleştirisi de geçersizdir, çünkü aynı görüşü kendisi de benimsemiştir."},{"k":"li","x":"İbn Teymiyye, genel olarak kelâm metoduna karşı çıkarken Eş‘arî’yi de bu eleştirilerine dahil etmiştir."},{"k":"li","x":"Bazı Mâtürîdî âlimleri ise Eş‘arî’yi Allah’ın fiilî sıfatlarını hâdis kabul etmesi ve bazı kadınların nebî olduğunu ileri sürmesi gibi meselelerde eleştirmiştir."}]},{"h":"Kavramlar ve Hızlı Tekrar","b":[{"k":"d","t":"Kesb","x":"Allah'ın yarattığı fiili kulun hâdis kudretiyle kazanması; Eş'arî'ye göre bu kudretin fiilde etkisi yoktur."},{"k":"d","t":"İhve-i selâse","x":"Üç kardeş meselesi; Eş'arî'nin hocası Cübbâî ile tartışıp Mu'tezile'den ayrılmasına yol açan örnek."},{"k":"d","t":"Kelâm-ı nefsî","x":"Allah'ın zatıyla kaim ezelî kelamı; harf ve seslerden oluşan lafzî kelamdan ayrılır."},{"k":"d","t":"Makâlâtü'l-İslâmiyyîn","x":"Eş'arî'nin mezhepler tarihinin temel kaynaklarından olan eseri."},{"k":"d","t":"Mütekaddimûn dönemi","x":"Gazzâlî'ye kadar süren, cedel metodunu benimseyip felsefeye mesafeli duran ilk Eş'arî dönemi."},{"k":"d","t":"Müteahhirûn dönemi","x":"Gazzâlî ile başlayan, mantık ve felsefenin kelâma girdiği dönem."}]}],"ht":[{"s":9,"x":"Eş'arî (260-324/873-936) kırk yaşlarında Mu'tezile'den ayrıldı; el-İbâne, el-Lüma' ve Makâlâtü'l-İslâmiyyîn başlıca eserleridir."},{"s":9,"x":"Eş'arîliğin ikinci kurucusu Bâkıllânî'dir; Gazzâlî ile müteahhirûn, Teftâzânî ile şerh-haşiye dönemi başlar."},{"s":9,"x":"Eş'arîlere göre sıfatlar zatın ne aynı ne gayrıdır; fiilî sıfatlar hâdistir; Allah'ın fiilleri gayeye bağlı değildir."},{"s":9,"x":"Mâtürîdîlikten farklar: hüsün-kubh şer'le bilinir, teklîf-i mâ lâ yutâk caizdir, iman artar ve eksilir, tekvin ayrı sıfat değildir."}],"oz":{"t":"Eş'ariyye · Özet","intro":"Ünitenin özü: Eş'arî kimdir, Mu'tezile'den neden ayrıldı, Eş'arîlik nasıl gelişti, neyi savunur ve Mâtürîdîlikten nerede ayrılır?","s":[{"h":"Ebü'l-Hasan el-Eş'arî","b":[{"k":"li","x":"**Ebü'l-Hasan Ali b. İsmail el-Eş'arî** (260-324/873-936), sahabi Ebû Mûsâ el-Eş'arî'nin soyundandır; Basra'da doğdu, Bağdat'ta öldü."},{"k":"li","x":"Uzun süre Mu'tezilî **Ebû Ali el-Cübbâî**'nin öğrencisi oldu. 300/912 civarında Basra Camii'nde Mu'tezile'den ayrıldığını ve Ahmed b. Hanbel'in yolunu benimsediğini ilan etti."},{"k":"li","x":"Ayrılığın meşhur gerekçesi **\"üç kardeş\" (ihve-i selâse)** tartışmasıdır: Mümin, kâfir ve küçük yaşta ölen üç kardeşin âhiretteki durumu sorulduğunda \"aslah\" ilkesinin tutarsızlığı ortaya çıkmıştır."},{"k":"li","x":"**Eserleri:** **Makâlâtü'l-İslâmiyyîn** (mezhepler tarihinin temel kaynaklarından), **el-İbâne** (Hanbelî çizgiye yakın), **el-Lüma'** (kelâm sisteminin ana eseri), **İstihsânü'l-havz fî ilmi'l-kelâm** (kelâmı savunan risale)."}]},{"h":"Eş'arîliğin Gelişimi","b":[{"k":"tbl","r":[["Dönem","Temsilciler","Özelliği"],["Mütekaddimûn","Bâkıllânî (\"ikinci kurucu\"), İbn Fûrek, Ebû İshak el-İsferâyînî, Abdülkāhir el-Bağdâdî, Cüveynî","Cevher-araz anlayışı, cedel metodu; felsefe ve Aristo mantığına mesafe"],["Müteahhirûn","Gazzâlî, Şehristânî, Fahreddin er-Râzî, Âmidî, Beyzâvî, Îcî","Mantık ve felsefenin kelâma girmesi; \"felsefî kelâm\""],["Şerh-haşiye","Teftâzânî, Seyyid Şerîf el-Cürcânî, Senûsî","Şerh ve haşiye geleneği"]]},{"k":"not","x":"Eş'arîlik Selçuklular ve Eyyûbîlerin desteğiyle yayıldı; Tuğrul Bey döneminde Vezir Kündürî'nin baskısıyla sekteye uğradı, Alparslan ve Nizâmülmülk'ün Nizâmiye medreseleriyle güçlendi. Muvahhidler (İbn Tûmert) eliyle Kuzey Afrika ve Endülüs'e yayıldı."}]},{"h":"Temel Görüşleri","b":[{"k":"li","x":"**Bilgi:** Duyular, akıl ve haber; akıl nakle hizmet eder."},{"k":"li","x":"**Sıfatlar:** Sıfatlar \"zatın ne aynı ne gayrı\"dır. Zatî sıfatlar ezelî; **fiilî sıfatlar hâdistir** (kudretin taallukudur). Haberî sıfatlar (yed, vech, istivâ) erken dönemde te'vilsiz, sonra te'vil yoluyla açıklanmıştır. **Kelâm-ı nefsî** ezelî, lafızlar hâdistir."},{"k":"li","x":"**Kader ve fiiller:** Fiili yaratan Allah'tır; kulun hâdis kudretinin fiilde etkisi yoktur, kul fiili **kesbeder**."},{"k":"li","x":"**Allah'ın fiilleri:** Hikmet ve gayeye bağlı değildir; Allah'a hiçbir şey vacip değildir."},{"k":"li","x":"**Nübüvvet:** En önemli delil mucizedir."},{"k":"li","x":"**Âhiret:** Kabir ve âhiret halleri zahirî anlamıyla kabul edilir."},{"k":"li","x":"**İman:** Kalple tasdiktir."},{"k":"li","x":"**İmamet:** İmam seçmek farzdır; ehlü'l-hal ve'l-akd tarafından seçilir, Kureyşli olması şarttır."}]},{"h":"Eş'arîlik ile Mâtürîdîlik","b":[{"k":"tbl","r":[["Konu","Mâtürîdîlik","Eş'arîlik"],["Cüz'î irade","Müstakildir","Müstakil değildir"],["Hüsün-kubh","Akılla bilinebilir","Ancak şer'le bilinir"],["Ma'rifetullah","Tebliğ olmasa da akılla vaciptir","Şer'an vaciptir"],["Tekvin","Ezelî, müstakil sıfattır","Kudretin taallukudur"],["Teklîf-i mâ lâ yutâk","Caiz değildir","Caizdir"],["İman","Artmaz, eksilmez","Artar ve eksilir"],["Mürtedin amelleri","Tekrar iman edince geri dönmez","Geri döner"],["Kadın peygamber","Olamaz","Olabilir"]]},{"k":"p","x":"Eş'arîlik Irak'ta doğmuş; Şâfiî ve Mâlikî çevrelerde, Hicaz, Mısır, Şam ve Kuzey Afrika'da yaygınlaşmıştır."}]}]}},{"t":"Hâricîlik ve İbâdiyye","intro":"Hâricîliğin adı, doğuşu, tarihi, fırkaları ve ortak görüşleri; İbâziyye'nin kuruluşu, tarihçesi, imamet anlayışı, dokuz ilkesi ve günümüzdeki durumu.","s":[{"h":"Hâricîlik: İsimlendirme","b":[{"k":"p","x":"**1. İsimlendirme Meselesi:** Haricî, sözlükte \"ayrılan, isyan eden, karşı çıkan ve saf değiştiren\" anlamında olup çoğulu \"Havaric” şeklindedir. \"Harici\" ismi, muhalifleri tarafından verilmiş bir isim olup; “insanlardan, dinden, haktan veya Hz. Ali'den uzaklaşan ve yönetime karşı ayaklanarak cemaatten çıkanlar” anlamı kastedilerek tesmiye edilmiştir. Aslında bu tanımlama, ümmetin üzerinde ittifak ettiği herhangi bir halifeye başkaldıran herkes için kullanılan bir sıfattır. Başlangıçta bu ismi kabul etmeyen Hariciler üzerlerinden atamayacaklarını anladıktan sonra \"Harici\" kelimesini kendi arzuları doğrultusunda tanımlamaya çalıştılar. Bu bağlamda “Kâfirlerin arasından çıkarak Allah'a ve Peygamberine hicret edenler.” (Nisa 4/100) ayetinde tasvir edilen “Hariciler\" olduklarını ileri sürdüler. Ancak Hariciler, kendileri için daha çok sözlükte \"satan- satıcı\" anlamına gelen “şâri/şurât\" adının kullanılmasını tercih etmişlerdir. Onlar, “İnsanlardan bir kısmı Allah'ın rızasını talep ederek kendi nefislerini satarlar.” (Bakara 2/207)"},{"k":"p","x":"Mualifleri tarafından Hariciler hakkında kullanılmış diğer bir isim de \"dinden çıkmış\" anlamında “Mârika\" dır. Ayrıca Sıffin Savaşı sırasında Allah'tan başka hiç kimsenin hüküm veremeyeceğini iddia ettiklerinden dolayı bunlara “Muhakkime\" ya da \"Muhakkime-i üla\"; Hz. Ali'den ayrılıp Harura denilen yerde karargâh kurdukları için bu yere nispetle \"Harûriyye\"; burada Abdullah b. Vehb er-Râsibiyi kendilerine lider seçtiklerinden dolayı “Vehbiyye\" veya \" Rasibiyye” diye de isimlendirilmişlerdir."}]},{"h":"Hariciliğin Doğuşu ve Teşekkül Süreci","b":[{"k":"li","x":"**Hilafet meselesi**: İslam toplumunda ilk anlaşmazlıklar devlet başkanlığı konusunda ortaya çıktı. Hz. Osman zamanında siyasi, sosyal, ekonomik ve kültürel yapıda meydana gelen değişiklikler gerek Medine ve gerekse diğer eyaletlerde yönetimden rahatsız olanların sayısını artırdı. Nihayetinde görevini bırakması için halifeyi haftalarca kuşatma altında tutup ölümle tehdit ettiler. Hz. Osman'ın (r.a.) şehit edilmesinin ardından Hz. Ali (r.a.) hilafet makamına geldi. Ancak o da, Müslümanların bir liğini sağlayacak imkânlara ulaşamadı. Hz. Muaviye, Hz. Osman'ın ölümünden Hz. Ali'yi sorumlu tutarak ona biat etmedi. Bunun akabinde Hz. Ali, ümmetin birlik ve beraberliğini sağlamak amacıyla kendisine itaat etmeleri için Şamlılar üzerine yürüme kararı aldı. Cemel ve arkasından Sıffin Savaşına uzanan olaylar silsilesi baş gösterdi. Böylece Müslümanlar arasında mevcut olan birlik ve beraberlik bozuldu, siyasi açıdan bir otorite boşluğu ortaya çıktı. İşte Hariciliğin ortaya çıkışında, bu bunalımlı dönemin ve buna bağlı otoriter idare arayışının etkileri söz konusudur."},{"k":"li","x":"**Sosyal değişim ve şehirleşme**: Öte taraftan Hariciliğin ortaya çıkmasında sosyal değişimin ve özellikle şehirleşme sürecinin etkili olduğu da görülür. Haricilerin, daha çok, önceleri çölde bedevi bir hayat sürerken İslam'ı kabul ettikten sonra yavaş yavaş yerleşik hayata geçen kabileler arasından çıktıkları bilinmektedir. Bu insanlar yerleşik hayata geçmekle, sadece hayat tarzlarını değiştirmiş olmuyorlardı. Çölde tabiat şartlarının belirlediği kontrolsüz özgürlük, yerini dinden, değerlerden ve yerleşik hayattan kaynaklanan bir disipline bırakmıştı. Bu hızlı değişime yeterince ayak uyduramayıp ilk tepkiyi verenler Hariciler olmuştur."},{"k":"li","x":"**Mekkelilerin otoritesini kabul etmeme**: Söz konusu kabilelerin Hz. Peygamber'in vefatından hemen sonra Kureyş'in hâkimiyetine cephe almalarını ve Hz. Ebû Bekir'e zekât vermeyeceklerini açıklamalarını bu arka planla birlikte düşünmek faydalı olacaktır."},{"k":"li","x":"**Sosyal ve kültürel seviyeleri**: Çoğunluğu bedevi Arap kabilelerinden oluşan, dinî düşüncelerini kabile taassubunun etkisi altında ve genellikle sertlik temayülü içinde nassların zahirine dayandıran Hariciler, kendi taraftarları arasında bile birlik sağlayamamış ve birbirlerini tekfire yönelmişlerdir. Bu sebeple Harici ruhu; haşin, isyankâr ve çevresine uyum sağlayamayan bir insan tipinin simgesi olarak telakki edilmiştir."},{"k":"li","x":"**Bedevi hayar tarzı**: Bedevi hayat, bir arada yaşayan bireylerin, her şartta birbirlerine güvenmelerini gerektiriyordu. Kendilerinden yana olmayanları düşman olarak kabul ediyorlar; renkleri siyah ve beyazdan ibaret görüp dost-düşman tanımlamasını bu çerçevede yapıyorlardı."},{"k":"p","x":"**3. Haricîlerin Tarihi:** Silsile halinde aktaralım:"},{"k":"li","x":"Cemel Savaşından sonra Küfe'ye giderek ülkeyi buradan yönetmeye başlayan Hz. Ali, Müslümanların siyasi birliğini sağlamak için Hz. Muaviye'yi bir kere daha kendisine biat etmeye çağırmıştı. Hz. Osman'ın haksız yere öldürüldüğü ve katillerinin cezalandırılması gerektiği konusunda Şamlıların desteğini alan Hz. Muaviye, biat çağrısını kabul etmeyince savaş kaçınılmaz hale gelmişti. 36 yılı sonlarında Hz. Muaviye idaresindeki Şam ordusu ile Hz. Ali idaresindeki Irak ordusu Sıffin ovasında karşı karşıya geldi."},{"k":"li","x":"Her iki taraf, sonucundan korktukları için küçük çaplı çatışmalar dışında uzun süre toplu hücuma geçmediler, görüşmeler yoluyla sorunun hallini beklediler. Ne var ki Hz. Muaviye ve Şamlılar, ordularda bulunan asker sayısının birbirine yakın olmasından da cesaret alarak haklı olduklarında ısrar edip, halifenin banş ve biat çağrılarını reddettiler ve meydan savaşlarını başlattılar."},{"k":"li","x":"10 Safer 37 (28 Temmuz 657) Cuma günü üstünlüğün Hz. Ali tarafına geçtiğini gören Hz. Muaviye, Amr b. el-As'ın teklifiyle askerlerine yanlarında bulunan Kur'an sayfalarını havaya kaldırarak, Iraklılan Kur'an'ın hükmüne çağırmalarını emretti. İbnü'l-As'ın teklifi Hz. Ali'nin askerleri arasında bedevi kökenli olan kimseler üzerinde etkili oldu."},{"k":"li","x":"Hz. Ali, askerlerine savaşmakta haklı olduklarını, bu çağrıdan etkilenmemelerini, savaşarak sonuç alıncaya kadar çatışmaya devam etmelerini; savaşı kazanmak amacıyla mushafları hile ile kaldırdıklarını söyleyerek onları ikna etmeye çalıştı."},{"k":"li","x":"Ancak Eş'as b. Kays’ın liderliğini yaptığı bir grup insan, \" Biz Kur'an'a karşı savaşmayız.\" diyerek savaşı bırakması için Hz. Ali'yi hakem tayinine zorladı."},{"k":"li","x":"Ancak hakemlerin kararını açıklaması üzerine, buna karşı çıktılar. Özellikle Temim kabilesine mensup olan askerlerin pek çoğu, \" Hüküm ancak Allah'a aittir.\" sloganıyla hakemlerin kararını tanımayacaklarını açıklamışlardı."},{"k":"li","x":"Hz. Ali'nin bütün gayretlerine rağmen tahkime gidilmesinde ısrar eden bu kişiler pişmanlık duymaya başlamıştı. Bunun üzerine anlaşmayı bozması ve tövbe ederek tahkimi reddetmesi hususunda halifeyi ikna etmeye çalıştılar."},{"k":"li","x":"Ancak Halife, verdiği sözden dönmeyeceğini bildirmişti. Daha önce Hz. Ali'yi tahkime zorlayan bu grup, hakem tayinini kabul ettiği için onu suçlayarak ordudan ayrıldılar."},{"k":"h","x":"Haricilerin Hz. Ali'den Ayrılmaları"},{"k":"li","x":"Savaş durduktan sonra anlaşmazlığın, Kur'an hükümlerine göre tarafların tayin edecekleri hakemlerce çözülmesi önerisi kabul edilmişti. Bunun üzerine Iraklı askerler, siyasi tecrübesiyle tarafsız davranacağına ve barışı sağlayacağına inandıklan Ebû Musa'yı hakem olarak teklif etmişlerdi. Muhtemelen onlar bu seçimi yaptıkları sırada Hz. Muaviye'nin kimi hakem seçtiğini bilmiyorlardı. O, kendisini savunması için sağ kolu mertebesindeki komutanı ve aynı zamanda Arapların dâhilerinden olan Amr b. As'ı hakem olarak tayin etmişti. İşte bu durum, Harici diye isimlendirilecek zümreyi şoke eden ilk gelişme olmuştu."},{"k":"li","x":"İkinci şaşkınlık, tahkimname metninin yazılması aşamasında meydana gelmiştir. Antlaşmanın kimler arasında yapıldığı yazılırken, Şamlılar Hz. Ali'nin Emîru'l-Mu'minin sıfatıyla anılmasına karşı çıkmıştı. Böylece Iraklılar, Şamlıların isyancı konumunda olmayı sürdürdüklerini öğrenmiş oldular. Hz. Ali, Emîru'l-Mü'minin sıfatının yazılması için ısrar ettiyse de ordusundaki barışı isteyenlerin baskısıyla geri adım atmış, sadece kendisine tabi olanların lideri olarak anılmasına razı olmuş ve böylece Hz. Muaviye ile eşit şartlarda olduğunu kabul etmiştir."},{"k":"li","x":"Neticede tahkimname metni yazılmadan önce bütün Müslümanların tek halifesi bulunurken, tahkimname ile bu durum değişmiş, Müslümanların iki ayrı lidere bağlı iki siyasi grup olduğu kabul edilerek tüm Müslümanların liderinin kim olacağı hakemlerin kararına bırakılmıştır."},{"k":"li","x":"Başlangıçta Kur'an'ın hakem olması için Hz. Ali'yi zorlayan grup, Şamlıların tutumlarının değişmediğini anlayarak yanıldıklarını kabul etmiş, tövbe edip Hz. Ali'yi anlaşmadan vazgeçirip tekrar savaşmaya ikna etmeye çalışmışlardı. Ancak Hz. Ali, Şamlılar ile yazışma yapıldığını, verdiği sözden asla dönmeyeceğini belirterek onların tekliflerini geri çevirmişti. Bunun akabinde Hz. Ali'yi bu anlaşmadan döndürmek için çabalayan bir kısım Iraklı askerler, Kûfe'ye girmeyip Harura'ya çekilmişlerdir."},{"k":"li","x":"Hz. Ali, onlarla görüşmesi ve onları ikna etmesi için Abdullah b. Abbas'ı görevlendirdi. Ancak İbn Abbas, onları ikna etmede başarılı olamadı. Bunun üzerine Hz. Ali karargâhlarına kadar bizzat giderek liderleri İbnü'l-Kevvâ ile bir görüşme yaptı. Bu görüşmenin sonunda İbnü'l-Kevvâ da dâhil olmak üzere yaklaşık 6000 kişi, halifenin tahkimden caydığını sanarak onunla birlikte Kûfe'ye gittilerse de Hz. Ali tahkimden caymadığını söyleyince büyük bir kısmı geri döndüler. Kendilerine Abdullah b. Vehb er- Râsibi'yi emir seçtiler ve gizlice Kûfe'den ayrılıp Bağdat ile Vâsit arasındaki Nehrevan kasabasında toplandılar."},{"k":"li","x":"Ezruh'ta bir araya gelen hakemler, Hz. Osman'ın mazlum olarak öldürüldüğünü kabul ettiler, ancak kimin halife olacağı konusunda anlaşamadılar (37/658). Hakemlerin bu kararını öğrenen Hz. Ali, Kûfe'de halka bir konuşma yaparak taraflarca tayin edilen hakemlerin, Kur'an hükmünü ve sünneti bir tarafa atarak kendi keyiflerince karar verdiklerini, dolayısıyla artık isyancı durumunda olan Şamlılarla savaşmaya hazırlanmalarını istedi. Hz. Ali, Haricîlere mektup yazarak onların başlangıçtan beri istedikleri noktaya geldiklerini, artık birlikte Şam üzerine gidebileceklerini bildirmiştir. Ancak onlar, bunu kişisel çıkan için istediğini söyleyerek reddetmişlerdir."},{"k":"li","x":"Bu süreçte tutumlarni sertleştiren Haricîler, sahabeden Abdullah b. Habbab b. Eret'i ve hamile karısını öldürdüler. Hz. Muaviye ve Hz. Ali'yi tekfir etmeyenin kafir olduğunu ve bu sebeple öldürülmesi gerektiğini iddia ettiler."},{"k":"li","x":"Bu sebeplerden dolayı Hz. Ali onların üzerine gitmeye karar verdi. 17 Temmuz 658'de Nehrevan'da yapılan savaşta Haricîlerin tamamına yakını katledildi. Buradan kurtulup Nuhayle'ye çekilen Hariciler de geri dönmeyi kabul etmeyince aynı şekilde kılıçtan geçirildi."},{"k":"li","x":"Ancak savaştan kaçıp kurtulan bazı Hariciler, Hz. Ali'yi savaş meydanında yenemeyeceklerini anlayınca ona suikast düzenlemeye karar verdiler. Sonuçta Hz. Ali, Abdurrahman b. Mülcem tarafından hançerlendi ve aldığı yaranın tesiriyle 21 Ramazan 40 (28 Ocak 661) tarihinde vefat etti."},{"k":"h","x":"Haricilerin ayrılık gerekçeleri"},{"k":"p","x":"**1.** Hz. Ali'nin “Mü'minlerin Emiri” unvanını sildirmesi"},{"k":"p","x":"**2.** Tahkimi kabul etmesi"},{"k":"p","x":"**3.** Hakem tayin edilenlerin hakemlik vasfına sahip olmaması"},{"k":"p","x":"**4.** Allah'ın hüküm verdiği bir meselede insanların hüküm verme yetkilerinin bulunmaması."}]},{"h":"Emevîler Döneminde Hariciler ve Faaliyetleri","b":[{"k":"p","x":"Hz. Ali'nin ölümünden sonra Hz. Muaviye'ye karşı Harici isyanlarının ardı arkası kesilmedi. Bu dönemde Haricilerin yoğun olarak faaliyet gösterdikleri bölge, Küfe ve Basra başta olmak üzere Irak ve çevresidir. Pek çok isyan Emevîler tarafından sertlikle bastırıldı ve katılanlara hayat hakkı tanınmadı. Emeviler'in bu sert tutumları sebebiyle Kûfe Hariciliği sona ererken Basra Hariciliği Mis'ar b. Fedeki et-Temîmî tarafından kuruldu. Ancak Basra Valisi Ziyad b. Ebîh ve oğlu Ubeydullah zamanında Haricilere çok sert davranıldı ve toparlanmalarına fırsat verilmedi."},{"k":"p","x":"Hariciler, Hz. Muaviye'nin ölümünden sonra da rahat durmadılar. Özellikle Hz. Hüseyin'in Kerbela'da şehid edilmesinin ardından Abdullah b. Zübeyr'in hilafet davası ve bu uğurdaki silahlı mücadelesi, 63 (682) yılında İbn Zübeyr taraftarlarının isyanı, bunun üzerine Yezid'in kumandanı Müslim b. Ukbe'nin Mekke'ye saldırması (63/683) ve arkasından Kâbe'nin yakılması huzursuzluğu daha da arttırdı."},{"k":"p","x":"Haricilerin Emevîler döneminde en büyük isyanlarından birisi 64/684 yılında Basra ve civarında oldu. Basra'da daha önce hapsedilenleri de yanına alan Nafi b. Ezrak, Ehvaz'a çekildi ve isyana katılmayıp Basra'da oturanları tekfir etti. Ancak Emevi valilerinin sıkı takibi sonucu Nafi ve taraftarları yakalanıp öldürüldüler. Böylece Ezârika grubu dağıldı."}]},{"h":"Abbasîler Döneminde Haricîler ve Faaliyetleri","b":[{"k":"p","x":"Abbasîler dönemi, Haricîler açısından pek hareketli değildir. Bazı isyan girişimlerine Abbasî yönetimi yerinde müdahalelerle fırsat vermemiştir. Bununla birlikte İbâziyye koluna mensup olan Beni Rüstem, Tâhert'te Rüstemîler Devleti'ni kurmaya muvaffak olmuştur. İbaziyye Basra, Yemen, Hadramut, Uman, Kuzey Afrika ve Mağrib'de hâlâ varlığını sürdüren tek Harici fırkasıdır."}]},{"h":"Harici Fırkaları","b":[{"k":"p","x":"**1) Ezârika:** Nafi b. Ezrak'a (ö. 65/685) nispet edilen bu fırkaya göre, Cemel ve Sıffin savaşlarına katılanlar ile hakemleri kabul edenler, kâfir ve ebedî cehennemliktirler. Ayrıca kendileri gibi düşünseler de kendileriyle birlikte kıyam etmeyen Hariciler de kâfirdir. Muhaliflerin kadın ve çocuklarını öldürmek caizdir, recm cezası yoktur, takiyye haramdır ve kebire sahipleri ebediyen cehennemliktir."},{"k":"p","x":"**2) Necedat**: Necde b. Âmir el-Hanefiye (69/689) uyanlardır. Nafi b. Ezrak'ın görüşlerine ilk eleştirileri getiren isim oldu. Necde b. Amir küfür kavramını; \"küfrü ni'met\" ve \"küfrü din\" şeklinde iki kısma ayırmıştı. Zira nimet küfrü, kazanılan nimetlere ve bir iyiliğe karşı nankörlük etmek demekti ki, kelime bu anlamda Kur'an'da kullanıldığı gibi, günlük dilde de kullanılıyordu. \"Küfrü din” ise, inançsızlık anlamına gelmektedir ki, Kur'an'da da aynı anlamda kullanılıyordu. Necde ve taraftarları, Hariciler arasındaki aşırı şiddet eğilimlerini büyük ölçüde yumuşattılar, hatta taraftarlarına tehlike hâlinde takiyye yapmayı önerdiler. Bunlara göre \"ashab-ı kuud” tekfir edilemeyeceği gibi, kendileriyle savaşmayan diğer Müslümanların kanları da haramdı."},{"k":"p","x":"**3) Sufriyye**: Abdullah b. Asfar et-Temîmi'ye nispet edilen bu gruba göre, günah işleyenlerin müşrik olduğu kabul edilmekle birlikte muhaliflerin kadın ve çocuklarını öldürmek caiz değildir. Bu grubun ortaya çıkış sürecinde Ezârika grubunun aşırı görüşlerinin belirleyici bir rolünün olduğu kabul edilir. Sufriyye grubu Emevîlere yönelik ayaklanmaları ile dikkat çekmiştir. İkinci hicri asrın ortalarında Fas'ın Sicilmase bölgesinde bir devlet kurabilmişlerdir."},{"k":"p","x":"**4) Acâride**: Abdülkerîm b. Acred'in bağlılarından oluşan bu fırka, kâfirlerin çocukları hakkında büluğ çağına gelip İslam'ı kabul veya reddettikleri sabit olmadan hüküm verilemeyeceğini, Hariciler'in bulunduğu yere hicret etmenin farz değil fazilet olduğunu, hicret etmeyenlerin büyük günah işlemedikleri sürece mümin sayılması gerektiğini ileri sürmüştür."},{"k":"p","x":"**5) İbâziyye**: Abdullah b. İbâz'a nispet edilen bu firka, büyük günah işleyenleri sadece nimete karşı nankörlük anlamında kâfir sayar; muhalif Müslüman grupların yaşadığı toprakları İslam ülkesi kabul ederek onlarla evlenmeyi ve miras intikalini meşru görür. İbâzîyye, Hariciliğin en ılımlı ve günümüze kadar ulaşan tek koludur. Bunların dışında Seâlibiyye, Beyhesiyye, Hüseyniye ve Azriyye gibi gruplar ve bunların tali kolları da vardır."}]},{"h":"Haricilerin Bazı Ortak Görüşleri","b":[{"k":"p","x":"**1. İmamet/hilafet konusu**. Halifelik adil, alim ve zahid olması şartıyla hür yahut köle her Müslümanın hakkıdır; diğer mezheplerin ileri sürdükleri Kureyşî, Haşimi, Emevî yahut Arap olma gibi şartlar geçerli değildir. Halife, Müslümanlar arasında yapılan hür seçimle iş başına getirilir; doğru yoldan ayrıldığı zaman da azledilir veya öldürülür."},{"k":"p","x":"**2. Meşru olan hilafet dönemleri**. Hz. Ebû Bekir ile Hz. Ömer'in hilafetlerinin tamamını, Hz. Osman'ın ilk altı yılını ve Hz. Ali'nin tahkime kadarki halifeliğini meşru sayıp Hz. Osman'ın ikinci altı yıllık halifelik döneminden itibaren vuku bulan olayları adaletsizlik şeklinde değerlendirmeleri hususunda ittifak ederler."},{"k":"p","x":"**3. Adalet**. Hariciler için devletin en önemli vasfı adalet olduğundan imamın ilk işi, iyiliği emretme ve kötülükten uzaklaştırma prensibini uygulamaktır. Aslında bu prensip her müminin vazgeçilmez görevidir."},{"k":"p","x":"**4. Amel iman ilişkisi**. Ameli imanın parçası olarak kabul ederler. Buna göre inanç ve amelden oluşan dinin emirlerini yerine getirmeyen ve yasaklarından kaçınmayan kimseler kâfirdir. İmanla İslam ayrılmaz bir bütün olup eş anlamda kullanılmıştır."},{"k":"p","x":"**5. Küfür**. Amellerin ihmal edilmesinden dolayı imandan çıkılır. Onlara göre büyük günah işleyen kişi, bu tutumuyla Allah'ın yasak kıldığı şeyi helal saydığından mümin değildir ve cehennemde ebedî kalacaktır."}]},{"h":"İbâziyye","b":[{"k":"p","x":"Adını kurucusu kabul edilen **Abdullah b. İbâz** 'dan alan bu fırka, Harici fırkalar arasında günümüze ulaşan yegâne gruptur. O, Nafi b. Erzak ile birlikte hareket etmiştir. Nâfi b. Ezrak'la beraber Yezid b. Muaviye'ye karşı halifelik iddiasında bulunan Abdullah b. Zübeyr'e yardım etmek üzere Mekke'ye giden Harici grup içinde yer almıştır. Ancak İbnü'z-Zübeyr ile fikren anlaşamayan Hariciler ondan ayrılınca Abdullah da diğer Haricilerle birlikte Basra'ya geri dönmüştü. Fakat Nafi, Emevî zulmü karşısında pasif bir tutum sergilenmesini doğru bulmayarak bütün Haricilerin kendisi ile birlikte hareket etmesini istemiş ve kendisine katılmayan Haricîleri de kâfir ilan etmişti. Onun bu tutumu neticesinde Abdullah b. İbâz Nafi'den ayrılmıştır. İbn İbâz, Müslümanların sadece nimetler karşısında nankör sayılmaları gerektiğini, bu sebeple de onların can ve mal güvenliğine sahip olduklarını açıklamıştır."},{"k":"p","x":"Abdullah b. İbâz, aklı-selim ve sünnet hudutları içinde kalmak isteyen Haricîleri kendi etrafında toplayıp Basra'da sakin bir. hayat yaşamıştır. Onun reisliğinde Basra'da yaşayan İbâzîler'in bu devrine **kitmân (gizlenme) devri** denilmiştir. Abdullah İbnü'z-Zübeyr'e katılması dışında, kendi mensuplarının siyasi ve sosyal çalkantılar karşısında pasif hâlde kalmalarını sağlamış, Emevîlerle iyi ilişkiler kurmuş ve Halife Abdülmelik b. Mervân'a iyiliği tavsiye eden ve kötülüklere mani olmasını isteyen bir mektup yazmıştır. İbn İbaz'ın ne zaman öldüğü konusunda net bir bilgi bulunmamaktadır. İbâzîlerin Emevîlerle iyi ilişkileri Abdülmelik b. Mervan'ın ölümünden sonra bozulmuştur."},{"k":"p","x":"İbazilerin önde gelen fakihlerinden birisi olan **Ebû Ubeyde Müslim b. Ebû Kerime**, Basra İbâzîlerinin başına geçti ve bu dönemde Basra bir ilim merkezi hüviyetini kazandı. O, etrafında toplanan öğrenci gruplarını yetiştirerek hemen hemen bütün Müslüman bölgelere göndermekle planlı bir faaliyetin içinde idi. \"Hameletü'l-ilm \" veya \" nakâletü'l-ilm” adı verilen bu gruplar İbâzîyye'nin Mağrib, Yemen, Hadramut, Uman ve Horasan'a yayılmasını sağladı. Bunun sonucunda küçüklü büyüklü İbazi ayaklanmaları patlak verdi."},{"k":"p","x":"Ömer b. Abdülaziz'in ölümünden sonra gizli bir hayat yaşayan Basra İbazileri takibata uğradı ve bu durum onların ihtilalcı bir çizgiye kaymasına sebep oldu. Abbasîler devrinde de İbâzîler büyük ölçüde himaye gördüler. Uman'da yönetimi belirli aralıklarla ele geçiren İbaziler Uman'daki varlığını Ortaçağ'da da sürdürdü. Günümüzde de İbâzîlik Uman'da Gâfirî ve Hinâ kabilelerinin mezhebi durumundadır. Umanlı İbâzî tüccarlar yoluyla, ibâzîlik Arap yarımadası dışında Kuzey Afrika, İran, Horasan, Kirman, Hind ve Çin bölgelerine yayılmıştır."},{"k":"p","x":"Öte yandan 132/749 yılında kısa süreli **Ziyadî devletini** kurdular. Ebu'l-Hattab el-Muâfirî'nin liderliğinde, 141/758 yılında Batı Trablus ve civarındaki pek çok yeri ele geçirdiler ve sonrasında Abdurrahman b. Rüstem Kayravan'da İbâzî bir devlet kurdu. **Rüstemîler Devleti** döneminde İbâzîler, Kuzey Afrika'da altın çağını yaşadı. Bu devler Fâtimîler tarafından yıkıldı. **Osmanlı döneminde** Cezayir'in Osmanlı idaresine girmesiyle birlikte İbâzîler, Osmanlı tebaası oldu. Belli bir vergi karşılığında Osmanlı tarafından himaye edildiler ve genellikle iç işlerine karışılmadı. İbâziyye, erken sayıl
