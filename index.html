<style>
:root{
  --paper:#f7f3ea; --card:#fffdf8; --ink:#1f2a24; --muted:#6b7068; --line:#e3dccb;
  --green:#1f5a45; --green-2:#2f7a5f; --green-soft:#e4efe8; --gold:#b08a3e; --gold-soft:#f4ead3;
  --red:#a8432f; --red-soft:#f6e1db; --radius:14px; --shadow:0 1px 2px rgba(40,30,10,.06),0 6px 20px rgba(40,30,10,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ar:Amiri,"Traditional Arabic","Scheherazade New","Noto Naskh Arabic",serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body{padding-bottom:34px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 64px}
header.top{position:sticky;top:0;z-index:5;background:rgba(247,243,234,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.brand{white-space:nowrap;display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.15rem;font-weight:700;color:var(--green);background:none;border:0;padding:0}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 auto}
.crumb .brand{min-width:0}.crumb .bt{overflow:hidden;text-overflow:ellipsis}
.ga{display:grid;text-decoration:none;border-radius:8px}
.ga .mark,.brand .pmark{width:30px;height:30px;border-radius:8px;background:var(--green);color:#f4c430;display:grid;place-items:center;flex:none}
.ga:hover .mark{background:var(--green-2)}
.csep{color:var(--line);font-size:1.3rem;line-height:1;margin:0 1px}
.brand .pmark{background:var(--gold-soft);color:var(--green);border:1px solid #e6d6ae}
.spacer{flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.88rem;color:var(--muted)}
.ghost:hover{border-color:var(--green-2);color:var(--green)}
.iconbtn{padding:6px 10px;display:inline-grid;place-items:center}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0}
h1{font-size:1.7rem;color:var(--green)}
h2{font-size:1.3rem}
.lead{color:var(--muted);margin:6px 0 0}
.hero{padding:28px 0 8px}
.hero .arn{font-family:var(--ar);font-size:1.5rem;color:var(--gold);margin-top:2px;text-align:left}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:110px}
.stat b{display:block;font-family:var(--serif);font-size:1.35rem;color:var(--green)}
.stat span{font-size:.8rem;color:var(--muted)}
.section-title{margin:26px 0 10px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.mode{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.mode:hover{transform:translateY(-2px);border-color:var(--green-2)}
.mode .ico{font-size:1.4rem;width:40px;height:40px;border-radius:10px;background:var(--green-soft);display:grid;place-items:center;margin-bottom:10px}
.mode h3{font-size:1.08rem;margin-bottom:4px}
.mode p{margin:0;color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.bar{display:flex;align-items:center;gap:10px;margin:18px 0 12px}
.progress{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--green-2);transition:width .3s}
.count{font-size:.85rem;color:var(--muted);white-space:nowrap}
.tag{display:inline-block;font-size:.75rem;background:var(--gold-soft);color:#7a5c1e;border-radius:999px;padding:2px 10px;margin-bottom:10px}
.q{font-family:var(--serif);font-size:1.25rem;margin:4px 0 18px}
.q.long{font-family:var(--sans);font-size:1.02rem;line-height:1.6;background:var(--paper);border-radius:12px;padding:12px 14px}
.q em{font-style:normal;color:var(--green);font-weight:700}
.q small{display:block;font-family:var(--sans);font-size:.85rem;color:var(--muted);margin-bottom:6px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1rem;display:flex;gap:10px;align-items:flex-start}
.opt .k{flex:none;width:24px;height:24px;border-radius:6px;background:var(--paper);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.opt:hover:not([disabled]){border-color:var(--green-2)}
.opt.ok{border-color:var(--green-2);background:var(--green-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt[disabled]{cursor:default}
.explain{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--paper);font-size:.93rem;display:none}
.explain.show{display:block}
.explain b{color:var(--green)}
.explain .src{display:block;color:var(--muted);font-size:.82rem;margin-top:6px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:11px 18px;background:var(--green);color:#fff;font-weight:600}
.btn:hover{background:var(--green-2)}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
.result{text-align:center;padding:30px 20px}
.big{font-family:var(--serif);font-size:3rem;color:var(--green);line-height:1}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:grid;gap:8px;align-content:start}
.col h4{margin:0 0 2px;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.93rem;min-height:52px;transition:all .15s}
.tile.sel{border-color:var(--gold);background:var(--gold-soft)}
.tile.done{border-color:var(--green-soft);background:var(--green-soft);color:var(--green);opacity:.75}
.tile.wrong{animation:shake .3s;border-color:var(--red);background:var(--red-soft)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.flash{perspective:1200px;min-height:280px;cursor:pointer;margin-top:4px}
.flash-in{position:relative;min-height:280px;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);overflow:auto}
.face.back{transform:rotateY(180deg);background:#fbf7ec}
.face .t{font-family:var(--serif);font-size:1.5rem;color:var(--green)}
.face .s{color:var(--ink);font-size:.98rem;margin-top:10px;max-width:560px;line-height:1.6}
.face .hint{position:absolute;bottom:12px;font-size:.78rem;color:var(--muted)}
.answer{display:none;margin-top:6px;border-top:1px dashed var(--line);padding-top:14px}
.answer.show{display:block}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:1rem}
.search:focus{outline:none;border-color:var(--green-2)}
.list{margin-top:12px;display:grid;gap:8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%;display:block}
button.row:hover{border-color:var(--green-2)}
.row .e{font-family:var(--serif);font-weight:700;font-size:1.05rem;color:var(--green)}
.row .n{font-size:.93rem;margin-top:3px;line-height:1.55}
.row .w{font-size:.76rem;color:var(--muted);margin-top:4px}
.empty{color:var(--muted);text-align:center;padding:30px}
.meter{display:grid;grid-template-columns:minmax(120px,240px) 1fr 54px;gap:10px;align-items:center;margin:8px 0;font-size:.9rem}
.meter span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter .progress{height:10px}
.select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:.9rem;max-width:100%}
.rowctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.kaynak{margin:28px auto 8px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:.78rem;text-align:center}
.foot{margin-top:40px;color:var(--muted);font-size:.8rem;text-align:center}
.sig{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;padding:5px 12px calc(5px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);font-family:var(--sans);font-size:.7rem;letter-spacing:.02em;color:var(--muted)}
.sig b{color:var(--green);font-weight:600}
.sig i{font-style:normal;opacity:.5}
.study-cta{display:flex;gap:14px;align-items:center;background:var(--green);color:#fff;border:0;border-radius:var(--radius);padding:18px;text-align:left;width:100%;box-shadow:var(--shadow);margin-bottom:12px}
.study-cta:hover{background:var(--green-2)}
.study-cta .ico{font-size:1.5rem;width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.study-cta h3{font-size:1.15rem;margin-bottom:2px;color:#fff}
.study-cta p{margin:0;opacity:.85;font-size:.9rem}
.ulist{display:grid;gap:8px}
.unit{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.unit:hover{border-color:var(--green-2)}
.unit .st{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:var(--muted);font-weight:700}
.unit.done .st{background:var(--green-2);border-color:var(--green-2);color:#fff}
.unit.next .st{border-color:var(--gold);color:var(--gold)}
.unit .ut{flex:1}.unit .ut b{display:block;font-weight:600}.unit .ut small{color:var(--muted)}
.intro{font-size:1.02rem;margin:10px 0 14px}
.tipbox{background:var(--gold-soft);border-left:4px solid var(--gold);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:.95rem}
.tipbox b.lb{color:#7a5c1e;display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
details.oq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px}
details.oq summary{cursor:pointer;font-weight:600}
.sticky-go{position:sticky;bottom:40px;display:flex;justify-content:center;margin-top:20px}
.sticky-go .btn{box-shadow:0 6px 20px rgba(31,90,69,.3);padding:11px 20px;font-size:.95rem}
.backlink{background:none;border:0;color:var(--green);font-weight:600;padding:14px 0 0;font-size:.95rem}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.toc button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:.8rem;color:var(--muted)}
.toc button:hover{border-color:var(--green-2);color:var(--green)}
.lesson section.ls{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0;scroll-margin-top:70px}
.lesson h3{font-family:var(--serif);font-size:1.12rem;color:var(--ink);display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;line-height:1.35}
.lesson h3 .no{flex:none;width:26px;height:26px;border-radius:8px;background:var(--green-soft);color:var(--green);font-family:var(--sans);font-size:.8rem;font-weight:700;display:grid;place-items:center;margin-top:1px}
.lesson h4{font-family:var(--sans);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin:14px 0 6px}
.lesson p{margin:0 0 8px;font-size:.98rem;line-height:1.65}
.lesson p.li{padding-left:16px;position:relative}.lesson p.li:before{content:"•";position:absolute;left:3px;color:var(--gold);font-weight:700}
.lesson p.num{padding-left:24px;position:relative}.lesson p.num .nn{position:absolute;left:0;color:var(--green);font-weight:700}
.lesson b{color:var(--green)}
.def{display:grid;grid-template-columns:minmax(110px,30%) 1fr;gap:4px 14px;padding:10px 12px;border-radius:10px;background:var(--green-soft);margin:8px 0}
.def dt{font-family:var(--serif);font-weight:700;color:var(--green)}
.def dd{margin:0;line-height:1.6}
.ar{font-family:var(--ar);font-size:1.18em;line-height:1.9;direction:rtl;unicode-bidi:isolate;color:#5b3f86}
.ar.blk{display:block;text-align:right;margin:4px 0}
.ayet{display:block;font-family:var(--ar);font-size:1.3rem;line-height:2.1;direction:rtl;text-align:right;color:#5b3f86;margin:4px 0 2px}
.sov{position:fixed;inset:0;z-index:90;background:rgba(20,25,20,.35);display:none}
.sov.open{display:block}
.sbox{background:var(--paper);max-width:860px;margin:0 auto;height:100%;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.sbar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card);color:var(--muted)}
.sbar input{flex:1;border:0;background:transparent;font-size:1.05rem;padding:8px 2px;color:var(--ink);outline:none;min-width:0}
.sres{overflow:auto;padding:4px 14px 80px;flex:1}
.sgrp{margin:16px 0 6px;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sitem{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0}
.sitem:hover{border-color:var(--green-2)}
.sitem .t{font-weight:600}.sitem .w{font-size:.78rem;color:var(--green);font-weight:600;margin-bottom:2px}
.sitem .x{font-size:.88rem;color:var(--muted);margin-top:3px}
mark{background:#f6df9b;color:inherit;border-radius:3px;padding:0 1px}
.flash-target{animation:ft 2.2s ease}
@keyframes ft{0%,40%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:none}}
.how{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin:8px 0 14px}
.how summary{cursor:pointer;font-weight:700;color:var(--green);font-family:var(--serif);font-size:1.05rem}
.how .steps{margin:10px 0 6px;padding-left:22px;display:grid;gap:8px;font-size:.94rem}
.how .steps li::marker{color:var(--gold);font-weight:700}
.hownote{margin:6px 0 2px;color:var(--muted);font-size:.86rem}
.exq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.exq .qq{font-family:var(--serif);font-size:1.05rem;font-weight:700;display:flex;gap:10px}
.exq .qq .no{flex:none;width:26px;height:26px;border-radius:8px;background:var(--gold-soft);color:#7a5c1e;font-family:var(--sans);font-size:.8rem;display:grid;place-items:center}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.links button{border:1px solid var(--line);background:var(--green-soft);color:var(--green);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:600}
.oralbody{max-height:none}
.snote{font-size:.86rem;color:var(--muted);margin-top:8px;font-family:var(--sans)}
.lesson h3 .rep{margin-left:auto;flex:none;margin-top:2px}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.exq .qq .rep{margin-left:auto;flex:none}
.hide{display:none!important}

/* ---------- İslam Mezhepleri: öğretici görünüm ---------- */
.lesson h5{font-family:var(--sans);font-size:.92rem;color:var(--green);margin:12px 0 6px}
.box{border-radius:10px;padding:11px 14px;margin:10px 0;font-size:.95rem;line-height:1.6;border-left:4px solid}
.box b.lb{display:block;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.box.bn{background:var(--gold-soft);border-color:var(--gold)}.box.bn b.lb{color:#7a5c1e}
.box.bk{background:var(--red-soft);border-color:var(--red)}.box.bk b.lb{color:var(--red)}
.box.bo{background:#fff;border:1px dashed var(--green-2);border-left:4px solid var(--green-2)}.box.bo b.lb{color:var(--green-2)}
.box.bs{background:#eef1f6;border-color:#4a6283}.box.bs b.lb{color:#4a6283}
.box.bs .sq{font-weight:600;margin:0 0 6px!important}.box.bs .sa{margin:0!important}.box.bs .sa b{color:#4a6283}
.arb{background:#f8f5fb;border-radius:10px;padding:8px 14px;margin:8px 0}
.arb .ayet{margin:2px 0}
.arb .meal{display:block;font-size:.88rem;color:var(--muted);margin-top:2px;line-height:1.5}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.tbl{border-collapse:collapse;width:100%;font-size:.9rem;line-height:1.5}
.tbl th,.tbl td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tbl thead th{background:var(--green);color:#fff;font-weight:600;font-size:.82rem;letter-spacing:.02em;white-space:nowrap}
.tbl thead th b{color:#fff}
.tbl tbody th{font-weight:600;color:var(--green);background:#fbf8f1;min-width:110px}
.tbl tbody tr:last-child th,.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:nth-child(even) td{background:#fcfaf5}
.tbl .ar{font-size:1.05em;line-height:1.8}
.tbl td.arc .ar{display:block;text-align:right;font-size:1.2em;line-height:1.9}
.tbl.cmp thead th:first-child{background:var(--green-2)}
.stp{list-style:none;counter-reset:st;margin:10px 0;padding:0 0 0 4px}
.stp li{counter-increment:st;position:relative;padding:0 0 12px 36px;font-size:.95rem;line-height:1.6}
.stp li:before{content:counter(st);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#fff;font-size:.78rem;font-weight:700;display:grid;place-items:center}
.stp li:after{content:"";position:absolute;left:11px;top:26px;bottom:2px;border-left:2px solid var(--gold-soft)}
.stp li:last-child{padding-bottom:2px}.stp li:last-child:after{display:none}

<script>
/* Kullanım: düğme → <button class="rep" data-k="benzersiz-anahtar" data-yer="Ünite 3 · Bölüm" data-bas="Kayıt başlığı">⚑ Bildir</button>
   Programda önceden tanımlanır: window.BLD_APP = 'Program adı'; window.BLD_PREFIX = 'kayıt ön eki';
   İsteğe bağlı: "Bildirimlerim" düğmesinin konacağı yer → window.BLD_SLOT = 'css seçici' */
(function () {
  const APP = window.BLD_APP || 'Program', MAIL = 'alpkiraymehmet@gmail.com';
  const KEY = (window.BLD_PREFIX || 'bld_') + 'reports';
  const TYPES = ['Bilgi yanlış', 'Eksik ya da karışık anlatım', 'Soru, şık veya cevap hatalı', 'Arapça metin bozuk', 'Yazım hatası', 'Diğer'];
  const E = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const getL = () => { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } };
  const setL = l => { try { localStorage.setItem(KEY, JSON.stringify(l)); } catch (e) {} sync(); };
  const modal = document.getElementById('bldModal'), box = document.getElementById('bldBox');
  let lbtn = null;
  function slot() {
    if (lbtn || !window.BLD_SLOT) return;
    const s = document.querySelector(window.BLD_SLOT); if (!s) return;
    lbtn = document.createElement('button'); lbtn.type = 'button'; lbtn.className = 'bld-lbtn'; lbtn.title = 'Listeye eklediğin hata bildirimleri';
    lbtn.onclick = openList; s.appendChild(lbtn);
  }
  function sync() { slot(); if (lbtn) { const n = getL().length; lbtn.classList.toggle('has', n > 0); lbtn.innerHTML = `⚑<span class="bld-lg"> Bildirimlerim</span> (${n})`; } mark(); }
  function mark() { const l = getL(); document.querySelectorAll('.rep[data-k]').forEach(b => b.classList.toggle('on', l.some(x => x.k === b.dataset.k))); }
  const TR = {'ç': 'c', 'ğ': 'g', 'ı': 'i', 'ö': 'o', 'ş': 's', 'ü': 'u', 'â': 'a', 'î': 'i', 'û': 'u', 'Ç': 'C', 'Ğ': 'G', 'İ': 'I', 'Ö': 'O', 'Ş': 'S', 'Ü': 'U', 'Â': 'A', 'Î': 'I', 'Û': 'U'};
  const ascii = t => String(t).normalize('NFC').replace(/[çğıöşüâîûÇĞİÖŞÜÂÎÛ]/g, c => TR[c]).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\x20-\x7E\n]/g, '');
  const plain = t => String(t).replace(/[“”«»]/g, '"').replace(/[‘’ʿʾ]/g, "'").replace(/[·—–…]/g, '-').replace(/\s{2,}/g, ' ').trim();
  const body1 = r => `Program: ${APP}\nYer: ${r.yer}\nKayit: ${r.bas}\nKayit no: ${r.k}\nHata turu: ${r.type}\nNot: ${r.note || '-'}\nSayfa: ${r.url}`;
  const subj = r => `[${APP} Hata] ${r.k}`;
  const mailto = (su, bo) => `mailto:${MAIL}?subject=${encodeURIComponent(ascii(plain(su)))}&body=${encodeURIComponent(ascii(bo.split('\n').map(plain).join('\n'))).replace(/%0A/g, '%0D%0A')}`;
  const gmail = (su, bo) => `https://mail.google.com/mail/?view=cm&fs=1&to=${MAIL}&su=${encodeURIComponent(su)}&body=${encodeURIComponent(bo)}`;
  function copy(t, msg) {
    const done = () => { msg.textContent = `Kopyalandı. Yeni bir e-posta aç, alıcıya ${MAIL} yaz ve metni mesajın içine yapıştır.`; };
    const fb = () => { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { msg.textContent = 'Kopyalanamadı; metni elle seçip kopyalayabilirsin.'; } ta.remove(); };
    try { if (navigator.clipboard && window.isSecureContext !== false) navigator.clipboard.writeText(t).then(done, fb); else fb(); } catch (e) { fb(); }
  }
  let pushed = false;
  function open(html) {
    box.innerHTML = html;
    if (!modal.classList.contains('open')) { try { history.pushState(Object.assign({}, history.state, {bld: 1}), ''); pushed = true; } catch (e) { pushed = false; } }
    modal.classList.add('open'); const f = box.querySelector('textarea,input,button'); f && f.focus();
  }
  let closing = false;
  function close() { if (!modal.classList.contains('open')) return; modal.classList.remove('open'); if (pushed) { pushed = false; closing = true; try { history.back(); } catch (e) { closing = false; } } }
  // Telefonda geri hareketi önce pencereyi kapatsın, programın kendi gezinmesine geçmesin
  window.addEventListener('popstate', e => {
    if (closing) { closing = false; e.stopImmediatePropagation(); return; }
    if (modal.classList.contains('open') || pushed || (history.state && history.state.bld)) {
      const wasOpen = modal.classList.contains('open');
      modal.classList.remove('open'); pushed = false; e.stopImmediatePropagation();
      if (!wasOpen && history.state && history.state.bld) { try { history.back(); } catch (er) {} }
    }
  }, true);
  modal.addEventListener('click', e => { if (e.target === modal || e.target.closest('[data-x=close]')) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('open')) close(); });
  function report(b) {
    const r = {k: b.dataset.k, yer: b.dataset.yer || '', bas: b.dataset.bas || '', url: location.href};
    open(`<h3 id="bldTitle">Hata bildir</h3><div class="bld-loc">${E(r.yer)}</div><div class="bld-q">${E(r.bas)}</div>
      ${TYPES.map((t, i) => `<label><input type="radio" name="bldt" value="${i}" ${i === 0 ? 'checked' : ''}> ${E(t)}</label>`).join('')}
      <textarea id="bldNote" placeholder="Not (isteğe bağlı): doğrusu ne olmalı, kaynağı nedir…"></textarea>
      <div class="bld-btns"><button class="pri" data-a="mail">E-posta ile gönder</button><a data-a="gmail" href="#" target="_blank" rel="noopener">Gmail'de aç</a><button data-a="copy">Metni kopyala</button><button data-a="add">Listeye ekle</button><button data-x="close">Kapat</button></div>
      <div class="bld-msg" id="bldMsg" aria-live="polite"></div>
      <div class="bld-hint">“E-posta ile gönder” bilgisayarındaki/telefonundaki e-posta uygulamasını açar. Açılmazsa “Gmail'de aç”ı ya da “Metni kopyala”yı kullan. Adres: ${MAIL}. Birden çok hata bulacaksan “Listeye ekle” deyip sonra üstteki “Bildirimlerim” ile hepsini tek e-postada gönderebilirsin.</div>`);
    const get = () => Object.assign({}, r, {type: TYPES[+box.querySelector('input[name=bldt]:checked').value], note: box.querySelector('#bldNote').value.trim()});
    const msg = box.querySelector('#bldMsg'), q = a => box.querySelector(`[data-a=${a}]`);
    q('mail').onclick = () => { const x = get(); try { navigator.clipboard && navigator.clipboard.writeText(body1(x)).catch(() => {}); } catch (e) {} location.href = mailto(subj(x), body1(x)); msg.textContent = 'E-posta uygulaman açılıyor… Metin ayrıca panoya kopyalandı: mesaj boş ya da bozuk görünürse içini silip yapıştırabilirsin.'; };
    q('gmail').onclick = function () { const x = get(); this.href = gmail(subj(x), body1(x)); };
    q('copy').onclick = () => copy(body1(get()), msg);
    q('add').onclick = () => { const l = getL(); l.push(get()); setL(l); msg.textContent = `Listeye eklendi (${l.length}). Üstteki “Bildirimlerim” ile topluca gönderebilirsin.`; };
  }
  function openList() {
    const l = getL(), su = `[${APP} Hata] Toplu bildirim (${l.length} hata)`, bo = l.map((r, i) => `--- ${i + 1} ---\n${body1(r)}`).join('\n\n');
    open(`<h3 id="bldTitle">Bildirimlerim (${l.length})</h3>
      ${l.length ? `<ul class="bld-list">${l.map((r, i) => `<li><div><b>${E(r.bas.slice(0, 90))}</b><br><small>${E(r.yer)} · ${E(r.type)}${r.note ? ' — ' + E(r.note) : ''}</small></div><button data-del="${i}" title="Listeden çıkar">✕</button></li>`).join('')}</ul>` : '<p>Liste boş.</p>'}
      <div class="bld-btns">${l.length ? `<button class="pri" data-a="mail">Hepsini e-postayla gönder</button><a data-a="gmail" href="#" target="_blank" rel="noopener">Gmail'de aç</a><button data-a="copy">Metni kopyala</button><button data-a="clear">Listeyi temizle</button>` : ''}<button data-x="close">Kapat</button></div>
      <div class="bld-msg" id="bldMsg" aria-live="polite"></div><div class="bld-hint">Gönderdikten sonra “Listeyi temizle” diyebilirsin. Liste yalnızca bu tarayıcıda saklanır.</div>`);
    const msg = box.querySelector('#bldMsg'), q = a => box.querySelector(`[data-a=${a}]`);
    box.querySelectorAll('[data-del]').forEach(x => x.onclick = () => { const L = getL(); L.splice(+x.dataset.del, 1); setL(L); openList(); });
    if (!l.length) return;
    q('mail').onclick = () => { const u = mailto(su, bo); if (u.length > 1900) msg.textContent = `Liste uzun; e-posta uygulaması metni kesebilir. Kesilirse “Gmail'de aç” veya “Metni kopyala”yı kullan.`; location.href = u; };
    q('gmail').href = gmail(su, bo);
    q('copy').onclick = () => copy(bo, msg);
    q('clear').onclick = () => { setL([]); openList(); };
  }
  document.addEventListener('click', e => { const b = e.target.closest('.rep[data-k]'); if (!b) return; e.preventDefault(); e.stopPropagation(); report(b); }, true);
  new MutationObserver(() => { if (!lbtn) slot(); mark(); }).observe(document.body, {childList: true, subtree: true});
  window.bldButton = (k, yer, bas, txt) => `<button type="button" class="rep" data-k="${E(k)}" data-yer="${E(yer)}" data-bas="${E(String(bas).slice(0, 400))}" title="Bu kayıttaki bir hatayı bildir">${txt || '⚑ Bildir'}</button>`;
  window.bldOpenList = openList;
  sync();
})();
</script>

<style>
.gab,.gab-sheet,.gab-dim{display:none}
@media screen{ /* her ekranda: telefon, tablet ve masaüstü (24 Kasım, kullanıcı isteği); imza satırı çubuğun içinde */
  .sig{display:none!important}
  .gab-off .sig{display:flex!important}
  body{padding-bottom:calc(var(--gab-h,84px) + 10px)!important}
  .gab-off body{padding-bottom:40px!important}
  .sticky-go{bottom:calc(var(--gab-h,84px) + 10px)!important} /* programların alta yapışan düğmeleri çubuğun üstünde kalsın */
  .gab-off .sticky-go{bottom:40px!important}
  .gab{display:block;position:fixed;left:0;right:0;bottom:0;z-index:58;background:#fffdf8;border-top:1px solid #e3dccb;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
  .gab-off .gab{display:none}
  .gab-row{display:flex;justify-content:space-around;align-items:stretch;padding:5px 4px 0;max-width:520px;margin:0 auto}
  .gab-b{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;margin:0 2px;padding:5px 2px 4px;border-radius:12px;color:#6b7068;font:500 11.5px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent;text-decoration:none}
  .gab-b svg{width:23px;height:23px}
  .gab-b.on{color:#1f5a45;background:#e4efe8}
  .gab-ic{position:relative;display:block;line-height:0}
  .gab-yk{position:absolute;top:-5px;left:50%;margin-left:6px;font:700 8.5px/1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:.03em;color:#6b4f17;background:#f1dfa8;border:1px solid #fffdf8;border-radius:999px;padding:2px 4px;white-space:nowrap}
  .gab-b:active{transform:scale(.96)}
  .gab-sig{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;padding:2px 10px 5px;font-size:.68rem;letter-spacing:.02em;color:#6b7068}
  .gab-sig b{color:#1f5a45;font-weight:600}
  .gab-sig i{font-style:normal;opacity:.5}
  .gab-dim{position:fixed;inset:0;z-index:56;background:rgba(20,28,22,.38)}
  .gab-dim.open{display:block}
  html.gab-lock,html.gab-lock body{overflow:hidden!important}
  .gab-dim{touch-action:none}
  .gab-sheet{overscroll-behavior:contain;position:fixed;left:0;right:0;bottom:0;z-index:57;max-height:78vh;overflow:auto;-webkit-overflow-scrolling:touch;background:#f7f3ea;border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(40,30,10,.18);padding:8px 14px calc(var(--gab-h,84px) + 12px);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1f2a24;font-size:15px;line-height:1.45}
  .gab-sheet{max-width:640px;margin:0 auto}
  .gab-sheet.open{display:block;animation:gabUp .2s ease-out}
  .gab-sheet.full{max-height:calc(100% - 44px - env(safe-area-inset-top))}
  .gab-sheet.gab-anim{transition:transform .2s ease-out,max-height .2s ease-out}
  @keyframes gabUp{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
}
.gab-grab{position:relative;width:38px;height:5px;border-radius:3px;background:#d9cfb9;margin:2px auto 8px;cursor:grab}
.gab-grab::before{content:'';position:absolute;left:-90px;right:-90px;top:-14px;bottom:-12px}
.gab-grab,.gab-hd{touch-action:none}
.gab-hd{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.gab-hd b{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:1.25rem;color:#1f5a45;font-weight:700}
.gab-x{width:34px;height:34px;border-radius:50%;border:1px solid #e3dccb;background:#fffdf8;color:#6b7068;font-size:20px;line-height:1;cursor:pointer}
.gab-li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fffdf8;border:1px solid #e3dccb;border-radius:12px;padding:10px 12px;margin:0 0 8px;color:inherit;font:inherit;cursor:pointer;text-decoration:none}
.gab-li.cur{border-color:#2f7a5f;box-shadow:inset 0 0 0 1px #2f7a5f}
.gab-pm{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;background:#1f5a45;color:#d9b45a}
.gab-pm svg{width:19px;height:19px}
.gab-tx{flex:1 1 auto;min-width:0}
.gab-tx b{display:block;font-weight:600;font-size:.98rem}
.gab-tx small{display:block;color:#6b7068;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gab-tag{flex:none;font-size:.72rem;font-weight:600;color:#1f5a45;background:#e4efe8;border-radius:999px;padding:2px 9px}
.gab-st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 10px}
.gab-st div{background:#fffdf8;border:1px solid #e3dccb;border-radius:12px;padding:9px 6px;text-align:center}
.gab-st b{display:block;font-size:1.3rem;color:#1f5a45;font-weight:700;line-height:1.1}
.gab-st span{font-size:.76rem;color:#6b7068}
.gab-streak{display:flex;gap:8px;align-items:center;background:#f4ead3;border:1px solid #e6d6ae;border-radius:12px;padding:8px 12px;margin:0 0 10px;font-size:.86rem;color:#6b4f17}
.gab-k{background:#fffdf8;border:1px solid #e3dccb;border-radius:12px;overflow:hidden;margin:0 0 10px}
.gab-kr{display:grid;grid-template-columns:1fr 58px 62px;gap:6px;align-items:center;padding:9px 12px;border-top:1px solid #f0eadb;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.gab-kr:first-child{border-top:0}
.gab-kh{background:#e4efe8;color:#1f5a45;font-weight:600;font-size:.78rem;cursor:default}
.gab-kr .n{text-align:right;font-variant-numeric:tabular-nums}
.gab-kr .nm b{display:block;font-weight:600;font-size:.92rem}
.gab-kr .nm small{display:block;color:#6b7068;font-size:.76rem}
.gab-bar{grid-column:1/-1;height:5px;border-radius:3px;background:#e4efe8;margin-top:-2px}
.gab-bar i{display:block;height:5px;border-radius:3px;background:#2f7a5f}
.gab-g{font-weight:700;color:#1f5a45}.gab-g.o{color:#9a7428}.gab-g.z{color:#a8432f}.gab-g.e{color:#b9b3a6;font-weight:400}
.gab-kr.bos .nm b{color:#8b8f86}
.gab-note{font-size:.78rem;color:#6b7068;margin:4px 2px 12px}
.gab-mail{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border:1px solid #e3dccb;border-radius:12px;background:#fffdf8;color:#1f5a45;font-weight:600;font-size:.9rem;text-decoration:none}
.gab-toast{position:fixed;left:50%;bottom:calc(var(--gab-h,84px) + 14px);transform:translateX(-50%);z-index:59;background:#1f2a24;color:#fff;font:500 .85rem/1.35 system-ui,-apple-system,sans-serif;padding:8px 14px;border-radius:999px;max-width:88vw;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.2)}
</style>
<div class="gab-dim" id="gabDim"></div>
<div class="gab-sheet" id="gabSheet" role="dialog" aria-modal="true" aria-labelledby="gabT"><div class="gab-grab"></div><div class="gab-hd"><b id="gabT"></b><button class="gab-x" type="button" id="gabX" aria-label="Kapat">×</button></div><div id="gabB"></div></div>

    <a class="gab-b" data-k="ana" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/></svg>Ana sayfa</a>
    <button class="gab-b" type="button" data-k="dersler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="4.5" height="16" rx="1"/><rect x="9.5" y="4" width="4.5" height="16" rx="1"/><path d="M16 5.2l3.6-.9 3 15.3-3.6.9z"/></svg>Dersler</button>
    <a class="gab-b" data-k="meal" href="/meal/"><span class="gab-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5C10 5 7 4.5 3 5v13c4-.5 7 0 9 1.5 2-1.5 5-2 9-1.5V5c-4-.5-7 0-9 1.5z"/><path d="M12 6.5v13"/></svg><span class="gab-yk" id="gabYeni" hidden>YENİ</span></span>Meal</a>
    <button class="gab-b" type="button" data-k="devam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 8.3l5.8 3.7-5.8 3.7z"/></svg>Devam et</button>
    <button class="gab-b" type="button" data-k="karne"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2.8h6V4"/><path d="M8.5 10h7M8.5 13.5h7M8.5 17h4"/></svg>Karnem</button>

</nav>
<script>
(function(){
  var APP = window.GA_APP || 'ana';
  var I = {
    kitap:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z"/><path d="M6.5 17A2.5 2.5 0 0 0 4 19.5 2.5 2.5 0 0 0 6.5 22H20v-5"/>',
    terazi:'<path d="M12 3v18"/><path d="M5 7h14"/><path d="M5 7l-3 7a4 4 0 0 0 6 0z"/><path d="M19 7l-3 7a4 4 0 0 0 6 0z"/><path d="M8 21h8"/>',
    bina:'<path d="M3 21h18"/><path d="M5 21V8l7-5 7 5v13"/><path d="M10 21v-6a2 2 0 0 1 4 0v6"/>',
    zincir:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
    kalem:'<path d="M3 21.5h11"/><path d="M4.5 21.5v-3.5a3 3 0 0 1 3-3h3a3 3 0 0 1 3 3v3.5"/><path d="M7.5 15v-2h3v2"/><path d="M9 13l12.5-10.5"/><path d="M21.5 2.5C16 2.5 12.5 5 11 9.5"/><path d="M21.5 2.5C21.5 8 19 11.5 14.5 13"/>',
    kandil:'<path d="M2 19c3-1.2 6.5-1.2 10 0c3.5-1.2 7-1.2 10 0V10c-3-1.2-6.5-1.2-10 0C8.5 8.8 5 8.8 2 10z"/><path d="M12 10v9"/><path d="M12 1.8c1.5 1.5 2 2.7 2 3.6a2 2 0 0 1-4 0c0-.9.5-2.1 2-3.6z"/>',
    agac:'<path d="M12 2a4.5 4.5 0 0 0-4.4 3.6A4 4 0 0 0 5 13h14a4 4 0 0 0-2.6-7.4A4.5 4.5 0 0 0 12 2z"/><path d="M12 8.5v8"/><path d="M4.5 16.5h15"/><path d="M12 16.5c0 2.2-2.2 3.5-5 4.5M12 16.5c0 2.2 2.2 3.5 5 4.5M12 16.5v5"/>',
    pusula:'<circle cx="12" cy="12" r="9.5"/><path d="M15.6 8.4l-2 5.2-5.2 2 2-5.2z"/><path d="M12 2.5v1.8M12 19.7v1.8M2.5 12h1.8M19.7 12h1.8"/>',
    buyutec:'<circle cx="10" cy="10" r="7"/><path d="M15.2 15.2L21 21"/><path d="M7 8.3h6M7 11.7h4"/>',
    anahtar:'<circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3L20 3.5"/><path d="M16.6 6.9l2.6 2.6"/><path d="M14.1 9.4l2 2"/>',
    yuzuk:'<circle cx="9" cy="14.5" r="5.5"/><circle cx="15" cy="14.5" r="5.5"/><path d="M15 9l-1.8-2.2L15 4.6l1.8 2.2z"/>',
    pasta:'<path d="M11 4a8 8 0 1 0 8 8h-8z"/><path d="M14 2.6A8 8 0 0 1 21.4 10H14z"/>'
  };
  // Yeni ders hazır olunca buraya bir satır eklenir (ana sayfadaki "Programlar" sırasıyla aynı).
  var GA_PROGS = [
    {k:'atlas',  ad:'Eser–Müellif Atlası',   url:'/eser_muellif_atlasi/', i:'kitap'},
    {k:'mecelle',ad:'Mecelle Küllî Kâideler', url:'/mecelle/',             i:'terazi'},
    {k:'medhal', ad:'Medhal',                 url:'/madhal/',              i:'bina'},
    {k:'hadis',  ad:'Hadis Usulü',            url:'/hadis_usulu/',         i:'zincir'},
    {k:'muhtar', ad:"Muhtâr li'l-Fetvâ",      url:'/muhtar_lil_fetva/',    i:'kalem'},
    {k:'tefsir', ad:'Tefsir Usulü',           url:'/tefsir_usulu/',        i:'kandil'},
    {k:'fikih',  ad:'Fıkıh Usulü',            url:'/fikih_usulu/',         i:'agac'},
    {k:'inanc',  ad:'Güncel İnanç Problemleri', url:'/guncel_inanc/',      i:'pusula'},
    {k:'tahric', ad:'Tahriç Usulü',           url:'/tahric/',              i:'buyutec'},
    {k:'feraiz', ad:'Feraiz',                 url:'/feraiz/',              i:'pasta'},
    {k:'hay',    ad:'Hadis Anlam ve Yorum',   url:'/hadis_anlam_ve_yorum/', i:'anahtar'},
    {k:'ahval',  ad:"Ahvalu'ş-Şahsiyye",      url:'/ahval/',               i:'yuzuk'}
  ];
  var MAIL = 'alpkiraymehmet@gmail.com';
  function rd(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
  function wr(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function svg(n){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(I[n]||'')+'</svg>'}
  function gun(t){var d=new Date(t);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
  // Güncel liste ana sayfadaki araclar/dersler.json'dan gelir; okunamazsa son okunan liste (ga_dersler), o da yoksa yukarıdaki yedek kullanılır.
  function gaListe(L){ if(!L||!L.length||L.length<GA_PROGS.length) return; var Y=[]; L.forEach(function(p){ if(p&&p.k&&p.url){ if(p.svg) I[p.i||p.k]=p.svg; Y.push({k:p.k,ad:p.ad,url:p.url,i:p.i||p.k}); } }); if(Y.length){ GA_PROGS.length=0; Array.prototype.push.apply(GA_PROGS,Y); } }
  gaListe(rd('ga_dersler',null));
  try{ fetch('/araclar/dersler.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():null}).then(function(L){ if(L&&L.length){ gaListe(L); wr('ga_dersler',L); } }).catch(function(){}); }catch(e){}

  /* ---- programların kullandığı işlevler ---- */
  window.gaOzet = function(o){
    if(!o||APP==='ana')return;
    var all = rd('ga_ozet',{}), cur = all[APP]||{};
    ['bitti','etiket','d','y','kart'].forEach(function(f){ if(o[f]!==undefined) cur[f]=o[f]; });
    if(o.yer){ cur.yer = o.yer; cur.t = Date.now(); }
    all[APP] = cur; wr('ga_ozet', all);
    if(o.aktif){ var g = rd('ga_gunler',[]), b = gun(Date.now()); if(g[g.length-1]!==b){ g.push(b); wr('ga_gunler', g.slice(-120)); } }
  };
  window.gaAltGizle = function(b){ try{ document.documentElement.classList.toggle('gab-off', !!b); }catch(e){} if(b) close(); };

  /* ---- çubuk ---- */
  var bar=document.getElementById('gab'), sh=document.getElementById('gabSheet'), dim=document.getElementById('gabDim'),
      T=document.getElementById('gabT'), B=document.getElementById('gabB');
  function setH(){ try{ document.documentElement.style.setProperty('--gab-h', (bar.offsetHeight||84)+'px'); }catch(e){} }
  setH(); addEventListener('resize', setH);
  // Meal düğmesindeki "YENİ" etiketi 4 Aralık 2026'ya (10 gün) kadar görünür, sonra kendiliğinden kalkar.
  try{ if(Date.now() < Date.parse('2026-12-04T00:00:00+03:00')) document.getElementById('gabYeni').hidden=false; }catch(e){}
  var base = APP==='ana' ? 'ana' : (APP==='meal' ? 'meal' : 'dersler'), openK = null;
  function mark(){ [].forEach.call(bar.querySelectorAll('.gab-b'), function(b){ b.classList.toggle('on', b.dataset.k === (openK||base)); }); }
  mark();

  var pushed=false, closing=false;
  function open(k){
    openK = k; mark();
    if(k==='dersler'){ T.textContent='Dersler'; B.innerHTML=dersler(); }
    else { T.textContent='Karnem'; B.innerHTML=karne(); }
    sh.scrollTop=0; sh.classList.add('open'); dim.classList.add('open'); setH(); kilit(true);
    if(!pushed){ try{ history.pushState(Object.assign({}, history.state, {gab:1}), ''); pushed=true; }catch(e){ pushed=false; } }
  }
  function close(){
    if(!sh.classList.contains('open')) return;
    sh.classList.remove('open','full','gab-anim'); sh.style.transform=''; dim.classList.remove('open'); openK=null; mark(); kilit(false);
    if(pushed){ pushed=false; closing=true; try{ history.back(); }catch(e){ closing=false; } }
  }
  // Geri hareketi önce pencereyi kapatsın; programın kendi gezinmesine geçmesin
  addEventListener('popstate', function(e){
    if(closing){ closing=false; e.stopImmediatePropagation(); return; }
    if(sh.classList.contains('open')||pushed){ sh.classList.remove('open','full','gab-anim'); sh.style.transform=''; dim.classList.remove('open'); openK=null; mark(); kilit(false); pushed=false; e.stopImmediatePropagation(); }
  }, true);
  // Pencere açıkken arkadaki sayfa kaymasın (iPhone kaydırmayı arkaya geçiriyordu)
  var kY=0;
  function kilit(on){ try{ document.documentElement.classList.toggle('gab-lock', !!on); }catch(e){} }
  // Üstteki çizgiden (ya da başlıktan) tutup sürükleme: aşağı çekince kapanır, yukarı çekince büyür.
  // Pencere en baştayken içerikten aşağı çekmek de pencereyi sürükler (iPhone'daki gibi).
  var drag=null;
  sh.addEventListener('touchstart', function(e){
    kY=e.touches[0].clientY;
    drag={y:kY, t:Date.now(), tut:!!(e.target.closest('.gab-grab,.gab-hd') && !e.target.closest('.gab-x')), on:false, dy:0};
  }, {passive:true});
  document.addEventListener('touchmove', function(e){
    if(!sh.classList.contains('open')) return;
    if(!sh.contains(e.target)){ e.preventDefault(); return; }
    var dy=e.touches[0].clientY-kY;
    if(drag && (drag.on || drag.tut || (sh.scrollTop<=0 && dy>0))){
      e.preventDefault(); drag.on=true; drag.dy=dy;
      sh.classList.remove('gab-anim');
      sh.style.transform='translateY('+(dy>0 ? dy : dy/4)+'px)';
      return;
    }
    var ust=sh.scrollTop<=0, alt_=sh.scrollTop+sh.clientHeight>=sh.scrollHeight-1;
    if(sh.scrollHeight<=sh.clientHeight || (ust&&dy>0) || (alt_&&dy<0)) e.preventDefault();
  }, {passive:false});
  function birak(){
    if(!drag||!drag.on){ drag=null; return; }
    var d=drag.dy, hiz=d/Math.max(1,Date.now()-drag.t); drag=null;
    sh.classList.add('gab-anim');
    if(d>120 || (d>40 && hiz>0.6)){ sh.style.transform='translateY(100%)'; setTimeout(close,180); return; }
    if(d<-40) sh.classList.add('full');
    else if(d>40) sh.classList.remove('full');
    sh.style.transform='';
  }
  sh.addEventListener('touchend', birak); sh.addEventListener('touchcancel', birak);
  dim.onclick=close; document.getElementById('gabX').onclick=close;
  addEventListener('keydown', function(e){ if(e.key==='Escape') close(); });
  function gitUrl(u){ close(); setTimeout(function(){ location.href=u; }, 30); }

  bar.addEventListener('click', function(e){
    var b=e.target.closest('.gab-b'); if(!b) return;
    var k=b.dataset.k;
    if(k==='ana'){ if(APP==='ana'){ e.preventDefault(); if(openK) close(); scrollTo({top:0,behavior:'smooth'}); } return; }
    if(k==='meal'){ if(APP==='meal'){ e.preventDefault(); if(openK) close(); if(window.mlBasa) mlBasa(); } return; }
    e.preventDefault();
    if(k==='devam'){ devam(); return; }
    if(openK===k) close(); else open(k);
  });
  B.addEventListener('click', function(e){
    if(e.target.closest('[data-cur]')){ e.preventDefault(); close(); return; }
    var a=e.target.closest('[data-u]'); if(a){ e.preventDefault(); gitUrl(a.dataset.u); }
  });

  function sonYer(){ // en son çalışılan yer; bulunduğunuz programın dışındakiler önce
    var all=rd('ga_ozet',{}), L=[];

<script>
const UNITELER = [{"t":"İslam Mezhepleri Tarihine Giriş","intro":"Mezhepler tarihinin tanımı, konusu, amacı, metodu ve diğer ilimlerle ilişkisi; mezhep, fırka, milel-nihal, makâlât kavramları; mezhep olmanın ölçütleri, tasnifler ve 73 fırka hadisi; ilk ihtilaflar ve mezheplerin doğuş sebepleri.","s":[{"h":"Tanımı, Konusu, Amacı ve Metodu","b":[{"k":"p","x":"**1. Tanımı:** İslam Mezhepleri Tarihi kavramı **\"İslam, mezhep ve tarih\"** şeklinde üç terimden meydana gelmektedir."},{"k":"li","x":"**İslam**: Allah'ın, son peygamber Hz. Muhammed vasıtasıyla insanlara gönderdiği Kur'an merkezli ilahî dinin adıdır."},{"k":"li","x":"**Mezhep:** Gidilen yol, benimsenen görüş ve anlayış, farklı tutum ve davranış demektir. Kelimenin bu bilim dalında \" dinin anlaşılması, algılanması ve hayata uygulanması ile alakalı görüş, yorum ve yaklaşım farklılıklarının zamanla kurumsallaşmış yapılarını ifade eder.\""},{"k":"li","x":"**Tarih:** Takvim bilgisi ve hikâye (history) anlamına gelmektedir. Tarih, toplumları ve milletleri etkileyen olayları, birbiriyle ilişkileri ve sonuçları açısından bir sistem içerisinde inceleyen bilim dalının adıdır."},{"k":"p","x":"Bu açıklamalara göre mezhep ve tarih terimlerinin bir araya getirilmesi ile oluşan **\"mezhepler tarihi\"** kavramını, \"toplumların tarihinde meydana gelen fikir ve düşünce akımlarından bahseden bir bilim dalı\" olarak tanımlayabiliriz."},{"k":"p","x":"Mezheplere dair bilgiler erken dönem İslam kaynaklarında yer bulmuştur. Bu kaynaklarda **mezhep**, **fırka**, **makâlât** gibi sahaya ait terimler tanımlansa da bir bilim dalı olarak tanımlanması çok sonradır. Bu tanımlardan bazıları şöyledir:"},{"k":"li","x":"**Taşköprüzâde (ö. 968/1561)**: \" Dini inançlarla alakalı sapkın mezhep ve görüşleri nakleden bir ilimdir.\" Taşköprüzâde bu tanımında belli bir mezhebi esas almış diğerlerini sapkın diye itham ederek savunmacı bir metotla meseleye yaklaşmıştır. Bu tanım, bu bilim dalının sadece sapkın gruplar ve onların fikirleriyle meşgul olduğunu düşündüreceğinden günümüz mezhepler tarihi metoduna uygun değildir."},{"k":"li","x":"**Ethem. Ruhi Fığlalı**: \"İslam düşüncesinin veya \"fırkalaşma\" faaliyetlerinin gelişme seyrini göstermeyi esas alan bir bilim dalıdır.\""},{"k":"li","x":"**Hasan Onat**: \"Siyasi ve itikadi gayelerle vücut bulmuş “İslam'ın Düşünce Ekolleri\" diyebileceğimiz beşeri oluşumları, bilimsel yöntemlerle inceleyen bir bilim dalıdır.\""},{"k":"li","x":"**Sönmez Kutlu**: \"Geçmişte ve günümüzde siyasi ve itikadi gayelerle vücut bulmuş İslam Düşünce Ekolleri diyebileceğimiz beşerî ve toplumsal oluşumların; doğdukları ortamı, doğuş sebeplerini, teşekkül süreçlerini, fikirlerini, mensuplarını, edebiyatını, yayıldığı bölgeleri, İslam düşüncesine katkılarını kendi eserlerinden hareketle zaman-mekân bağlamında ve fikir- hadise irtibatı çerçevesinde betimleyici bir metotla ve tarafsız bir gözle inceleyen bir bilim dalıdır.\""},{"k":"h","x":"Tanımlardan çıkan önemli notlar"},{"k":"li","x":"Konusu siyasi ve itikadî düşünce ekolleridir. Fıkhi veya amelî ekoller değil."},{"k":"li","x":"Sadece tarihte olmuş-bitmiş ekollerle sınırlandırılamaz.Günümüzde yaşayan mezhepleri, yeni teşekkül eden fikir hareketleri ve zümreleşme faaliyetleri de bu sahaya dâhildir."},{"k":"li","x":"Tanımlardan bazısına göre mezhepler **\"beşeri ve toplumsal oluşumlar\"** olarak tanımlanmaktadır. Bununla mezheplerin ilahî kaynaklı olmadıklarına ve dinin yegâne temsilcileri olarak görülemeyeceklerine vurgu yapılmıştır. Bu itibarla hiçbir mezhep İslam dini ile aynileştirilemez, dinin kendisi yerine konulamaz."},{"k":"li","x":"Tarafsız olması gereken bir bilim dalıdır."},{"k":"p","x":"**2. Konusu:** Geçmişten günümüze kadar Müslüman toplumların içinde zuhur eden itikadî ve siyasi mezheplerdir. Bundan dolayı bir mezhep incelenirken hangi konulara dikkat edilmesi gerektiğini bilmek gerekir:"},{"k":"p","x":"**a- Mezheplerin İsimlendirilmesi Meselesi:** Bir mezhep isminin ilk defa kimler tarafından, ne zaman ve hangi maksatla kullanıldığı; söz konusu ismin ilgili grup tarafından benimsenip benimsenmediği; ismin tarihî süreçte ne tür anlamlar kazandığı vb. hususlar açıklanması gereken konulardır. Haricilik gibi."},{"k":"p","x":"**b- Mezheplerin Doğuş Sebepleri:** Zümreleşme hareketlerinin hangi ortamda ve niçin ortaya çıktıkları meselesi araştırılması ve cevaplandırılması gerekir. Mezhepleri içinde doğdukları dini, tarihî, sosyal, kültürel vb. sebeplerden soyutlayarak anlamak mümkün değildir."},{"k":"p","x":"**c- Mezheplerin Teşekkül Süreci:** Mezheplerin doğuş zamanı ve geçirdiği evreleri ile \"ne zaman ve nasıl\" sorularına cevap aranmalıdır."},{"k":"p","x":"**d- Mezheplerin Nerde Doğdukları ve Hangi Bölgelerde Yayıldıkları Hususu**: Doğduğu yerin tespit edilmesi ile mezhebin kültürel ve toplumsal arka planı hakkında daha sağlıklı bilgi edinilmiş olur. Çünkü coğrafi şartlar insanların dünya görüşlerini ve fikir yapılarını etkilediği gibi, eski inanç ve kültürler de aynı derecede görüş ve fikirlerin oluşumun da etkilidirler. Öte yandan bazı mezhepler ortaya çıktıkları bölgede değil de farklı cografyalarda yaygınlık kazanmış olabilir. Mürcie mezhebinin mevali arasında taraftar bulması ve özellikle Maveraünnehir bölgesinde yaygınlık kazanması gibi."},{"k":"p","x":"**e- Mezheplerin Kiminle Başladığı Hususu:** Mezhebin kurucusu kabul edilen kişinin hangi ırka veya soya mensup olduğu, mevali olup olmadığı, ilk destekçilerinin kimler olduğu gibi hususları önemlidir. Dikkat edilmesi gereken diğer bir husus da, bazı zümreleşme hareketlerinin kurucu şahıslardan ziyade fikir merkezli olarak teşekkül etmesidir. Mürcie, Şia ve Ehl-i Sünnet ekolleri gibi."},{"k":"p","x":"**f- Mezhebin Temel Fikirleri ve Kavramları**: Mezheplerin temel görüşlerini ortaya çıkarmakla onların iskeletlerini de ortaya çıkarmış oluruz. Örneğin insanın özgür olmasını amaçlayan Mu'tezile'nin diğer bütün görüşleri bu ana esasa uygun bir tarzda düzenlenmiştir."},{"k":"p","x":"**g- Mezheplerin Yazılı Kaynakları ve Çağdaş Araştırmalar**: Bir mezhebin birinci el kaynakları ve edebiyatının neler olduğunu bilmek, bunların neşir durumu ve güvenirlilikleri hakkında fikir sahibi olmak mezhepler tarihçisinin önünde duran önemli bir sorundur. Öte yandan bir mezhep incelenirken çağdaş yayınlara ve akademik çalışmalara da yer verilmelidir. Ayrıca söz konusu mezhebe yöneltilen eleştiriler ve aleyhlerinde yapılan çalışmalar da araştırmacılara yardımcı olacaktır."},{"k":"p","x":"**h- Mezheplerin Fırkalara Ayrılması**: Mezhep içindeki parçalanmaların sebeplerini araştırıp ortaya koymak en temel konulardan biridir."},{"k":"p","x":"**i- Diğer Mezheplerle ilişkiler**: Belli bir mezhebe ait bir görüşün oluşmasında diğer mezheplerin etkisinin olduğu inkâr edilemez. Mezheplerarası polemik konularının tespit edilmesi mezhebin hangi görüşe ehemmiyet verdiğini ortaya koyacaktır."},{"k":"p","x":"**j- Mezheplerin Günümüzdeki Durumu**: Yaşayan bir mezhebin farklı coğrafyalardaki uygulamalarını tespit etmek, zamanla oluşan farklılıkların sebeplerini irdelemek, hangi ülkede ne kadar mensubu olduğunu belirlemek, bunların dini yaşantı ve anlayışlarını ortaya koymak da önemlidir."},{"k":"p","x":"**k- Mezheplerin İslam Düşüncesine Katkıları**: İslam tarihinde ortaya çıkan ekollerin Müslümanların düşünce dünyasına olumlu ya da olumsuz birtakım katkısının olduğunda şüphe yoktur. Örneğin Harici düşüncenin İslam düşüncesine kazandırdığı en önemli kazanım, devlet başkanının seçimle başa gelmesi fikridir. Haricilik düşüncesi araştırılırken konunun bu yönüne dikkat çekilmesi bir hakşinaslık olacaktır."},{"k":"h","x":"3. Amacı"},{"k":"li","x":"Mezheplerin ortaya çıkış süreçlerini incelemek; hangi şart ve ortamlarda ne tür fikirlerin doğup geliştiğini tespit edebilmektir. Böylece dinin farklı anlaşılmasının sebeplerini tespit edip niçin bu şekilde anlaşıldığını izah etmektir."},{"k":"li","x":"Fırkaların doğuş sebeplerini ve siyasetle ilişkilerini, ortaya çıktıkları toplumun dinî ve siyasi hayatını ne yönde ve nasıl etkilediklerini aydınlatmayı amaçlar. Bunu yaparken kendi mensuplarına pratik bir fayda sağlamayı da hedefler."},{"k":"li","x":"Sağlıklı ve güçlü bir İslam toplumu oluşturmak için geçmişte vuku bulan hadiseleri olumlu ve olumsuz yönleri ile doğru bir şekilde anlamamızı, geçmişte vuku bulan olumsuz hadiselerden ibretler alarak sağlıklı bir İslam toplumu oluşturmayı, hataya düşülen konuları dikkatlere sunarak benzer hataların işlenmesini en aza indirmeyi amaçlar."},{"k":"li","x":"Mezhebi farklılıkların din yerine ikame edilemeyeceğini öğretecektir. Zira mezhepler, beşeri oluşumlar olup belli bir dönem ve mekânda dinin anlaşılması ve hayata uyarlanmasından ibarettirler."},{"k":"h","x":"4. Metodu"},{"k":"li","x":"Bilimsel araştırma yöntemini kendine rehber edinen bu bilim dalı, **\"Betimleyici / Deskriptif Metodu\"** araştırmalarında esas almaktadır. Önyargılardan uzak bir şekilde tarafsız olmaya çalışmak, anlamaya ve tanımaya gayret etmek ve bilimsel bir bakış ortaya koymak onun metodunu oluşturmaktadır."},{"k":"li","x":"Bu itibarla, mezheplerin kabul ettiği görüş ve fikirlerin yanlış ya da doğruluğunu araştırmak ya da diğer mezheplere göre batıla/küfre düştüklerini ileri sürmek değil, ancak var olanın bir resmini çizmektir."},{"k":"li","x":"Erken dönem mezhepler tarihi kaynaklarında ortaya konulan metot farklıdır. Klasik kaynaklarda mezheplerin ortaya çıkış şartlar göz ardı edilmiş ve çoğu defa mezhepler bir süreçten ziyade bir kişi veya bir fikirle başlatılmıştır. Eserlerin pek çoğu karşıt gördüğü mezhep ya da fikrî reddetmek veya kendi görüşünün doğruluğunu savunmak amacıyla kaleme alınmıştır. Çoğu defa normatif bir yaklaşımla muhalif mezhepler fırka-i dalle, ehl-i bid'at vb. ithamlara ma ruz kalmışlardır."},{"k":"li","x":"Tarihî araştırmalar, geçmişte yaşanılan olaylardan geriye kalan kalıntılar, vesikalar ve materyaller üzerinden yapılır. Mezhepler zuhur ettikleri ortamın şartlarından bağımsız olarak ortaya çıkmış değillerdir. Bu itibarla, ekollerin büyüyüp yayılmasında veya yok olmasında, fikirlerindeki sertlik ya da yumuşaklığın nedenlerini yaşadığı dönem şartları içerisinde aramak gerekir."},{"k":"li","x":"Tarihin belli bir döneminde oluşan ve anlam yüklenen kavramların zaman içerisinde anlam daralmasına ya da genişlemesine maruz kalması, hatta tam zıt anlamlara bürünmesi hususu da önemlidir. Bu itibarla, mezhepleri ortaya çıktıkları dönem, mekân ve sosyo-kültürel yapı dikkate alınarak değerlendirmek gerekir."},{"k":"li","x":"Kaynaklarda verilen bazı bilgiler zaman zaman abartılmış veya uydurulmuş olabilir. Bu durumda fikirlerin tarihî gerçeklerle karşılaştırılarak test edilmesi gerekir. Biz buna **\"fikir- hadise irtibatı\"** demekteyiz. Bundan maksat, bir fikrin veya inancın varlığı ile sosyal, siyasi, ekonomik ve dini hadiselerde bu fikrin tezahürlerinin \" **zaman-mekân bağlamı\"** göz önünde bulundurularak tespit edilmesidir. Bir mezhebin tarih sahnesine çıkmasında etkili olarak gösterilen hadiselerle o mezhebi diğer mezheplerden farklı kılan ilk fikirleri ve onun etkilerini araştırarak bu ikisi arasında bir ilişkinin var olup olmadığını ya da fikrin o hadisenin sebebi olup olmadığını ortaya koymak gerekir."},{"k":"h","x":"5. Diğer Bilim Dallarıyla İlişkisi"},{"k":"h","x":"Mezhepler Tarihi - Kelam İlişkisi"},{"k":"li","x":"İlk dönem mezhepler tarihi bilginlerinin hemen hepsi kelamcıdır. Sıkı bir ilişki var."},{"k":"li","x":"Kelam ilmi, konularına göre mezheplerin görüşlerini incelerken, İMTB, mezheplere ait fikir ve görüşlerin ortaya çıkış süreçlerini mercek altına alır."},{"k":"li","x":"Her iki ilmin kullandığı kaynaklar büyük ölçüde benzerlik gösterir."},{"k":"li","x":"Kelam ilmi savunmacı bir anlayışla meseleleri ele alır. İMTB tasvirî anlatımı esas alır"},{"k":"li","x":"Kelam ilminin yargılayan ve hüküm veren bir yönü vardır; mezhepleri ehl-i hak, ehl-i dalal, fırka-i nâciye vb. şekiller de sınıflandırır ve kendisince dinî konumlarını belirler. İMTB'nin böyle bir hedefi yoktur."},{"k":"h","x":"Mezhepler Tarihi - İslam Tarihi İlişkisi"},{"k":"li","x":"İslam Tarihi, İslam'ın doğuşundan günümüze kadar Müslüman topluluklarının tarihî ve siyasi olaylarını inceler. İMTB tarihî süreçte İslam toplumlarında meydana gelen siyasi ve itikadi gruplaşma hareketlerini inceler. Bu sıkı ilişkiyi; İslam tarihi Müslüman toplumların kurduğu devletlerin tarihini, İMTB ise Müslüman toplumlarda fikrî ve siyasi ayrılıkların sonunda ortaya çıkan gruplaşmaların tarihini inceler, şeklinde özetleyebiliriz."},{"k":"h","x":"Mezhepler Tarihi - Dinler Tarihi İlişkisi"},{"k":"li","x":"İlk dönem dinler tarihi çalışmaları mezhepler tarihçileri tarafından yürütülmüştür."},{"k":"li","x":"Bazı Müslüman araştırmacılar, sadece İslam toplumunda ortaya çıkan grup ve mezhepleri incelemekle kalmamış aynı zamanda temasta oldukları diğer din ve mezhepler hakkında da bilgiler vermişlerdir. İbn Hazm ve Şehristânî gibi."},{"k":"li","x":"Mezheplerin ortaya çıkışında etkili olan pek çok faktörden biri de önceki din ve kültürlerin etkileridir. Bu itibarla, mezhepler tarihi araştırmacısı, bir mezhebin kökenini araştırırken önceki din ve inançları da irdelemek zorundadır."},{"k":"li","x":"Bu iki bilim dalı, takip ettikleri yöntem açısından betimleyici bir yöntem kullanmaktadır."}]},{"h":"Mezhep Olmanın Kriterleri ve Mezheplerin Tasnifi Meselesi","b":[{"k":"p","x":"**1. Mezhep Olmanın Bazı Kriterleri:** İslam âlimleri bir fikir hareketinin veya siyasi çıkışın mezhep sayılabilmesi için bazı şartlar taşıması gerektiğini ileri sürmüşlerdir:"},{"k":"li","x":"**İbn Hazm (ö. 456/1064)**: Tevhid, kader, iman-küfür, imamet ve ashabın fazileti meseleleri başta olmak üzere söz konusu grubun bu dört temel konuda farklı bir görüş ortaya koymasının gerekliliğini belirtmiştir."},{"k":"li","x":"**Şehristânî (0.548/1155)**: \".....Tartışmasız bilinen bir husustur ki, herhangi bir meselede birbirinden farklı bir düşünce (makale) ile ayrılan her kimse ayrı bir makale sahibi sayılmaz. Usul ve ana kaideler hükmünde olan meselelerde bir ölçü tespit edilmelidir ki, buradaki farklı düşünce makale, bu düşünceye yönelen kimse de makale sahibi sayılabilsin.\" **Şehristani bunu dört kaide ile sınırlandırır**. Ona göre ümmetin imamlarından biri, bu belirtilen konularda bir makale (farklı düşünce) ile diğerlerinden ayrıldığı takdirde onun farklı görüşünü mezhep, cemaatini ise fırka olarak kabul ederiz. Sadece bir meselede farklı düşünce ileri sürmüş olmak mezhep olmak için yeterli değildir. **Birinci Kaide**: Tevhid ve sıfatlar konusu. Bu konu, ümmetten bir cemaatin kabul ve ispat ettiği, diğer bir cemaatin reddettiği ezeli sıfatları, zatî ve fiilî sıfatların beyanını, Allahu için vacip, caiz ve mümteni olan hususları kapsar. Bu konularda Eş’ariyye, Kerramiyye, Mücessime ve Mu'tezile arasında birbirine zıt düşünceler mevcuttur."},{"k":"p","x":"**İkinci Kaide:** Kader ve adalet konusu. Bu konu kaza, kader, cebir, kesb, gibi bazılarının kabul ettiği, bazılarının ise reddettiği konuları ihtiva eder. Bu konularda Kaderiyye, Neccariyye, Cebriyye, Eş'ariyye ve Kerramiyye arasında birbirine karşı zıt düşünceler mevcuttur."},{"k":"p","x":"**Üçüncü Kaide**: Va'd, vaid, esmâ ve ahkam konuları. Bu konular iman, tövbe, vaid, ircâ, tekfir, tadlîl gibi bazılarının kabul ettiği, bazılarının ise reddettiği konuları ihtiva eder. Bu hususlarda Mürcie, Vaidiyye, Mu'tezile, Eş'ariyye ve Kerramiyye arasında birbirine karşı zıt düşünceler mevcuttur."},{"k":"p","x":"**Dördüncü Kaide**: Sem', akıl, risalet ve imamet konuları. Bu konular hüsün-kubuh, salah- aslah, lütuf, ismet sıfatı, imamet şartlarıdır. Bu hususlarda Şia, Hariciler, Mu'tezîle, Kerramiyye ve Eş'ariyye arasında görüş ayrılıkları bulunmaktadır."},{"k":"p","x":"Şu hâlde Şehristânî'ye göre \"bir kimsenin bütün kelami konularda mevcut görüşlerden farklı olarak ileri sürdüğü görüşler toplamına mezhep; bu konularda kendisine uyanlara da firka denir. İstisnai fikirler ise müstakil mezhep sayılmaksızın o mezhep içinde furua dâhil edilmiştir.\""},{"k":"p","x":"Şehristâni'den hareketle siyasi ve itikadî bir hareketin özgün bir mezhep kabul edilebilmesi için şu özelliklere sahip olması gerekir:"},{"k":"p","x":"**1. Sistemli bir teolojisinin olması**: Siyasi ve itikadî mezhepler, tarihî süreçte Müslümanların karşılaştıkları dinî, siyasi ve itikadî köklü problemler üzerinde sistematik ve tutarlı fikirlerden oluşan bir nazariye geliştirmek suretiyle kurumsallaşmalıdırlar. Aksi takdirde kurumsallaşmış başka bir fırkanın alt grubu olmaya mahkum olurlar."},{"k":"p","x":"**2. Yazılı bir edebiyatının olması:** Mezheplerin, ortaya koyduğu sistemi ele alan temel eserler bırakmış olması gerekir. Çünkü bu eserler toplumsal yapıyla birlikte devamlılık kazanacağı gibi, görüşlerinin insicamlı ve tutarlı olmasıyla da katkı sağlayacaktır."},{"k":"p","x":"**3. Toplumsal boyutunun olması:** Yine bu sistemin sadece kitaplarda kalmaması, tarihî süreçte bir toplum tarafından benimsenip hayata geçirilmiş olması gerekir. Mezhepleri, felsefi ekollerden ayırt eden en önemli özelliklerden biri budur."},{"k":"p","x":"**4. Fıkhî veya ameli boyutunun olması**: Pratik ve ameli konularda belli bir fıkıh mezhebine göre amel etmeleri gerekir. Bazı mezhepler hem teolojisini hem de pratiğini üretirken (Şia, Ehl-i Sünnet, Haricilik) bazıları ise teolojisini üretmekle birlikte fıkıhta başka bir ekolü takip etmiştir (Mutezile, Hanefi'dir)."}]},{"h":"Mezheplerin Sayısı ve Tasnifi","b":[{"k":"li","x":"Mezheplerin sayısı konusunda alimler Hz. Peygamber'den nakledilen \"Yahudi ve Hristiyanlar 71 veya 72 fırkaya ayrılmıştır. Hz. Muhammed'in ümmeti ise 73 fırkaya ayrılacaktır. Bu 73 fırkadan biri kurtuluşa erecek, diğerleri cehenneme gireceklerdir.\" mealindeki hadislerdir."},{"k":"li","x":"Rivayette belirtilen \"yetmiş üç\" ifadesiyle gerçek bir sayının kastedilip edilmediği konusunda bazı alimler, yetmiş üç rakamını hakiki anlamda kabul etmiş (Ebü'l-Hüseyin el-Malatî, Abdülkâhir el-Bağdadî, el-İsferayinî, Şehristânî, Adudüddîn el-Icî) ve özellikle Bağdadi eserinin plan ve muhtevasını buna göre düzenlemiştir. 73 sayısını tutturmak için fırkaların tasnifinde bayağı zahmet çekmiş; bazen tali grupları öne çıkarırken bazen de önemli fırkaları görmezlikten gelme durumunda kalmıştır. Bu itibarla bu alimler fırkaların kendi dönemlerine kadar şekillenip tamamlandığını ve artık yeni fırkaların olmayacağını savunmuş olmaktadırlar."},{"k":"li","x":"Diğer taraftan bu hadisin, kesin bir sayı göstermekten ziyade çokluğu ifade ettiğini ileri süren epeyce alim vardır (Makdisî, İbnü'l-Cevzi, Fahreddin er-Râzî, Celaleddin ed- Devvânî ve Şâtibi). Bunlara göre hadiste geçen \"seb'ûn\" (yetmiş) rakamı kesin bir sayıyı değil çokluğu ifade etmektedir. Kaldı ki, gerek Yahudi ve Hristiyanların gerek Müslümanların tarih içinde zuhur eden firkalarının sayısı, hadiste bildirilen sayının fevkindedir. Ayrıca İslam toplumu var oldukça yeni görüşlerin ve düşüncelerin ortaya çıkması, dolayısıyla fırkalaşmaların devam etmesi kaçınılmaz bir sosyolojik realitedir."},{"k":"li","x":"Yetmiş üç fırka anlayışının bir diğer problemli yönü, bunlardan hangisi ya da hangilerinin kurtuluşa ereceği tartışmasıdır. Çünkü kurtuluşa ereceği belirtilen fırkanın kimliği ve özellikleri mezhepten mezhebe veya alimden âlime değişiklik göstermektedir."},{"k":"li","x":"Goldziher (1850-1921)'e göre ise, söz konusu hadisteki sayı gerçek sayıyı bildirmez. Hz. Muhammed (sav), bu sözleriyle İslamiyet'in Yahudilik ve Hristiyanlığa nispetle daha çok meziyetlere sahip olduğunu ifade etmek istemiştir."},{"k":"p","x":"**3. Mezheplerin Tasnifi Meselesi:** İslam dünyasında ortaya çıkan mezheplerin farklı şekillerde tasnif edildiklerini görmekteyiz. Bunları şöylece özetleyebiliriz:"},{"k":"p","x":"**1. Tematik tasnifler:** İslam mezhepleri temel konuları itibarıyla itikadî, siyasi ve ameli/fıkhi olmak üzere üç grupta mütalaa edilmiştir. Biz aşağıda bunu esas alıyoruz."},{"k":"p","x":"**2. Kronolojik tasnifler:** Mezheplerin ortaya çıkış tarihi dikkate alınarak kronolojik tasnifler yapılmıştır. Örneğin, Neybahtî'nin Fıraku'ş-Şia'sı ile Kummi'nin el-Makalat ve'l-Fırak'ı imamet tartışmaları çerçevesinde Hz. Ali'den itibaren her imamın vefatından sonra ortaya çıkan grupları tarihî süreci esas alarak ayrıntılarıyla açıklamaktadırlar."},{"k":"p","x":"**3. Şematik tasnifler**: \"İftirak hadisi\" diye bilinen rivayetlere dayanan 73'lü tasniflerdir Bağdadi'nin el-Fark'ı örnektir."},{"k":"p","x":"**4. Alfabetik tasnifler:** Mezheplerin isimleri dikkate alınarak alfabetik olarak yapılan tasniflerdir."},{"k":"p","x":"**a) Siyasi Mezhepler:** Bir mezhebin teşekkül sürecinde siyasi faktörler belirleyici olmuş ise, bu zümreleşme faaliyetini Siyasi İslam Mezhebi şeklinde isimlendirmek mümkündür"},{"k":"li","x":"**Hariciler**, Hakem Olayı sonrasında Hz. Ali ve Hz. Muaviye'nin ve destekçilerinin küfre düştüğünü ileri sürmüş, hem Hz. Ali'ye karşı hem de Emevîlere karşı siyasi mücadele içinde olmuşlardır."},{"k":"li","x":"**Şia**, Hz. Ali'nin yanında yer alan Müslümanların haklılığını savunan ve Ehl-i Beyt'in üstünlüğünü iddia eden, ilk başlangıçta siyasi bir hareket olan ancak zamanla inanç ve fikhî yönünü de geliştiren siyasi bir mezheptir."},{"k":"li","x":"**Mürcie**, ihtilaflardan uzak durmaya çalışan, büyük günah sahiplerinin durumunu Allah'a havale eden ve bu durumu ahirete irca eden gruptur."},{"k":"li","x":"**Mu'tezîle** ise büyük günah işleyenlerin tövbe etmeden ölmeleri hâlinde cehennemlik olduklarını savunmuştur."},{"k":"p","x":"**b) İtikadi Mezhepler:** Dinin inançla alakalı temel konularında ortaya çıkan ihtilaflar sonucunda teşekkül eden fırkalara itikadî mezhepler denilmektedir."},{"k":"li","x":"**Kaderiyye**, Müslümanlar arasında ortaya çıkan siyasi karışıklıklar, Cemel ve Sıffin savaşlarının sonuçları, Emevîlerin bazı uygulamalarını kadere yüklemeleri gibi sebeplerle Ma'bed el-Cühenî ve Gaylân ed-Dimeşki'nin önderliğinde iradi fiillerin kadere yüklenemeyeceği düşüncesi etrafında doğmuş ve II. (VIII.) yüzyılın ortalarına doğru paralel görüşlere sahip olan **Mu'tezile** ile birleşmiştir. Vâsıl b. Ata (ö. 131/748), büyük günah işleyen bir kimsenin dini konumuyla alakalı görüşü sebebiyle Hasan-i Basri'den (ö. 110/728) ayrılmış ve kendi görüşlerini yaymaya başlamıştır."},{"k":"li","x":"**Mürcie,** Harici mantığına karşı mutedil bir anlayışın taraftarı olmuşlar, zamanla etkin bir duruma gelmişlerdir. Bu fırka, çok geçmeden Ehl-i Sünnet'in Maturidiyye geleneği içinde erimiştir."},{"k":"li","x":"Ehl-i Sünnet'in **Selefiyye**, **Eş'a riyye** ve **Maturidiyye** kolları mezhebi bakış açıları farklı olmakla birlikte kendileri dışındaki mezhepleri bid'at ehli kabul etmiş, bununla beraber ehl-i kıble olduklarını dikkate alarak hiç bir zaman İslam'ın dışına itmemiş ve tekfir etmemiştir."},{"k":"p","x":"**c) Fıkhî Mezhepler:** Hz. Peygamber (sav)'in vefatından sonra alimler Kur'an ve Sünnet'te doğrudan çözümü bulunmayan bazı meselelerde farklı kanaatler ortaya koydular. Hicri I ve II. yüzyıllarda ulema arasındaki bu farklılaşma temelde iki ekol hâlinde; Hicaziyyûn/Ehl-i Hadis ve Irakiyyûn/Ehl-i Re’y şeklinde kendisini göstermiştir. Buradaki temel farklılık, hüküm istinbat ederken nakle ve re'ye dayanma konusundaki tutumdan kaynaklanmıştır."}]},{"h":"İlk İhtilaflar","b":[{"k":"p","x":"Şehristânî, henüz Hz. Peygamber'in sağlığında zuhur eden birtakım ihtilaflardan söz ederek bunların münafıklar tarafından ortaya atıldığını belirtmiştir."},{"k":"li","x":"\"Ganimetlerin paylaşılması sırasında **Zü'l-Huveysıra,** Hz. Peygamber'e, “Ey Muhammed, adaletli davran, sen adil davranmadın' deyince, Hz. Peygamber; “Ben adil davranmazsam, kim adil davranır?\" karşılığını vermiştir. Zü'l-Huveysıra'nın bu davranışı, Hz. Peygamber'e karşı açık bir isyandı."},{"k":"li","x":"Kur'an'da bildirildiği üzere **Uhud günü** münafıklardan bir grup;“...O zaman bir karar yetkisine sahip mi idik, eğer bir karar yetkimiz olsaydı burada öldürülmüş olmazdık. “..Bizimle kalmış olsalar ölmeyecekler ve öldürülmeyeceklerdi.\" diyerek cebir ve kader düşüncelerini dile getirmişlerdir."},{"k":"p","x":"Şehristânî, Hz. Peygamber'in yaşadığı döneme ait bu ve benzeri olayları delil göstererek Müslümanlar arasında zuhur eden büyük ihtilafların ilk nüvelerine işaret etmektedir. Ancak Hz. Peygamber döneminde her hangi bir fırka ya da fırkalaşma hareketinden söz edilemez. Bu durumun temelde iki önemli sebebi vardır:"},{"k":"p","x":"**1.** İslamiyet'in ana kaynağı olan Kur'an-ı Kerim henüz tamamlanmamıştı."},{"k":"p","x":"**2.** Hz. Peygamber'in dinî ve dünyevi otoritesinin varlığı. Allah Elçisi, Müslümanlar arasında zuhur edecek siyasi ve itikadî ihtilaflara fırsat vermiyor, sahabe ise soruları doğrudan Hz. Peygamber'e sorup ondan kesin cevap alabiliyorlardı."},{"k":"h","x":"1. Hz. Peygamber Döneminde Zuhur Eden İhtilaflar"},{"k":"p","x":"**a. Kalem-Kırtas Hadisesi:** Buhârî ve Müslim'in kaydettiğine göre Allah Elçisi'nin ölüm hastalığı şiddetlendiğinde, “Bana bir divit ve kâğıt getirin de size bir kitap yazdırayım ki, benden sonra şaşkınlığa düşmeyesiniz.\" buyurmuştur. Bunun üzerine orada bulunanlar kendi aralarında tartışmaya başlamışlar; bir kısmı Hz. Peygamber'in emrinin yerine getirilmesini; bir kısmı ise Allah'ın Kitabı ve Resulünün sünnetinin Müslümanlara yeterli olacağı ve hastalığının şiddetinden dolayı Resulullah'ın şuurunun yerinde olmadığı gerekçesiyle kâğıt-kalem getirilmesine gerek olmadığını ileri sürmüştür. Hz. Ömer \" Resulullah'ın ıstırabı arttı, bize Allah'ın kitabı yeter.” deyince gürültüler çoğalmıştır. Bunun üzerine Hz. Peygamber, “Benim yanımdan kalkıp gidiniz, huzurumda tartışmanız uygun değildir.” buyurmuştur. Sonrasında İbn Abbas, \"O ne büyük musibettir ki, Hz. Peygamber'in bizim için yazdıracağı kitaba mani oldu.” demiştir. Bazı kaynaklarda belirtildiği üzere Hz. Peygamber, yanında tartışanları uzaklaştırmış, sonra da vasiyetini sözlü olarak yapmış ve üç hususun gerçekleştirilmesini istemiştir."},{"k":"p","x":"**1.** Arap yarımadasında hiçbir putperestin oturmasına izin verilmemesi"},{"k":"p","x":"**2.** Muhtelif kabileler tarafından gönderilen elçilerin hürmet ve nezaketle karşılanmaları"},{"k":"p","x":"**3.** Ancak ravi üçüncü tavsiyeyi unuttuğunu belirtmiştir."},{"k":"p","x":"Şiî çevreler, ravinin unuttuğu üçünçü tavsiyenin Hz. Ali'nin halife tayin edilmesi olduğunu söylerler. Hatta bazı gruplar, söz konusu ravinin Şia karşıtı olduğundan üçüncü tavsiyeyi kasıtlı olarak nakletmediğini de savunurlar. Ancak, hadisenin seyrinden açıkça anlaşılmaktadır ki, burada bir vahyin yazdırılması isteği yoktur. Çünkü yazdırılmak istenen şayet vahiy olsaydı ashap, bunu orada hazır bulundukları için anlarlar ve bu isteğe asla karşı çıkamazlardı. Bunun vahiy olduğunu söyleyip ama neticede bunun yazdırılmadığını kabul etmek, vahyin tamamlanmadığını ve Hz. Peygamber'in de tebliğini gerçekleştirmediğini iddia etmek olur. Bu olayın o dönemde ashabın gündemini fazlaca meşgul etmediği, bir anlık bir ihtilaf olarak tartışılıp unutulduğu anlaşılmaktadır. Ancak daha sonra Şia bu hadiseyi argüman olarak kullanmıştır."},{"k":"p","x":"**b. Üsâme b. Zeyd Ordusu Meselesi:** Hz. Peygamber (sav) “Üsâme'nin ordusunu hazırlayın, ondan dönene Allah lanet etsin.\" buyurarak, Üsâme b. Zeyd komutasındaki ordunun teçhiz edilmesini ve beklenmeksizin sefere çıkılmasını emretmişti, Ashabın bir kısmı Hz. Peygamber'in emrinin bir an önce yerine getirilmesini isterken, bir kısmı da Hz. Peygamber'in hastalığının iyice ağırlaştığını gerekçe göstererek gidip de geri döndüklerinde onu tekrar görememe endişesiyle seferin bir müddet tehir edilmesini istemişti. Neticede Üsâme ordusu, Hz. Peygamber'in vefatına kadar Medine'de kalmış, Hz. Ebû Bekir'in halife seçilmesinin akabinde onun tarafından sefere çıkarılmıştır."},{"k":"p","x":"Ehl-i Sünnet olayı, Hz. Ebû Bekir'in Efendimizin hatıratına ne denli ehemmiyet verdiğine yorarken, Şia ise Hz. Peygamber'in ordunun bir an önce sefere çıkmasını istemesinde Hz. Ali'nin hilafetinin önünü açma hedefinin olduğunu iddia etmiştir."},{"k":"p","x":"**c. Hz. Peygamber'in Vefatı Hakkında Şüpheye Düşülmesi:** Hz. Peygamber'in vefat ettiği haberi ashab arasında yayılınca birçok Müslüman derin bir üzüntü ve ümitsizliğe kapılmışlardır. Hz. Ömer \"Kim Hz. Muhammed öldü derse onu şu kılıcımla öldürürüm. O, İsa b. Meryem'in göğe çekilişi gibi semaya kaldırılmıştır.” demiştir. Hz. Ebû Bekir, halife olmuş ve hitabında, \"Şüphesiz sen de öleceksin, onlar da ölecekler.” (Zümer 39/30) meâlindeki ayeti okumuş, sonra: “Kim Muhammed'e tapıyorsa şüphesiz Muhammed ölmüştür. Kim de Muhammed'in Rabbine tapıyorsa şüphesiz O hayy'dır, hiç ölmez.\" demiştir. Bunun üzerine orada bulunanlar kendilerine gelmişlerdir."},{"k":"p","x":"Bir kısım Şiiler Hz. Ömer böyle davranarak zaman kazanmış; Müslümanlar bu tartışma ile meşgul iken Hz. Ebû Bekir'in halife seçilmesini temin etmiştir."},{"k":"p","x":"**d. Hz. Peygamber'in Defnedileceği Yer Meselesi**: Bu konuda muhacirler, Resulullah'ın doğup büyüdüğü, peygamber olarak gönderildiğin Mekke'ye; Ensar, hicret ve İslam'ın nusret yeri olması bakımından Medine'ye; bazı sahabe ise birçok peygamberin kabirlerinin bulunduğu yer olması hasebiyle Beytü'l-Makdis'e (Kudüs) defnedilmesini teklif etmişlerdi. Neticede Hz. Ebû Bekir'in “Peygamberler vefat ettikleri yere gömülürler.\" hadisini hatırlatması üzerine Resulullah Hz. Aişe’nin odasına defnedilmiştir. Şia, bu nevi rivayetlerle Hz. Ebû Bekir'e karizma kazandırılmak istendiğini ileri sürmüştür."},{"k":"p","x":"**e. İmamet-Hilafet Meselesi:** Halife, Hz. Peygamber'e siyasi anlamda halef olan, onun tesis ettiği idari yapının sürdürülmesini sağlamak üzere onun yerine siyasal anlamda geçen seçilmiş kişidir. Ancak, daha sonra bu mesele etrafında şekillenecek olan Şia ekolünün konuyu itikadî muhtevada mezhebi bir ilkeye dönüştürmesi üzerine başta Ehl-i Sünnet olmak üzere diğer kelam mektepleri de, Şia'ya cevap için bu meseleyi tartışmışlardır."},{"k":"p","x":"**Olayın özeti şöyledir**: Hz. Peygamber'in vefatından sonra Hz. Ali, Hz. Abbas ve diğer Ehl-i Beyt mensupları Resulullah'ın tekfin ve teçhiz işleri ile meşgul oluyorken, sahabeden Ensar'ın bazı ileri gelenleri Benî Said Sakîfe'sinde toplanıp Resulullah'tan sonra devlet yönetimine kimin geçeceğini kendi aralarında tartışmışlardı. Hazreçliler kendi reisleri Sa'd b. Ubâde üzerinde ittifak edilmesini sağlamışlardı. Durumdan haberdar edilen Hz. Ebû Bekir, yanına Ömer ve Ebû Ubeyde b. Cerrah'ı alarak Ensar'ın toplandığı yere gelmişti. Ensar ile Muhacirler arasında yapılan görüşmeler neticesinde Ensar, kendilerinden Sa'd b. Ubâde'nin hilafetini kabul ettiremeyeceklerini anlayınca, bir emir kendilerinden bir emir de Muhacirlerden olmasını teklif etmişler ancak Hz. Ebû Bekir ve Hz. Ömer, sadece bir yöneticinin seçilmesini ve bunun Kureyş'ten olması gerektiğini ileri sürmüşlerdi: Neticede Hz. Ebû Bekir'in \"İmamlar Kureyş'ten olur.\" hadisini nakletmesi meselenin çözülmesini sağlamıştı. Ensar, halifenin Kureyş'ten olmasına razı olunca Hz. Ömer, Hz. Ebû Bekir'i aday göstererek orada hemen ona biat etmiş, peşinden diğerleri biat ederek Hz. Ebû Bekir'in halife seçilmesi sağlanmıştı. Daha sonra Ebû Bekir mescide gelerek Müslümanların biatını kabul etmiştir. Ancak Hz. Peygamber'in techiz ve defni ile meşgul olan başta Hz. Ali ve diğer Ehl-i Beyt mensupları ile Haşimoğullarından bir cemaat mescitteki biata katılmamıştır. Ancak, kısa bir zaman sonra Haşimoğulları topluca Hz. Ebû Bekir'e biat ettiler ve bu problem böylece halledilmiş oldu."},{"k":"p","x":"Şia, Hz. Ali'nin hakkının gasbedildiğini iddia etmiş ve mezhebi anlayışını bunun üzerine bina etmiştir. Ehl-i Sünnet ise, onlara cevap vermek üzere bu mesele ile ilgilenmiştir. Şayet, konu hakkında Kur'an ve Sünnet'te açık bir beyan bulunsaydı, Müslümanların farklı bir tutum içine girmeleri asla mümkün olmazdı."},{"k":"h","x":"2. Hz. Ebû Bekir'in Hilafet Döneminde Zuhur Eden İhtilaflar"},{"k":"p","x":"**a. Resulullah'ın Mirası Meselesi:** Resulullah'ın (s.a.s.) şahsına ait olan Medine ve Fedek arazisi ile Hayber'deki humus arazilerinin mirasçılarına taksimi ve Hz. Peygamber'in miras bırakıp bırakamayacağı konusunda ashab arasında görüş ayrılığı çıkmıştı. Özellikle Resulullah'ın kızı Hz. Fatıma ile Ali ve Abbas peygamberlerin miras bırakabileceklerine inanıyorlardı. Bu yüzden Resulullah'ın mirasını istemişlerdi. Hz. Ebûbekir ise, “Biz peygamberler miras bırakmayız. Bizden kalanların hepsi sadakadır. Muhammed ailesi bu maldan sadece yiyebilir.\" anlamındaki hadisi delil getirerek bu isteği geri çevirmiş ve Fedek arazisini beytü'l-mala vakfetmiştir Yine Hz. Peygamber'in hanımları da miras istemişler, fakat Hz. Aişe, \" Biz miras bırakmayız. Bizim bıraktığımız şeyler sadakadır.” hadisini hatırlatıp onları vazgeçirmiştir."},{"k":"p","x":"**b. Zekât Vermekten Kaçınanlar Meselesi:** Bazı kabile mensupları zekât vermek istememişlerdi. Hz. Ömer'in de dahil olduğu bir grup, bunların Müslüman olmaları gerekçesiyle onlarla savaşmamak gerektiğini ileri sürerken Hz. Ebû Bekir ve onun görüşünü benimseyenler ise bunlarla savaşmak gerektiğini belirtmişlerdi. Hz. Ebû Bekir \"Allah'a yemin ederim ki namaz ile zekât arasında ayrım yapanlarla mutlaka savaşacağım. Çünkü zekât, malın hakkıdır. Yemin ederim ki Resulullah'a zekât verdikleri halde bana zekât vermekten geri duranlarla savaşacağım.\" diyerek Hz. Ömer'i de ikna etmişti."},{"k":"p","x":"**c.Kur'an'ın Kitap Hâline Getirilmesi Meselesi:** Hz. Ebû Bekir zamanında gerçekleşen Yemâme Savaşı ve diğer bazı savaşlarda hafız sahabilerden bir kısmı şehit olmuştu. Bu durum Hz. Ömer'i son derece endişelendirmiş, Ebû Bekir'e gelerek elde dağınık hâlde çeşitli deri, kemik ve tahta parçalarına yazılı olan Kur'an ayetlerinin hafızlardan oluşturulacak bir komitenin denetiminde toplanarak bir kitap haline getirilmesini teklif etmişti. Hz. Ebû Bekir ise Resulullah'ın böyle bir şey yapmamış olduğunu söyleyerek bundan kaçınmıştı. Fakat diğer sahabenin de Hz. Ömer'in teklifini uygun ve doğru bulmaları üzerine Hz. Ebû Bekir ikna edilmişti."},{"k":"p","x":"Hz. Ebû Bekir, kendisinden sonra Hz. Ömer'in halife olmasını tavsiye etmiş; Müslümanlar da Hz. Ömer'i
